<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>확인 안내</title>
<meta name="theme-color" content="#1b2a52">
<link rel="icon" type="image/png" href="icon-192.png">
<!--
  v154 증명서 진위 확인 화면 닫음 — 교사 선교사를 바깥(로그인 없는 분)에 열 필요가 없어서
  · 예전에 QR이 찍혀 나간 일정 확인서를 찍으면 이 안내만 보인다 (발급 기록은 읽지 않음 · Firebase 연결 없음)
  · 보안 규칙 v42: 진위 기록(certVerify)은 로그인 없이 읽을 수 없음
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f6f4ee}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#1c1f26;word-break:keep-all;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #e4e0d5;border-radius:16px;padding:28px 24px 24px}
.ic{width:44px;height:44px;border-radius:12px;background:#eef0f6;color:#1b2a52;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
h1{font-size:19px;font-weight:800;line-height:1.4;color:#1b2a52}
p{margin-top:10px;font-size:14px;line-height:1.7;color:#4d525c}
.ft{margin-top:18px;padding-top:14px;border-top:1px solid #f0ede5;font-size:12px;color:#8a8f99}
</style>
</head>
<body>
  <div class="card">
    <div class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg></div>
    <h1>온라인 확인은 운영하지 않아요</h1>
    <p>일정 확인서의 내용 확인이 필요하시면, 문서 아래쪽에 적힌 발급 기관 전화로 문의해 주세요.</p>
    <div class="ft">다니엘 아마츠 · 지혜빛 선교원</div>
  </div>
</body>
</html>
