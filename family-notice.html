<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가정통신문 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gd:#1E3932; --gm:#00704A; --gl:#D4E9E2; --gp:#E8F3EF;
  --iv:#F2F0EB; --ivd:#E3E1DA; --tx:#1F2320; --ts:#5A6560; --tl:#93A09A; --wh:#fff;
  --amber:#B45309; --amberp:#FFF4E5; --red:#C0392B; --redp:#FDECEA;
  --sh:0 2px 12px rgba(30,57,50,.08); --r:12px;
}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--iv);z-index:100}
#gate .gbox{text-align:center}
#gate .gtitle{font-size:17px;font-weight:900;color:var(--gd);margin-bottom:8px}
#gate .gsub{font-size:13px;color:var(--ts)}
#gate .gbtn{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;color:#fff;
  background:var(--gd);border-radius:9px;padding:9px 18px;text-decoration:none}
#ms{display:none;flex-direction:column;gap:12px}

.panel{background:var(--wh);border:1px solid var(--ivd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.ptitle{font-size:15px;font-weight:900;color:var(--gd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdesc{font-size:12px;color:var(--ts);margin-top:3px;line-height:1.6}

.btn{font-family:inherit;font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:9px;
  border:1px solid var(--gm);background:var(--gm);color:#fff;cursor:pointer}
.btn.line{background:var(--wh);color:var(--gm)}
.btn.gray{background:var(--wh);border-color:var(--ivd);color:var(--ts)}
.btn.red{background:var(--wh);border-color:var(--red);color:var(--red)}
.btn.sm{font-size:11px;padding:6px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.famtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.famtbl th{background:var(--gd);color:#fff;font-weight:800;padding:8px 9px;text-align:left;font-size:11.5px;white-space:nowrap}
.famtbl td{padding:8px 9px;border-bottom:1px solid var(--iv);vertical-align:middle}
.famtbl tr.rowbtn{cursor:pointer}
.famtbl tr.rowbtn:hover td{background:#FAFAF7}
.famtbl td.c,.famtbl th.c{text-align:center}
.tblwrap{overflow-x:auto;border-radius:9px;border:1px solid var(--ivd)}
.tblwrap .famtbl{min-width:640px}

.pill{display:inline-block;font-size:10px;font-weight:800;border-radius:100px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--gp);color:var(--gm)}
.pill.req{background:var(--amberp);color:var(--amber)}
.pill.gray{background:var(--iv);color:var(--ts)}
.pill.red{background:var(--redp);color:var(--red)}
.pill.blue{background:#E3EDF7;color:#33587D}
.pill.click{cursor:pointer}

/* ═══ 블록 카드 ═══ */
.blk{background:var(--wh);border:1px solid var(--ivd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.blk.internal{border-style:dashed;border-color:#C9C4B8}
.blkhead{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#FAFAF7;
  border-bottom:1px solid var(--iv);flex-wrap:wrap}
.blkhead .bt{font-size:13.5px;font-weight:900;color:var(--gd);flex:1;min-width:120px}
.blkhead .bico{font-size:14px}
.iconbtn{font-family:inherit;font-size:12px;border:1px solid var(--ivd);background:var(--wh);
  border-radius:7px;padding:4px 8px;cursor:pointer;color:var(--ts)}
.iconbtn:hover{border-color:var(--gm);color:var(--gm)}
.iconbtn.danger:hover{border-color:var(--red);color:var(--red)}
.blkbody{padding:12px 14px;font-size:12.5px}
.blkbody .empty{color:var(--tl);font-size:12px;padding:6px 0}

/* 미리보기 안 렌더링 */
.rv-t{white-space:pre-wrap;line-height:1.75;color:var(--tx)}
.rv-red{white-space:pre-wrap;line-height:1.7;color:var(--red);font-size:12px;margin-top:8px}
.rv-kv{width:100%;border-collapse:collapse;font-size:12.5px}
.rv-kv th{width:118px;background:var(--iv);color:var(--gd);font-weight:900;text-align:left;
  padding:8px 10px;border-bottom:2px solid var(--wh);font-size:12px;vertical-align:top}
.rv-kv td{padding:8px 10px;border-bottom:1px solid var(--iv);white-space:pre-wrap;line-height:1.6}
.rv-kv tr:nth-child(even) td{background:#F3F7F4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-tb{width:100%;border-collapse:collapse;font-size:12px}
/* 줄무늬 음영 — 짝수 줄에 옅은 초록빛을 깔아 시선이 줄을 따라가게 한다 (인쇄에도 유지) */
.rv-tb tr:nth-child(even) td{background:#F3F7F4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-tb tr:hover td{background:#EAF2EC}
.rv-tb th{background:var(--gd);color:#fff;font-weight:800;padding:7px 8px;text-align:left;font-size:11px;white-space:nowrap}
.rv-tb td{padding:7px 8px;border-bottom:1px solid var(--iv);white-space:pre-wrap;line-height:1.55;vertical-align:top}
.rv-tb tr.sumrow td{background:var(--iv) !important;font-weight:900}
.rv-tb tr.hlrow td{background:#FFF6BF !important;font-weight:900}
.rv-sch{width:100%;border-collapse:collapse;font-size:11.5px}
.rv-sch th{background:var(--gd);color:#fff;font-weight:800;padding:6px 7px;text-align:center;font-size:11px;white-space:nowrap}
.rv-sch td{border:1px solid var(--ivd);padding:6px 7px;text-align:center;white-space:pre-wrap;line-height:1.45}
.rv-sch td.tm{background:var(--iv);font-weight:800;color:var(--ts);white-space:nowrap;font-size:10.5px}
/* ── 시간 계획 v2: 발행 화면 (시간 비례 카드) ── */
.rv-tg{border:1px solid var(--ivd);border-radius:9px;overflow:hidden;background:var(--wh)}
.rv-tg .tg-hd{display:flex;background:var(--gd)}
.rv-tg .tg-corner{flex:0 0 56px;color:#fff;font-size:10.5px;font-weight:800;text-align:center;padding:7px 0}
.rv-tg .tg-dh{color:#fff;font-size:11px;font-weight:800;text-align:center;padding:7px 4px;border-left:1px solid rgba(255,255,255,.18)}
.rv-tg .tg-bd{position:relative;display:flex}
.rv-tg .tg-axis{flex:0 0 56px;position:relative;background:var(--iv);border-right:1px solid var(--ivd)}
.rv-tg .tg-hl{position:absolute;right:6px;transform:translateY(-6px);font-size:9.5px;font-weight:800;color:var(--ts)}
.rv-tg .tg-cols{flex:1;position:relative}
.rv-tg .tg-line{position:absolute;left:0;right:0;border-top:1px solid var(--iv)}
.rv-tg .tg-card{position:absolute;border:1px solid rgba(30,57,50,.16);border-radius:5px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:1px 3px;box-sizing:border-box}
.rv-tg .tg-tt{font-size:10.5px;font-weight:700;color:#243029;text-align:center;line-height:1.3;word-break:keep-all}
.rv-tg .tg-tm{font-size:8.5px;color:#5A6560;font-weight:600}
.rv-tg .tg-tt{font-size:11px}
.rv-tg .tg-st{font-size:9px;font-weight:600;color:#4a5651;line-height:1.2;text-align:center;word-break:keep-all}
/* ── 시간 계획 v2: 편집 빌더 ── */
.sv-top,.sv-pal{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.sv-pal{background:var(--iv);border-radius:9px;padding:9px 10px}
.sv-lb{font-size:11px;font-weight:800;color:var(--ts);white-space:nowrap}
.sv-tin{width:62px;text-align:center;padding:6px 4px}
select.sv-sel{width:96px;min-width:96px;flex:0 0 auto;padding:6px 6px;font-size:12.5px}
.sv-top{margin-bottom:6px}
.sv-durs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sv-dur{font-size:11px;font-weight:700;border:1px solid var(--ivd);background:var(--wh);color:var(--ts);
  border-radius:100px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.sv-dur.on{background:var(--gm);border-color:var(--gm);color:#fff}
.sv-dots{display:flex;gap:4px}
.sv-dot{width:17px;height:17px;border-radius:50%;border:1px solid var(--ivd);cursor:pointer;box-sizing:border-box}
.sv-dot.on{border:2px solid var(--gm)}
.sv-tray{display:flex;flex-direction:column;gap:6px;min-height:40px;justify-content:center;
  border:1.5px dashed var(--ivd);border-radius:9px;padding:8px 10px;margin-bottom:8px;background:var(--iv)}
.sv-trayhd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--gd);flex-wrap:wrap}
.sv-traylist{display:flex;gap:7px;flex-wrap:wrap}
.sv-trayhint{font-size:11px;color:var(--tl)}
.sv-tcard{font-size:12px;font-weight:700;color:#243029;border:1px solid rgba(30,57,50,.2);border-radius:8px;
  padding:7px 11px;cursor:grab;user-select:none;touch-action:none;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 1px 4px rgba(30,57,50,.10)}
.sv-tcard:active{cursor:grabbing}
.sv-tcttl{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-tcdur{font-size:10px;color:#405249;font-weight:800;background:rgba(255,255,255,.65);border-radius:100px;padding:2px 7px}
.sv-tdel{cursor:pointer;color:var(--red);font-size:10px;font-weight:800}
.sv-tdup{cursor:pointer;color:var(--gm);font-size:11px;font-weight:800}
.sv-ghost{position:fixed;z-index:999;pointer-events:none;font-size:11.5px;font-weight:700;color:#243029;
  border:1px solid rgba(30,57,50,.25);border-radius:7px;padding:5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.92}
.sv-card-ed{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--gp);
  border:1px solid var(--gl);border-radius:9px;padding:8px 10px;margin-bottom:8px}
.sv-wrap{border:1px solid var(--ivd);border-radius:9px;overflow:hidden}
.sv-hd{display:flex;background:var(--gd)}
.sv-corner{flex:0 0 56px;color:#fff;font-size:10.5px;font-weight:800;text-align:center;padding:8px 0}
.sv-dh{display:flex;align-items:center;gap:3px;padding:5px 5px;border-left:1px solid rgba(255,255,255,.18);box-sizing:border-box}
.sv-dh input{flex:1;min-width:0;background:rgba(255,255,255,.12);border:none;border-radius:6px;
  color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:4px 3px;font-family:inherit;outline:none}
.sv-scroll{max-height:calc(95vh - 330px);min-height:340px;overflow-y:auto}
.sv-bd{position:relative;display:flex}
.sv-axis{flex:0 0 56px;position:relative;background:var(--iv);border-right:1px solid var(--ivd)}
.sv-hl{position:absolute;right:6px;transform:translateY(-6px);font-size:9.5px;font-weight:800;color:var(--ts)}
.sv-cols{flex:1;position:relative;touch-action:none;cursor:crosshair}
.sv-gl{position:absolute;left:0;right:0;border-top:1px solid var(--iv);pointer-events:none}
.sv-gl.hr{border-top:1px solid var(--ivd)}
.sv-vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--ivd);pointer-events:none}
.sv-card{position:absolute;border:1px solid rgba(30,57,50,.2);border-radius:5px;overflow:hidden;cursor:grab;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:1px 3px;
  box-sizing:border-box;user-select:none;touch-action:none;transition:box-shadow .1s}
.sv-card.sel{box-shadow:0 0 0 2px var(--gm), 0 4px 12px rgba(0,0,0,.14);z-index:5}
.sv-card.bad{box-shadow:0 0 0 2.5px var(--red), 0 4px 14px rgba(192,57,43,.35);background:var(--redp) !important;z-index:6}
.sv-ctt{font-size:10.5px;font-weight:700;color:#243029;text-align:center;line-height:1.25;word-break:keep-all;pointer-events:none}
.sv-ctm{font-size:8.5px;color:#5A6560;font-weight:600;pointer-events:none}
.sv-ctt{font-size:11px}
.sv-cst{font-size:9px;font-weight:600;color:#4a5651;pointer-events:none;line-height:1.2;
  text-align:center;word-break:keep-all}
.sv-tcst{font-size:10px;font-weight:600;color:#5A6560}
.sv-rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.draftbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--amber);
  background:var(--amberp);border:1px solid var(--amber);border-radius:9px;padding:8px 11px;margin-bottom:10px}
.fnp-wrap{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
  border:1px solid var(--ivd);border-radius:9px;padding:10px}
.fnp-grp{border-bottom:1px dashed var(--iv);padding-bottom:8px}
.fnp-grp:last-child{border-bottom:none;padding-bottom:0}
.fnp-gh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:900;color:var(--gd);cursor:pointer;margin-bottom:5px}
.fnp-cnt{font-size:10.5px;font-weight:700;color:var(--gm);background:var(--gp);border-radius:100px;padding:2px 8px}
.fnp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:3px 8px}
.fnp-it{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer;white-space:nowrap}
.fnp-gd{font-size:9px;font-weight:800;border-radius:6px;padding:1px 4px}
.fnp-gd.m{background:var(--m-bg,#E6F0FB);color:var(--m-tx,#2B6CB0)}
.fnp-gd.f{background:var(--f-bg,#FCE8F3);color:var(--f-tx,#D53F8C)}
.fnp-coop .fnp-gh{color:var(--goldd,#8a6410)}
.fnp-coopbadge{font-size:9.5px;font-weight:800;color:#8a6410;background:#F7EFD8;border-radius:100px;padding:2px 8px}
.fnp-gd.n{background:#EEF0EE;color:#6b756f}
.fnp-gd.gd-edit{cursor:pointer;box-shadow:0 0 0 1px rgba(30,57,50,.12)}
.fnp-gd.gd-edit:hover{box-shadow:0 0 0 1.5px var(--gm)}
.sv-rz::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:22px;height:3px;border-radius:2px;background:rgba(30,57,50,.25)}
.rv-cover{--gold:#B98A2F;--goldl:#D9B871;--serif:'Noto Serif KR',serif;
  border:2px solid var(--gd);border-radius:12px;padding:34px 20px;text-align:center;position:relative}
.rv-cover .cbig{font-family:var(--serif);font-size:27px;font-weight:900;color:var(--gd);
  letter-spacing:3px;line-height:1.45;word-break:keep-all}
.rv-cover .csub{font-size:12px;color:var(--gold);margin-top:10px;font-weight:800;letter-spacing:4px}
.rv-cover .cmeta{font-size:12.5px;color:var(--tx);margin-top:16px;line-height:2}
.rv-cover .clogo{height:52px;max-width:180px;object-fit:contain;display:block;margin:0 auto 14px}
/* 시안 1 — 클래식: 얇은 골드 안쪽 선 */
.rv-cover:not([class*="cv-"])::after{content:'';position:absolute;inset:7px;
  border:1px solid var(--goldl);border-radius:8px;pointer-events:none}
/* 시안 2 — 엘레강스: 이중 테두리 + 장식 */
.rv-cover.cv-elegant{border:1px solid var(--gd);border-radius:3px;padding:9px}
.cv-elegant .cinner{border:1px solid var(--goldl);border-radius:2px;padding:40px 22px 34px}
.cv-elegant .cdeco{font-size:10px;color:var(--gold);letter-spacing:9px;margin-bottom:16px}
.cv-elegant .cbig{font-size:29px;letter-spacing:5px}
.cv-elegant .csub{color:var(--ts);letter-spacing:5px}
.cv-elegant .cdeco-line{width:56px;height:1.5px;background:var(--gold);margin:18px auto;position:relative}
.cv-elegant .cdeco-line::before,.cv-elegant .cdeco-line::after{content:'◆';position:absolute;top:-6px;
  font-size:8px;color:var(--gold)}
.cv-elegant .cdeco-line::before{left:-16px}.cv-elegant .cdeco-line::after{right:-16px}
/* 시안 3 — 밴드: 상단 진초록 띠 */
.rv-cover.cv-band{border:none;border-radius:12px;overflow:hidden;padding:0;
  box-shadow:0 0 0 1px var(--ivd)}
.cv-band .cband{background:var(--gd);display:flex;align-items:center;justify-content:center;
  gap:12px;padding:14px 16px}
.cv-band .cband .clogo{height:34px;margin:0;background:#fff;border-radius:8px;padding:3px 7px}
.cv-band .cband-t{color:#fff;font-size:13.5px;font-weight:800;letter-spacing:3px}
.cv-band .cbody{padding:36px 18px 30px}
.cv-band .cbig{font-size:27px}
.cv-band .cfoot-line{height:6px;background:linear-gradient(90deg,var(--gd),var(--gold),var(--gd))}
.cv-band .cbig{font-size:28px}
.cv-band .csub{color:var(--gold)}
/* 시안 4 — 미니멀: 왼쪽 정렬 + 선 하나 */
.rv-cover.cv-minimal{border:none;border-radius:0;text-align:left;padding:30px 8px 22px}
.cv-minimal .clogo{margin:0 0 16px;height:44px}
.cv-minimal .csub{margin:0 0 6px;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
.cv-minimal .cbig{font-size:30px;line-height:1.25;letter-spacing:0}
.cv-minimal .cline{height:3px;width:96px;margin:20px 0 16px;
  background:linear-gradient(90deg,var(--gd) 60%,var(--gold) 60%)}
.cv-minimal .cbig{font-size:31px}
.cv-minimal .csub{color:var(--gold);letter-spacing:5px}
.cv-minimal .cmeta{margin-top:0}
/* 시안 5 — 그라데이션: 깊은 초록 물결 */
.rv-cover.cv-gradient{border:none;padding:48px 20px;
  background:radial-gradient(ellipse at 50% -10%,rgba(217,184,113,.18),transparent 55%),
    linear-gradient(150deg,#0F2C21,#1E5741 55%,#2d6a4f);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-gradient::before,.cv-gradient::after{content:'';position:absolute;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--goldl),transparent)}
.cv-gradient::before{top:14px}.cv-gradient::after{bottom:14px}
.cv-gradient .cbig{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.cv-gradient .csub{color:rgba(255,255,255,.85)}
.cv-gradient .cmeta{color:rgba(255,255,255,.92)}
.cv-gradient .cdot{color:#D9B871;font-size:13px;letter-spacing:8px;margin:12px 0 2px}
.cv-gradient .clogo{background:#fff;border-radius:12px;padding:6px 10px}
/* 시안 6 — 투톤: 하단 진초록 분할 */
.rv-cover.cv-duotone{border:none;padding:0;overflow:hidden;border-radius:12px;
  box-shadow:0 0 0 1px var(--ivd);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-duotone .cbody{background:#FBF7EE;padding:44px 18px 34px}
.cv-duotone .du-foot{background:var(--gd);padding:18px;border-top:2.5px solid var(--gold)}
.cv-duotone .du-foot .cmeta{color:#fff;margin-top:0}
/* 시안 7 — 티켓 */
.rv-cover.cv-ticket{border:none;padding:0;position:relative}
.cv-ticket .tk-in{border:2px dashed var(--gm);border-radius:14px;padding:34px 26px;background:var(--wh)}
.cv-ticket .tk-lb{display:inline-block;font-size:10px;font-weight:900;letter-spacing:4px;color:var(--gold);
  border:1px solid var(--goldl);border-radius:100px;padding:4px 16px;margin-bottom:16px;text-transform:uppercase}
.cv-ticket .tk-dash{border-top:1.5px dashed var(--ivd);margin:18px 30px}
.cv-ticket .tk-hole{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;
  background:var(--bg,#F6F3EC);border:2px dashed var(--gm);transform:translateY(-50%)}
.cv-ticket .tk-hole.l{left:-11px}.cv-ticket .tk-hole.r{right:-11px}
/* 시안 8 — 코너 프레임 */
.rv-cover.cv-corner{border:none;position:relative;padding:46px 24px}
.cv-corner .ck{position:absolute;width:36px;height:36px;border:0 solid var(--gold)}
.cv-corner .cbig{font-size:29px}
.cv-corner .ck.tl{top:8px;left:8px;border-top-width:4px;border-left-width:4px}
.cv-corner .ck.tr{top:8px;right:8px;border-top-width:4px;border-right-width:4px}
.cv-corner .ck.bl{bottom:8px;left:8px;border-bottom-width:4px;border-left-width:4px}
.cv-corner .ck.br{bottom:8px;right:8px;border-bottom-width:4px;border-right-width:4px}
/* 시안 9 — 리본 */
.rv-cover.cv-ribbon{border:none;padding:0;display:flex;overflow:hidden;border-radius:12px;
  box-shadow:0 0 0 1px var(--ivd);text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-ribbon .rb-bar{flex:0 0 14px;background:linear-gradient(180deg,#D9B871,#B98A2F)}
.cv-ribbon .rb-body{flex:1;padding:36px 26px;background:var(--wh)}
.cv-ribbon .clogo{margin:0 0 14px}
.cv-ribbon .csub{margin-top:0;letter-spacing:4px}
.cv-ribbon .cbig{margin-top:6px}
.cv-ribbon .cmeta{margin-top:16px}
/* 시안 10 — 인장 워터마크 */
.rv-cover.cv-seal{border:1px solid var(--ivd);position:relative;overflow:hidden;padding:48px 20px 44px}
.cv-seal::before{content:'';position:absolute;top:12px;left:14%;right:14%;height:5px;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.cv-seal .seal-wm{position:absolute;right:-16px;bottom:-16px;width:190px;opacity:.12;transform:rotate(-12deg);pointer-events:none}
.cv-seal .seal-body{position:relative}
/* 시안 11 — 아웃라인 */
.rv-cover.cv-outline{border:none;position:relative;padding:52px 20px 40px;overflow:hidden}
.cv-outline .cbig-ghost{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  font-size:52px;font-weight:900;letter-spacing:6px;white-space:nowrap;
  color:transparent;-webkit-text-stroke:1.5px var(--gp);pointer-events:none}
.cv-outline .cbig{position:relative}
/* 시안 12 — 보태닉 */
.rv-cover.cv-botanic{border:1.5px solid #CBB98F;background:#FBF7EE;position:relative;padding:44px 22px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-botanic .bt{position:absolute;font-size:30px;color:#9BB59B}
.cv-botanic .bt.tl{top:10px;left:14px}
.cv-botanic .bt.br{bottom:10px;right:14px;transform:rotate(180deg)}
.cv-botanic .cdeco{color:var(--gold);font-size:13px;margin-bottom:12px;letter-spacing:4px}
.cv-botanic .cbig{letter-spacing:4px}
/* 시안 13 — 포스터: 배경 이미지 + 어두운 베일 */
.rv-cover.cv-poster{border:none;border-radius:12px;overflow:hidden;position:relative;
  background-size:cover;background-position:center;background-color:#1E3932;
  padding:0;min-height:280px;display:flex;align-items:stretch;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-poster .po-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,20,.25),rgba(10,25,20,.72))}
.cv-poster .po-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding:40px 24px 30px}
.cv-poster .cbig{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cv-poster .csub{color:rgba(255,255,255,.88)}
.cv-poster .cmeta{color:rgba(255,255,255,.95)}
.cv-poster .clogo{background:rgba(255,255,255,.92);border-radius:10px;padding:5px 9px;margin:0 auto 10px}
/* 표지 편집창 미리보기 */
.cv-pv{border:1.5px dashed var(--ivd);border-radius:12px;padding:10px;background:var(--iv);
  max-height:320px;overflow-y:auto;zoom:.62}
/* 예산 편집기 — 구분 관리·드래그·병합·소계 */
.bg-cats{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px;
  background:var(--iv);border-radius:10px;padding:7px 10px}
.bg-cats-lb{font-size:11.5px;font-weight:900;color:var(--gd);margin-right:2px}
.bg-cat-chip{font-size:11.5px;font-weight:800;color:var(--gm);background:var(--wh);
  border:1px solid var(--ivd);border-radius:100px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px}
.bg-cat-chip i{font-style:normal;font-size:9px;color:var(--tl);cursor:pointer;font-weight:900}
.bg-cat-chip i:hover{color:var(--red)}
.bg-catsel{min-width:86px;padding:6px 6px;font-size:12px}
.bg-drag{cursor:grab;text-align:center;color:var(--tl);font-size:13px;user-select:none;touch-action:none;width:26px}
.bg-drag:active{cursor:grabbing}
tr.bg-dragging{opacity:.55;outline:2px dashed var(--gm)}
.bg-same{font-size:11px;color:var(--tl);font-weight:700}
.tb-cell{position:relative}
.tb-cell input{padding-right:22px}
.tb-mg{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:17px;height:17px;
  border:1px solid var(--ivd);border-radius:5px;background:var(--wh);color:var(--tl);
  font-size:9px;font-weight:900;cursor:pointer;line-height:1;padding:0}
.tb-mg:hover{border-color:var(--gm);color:var(--gm)}
.tb-mg.on{background:var(--gp);border-color:var(--gm);color:var(--gm)}
.tb-merged{background:var(--iv)}
.bg-mg.on{background:var(--gp);border-color:var(--gm);color:var(--gm)}
tr.bg-subrow td{background:#F4F1E4}
.bg-sublb{font-weight:900;color:#8a6410}
.bg-subhint{font-size:10px;color:#b09a5e;text-align:right;padding-right:8px}
tr.bg-subrow .bg-amt{color:#8a6410}
/* 발행 표 — 병합·소계 */
.rv-tb td.mg{vertical-align:middle;background:#F7FAF8 !important;border-right:1px solid var(--ivd)}
.rv-tb tr.subrow td{background:#F4F1E4 !important;border-top:1.5px solid var(--gm)}
.rv-tb .sub-lb{font-weight:900;color:#8a6410;text-align:right;padding-right:10px}
.rv-tb tr.subrow .acc b{font-weight:900;color:#8a6410}
/* 회계식 정렬 — ₩ 왼쪽 고정, 숫자 오른쪽 정렬(고정폭 숫자), 수량·단위 분리 */
.rv-tb th.thr{text-align:right}
.rv-tb td.num{padding-right:9px}
.acc{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:88px}
.acc i{font-style:normal;font-size:10px;color:var(--ts);font-weight:700}
.acc b{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.2px}
.accq{display:flex;justify-content:flex-end;align-items:baseline;gap:3px;min-width:52px}
.accq b{font-variant-numeric:tabular-nums;font-weight:700}
.accq i{font-style:normal;font-size:10px;color:var(--ts);width:26px;text-align:left}
.sumrow .acc b,.hlrow .acc b{font-weight:900}
/* 편집창 줄별 소계 */
.ed-tbl td.bg-amt{text-align:right;font-size:12px;font-weight:800;color:var(--gm);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px;min-width:92px}
/* ── 배정 빌더 (조·차량·숙소) ── */
.ag-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ag-sum{font-size:11.5px;font-weight:800;color:var(--gm);margin-left:auto}
.ag-wrap{display:flex;gap:14px;align-items:flex-start;min-height:300px}
.ag-pool{flex:0 0 344px;border:1.5px dashed var(--ivd);border-radius:13px;padding:12px;background:var(--iv);
  position:sticky;top:0;max-height:calc(95vh - 300px);overflow-y:auto}
.ag-ph{font-size:12.5px;font-weight:900;color:var(--gd);margin-bottom:6px;display:flex;gap:6px;align-items:center}
#ag-pool{display:block}
.ag-psum{font-size:11.5px;color:var(--ts);line-height:1.9;margin-bottom:9px;
  background:var(--wh);border:1px solid var(--ivd);border-radius:10px;padding:7px 10px}
.ag-psum b{color:var(--gd);font-weight:900}
.ag-psum i{font-style:normal;font-size:10px;color:var(--tl)}
.ag-psum .sep{margin:0 6px;color:var(--ivd)}
.ag-units{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px;
  max-height:calc(95vh - 300px);overflow-y:auto;padding-right:2px}
.ag-unit{border:2px solid var(--ivd);border-radius:14px;padding:13px 14px;background:var(--wh);min-height:280px;
  display:flex;flex-direction:column}
.ag-unit .ag-us{flex:1}
.ag-uh2.ag-tus{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:stretch}
.ag-uh2.ag-tus .ed-mini{min-height:68px;border-radius:12px;border-style:dashed}
.ag-uh2.ag-tus .ag-gauge{align-self:center;justify-self:end;grid-column:-2/-1}
.ag-unit.drop{cursor:copy;border-color:var(--gm);box-shadow:0 0 0 1px var(--gp)}
.ag-uh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.ag-uname{font-family:inherit;font-size:16px;font-weight:900;color:var(--gd);border:none;
  border-bottom:1.5px dashed var(--ivd);background:none;width:100px;padding:3px 1px;outline:none}
.ag-uname:focus{border-bottom-color:var(--gm)}
.ag-cnt{font-size:12px;font-weight:800;color:var(--gm);background:var(--gp);border-radius:100px;padding:4px 11px;margin-left:auto}
.ag-uh2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.ag-unit .ed-mini{font-size:13px;padding:8px 13px;border-radius:10px;border-width:1.5px}
.ag-unit .ag-uh .ed-mini{font-size:12px;padding:5px 10px}
.ag-gauge{font-size:13px;font-weight:900;color:var(--gm);background:var(--gp);border-radius:100px;padding:5px 12px}
.ag-gauge.over{color:#fff;background:var(--red)}
.ag-caps{display:flex;gap:3px;align-items:center}
.ag-caps b{font-size:10px;font-weight:800;border:1px solid var(--ivd);border-radius:100px;padding:2px 6px;
  cursor:pointer;color:var(--ts);background:var(--wh)}
.ag-caps b.on{background:var(--gm);border-color:var(--gm);color:#fff}
.ag-gsel{width:64px;flex:none;padding:4px 5px;font-size:11.5px}
.ag-min{flex:1;min-width:90px;padding:5px 7px;font-size:11.5px}
.ag-us{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  min-height:150px;padding-top:4px;align-content:start}
.ag-hint{font-size:12px;color:var(--tl);padding:6px 0}
.ag-pgh{font-size:13px;font-weight:900;color:var(--gd);margin:10px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.ag-pgh span{font-size:10.5px;font-weight:700;color:var(--tl)}
.ag-pgrp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ag-pool.dropover{border-color:var(--gm);background:var(--gp)}
.ag-unit.dropover{border-color:var(--gm);box-shadow:0 0 0 2px var(--gm);background:var(--gp)}
.ag-ghost{position:fixed;z-index:999;pointer-events:none;background:var(--gd);color:#fff;
  font-size:14px;font-weight:800;border-radius:12px;padding:9px 17px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ag-stu{touch-action:none}
.ag-stu,.ag-tch{font-family:inherit;border:2px solid var(--ivd);border-radius:12px;background:var(--wh);
  cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:11px 6px 9px;min-height:68px;position:relative;box-shadow:0 2px 5px rgba(30,57,50,.08)}
.ag-stu:active,.ag-tch:active{cursor:grabbing}
.ag-stu .n,.ag-tch .n{font-size:15px;font-weight:900;color:var(--tx);line-height:1.15;word-break:keep-all}
.ag-stu .meta,.ag-tch .meta{display:flex;align-items:center;gap:4px}
.ag-stu .fnp-gd{font-size:10px;padding:2px 7px}
.ag-stu b,.ag-tch b{font-size:10px;font-weight:900;color:var(--ts);background:var(--iv);border-radius:6px;padding:2px 6px}
.ag-stu i,.ag-tch i{font-style:normal;position:absolute;top:3px;right:5px;font-size:12px;color:var(--red);font-weight:900}
.ag-tch{border-color:#D9B871;background:#FDFAF2}
.ag-drvbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ag-drvlb{font-size:12.5px;font-weight:800;color:var(--gd);background:var(--gp);border-radius:100px;padding:5px 12px}
.ag-drvlb b{color:var(--gm)}
.ag-drv{position:absolute;top:3px;left:5px;font-size:13px;cursor:pointer;opacity:.35;filter:grayscale(1)}
.ag-drv:hover{opacity:.8;filter:none}
.ag-drv.on{opacity:1;filter:none}
.ag-tch.drv{border-color:var(--gm);background:var(--gp);box-shadow:0 0 0 2px var(--gm)}
.ag-tch .n{color:#7a5a14}
.ag-tch b{background:#F4E9CC;color:#8a6410}
.ag-stu.sel{border-color:var(--gm);background:var(--gp);box-shadow:0 0 0 2.5px var(--gm)}
.ag-stu.warn{border-color:var(--red);background:var(--redp,#FDECEC)}
/* 배정 발행 표 */
.rv-ag{width:100%;border-collapse:collapse;font-size:11.5px}
.rv-ag tr:nth-child(even) td{background:#F3F7F4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-ag th{background:var(--gd);color:#fff;font-weight:800;padding:6px 7px;text-align:center;font-size:11px}
.rv-ag th small{font-weight:600;opacity:.85}
.rv-ag th.tch{background:var(--gm)}
.rv-ag td{border:1px solid var(--ivd);padding:5px 7px;vertical-align:top;line-height:1.7}
.rv-ag td.c{text-align:center}
.rv-ag td.lb{background:var(--iv);font-weight:800;color:var(--ts);text-align:center;white-space:nowrap}
.rv-ag td small{font-size:9.5px;color:var(--ts)}
/* 표지 시안 고르기 카드 (편집기) */
.cv-styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.cv-sty{border:1.5px solid var(--ivd);border-radius:10px;padding:9px 11px;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;background:var(--wh)}
.cv-sty input{display:none}
.cv-sty b{font-size:12.5px;color:var(--gd)}
.cv-sty span{font-size:10.5px;color:var(--ts)}
.cv-sty.on{border-color:var(--gm);background:var(--gp);box-shadow:0 0 0 1px var(--gm)}
.rv-note{font-size:11.5px;color:var(--ts);margin-top:7px;white-space:pre-wrap;line-height:1.6}

/* ═══ 모달 ═══ */
.mbk{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--wh);border-radius:15px;width:100%;max-width:600px;max-height:90vh;
  overflow-y:auto;padding:19px 18px;box-shadow:0 18px 60px rgba(0,0,0,.3);position:relative}
/* sidebar.js가 붙이는 닫기 ✕ — 오른쪽 위에 자리 잡게 */
.mbox .ui-close-x{position:absolute;top:10px;right:10px;width:30px;height:30px;
  border:none;border-radius:50%;background:var(--iv);color:var(--ts);font-size:13px;
  font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.mbox .ui-close-x:hover{background:var(--ivd);color:var(--gd)}
.mbox.wide{max-width:860px}
.mbox.full{max-width:97vw;width:97vw;height:95vh;max-height:95vh}
.mtitle{font-size:15px;font-weight:900;color:var(--gd);margin-bottom:12px}
.msub{font-size:11.5px;color:var(--ts);margin:-8px 0 12px;line-height:1.6}
.frow{margin-bottom:11px}
.flab{display:block;font-size:11.5px;font-weight:800;color:var(--ts);margin-bottom:5px}
.fin,.fsel,.ftxt{font-family:inherit;font-size:13px;width:100%;border:1.5px solid var(--ivd);
  border-radius:9px;padding:9px 11px;background:var(--wh);color:var(--tx)}
.fin:focus,.fsel:focus,.ftxt:focus{outline:none;border-color:var(--gm)}
.ftxt{resize:vertical;min-height:70px;line-height:1.6}
.fgrid{display:flex;gap:9px}
.fgrid .frow{flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}

/* 라이브러리 카드 */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.libcat{font-size:12px;font-weight:900;color:var(--gd);background:var(--gp);border-radius:8px;
  padding:6px 11px;margin:12px 0 7px}
.libcat:first-child{margin-top:0}
.lib{border:1.5px solid var(--ivd);border-radius:10px;padding:10px 11px;cursor:pointer;background:var(--wh)}
.lib:hover{border-color:var(--gm);background:var(--gp)}
.lib .li{font-size:16px}
.lib .ln{font-size:12.5px;font-weight:900;color:var(--tx);margin-top:3px}
.lib .ld{font-size:10.5px;color:var(--tl);margin-top:2px;line-height:1.45}

/* 편집기 안 작은 표 */
.ed-rows{display:flex;flex-direction:column;gap:6px}
.ed-row{display:flex;gap:5px;align-items:flex-start}
.ed-row .fin,.ed-row .ftxt{padding:7px 9px;font-size:12.5px}
.ed-row .ftxt{min-height:36px}
.ed-mini{font-family:inherit;font-size:11px;border:1px solid var(--ivd);background:var(--wh);
  border-radius:6px;padding:5px 7px;cursor:pointer;color:var(--ts);flex:none}
.ed-mini:hover{border-color:var(--gm);color:var(--gm)}
.ed-tblwrap{overflow-x:auto;border:1px solid var(--ivd);border-radius:9px;padding:8px}
.ed-tbl{border-collapse:collapse}
.ed-tbl td,.ed-tbl th{padding:2px}
.ed-tbl input{font-family:inherit;font-size:12px;border:1px solid var(--ivd);border-radius:6px;
  padding:6px 7px;min-width:96px;width:100%;background:var(--wh)}
.ed-tbl input:focus{outline:none;border-color:var(--gm)}
.ed-tbl th input{font-weight:800;background:var(--iv)}
.ed-sch td{position:relative}
.ed-sch .cellbox{display:flex;gap:3px;align-items:center}
.ed-sch .cellbox input{min-width:84px}
.cdot{width:20px;height:20px;border-radius:6px;border:1px solid var(--ivd);cursor:pointer;flex:none}
.calc-live{background:var(--gp);border-radius:10px;padding:10px 13px;font-size:12px;
  color:var(--gd);line-height:1.9;margin-top:10px;font-weight:700}

/* 담당자 고르기 */
.pick-sec{margin-bottom:12px}
.pick-h{font-size:12px;font-weight:900;color:var(--gd);background:var(--gp);border-radius:8px;
  padding:6px 11px;margin-bottom:6px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:5px}
.pick{display:flex;align-items:center;gap:7px;font-size:12px;border:1.5px solid var(--ivd);
  border-radius:9px;padding:7px 9px;cursor:pointer;background:var(--wh)}
.pick input{width:15px;height:15px;flex:none;cursor:pointer}
.pick.on{border-color:var(--gm);background:var(--gp)}
.pick small{color:var(--tl);font-size:10px;margin-left:auto}

/* 발행 링크 */
.linkbox{display:flex;gap:7px;align-items:center;background:var(--iv);border-radius:10px;padding:9px 11px}
.linkbox .lk{flex:1;font-size:11.5px;color:var(--gd);word-break:break-all;font-weight:700}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:900;
  background:var(--gd);color:#fff;font-size:13px;font-weight:700;padding:11px 18px;
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.err{background:var(--red)}

@media (max-width:640px){
  body #mn{padding-left:6px;padding-right:6px}
  .panel{padding:11px 9px}
  .btn{font-size:11.5px;padding:8px 11px}
  .mbox{padding:15px 12px}
  .blkbody{padding:10px 9px}
}

/* ═══ 인쇄 ═══ */
#printArea{display:none}
@media print{
  body.pr *{visibility:hidden}
  body.pr #printArea, body.pr #printArea *{visibility:visible}
  body.pr #printArea{display:block;position:absolute;left:0;top:0;width:100%;background:#fff}
  #printArea .pblk{page-break-inside:avoid;margin-bottom:18px}
  #printArea .pcover{page-break-after:always;display:flex;flex-direction:column;
    justify-content:center;min-height:92vh}
  #printArea .pcover .rv-cover{width:100%;box-sizing:border-box;min-height:88vh;
    display:flex;flex-direction:column;justify-content:center;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .pcover .rv-cover.cv-band,#printArea .pcover .rv-cover.cv-duotone{justify-content:stretch}

onAuthStateChanged(auth, async user => {
  if(!user){
    $I('gate-msg').textContent = '로그인이 필요합니다.';
    $I('gate-btn').style.display = 'inline-block';
    return;
  }
  try {
    const s = await getDoc(doc(db,'staff', user.uid));
    if(!s.exists()){
      $I('gate-msg').textContent = '교직원 계정이 아닙니다.';
      $I('gate-btn').style.display = 'inline-block';
      return;
    }
    CU = { uid:user.uid, ...s.data() };
    IS_SUPER = CU.role === 'super';
    if(window.renderShell) renderShell('family', CU);
    if(window.setCrumb) setCrumb(['가정통신문']);

    try {
      const c = await getDoc(doc(db,'famConfig','editors'));
      FAM_ADMIN = c.exists() && Array.isArray(c.data().uids) && c.data().uids.includes(CU.uid);
    } catch(e){}

    await loadDocs();
    renderList();
    $I('gate').style.display = 'none';
    $I('ms').style.display = 'flex';
  } catch(e){
    console.error(e);
    $I('gate-msg').textContent = '불러오기 오류: ' + e.message;
    $I('gate-btn').style.display = 'inline-block';
  }
});

async function loadDocs(){
  const snap = await getDocs(collection(db,'famDocs'));
  DOCS = snap.docs.map(d=>({ id:d.id, ...d.data() }))
    .sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
}
function parseBlocks(d){
  try { const a = JSON.parse(d.blocksJson||'[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}

window.saveTitle = async function(el){

};

function blockCard(b, i, editable){
  const p = presetFind(b.key);
  return `<div class="blk ${b.pub?'':'internal'}">
    <div class="blkhead">
      <span class="bico">${p?.icon||'📄'}</span>
      <span class="bt">${esc(b.title||'')}</span>
      <span class="pill click ${b.pub?'ok':'gray'}" ${editable?`onclick="togglePub(${i})"`:''}
        title="학부모 링크에 보일지 정합니다">${b.pub?'학부모 공개':'내부용'}</span>
      ${editable?`
        <button class="iconbtn" onclick="moveBlock(${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="iconbtn" onclick="moveBlock(${i},1)" ${i===CUR.blocks.length-1?'disabled':''}>↓</button>
        <button class="iconbtn" onclick="editBlock(${i})">✏️ 입력</button>
        <button class="iconbtn danger" onclick="delBlock(${i})">🗑</button>`:''}
    </div>
    <div class="blkbody">${renderBlock(b) || '<div class="empty">아직 입력된 내용이 없어요 — ✏️ 입력을 눌러 채워주세요.</div>'}</div>
  </div>`;
}
window.togglePub = async function(i){
  if(!canEdit(CUR)) return;
  CUR.blocks[i].pub = !CUR.blocks[i].pub;
  await persistBlocks();
  renderEdit();
};
window.moveBlock = async function(i, dir){
  if(!canEdit(CUR)) return;
  const j = i + dir;
  if(j < 0 || j >= CUR.blocks.length) return;
  [CUR.blocks[i], CUR.blocks[j]] = [CUR.blocks[j], CUR.blocks[i]];
  await persistBlocks();
  renderEdit();
};
window.delBlock = async function(i){
  if(!canEdit(CUR)) return;
  if(!confirm(`「${CUR.blocks[i].title}」 블록을 지울까요?`)) return;
  CUR.blocks.splice(i,1);
  await persistBlocks();
  renderEdit();
};

async function persist(extra){
  const upd = { updatedAt:Timestamp.now(), updatedBy:CU.name||'', ...(extra||{}) };
  await updateDoc(doc(db,'famDocs', CUR.id), upd);
  Object.assign(CUR, upd);
  const d = DOCS.find(x=>x.id===CUR.id);
  if(d) Object.assign(d, upd);
}
async function persistBlocks(){
  try {
    await persist({ blocksJson: JSON.stringify(CUR.blocks) });
  } catch(e){ toast('저장 실패: '+e.message,'err'); }
}

   블록 렌더링 (미리보기 · 인쇄 공용)

function renderBlock(b){
  const d = b.data || {};

                  : d.logo==='jihyebit' ? 'logo-jihyebit.png'
                  : d.logo==='url' ? (d.logoUrl||'') : '';
    const logo = logoSrc ? `<img class="clogo" src="${esc(logoSrc)}" alt="">` : '';
    const meta = `${d.period?esc(d.period)+'<br>':''}${d.place?esc(d.place):''}`;
    if(st==='band') return `<div class="rv-cover cv-band">
      <div class="cband">${logo}${d.sub?`<span class="cband-t">${esc(d.sub)}</span>`:''}</div>
      <div class="cbody"><div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div></div>
      <div class="cfoot-line"></div></div>`;
    if(st==='elegant') return `<div class="rv-cover cv-elegant">
      <div class="cinner">
        ${logo}
        <div class="cdeco">✦ &nbsp;·&nbsp; ✦ &nbsp;·&nbsp; ✦</div>
        <div class="cbig">${esc(d.big||'')}</div>
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cdeco-line"></div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    if(st==='minimal') return `<div class="rv-cover cv-minimal">
      ${logo}
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cbig">${esc(d.big||'')}</div>
      <div class="cline"></div>
      <div class="cmeta">${meta}</div></div>`;
    if(st==='gradient') return `<div class="rv-cover cv-gradient">
      ${logo}
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cbig">${esc(d.big||'')}</div>
      <div class="cdot">✦</div>
      <div class="cmeta">${meta}</div></div>`;
    if(st==='ticket') return `<div class="rv-cover cv-ticket">
      <div class="tk-in">
        ${logo}
        <div class="tk-lb">ADMIT · ${esc(d.sub||'가정통신문')}</div>
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="tk-dash"></div>
        <div class="cmeta">${meta}</div>
      </div>
      <span class="tk-hole l"></span><span class="tk-hole r"></span></div>`;
    if(st==='corner') return `<div class="rv-cover cv-corner">
      <span class="ck tl"></span><span class="ck tr"></span><span class="ck bl"></span><span class="ck br"></span>
      ${logo}
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div></div>`;
    if(st==='ribbon') return `<div class="rv-cover cv-ribbon">
      <div class="rb-bar"></div>
      <div class="rb-body">
        ${logo}
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    if(st==='seal'){
      const sealSrc = d.logo==='daniel' ? 'stamp-daniel.png'
                    : d.logo==='jihyebit' ? 'stamp-jihyebit.png'
                    : d.logo==='url' ? (d.logoUrl||'') : '';
      return `<div class="rv-cover cv-seal">
      ${sealSrc?`<img class="seal-wm" src="${esc(sealSrc)}" alt="">`:''}
      <div class="seal-body">
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    }
    if(st==='duotone') return `<div class="rv-cover cv-duotone">
      <div class="cbody">
        ${logo}
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
      </div>
      <div class="du-foot"><div class="cmeta">${meta}</div></div></div>`;
    if(st==='outline') return `<div class="rv-cover cv-outline">
      ${logo}
      <div class="cbig-ghost">${esc(d.big||'')}</div>
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div></div>`;
    if(st==='poster'){
      const bg = d.bgUrl ? `background-image:url('${esc(d.bgUrl)}')` : '';
      return `<div class="rv-cover cv-poster" style="${bg}">
      <div class="po-veil"></div>
      <div class="po-body">
        ${logo}
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    }
    if(st==='botanic') return `<div class="rv-cover cv-botanic">
      <span class="bt tl">❦</span><span class="bt br">❦</span>
      ${logo}
      <div class="cdeco">— ❧ —</div>
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div></div>`;

      ${logo}
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}

      ${d.red?`<div class="rv-red">${esc(d.red)}</div>`:''}`;
  }
  if(b.type === 'kv'){
    const rows = (d.rows||[]).filter(r=>r.k||r.v);
    if(!rows.length) return '';
    return `<table class="rv-kv">${rows.map(r=>
      `<tr><th>${esc(r.k)}</th><td>${esc(r.v)}</td></tr>`).join('')}</table>
      ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
  }
  if(b.type === 'table'){
    const cols = d.cols||[], rows = (d.rows||[]).filter(r=>(r.c||[]).some(x=>x));
    if(!rows.length) return '';
    const MG='⤴';
    // 셀에 ⤴ 표시가 있으면 위 칸과 세로 병합 — 열마다 따로 이어진다
    const span=(ri,ci)=>{ let n=1;
      while(rows[ri+n] && (rows[ri+n].c||[])[ci]===MG) n++;
      return n; };
    const body=rows.map((r,ri)=>`<tr>${cols.map((_,ci)=>{
      const v=(r.c||[])[ci]||'';
      if(v===MG) return '';                                  // 위 칸이 rowspan으로 덮는다
      const n=span(ri,ci);
      return `<td${n>1?` rowspan="${n}" class="mg"`:''}>${esc(v)}</td>`;
    }).join('')}</tr>`).join('');
    return `<div style="overflow-x:auto"><table class="rv-tb">
      <tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
      ${body}
    </table></div>
    ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
  }
  if(b.type === 'budget') return renderBudget(d);
  if(b.type === 'schedule') return renderSchedule(d);
  if(b.type === 'assign') return renderAssign(d);
  return '';
}
function budgetCalc(d){
  const rows = (d.rows||[]).filter(r=>r.sub || r.item||r.cat||Number(r.price));
  const total = rows.filter(r=>!r.sub).reduce((s,r)=>s+(Number(r.price)||0)*(Number(r.qty)||0),0);
  const ppl = Number(d.people)||0;
  let per = ppl ? total/ppl : 0;
  const ru = Number(d.round)||0;
  if(ru && per) per = Math.ceil(per/ru)*ru;
  return { rows, total, ppl, per };
}
function renderBudget(d){
  const { rows, total, ppl, per } = budgetCalc(d);
  if(!rows.length) return '';
  const won = v=>`<span class="acc"><i>₩</i><b>${fmt(v)}</b></span>`;
  const qtyC = (q,u)=>`<span class="accq"><b>${fmt(q)}</b><i>${esc(u||'')}</i></span>`;
  return `<div style="overflow-x:auto"><table class="rv-tb">
    <tr><th>구분</th><th>항목</th><th class="thr">단가</th>
      <th class="thr">수량</th><th class="thr">금액</th><th>비고</th></tr>
    ${(()=>{
      // 연속으로 구분·항목이 같은 줄은 병합(rowspan) — 소계 줄이 나오면 묶음이 끊긴다
      let html='', seg=0;
      const catSpan=i=>{ let n=1;
        for(let j=i+1;j<rows.length && !rows[j].sub && rows[j].cat===rows[i].cat;j++) n++;
        return n; };
      const itemSpan=i=>{ let n=1;
        for(let j=i+1;j<rows.length && !rows[j].sub && rows[j].cat===rows[i].cat && rows[j].item===rows[i].item;j++) n++;
        return n; };
      for(let i=0;i<rows.length;i++){
        const r=rows[i];
        if(r.sub){
          html+=`<tr class="subrow"><td colspan="2" class="sub-lb">∑ ${esc(r.label||'소계')}</td>
            <td></td><td></td><td class="num">${won(seg)}</td><td></td></tr>`;
          seg=0; continue;
        }
        const amt=(Number(r.price)||0)*(Number(r.qty)||0); seg+=amt;
        const firstCat = i===0 || rows[i-1].sub || rows[i-1].cat!==r.cat;
        const firstItem = firstCat || rows[i-1].item!==r.item;
        html+=`<tr>${firstCat?`<td rowspan="${catSpan(i)}" class="mg">${esc(r.cat||'')}</td>`:''}
          ${firstItem?`<td rowspan="${itemSpan(i)}" class="mg">${esc(r.item||'')}</td>`:''}
          <td class="num">${won(r.price)}</td>
          <td class="num">${qtyC(r.qty, r.unit)}</td>
          <td class="num">${won(amt)}</td><td>${esc(r.note||'')}</td></tr>`;
      }
      return html;
    })()}
    <tr class="sumrow"><td colspan="4">총계</td>
      <td class="num">${won(total)}</td><td></td></tr>
    ${ppl?`<tr class="hlrow"><td colspan="4">1인 회비 (${fmt(ppl)}명${Number(d.round)?' · '+fmt(d.round)+'원 단위 올림':''})</td>
      <td class="num">${won(per)}</td><td></td></tr>`:''}
  </table></div>
  ${d.account?`<div class="rv-note">💳 회비 입금 계좌: <b>${esc(d.account)}</b>${d.deadline?` · 납부 기한: <b>${esc(d.deadline)}</b>`:''}</div>`
    : d.deadline?`<div class="rv-note">납부 기한: <b>${esc(d.deadline)}</b></div>`:''}
  ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
}
function renderSchedule(d){
  if(d && (d.ver === 2 || Array.isArray(d.cards))) return renderScheduleV2(d);
  const days = d.days||[], slots = d.slots||[];
  if(!days.length || !slots.length) return '';
  const any = Object.values(d.cells||{}).some(c=>c && c.t);
  if(!any) return '';
  return `<div style="overflow-x:auto"><table class="rv-sch">
    <tr><th>시간</th>${days.map(dy=>`<th>${esc(dy.label||'')}</th>`).join('')}</tr>
    ${slots.map((sl,ri)=>`<tr>
      <td class="tm">${esc(sl.s)} ~ ${esc(sl.e)}</td>
      ${days.map((_,ci)=>{
        const c = (d.cells||{})[ri+'_'+ci] || {};
        const bg = SCH_COLORS[c.c||0] || '';
        return `<td style="${bg?`background:${bg}`:''}">${esc(c.t||'')}</td>`;
      }).join('')}
    </tr>`).join('')}
  </table></div>
  ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
}
/* v2: 시간 비례 카드 배치 (시간표 배치 방식) */
function renderScheduleV2(d){
  const days = d.days||[];
  const cards = (d.cards||[]).filter(c=>c && (c.t||'').trim());
  if(!days.length || !cards.length) return '';
  const st = Number.isFinite(d.start)?d.start:420;
  const en = Number.isFinite(d.end)?d.end:1440;
  const PX = 1.0, n = days.length;
  const H = Math.max(60,(en-st)*PX);
  const m2t = v=>Math.floor(v/60)+':'+String(v%60).padStart(2,'0');
  // 시간 눈금 (정시마다)
  let axis='', lines='';
  for(let m=Math.ceil(st/60)*60; m<=en; m+=60){
    const y=(m-st)*PX;
    axis += `<div class="tg-hl" style="top:${y}px">${m2t(m)}</div>`;
    if(m>st && m<en) lines += `<div class="tg-line" style="top:${y}px"></div>`;
  }
  const cardHtml = cards.map(c=>{
    const dd=Math.max(0,Math.min(n-1,c.d|0)), w=Math.max(1,Math.min(n-dd,c.w|0||1));
    const s=Math.max(st,c.s), e=Math.min(en,c.e);
    if(e<=s) return '';
    const top=(s-st)*PX, h=(e-s)*PX;
    const bg = SCH_COLORS[c.c||0]||'#fff';
    const showTime = h>=30;
    return `<div class="tg-card" style="left:${dd/n*100}%;width:${w/n*100}%;top:${top}px;height:${h}px;background:${bg}">
      ${showTime?`<span class="tg-tm">${m2t(s)}~${m2t(e)} · ${(e-s)>=60?Math.floor((e-s)/60)+'시간'+((e-s)%60?' '+((e-s)%60)+'분':''):(e-s)+'분'}</span>`:''}
      <span class="tg-tt">${esc(c.t)}</span>
      ${(c.st&&h>=44)?`<span class="tg-st">${esc(c.st)}</span>`:''}</div>`;
  }).join('');
  return `<div style="overflow-x:auto"><div class="rv-tg" style="min-width:${120+n*110}px">
    <div class="tg-hd"><div class="tg-corner">시간</div>
      ${days.map(dy=>`<div class="tg-dh" style="width:${100/n}%">${esc(dy.label||'')}</div>`).join('')}</div>
    <div class="tg-bd" style="height:${H}px">
      <div class="tg-axis">${axis}</div>
      <div class="tg-cols">${lines}${cardHtml}</div>
    </div>
  </div></div>
  ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
}
/* 조 · 차량 · 숙소 배정 — 발행/인쇄 표 */
function renderAssign(d){
  const units=(d.units||[]).filter(u=>u.students?.length || u.name || u.tN);
  if(!units.length) return '';
  const nm=st=>`${esc(st.n)}${st.g||st.x?` <small>(${[String(st.g||'').replace('학년','')+(st.g?'학년':''),st.x].filter(Boolean).join('/')})</small>`:''}`;
  let core='';
  if(d.kind==='vehicle'){
    core=`<div style="overflow-x:auto"><table class="rv-ag">
      <tr><th class="lb"></th>${units.map(u=>`<th>${esc(u.name||'차량')}${u.cap?` <small>${u.cap}인승</small>`:''}</th>`).join('')}</tr>
      <tr><td class="lb">운전자</td>${units.map(u=>`<td class="c">${esc(u.drvN||'')}</td>`).join('')}</tr>
      <tr><td class="lb">교사</td>${units.map(u=>`<td class="c">${esc(String(u.tN||'').split(',').map(x=>x.trim()).filter(n=>n&&n!==u.drvN).join(', '))}</td>`).join('')}</tr>
      <tr><td class="lb">학생 <small>${units.reduce((a,u)=>a+u.students.length,0)}명</small></td>
        ${units.map(u=>`<td class="stu">${u.students.map(nm).join('<br>')||''}</td>`).join('')}</tr>
    </table></div>`;
  } else if(d.kind==='lodging'){
    core=`${d.info?`<div class="rv-t" style="margin-bottom:8px">${esc(d.info)}</div>`:''}
      <div style="overflow-x:auto"><table class="rv-ag rows">
      <tr><th>호실</th><th>담당</th><th>성</th><th>구분</th><th>명단</th><th>비고</th></tr>
      ${units.map(u=>`<tr>
        <td class="c"><b>${esc(u.name||'')}</b></td>
        <td class="c">${esc(u.tN||'')}</td>
        <td class="c"><span class="fnp-gd ${u.gender==='남'?'m':u.gender==='여'?'f':''}">${esc(u.gender||'')}</span></td>
        <td class="c">${esc(u.label||'')}</td>
        <td>${u.students.map(nm).join(', ')}</td>
        <td class="c">${esc(u.memo||'')}</td></tr>`).join('')}
    </table></div>`;
  } else {
    const maxR=Math.max(...units.map(u=>u.students.length),0);
    core=`<div style="overflow-x:auto"><table class="rv-ag">
      <tr>${units.map(u=>`<th class="tch">${esc(u.tN||'')}</th>`).join('')}</tr>
      <tr>${units.map(u=>`<th>${esc(u.name||'')} <small>(${u.students.length}명)</small></th>`).join('')}</tr>
      ${[...Array(maxR)].map((_,r)=>`<tr>${units.map(u=>
        `<td class="c">${u.students[r]?nm(u.students[r]):''}</td>`).join('')}</tr>`).join('')}
    </table></div>`;
  }
  return core + (d.note?`<div class="rv-note">${esc(d.note)}</div>`:'');
}

const TB_MERGE = '⤴';   // 셀 값이 이 표시면 «위 칸과 병합»
function tbRowHTML(r, n){
  return `<tr data-kind="trow">
    <td class="bg-drag" title="끌어서 순서 바꾸기">⠿</td>
    ${[...Array(n)].map((_,ci)=>{
      const v=(r.c||[])[ci]||'';
      const mg = v===TB_MERGE;
      return `<td class="tb-cell${mg?' tb-merged':''}">
        <input value="${mg?'':esc(v)}" style="${mg?'display:none':''}">
        ${mg?'<span class="bg-same">〃 위와 병합</span>':''}
        <button class="tb-mg${mg?' on':''}" onclick="tbToggleMerge(this)" title="위 칸과 병합/해제">⤴</button></td>`;
    }).join('')}
    <td style="white-space:nowrap">
      <button class="ed-mini" onclick="tbDupRow(this)" title="이 줄 복사">⧉</button>
      <button class="ed-mini" onclick="this.closest('tr').remove()">✕</button></td>
  </tr>`;
}
window.tbToggleMerge = function(btn){
  const td = btn.closest('td'); const tr = td.closest('tr');
  const inp = td.querySelector('input');
  const on = !td.classList.contains('tb-merged');
  if(on){
    // 첫 데이터 줄은 병합 불가
    let p=tr.previousElementSibling;
    if(!p || !p.dataset.kind){ toast('첫 줄은 병합할 수 없어요.','err'); return; }
    td.classList.add('tb-merged'); btn.classList.add('on');
    inp.dataset.keep = inp.value;             // 해제 시 복원용
    inp.value=''; inp.style.display='none';
    if(!td.querySelector('.bg-same')){
      const sp=document.createElement('span'); sp.className='bg-same'; sp.textContent='〃 위와 병합';
      td.insertBefore(sp, btn);
    }
  } else {
    td.classList.remove('tb-merged'); btn.classList.remove('on');
    inp.style.display=''; inp.value = inp.dataset.keep||'';
    td.querySelector('.bg-same')?.remove();
  }
};
window.tbDupRow = function(btn){
  const tr = btn.closest('tr');
  const vals = [...tr.querySelectorAll('td.tb-cell')].map(td=>
    td.classList.contains('tb-merged') ? TB_MERGE : (td.querySelector('input')?.value||''));
  tr.insertAdjacentHTML('afterend', tbRowHTML({c:vals}, vals.length));
};
/* 자유 표 줄 드래그 — 예산 표와 같은 방식 */
document.addEventListener('pointerdown', e=>{
  const h=e.target.closest('#tb-tbl .bg-drag'); if(!h) return;
  const tr=h.closest('tr'); e.preventDefault();
  window.__tbDrag={tr}; tr.classList.add('bg-dragging');
  document.body.style.userSelect='none';
});
document.addEventListener('pointermove', e=>{
  const d=window.__tbDrag; if(!d) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const over=el && el.closest('#tb-tbl tr[data-kind]');
  if(!over || over===d.tr) return;
  const r=over.getBoundingClientRect();
  if(e.clientY < r.top + r.height/2) over.parentNode.insertBefore(d.tr, over);
  else over.parentNode.insertBefore(d.tr, over.nextSibling);
});
document.addEventListener('pointerup', ()=>{
  const d=window.__tbDrag; if(!d) return;
  d.tr.classList.remove('bg-dragging');
  document.body.style.userSelect='';
  window.__tbDrag=null;
});
function tbColCount(){

window.tbRosterImport = async function(){
  toast('학생 명부 불러오는 중…');
  try {
    if(!STUDENTS || !CLASSES){
      const [ss, cs] = await Promise.all([
        getDocs(collection(db,'students')), getDocs(collection(db,'classes'))
      ]);
      STUDENTS = ss.docs.map(x=>({ id:x.id, ...x.data() }));
      CLASSES = cs.docs.map(x=>({ id:x.id, ...x.data() }));
    }
    const gnum = g => { const m = String(g).match(/\d+/); return m?Number(m[0]):999; };
    // 통신문 기관에 맞는 학생만 (공통이면 전체)
    const orgOk = s => !CUR.org || CUR.org==='both' || (s.org||'daniel')===CUR.org;
    // 올해 반 우선 → 학생별 학년 맵(grades) → 반 학년(grade) 순으로 찾기
    const y = new Date().getFullYear();
    const sortedCls = [...CLASSES].sort((a,b)=>((b.year||y)===y?1:0)-((a.year||y)===y?1:0));
    const gradeOf = sid => {
      for(const c of sortedCls){
        if(Array.isArray(c.students) && c.students.includes(sid)){
          if(c.grades && c.grades[sid]) return c.grades[sid];
          if(c.grade) return c.grade;
        }
      }
      return '';
    };
    const byG = {};
    STUDENTS.filter(s=>(s.status||'active')==='active' && orgOk(s)).forEach(s=>{
      const g = gradeOf(s.id) || '학년 미지정';
      (byG[g]=byG[g]||[]).push(s.name||'');
    });
    const gs = Object.keys(byG).sort((a,b)=>gnum(a)-gnum(b));
    const t = $I('tb-tbl');
    // 기존 데이터 줄 지우고 새로 채우기
    while(t.rows.length > 1) t.deleteRow(1);
    const n = tbColCount();
    gs.forEach(g=>{
      byG[g].sort((a,b)=>String(a).localeCompare(String(b),'ko'));
      const vals = [g, byG[g].join(', '), byG[g].length+'명'];
      t.insertAdjacentHTML('beforeend', tbRowHTML({c:[...Array(n)].map((_,ci)=>vals[ci]||'')}, n));
    });
    toast(`학년별 ${gs.length}줄을 채웠어요`);
  } catch(e){ toast('명부 불러오기 실패: '+e.message,'err'); }
};

(function(){

    const h=e.target.closest('.bg-drag'); if(!h) return;
    const tr=h.closest('tr'); const tbl=tr.closest('#bg-tbl'); if(!tbl) return;
    e.preventDefault();
    drag={tr}; tr.classList.add('bg-dragging');
    document.body.style.userSelect='none';
  });
  document.addEventListener('pointermove', e=>{
    if(!drag) return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const over=el && el.closest('#bg-tbl tr[data-kind]');
    if(!over || over===drag.tr) return;
    const r=over.getBoundingClientRect();
    if(e.clientY < r.top + r.height/2) over.parentNode.insertBefore(drag.tr, over);
    else over.parentNode.insertBefore(drag.tr, over.nextSibling);
  });
  document.addEventListener('pointerup', ()=>{
    if(!drag) return;
    drag.tr.classList.remove('bg-dragging');
    document.body.style.userSelect='';
    drag=null; budgetLive();
  });

function readBudget(){
  const t = $I('bg-tbl');
  let prevCat='', prevItem='';
  const rows = [...t.rows].slice(1).map(tr=>{
    if(tr.dataset.kind==='sub'){
      return { sub:1, label: tr.querySelector('[data-f="label"]')?.value.trim()||'소계' };
    }
    const g=f=>tr.querySelector(`[data-f="${f}"]`)?.value||'';
    const m = tr.dataset.m==='1';
    const cat = m ? prevCat : g('cat');
    const item = m ? (g('item')||prevItem) : g('item');
    if(!m){ prevCat=cat; prevItem=item; } else { prevItem=item||prevItem; }
    return { cat, item, m:m?1:0, price:Number(g('price'))||0, qty:Number(g('qty'))||0,
      unit:g('unit'), note:g('note') };
  }).filter(r=>r.sub || r.cat||r.item||r.price);

const svT2M = s=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim()); return m?(+m[1])*60+(+m[2]):null; };
const svM2T = v=>Math.floor(v/60)+':'+String(v%60).padStart(2,'0');

function svFromData(d){

    return { start:Number.isFinite(d.start)?d.start:420, end:Number.isFinite(d.end)?d.end:1440,
      days:(d.days&&d.days.length?d.days:[{label:'1일차'}]).map(x=>({label:x.label||''})),
      cards:(d.cards||[]).map(c=>({id:c.id||svRid(),d:c.d|0,w:Math.max(1,c.w|0||1),s:c.s|0,e:c.e|0,t:c.t||'',st:c.st||'',c:c.c|0})),
      note:d.note||'' };
  }
  // ── 옛 형식(slots+cells) → 카드 자동 변환 ──
  const days=(d.days&&d.days.length?d.days:[{label:'1일차'}]).map(x=>({label:x.label||''}));
  const cards=[]; let mn=1440,mx=0,found=false;
  (d.slots||[]).forEach((sl,ri)=>{
    const s=svT2M(sl.s), e=svT2M(sl.e);
    days.forEach((_,ci)=>{
      const c=(d.cells||{})[ri+'_'+ci];
      if(c && (c.t||'').trim() && s!=null && e!=null && e>s){
        cards.push({id:svRid(),d:ci,w:1,s,e,t:c.t.trim(),c:c.c|0});
        mn=Math.min(mn,s); mx=Math.max(mx,e); found=true;
      }
    });
  });
  return { start:found?Math.floor(mn/60)*60:420, end:found?Math.ceil(mx/60)*60:1440,
    days, cards, note:d.note||'' };
}

/* ── 그리기 ── */
function svPaint(){
  const n = SV.days.length, H = (SV.end-SV.start)*SV_PX;
  const hd = $I('sv-hd');
  hd.innerHTML = `<div class="sv-corner">시간</div>` + SV.days.map((dy,ci)=>
    `<div class="sv-dh" style="width:calc((100% - 56px)/${n})">
      <input value="${esc(dy.label)}" data-day="${ci}" oninput="svDayLabel(${ci}, this.value)">
      <button class="ed-mini" onclick="svDelDay(${ci})" title="이 열 빼기">✕</button></div>`).join('');
  const ax = $I('sv-axis'); let a='';
  for(let m=Math.ceil(SV.start/60)*60; m<=SV.end; m+=60)
    a += `<div class="sv-hl" style="top:${(m-SV.start)*SV_PX}px">${svM2T(m)}</div>`;
  ax.innerHTML = a;
  const cols = $I('sv-cols');
  cols.style.height = H+'px';
  $I('sv-bd').style.height = H+'px';
  let inner='';
  for(let m=SV.start+10; m<SV.end; m+=10){
    const y=(m-SV.start)*SV_PX;
    inner += `<div class="sv-gl${m%60===0?' hr':''}" style="top:${y}px"></div>`;
  }
  for(let i=1;i<n;i++) inner += `<div class="sv-vl" style="left:${i/n*100}%"></div>`;
  inner += SV.cards.map(c=>svCardHTML(c,n)).join('');
  cols.innerHTML = inner;
  svPaintTray();
  svPaintCed();
}
/* 겹침 검사: 같은 요일 범위 + 시간 범위가 겹치는 다른 카드가 있는가 */
function svOverlap(card, ignoreId){
  const d1=card.d, w1=card.w||1;
  return SV.cards.some(o=>{
    if(o.id===ignoreId || o.id===card.id) return false;
    const d2=o.d, w2=o.w||1;
    const dayHit = d1 < d2+w2 && d2 < d1+w1;
    const timeHit = card.s < o.e && o.s < card.e;
    return dayHit && timeHit;
  });
}
/* 배치된 카드를 보관함으로 회수 */
function svToTray(id){
  const c=SV.cards.find(x=>x.id===id); if(!c) return;
  SVtray.push({id:svRid(), t:c.t||'', st:c.st||'', dur:Math.max(5,c.e-c.s), c:c.c|0});
  SV.cards=SV.cards.filter(x=>x.id!==id);
  if(SVsel===id) SVsel=null;
  svPaint();
  toast('카드를 보관함으로 옮겼어요');
}
function svCardHTML(c,n){
  const w=Math.max(1,Math.min(n-c.d,c.w||1));
  const top=(c.s-SV.start)*SV_PX, h=Math.max(7,(c.e-c.s)*SV_PX);
  const bg=SCH_COLORS[c.c||0]||'#fff';
  return `<div class="sv-card${SVsel===c.id?' sel':''}" data-id="${c.id}"
    style="left:calc(${c.d/n*100}% + 1px);width:calc(${w/n*100}% - 3px);top:${top}px;height:${h}px;background:${bg}">
    ${h>=34?`<span class="sv-ctm">${svM2T(c.s)}~${svM2T(c.e)} · ${svDur(c.e-c.s)}</span>`:''}
    <span class="sv-ctt">${esc(c.t||'(제목 없음)')}</span>
    ${(c.st&&h>=46)?`<span class="sv-cst">${esc(c.st)}</span>`:''}
    <div class="sv-rz" data-id="${c.id}"></div></div>`;
}
function svPaintTray(){
  const tr = $I('sv-tray');
  const fmt=m=>m>=60?(Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'')):m+'분';
  tr.innerHTML = SVtray.length
    ? `<div class="sv-trayhd">🗂 카드 보관함 <span class="fnp-cnt">${SVtray.length}장</span>
         <span class="sv-trayhint" style="margin-left:6px">표로 끌어다 놓으세요 · 배치된 카드는 우클릭하면 여기로 돌아와요</span></div>
       <div class="sv-traylist">${SVtray.map(c=>`
         <span class="sv-tcard" data-tid="${c.id}" style="background:${SCH_COLORS[c.c]||'#fff'}">
           <span class="sv-tcttl">${esc(c.t||'(제목 없음)')}${c.st?` <span class="sv-tcst">${esc(c.st)}</span>`:''}</span>
           <span class="sv-tcdur">${fmt(c.dur)}</span>
           <span class="sv-tdup" data-tdup="${c.id}" title="복제">⧉</span>
           <span class="sv-tdel" data-tdel="${c.id}">✕</span></span>`).join('')}</div>`
    : `<span class="sv-trayhint">🗂 카드 보관함 — 위에서 카드를 만들면 여기에 담겨요. 배치된 카드를 우클릭해도 여기로 돌아옵니다.</span>`;
}
function svPaintCed(){
  const box=$I('sv-ced'); if(!box) return;
  const c = SV.cards.find(x=>x.id===SVsel);
  if(!c){ box.style.display='none'; return; }
  box.style.display='flex';
  const ti=$I('sv-et'); if(document.activeElement!==ti) ti.value=c.t||'';
  const si=$I('sv-est'); if(si && document.activeElement!==si) si.value=c.st||'';
  $I('sv-ew').textContent=(c.w||1)+'일';
  $I('sv-etm').textContent=svM2T(c.s)+' ~ '+svM2T(c.e)+' ('+svDur(c.e-c.s)+')';
  $I('sv-edots').innerHTML = SCH_COLORS.map((col,i)=>
    `<span class="sv-dot${i===(c.c||0)?' on':''}" data-ec="${i}" style="background:${col||'#fff'}"></span>`).join('');
}

};
window.svRange = function(){

  SV.start=s; SV.end=e;
  SV.cards=SV.cards.filter(c=>c.e>s && c.s<e).map(c=>({...c,s:Math.max(s,c.s),e:Math.min(e,c.e)}));
  svPaint();
};

window.svDelDay = function(ci){

    let d=c.d, w=c.w||1;

window.svSpan = function(dir){

window.svToTraySel = function(){ if(SVsel) svToTray(SVsel); };

/* ── 포인터 드래그 (이동 · 길이 · 새로 그리기 · 대기 카드 배치) ── */
function svInit(){
  svPaint();
  if(!window.__svBound){
    window.__svBound = true;
    const mount=$I('modal-mount');
    mount.addEventListener('click', svClick);
    mount.addEventListener('input', e=>{
      if(!$I('sv-cols')) return;
      if(e.target.id==='sv-et'){ const c=SV.cards.find(x=>x.id===SVsel); if(c){ c.t=e.target.value; const el=document.querySelector(`.sv-card[data-id="${c.id}"] .sv-ctt`); if(el) el.textContent=c.t||'(제목 없음)'; } }
      if(e.target.id==='sv-est'){ const c=SV.cards.find(x=>x.id===SVsel); if(c){ c.st=e.target.value;
        const card=document.querySelector(`.sv-card[data-id="${c.id}"]`);
        let el=card?.querySelector('.sv-cst');
        if(el){ if(c.st) el.textContent=c.st; else el.remove(); }
        else if(card && c.st){ el=document.createElement('span'); el.className='sv-cst'; el.textContent=c.st;
          card.insertBefore(el, card.querySelector('.sv-rz')); } } }
    });
    mount.addEventListener('pointerdown', svDown);
    mount.addEventListener('contextmenu', e=>{
      if(!SV || !$I('sv-cols')) return;
      const el=e.target.closest('.sv-card');
      if(el){ e.preventDefault(); svToTray(el.dataset.id); }
    });
    window.addEventListener('pointermove', svMove);
    window.addEventListener('pointerup', svUp);
  }
}
function svClick(e){
  if(!SV || !$I('sv-cols')) return;
  const d1=e.target.closest('#sv-ndots .sv-dot');
  if(d1){ document.querySelectorAll('#sv-ndots .sv-dot').forEach(x=>x.classList.remove('on')); d1.classList.add('on'); return; }
  const d2=e.target.closest('#sv-edots .sv-dot');
  if(d2){ const c=SV.cards.find(x=>x.id===SVsel); if(c){ c.c=Number(d2.dataset.ec)||0; SVlastC=c.c; svPaint(); } return; }
  const du=e.target.closest('#sv-durs .sv-dur');
  if(du){ document.querySelectorAll('#sv-durs .sv-dur').forEach(x=>x.classList.remove('on')); du.classList.add('on'); $I('sv-cm').value=''; return; }
  const td=e.target.closest('[data-tdel]');
  if(td){ SVtray=SVtray.filter(x=>x.id!==td.dataset.tdel); svPaintTray(); return; }
  const tp=e.target.closest('[data-tdup]');
  if(tp){ const o=SVtray.find(x=>x.id===tp.dataset.tdup);
    if(o){ SVtray.push({id:svRid(),t:o.t,st:o.st||'',dur:o.dur,c:o.c}); svPaintTray(); } return; }
}
function svXY(e){
  const r=$I('sv-cols').getBoundingClientRect();
  const n=SV.days.length;
  const day=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n)));
  const min=SV.start+(e.clientY-r.top)/SV_PX;
  return {day,min,inside:e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};
}
function svDown(e){
  if(!SV || !$I('sv-cols')) return;
  const rz=e.target.closest('.sv-rz');
  if(rz){ const c=SV.cards.find(x=>x.id===rz.dataset.id); if(!c) return;
    SVdrag={mode:'resize',id:c.id,orig:{d:c.d,w:c.w||1,s:c.s,e:c.e}}; SVsel=c.id; e.preventDefault(); return; }
  const el=e.target.closest('.sv-card');
  if(el){ const c=SV.cards.find(x=>x.id===el.dataset.id); if(!c) return;
    const p=svXY(e);
    SVdrag={mode:'move',id:c.id,offMin:p.min-c.s,offDay:p.day-c.d,moved:false,orig:{d:c.d,w:c.w||1,s:c.s,e:c.e}};
    e.preventDefault(); return; }
  const tc=e.target.closest('.sv-tcard');
  if(tc && !e.target.closest('[data-tdel]')){
    const t=SVtray.find(x=>x.id===tc.dataset.tid); if(!t) return;
    const g=document.createElement('div'); g.className='sv-ghost'; g.textContent=t.t||'(제목 없음)';
    g.style.background=SCH_COLORS[t.c]||'#fff'; document.body.appendChild(g);
    SVdrag={mode:'tray',tray:t,ghost:g}; svGhost(e); e.preventDefault(); return; }
  if(e.target.id==='sv-cols' || e.target.classList.contains('sv-gl') || e.target.classList.contains('sv-vl')){
    const p=svXY(e); if(!p.inside) return;
    const fine=e.ctrlKey||e.metaKey;
    const s=Math.max(SV.start,Math.min(SV.end-5,svSnap(p.min,fine)));
    const c={id:svRid(),d:p.day,w:1,s,e:s+10,t:'',c:SVlastC,_tmp:true};
    SV.cards.push(c);
    SVdrag={mode:'draw',id:c.id,anchor:s,did:false};
    svPaint(); e.preventDefault();
  }
}
function svGhost(e){
  if(SVdrag&&SVdrag.ghost){ SVdrag.ghost.style.left=(e.clientX+10)+'px'; SVdrag.ghost.style.top=(e.clientY+8)+'px'; }
}
function svMove(e){
  if(!SVdrag||!SV||!$I('sv-cols')){ if(SVdrag&&SVdrag.ghost) svGhost(e); return; }
  const fine=e.ctrlKey||e.metaKey;
  if(SVdrag.mode==='tray'){ svGhost(e); return; }
  const c=SV.cards.find(x=>x.id===SVdrag.id); if(!c) return;
  const p=svXY(e);
  if(SVdrag.mode==='move'){
    SVdrag.moved=true;
    const len=c.e-c.s;
    let ns=svSnap(p.min-SVdrag.offMin,fine);
    ns=Math.max(SV.start,Math.min(SV.end-len,ns));
    c.s=ns; c.e=ns+len;
    c.d=Math.max(0,Math.min(SV.days.length-(c.w||1),p.day-SVdrag.offDay));
  } else if(SVdrag.mode==='resize'){
    let ne=svSnap(p.min,fine);
    c.e=Math.max(c.s+5,Math.min(SV.end,ne));
  } else if(SVdrag.mode==='draw'){
    SVdrag.did=true;
    let v=svSnap(p.min,fine);
    c.s=Math.max(SV.start,Math.min(SVdrag.anchor,v));
    c.e=Math.min(SV.end,Math.max(SVdrag.anchor+5,v));
    if(c.e-c.s<5) c.e=c.s+5;
  }
  svLive(c);
}
function svLive(c){
  const el=document.querySelector(`.sv-card[data-id="${c.id}"]`); if(!el) return;
  el.classList.toggle('bad', svOverlap(c, c.id));
  const n=SV.days.length, w=Math.max(1,Math.min(n-c.d,c.w||1));
  el.style.left=`calc(${c.d/n*100}% + 1px)`;
  el.style.width=`calc(${w/n*100}% - 3px)`;
  el.style.top=(c.s-SV.start)*SV_PX+'px';
  el.style.height=Math.max(7,(c.e-c.s)*SV_PX)+'px';
  const tm=el.querySelector('.sv-ctm'); if(tm) tm.textContent=svM2T(c.s)+'~'+svM2T(c.e)+' · '+svDur(c.e-c.s);
  const et=$I('sv-etm'); if(et&&SVsel===c.id) et.textContent=svM2T(c.s)+' ~ '+svM2T(c.e)+' ('+svDur(c.e-c.s)+')';
}
function svUp(e){
  if(!SVdrag) return;
  if(!SV||!$I('sv-cols')){ if(SVdrag.ghost) SVdrag.ghost.remove(); SVdrag=null; return; }
  const drag=SVdrag; SVdrag=null;
  if(drag.mode==='tray'){
    drag.ghost.remove();
    const p=svXY(e);
    if(p.inside){
      const fine=e.ctrlKey||e.metaKey;
      let s=Math.max(SV.start,Math.min(SV.end-drag.tray.dur,svSnap(p.min,fine)));
      const c={id:svRid(),d:p.day,w:1,s,e:Math.min(SV.end,s+drag.tray.dur),t:drag.tray.t,st:drag.tray.st||'',c:drag.tray.c};
      if(svOverlap(c,null)){ toast('그 자리에 이미 카드가 있어요 — 빈 곳에 놓아 주세요.','err'); }
      else { SV.cards.push(c); SVtray=SVtray.filter(x=>x.id!==drag.tray.id); SVsel=c.id; }
    }
    svPaint(); return;
  }
  const cc=SV.cards.find(x=>x.id===drag.id);
  if(cc && (drag.mode==='move'||drag.mode==='resize') && drag.moved!==false && svOverlap(cc,cc.id)){
    if(drag.mode==='move'&&!drag.moved){ SVsel=drag.id; svPaint(); return; }
    Object.assign(cc, drag.orig);                      // 겹치면 원래 자리로
    toast('그 자리에 이미 카드가 있어요 — 원래 자리로 돌아갔어요.','err');
  }
  else if(cc && drag.mode==='draw'){
    SV.cards=SV.cards.filter(x=>x.id!==cc.id);              // 미리보기 제거
    if(!drag.did){ svPaint(); return; }                     // 단순 클릭 = 아무 일 없음
    if(svOverlap(cc,cc.id)){ toast('그 자리에 이미 카드가 있어요.','err'); svPaint(); return; }
    svPaint();
    svConfirmNew(cc);                                        // 물어보고 생성
    return;
  }
  else if(drag.mode==='move'&&!drag.moved){ SVsel=drag.id; }   // 클릭 = 선택
  svPaint();
}

/* ═══════════════════════════════════════════
   ✨ 입력 도우미 — 달력 · 인솔교사 · 재학생 명단
   ═══════════════════════════════════════════ */
const KDAY = ['일','월','화','수','목','금','토'];
function fnFmtRange(a,b){
  const D1=new Date(a+'T00:00'), D2=new Date(b+'T00:00');
  if(isNaN(D1)||isNaN(D2)) return '';
  const w=d=>KDAY[d.getDay()];
  const nights=Math.round((D2-D1)/86400000);
  if(nights<0) return '';
  const head=`${D1.getFullYear()}. ${D1.getMonth()+1}. ${D1.getDate()}. (${w(D1)})`;
  if(nights===0) return `${head} / 당일`;
  const sameY=D1.getFullYear()===D2.getFullYear();
  const tail=`${sameY?'':D2.getFullYear()+'. '}${D2.getMonth()+1}. ${D2.getDate()}. (${w(D2)})`;
  return `${head} ~ ${tail} / ${nights}박 ${nights+1}일`;
}
function fnFmtDate(a){
  const D=new Date(a+'T00:00'); if(isNaN(D)) return '';
  return `${D.getMonth()+1}월 ${D.getDate()}일 (${KDAY[D.getDay()]})`;
}
function fnFill(ta,v){
  if(!ta||!v) return;
  ta.value=v;
  ta.dispatchEvent(new Event('input',{bubbles:true}));   // 자동 저장 트리거
}

/* ═══ 기간 일괄 연동: 표지 · 일반 계획 · 시간 계획 ═══ */
function fnParsePeriod(v){
  const ds=[...String(v||'').matchAll(/(?:(\d{4})\.\s*)?(\d{1,2})\.\s*(\d{1,2})\.?/g)]
    .map(m=>({y:m[1]?+m[1]:null,mo:+m[2],d:+m[3]}));
  if(!ds.length) return null;
  const y0=ds[0].y||new Date().getFullYear();
  const A=new Date(y0,ds[0].mo-1,ds[0].d);
  let B=A;
  if(ds.length>1){
    let y1=ds[1].y||y0;
    B=new Date(y1,ds[1].mo-1,ds[1].d);
    if(B<A && !ds[1].y) B=new Date(y0+1,ds[1].mo-1,ds[1].d);
    if(B<A) B=A;
  }
  return [A,B];
}
/* 시간 계획의 요일 열을 기간에 맞춰 다시 짠다 (배치된 카드는 최대한 보존) */
function fnSyncScheduleData(d, A, B){
  const n = Math.min(14, Math.round((B-A)/86400000)+1);
  const days=[];
  for(let i=0;i<n;i++){
    const t=new Date(A.getTime()+i*86400000);
    days.push({label:`${t.getMonth()+1}월 ${t.getDate()}일 (${KDAY[t.getDay()]})`});
  }
  const cards=(d.cards||[]).filter(c=>c.d<n).map(c=>({...c, w:Math.min(c.w||1, n-c.d)}));
  return {...d, days, cards};
}

/* 재학생 명단 선택 — 반별 그룹 · 현재 재학생 실시간 로드 */
let FN_STUDENTS=null, FN_CLASSES=null;
async function fnLoadRoster(){
  if(FN_STUDENTS) return;
  const [ss,cs]=await Promise.all([getDocs(collection(db,'students')),getDocs(collection(db,'classes'))]);
  FN_STUDENTS=ss.docs.map(d=>({id:d.id,...d.data()}))
    .filter(x=>x.org===CUR.org && (x.status||'active')==='active')
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
  FN_CLASSES=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.org===CUR.org);
}
/* 행사 기간 파싱: "2026. 9. 2. (수) ~ 9. 4. (금) / 2박 3일" → [시작, 끝] (YYYY-MM-DD) */
function fnEventRange(){
  const row=[...document.querySelectorAll('#kv-rows .ed-row')].find(r=>
    /일정|기간/.test(r.querySelector('[data-f="k"]')?.value||''));
  const v=row?.querySelector('[data-f="v"]')?.value||'';
  const ds=[...v.matchAll(/(?:(\d{4})\.\s*)?(\d{1,2})\.\s*(\d{1,2})\.?/g)]
    .map(m=>({y:m[1]?+m[1]:null,mo:+m[2],d:+m[3]}));
  if(!ds.length){ const t=new Date(); const s=t.toISOString().slice(0,10); return [s,s]; }
  let y0=ds[0].y || new Date().getFullYear();
  const pad=n=>String(n).padStart(2,'0');
  const a=`${y0}-${pad(ds[0].mo)}-${pad(ds[0].d)}`;
  if(ds.length<2) return [a,a];
  let y1=ds[1].y || y0;
  let b=`${y1}-${pad(ds[1].mo)}-${pad(ds[1].d)}`;
  if(b<a && !ds[1].y){ y1=y0+1; b=`${y1}-${pad(ds[1].mo)}-${pad(ds[1].d)}`; }
  return [a, b<a?a:b];
}
window.fnPickStudents = async function(cb){
  toast('재학생 명단 불러오는 중…');
  try { await fnLoadRoster(); } catch(e){ toast('명단 로드 실패: '+e.message,'err'); return; }
  const [evS, evE] = fnEventRange();
  // 행사 기간과 겹치는 휴학 판정
  const onLeaveInEvent = st=>{
    if(['quit','grad','egrad'].includes(st.status)) return true;              // 자퇴·졸업은 항상 제외
    const hit = (st.leaves||[]).some(lv=>lv.start&&lv.end&&lv.start<=evE&&evS<=lv.end);
    if(hit) return true;
    if(st.status==='leave' && !(st.leaves||[]).length) return true;          // 기간 정보 없는 휴학
    return false;
  };
  const excluded = FN_STUDENTS.filter(onLeaveInEvent);
  const avail = FN_STUDENTS.filter(st=>!onLeaveInEvent(st));
  const cls=sid=>FN_CLASSES.find(c=>(c.students||[]).includes(sid))||null;
  const gradeOf=sid=>{ const c=cls(sid); if(!c) return '';
    return (c.grades&&c.grades[sid])||c.grade||''; };
  const groups={};
  avail.forEach(st=>{ const k=gradeOf(st.id)||'학년 미지정';
    (groups[k]=groups[k]||[]).push(st); });
  const gkeys=Object.keys(groups).sort((a,b)=>{
    if(a==='학년 미지정') return 1; if(b==='학년 미지정') return -1;

function fnEventTeachers(){
  const kvB = CUR.blocks.find(b=>b.type==='kv' && (b.data?.rows||[]).some(r=>/교사|인솔/.test(r.k||'')));
  const row = kvB ? (kvB.data.rows||[]).find(r=>/교사|인솔/.test(r.k||'')) : null;
  const v = String(row?.v||'').split('(')[0];          // "(남 2 · 여 5)" 꼬리 제거
  return [...new Set(v.split(',').map(x=>x.trim()).filter(Boolean))];
}

async function agInit(){
  const seed = window.__agSeed || {kind:'team',units:[]};
  try { await fnLoadRoster(); } catch(e){ toast('명단 로드 실패: '+e.message,'err'); }
  const rosterIds = CUR.blocks.find(x=>x.key==='fnRoster')?.data?.ids || [];
  const all = rosterIds.map(agStuOf).filter(Boolean);
  const units = (seed.units||[]).map(u=>({ ...u, id:u.id||agRid(),
    students:(u.students||[]).map(sv=> all.find(a=>a.id===sv.id) || sv) }));
  const used = new Set(units.flatMap(u=>u.students.map(x=>x.id)));
  try { await loadStaffList(); } catch(e){}
  const tnames = fnEventTeachers();
  AG = { kind:seed.kind||'team', units,
    pool: all.filter(x=>!used.has(x.id)), sel:null,
    teachers: tnames.map(n=>{ const t=STAFF?.find(x=>x.name===n);
      return { n, g:t?.gender||'', uid:t?.uid||'' }; }) };
  if(!rosterIds.length) toast('먼저 일반 계획의 👥 도우미로 「참가 학생 명단」을 만들어 주세요.','err');
  agPaint();
}

function agUnitTch(u){

function agAssignedTch(){

window.agSetDriver = function(uid, name){

window.agTeacherTo = function(name, uid){
  AG.units.forEach(u=>{
    const arr=String(u.tN||'').split(',').map(x=>x.trim()).filter(Boolean).filter(n=>n!==name);
    u.tN=arr.join(', ');
    if(u.drvN===name) u.drvN='';                     // 운전자였다면 함께 해제
  });
  if(uid){
    const u=AG.units.find(x=>x.id===uid); if(!u) return;
    const arr=String(u.tN||'').split(',').map(x=>x.trim()).filter(Boolean);
    arr.push(name); u.tN=[...new Set(arr)].join(', ');
  }
  agPaint(); saveDraft();
};
function agCap(u){  // 차량: 운전자·교사 포함 사용 인원 (운전자가 교사 카드로 배치돼 있으면 중복 합산 안 함)
  const list = String(u.tN||'').split(',').map(x=>x.trim()).filter(Boolean);
