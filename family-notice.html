window.agSel = function(ev, from, sid){
  if(window.__agDragMoved){ window.__agDragMoved=false; return; }   // 드래그 직후의 클릭은 무시
  if(!AG.selSet) AG.selSet = new Set();
  if(ev && (ev.metaKey || ev.ctrlKey)){
    if(AG.selSet.has(sid)) AG.selSet.delete(sid); else AG.selSet.add(sid);   // ⌘/Ctrl: 여러 명 담기
  } else {
    if(AG.selSet.size===1 && AG.selSet.has(sid)) AG.selSet.clear();
    else { AG.selSet.clear(); AG.selSet.add(sid); }
  }
  AG.sel = AG.selSet.size ? {sid:[...AG.selSet][0]} : null;   // (하위 호환)
  agPaint();
};
/* 선택된 학생들을 찾아 (풀·조 어디에 있든) 대상으로 옮긴다 — uid=null이면 미배정으로 */
function agMoveSelTo(uid, dragSid){
  if(!AG.selSet) AG.selSet = new Set();
  if(dragSid && !AG.selSet.has(dragSid)){ AG.selSet.clear(); AG.selSet.add(dragSid); }
  const sids=[...AG.selSet];
  if(!sids.length) return false;
  const target = uid ? AG.units.find(x=>x.id===uid) : null;
  if(uid && !target) return false;
  // 이미 대상 안에 있는 학생은 제외
  const moving = sids.filter(sid=> uid
    ? !(target.students.some(x=>x.id===sid))
    : !(AG.pool.some(x=>x.id===sid)));
  if(!moving.length){ AG.selSet.clear(); agPaint(); return false; }
  if(AG.kind==='vehicle' && target && target.cap && agCap(target)+moving.length > target.cap){
    toast(`정원 초과예요 — ${target.name||'이 차량'}은 ${target.cap}명(운전자·교사 포함)까지라 ${moving.length}명을 넣을 수 없어요.`,'err');
    return false;
  }
  const taken=[];
  moving.forEach(sid=>{
    let i=AG.pool.findIndex(x=>x.id===sid);
    if(i>=0){ taken.push(AG.pool.splice(i,1)[0]); return; }
    for(const u of AG.units){
      i=u.students.findIndex(x=>x.id===sid);
      if(i>=0){ taken.push(u.students.splice(i,1)[0]); return; }
    }
  });
  taken.forEach(st=>{ st._warn=false;
    if(target) target.students.push(st);
    else AG.pool.push(st);
  });
  if(!target) AG.pool.sort((a,b)=>a.n.localeCompare(b.n,'ko'));
  AG.selSet.clear(); AG.sel=null;
  agPaint(); saveDraft();
  return true;
}
window.agDrop = function(uid){ agMoveSelTo(uid, null); };
/* ── 카드 드래그 앤 드롭 (다중 선택 함께 이동) ── */
(function(){
  let dr=null, ghost=null;
  const clearHover=()=>document.querySelectorAll('.ag-unit.dropover,.ag-pool.dropover')
    .forEach(el=>el.classList.remove('dropover'));
  document.addEventListener('pointerdown', e=>{
    const chip=e.target.closest('.ag-stu,.ag-tch');
    if(!chip || !chip.closest('.ag-wrap') || e.target.closest('i') || e.target.closest('.gd-edit')) return;
    if(chip.classList.contains('ag-tch'))
      dr={ tname:chip.dataset.tname, x:e.clientX, y:e.clientY, moved:false };
    else
      dr={ sid:chip.dataset.sid, x:e.clientX, y:e.clientY, moved:false };
  });
  document.addEventListener('pointermove', e=>{
    if(!dr) return;
    if(!dr.moved){
      if(Math.hypot(e.clientX-dr.x, e.clientY-dr.y) < 6) return;
      dr.moved=true; window.__agDragMoved=true;
      let label='이동';
      if(dr.tname){ label='🎩 '+dr.tname; }
      else {
        const n = (AG?.selSet?.has(dr.sid) && AG.selSet.size>1) ? AG.selSet.size : 1;
        const st = [...(AG?.pool||[]), ...(AG?.units||[]).flatMap(u=>u.students)].find(x=>x.id===dr.sid);
        label = n>1 ? `${n}명 이동` : (st?st.n:'이동');
      }
      ghost=document.createElement('div');
      ghost.className='ag-ghost';
      ghost.textContent = label;
      document.body.appendChild(ghost);
      document.body.style.userSelect='none';
    }
    ghost.style.left=(e.clientX+12)+'px'; ghost.style.top=(e.clientY+10)+'px';
    clearHover();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const unit=el && el.closest('.ag-unit');
    const pool=el && el.closest('.ag-pool');
    if(unit) unit.classList.add('dropover');
    else if(pool) pool.classList.add('dropover');
  });
  document.addEventListener('pointerup', e=>{
    if(!dr) return;
    const wasDrag=dr.moved; const sid=dr.sid; const tname=dr.tname; dr=null;
    if(ghost){ ghost.remove(); ghost=null; }
    document.body.style.userSelect='';
    clearHover();
    if(!wasDrag) return;                             // 클릭은 agSel이 처리
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const unit=el && el.closest('.ag-unit');
    const pool=el && el.closest('.ag-pool');
    if(tname){                                       // 🎩 선생님 카드
      if(unit) agTeacherTo(tname, unit.dataset.uid);
      else if(pool) agTeacherTo(tname, null);
    } else if(unit){
      agMoveSelTo(unit.dataset.uid, sid);
    } else if(pool){
      agMoveSelTo(null, sid);                        // 풀로 끌면 미배정 복귀
    }
    setTimeout(()=>{ window.__agDragMoved=false; }, 50);
  });
})();

window.agAutoAsk = function(){
  const n = Number(prompt('몇 개 조로 나눌까요?', AG.units.length||6));
  if(!n || n<1 || n>30) return;
  const all=[...AG.pool, ...AG.units.flatMap(u=>u.students)];
  all.forEach(x=>x._warn=false);
  all.sort((a,b)=> String(a.g).localeCompare(String(b.g),'ko',{numeric:true}) || String(a.x).localeCompare(String(b.x)) || a.n.localeCompare(b.n,'ko'));
  AG.units = [...Array(n)].map((_,i)=>({ id:agRid(), name:`${i+1}조`, tN:AG.units[i]?.tN||'', students:[] }));
  all.forEach((st,i)=>{
    const round=Math.floor(i/n), pos=i%n;
    AG.units[ round%2 ? n-1-pos : pos ].students.push(st);   // 스네이크
  });
  AG.pool=[]; agPaint(); saveDraft();
  toast(`${n}개 조로 초안을 나눴어요 — 드래그 없이 클릭으로 미세 조정하세요`);
};

/* 어떤 블록이든 지금 편집창의 내용을 읽어온다 (저장·임시저장 공용) */
function readBlockData(b){
  try {
    if(b.type === 'cover'){
      if(!$I('cv-big')) return null;
      return cvReadForm();
    }
    if(b.type === 'text'){
      if(!$I('tx-body')) return null;
      return { body:$I('tx-body').value, red:$I('tx-red').value.trim() };
    }
    if(b.type === 'kv'){
      if(!$I('kv-rows')) return null;
      const rows = [...document.querySelectorAll('#kv-rows .ed-row')].map(r=>({
        k:r.querySelector('[data-f="k"]').value.trim(),
        v:r.querySelector('[data-f="v"]').value
      })).filter(r=>r.k||r.v);
      return { rows, note:$I('kv-note').value.trim() };
    }
    if(b.type === 'table'){
      const t = $I('tb-tbl'); if(!t) return null;
      const cols = [...t.rows[0].querySelectorAll('input')].map(i=>i.value.trim());
      const rows = [...t.rows].slice(1).map(tr=>({
        c:[...tr.querySelectorAll('td.tb-cell')].map(td=>
          td.classList.contains('tb-merged') ? TB_MERGE : (td.querySelector('input')?.value||''))
      })).filter(r=>r.c.some(x=>x.trim()));
      return { cols, rows, note:$I('tb-note').value.trim() };
    }
    if(b.type === 'budget'){ return $I('bg-people') ? readBudget() : null; }
    if(b.type === 'schedule'){ return (SV && $I('sv-cols')) ? readSchedule() : null; }
    if(b.type === 'assign'){
      if(!AG || !$I('ag-units')) return null;
      return { kind:AG.kind, info:$I('ag-info')?.value.trim()||'',
        units:AG.units.map(u=>({ id:u.id, name:(u.name||'').trim(), tN:u.tN||'',
          cap:u.cap||0, drvN:u.drvN||'', gender:u.gender||'', label:u.label||'', memo:u.memo||'',
          students:u.students.map(x=>({id:x.id,n:x.n,g:x.g,x:x.x})) })),
        note:$I('ag-note')?.value.trim()||'' };
    }
  } catch(e){ return null; }
  return null;
}

const draftKey = i => `famdraft:${CUR?.id||'x'}:${i}`;
function saveDraft(){
  if(EB < 0 || !CUR || !CUR.blocks[EB] || !$I('eb-title')) return;
  const data = readBlockData(CUR.blocks[EB]);
  if(data == null) return;
  try {
    localStorage.setItem(draftKey(EB), JSON.stringify({
      t: Date.now(), title: $I('eb-title').value.trim(), data }));
    const el=$I('draft-state');
    if(el) el.textContent='임시 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e){}
}
function getDraft(i){
  try { const v=localStorage.getItem(draftKey(i)); return v?JSON.parse(v):null; } catch(e){ return null; }
}
function clearDraft(i){ try { localStorage.removeItem(draftKey(i)); } catch(e){} }
let _draftTimer=null;
function bindAutosave(){
  if(window.__fnAutoBound) return;
  window.__fnAutoBound = true;
  const mount=$I('modal-mount');
  const kick=()=>{ clearTimeout(_draftTimer); _draftTimer=setTimeout(saveDraft, 1200); };

  mount.addEventListener('change', kick);
  mount.addEventListener('pointerup', ()=>{ if(EB>=0 && SV) kick(); });  // 시간 카드 드래그 후에도
  setInterval(()=>{ if(EB>=0 && $I('eb-title')) saveDraft(); }, 20000);  // 20초 보험
}

  const html = STAFF.filter(t=>t.uid!==CUR.ownerUid).map(t=>`
    <label class="pick ${eds.includes(t.uid)?'on':''}">
      <input type="checkbox" value="${t.uid}" ${eds.includes(t.uid)?'checked':''}
        onchange="this.closest('.pick').classList.toggle('on',this.checked)">
      <span>${esc(t.name||'')}</span><small>${esc(t.dept||'')}</small>
    </label>`).join('');
  openModal(`
    <div class="mtitle">👥 담당자 지정</div>
    <div class="msub">입력 담당자는 내용 입력 + 협력자 지정 + 발행·삭제까지,
      협력 담당자는 <b>내용 입력·수정만</b> 할 수 있어요.</div>
    ${ownerSel}
    <div class="frow"><label class="flab">협력 담당자 (여러 명 가능)</label>
      <div class="pick-grid" id="mg-grid">${html}</div></div>
    <div class="mfoot">
      <button class="btn gray" onclick="closeModal()">취소</button>
      <button class="btn" onclick="saveMgrs()">저장</button>
    </div>`, true);
};
window.saveMgrs = async function(){
  const editors = [...document.querySelectorAll('#mg-grid input:checked')].map(i=>i.value);
  const editorNames = editors.map(u=>STAFF.find(t=>t.uid===u)?.name||'');
  const upd = { editors, editorNames };
  if(canFamAdmin() && $I('mg-owner')){
    upd.ownerUid = $I('mg-owner').value;
    upd.ownerName = STAFF.find(t=>t.uid===upd.ownerUid)?.name||'';
  }
  try {
    await persist(upd);
    closeModal(); toast('담당자를 저장했어요'); renderEdit();
    logAct('managers', editorNames.join(','));
  } catch(e){ toast('저장 실패: '+e.message,'err'); }
};

/* ═══════════════════════════════════════════
   발행 (학부모 링크 · 게시판)
   ═══════════════════════════════════════════ */
function shareUrl(id){
  return location.href.replace(/[^/]*$/, '') + 'share-family.html?id=' + id;
}
window.openPublishModal = function(){
  if(!canOwn(CUR)) return;
  const pubCount = CUR.blocks.filter(b=>b.pub).length;
  const inCount = CUR.blocks.length - pubCount;
  const link = CUR.shareId ? shareUrl(CUR.shareId) : '';
  openModal(`
    <div class="mtitle">🔗 발행</div>
    <div class="msub">「학부모 공개」 블록 <b>${pubCount}개</b>만 링크에 나갑니다.
      (내부용 ${inCount}개는 빠져요) — 발행 후 내용을 고치면 다시 발행해야 링크에 반영됩니다.</div>
    <label class="pick" style="margin-bottom:10px ${''}">
      <input type="checkbox" id="pb-list" ${CUR.listed?'checked':''}>
      <span>학부모 게시판 목록에도 올리기 <small style="margin-left:6px">(share-family.html 첫 화면 목록)</small></span>
    </label>
    ${link?`<div class="linkbox"><span class="lk">${esc(link)}</span>
      <button class="btn line sm" onclick="copyLink()">복사</button></div>`:''}
    <div class="mfoot">
      <button class="btn gray" onclick="closeModal()">취소</button>
      <button class="btn" onclick="doPublish()">${CUR.publishedAt?'다시 발행':'발행하기'}</button>
    </div>`);
};
window.doPublish = async function(){
  const listed = $I('pb-list').checked;
  const shareId = CUR.shareId || rid(20);
  const pubBlocks = CUR.blocks.filter(b=>b.pub);
  try {
    await setDoc(doc(db,'sharedFamily', shareId), {
      docId:CUR.id, title:CUR.title||'', org:CUR.org||'daniel',
      blocksJson: JSON.stringify(pubBlocks),
      publishedAt:Timestamp.now(), listed
    });
    // 학부모 게시판 목록 (_index)
    try {
      const ix = await getDoc(doc(db,'sharedFamily','_index'));
      let items = ix.exists() && Array.isArray(ix.data().items) ? ix.data().items : [];
      items = items.filter(it=>it.id !== shareId);
      if(listed) items.unshift({ id:shareId, title:CUR.title||'', org:CUR.org||'daniel', at:Date.now() });
      await setDoc(doc(db,'sharedFamily','_index'), { items });
    } catch(e){ console.warn('index update fail', e); }
    // 원본 문서 갱신 + 이전 판 보관
    await persist({ shareId, listed, publishedAt:Timestamp.now() });
    try {
      await addDoc(collection(db,'famRevisions'), {
        docId:CUR.id, title:CUR.title||'',
        blocksJson: JSON.stringify(CUR.blocks),
        at:Timestamp.now(), byUid:CU.uid, byName:CU.name||''
      });
    } catch(e){}
    closeModal();
    logAct('publish', listed?'게시판 포함':'링크만');
    renderEdit();
    // 발행 완료 + 링크 안내
    const link = shareUrl(shareId);
    openModal(`
      <div class="mtitle">✅ 발행 완료</div>
      <div class="msub">이 링크를 학부모께 전달하세요. (카카오톡 공유 가능)</div>
      <div class="linkbox"><span class="lk">${esc(link)}</span>
        <button class="btn line sm" onclick="copyLink()">복사</button></div>
      <div class="mfoot"><button class="btn" onclick="closeModal()">확인</button></div>`);
  } catch(e){ toast('발행 실패: '+e.message,'err'); }
};
window.copyLink = function(){
  if(!CUR?.shareId) return;
  const link = shareUrl(CUR.shareId);
  navigator.clipboard?.writeText(link)
    .then(()=>toast('링크를 복사했어요'))
    .catch(()=>{ prompt('링크를 직접 복사하세요', link); });
};

/* ═══════════════════════════════════════════
   인쇄
   ═══════════════════════════════════════════ */
window.openPrintModal = function(){
  openModal(`
    <div class="mtitle">🖨 인쇄</div>
    <div class="frow"><label class="flab">범위</label>
      <select class="fsel" id="pr-scope">
        <option value="all">전체 (내부용 블록 포함) — 교사·학생 배부용</option>
        <option value="pub">학부모 공개 블록만</option>
      </select></div>
    <div class="msub">A4 세로 기준입니다. 표지 블록이 있으면 첫 장 전체를 차지해요.</div>
    <div class="mfoot">
      <button class="btn gray" onclick="closeModal()">취소</button>
      <button class="btn" onclick="doPrint()">인쇄</button>
    </div>`);
};
window.doPrint = function(){
  const scope = $I('pr-scope').value;
  closeModal();
  const blocks = CUR.blocks.filter(b=>scope==='all' || b.pub);
  let html = '';
  blocks.forEach(b=>{
    const body = renderBlock(b);
    if(!body) return;
    if(b.type === 'cover'){
      html += `<div class="pcover">${body}</div>`;   // 시안·로고 그대로 인쇄
    } else {
      html += `<div class="pblk"><div class="ph">${esc(b.title||'')}</div>${body}</div>`;
    }
  });
  html += `<div class="pfoot">${esc(ORG_L[CUR.org]||'')} · ${esc(CUR.title||'')}</div>`;
  $I('printArea').innerHTML = html;
  document.body.classList.add('pr');
  setTimeout(()=>{
    window.print();
    setTimeout(()=>document.body.classList.remove('pr'), 400);
  }, 60);
};

/* ═══════════════════════════════════════════
   이전 판 · 복제 · 삭제
   ═══════════════════════════════════════════ */
window.openRevisions = async function(){
  if(!canOwn(CUR)) return;
  toast('이전 판 불러오는 중…');
  try {
    const snap = await getDocs(query(collection(db,'famRevisions'), where('docId','==',CUR.id)));
    const revs = snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.at?.toMillis?.()||0)-(a.at?.toMillis?.()||0));
    const rows = revs.map(r=>`<tr>
      <td>${dtStr(r.at)} ${r.auto?'<span class="pill gray">자동</span>':'<span class="pill ok">발행</span>'}</td>
      <td>${esc(r.byName||'')}</td>
      <td class="c"><button class="btn line sm" onclick="restoreRev('${r.id}')">이 판으로 복원</button></td>
    </tr>`).join('');
    openModal(`
      <div class="mtitle">🕰 이전 판 (발행·저장 시 자동 보관)</div>
      <div class="tblwrap"><table class="famtbl">
        <tr><th>보관 시각</th><th>저장한 사람</th><th class="c"></th></tr>
        ${rows || '<tr><td colspan="3" style="text-align:center;color:var(--tl);padding:20px">보관된 판이 없어요 — 처음 발행하면 생깁니다.</td></tr>'}
      </table></div>
      <div class="mfoot"><button class="btn gray" onclick="closeModal()">닫기</button></div>`, true);
    window._REVS = revs;
  } catch(e){ toast('불러오기 실패: '+e.message,'err'); }
};
window.restoreRev = async function(rid_){
  const r = (window._REVS||[]).find(x=>x.id===rid_);
  if(!r) return;
  if(!confirm('이 판의 내용으로 되돌릴까요?\n지금 내용은 사라집니다. (발행본은 그대로 — 다시 발행해야 반영)')) return;
  CUR.blocks = (()=>{ try { return JSON.parse(r.blocksJson||'[]'); } catch(e){ return []; } })();
  await persistBlocks();
  closeModal(); renderEdit(); toast('복원했어요 — 확인 후 다시 발행해 주세요');
  logAct('restore', dtStr(r.at));
};
window.dupDoc = async function(){
  if(!canFamAdmin()) return;
  if(!confirm(`「${CUR.title}」 통신문을 복제할까요?\n(작년 것 → 올해 것 만들 때 편해요)`)) return;
  try {
    const ref = await addDoc(collection(db,'famDocs'), {
      title:(CUR.title||'')+' (복사본)', type:CUR.type||'free', org:CUR.org||'daniel',
      ownerUid:CU.uid, ownerName:CU.name||'',
      editors:[], editorNames:[],
      blocksJson: JSON.stringify(CUR.blocks),
      shareId:'', listed:false,
      createdAt:Timestamp.now(), updatedAt:Timestamp.now(), updatedBy:CU.name||''
    });
    toast('복제했어요');
    await loadDocs();
    openDoc(ref.id);
  } catch(e){ toast('복제 실패: '+e.message,'err'); }
};
window.delDoc = async function(){
  if(!canOwn(CUR)) return;
  if(!confirm(`「${CUR.title}」 통신문을 삭제할까요?\n발행된 학부모 링크도 함께 사라집니다.`)) return;
  try {
    if(CUR.shareId){
      try { await deleteDoc(doc(db,'sharedFamily', CUR.shareId)); } catch(e){}
      try {
        const ix = await getDoc(doc(db,'sharedFamily','_index'));
        if(ix.exists()){
          const items = (ix.data().items||[]).filter(it=>it.id !== CUR.shareId);
          await setDoc(doc(db,'sharedFamily','_index'), { items });
        }
      } catch(e){}
    }
    await deleteDoc(doc(db,'famDocs', CUR.id));
    logAct('delete', CUR.title||'');
    toast('삭제했어요');
    backToList();
  } catch(e){ toast('삭제 실패: '+e.message,'err'); }
};

/* ═══ 모달 공용 ═══ */
window.openModal = function(html, wide, lock){
  const cls = wide===true ? 'wide' : (wide||'');
  $I('modal-mount').innerHTML = `<div class="mbk" onclick="if(event.target===this${lock?" && false":""})closeModal()">
    <div class="mbox ${cls}">${html}</div></div>`;
};
window.closeModal = function(){ $I('modal-mount').innerHTML = ''; };
/* 2층 모달 — 편집창 위에 겹쳐 뜨는 보조 창 (달력·교사·학생 선택) */
window.openModal2 = function(html){
  $I('modal-mount2').innerHTML = `<div class="mbk" style="z-index:400" onclick="if(event.target===this)closeModal2()">
    <div class="mbox">${html}</div></div>`;
};
window.closeModal2 = function(){ $I('modal-mount2').innerHTML = ''; };
/* sidebar.js가 모든 팝업에 붙이는 ✕ 버튼용 — 맨 위층부터 제대로 닫는다
   (이게 없으면 흰 상자만 지워지고 어두운 배경이 남아 화면이 멈춘 것처럼 보인다) */
window.closeMod = function(){
  if($I('modal-mount2').innerHTML) closeModal2();
  else closeModal();
};
</script>
