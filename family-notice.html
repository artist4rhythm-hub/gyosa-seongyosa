<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가정통신문 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
<style>
:root{
  --gd:#1E3932; --gm:#00704A; --gl:#D4E9E2; --gp:#E8F3EF;
  --iv:#F2F0EB; --ivd:#E3E1DA; --tx:#1F2320; --ts:#5A6560; --tl:#93A09A; --wh:#fff;
  --amber:#B45309; --amberp:#FFF4E5; --red:#C0392B; --redp:#FDECEA;
  --sh:0 2px 12px rgba(30,57,50,.08); --r:12px;
}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--iv);z-index:100}
#gate .gbox{text-align:center}
#gate .gtitle{font-size:17px;font-weight:900;color:var(--gd);margin-bottom:8px}
#gate .gsub{font-size:13px;color:var(--ts)}
#gate .gbtn{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;color:#fff;
  background:var(--gd);border-radius:9px;padding:9px 18px;text-decoration:none}
#ms{display:none;flex-direction:column;gap:12px}

.panel{background:var(--wh);border:1px solid var(--ivd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.ptitle{font-size:15px;font-weight:900;color:var(--gd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdesc{font-size:12px;color:var(--ts);margin-top:3px;line-height:1.6}

.btn{font-family:inherit;font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:9px;
  border:1px solid var(--gm);background:var(--gm);color:#fff;cursor:pointer}
.btn.line{background:var(--wh);color:var(--gm)}
.btn.gray{background:var(--wh);border-color:var(--ivd);color:var(--ts)}
.btn.red{background:var(--wh);border-color:var(--red);color:var(--red)}
.btn.sm{font-size:11px;padding:6px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.famtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.famtbl th{background:var(--gd);color:#fff;font-weight:800;padding:8px 9px;text-align:left;font-size:11.5px;white-space:nowrap}
.famtbl td{padding:8px 9px;border-bottom:1px solid var(--iv);vertical-align:middle}
.famtbl tr.rowbtn{cursor:pointer}
.famtbl tr.rowbtn:hover td{background:#FAFAF7}
.famtbl td.c,.famtbl th.c{text-align:center}
.tblwrap{overflow-x:auto;border-radius:9px;border:1px solid var(--ivd)}
.tblwrap .famtbl{min-width:640px}

.pill{display:inline-block;font-size:10px;font-weight:800;border-radius:100px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--gp);color:var(--gm)}
.pill.req{background:var(--amberp);color:var(--amber)}
.pill.gray{background:var(--iv);color:var(--ts)}
.pill.red{background:var(--redp);color:var(--red)}
.pill.blue{background:#E3EDF7;color:#33587D}
.pill.click{cursor:pointer}

/* ═══ 블록 카드 ═══ */
.blk{background:var(--wh);border:1px solid var(--ivd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.blk.internal{border-style:dashed;border-color:#C9C4B8}
.blkhead{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#FAFAF7;
  border-bottom:1px solid var(--iv);flex-wrap:wrap}
.blkhead .bt{font-size:13.5px;font-weight:900;color:var(--gd);flex:1;min-width:120px}
.blkhead .bico{font-size:14px}
.iconbtn{font-family:inherit;font-size:12px;border:1px solid var(--ivd);background:var(--wh);
  border-radius:7px;padding:4px 8px;cursor:pointer;color:var(--ts)}
.iconbtn:hover{border-color:var(--gm);color:var(--gm)}
.iconbtn.danger:hover{border-color:var(--red);color:var(--red)}
.blkbody{padding:12px 14px;font-size:12.5px}
.blkbody .empty{color:var(--tl);font-size:12px;padding:6px 0}

/* 미리보기 안 렌더링 */
.rv-t{white-space:pre-wrap;line-height:1.75;color:var(--tx)}
.rv-red{white-space:pre-wrap;line-height:1.7;color:var(--red);font-size:12px;margin-top:8px}
.rv-kv{width:100%;border-collapse:collapse;font-size:12.5px}
.rv-kv th{width:118px;background:var(--iv);color:var(--gd);font-weight:900;text-align:left;
  padding:8px 10px;border-bottom:2px solid var(--wh);font-size:12px;vertical-align:top}
.rv-kv td{padding:8px 10px;border-bottom:1px solid var(--iv);white-space:pre-wrap;line-height:1.6}
.rv-tb{width:100%;border-collapse:collapse;font-size:12px}
.rv-tb th{background:var(--gd);color:#fff;font-weight:800;padding:7px 8px;text-align:left;font-size:11px;white-space:nowrap}
.rv-tb td{padding:7px 8px;border-bottom:1px solid var(--iv);white-space:pre-wrap;line-height:1.55;vertical-align:top}
.rv-tb .sumrow td{background:var(--iv);font-weight:900}
.rv-tb .hlrow td{background:#FFF6BF;font-weight:900}
.rv-sch{width:100%;border-collapse:collapse;font-size:11.5px}
.rv-sch th{background:var(--gd);color:#fff;font-weight:800;padding:6px 7px;text-align:center;font-size:11px;white-space:nowrap}
.rv-sch td{border:1px solid var(--ivd);padding:6px 7px;text-align:center;white-space:pre-wrap;line-height:1.45}
.rv-sch td.tm{background:var(--iv);font-weight:800;color:var(--ts);white-space:nowrap;font-size:10.5px}
.rv-cover{border:2px solid var(--gd);border-radius:12px;padding:26px 18px;text-align:center}
.rv-cover .cbig{font-size:26px;font-weight:900;color:var(--gd);letter-spacing:2px}
.rv-cover .csub{font-size:13px;color:var(--ts);margin-top:8px;font-weight:700}
.rv-cover .cmeta{font-size:12.5px;color:var(--tx);margin-top:14px;line-height:1.9}
.rv-note{font-size:11.5px;color:var(--ts);margin-top:7px;white-space:pre-wrap;line-height:1.6}

/* ═══ 모달 ═══ */
.mbk{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--wh);border-radius:15px;width:100%;max-width:600px;max-height:90vh;
  overflow-y:auto;padding:19px 18px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
.mbox.wide{max-width:860px}
.mtitle{font-size:15px;font-weight:900;color:var(--gd);margin-bottom:12px}
.msub{font-size:11.5px;color:var(--ts);margin:-8px 0 12px;line-height:1.6}
.frow{margin-bottom:11px}
.flab{display:block;font-size:11.5px;font-weight:800;color:var(--ts);margin-bottom:5px}
.fin,.fsel,.ftxt{font-family:inherit;font-size:13px;width:100%;border:1.5px solid var(--ivd);
  border-radius:9px;padding:9px 11px;background:var(--wh);color:var(--tx)}
.fin:focus,.fsel:focus,.ftxt:focus{outline:none;border-color:var(--gm)}
.ftxt{resize:vertical;min-height:70px;line-height:1.6}
.fgrid{display:flex;gap:9px}
.fgrid .frow{flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}

/* 라이브러리 카드 */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.libcat{font-size:12px;font-weight:900;color:var(--gd);background:var(--gp);border-radius:8px;
  padding:6px 11px;margin:12px 0 7px}
.libcat:first-child{margin-top:0}
.lib{border:1.5px solid var(--ivd);border-radius:10px;padding:10px 11px;cursor:pointer;background:var(--wh)}
.lib:hover{border-color:var(--gm);background:var(--gp)}
.lib .li{font-size:16px}
.lib .ln{font-size:12.5px;font-weight:900;color:var(--tx);margin-top:3px}
.lib .ld{font-size:10.5px;color:var(--tl);margin-top:2px;line-height:1.45}

/* 편집기 안 작은 표 */
.ed-rows{display:flex;flex-direction:column;gap:6px}
.ed-row{display:flex;gap:5px;align-items:flex-start}
.ed-row .fin,.ed-row .ftxt{padding:7px 9px;font-size:12.5px}
.ed-row .ftxt{min-height:36px}
.ed-mini{font-family:inherit;font-size:11px;border:1px solid var(--ivd);background:var(--wh);
  border-radius:6px;padding:5px 7px;cursor:pointer;color:var(--ts);flex:none}
.ed-mini:hover{border-color:var(--gm);color:var(--gm)}
.ed-tblwrap{overflow-x:auto;border:1px solid var(--ivd);border-radius:9px;padding:8px}
.ed-tbl{border-collapse:collapse}
.ed-tbl td,.ed-tbl th{padding:2px}
.ed-tbl input{font-family:inherit;font-size:12px;border:1px solid var(--ivd);border-radius:6px;
  padding:6px 7px;min-width:96px;width:100%;background:var(--wh)}
.ed-tbl input:focus{outline:none;border-color:var(--gm)}
.ed-tbl th input{font-weight:800;background:var(--iv)}
.ed-sch td{position:relative}
.ed-sch .cellbox{display:flex;gap:3px;align-items:center}
.ed-sch .cellbox input{min-width:84px}
.cdot{width:20px;height:20px;border-radius:6px;border:1px solid var(--ivd);cursor:pointer;flex:none}
.calc-live{background:var(--gp);border-radius:10px;padding:10px 13px;font-size:12px;
  color:var(--gd);line-height:1.9;margin-top:10px;font-weight:700}

/* 담당자 고르기 */
.pick-sec{margin-bottom:12px}
.pick-h{font-size:12px;font-weight:900;color:var(--gd);background:var(--gp);border-radius:8px;
  padding:6px 11px;margin-bottom:6px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:5px}
.pick{display:flex;align-items:center;gap:7px;font-size:12px;border:1.5px solid var(--ivd);
  border-radius:9px;padding:7px 9px;cursor:pointer;background:var(--wh)}
.pick input{width:15px;height:15px;flex:none;cursor:pointer}
.pick.on{border-color:var(--gm);background:var(--gp)}
.pick small{color:var(--tl);font-size:10px;margin-left:auto}

/* 발행 링크 */
.linkbox{display:flex;gap:7px;align-items:center;background:var(--iv);border-radius:10px;padding:9px 11px}
.linkbox .lk{flex:1;font-size:11.5px;color:var(--gd);word-break:break-all;font-weight:700}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:900;
  background:var(--gd);color:#fff;font-size:13px;font-weight:700;padding:11px 18px;
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.err{background:var(--red)}

@media (max-width:640px){
  body #mn{padding-left:6px;padding-right:6px}
  .panel{padding:11px 9px}
  .btn{font-size:11.5px;padding:8px 11px}
  .mbox{padding:15px 12px}
  .blkbody{padding:10px 9px}
}

/* ═══ 인쇄 ═══ */
#printArea{display:none}
@media print{
  body.pr *{visibility:hidden}
  body.pr #printArea, body.pr #printArea *{visibility:visible}
  body.pr #printArea{display:block;position:absolute;left:0;top:0;width:100%;background:#fff}
  #printArea .pblk{page-break-inside:avoid;margin-bottom:18px}
  #printArea .pcover{page-break-after:always;display:flex;flex-direction:column;
    justify-content:center;align-items:center;min-height:92vh;text-align:center}
  #printArea .pcover .cbig{font-size:44px;font-weight:900;color:var(--gd);letter-spacing:5px;line-height:1.4}
  #printArea .pcover .csub{font-size:17px;color:var(--ts);margin-top:16px;font-weight:800}
  #printArea .pcover .cmeta{font-size:14px;color:var(--tx);margin-top:30px;line-height:2.1}
  #printArea .ph{font-size:16px;font-weight:900;color:var(--gd);border-bottom:2.5px solid var(--gd);
    padding-bottom:5px;margin-bottom:9px}
  #printArea .pfoot{text-align:center;font-size:10px;color:var(--tl);margin-top:26px}
}
</style>

<script type="module">

  collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",

};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ═══ 작은 도우미들 ═══ */
const $I = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => (Number(n)||0).toLocaleString('ko-KR');
const dtStr = ts => { if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const rid = (n=18) => { const c='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };
function toast(msg, kind){
  const t = $I('toast'); t.textContent = msg;
  t.classList.toggle('err', kind==='err'); t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
window.toast = toast;

/* ═══ 상태 ═══ */
let CU = null;
let IS_SUPER = false;
let FAM_ADMIN = false;           // 총괄 담당자 (famConfig/editors)
let DOCS = [];
let CUR = null;                  // 지금 열려 있는 통신문 {id, ...data, blocks:[]}
let STAFF = null;
let STUDENTS = null, CLASSES = null;

const TYPE_L = { event:'행사 안내', material:'교재·준비물', free:'자유 양식' };
const ORG_L  = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원', both:'다니엘 아마츠 · 지혜빛 선교원' };
const canFamAdmin = () => IS_SUPER || FAM_ADMIN;
const canOwn  = d => canFamAdmin() || (d && d.ownerUid === CU.uid);
const canEdit = d => canOwn(d) || (d && Array.isArray(d.editors) && d.editors.includes(CU.uid));

/* 스케줄 칸 색 팔레트 (0 = 없음) */
const SCH_COLORS = ['', '#FDECEC', '#FFF4E0', '#FFF9D6', '#E6F3E6', '#E3EDF7', '#EFE6F5'];

/* 📜 활동 로그 */
async function logAct(action, detail){
  try {
    await addDoc(collection(db,'activityLogs'), {
      page:'family', docId:CUR?.id||'', docTitle:CUR?.title||'',
      action, detail:detail||'',
      byUid:CU?.uid||'', byName:CU?.name||'', at:Timestamp.now()
    });
  } catch(e){}
}

   블록 라이브러리 (프리셋)
   type: cover | text | kv | table | budget | schedule
   ═══════════════════════════════════════════ */

    { key:'itemsP',  icon:'🎒', label:'개인 준비물', desc:'구분 · 품목 · 세부내용',

              {c:['그 외','개인 의약품','필요시']},{c:['그 외','물통','밀폐 되는 것 (이름 표기)']}], note:'' }) },
    { key:'itemsG',  icon:'🍳', label:'조별 준비물', desc:'조 단위로 챙길 것들',

onAuthStateChanged(auth, async user => {
  if(!user){
    $I('gate-msg').textContent = '로그인이 필요합니다.';
    $I('gate-btn').style.display = 'inline-block';
    return;
  }
  try {
    const s = await getDoc(doc(db,'staff', user.uid));
    if(!s.exists()){
      $I('gate-msg').textContent = '교직원 계정이 아닙니다.';
      $I('gate-btn').style.display = 'inline-block';
      return;
    }
    CU = { uid:user.uid, ...s.data() };
    IS_SUPER = CU.role === 'super';
    if(window.renderShell) renderShell('family', CU);
    if(window.setCrumb) setCrumb(['가정통신문']);

    try {
      const c = await getDoc(doc(db,'famConfig','editors'));
      FAM_ADMIN = c.exists() && Array.isArray(c.data().uids) && c.data().uids.includes(CU.uid);
    } catch(e){}

    await loadDocs();
    renderList();
    $I('gate').style.display = 'none';
    $I('ms').style.display = 'flex';
  } catch(e){
    console.error(e);
    $I('gate-msg').textContent = '불러오기 오류: ' + e.message;
    $I('gate-btn').style.display = 'inline-block';
  }
});

async function loadDocs(){
  const snap = await getDocs(collection(db,'famDocs'));
  DOCS = snap.docs.map(d=>({ id:d.id, ...d.data() }))
    .sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
}
function parseBlocks(d){
  try { const a = JSON.parse(d.blocksJson||'[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}

window.createDoc = async function(){
  const title = $I('nd-title').value.trim();
  if(!title) return toast('제목을 넣어주세요','err');
  const type = $I('nd-type').value, org = $I('nd-org').value;
  const ownerUid = $I('nd-owner').value;
  const owner = STAFF.find(t=>t.uid===ownerUid);
  const blocks = (COMPOSE[type]||[]).map(k=>{
    const p = presetFind(k);
    return { id:rid(8), key:k, type:p.type, title:p.label, pub:p.pub!==false, data:p.make() };
  });
  try {
    const ref = await addDoc(collection(db,'famDocs'), {
      title, type, org,
      ownerUid, ownerName:owner?.name||'',
      editors:[], editorNames:[],
      blocksJson: JSON.stringify(blocks),
      shareId:'', listed:false,
      createdAt:Timestamp.now(), updatedAt:Timestamp.now(),
      updatedBy:CU.name||''
    });
    closeModal(); toast('통신문을 만들었어요');
    await loadDocs();
    openDoc(ref.id);
    logAct('create', title);
  } catch(e){ toast('만들기 실패: '+e.message,'err'); }
};

window.saveTitle = async function(el){
  const t = el.textContent.trim();
  if(!t || t === CUR.title) { el.textContent = CUR.title; return; }
  CUR.title = t;
  await persist({ title:t });
  toast('제목을 저장했어요');
};

/* ── 블록 카드 ── */
function blockCard(b, i, editable){
  const p = presetFind(b.key);
  return `<div class="blk ${b.pub?'':'internal'}">
    <div class="blkhead">
      <span class="bico">${p?.icon||'📄'}</span>
      <span class="bt">${esc(b.title||'')}</span>
      <span class="pill click ${b.pub?'ok':'gray'}" ${editable?`onclick="togglePub(${i})"`:''}
        title="학부모 링크에 보일지 정합니다">${b.pub?'학부모 공개':'내부용'}</span>
      ${editable?`
        <button class="iconbtn" onclick="moveBlock(${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="iconbtn" onclick="moveBlock(${i},1)" ${i===CUR.blocks.length-1?'disabled':''}>↓</button>
        <button class="iconbtn" onclick="editBlock(${i})">✏️ 입력</button>
        <button class="iconbtn danger" onclick="delBlock(${i})">🗑</button>`:''}
    </div>
    <div class="blkbody">${renderBlock(b) || '<div class="empty">아직 입력된 내용이 없어요 — ✏️ 입력을 눌러 채워주세요.</div>'}</div>
  </div>`;
}
window.togglePub = async function(i){
  if(!canEdit(CUR)) return;
  CUR.blocks[i].pub = !CUR.blocks[i].pub;
  await persistBlocks();
  renderEdit();
};
window.moveBlock = async function(i, dir){
  if(!canEdit(CUR)) return;
  const j = i + dir;
  if(j < 0 || j >= CUR.blocks.length) return;
  [CUR.blocks[i], CUR.blocks[j]] = [CUR.blocks[j], CUR.blocks[i]];
  await persistBlocks();
  renderEdit();
};
window.delBlock = async function(i){
  if(!canEdit(CUR)) return;
  if(!confirm(`「${CUR.blocks[i].title}」 블록을 지울까요?`)) return;
  CUR.blocks.splice(i,1);
  await persistBlocks();
  renderEdit();
};

async function persist(extra){
  const upd = { updatedAt:Timestamp.now(), updatedBy:CU.name||'', ...(extra||{}) };
  await updateDoc(doc(db,'famDocs', CUR.id), upd);
  Object.assign(CUR, upd);
  const d = DOCS.find(x=>x.id===CUR.id);
  if(d) Object.assign(d, upd);
}
async function persistBlocks(){
  try {
    await persist({ blocksJson: JSON.stringify(CUR.blocks) });
  } catch(e){ toast('저장 실패: '+e.message,'err'); }
}

  const p = presetFind(key);
  if(!p) return;
  CUR.blocks.push({ id:rid(8), key, type:p.type, title:p.label, pub:p.pub!==false, data:p.make() });
  await persistBlocks();
  closeModal();
  renderEdit();
  editBlock(CUR.blocks.length-1);
};

/* ═══════════════════════════════════════════
   블록 렌더링 (미리보기 · 인쇄 공용)
   ═══════════════════════════════════════════ */
function renderBlock(b){
  const d = b.data || {};
  if(b.type === 'cover'){
    if(!d.big && !d.period && !d.place) return '';
    return `<div class="rv-cover">
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${d.period?esc(d.period)+'<br>':''}${d.place?esc(d.place):''}</div>
    </div>`;
  }
  if(b.type === 'text'){
    if(!d.body && !d.red) return '';
    return `${d.body?`<div class="rv-t">${esc(d.body)}</div>`:''}
      ${d.red?`<div class="rv-red">${esc(d.red)}</div>`:''}`;
  }
  if(b.type === 'kv'){
    const rows = (d.rows||[]).filter(r=>r.k||r.v);
    if(!rows.length) return '';
    return `<table class="rv-kv">${rows.map(r=>
      `<tr><th>${esc(r.k)}</th><td>${esc(r.v)}</td></tr>`).join('')}</table>
      ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
  }
  if(b.type === 'table'){
    const cols = d.cols||[], rows = (d.rows||[]).filter(r=>(r.c||[]).some(x=>x));
    if(!rows.length) return '';
    return `<div style="overflow-x:auto"><table class="rv-tb">
      <tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
      ${rows.map(r=>`<tr>${cols.map((_,ci)=>`<td>${esc((r.c||[])[ci]||'')}</td>`).join('')}</tr>`).join('')}
    </table></div>
    ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
  }
  if(b.type === 'budget') return renderBudget(d);
  if(b.type === 'schedule') return renderSchedule(d);
  return '';
}
function budgetCalc(d){
  const rows = (d.rows||[]).filter(r=>r.item||r.cat||Number(r.price));
  const total = rows.reduce((s,r)=>s+(Number(r.price)||0)*(Number(r.qty)||0),0);
  const ppl = Number(d.people)||0;
  let per = ppl ? total/ppl : 0;
  const ru = Number(d.round)||0;
  if(ru && per) per = Math.ceil(per/ru)*ru;
  return { rows, total, ppl, per };
}
function renderBudget(d){
  const { rows, total, ppl, per } = budgetCalc(d);
  if(!rows.length) return '';
  return `<div style="overflow-x:auto"><table class="rv-tb">
    <tr><th>구분</th><th>항목</th><th style="text-align:right">단가</th>
      <th style="text-align:center">수량</th><th style="text-align:right">금액</th><th>비고</th></tr>
    ${rows.map(r=>{
      const amt = (Number(r.price)||0)*(Number(r.qty)||0);
      return `<tr><td>${esc(r.cat||'')}</td><td>${esc(r.item||'')}</td>
        <td style="text-align:right">₩ ${fmt(r.price)}</td>
        <td style="text-align:center">${fmt(r.qty)}${esc(r.unit||'')}</td>
        <td style="text-align:right">₩ ${fmt(amt)}</td><td>${esc(r.note||'')}</td></tr>`;
    }).join('')}
    <tr class="sumrow"><td colspan="4">총계</td>
      <td style="text-align:right">₩ ${fmt(total)}</td><td></td></tr>
    ${ppl?`<tr class="hlrow"><td colspan="4">1인 회비 (${fmt(ppl)}명${Number(d.round)?' · '+fmt(d.round)+'원 단위 올림':''})</td>
      <td style="text-align:right">₩ ${fmt(per)}</td><td></td></tr>`:''}
  </table></div>
  ${d.account?`<div class="rv-note">💳 회비 입금 계좌: <b>${esc(d.account)}</b>${d.deadline?` · 납부 기한: <b>${esc(d.deadline)}</b>`:''}</div>`
    : d.deadline?`<div class="rv-note">납부 기한: <b>${esc(d.deadline)}</b></div>`:''}
  ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
}
function renderSchedule(d){
  const days = d.days||[], slots = d.slots||[];
  if(!days.length || !slots.length) return '';
  const any = Object.values(d.cells||{}).some(c=>c && c.t);
  if(!any) return '';
  return `<div style="overflow-x:auto"><table class="rv-sch">
    <tr><th>시간</th>${days.map(dy=>`<th>${esc(dy.label||'')}</th>`).join('')}</tr>
    ${slots.map((sl,ri)=>`<tr>
      <td class="tm">${esc(sl.s)} ~ ${esc(sl.e)}</td>
      ${days.map((_,ci)=>{
        const c = (d.cells||{})[ri+'_'+ci] || {};
        const bg = SCH_COLORS[c.c||0] || '';
        return `<td style="${bg?`background:${bg}`:''}">${esc(c.t||'')}</td>`;
      }).join('')}
    </tr>`).join('')}
  </table></div>
  ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
}

function tbColCount(){
  const t = $I('tb-tbl');
  return t.rows[0].cells.length - 1;
}
window.tbMoveRow = function(btn, dir){
  const tr = btn.closest('tr');
  const sib = dir<0 ? tr.previousElementSibling : tr.nextElementSibling;
  if(!sib || sib.rowIndex === 0) return;
  if(dir<0) tr.parentNode.insertBefore(tr, sib);
  else tr.parentNode.insertBefore(sib, tr);
};
window.tbAddRow = function(){
  const t = $I('tb-tbl'), n = tbColCount();
  const tr = document.createElement('tr');
  tr.innerHTML = `${Array.from({length:n},()=>'<td><input value=""></td>').join('')}
    <td style="white-space:nowrap">
      <button class="ed-mini" onclick="tbMoveRow(this,-1)">↑</button>
      <button class="ed-mini" onclick="tbMoveRow(this,1)">↓</button>
      <button class="ed-mini" onclick="this.closest('tr').remove()">✕</button></td>`;
  t.appendChild(tr);
};
window.tbAddCol = function(){
  const t = $I('tb-tbl');
  [...t.rows].forEach((tr,ri)=>{
    const cell = tr.insertCell(tr.cells.length-1);
    if(ri===0){ cell.outerHTML = `<th><input value=""></th>`;
      // insertCell 은 td 를 만들기 때문에 th 로 바꾼 뒤 위치 다시 잡기
      const th = tr.cells[tr.cells.length-2];
    } else cell.innerHTML = `<input value="">`;
  });
  // 머리줄 th 보정
  const hr = t.rows[0];
  [...hr.cells].forEach((c,ci)=>{
    if(ci < hr.cells.length-1 && c.tagName==='TD'){
      const th = document.createElement('th');
      th.innerHTML = c.innerHTML; hr.replaceChild(th, c);
    }
  });
};
window.tbDelCol = function(){
  const t = $I('tb-tbl');
  if(tbColCount() <= 1) return;
  [...t.rows].forEach(tr=>tr.deleteCell(tr.cells.length-2));
};
window.tbRosterImport = async function(){
  toast('학생 명부 불러오는 중…');
  try {
    if(!STUDENTS || !CLASSES){
      const [ss, cs] = await Promise.all([
        getDocs(collection(db,'students')), getDocs(collection(db,'classes'))
      ]);
      STUDENTS = ss.docs.map(x=>({ id:x.id, ...x.data() }));
      CLASSES = cs.docs.map(x=>({ id:x.id, ...x.data() }));
    }
    const gnum = g => { const m = String(g).match(/\d+/); return m?Number(m[0]):999; };
    // 통신문 기관에 맞는 학생만 (공통이면 전체)
    const orgOk = s => !CUR.org || CUR.org==='both' || (s.org||'daniel')===CUR.org;
    // 올해 반 우선 → 학생별 학년 맵(grades) → 반 학년(grade) 순으로 찾기
    const y = new Date().getFullYear();
    const sortedCls = [...CLASSES].sort((a,b)=>((b.year||y)===y?1:0)-((a.year||y)===y?1:0));
    const gradeOf = sid => {
      for(const c of sortedCls){
        if(Array.isArray(c.students) && c.students.includes(sid)){
          if(c.grades && c.grades[sid]) return c.grades[sid];
          if(c.grade) return c.grade;
        }
      }
      return '';
    };
    const byG = {};
    STUDENTS.filter(s=>(s.status||'active')==='active' && orgOk(s)).forEach(s=>{
      const g = gradeOf(s.id) || '학년 미지정';
      (byG[g]=byG[g]||[]).push(s.name||'');
    });
    const gs = Object.keys(byG).sort((a,b)=>gnum(a)-gnum(b));
    const t = $I('tb-tbl');
    // 기존 데이터 줄 지우고 새로 채우기
    while(t.rows.length > 1) t.deleteRow(1);
    const n = tbColCount();
    gs.forEach(g=>{
      byG[g].sort((a,b)=>String(a).localeCompare(String(b),'ko'));
      const vals = [g, byG[g].join(', '), byG[g].length+'명'];
      const tr = t.insertRow();
      tr.innerHTML = `${Array.from({length:n},(_,ci)=>`<td><input value="${esc(vals[ci]||'')}"></td>`).join('')}
        <td style="white-space:nowrap">
          <button class="ed-mini" onclick="tbMoveRow(this,-1)">↑</button>
          <button class="ed-mini" onclick="tbMoveRow(this,1)">↓</button>
          <button class="ed-mini" onclick="this.closest('tr').remove()">✕</button></td>`;
    });
    toast(`학년별 ${gs.length}줄을 채웠어요`);
  } catch(e){ toast('명부 불러오기 실패: '+e.message,'err'); }
};

        <input value="${esc(c.t||'')}" data-cell="${ri}_${ci}">
        <div class="cdot" data-dot="${ri}_${ci}" data-c="${c.c||0}"
          style="background:${bg||'#fff'}" title="칸 색 바꾸기 (누를 때마다 바뀜)"
          onclick="schCycle(this)"></div></div></td>`;
    }).join('')}
  </tr>`).join('');
  return `
    <div class="msub">시간 줄과 요일 열을 자유롭게 더하고 뺄 수 있어요.
      색 점을 누르면 칸 색이 순서대로 바뀝니다. (같은 색끼리 묶어 보기 좋게)</div>
    <div class="ed-tblwrap"><table class="ed-tbl ed-sch" id="sch-tbl">${head}${body}</table></div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="ed-mini" onclick="schAddSlot()">＋ 시간 줄 추가</button>
      <button class="ed-mini" onclick="schAddDay()">＋ 요일 열 추가</button>
    </div>
    <div class="frow" style="margin-top:10px"><label class="flab">덧붙임 (선택)</label>
      <input class="fin" id="sch-note" value="${esc(d.note||'')}"></div>`;
}
window.schCycle = function(el){
  let c = (Number(el.dataset.c)||0) + 1;
  if(c >= SCH_COLORS.length) c = 0;
  el.dataset.c = c;
  el.style.background = SCH_COLORS[c] || '#fff';
};
window.schDelSlot = function(btn){ btn.closest('tr').remove(); };
window.schDelDay = function(ci){
  // 저장 시 다시 그려지므로, 지금 상태를 읽어 삭제 후 재렌더
  const b = CUR.blocks[EB];
  b.data = readSchedule();
  b.data.days.splice(ci,1);
  // cells 재매핑
  const nc = {};
  Object.entries(b.data.cells).forEach(([k,v])=>{
    const [r,c] = k.split('_').map(Number);
    if(c === ci) return;
    nc[r+'_'+(c>ci?c-1:c)] = v;
  });
  b.data.cells = nc;
  editBlock(EB);
};
window.schAddSlot = function(){
  const t = $I('sch-tbl');
  const n = t.rows[0].cells.length - 1;
  const last = [...t.rows].slice(-1)[0];
  let s='', e='';
  if(last && last.rowIndex>0){
    const pe = last.querySelector('input[data-sf="e"]');
    if(pe && /^\d{1,2}:\d{2}$/.test(pe.value)){
      s = pe.value;
      const h = Number(pe.value.split(':')[0]);
      e = (h+1) + ':' + pe.value.split(':')[1];
    }
  }
  const tr = t.insertRow();
  tr.innerHTML = `<td><div class="cellbox">
      <input value="${esc(s)}" style="min-width:44px;width:54px" data-sf="s">
      <span style="font-size:11px;color:var(--tl)">~</span>
      <input value="${esc(e)}" style="min-width:44px;width:54px" data-sf="e">
      <button class="ed-mini" onclick="schDelSlot(this)">✕</button></div></td>
    ${Array.from({length:n},()=>`<td class="ed-sch-cell"><div class="cellbox">
      <input value=""><div class="cdot" data-c="0" style="background:#fff" onclick="schCycle(this)"></div></div></td>`).join('')}`;
};
window.schAddDay = function(){
  const b = CUR.blocks[EB];
  b.data = readSchedule();
  b.data.days.push({label:(b.data.days.length+1)+'일차'});
  editBlock(EB);
};
function readSchedule(){
  const t = $I('sch-tbl');
  const days = [...t.rows[0].querySelectorAll('input[data-day]')].map(i=>({label:i.value.trim()}));
  const slots = [], cells = {};
  [...t.rows].slice(1).forEach((tr,ri)=>{
    const s = tr.querySelector('input[data-sf="s"]')?.value.trim()||'';
    const e = tr.querySelector('input[data-sf="e"]')?.value.trim()||'';
    slots.push({s,e});
    [...tr.querySelectorAll('.ed-sch-cell')].forEach((td,ci)=>{
      const tv = td.querySelector('input')?.value.trim()||'';
      const cv = Number(td.querySelector('.cdot')?.dataset.c)||0;
      if(tv || cv) cells[ri+'_'+ci] = { t:tv, c:cv };
    });
  });
  return { days, slots, cells, note:$I('sch-note').value.trim() };
}

/* — 저장 — */
window.saveBlock = async function(){
  const b = CUR.blocks[EB];
  if(!b) return closeModal();
  b.title = $I('eb-title').value.trim() || b.title;
  if(b.type === 'cover'){
    b.data = { big:$I('cv-big').value.trim(), sub:$I('cv-sub').value.trim(),
      period:$I('cv-period').value.trim(), place:$I('cv-place').value.trim() };
  }
  else if(b.type === 'text'){
    b.data = { body:$I('tx-body').value, red:$I('tx-red').value.trim() };
  }
  else if(b.type === 'kv'){
    const rows = [...document.querySelectorAll('#kv-rows .ed-row')].map(r=>({
      k:r.querySelector('[data-f="k"]').value.trim(),
      v:r.querySelector('[data-f="v"]').value
    })).filter(r=>r.k||r.v);
    b.data = { rows, note:$I('kv-note').value.trim() };
  }
  else if(b.type === 'table'){
    const t = $I('tb-tbl');
    const cols = [...t.rows[0].querySelectorAll('input')].map(i=>i.value.trim());
    const rows = [...t.rows].slice(1).map(tr=>({
      c:[...tr.querySelectorAll('input')].map(i=>i.value)
    })).filter(r=>r.c.some(x=>x.trim()));
    b.data = { cols, rows, note:$I('tb-note').value.trim() };
  }
  else if(b.type === 'budget'){ b.data = readBudget(); }
  else if(b.type === 'schedule'){ b.data = readSchedule(); }
  await persistBlocks();
  closeModal();
  renderEdit();
  toast('저장했어요');
};

async function loadStaffList(){

  const snap = await getDocs(collection(db,'staff'));
  STAFF = snap.docs.map(d=>({ uid:d.id, ...d.data() }))

window.saveMgrs = async function(){
  const editors = [...document.querySelectorAll('#mg-grid input:checked')].map(i=>i.value);

};

/* ═══════════════════════════════════════════
   발행 (학부모 링크 · 게시판)
   ═══════════════════════════════════════════ */
function shareUrl(id){
  return location.href.replace(/[^/]*$/, '') + 'share-family.html?id=' + id;
}
window.openPublishModal = function(){
  if(!canOwn(CUR)) return;
  const pubCount = CUR.blocks.filter(b=>b.pub).length;
  const inCount = CUR.blocks.length - pubCount;
  const link = CUR.shareId ? shareUrl(CUR.shareId) : '';
  openModal(`
    <div class="mtitle">🔗 발행</div>
    <div class="msub">「학부모 공개」 블록 <b>${pubCount}개</b>만 링크에 나갑니다.
      (내부용 ${inCount}개는 빠져요) — 발행 후 내용을 고치면 다시 발행해야 링크에 반영됩니다.</div>
    <label class="pick" style="margin-bottom:10px ${''}">
      <input type="checkbox" id="pb-list" ${CUR.listed?'checked':''}>
      <span>학부모 게시판 목록에도 올리기 <small style="margin-left:6px">(share-family.html 첫 화면 목록)</small></span>
    </label>
    ${link?`<div class="linkbox"><span class="lk">${esc(link)}</span>
      <button class="btn line sm" onclick="copyLink()">복사</button></div>`:''}
    <div class="mfoot">
      <button class="btn gray" onclick="closeModal()">취소</button>
      <button class="btn" onclick="doPublish()">${CUR.publishedAt?'다시 발행':'발행하기'}</button>
    </div>`);
};
window.doPublish = async function(){
  const listed = $I('pb-list').checked;
  const shareId = CUR.shareId || rid(20);
  const pubBlocks = CUR.blocks.filter(b=>b.pub);
  try {
    await setDoc(doc(db,'sharedFamily', shareId), {
      docId:CUR.id, title:CUR.title||'', org:CUR.org||'daniel',
      blocksJson: JSON.stringify(pubBlocks),
      publishedAt:Timestamp.now(), listed
    });
    // 학부모 게시판 목록 (_index)
    try {
      const ix = await getDoc(doc(db,'sharedFamily','_index'));
      let items = ix.exists() && Array.isArray(ix.data().items) ? ix.data().items : [];
      items = items.filter(it=>it.id !== shareId);
      if(listed) items.unshift({ id:shareId, title:CUR.title||'', org:CUR.org||'daniel', at:Date.now() });
      await setDoc(doc(db,'sharedFamily','_index'), { items });
    } catch(e){ console.warn('index update fail', e); }
    // 원본 문서 갱신 + 이전 판 보관
    await persist({ shareId, listed, publishedAt:Timestamp.now() });
    try {
      await addDoc(collection(db,'famRevisions'), {
        docId:CUR.id, title:CUR.title||'',
        blocksJson: JSON.stringify(CUR.blocks),
        at:Timestamp.now(), byUid:CU.uid, byName:CU.name||''
      });
    } catch(e){}
    closeModal();
    logAct('publish', listed?'게시판 포함':'링크만');
    renderEdit();
    // 발행 완료 + 링크 안내
    const link = shareUrl(shareId);
    openModal(`
      <div class="mtitle">✅ 발행 완료</div>
      <div class="msub">이 링크를 학부모께 전달하세요. (카카오톡 공유 가능)</div>
      <div class="linkbox"><span class="lk">${esc(link)}</span>
        <button class="btn line sm" onclick="copyLink()">복사</button></div>
      <div class="mfoot"><button class="btn" onclick="closeModal()">확인</button></div>`);
  } catch(e){ toast('발행 실패: '+e.message,'err'); }
};
window.copyLink = function(){
  if(!CUR?.shareId) return;
  const link = shareUrl(CUR.shareId);
  navigator.clipboard?.writeText(link)
    .then(()=>toast('링크를 복사했어요'))
    .catch(()=>{ prompt('링크를 직접 복사하세요', link); });
};

window.openPrintModal = function(){
  openModal(`
    <div class="mtitle">🖨 인쇄</div>
    <div class="frow"><label class="flab">범위</label>
      <select class="fsel" id="pr-scope">
        <option value="all">전체 (내부용 블록 포함) — 교사·학생 배부용</option>
        <option value="pub">학부모 공개 블록만</option>
      </select></div>
    <div class="msub">A4 세로 기준입니다. 표지 블록이 있으면 첫 장 전체를 차지해요.</div>
    <div class="mfoot">
      <button class="btn gray" onclick="closeModal()">취소</button>
      <button class="btn" onclick="doPrint()">인쇄</button>
    </div>`);
};
window.doPrint = function(){
  const scope = $I('pr-scope').value;
  closeModal();
  const blocks = CUR.blocks.filter(b=>scope==='all' || b.pub);
  let html = '';
  blocks.forEach(b=>{
    const body = renderBlock(b);
    if(!body) return;
    if(b.type === 'cover'){
      const d = b.data||{};
      html += `<div class="pcover">
        <div class="cbig">${esc(d.big||CUR.title||'')}</div>
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cmeta">${d.period?esc(d.period)+'<br>':''}${d.place?esc(d.place):''}</div>
      </div>`;
    } else {
      html += `<div class="pblk"><div class="ph">${esc(b.title||'')}</div>${body}</div>`;
    }
  });
  html += `<div class="pfoot">${esc(ORG_L[CUR.org]||'')} · ${esc(CUR.title||'')}</div>`;
  $I('printArea').innerHTML = html;
  document.body.classList.add('pr');
  setTimeout(()=>{
    window.print();
    setTimeout(()=>document.body.classList.remove('pr'), 400);
  }, 60);
};

   이전 판 · 복제 · 삭제

window.openRevisions = async function(){
  if(!canOwn(CUR)) return;
  toast('이전 판 불러오는 중…');
  try {
    const snap = await getDocs(query(collection(db,'famRevisions'), where('docId','==',CUR.id)));
    const revs = snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.at?.toMillis?.()||0)-(a.at?.toMillis?.()||0));
    const rows = revs.map(r=>`<tr>
      <td>${dtStr(r.at)}</td><td>${esc(r.byName||'')}</td>
      <td class="c"><button class="btn line sm" onclick="restoreRev('${r.id}')">이 판으로 복원</button></td>
    </tr>`).join('');
    openModal(`
      <div class="mtitle">🕰 이전 판 (발행할 때마다 보관)</div>
      <div class="tblwrap"><table class="famtbl">
        <tr><th>보관 시각</th><th>발행한 사람</th><th class="c"></th></tr>
        ${rows || '<tr><td colspan="3" style="text-align:center;color:var(--tl);padding:20px">보관된 판이 없어요 — 처음 발행하면 생깁니다.</td></tr>'}
      </table></div>
      <div class="mfoot"><button class="btn gray" onclick="closeModal()">닫기</button></div>`, true);
    window._REVS = revs;
  } catch(e){ toast('불러오기 실패: '+e.message,'err'); }
};
window.restoreRev = async function(rid_){
  const r = (window._REVS||[]).find(x=>x.id===rid_);
  if(!r) return;
  if(!confirm('이 판의 내용으로 되돌릴까요?\n지금 내용은 사라집니다. (발행본은 그대로 — 다시 발행해야 반영)')) return;
  CUR.blocks = (()=>{ try { return JSON.parse(r.blocksJson||'[]'); } catch(e){ return []; } })();
  await persistBlocks();
  closeModal(); renderEdit(); toast('복원했어요 — 확인 후 다시 발행해 주세요');
  logAct('restore', dtStr(r.at));
};
window.dupDoc = async function(){
  if(!canFamAdmin()) return;
  if(!confirm(`「${CUR.title}」 통신문을 복제할까요?\n(작년 것 → 올해 것 만들 때 편해요)`)) return;
  try {
    const ref = await addDoc(collection(db,'famDocs'), {
      title:(CUR.title||'')+' (복사본)', type:CUR.type||'free', org:CUR.org||'daniel',
      ownerUid:CU.uid, ownerName:CU.name||'',
      editors:[], editorNames:[],
      blocksJson: JSON.stringify(CUR.blocks),
      shareId:'', listed:false,
      createdAt:Timestamp.now(), updatedAt:Timestamp.now(), updatedBy:CU.name||''
    });
    toast('복제했어요');
    await loadDocs();
    openDoc(ref.id);
  } catch(e){ toast('복제 실패: '+e.message,'err'); }
};
window.delDoc = async function(){
  if(!canOwn(CUR)) return;
  if(!confirm(`「${CUR.title}」 통신문을 삭제할까요?\n발행된 학부모 링크도 함께 사라집니다.`)) return;
  try {
    if(CUR.shareId){
      try { await deleteDoc(doc(db,'sharedFamily', CUR.shareId)); } catch(e){}
      try {
        const ix = await getDoc(doc(db,'sharedFamily','_index'));
        if(ix.exists()){
          const items = (ix.data().items||[]).filter(it=>it.id !== CUR.shareId);
          await setDoc(doc(db,'sharedFamily','_index'), { items });
        }
      } catch(e){}
    }
    await deleteDoc(doc(db,'famDocs', CUR.id));
    logAct('delete', CUR.title||'');
    toast('삭제했어요');
    backToList();
  } catch(e){ toast('삭제 실패: '+e.message,'err'); }
};
