<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 · 교사 선교사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
/* ═══ 📝 회의록 (v-93) — 목록 A(날짜순 + 주제 칩) · 검색 B(주제로 모아 보기) · 문서 A(지금 회의록 모양)
   (v-100) 기본 보기: 목록 C(목차 · ☆ 모아 두기) · 문서 B(결정 · 임무 먼저) — A 모양은 단추로 바꿔 볼 수 있고 출력은 문서 A 그대로 ═══ */
#mt{width:100%;max-width:var(--page-dash,1680px);margin:0 auto;font-family:var(--font-ui,'Noto Sans KR',sans-serif);color:var(--ink);padding-bottom:80px}
#mt *{box-sizing:border-box}
.mt-btn{font-family:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:0 14px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.mt-btn:hover{border-color:var(--sb-green)}
.mt-btn.p{background:var(--sb-house);border-color:var(--sb-house);color:#fff}
.mt-btn.g{background:var(--sb-green);border-color:var(--sb-green);color:#fff}
.mt-btn.sm{height:32px;font-size:12px;padding:0 11px}
.mt-btn.ghost{background:transparent}
.mt-btn:disabled{opacity:.45;cursor:not-allowed}
.mt-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mt-head .cr{font-size:12px;font-weight:700;color:var(--ink-2)}
.mt-head h1{margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.mt-sp{flex:1}
.mt-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mt-seg button{font-family:inherit;font-size:12.5px;font-weight:800;border:0;background:transparent;color:var(--ink-2);padding:0 13px;height:36px;cursor:pointer;white-space:nowrap}
.mt-seg button+button{border-left:1px solid var(--line)}
.mt-seg button.on{background:var(--sb-house);color:#fff}
.mt-seg button.da.on{background:#2B5797}
.mt-filt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mt-chip{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:100px;padding:0 12px;height:32px;cursor:pointer;white-space:nowrap}
.mt-chip.on{background:var(--sb-mint-2);border-color:#9CCBB6;color:var(--sb-green)}
.mt-sel{font-family:inherit;font-size:13px;font-weight:700;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink)}
.mt-search{display:flex;align-items:center;gap:8px;height:40px;flex:1;min-width:240px;max-width:420px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.mt-search input{border:0;outline:none;font-family:inherit;font-size:13.5px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.mt-search button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px}
.mt-sum{font-size:12.5px;color:var(--ink-2);margin:4px 2px 12px}
.mt-sum b{color:var(--ink)}
.mt-mine{display:flex;align-items:center;gap:10px;background:#FBF6E6;border:1px solid #EADBA8;border-radius:12px;padding:10px 14px;margin-bottom:12px;cursor:pointer;color:#5C4A00;font-size:13px;font-weight:700}
html[data-theme="dark"] .mt-mine{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.mt-mine b{font-weight:900}.mt-mine .go{margin-left:auto}
/* 🏛 v164 방 머리 — 상태 한 줄 · 주 단추 하나 · 나머지는 ⋯ · 내 임무는 한 줄 상태 카드 */
.mt-hl{min-width:0}
.mt-stl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.mt-stl b{color:var(--ink);font-weight:800}
.mt-head .dd-m{min-width:220px}
.mt-head .mt-only-m,.mt-head .mt-dd-m{display:none}
@media (max-width:700px){
  .mt-head{align-items:flex-start;flex-wrap:nowrap}
  .mt-head > .mt-btn[data-act="exportmany"]{display:none}
  .mt-head .mt-only-m{display:flex}
  .mt-head .mt-dd-m{display:inline-block}
  .mt-head .mt-hl{flex:1 1 0}
  .mt-head .mt-sp{display:none}
  .mt-mine.card .go{white-space:nowrap}
}
.mt-mine.card{width:100%;font-family:inherit;text-align:left;background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600;padding:10px 14px 10px 10px;margin:0 0 14px}
.mt-mine.card:hover{border-color:#E8C770}
.mt-mine.card .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#FBF0D6;color:#7A5500;flex:none}
.mt-mine.card .ic svg{width:19px;height:19px}
.mt-mine.card .mt-new{color:#8A3B12;font-weight:800}
.mt-mine.card .go{color:var(--sb-green);font-weight:800}
html[data-theme="dark"] .mt-mine.card{background:var(--surface);border-color:var(--line);color:var(--ink)}
html[data-theme="dark"] .mt-mine.card .ic{background:#2A2416;color:#E3C878}
html[data-theme="dark"] .mt-mine.card .mt-new{color:#F0B48A}
.mt-mon{font-size:13px;font-weight:900;color:var(--ink-2);margin:14px 4px 6px}
.mt-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:86px minmax(0,1fr) 180px;gap:16px;align-items:start;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
.mt-row:hover{border-color:#9CCBB6}
.mt-row .dt b{display:block;font-size:21px;font-weight:900;line-height:1.1}
.mt-row .dt span{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-top:3px}
.mt-row .ttl{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mt-row .meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.mt-otag{font-size:10.5px;font-weight:800;border-radius:100px;padding:1px 8px;color:#fff}
.mt-tp{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mt-tp button{font-family:inherit;font-size:12.5px;font-weight:600;color:#2E3A35;background:#FFF7C2;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;text-align:left;max-width:100%}
.mt-tp button:hover{background:#FFEE8A}
.mt-tp button i{font-style:normal;font-weight:900;color:#8A6D00;margin-right:4px}
.mt-side{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
.mt-side b{color:var(--ink)}
.mt-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.mt-bar i{display:block;height:100%;background:var(--sb-green)}
.mt-cmt{color:var(--sb-green);font-weight:700}
.mt-new{color:#C2410C;font-weight:900}
.mt-old{font-size:11px;font-weight:800;color:#7A5A00;background:#FFF4B8;border-radius:100px;padding:2px 8px;align-self:flex-start}
.mt-empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--ink-2);font-size:13.5px;line-height:1.8}
/* 검색 B */
.sg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.sg-h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;margin-bottom:8px}
.sg-h b{background:#FFF59D;padding:1px 6px;color:#1F2320}
.sg-h span{font-size:12px;color:var(--ink-2);font-weight:700}
.sg-flow{display:flex;flex-direction:column;gap:0;border-left:2px solid #CFE0D8;margin-left:6px}
.sg-r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:7px 0 7px 14px;cursor:pointer;position:relative}
.sg-r::before{content:'';position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--sb-green);border:2px solid var(--surface)}
.sg-r:hover .sg-l{color:var(--sb-green)}
.sg-d{font-size:12.5px;font-weight:900}
.sg-d small{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
.sg-l{font-size:13px;line-height:1.6;color:var(--ink)}
.sg-l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-l .c{color:var(--ink-2)}
.sg-yr{padding:10px 0 2px;margin-left:-14px}
.sg-yr:first-child{padding-top:0}
.sg-yr span{display:inline-block;font-size:11px;font-weight:900;color:#fff;background:var(--sb-house);border-radius:100px;padding:2px 10px;line-height:1.4}
html[data-theme="dark"] .sg-yr span{background:var(--sb-green)}
.sg-span{font-size:11.5px;font-weight:900;color:var(--sb-green);background:var(--sb-mint-2);border-radius:100px;padding:1px 9px;margin-left:4px}
.sg-l .md-hit,.sg-h .md-hit{font-style:normal;background:#FFE08A;border-radius:3px;color:#1F2320}
/* 문서 보기 */
.dv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.dv-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.dv-paper{background:#fff;color:#1F2320;border:1px solid #DDD9CE;border-radius:6px;padding:40px 48px 48px;box-shadow:0 2px 14px rgba(30,57,50,.07);min-height:600px}
.dv-side{position:sticky;top:56px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
.dv-tabs{display:flex;border-bottom:1px solid var(--line)}
.dv-tabs button{flex:1;font-family:inherit;font-size:12.5px;font-weight:800;border:0;background:transparent;color:var(--ink-2);padding:11px 6px;cursor:pointer;border-bottom:2px solid transparent}
.dv-tabs button.on{color:var(--sb-green);border-bottom-color:var(--sb-green)}
.dv-cl{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dv-tgt{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--sb-mint-2);border-radius:10px;padding:8px 10px;display:flex;gap:6px;align-items:center}
.dv-tgt b{color:var(--ink);font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-tl{display:flex;flex-direction:column;gap:6px}
.dv-tl button{font-family:inherit;text-align:left;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px}
.dv-tl button b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.dv-tl button span{color:var(--sb-green);font-weight:800}
.cm{display:flex;flex-direction:column;gap:4px}
.cm.rp{margin-left:22px;padding-left:10px;border-left:2px solid var(--line)}
.cm .who{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.cm .av{width:24px;height:24px;border-radius:50%;background:var(--sb-mint);color:var(--sb-green);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.cm .who span{font-size:11px;font-weight:600;color:var(--ink-3)}
.cm p{margin:0 0 0 31px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cm p.del{color:var(--ink-3);font-style:italic}
.cm .acts{margin-left:31px;display:flex;gap:10px}
.cm .acts button{font-family:inherit;font-size:11.5px;font-weight:800;color:var(--sb-green);background:none;border:0;padding:0;cursor:pointer}
.cm .acts button.mut{color:var(--ink-3)}
.dv-in{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dv-in .rto{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.dv-in .rto button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-family:inherit;font-size:11.5px}
.dv-in textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:58px;max-height:240px;background:var(--surface);color:var(--ink)}
.dv-in .row{display:flex;gap:6px;align-items:center}
.dv-hint{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.dv-lock{font-size:12px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:100px;padding:4px 12px}
.dv-org{font-size:11.5px;font-weight:800;color:#fff;border-radius:100px;padding:3px 10px}
.dd{position:relative;display:inline-block}
.dd-m{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:200px;z-index:30;display:none}
.dd.open .dd-m{display:block}
.dd-m button{display:flex;width:100%;gap:8px;align-items:center;font-family:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.dd-m button:hover{background:var(--sb-mint-2)}
.dd-m hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:150px}
.pop button{display:flex;width:100%;gap:8px;align-items:center;font-family:inherit;font-size:13px;font-weight:800;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.pop button:hover{background:var(--sb-mint-2)}
/* 내 임무 */
.mk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.mk .tx{flex:1;min-width:0;cursor:pointer}
.mk .tx b{font-size:13.5px;font-weight:800;display:block}
.mk .tx span{font-size:11.5px;color:var(--ink-2)}
.mk .due{font-size:11.5px;font-weight:900;white-space:nowrap}
.mk .due.over{color:#C0392B}.mk .due.soon{color:#B45309}
.mk.done{opacity:.6}
.mk-st{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;flex:none}
.mk-st button{font-family:inherit;font-size:11.5px;font-weight:800;border:0;background:var(--surface);color:var(--ink-3);padding:5px 10px;cursor:pointer}
.mk-st button.on.todo{background:#EEF0EE;color:#5A6560}.mk-st button.on.doing{background:#FEF3C7;color:#B45309}.mk-st button.on.done{background:#E8F3EF;color:#00704A}
.nt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.55}
.nt:hover{background:var(--sb-mint-2)}
.nt.unread{background:#FFFBEA}
html[data-theme="dark"] .nt.unread{background:var(--gold-bg)}
.nt small{display:block;color:var(--ink-3);font-size:11px}
/* 창 */
.mm-ov{position:fixed;inset:0;background:rgba(15,25,21,.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mm-box{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:720px;position:relative;font-family:var(--font-ui,'Noto Sans KR',sans-serif)}
.mm-box.wide{max-width:1100px}
.mm-h{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:900}
.mm-h .x{margin-left:auto;border:0;background:var(--sb-mint-2);color:var(--ink-2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px}
.mm-b{padding:16px 20px;max-height:calc(100vh - 200px);overflow:auto}
.mm-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mm-lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1100;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.mm-lb img{max-width:94vw;max-height:92vh;border-radius:6px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>label{font-size:12px;font-weight:800;color:var(--ink-2)}
.fld input[type=text],.fld input[type=date],.fld input[type=search],.fld select{font-family:inherit;font-size:13.5px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:var(--surface);color:var(--ink)}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--sb-green)}
.rd{display:flex;gap:8px;flex-wrap:wrap}
.rd label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.rd label:has(input:checked){border-color:var(--sb-green);background:var(--sb-mint-2);color:var(--sb-green)}
.rd input{accent-color:var(--sb-green)}
.hist{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.hv{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;margin-bottom:6px;font-size:12.5px;line-height:1.5}
.hv.on{border-color:var(--sb-green);background:var(--sb-mint-2)}
.hv b{font-weight:900}.hv small{display:block;color:var(--ink-2)}
.hd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.hd h4{margin:0 0 6px;font-size:13.5px}
.hd .ln{font-size:13px;line-height:1.7;padding:1px 8px;border-radius:4px;white-space:pre-wrap}
.hd .ln.m{background:#FDECEA}.hd .ln.p{background:#E8F3EF}
.hd del{background:#F8C9C4;text-decoration:line-through;color:#7F1D1D}
.hd ins{background:#BDE5D2;text-decoration:none;color:#064E3B}
html[data-theme="dark"] .hd .ln.m{background:#3A1B1B}html[data-theme="dark"] .hd .ln.p{background:#123326}
.set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:100px;padding:4px 6px 4px 12px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0}
.tg button{border:0;background:var(--sb-mint-2);border-radius:50%;width:20px;height:20px;cursor:pointer;color:var(--ink-2);font-size:11px}
.vt{width:100%;border-collapse:collapse;font-size:13px}
.vt td,.vt th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.vt th{font-size:12px;color:var(--ink-2)}
/* 🏛 v176 예전 회의록 넣기 — 해마다 묶음 · 주제 미리 보기 · 같은 날 표시 */
.imp-bar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-bottom:6px}
.imp-list{max-height:min(56vh,520px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 6px}
.imp-yh td{position:sticky;top:0;background:var(--surface);font-weight:800;font-size:12.5px;color:var(--ink-2);padding-top:10px;z-index:1}
.imp-tp{margin:2px 0 0 26px;font-size:12.5px;color:var(--ink-2)}.imp-tp summary{cursor:pointer;color:var(--ink-3);font-size:12px}
.imp-tp ol{margin:4px 0 2px;padding-left:18px;line-height:1.6}
.imp-sd{display:inline-block;max-width:220px;color:#B7791F;font-weight:700;text-align:right}
.imp-fn{max-width:240px;margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.imp-fn,.imp-sd{max-width:130px}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1E3932;color:#fff;font-family:var(--font-ui,'Noto Sans KR',sans-serif);font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:12px;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:#B42318}
@media (max-width:1000px){
  .dv-grid{grid-template-columns:1fr}
  .dv-side{position:static;max-height:none}
  .hist{grid-template-columns:1fr}
}

    <div class="mm-h">${title}<button class="x" aria-label="닫기" data-x>✕</button></div>

  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  ov.addEventListener('mousedown', e => { if(e.target === ov) close(); });

function notifyComment(m, c){
  const to = new Map();
  /* 🔒 v175 주임 회의록 — 알림은 지금 멤버 · 수퍼관리자 · (주제 댓글이면) 지금 그 주제를 공유받은 선생님에게만 (빠진 멤버 · 거둔 공유에는 안 감) */
  const shU = LEAD && c.tgt.startsWith('t:') ? ((SHARES[shareKey(m.id, c.tgt.slice(2))] || {}).uids || []) : [];
  const ok = uid => !LEAD || LCFG.uids.includes(uid) || (SMAP[uid] && SMAP[uid].role === 'super') || shU.includes(uid);
  const add = (uid, kind) => { if(uid && uid !== CU.uid && !to.has(uid) && ok(uid)) to.set(uid, kind); };
  if(c.replyTo) add(c.replyTo.uid, 'reply');
  add(m.writerUid, 'cmt'); add(m.createdBy, 'cmt');
  if(c.tgt === 'm'){ for(const [u, a] of Object.entries(m.att || {})) if(a && a.s === 'o') add(u, 'cmt'); }
  else if(c.tgt.startsWith('t:')){ const t = (m.topics || []).find(x => x.id === c.tgt.slice(2)); (t && t.tasks || []).forEach(k => (k.uids || []).forEach(u => add(u, 'cmt'))); }
  else if(c.tgt.startsWith('k:')){ for(const t of m.topics || []) for(const k of t.tasks || []) if(C.taskKey(m.id, k.id) === c.tgt.slice(2)) (k.uids || []).forEach(u => add(u, 'cmt')); }
  CMTS.filter(x => x.tgt === c.tgt && !x.del).forEach(x => add(x.uid, 'cmt'));
  const where_ = tgtName(c.tgt);
  const jobs = [...to.entries()].slice(0, 40).map(([uid, kind]) => addDoc(collection(db, 'mtgNotifs'), {
    toUid: uid, kind, meetingId: m.id, org: m.org, ...(LEAD ? { book: 'lead', shareKey: c.shareKey || '' } : {}), mtitle: C.titleOf(m), date: m.date, tgt: c.tgt, where: where_,
    text: c.text.slice(0, 140), fromUid: CU.uid, fromName: CU.name || '', at: serverTimestamp(), read: false }).catch(()=>{}));
  if(jobs.length && !LEAD) Promise.all(jobs).then(() => dailyEv('mtg', { meetingId: m.id }));   // 🔔 v135 방금 남긴 알림을 휴대폰으로도 (주임 회의록은 화면 알림만)
}

async function openHistory(m, focus){
  const md = modal(`🕘 수정 이력 — ${esc(C.fmtMDY(m.date))} ${esc(C.titleOf(m))}`, `<div class="mt-empty" style="border:0">불러오는 중…</div>`, '', 'wide');
  let vs = [];
  try{
    const s = await getDocs(query(collection(db, COL.v), where('meetingId', '==', m.id), where('org', '==', m.org)));
    vs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.rev - a.rev);
  }catch(e){ md.box.querySelector('.mm-b').innerHTML = `<div class="mt-empty">수정 이력을 불러오지 못했어요.</div>`; return; }
  if(!vs.length){ md.box.querySelector('.mm-b').innerHTML = `<div class="mt-empty">아직 수정 이력이 없어요.</div>`; return; }
  let sel = (focus && focus.rev && vs.find(v => v.rev === +focus.rev)) || vs[0];
  const tid = focus && focus.tid;
  const paint = () => {
    const prev = vs.find(v => v.rev === sel.rev - 1);
    const A = prev ? prev.data : null, B = sel.data;
    let diff = '';
    if(!A) diff = `<div class="dv-hint">처음 작성한 모습이에요.</div>`;
    else {
      const head = [];
      for(const [k, l] of [['date','날짜'],['time','시각'],['place','장소'],['type','회의 종류'],['title','제목']]) if((A[k] || '') !== (B[k] || '')) head.push(`<div class="ln m">${l}: <del>${esc(A[k] || '')}</del></div><div class="ln p">${l}: <ins>${esc(B[k] || '')}</ins></div>`);
      if(JSON.stringify(A.att || {}) !== JSON.stringify(B.att || {})){
        const a = C.attSplit(A), b = C.attSplit(B);
        const fmt = s => `참석 ${s.on.length} · 불참 ${s.off.map(x => x.name + (x.r ? '(' + x.r + ')' : '')).join(', ') || '없음'}`;
        head.push(`<div class="ln m"><del>${esc(fmt(a))}</del></div><div class="ln p"><ins>${esc(fmt(b))}</ins></div>`);
      }
      if(head.length) diff += `<div class="hd" style="margin-bottom:10px"><h4>머리 · 참석</h4>${head.join('')}</div>`;
      const AT = new Map((A.topics || []).map(t => [t.id, t]));
      const BT = new Map((B.topics || []).map(t => [t.id, t]));
      (B.topics || []).forEach((t, i) => {
        if(tid && t.id !== tid) return;
        const p = AT.get(t.id);
        const la = p ? [p.title || '', ...C.topicLines(p)] : [], lb = [t.title || '', ...C.topicLines(t)];
        if(JSON.stringify(la) === JSON.stringify(lb)) return;
        const rows = C.diffLines(la, lb).filter(r => r.t !== '=' || la.length + lb.length < 30);
        diff += `<div class="hd" style="margin-bottom:10px"><h4>${i + 1}. ${esc(t.title || '')}${p ? '' : ' <span style="color:#00704A">(새 주제)</span>'}</h4>
          ${rows.map(r => `<div class="ln ${r.t === '-' ? 'm' : r.t === '+' ? 'p' : ''}">${r.html}</div>`).join('')}</div>`;
      });
      for(const [id, p] of AT) if(!BT.has(id) && (!tid || id === tid)) diff += `<div class="hd" style="margin-bottom:10px"><h4><del>${esc(p.title || '')}</del> <span style="color:#C0392B">(뺀 주제)</span></h4></div>`;
      if(!diff) diff = `<div class="dv-hint">${tid ? '이 주제는 이번에 바뀌지 않았어요.' : '내용은 그대로예요.'}</div>`;
    }
    md.box.querySelector('.mm-b').innerHTML = `<div class="hist"><div>${vs.map(v => `<div class="hv${v === sel ? ' on' : ''}" data-rev="${v.rev}">
        <b>${v.rev}번째</b> · ${esc(v.name || '')} 님 · ${esc(C.fmtStamp(C.tsMs(v.at) || v.atMs))}${v === vs[0] ? ' <span style="color:var(--sb-green);font-weight:900">지금</span>' : ''}
        <small>${esc(v.sum || '')}</small></div>`).join('')}</div>
      <div><div style="font-size:13px;font-weight:900;margin-bottom:8px">${prev ? `${prev.rev}번째 → ${sel.rev}번째에서 바뀐 곳` : `${sel.rev}번째 — 처음 모습`}${tid ? ' · 이 주제만' : ''}</div>${diff}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="mt-btn" data-h="view">${sel.rev}번째 모습 전체 보기</button>
        ${tid ? '<button class="mt-btn" data-h="all">모든 주제 보기</button>' : ''}
        ${canWrite(m.org) && !m.deleted && sel !== vs[0] ? `<button class="mt-btn p" data-h="revert">이 모습으로 되돌리기</button><span class="dv-hint" style="align-self:center">되돌리기도 한 번의 수정으로 남아요</span>` : ''}</div></div></div>`;
  };
  md.box.addEventListener('click', async e => {
    const hv = e.target.closest('.hv'); if(hv){ sel = vs.find(v => v.rev === +hv.dataset.rev); paint(); return; }
    const b = e.target.closest('[data-h]'); if(!b) return;
    if(b.dataset.h === 'all'){ focus = null; md.close(); openHistory(m, { rev: sel.rev }); return; }
    if(b.dataset.h === 'view'){
      const v = modal(`${sel.rev}번째 모습 · ${esc(sel.name || '')} 님 · ${esc(C.fmtStamp(C.tsMs(sel.at) || sel.atMs))}`, `<div class="dv-paper" style="min-height:0">${C.renderDoc({ ...sel.data, id: m.id, org: m.org }, { ...SAFE, files: Object.fromEntries(STORE.cache) })}</div>`, '', 'wide');
      loadImagesIn(v.box); return;
    }
    if(b.dataset.h === 'revert'){
      if(!confirm(`${sel.rev}번째 모습으로 되돌릴까요? 지금 모습도 이력에 그대로 남아요.`)) return;
      if(!EDITOR_MOD) EDITOR_MOD = await import('./minutes-editor.js');
      try{ await EDITOR_MOD.saveRevert(edCtx(), m, sel); md.close(); toast(`${sel.rev}번째 모습으로 되돌렸어요`); }
      catch(err){ toast(err.message === 'conflict' ? '그 사이 다른 분이 고쳤어요 — 다시 열어 주세요.' : '되돌리지 못했어요 — ' + (err.code || err.message), 'err'); }
    }
  });
  paint();
}

}
async function doExport(list, fmt, opts, name){
  const files = {}, sizes = {};
  if(opts.img){
    const fids = [];
    list.forEach(m => (m.topics || []).forEach(t => (t.body || []).forEach(b => { if(b.k === 'img') fids.push(b.fid); if(b.k === 'pdf') fids.push(...(b.fids || [])); })));
    await Promise.all(fids.map(async f => { try{ const s = await STORE.getImage(f); if(s) files[f] = s; }catch(e){} }));
    if(fmt === 'docx') await Promise.all(Object.entries(files).map(([f, s]) => new Promise(res => { const im = new Image(); im.onload = () => { sizes[f] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.onerror = res; im.src = s; })));
  }
  const comments = {};
  if(opts.cmt){
    for(const m of list){
      if(CUR && CUR.id === m.id){ comments[m.id] = CMTS.map(c => ({ ...c, at: C.tsMs(c.at) })); continue; }
      try{ const s = await getDocs(query(collection(db, COL.c), where('meetingId', '==', m.id), where('org', '==', m.org)));
        comments[m.id] = s.docs.map(d => { const c = { id: d.id, ...d.data() }; c.at = C.tsMs(c.at); return c; });
        if(LEAD) for(const t of m.topics || []){ try{ const ts = await getDocs(collection(db, 'leadTopicCmts', shareKey(m.id, t.id), 'c'));
          ts.forEach(d => { const c = { id: d.id, ...d.data() }; c.at = C.tsMs(c.at); comments[m.id].push(c); }); }catch(e){} }
      }catch(e){ comments[m.id] = []; }
    }
  }
  const tasks = {};
  for(const m of list) (m.topics || []).forEach(t => (t.tasks || []).forEach(k => { const key = C.taskKey(m.id, k.id); const d = taskOf(key); if(d) tasks[key] = d; }));
  if(fmt === 'docx'){
    const { buildDocx } = await import('./minutes-docx.js');
    saveBlob(buildDocx(list, opts, { tasks, files, sizes, comments }), name + '.docx');
    toast('워드 파일을 받았어요 — 받은 파일 폴더를 확인해 주세요');
    return;
  }
  printHTML(printDoc(list, opts, { tasks, files, comments }, name), fmt, name);
}
function printDoc(list, opts, ctx, name){
  const cctx = { ...SAFE, print: true, tasks: ctx.tasks, files: ctx.files, opts: { att: opts.att, img: opts.img, tbl: opts.img } };
  let sumHtml = '';
  if(opts.sum && list.length){
    const rows = C.summaryRows(list, ctx.tasks);
    sumHtml = `<section class="pg"><h1 class="md-title" style="letter-spacing:.05em">${esc(opts.title)}</h1>
      <div style="text-align:center;font-size:12px;color:#5A6560;margin-bottom:14px">${esc(C.fmtLong(list[0].date))} ~ ${esc(C.fmtLong(list[list.length - 1].date))} · ${list.length}건</div>
      ${rows.length ? `<table class="sumt"><thead><tr><th style="width:62px">날짜</th><th style="width:28%">주제</th><th>결정</th><th style="width:34%">임무 (담당 · 기한 · 상태)</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(C.fmtMDY(r.m.date))}</td><td>${r.i + 1}. ${esc(r.t.title || '')}</td><td>${r.dec.map(esc).join('<br>')}</td>
        <td>${r.tk.map(k => `${esc(k.h)}${k.who ? ' · <b>' + esc(k.who) + '</b>' : ''}${k.due ? ' · ' + esc(C.fmtMD(k.due)) + '까지' : ''} · ${(C.STATUS[k.st] || C.STATUS.todo).l}`).join('<br>')}</td></tr>`).join('')}</tbody></table>`
      : '<p style="text-align:center;color:#5A6560">이 기간에는 적힌 결정 · 임무가 없어요.</p>'}</section>`;
  }
  const docs = list.map(m => {
    let h = `<section class="pg">${C.renderDoc(m, cctx)}`;
    const cm = (ctx.comments[m.id] || []).filter(c => !c.del);
    if(opts.cmt && cm.length){
      const roots = cm.filter(c => !c.root).sort((a, b) => a.at - b.at);
      const tn = c => c.tgt === 'm' ? '회의록' : c.tgt.startsWith('t:') ? (() => { const i = (m.topics || []).findIndex(t => 't:' + t.id === c.tgt); return i >= 0 ? `${i + 1}. ${m.topics[i].title || ''}` : '주제'; })() : '임무';
      h += `<div class="pcm"><h3>댓글</h3>${roots.map(r => `<div class="pc"><b>${esc(r.name)}</b> <small>${esc(C.fmtStamp(r.at))} · ${esc(tn(r))}</small><div>${esc(r.text)}</div>
        ${cm.filter(c => c.root === r.id).sort((a, b) => a.at - b.at).map(c => `<div class="pc rp"><b>↳ ${esc(c.name)}</b> <small>${esc(C.fmtStamp(c.at))}</small><div>${esc(c.text)}</div></div>`).join('')}</div>`).join('')}</div>`;
    }
    return h + '</section>';
  }).join('');
  const cssStr = t => String(t || '').replace(/[\\"<>\n\r]/g, c => '\\' + c.charCodeAt(0).toString(16) + ' ');
  const head = opts.head ? `@top-right{content:"${cssStr(opts.title)}";font-size:8pt;color:#93A09A;font-family:'Noto Sans KR',sans-serif}
    @bottom-center{content:counter(page) " / " counter(pages);font-size:8.5pt;color:#93A09A;font-family:'Noto Sans KR',sans-serif}` : '';
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${esc(name)}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
    <style>${C.DOC_CSS}
    @page{size:A4;margin:15mm 14mm 17mm;${head}}
    html,body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .pg+.pg{break-before:page}
    .md-th{break-after:avoid}.md-dec,.md-task,.md-img,.md-pg,.md-file,.md-link,tr{break-inside:avoid}
    .md-img img{max-height:300px}.md-pg img{max-width:100%}
    .sumt{width:100%;border-collapse:collapse;font-size:10pt}.sumt th{background:#1E3932;color:#fff;padding:6px;text-align:left}
    .sumt td{border:1px solid #C9C5B9;padding:5px 6px;vertical-align:top;line-height:1.5}
    .pcm{margin-top:18px;border-top:1px solid #C9C5B9;padding-top:8px}.pcm h3{font-size:12pt;margin:0 0 6px}
    .pc{font-size:10pt;margin:0 0 7px;break-inside:avoid}.pc small{color:#6B7670}.pc.rp{margin:5px 0 0 18px}
    </style></head><body>${sumHtml}${docs}</body></html>`;
}
function printHTML(html, fmt, name){
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(fr);
  const d = fr.contentDocument; d.open(); d.write(html); d.close();
  const fire = async () => {
    try{ await Promise.race([fr.contentDocument.fonts.ready, new Promise(r => setTimeout(r, 2500))]); }catch(e){}
    await Promise.all([...fr.contentDocument.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 4000); })));
    if(fmt === 'pdf') toast('인쇄 창에서 «대상»을 «PDF로 저장»으로 고르세요');
    // 크롬은 «PDF로 저장» 이름을 바깥 화면 제목에서 가져온다 → 인쇄하는 동안만 바깥 제목도 같은 이름으로 (v-115)
    fr.contentWindow.focus();
    if(window.FN && name) FN.printAs(name, () => fr.contentWindow.print()); else fr.contentWindow.print();
    setTimeout(() => fr.remove(), 60000);
  };
  setTimeout(fire, 300);
}

        <div>${draft.absence.map((t, i) => `<span class="tg">${esc(t)}<button data-del-abs="${i}" aria-label="빼기">✕</button></span>`).join('')}</div>

        «기본»은 교직원 명부의 접근 기관이라 원래 볼 수 있어요.</div>
        <input type="search" id="vw-q" placeholder="이름으로 찾기" style="font-family:inherit;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;width:240px;margin-bottom:8px">

    const dt = e.target.closest('[data-del-type]'); if(dt){ const [o, i] = dt.dataset.delType.split('|'); draft.types[o].splice(+i, 1); paint(); return; }
    const at = e.target.closest('[data-add-type]'); if(at){ const o = at.dataset.addType; const inp = body.querySelector(`[data-add-type-in="${o}"]`); const v = inp.value.trim(); if(v){ (draft.types[o] = draft.types[o] || []).includes(v) || draft.types[o].push(v); paint(); } return; }
    const da = e.target.closest('[data-del-abs]'); if(da){ draft.absence.splice(+da.dataset.delAbs, 1); paint(); return; }
    if(e.target.closest('[data-add-abs]')){ const v = body.querySelector('#abs-in').value.trim(); if(v && !draft.absence.includes(v)){ draft.absence.push(v); paint(); } return; }

  });
  md.box.querySelector('#st-save').onclick = async () => {
    try{
      if(isSuper()) await setDoc(doc(db, 'minutesConfig', 'main'), { types: draft.types, absence: draft.absence, viewers: draft.viewers, updatedAt: serverTimestamp(), updatedBy: CU.name || '' });
      else await setDoc(doc(db, 'minutesConfig', 'main'), { types: draft.types, absence: draft.absence, updatedAt: serverTimestamp(), updatedBy: CU.name || '' }, { merge: true });   // 담당자는 열람 기관(viewers)을 건드리지 않음
      await setDoc(doc(db, 'minutesConfig', 'types'), { ...Object.fromEntries(MORDER.map(o => [o, draft.types[o] || []])), updatedAt: serverTimestamp(), updatedByName: CU.name || '' });
      CFG = { ...CFG, ...draft }; computeOrgs(); toast('설정을 저장했어요'); md.close();
      if(VIEW === 'list') renderList();
    }catch(e){ toast('저장하지 못했어요 — ' + (e.code || e.message), 'err'); }
  };
  paint();
}
/* 휴지통에 든 회의록의 임무는 홈 · 내 임무 · 뱃지에서 숨긴다 */
async function markTasks(mid, del){
  try{
    const s = await getDocs(query(collection(db, COL.t), where('meetingId', '==', mid)));
    const b = writeBatch(db); s.forEach(d => b.update(d.ref, { deleted: !!del, updatedAt: serverTimestamp() }));
    /* 🔒 v175 휴지통에 든 회의의 공유 주제는 공유받은 선생님이 못 읽게 — 공유 명단을 잠시 비우고(held 에 맡김) 되살리면 돌려놓음 */
    if(LEAD) Object.values(SHARES).filter(x => x.meetingId === mid).forEach(x => b.update(doc(db, 'leadShares', x.id), del
      ? { mdel: true, held: (x.uids || []).length ? x.uids : (x.held || []), uids: [], updatedAt: serverTimestamp() }
      : { mdel: false, uids: x.gone ? [] : ((x.uids || []).length ? x.uids : (x.held || [])), held: x.gone ? (x.held || []) : [], updatedAt: serverTimestamp() }));
    await b.commit();
    try{ window.refreshBadges && refreshBadges(); }catch(e){}
  }catch(e){ console.warn('tasks', e); }
}
async function paintTrash(box){
  const out = [];
  for(const o of SEE){ try{ const s = await getDocs(query(collection(db, COL.m), where('org', '==', o), where('deleted', '==', true))); s.forEach(d => out.push({ id: d.id, ...d.data() })); }catch(e){} }
  if(!out.length){ box.innerHTML = `<div class="dv-hint">휴지통이 비었어요.</div>`; return; }
  box.innerHTML = `<table class="vt"><tbody>${out.map(m => `<tr><td>${esc(C.fmtMDY(m.date))} ${esc(C.titleOf(m))} <span style="color:var(--ink-3)">${esc(C.MORG_SHORT[m.org])} · ${esc(m.deletedByName || '')}</span></td>
    <td style="text-align:right">${(LEAD ? LEAD_ADM : canWrite(m.org)) ? `<button class="mt-btn sm" data-restore="${esc(m.id)}">되살리기</button>` : `<span style="color:var(--ink-3);font-size:12px" title="이 기관은 열람만 허락되어 있어요">열람만</span>`}${isSuper() ? ` <button class="mt-btn sm" data-purge="${esc(m.id)}" style="color:#C0392B">완전히 지우기</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
  box.onclick = async e => {
    const r = e.target.closest('[data-restore]'), p = e.target.closest('[data-purge]');
    if(r){ try{ await updateDoc(doc(db, COL.m, r.dataset.restore), { deleted: false }); }catch(err){ toast('되살리지 못했어요 — ' + (err.code || err.message), 'err'); return; }
      await markTasks(r.dataset.restore, false); mtgLog('되살림', out.find(x => x.id === r.dataset.restore) || { id: r.dataset.restore }); toast('되살렸어요'); paintTrash(box); }
    if(p && confirm('완전히 지우면 되돌릴 수 없어요 (수정 이력은 남아요). 지울까요?')){ await deleteDoc(doc(db, COL.m, p.dataset.purge));
      mtgLog('완전 삭제', out.find(x => x.id === p.dataset.purge) || { id: p.dataset.purge });
      if(LEAD) for(const x of Object.values(SHARES).filter(y => y.meetingId === p.dataset.purge)) deleteDoc(doc(db, 'leadShares', x.id)).catch(() => {});   // 🔒 v175 공유본도 함께
      toast('지웠어요'); paintTrash(box); }
  };
}
/* 예전 회의록 넣기 — 함께 담아 둔 «PDF에서 옮긴 파일»들 또는 직접 고른 .json
   (v-96) 옮김 파일이 여러 개 — 학기별로 골라 보기 · PDF를 고르면 «Claude에게 보내 주세요» 안내 */
// v128 옮김 파일(minutes-import-*.json)은 사이트에서 뺐다 — 깃허브 공개 저장소라 회의 내용을 누구나 내려받을 수 있었다.
//      목록은 비우고, 아직 안 넣은 회의록이 있으면 배포 묶음 «보관» 폴더의 .json 을 아래 «다른 옮김 파일»로 골라 넣는다
//      (고르면 이미 넣은 회의록은 «이미 넣음»으로 보이고 건너뛴다)
const IMPORT_PACKS = [];
/* 🏛 v176 주임 회의록(?book=lead)에도 «예전 회의록 넣기» — 한글(HWP)에서 옮긴 파일(book:'lead')만 받고, 일반 회의록 쪽에서는 받지 않는다
   (주임 회의 내용이 교직원 회의록으로 잘못 들어가면 모두가 보게 되니 — 반대 방향도 막음) */
function impLabelOf(m){ return C.impLabel ? C.impLabel(m) : 'PDF에서 옮김'; }   // 예전 minutes-core.js 가 남아 있어도 안전하게
const isLeadPack = pk => !!pk && (pk.book === 'lead' || /한글|hwp|주임/i.test(String(pk.source || '')) || (pk.meetings || []).some(m => m && m.org === 'lead'));
/* 주임 회의록 쪽: 다른 기관 값이 섞인 파일은 받지 않음 (교직원 회의록이 주임 회의록으로 잘못 들어가지 않게) */
const leadPackMixed = pk => (pk.meetings || []).some(m => m && m.org && m.org !== 'lead');
async function paintImport(box){
  const packs = [];
  if(!LEAD) for(const p of IMPORT_PACKS){
    try{ const r = await fetch(p.file + '?_=' + Date.now(), { cache: 'no-store' }); if(r.ok){ const j = await r.json(); if(j && Array.isArray(j.meetings)) packs.push({ label: p.label, pk: j }); } }catch(e){}
  }
  let cur = 0;
  const draw = async (pk) => {
    const ms = (pk && pk.meetings) || [];
    const exists = new Set(), sameDay = new Map();
    if(LEAD && ms.length){
      /* 한 번에 — 이미 넣은 것(같은 id) · 같은 날 이미 있는 회의록(직접 쓴 것) */
      try{ const s = await getDocs(query(collection(db, COL.m), where('org', '==', 'lead')));
        s.forEach(d => { const x = d.data(); exists.add(d.id); if(!x.deleted && x.date){ const a = sameDay.get(x.date) || []; a.push(C.titleOf(x)); sameDay.set(x.date, a); } }); }catch(e){ console.warn('import check', e); }
    } else if(!LEAD){
      for(const m of ms){ try{ const s = await getDoc(doc(db, COL.m, m.id)); if(s.exists()) exists.add(m.id); }catch(e){} }
    }
    const dayOf = m => exists.has(m.id) ? [] : (sameDay.get(m.date) || []);
    const own = pk && !packs.some(p => p.pk === pk);
    const tabs = packs.length > 1 || own ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${packs.map((p, i) =>
      `<button class="mt-btn sm${!own && i === cur ? ' p' : ''}" data-pk="${i}">${esc(p.label)} · ${p.pk.meetings.length}건</button>`).join('')}${own ? `<button class="mt-btn sm p" disabled>고른 파일 · ${ms.length}건</button>` : ''}</div>` : '';
    const years = [...new Set(ms.map(m => String(m.date).slice(0, 4)))].sort().reverse();
    const rowOf = m => { const sd = dayOf(m), done = exists.has(m.id);
      return `<tr><td><label class="ck" style="padding:0"><input type="checkbox" class="imp-ck" data-y="${esc(String(m.date).slice(0, 4))}"${sd.length ? ' data-sd="1"' : ''} value="${esc(m.id)}"${done ? ' disabled' : sd.length ? '' : ' checked'}>
        ${esc(C.fmtLong(m.date, m.time))} · <b>${esc(C.titleOf(m))}</b>${LEAD ? '' : ' · ' + esc(MORG[m.org] || m.org)} · 주제 ${(m.topics || []).length}개</label>
        ${(m.topics || []).length ? `<details class="imp-tp"><summary>주제 보기</summary><ol>${(m.topics || []).map(t => `<li>${esc(t.title || '(제목 없음)')}</li>`).join('')}</ol></details>` : ''}</td>
        <td style="text-align:right;color:var(--ink-3);font-size:12px;vertical-align:top">${done ? '이미 넣음' : ''}${sd.length ? `<span class="imp-sd">같은 날 «${esc(sd.join(', '))}»이 이미 있어요 — 겹치면 빼 두세요</span>` : ''}${m.warn ? '<div>⚠ ' + esc(m.warn) + '</div>' : ''}${m.file ? `<div class="imp-fn">${esc(m.file)}</div>` : ''}</td></tr>`; };
    const nDone = ms.filter(m => exists.has(m.id)).length, nSd = ms.filter(m => dayOf(m).length).length;
    box.innerHTML = tabs + `<div class="dv-hint" style="margin-bottom:10px">${pk ? `<b>${esc(pk.source || '')}</b>에서 옮긴 회의록 ${ms.length}건이에요. ${esc(pk.note || '')}` : (LEAD ? 'Claude가 한글 파일에서 옮겨 드린 «주임회의록-옮김-….json» 파일을 아래에서 골라 주세요. 배포 묶음 «7_보관 (깃허브에 올리지 마세요)» 폴더에 있어요.' : '함께 담긴 옮김 파일이 없어요.')}
        ${pk ? `참석 · 임무는 비워 두고, 번호 개요 · 노란 주제 · 표를 살려 넣어요. 이미 넣은 회의록은 건너뛰어요.${nDone ? ` (이미 넣음 ${nDone}건)` : ''}${nSd ? ` · <b>같은 날 회의록이 이미 있는 ${nSd}건은 골라 두지 않았어요</b> — 겹치지 않으면 직접 골라 주세요.` : ''}` : ''}</div>
      ${ms.length ? `<div class="imp-bar"><label class="ck"><input type="checkbox" id="imp-all" checked>모두 고르기${nSd ? ' <span class="dv-hint">(같은 날 회의록이 있는 줄은 빼고)</span>' : ''}</label>${years.length > 1 ? years.map(y => { const ys = ms.filter(m => String(m.date).startsWith(y)), open = ys.filter(m => !exists.has(m.id) && !dayOf(m).length);

      <div style="display:flex;gap:8px;margin-top:12px;align-items:center"><button class="mt-btn p" id="imp-go">고른 회의록 넣기</button><span class="dv-hint" id="imp-st"></span></div>` : ''}
      <div style="margin-top:16px" class="dv-hint">${LEAD ? '옮김 파일(.json)' : '다른 옮김 파일(.json)이 있으면'}: <input type="file" id="imp-file" accept=".json,application/json,.pdf,application/pdf,.hwp,.hwpx"></div>
      <div class="dv-hint" id="imp-pdf" style="display:none;margin-top:8px;padding:10px 12px;border-radius:10px;background:#FFF8E1;color:#7A5B00"></div>`;
    box.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { cur = +b.dataset.pk; draw(packs[cur].pk); });

    const all = box.querySelector('#imp-all'); if(all) all.onchange = () => { box.querySelectorAll('.imp-ck:not(:disabled):not([data-sd])').forEach(c => c.checked = all.checked); box.querySelectorAll('.imp-y').forEach(y => y.checked = all.checked); };
    box.querySelectorAll('.imp-y').forEach(y => y.onchange = () => box.querySelectorAll(`.imp-ck[data-y="${y.value}"]:not(:disabled):not([data-sd])`).forEach(c => c.checked = y.checked));
    const note = (h) => { const n = box.querySelector('#imp-pdf'); n.innerHTML = h; n.style.display = ''; };
    box.querySelector('#imp-file').onchange = async e => {
      const f = e.target.files[0]; if(!f) return;

        Claude에게 PDF를 보내 주시면 «옮김 파일»로 만들어 드려요. 그 파일을 여기서 고르고 «넣기»만 누르면 돼요.`); e.target.value = ''; return; }
      if(/\.hwpx?$/i.test(f.name)){ note(`📄 <b>한글 파일은 여기서 바로 넣을 수 없어요.</b> Claude에게 한글 파일을 보내 주시면 «옮김 파일(.json)»로 만들어 드려요.`); e.target.value = ''; return; }
      let j = null; try{ j = JSON.parse(await f.text()); }catch(err){}
      if(!j || !Array.isArray(j.meetings)){ toast('회의록 옮김 파일(.json)이 아니에요.', 'err'); e.target.value = ''; return; }
      if(LEAD && !isLeadPack(j)){ note(`이 파일은 <b>교직원 회의록</b> 옮김 파일이에요. 주임 회의록에는 넣지 않아요 — 회의록 탭 › ⚙ 설정 › «예전 회의록 넣기»에서 넣어 주세요.`); e.target.value = ''; return; }
      if(LEAD && leadPackMixed(j)){ note(`이 파일에는 <b>주임 회의록이 아닌 회의록</b>(기관: ${esc([...new Set(j.meetings.map(m => m && m.org).filter(o => o && o !== 'lead'))].map(o => MORG[o] || o).join(', '))})이 섞여 있어요. 주임 회의록에는 넣지 않아요.`); e.target.value = ''; return; }

      go.disabled = true; let n = 0, k = 0, bad = 0;

      for(let i = 0; i < pickd.length; i += 4){
        await Promise.all(pickd.slice(i, i + 4).map(async m => {
          try{ if(await importOne(m, pk.source || (LEAD ? '주임 회의록 한글 파일' : ''))) n++; }catch(err){ bad++; console.error(err); toast(`${C.fmtMDY(m.date)} 회의록을 넣지 못했어요 — ${err.code || err.message}`, 'err'); }
          k++; if(st) st.textContent = `${k}/${pickd.length} 넣는 중…`;

}

  const id = $I('l-id').value.trim(), pw = $I('l-pw').value, msg = $I('l-msg'); msg.textContent = '';
  try{ await signInWithEmailAndPassword(auth, `${id}@gyosa-seongyosa.staff`, pw); }
  catch(e){ msg.textContent = '로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
boot();
