<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 · 교사 선교사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
/* ═══ 📝 회의록 (v-93) — 목록 A(날짜순 + 주제 칩) · 검색 B(주제로 모아 보기) · 문서 A(지금 회의록 모양)
   (v-100) 기본 보기: 목록 C(목차 · ☆ 모아 두기) · 문서 B(결정 · 임무 먼저) — A 모양은 단추로 바꿔 볼 수 있고 출력은 문서 A 그대로 ═══ */
#mt{width:100%;max-width:var(--page-dash,1680px);margin:0 auto;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);padding-bottom:80px}
#mt *{box-sizing:border-box}
.mt-btn{font-family:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:0 14px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.mt-btn:hover{border-color:var(--sb-green)}
.mt-btn.p{background:var(--sb-house);border-color:var(--sb-house);color:#fff}
.mt-btn.g{background:var(--sb-green);border-color:var(--sb-green);color:#fff}
.mt-btn.sm{height:32px;font-size:12px;padding:0 11px}
.mt-btn.ghost{background:transparent}
.mt-btn:disabled{opacity:.45;cursor:not-allowed}
.mt-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mt-head .cr{font-size:12px;font-weight:700;color:var(--ink-2)}
.mt-head h1{margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.mt-sp{flex:1}
.mt-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mt-seg button{font-family:inherit;font-size:12.5px;font-weight:800;border:0;background:transparent;color:var(--ink-2);padding:0 13px;height:36px;cursor:pointer;white-space:nowrap}
.mt-seg button+button{border-left:1px solid var(--line)}
.mt-seg button.on{background:var(--sb-house);color:#fff}
.mt-seg button.da.on{background:#2B5797}
.mt-filt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mt-chip{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:100px;padding:0 12px;height:32px;cursor:pointer;white-space:nowrap}
.mt-chip.on{background:var(--sb-mint-2);border-color:#9CCBB6;color:var(--sb-green)}
.mt-sel{font-family:inherit;font-size:13px;font-weight:700;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink)}
.mt-search{display:flex;align-items:center;gap:8px;height:40px;flex:1;min-width:240px;max-width:420px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.mt-search input{border:0;outline:none;font-family:inherit;font-size:13.5px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.mt-search button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px}
.mt-sum{font-size:12.5px;color:var(--ink-2);margin:4px 2px 12px}
.mt-sum b{color:var(--ink)}
.mt-mine{display:flex;align-items:center;gap:10px;background:#FBF6E6;border:1px solid #EADBA8;border-radius:12px;padding:10px 14px;margin-bottom:12px;cursor:pointer;color:#5C4A00;font-size:13px;font-weight:700}
html[data-theme="dark"] .mt-mine{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.mt-mine b{font-weight:900}.mt-mine .go{margin-left:auto}
.mt-mon{font-size:13px;font-weight:900;color:var(--ink-2);margin:14px 4px 6px}
.mt-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:86px minmax(0,1fr) 180px;gap:16px;align-items:start;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
.mt-row:hover{border-color:#9CCBB6}
.mt-row .dt b{display:block;font-size:21px;font-weight:900;line-height:1.1}
.mt-row .dt span{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-top:3px}
.mt-row .ttl{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mt-row .meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.mt-otag{font-size:10.5px;font-weight:800;border-radius:100px;padding:1px 8px;color:#fff}
.mt-tp{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mt-tp button{font-family:inherit;font-size:12.5px;font-weight:600;color:#2E3A35;background:#FFF7C2;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;text-align:left;max-width:100%}
.mt-tp button:hover{background:#FFEE8A}
.mt-tp button i{font-style:normal;font-weight:900;color:#8A6D00;margin-right:4px}
.mt-side{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
.mt-side b{color:var(--ink)}
.mt-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.mt-bar i{display:block;height:100%;background:var(--sb-green)}
.mt-cmt{color:var(--sb-green);font-weight:700}
.mt-new{color:#C2410C;font-weight:900}
.mt-old{font-size:11px;font-weight:800;color:#7A5A00;background:#FFF4B8;border-radius:100px;padding:2px 8px;align-self:flex-start}
.mt-empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--ink-2);font-size:13.5px;line-height:1.8}
/* 검색 B */
.sg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.sg-h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;margin-bottom:8px}
.sg-h b{background:#FFF59D;padding:1px 6px;color:#1F2320}
.sg-h span{font-size:12px;color:var(--ink-2);font-weight:700}
.sg-flow{display:flex;flex-direction:column;gap:0;border-left:2px solid #CFE0D8;margin-left:6px}
.sg-r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:7px 0 7px 14px;cursor:pointer;position:relative}
.sg-r::before{content:'';position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--sb-green);border:2px solid var(--surface)}
.sg-r:hover .sg-l{color:var(--sb-green)}
.sg-d{font-size:12.5px;font-weight:900}
.sg-d small{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
.sg-l{font-size:13px;line-height:1.6;color:var(--ink)}
.sg-l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-l .c{color:var(--ink-2)}
.sg-yr{padding:10px 0 2px;margin-left:-14px}
.sg-yr:first-child{padding-top:0}
.sg-yr span{display:inline-block;font-size:11px;font-weight:900;color:#fff;background:var(--sb-house);border-radius:100px;padding:2px 10px;line-height:1.4}
html[data-theme="dark"] .sg-yr span{background:var(--sb-green)}
.sg-span{font-size:11.5px;font-weight:900;color:var(--sb-green);background:var(--sb-mint-2);border-radius:100px;padding:1px 9px;margin-left:4px}
.sg-l .md-hit,.sg-h .md-hit{font-style:normal;background:#FFE08A;border-radius:3px;color:#1F2320}
/* 문서 보기 */
.dv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.dv-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.dv-paper{background:#fff;color:#1F2320;border:1px solid #DDD9CE;border-radius:6px;padding:40px 48px 48px;box-shadow:0 2px 14px rgba(30,57,50,.07);min-height:600px}
.dv-side{position:sticky;top:56px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
.dv-tabs{display:flex;border-bottom:1px solid var(--line)}
.dv-tabs button{flex:1;font-family:inherit;font-size:12.5px;font-weight:800;border:0;background:transparent;color:var(--ink-2);padding:11px 6px;cursor:pointer;border-bottom:2px solid transparent}
.dv-tabs button.on{color:var(--sb-green);border-bottom-color:var(--sb-green)}
.dv-cl{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dv-tgt{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--sb-mint-2);border-radius:10px;padding:8px 10px;display:flex;gap:6px;align-items:center}
.dv-tgt b{color:var(--ink);font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-tl{display:flex;flex-direction:column;gap:6px}
.dv-tl button{font-family:inherit;text-align:left;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px}
.dv-tl button b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.dv-tl button span{color:var(--sb-green);font-weight:800}
.cm{display:flex;flex-direction:column;gap:4px}
.cm.rp{margin-left:22px;padding-left:10px;border-left:2px solid var(--line)}
.cm .who{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.cm .av{width:24px;height:24px;border-radius:50%;background:var(--sb-mint);color:var(--sb-green);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.cm .who span{font-size:11px;font-weight:600;color:var(--ink-3)}
.cm p{margin:0 0 0 31px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cm p.del{color:var(--ink-3);font-style:italic}
.cm .acts{margin-left:31px;display:flex;gap:10px}
.cm .acts button{font-family:inherit;font-size:11.5px;font-weight:800;color:var(--sb-green);background:none;border:0;padding:0;cursor:pointer}
.cm .acts button.mut{color:var(--ink-3)}
.dv-in{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dv-in .rto{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.dv-in .rto button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-family:inherit;font-size:11.5px}
.dv-in textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:58px;max-height:240px;background:var(--surface);color:var(--ink)}
.dv-in .row{display:flex;gap:6px;align-items:center}
.dv-hint{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.dv-lock{font-size:12px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:100px;padding:4px 12px}
.dv-org{font-size:11.5px;font-weight:800;color:#fff;border-radius:100px;padding:3px 10px}
.dd{position:relative;display:inline-block}
.dd-m{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:200px;z-index:30;display:none}
.dd.open .dd-m{display:block}
.dd-m button{display:flex;width:100%;gap:8px;align-items:center;font-family:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.dd-m button:hover{background:var(--sb-mint-2)}
.dd-m hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:150px}
.pop button{display:flex;width:100%;gap:8px;align-items:center;font-family:inherit;font-size:13px;font-weight:800;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.pop button:hover{background:var(--sb-mint-2)}
/* 내 임무 */
.mk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.mk .tx{flex:1;min-width:0;cursor:pointer}
.mk .tx b{font-size:13.5px;font-weight:800;display:block}
.mk .tx span{font-size:11.5px;color:var(--ink-2)}
.mk .due{font-size:11.5px;font-weight:900;white-space:nowrap}
.mk .due.over{color:#C0392B}.mk .due.soon{color:#B45309}
.mk.done{opacity:.6}
.mk-st{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;flex:none}
.mk-st button{font-family:inherit;font-size:11.5px;font-weight:800;border:0;background:var(--surface);color:var(--ink-3);padding:5px 10px;cursor:pointer}
.mk-st button.on.todo{background:#EEF0EE;color:#5A6560}.mk-st button.on.doing{background:#FEF3C7;color:#B45309}.mk-st button.on.done{background:#E8F3EF;color:#00704A}
.nt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.55}
.nt:hover{background:var(--sb-mint-2)}
.nt.unread{background:#FFFBEA}
html[data-theme="dark"] .nt.unread{background:var(--gold-bg)}
.nt small{display:block;color:var(--ink-3);font-size:11px}
/* 창 */
.mm-ov{position:fixed;inset:0;background:rgba(15,25,21,.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mm-box{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:720px;position:relative;font-family:'Noto Sans KR',-apple-system,sans-serif}
.mm-box.wide{max-width:1100px}
.mm-h{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:900}
.mm-h .x{margin-left:auto;border:0;background:var(--sb-mint-2);color:var(--ink-2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px}
.mm-b{padding:16px 20px;max-height:calc(100vh - 200px);overflow:auto}
.mm-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mm-lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1100;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.mm-lb img{max-width:94vw;max-height:92vh;border-radius:6px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>label{font-size:12px;font-weight:800;color:var(--ink-2)}
.fld input[type=text],.fld input[type=date],.fld input[type=search],.fld select{font-family:inherit;font-size:13.5px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:var(--surface);color:var(--ink)}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--sb-green)}
.rd{display:flex;gap:8px;flex-wrap:wrap}
.rd label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.rd label:has(input:checked){border-color:var(--sb-green);background:var(--sb-mint-2);color:var(--sb-green)}
.rd input{accent-color:var(--sb-green)}
.hist{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.hv{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;margin-bottom:6px;font-size:12.5px;line-height:1.5}
.hv.on{border-color:var(--sb-green);background:var(--sb-mint-2)}
.hv b{font-weight:900}.hv small{display:block;color:var(--ink-2)}
.hd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.hd h4{margin:0 0 6px;font-size:13.5px}
.hd .ln{font-size:13px;line-height:1.7;padding:1px 8px;border-radius:4px;white-space:pre-wrap}
.hd .ln.m{background:#FDECEA}.hd .ln.p{background:#E8F3EF}
.hd del{background:#F8C9C4;text-decoration:line-through;color:#7F1D1D}
.hd ins{background:#BDE5D2;text-decoration:none;color:#064E3B}
html[data-theme="dark"] .hd .ln.m{background:#3A1B1B}html[data-theme="dark"] .hd .ln.p{background:#123326}
.set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:100px;padding:4px 6px 4px 12px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0}
.tg button{border:0;background:var(--sb-mint-2);border-radius:50%;width:20px;height:20px;cursor:pointer;color:var(--ink-2);font-size:11px}
.vt{width:100%;border-collapse:collapse;font-size:13px}
.vt td,.vt th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.vt th{font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1E3932;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:12px;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:#B42318}
@media (max-width:1000px){
  .dv-grid{grid-template-columns:1fr}
  .dv-side{position:static;max-height:none}
  .hist{grid-template-columns:1fr}
}
@media (max-width:700px){
  .mt-row{grid-template-columns:64px minmax(0,1fr);padding:12px 13px;gap:10px}
  .mt-row .dt b{font-size:17px}
  .mt-row .mt-side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:4px 12px}
  .mt-row .mt-bar{display:none}
  .dv-paper{padding:22px 16px 28px}
  .mt-head h1{font-size:22px}
  .mt-search{max-width:none;min-width:100%}
  .mm-ov{padding:10px}
}
/* ═══ (v-100) 목록 C — 회의록 목차 (달 · 주제만 쭉 · ☆ 모아 두기) ═══ */
.mt-sumrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 2px 12px}
.mt-sumrow .mt-sum{margin:0;flex:1;min-width:240px}
.mt-seg.sm button{height:32px;font-size:12px;padding:0 12px}
.tc-wrap{display:grid;grid-template-columns:150px minmax(0,1fr) 260px;gap:24px;align-items:start}
.tc-nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:3px}
.tc-nav .h{font-size:12px;font-weight:800;color:var(--ink-2);padding:0 12px 6px}
.tc-nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:inherit;font-size:13px;font-weight:800;color:var(--ink-2);background:transparent;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;text-align:left;white-space:nowrap}
.tc-nav button span{font-size:11px;font-weight:700;opacity:.75}
.tc-nav button:hover{background:var(--sb-mint-2)}
.tc-nav button.on{background:var(--sb-house);color:#fff}
.tc-main{min-width:0}
.tc-hint{font-size:12.5px;color:var(--ink-2);margin:0 0 4px}
.tc-mon{font-size:12px;font-weight:900;color:var(--ink-3);letter-spacing:.04em;margin:18px 0 0;scroll-margin-top:70px}
.tc-mon:first-of-type{margin-top:4px}
.tc-sec{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px;border-bottom:2px solid var(--sb-house);cursor:pointer;flex-wrap:wrap}
html[data-theme="dark"] .tc-sec{border-bottom-color:var(--ink-2)}
.tc-sec b{font-size:16px;font-weight:900}
.tc-sec span{font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
.tc-sec .new{color:#C2410C;font-weight:900}
.tc-sec .op{margin-left:auto;font-size:12px;font-weight:800;color:var(--sb-green);white-space:nowrap}
.tc-sec:hover .op{text-decoration:underline}
.tc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;column-gap:28px}
.tc-it{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-width:0}
.tc-go{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-family:inherit;font-size:13.5px;color:var(--ink);background:none;border:0;padding:7px 2px;cursor:pointer;text-align:left}

/* 목록 구독 — 기관 · 학기가 바뀔 때마다 다시 */
function subscribeList(){
  unList.forEach(u => { try{ u(); }catch(e){} }); unList = [];
  ORGCMTS = null;
  const orgs = ORG === 'all' ? SEE.slice() : [ORG];
  const parts = {}, tparts = {};
  LIST = []; TASKS = {};
  let first = orgs.length * 2, done = false;
  const merge = () => {
    LIST = Object.values(parts).flat().filter(m => !m.deleted)
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.time || '').localeCompare(String(a.time || '')));
    TASKS = Object.assign({}, ...Object.values(tparts));
    if(first > 0) return;
    if(!done){ done = true; }
    if(VIEW === 'list') paintRows();
  };
  for(const o of orgs){
    const cons = [where('org', '==', o)]; if(SEM) cons.push(where('sem', '==', SEM));
    unList.push(onSnapshot(query(collection(db, 'meetings'), ...cons), s => {
      parts[o] = s.docs.map(d => ({ id: d.id, ...d.data() })); if(first > 0) first--; merge();
    }, e => { console.warn('meetings', e); parts[o] = []; if(first > 0) first--; merge(); listError(e); }));
    unList.push(onSnapshot(query(collection(db, 'meetingTasks'), ...cons), s => {
      tparts[o] = Object.fromEntries(s.docs.map(d => [d.id, { id: d.id, ...d.data() }])); if(first > 0) first--; merge();
    }, e => { tparts[o] = {}; if(first > 0) first--; merge(); }));
  }
}
let _errShown = false;
function listError(e){
  if(_errShown) return; _errShown = true;
  if(String(e && (e.code || e.message)).includes('permission'))
    toast('회의록을 읽을 권한이 아직 없어요 — 보안 규칙(v23)을 게시했는지 확인해 주세요.', 'err');
}
function watchNotifs(){
  if(unNotif) unNotif();
  unNotif = onSnapshot(query(collection(db, 'mtgNotifs'), where('toUid', '==', CU.uid)), s => {
    const all = s.docs.map(d => ({ id: d.id, ...d.data() }));
    NOTIFS = all.sort((a, b) => C.tsMs(b.at) - C.tsMs(a.at));
    /* 60일 지난 읽은 알림은 정리 */
    const old = Date.now() - 60 * 86400000;
    all.filter(n => n.read && C.tsMs(n.at) && C.tsMs(n.at) < old).slice(0, 20).forEach(n => deleteDoc(doc(db, 'mtgNotifs', n.id)).catch(()=>{}));
    paintMineBar();
    if(VIEW === 'mine') paintMine();
    if(VIEW === 'list' && !Q) paintRows();
  }, e => {});
  if(unMine) unMine();
  unMine = onSnapshot(query(collection(db, 'meetingTasks'), where('uids', 'array-contains', CU.uid)), s => {
    MYTASKS = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => !t.deleted);
    paintMineBar();
    if(VIEW === 'mine') paintMine();
  }, e => {});
}

/* ── 길 찾기 (주소창과 함께) ── */
function params(){ return new URLSearchParams(location.search); }
function go(p, replace){
  const u = new URL(location.href);
  u.search = '';
  for(const [k, v] of Object.entries(p || {})) if(v != null && v !== '') u.searchParams.set(k, v);
  if(replace) history.replaceState(null, '', u); else history.pushState(null, '', u);
  route();
}
window.addEventListener('popstate', () => route());
let EDITOR_MOD = null;
let EDIT_URL = '';
async function route(){
  const p = params();
  document.querySelectorAll('.pop').forEach(x => x.remove());
  /* ✏️ 쓰기 화면에서 (뒤로 가기 등으로) 나갈 때 — 묻고, 임시 저장을 지킨 뒤 편집기를 닫는다 */
  if(VIEW === 'edit' && !p.get('edit')){
    if(window.__mtDirty && !(await confirmLeave())){ history.pushState(null, '', EDIT_URL || location.href); return; }
    try{ EDITOR_MOD && EDITOR_MOD.closeEditor(); }catch(e){}
    window.__mtDirty = false;
  }
  if(p.get('org') && (SEE.includes(p.get('org')) || p.get('org') === 'all') && p.get('org') !== ORG){ ORG = p.get('org'); subscribeList(); }
  if(p.get('edit')){
    if(window.__mtDirty && !(await confirmLeave())) return;
    VIEW = 'edit'; closeDoc(); EDIT_URL = location.href;
    if(!EDITOR_MOD) EDITOR_MOD = await import('./minutes-editor.js');
    const id = p.get('edit');
    let m = null;
    if(id !== 'new'){
      try{ const s = await getDoc(doc(db, 'meetings', id)); if(s.exists()) m = { id: s.id, ...s.data() }; }catch(e){}
      if(!m){ toast('회의록을 찾지 못했어요.', 'err'); go({}, true); return; }
    }
    EDITOR_MOD.openEditor(edCtx(), m, { org: p.get('to') || '', from: p.get('from') || '' });
    return;
  }
  if(p.get('m')){ VIEW = 'doc'; openDoc(p.get('m'), { t: p.get('t'), k: p.get('k') }); return; }
  closeDoc();
  if(p.get('mine')){ VIEW = 'mine'; paintMine(); return; }
  VIEW = 'list'; renderList();
}
function confirmLeave(){ return Promise.resolve(confirm('저장하지 않은 내용이 있어요. 나가면 «임시 저장»으로만 남아요. 나갈까요?')); }
function edCtx(){
  return { db, FS, C, STORE, CU, STAFF, SMAP, CFG, WRITE, SEE, LIST, TASKS, toast, modal, popMenu,
    defaultOrg: (ORG && ORG !== 'all' && WRITE.includes(ORG)) ? ORG : (WRITE.find(o => o !== 'da') || 'da'),
    typesOf, saveTypes, DEPTS, nameOf, pins: () => PINS,
    onSaved: id => go({ m: id }, true),
    onCancel: id => { if(id) go({ m: id }, true); else go({ org: ORG }, true); } };
}

function rowHTML(m, un){
  const cnt = C.countOf(m);
  const { on, off } = C.attSplit(m);
  const meta = [m.place, m.writerName ? '쓴 사람 ' + m.writerName : '', cnt.tbl ? `표 ${cnt.tbl}개` : '', cnt.img ? `사진 ${cnt.img}장` : '', cnt.doc ? `문서 ${cnt.doc}개` : ''].filter(Boolean).join(' · ');
  const keys = [];
  (m.topics || []).forEach(t => (t.tasks || []).forEach(k => { if(C.textOf(k.h).trim()) keys.push(C.taskKey(m.id, k.id)); }));
  const doneN = keys.filter(k => (TASKS[k] || {}).status === 'done').length;
  const tps = (m.topics || []).map((t, i) => `<button data-act="topic" data-mid="${esc(m.id)}" data-tid="${esc(t.id)}"><i>${i + 1}</i>${esc(t.title || '(제목 없음)')}</button>`).join('');

    : `<div>${on.length || off.length ? `참석 <b>${on.length}</b> · 불참 <b>${off.length}</b>` : '참석 기록 없음'}</div>

  const [, mo, dd] = String(m.date).split('-').map(Number);
  return `<div class="mt-row" data-act="open" data-mid="${esc(m.id)}">
    <div class="dt"><b>${mo}/${dd}</b><span>${C.WD[C.dowOf(m.date)]}${m.time ? ' ' + esc(m.time) : ''}</span></div>

/* ═══ (v-100) 목록 C — 회의록 목차: 왼쪽 달 · 가운데 회의마다 주제만 두 줄로 · 오른쪽 ☆ 모아 둔 주제 ═══ */
const STAR = on => `<svg width="16" height="16" viewBox="0 0 24 24" ${on ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="2"'} aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
const moLabel = mo => `${+mo.slice(0, 4) !== +TODAY.slice(0, 4) ? mo.slice(2, 4) + '년 ' : ''}${+mo.slice(5, 7)}월`;
function tocHTML(list, unread){
  const pinSet = new Set(PINS.map(p => p.k));
  const months = [], byMo = new Map();
  for(const m of list){ const mo = String(m.date).slice(0, 7); if(!byMo.has(mo)){ byMo.set(mo, []); months.push(mo); } byMo.get(mo).push(m); }
  const nav = `<nav class="tc-nav" aria-label="달"><div class="h">${esc(SEM ? C.semLabel(SEM) : '전체 학기')}</div>${months.map((mo, i) =>
    `<button type="button" data-act="jm" data-mo="${mo}"${i === 0 ? ' class="on"' : ''}>${moLabel(mo)} <span>${byMo.get(mo).length}회</span></button>`).join('')}</nav>`;
  let main = `<div class="tc-main"><div class="tc-hint">주제만 쭉 — 스크롤하며 훑고, ☆로 모아 두면 오른쪽에 모여요</div>`;
  for(const mo of months){
    main += `<div class="tc-mon" id="tm-${mo}">${moLabel(mo)}</div>`;
    for(const m of byMo.get(mo)){
      const [, mm, dd] = String(m.date).split('-').map(Number);
      const un = unread.get(m.id) || 0, cc = Math.max(0, +m.cmtCount || 0);
      main += `<div class="tc-sec" data-act="open" data-mid="${esc(m.id)}"><b>${mm}월 ${dd}일 ${C.WD[C.dowOf(m.date)]}</b><span>${m.time ? esc(m.time) + ' · ' : ''}${esc(C.titleOf(m))}${ORG === 'all' ? ' ' + orgTag(m.org) : ''}${cc ? ` · 💬 ${cc}` : ''}${un ? ` · <em class="new">새 댓글 ${un}</em>` : ''}</span><span class="op">열기 ›</span></div>`;
      const tps = m.topics || [];
      if(!tps.length){ main += `<div class="tc-noT">적은 주제가 없어요</div>`; continue; }
      main += `<div class="tc-grid" style="grid-template-rows:repeat(${Math.ceil(tps.length / 2)},auto)">${tps.map((t, i) => {
        const k = m.id + '|' + t.id, on = pinSet.has(k);
        const nd = (t.dec || []).filter(d => C.textOf(d.h).trim()).length;
        const nk = (t.tasks || []).filter(x => C.textOf(x.h).trim()).length;
        return `<div class="tc-it"><button type="button" class="tc-go" data-act="topic" data-mid="${esc(m.id)}" data-tid="${esc(t.id)}"><i>${i + 1}</i><span>${esc(t.title || '(제목 없음)')}</span></button>${nd ? '<em>결정</em>' : ''}${nk ? `<em class="k">임무 ${nk}</em>` : ''}<button type="button" class="tc-pin${on ? ' on' : ''}" data-act="pin" data-mid="${esc(m.id)}" data-tid="${esc(t.id)}" aria-pressed="${on}" aria-label="${on ? '모아 둔 것에서 빼기' : '모아 두기'}">${STAR(on)}</button></div>`;
      }).join('')}</div>`;
    }
  }
  return `<div class="tc-wrap">${nav}${main}</div><aside class="tc-side" id="tc-side" aria-label="모아 둔 주제">${pinsHTML()}</aside></div>`;
}

      <div class="sg-flow">${g.rows.map((r, i, rows) => `${yrLine(r, i, rows)}<div class="sg-r" data-act="${r.t ? 'topic' : 'open'}" data-mid="${esc(r.m.id)}" data-tid="${r.t ? esc(r.t.id) : ''}">
        <div class="sg-d">${esc(C.fmtMD(r.m.date))}<small>${esc(C.titleOf(r.m))}${ORG === 'all' ? ' · ' + esc(C.MORG_SHORT[r.m.org]) : ''}</small></div>

  else if(c.tgt.startsWith('k:')){ for(const t of m.topics || []) for(const k of t.tasks || []) if(C.taskKey(m.id, k.id) === c.tgt.slice(2)) (k.uids || []).forEach(u => add(u, 'cmt')); }
  CMTS.filter(x => x.tgt === c.tgt && !x.del).forEach(x => add(x.uid, 'cmt'));

    text: c.text.slice(0, 140), fromUid: CU.uid, fromName: CU.name || '', at: serverTimestamp(), read: false }).catch(()=>{}));
}

/* ═══ 수정 이력 ═══ */
async function openHistory(m, focus){
  const md = modal(`🕘 수정 이력 — ${esc(C.fmtMDY(m.date))} ${esc(C.titleOf(m))}`, `<div class="mt-empty" style="border:0">불러오는 중…</div>`, '', 'wide');
  let vs = [];
  try{
    const s = await getDocs(query(collection(db, 'meetingVersions'), where('meetingId', '==', m.id), where('org', '==', m.org)));
    vs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.rev - a.rev);
  }catch(e){ md.box.querySelector('.mm-b').innerHTML = `<div class="mt-empty">수정 이력을 불러오지 못했어요.</div>`; return; }
  if(!vs.length){ md.box.querySelector('.mm-b').innerHTML = `<div class="mt-empty">아직 수정 이력이 없어요.</div>`; return; }
  let sel = (focus && focus.rev && vs.find(v => v.rev === +focus.rev)) || vs[0];
  const tid = focus && focus.tid;
  const paint = () => {
    const prev = vs.find(v => v.rev === sel.rev - 1);
    const A = prev ? prev.data : null, B = sel.data;
    let diff = '';
    if(!A) diff = `<div class="dv-hint">처음 작성한 모습이에요.</div>`;
    else {
      const head = [];
      for(const [k, l] of [['date','날짜'],['time','시각'],['place','장소'],['type','회의 종류'],['title','제목']]) if((A[k] || '') !== (B[k] || '')) head.push(`<div class="ln m">${l}: <del>${esc(A[k] || '')}</del></div><div class="ln p">${l}: <ins>${esc(B[k] || '')}</ins></div>`);
      if(JSON.stringify(A.att || {}) !== JSON.stringify(B.att || {})){
        const a = C.attSplit(A), b = C.attSplit(B);
        const fmt = s => `참석 ${s.on.length} · 불참 ${s.off.map(x => x.name + (x.r ? '(' + x.r + ')' : '')).join(', ') || '없음'}`;
        head.push(`<div class="ln m"><del>${esc(fmt(a))}</del></div><div class="ln p"><ins>${esc(fmt(b))}</ins></div>`);
      }
      if(head.length) diff += `<div class="hd" style="margin-bottom:10px"><h4>머리 · 참석</h4>${head.join('')}</div>`;
      const AT = new Map((A.topics || []).map(t => [t.id, t]));
      const BT = new Map((B.topics || []).map(t => [t.id, t]));
      (B.topics || []).forEach((t, i) => {
        if(tid && t.id !== tid) return;
        const p = AT.get(t.id);
        const la = p ? [p.title || '', ...C.topicLines(p)] : [], lb = [t.title || '', ...C.topicLines(t)];
        if(JSON.stringify(la) === JSON.stringify(lb)) return;
        const rows = C.diffLines(la, lb).filter(r => r.t !== '=' || la.length + lb.length < 30);
        diff += `<div class="hd" style="margin-bottom:10px"><h4>${i + 1}. ${esc(t.title || '')}${p ? '' : ' <span style="color:#00704A">(새 주제)</span>'}</h4>
          ${rows.map(r => `<div class="ln ${r.t === '-' ? 'm' : r.t === '+' ? 'p' : ''}">${r.html}</div>`).join('')}</div>`;
      });
      for(const [id, p] of AT) if(!BT.has(id) && (!tid || id === tid)) diff += `<div class="hd" style="margin-bottom:10px"><h4><del>${esc(p.title || '')}</del> <span style="color:#C0392B">(뺀 주제)</span></h4></div>`;
      if(!diff) diff = `<div class="dv-hint">${tid ? '이 주제는 이번에 바뀌지 않았어요.' : '내용은 그대로예요.'}</div>`;
    }
    md.box.querySelector('.mm-b').innerHTML = `<div class="hist"><div>${vs.map(v => `<div class="hv${v === sel ? ' on' : ''}" data-rev="${v.rev}">
        <b>${v.rev}번째</b> · ${esc(v.name || '')} 님 · ${esc(C.fmtStamp(C.tsMs(v.at) || v.atMs))}${v === vs[0] ? ' <span style="color:var(--sb-green);font-weight:900">지금</span>' : ''}
        <small>${esc(v.sum || '')}</small></div>`).join('')}</div>
      <div><div style="font-size:13px;font-weight:900;margin-bottom:8px">${prev ? `${prev.rev}번째 → ${sel.rev}번째에서 바뀐 곳` : `${sel.rev}번째 — 처음 모습`}${tid ? ' · 이 주제만' : ''}</div>${diff}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="mt-btn" data-h="view">${sel.rev}번째 모습 전체 보기</button>
        ${tid ? '<button class="mt-btn" data-h="all">모든 주제 보기</button>' : ''}
        ${canWrite(m.org) && sel !== vs[0] ? `<button class="mt-btn p" data-h="revert">이 모습으로 되돌리기</button><span class="dv-hint" style="align-self:center">되돌리기도 한 번의 수정으로 남아요</span>` : ''}</div></div></div>`;
  };
  md.box.addEventListener('click', async e => {
    const hv = e.target.closest('.hv'); if(hv){ sel = vs.find(v => v.rev === +hv.dataset.rev); paint(); return; }
    const b = e.target.closest('[data-h]'); if(!b) return;
    if(b.dataset.h === 'all'){ focus = null; md.close(); openHistory(m, { rev: sel.rev }); return; }
    if(b.dataset.h === 'view'){
      const v = modal(`${sel.rev}번째 모습 · ${esc(sel.name || '')} 님 · ${esc(C.fmtStamp(C.tsMs(sel.at) || sel.atMs))}`, `<div class="dv-paper" style="min-height:0">${C.renderDoc({ ...sel.data, id: m.id, org: m.org }, { ...SAFE, files: Object.fromEntries(STORE.cache) })}</div>`, '', 'wide');
      loadImagesIn(v.box); return;
    }
    if(b.dataset.h === 'revert'){
      if(!confirm(`${sel.rev}번째 모습으로 되돌릴까요? 지금 모습도 이력에 그대로 남아요.`)) return;
      if(!EDITOR_MOD) EDITOR_MOD = await import('./minutes-editor.js');
      try{ await EDITOR_MOD.saveRevert(edCtx(), m, sel); md.close(); toast(`${sel.rev}번째 모습으로 되돌렸어요`); }
      catch(err){ toast(err.message === 'conflict' ? '그 사이 다른 분이 고쳤어요 — 다시 열어 주세요.' : '되돌리지 못했어요 — ' + (err.code || err.message), 'err'); }
    }
  });
  paint();
}

async function doExport(list, fmt, opts, name){
  const files = {}, sizes = {};
  if(opts.img){
    const fids = [];
    list.forEach(m => (m.topics || []).forEach(t => (t.body || []).forEach(b => { if(b.k === 'img') fids.push(b.fid); if(b.k === 'pdf') fids.push(...(b.fids || [])); })));
    await Promise.all(fids.map(async f => { try{ const s = await STORE.getImage(f); if(s) files[f] = s; }catch(e){} }));
    if(fmt === 'docx') await Promise.all(Object.entries(files).map(([f, s]) => new Promise(res => { const im = new Image(); im.onload = () => { sizes[f] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.onerror = res; im.src = s; })));
  }
  const comments = {};
  if(opts.cmt){
    for(const m of list){
      if(CUR && CUR.id === m.id){ comments[m.id] = CMTS.map(c => ({ ...c, at: C.tsMs(c.at) })); continue; }
      try{ const s = await getDocs(query(collection(db, 'meetingComments'), where('meetingId', '==', m.id), where('org', '==', m.org)));
        comments[m.id] = s.docs.map(d => { const c = { id: d.id, ...d.data() }; c.at = C.tsMs(c.at); return c; }); }catch(e){ comments[m.id] = []; }
    }
  }
  const tasks = {};
  for(const m of list) (m.topics || []).forEach(t => (t.tasks || []).forEach(k => { const key = C.taskKey(m.id, k.id); const d = taskOf(key); if(d) tasks[key] = d; }));
  if(fmt === 'docx'){
    const { buildDocx } = await import('./minutes-docx.js');
    saveBlob(buildDocx(list, opts, { tasks, files, sizes, comments }), name + '.docx');
    toast('워드 파일을 받았어요 — 받은 파일 폴더를 확인해 주세요');
    return;
  }
  printHTML(printDoc(list, opts, { tasks, files, comments }, name), fmt);
}
function printDoc(list, opts, ctx, name){

      : '<p style="text-align:center;color:#5A6560">이 기간에는 적힌 결정 · 임무가 없어요.</p>'}</section>`;
  }
  const docs = list.map(m => {
    let h = `<section class="pg">${C.renderDoc(m, cctx)}`;
    const cm = (ctx.comments[m.id] || []).filter(c => !c.del);
    if(opts.cmt && cm.length){
      const roots = cm.filter(c => !c.root).sort((a, b) => a.at - b.at);

      h += `<div class="pcm"><h3>댓글</h3>${roots.map(r => `<div class="pc"><b>${esc(r.name)}</b> <small>${esc(C.fmtStamp(r.at))} · ${esc(tn(r))}</small><div>${esc(r.text)}</div>
        ${cm.filter(c => c.root === r.id).sort((a, b) => a.at - b.at).map(c => `<div class="pc rp"><b>↳ ${esc(c.name)}</b> <small>${esc(C.fmtStamp(c.at))}</small><div>${esc(c.text)}</div></div>`).join('')}</div>`).join('')}</div>`;
    }
    return h + '</section>';
  }).join('');
  const cssStr = t => String(t || '').replace(/[\\"<>\n\r]/g, c => '\\' + c.charCodeAt(0).toString(16) + ' ');
  const head = opts.head ? `@top-right{content:"${cssStr(opts.title)}";font-size:8pt;color:#93A09A;font-family:'Noto Sans KR',sans-serif}
    @bottom-center{content:counter(page) " / " counter(pages);font-size:8.5pt;color:#93A09A;font-family:'Noto Sans KR',sans-serif}` : '';
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${esc(name)}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
    <style>${C.DOC_CSS}
    @page{size:A4;margin:15mm 14mm 17mm;${head}}

    .pg+.pg{break-before:page}
    .md-th{break-after:avoid}.md-dec,.md-task,.md-img,.md-pg,.md-file,.md-link,tr{break-inside:avoid}
    .md-img img{max-height:300px}.md-pg img{max-width:100%}
    .sumt{width:100%;border-collapse:collapse;font-size:10pt}.sumt th{background:#1E3932;color:#fff;padding:6px;text-align:left}
    .sumt td{border:1px solid #C9C5B9;padding:5px 6px;vertical-align:top;line-height:1.5}
    .pcm{margin-top:18px;border-top:1px solid #C9C5B9;padding-top:8px}.pcm h3{font-size:12pt;margin:0 0 6px}
    .pc{font-size:10pt;margin:0 0 7px;break-inside:avoid}.pc small{color:#6B7670}.pc.rp{margin:5px 0 0 18px}
    </style></head><body>${sumHtml}${docs}</body></html>`;
}
function printHTML(html, fmt){
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(fr);
  const d = fr.contentDocument; d.open(); d.write(html); d.close();
  const fire = async () => {
    try{ await Promise.race([fr.contentDocument.fonts.ready, new Promise(r => setTimeout(r, 2500))]); }catch(e){}
    await Promise.all([...fr.contentDocument.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 4000); })));
    if(fmt === 'pdf') toast('인쇄 창에서 «대상»을 «PDF로 저장»으로 고르세요');
    fr.contentWindow.focus(); fr.contentWindow.print();
    setTimeout(() => fr.remove(), 60000);
  };
  setTimeout(fire, 300);
}

/* ═══ 설정 (수퍼) ═══ */
async function openSettings(tab){
  tab = tab || 'types';
  const draft = JSON.parse(JSON.stringify({ types: CFG.types, absence: CFG.absence, viewers: CFG.viewers || {} }));
  const md = modal('⚙ 회의록 설정', '', `<button class="mt-btn" data-x2>닫기</button><button class="mt-btn p" id="st-save">설정 저장</button>`, 'wide');
  md.box.querySelector('[data-x2]').onclick = md.close;
  const body = md.box.querySelector('.mm-b');
  const paint = () => {
    const tabs = [['types', '회의 종류'], ['abs', '불참 사유'], ['view', '열람 기관'], ['import', '예전 회의록 넣기'], ['trash', '휴지통']];
    let h = `<div class="set-tabs">${tabs.map(([k, l]) => `<button class="mt-chip${tab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
    if(tab === 'types'){
      h += `<div class="dv-hint" style="margin-bottom:10px">회의록을 쓸 때 고르는 회의 종류예요. 회의록 쓰는 화면에서도 선생님들이 바로 넣고 뺄 수 있어요. 목록에서 빼도 이미 쓴 회의록은 그대로예요.</div>`;
      for(const o of MORDER){
        h += `<div class="fld"><label>${esc(MORG[o])}</label><div>${(draft.types[o] || []).map((t, i) => `<span class="tg">${esc(t)}<button data-del-type="${o}|${i}" aria-label="빼기">✕</button></span>`).join('')}</div>
          <div style="display:flex;gap:6px;margin-top:4px"><input type="text" placeholder="새 회의 종류" data-add-type-in="${o}" style="flex:1"><button class="mt-btn sm" data-add-type="${o}">＋ 넣기</button></div></div>`;
      }
    } else if(tab === 'abs'){
      h += `<div class="dv-hint" style="margin-bottom:10px">불참을 누르면 고르는 사유예요. «직접 쓰기»는 늘 함께 나와요.</div>
        <div>${draft.absence.map((t, i) => `<span class="tg">${esc(t)}<button data-del-abs="${i}" aria-label="빼기">✕</button></span>`).join('')}</div>
        <div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="abs-in" placeholder="새 사유" style="flex:1;font-family:inherit;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px"><button class="mt-btn sm" data-add-abs>＋ 넣기</button></div>`;
    } else if(tab === 'view'){
      h += `<div class="dv-hint" style="margin-bottom:10px">자기 기관 회의록과 <b>DA전체</b>는 누구나 봐요. 다른 기관 회의록도 보게 할 선생님만 켜 주세요 (읽기 · 댓글만 · 고치기는 안 됨).
        «기본»은 교직원 명부의 접근 기관이라 원래 볼 수 있어요.</div>
        <input type="search" id="vw-q" placeholder="이름으로 찾기" style="font-family:inherit;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;width:240px;margin-bottom:8px">
        <table class="vt"><thead><tr><th>이름</th><th>소속</th><th>다니엘 아마츠</th><th>지혜빛 선교원</th></tr></thead><tbody>
        ${STAFF.filter(s => s.role !== 'super').map(s => { const b = baseOrgs(s); const g = draft.viewers[s.uid] || [];
          const cell = o => b.includes(o) ? '<span style="color:var(--ink-3);font-size:12px">기본</span>' : `<label class="ck" style="padding:0"><input type="checkbox" data-vw="${s.uid}|${o}"${g.includes(o) ? ' checked' : ''}>열람</label>`;
          return `<tr data-nm="${esc(s.name || '')}"><td><b>${esc(s.name || '')}</b> <span style="color:var(--ink-3);font-size:11.5px">${esc(s.position || '')}</span></td><td>${esc(b.map(o => C.MORG_SHORT[o]).join('·'))}</td><td>${cell('daniel')}</td><td>${cell('jihyebit')}</td></tr>`; }).join('')}</tbody></table>`;
    } else if(tab === 'import'){
      h += `<div id="imp-box"><div class="dv-hint">불러오는 중…</div></div>`;
    } else if(tab === 'trash'){
      h += `<div id="tr-box"><div class="dv-hint">불러오는 중…</div></div>`;
    }
    body.innerHTML = h;
    md.box.querySelector('#st-save').style.display = ['types', 'abs', 'view'].includes(tab) ? '' : 'none';
    if(tab === 'import') paintImport(body.querySelector('#imp-box'));
    if(tab === 'trash') paintTrash(body.querySelector('#tr-box'));
    const vq = body.querySelector('#vw-q');

  };
  body.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if(t){ tab = t.dataset.tab; paint(); return; }
    const dt = e.target.closest('[data-del-type]'); if(dt){ const [o, i] = dt.dataset.delType.split('|'); draft.types[o].splice(+i, 1); paint(); return; }
    const at = e.target.closest('[data-add-type]'); if(at){ const o = at.dataset.addType; const inp = body.querySelector(`[data-add-type-in="${o}"]`); const v = inp.value.trim(); if(v){ (draft.types[o] = draft.types[o] || []).includes(v) || draft.types[o].push(v); paint(); } return; }
    const da = e.target.closest('[data-del-abs]'); if(da){ draft.absence.splice(+da.dataset.delAbs, 1); paint(); return; }
    if(e.target.closest('[data-add-abs]')){ const v = body.querySelector('#abs-in').value.trim(); if(v && !draft.absence.includes(v)){ draft.absence.push(v); paint(); } return; }
  });
  body.addEventListener('change', e => {
    const v = e.target.closest('[data-vw]'); if(!v) return;
    const [uid, o] = v.dataset.vw.split('|');
    const g = new Set(draft.viewers[uid] || []); v.checked ? g.add(o) : g.delete(o);
    if(g.size) draft.viewers[uid] = [...g]; else delete draft.viewers[uid];
  });
  md.box.querySelector('#st-save').onclick = async () => {
    try{
      await setDoc(doc(db, 'minutesConfig', 'main'), { types: draft.types, absence: draft.absence, viewers: draft.viewers, updatedAt: serverTimestamp(), updatedBy: CU.name || '' });
      await setDoc(doc(db, 'minutesConfig', 'types'), { ...Object.fromEntries(MORDER.map(o => [o, draft.types[o] || []])), updatedAt: serverTimestamp(), updatedByName: CU.name || '' });
      CFG = { ...CFG, ...draft }; computeOrgs(); toast('설정을 저장했어요'); md.close();
      if(VIEW === 'list') renderList();
    }catch(e){ toast('저장하지 못했어요 — ' + (e.code || e.message), 'err'); }
  };
  paint();
}
/* 휴지통에 든 회의록의 임무는 홈 · 내 임무 · 뱃지에서 숨긴다 */
async function markTasks(mid, del){
  try{
    const s = await getDocs(query(collection(db, 'meetingTasks'), where('meetingId', '==', mid)));
    const b = writeBatch(db); s.forEach(d => b.update(d.ref, { deleted: !!del, updatedAt: serverTimestamp() })); await b.commit();
    try{ window.refreshBadges && refreshBadges(); }catch(e){}
  }catch(e){ console.warn('tasks', e); }
}
async function paintTrash(box){
  const out = [];
  for(const o of SEE){ try{ const s = await getDocs(query(collection(db, 'meetings'), where('org', '==', o), where('deleted', '==', true))); s.forEach(d => out.push({ id: d.id, ...d.data() })); }catch(e){} }
  if(!out.length){ box.innerHTML = `<div class="dv-hint">휴지통이 비었어요.</div>`; return; }
  box.innerHTML = `<table class="vt"><tbody>${out.map(m => `<tr><td>${esc(C.fmtMDY(m.date))} ${esc(C.titleOf(m))} <span style="color:var(--ink-3)">${esc(C.MORG_SHORT[m.org])} · ${esc(m.deletedByName || '')}</span></td>
    <td style="text-align:right"><button class="mt-btn sm" data-restore="${esc(m.id)}">되살리기</button> <button class="mt-btn sm" data-purge="${esc(m.id)}" style="color:#C0392B">완전히 지우기</button></td></tr>`).join('')}</tbody></table>`;
  box.onclick = async e => {

    if(p && confirm('완전히 지우면 되돌릴 수 없어요 (수정 이력은 남아요). 지울까요?')){ await deleteDoc(doc(db, 'meetings', p.dataset.purge)); toast('지웠어요'); paintTrash(box); }
  };
}
/* 예전 회의록 넣기 — 함께 담아 둔 «PDF에서 옮긴 파일»들 또는 직접 고른 .json
   (v-96) 옮김 파일이 여러 개 — 학기별로 골라 보기 · PDF를 고르면 «Claude에게 보내 주세요» 안내 */
const IMPORT_PACKS = [
  { file: 'minutes-import-2026-2.json', label: '2026 2학기' },
  { file: 'minutes-import-2026-1.json', label: '2026 1학기' },
  { file: 'minutes-import-2025-2.json', label: '2025 2학기' },   // (v-99) 25 · 24년 주니어 회의록 PDF에서 옮김
  { file: 'minutes-import-2025-1.json', label: '2025 1학기' },
  { file: 'minutes-import-2024-2.json', label: '2024 2학기' },
  { file: 'minutes-import-2024-1.json', label: '2024 1학기' },
  { file: 'minutes-import-2023-2.json', label: '2023 2학기' },
  { file: 'minutes-import-2023-1.json', label: '2023 1학기' },
];
async function paintImport(box){
  const packs = [];
  for(const p of IMPORT_PACKS){
    try{ const r = await fetch(p.file + '?_=' + Date.now(), { cache: 'no-store' }); if(r.ok){ const j = await r.json(); if(j && Array.isArray(j.meetings)) packs.push({ label: p.label, pk: j }); } }catch(e){}
  }
  let cur = 0;
  const draw = async (pk) => {
    const ms = (pk && pk.meetings) || [];
    const exists = new Set();
    for(const m of ms){ try{ const s = await getDoc(doc(db, 'meetings', m.id)); if(s.exists()) exists.add(m.id); }catch(e){} }
    const own = pk && !packs.some(p => p.pk === pk);
    const tabs = packs.length > 1 || own ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${packs.map((p, i) =>
      `<button class="mt-btn sm${!own && i === cur ? ' p' : ''}" data-pk="${i}">${esc(p.label)} · ${p.pk.meetings.length}건</button>`).join('')}${own ? `<button class="mt-btn sm p" disabled>고른 파일 · ${ms.length}건</button>` : ''}</div>` : '';
    box.innerHTML = tabs + `<div class="dv-hint" style="margin-bottom:10px">${pk ? `<b>${esc(pk.source || '')}</b>에서 옮긴 회의록 ${ms.length}건이에요. ${esc(pk.note || '')}` : '함께 담긴 옮김 파일이 없어요.'}
        참석 · 임무는 비워 두고, 번호 개요 · 노란 주제 · 표를 살려 넣어요. 이미 넣은 회의록은 건너뛰어요.</div>
      ${ms.length ? `<label class="ck"><input type="checkbox" id="imp-all" checked>모두 고르기</label>
      <table class="vt"><tbody>${ms.map(m => `<tr><td><label class="ck" style="padding:0"><input type="checkbox" class="imp-ck" value="${esc(m.id)}"${exists.has(m.id) ? ' disabled' : ' checked'}>
        ${esc(C.fmtLong(m.date, m.time))} · <b>${esc(C.titleOf(m))}</b> · ${esc(MORG[m.org] || m.org)} · 주제 ${(m.topics || []).length}개</label></td>
        <td style="text-align:right;color:var(--ink-3);font-size:12px">${exists.has(m.id) ? '이미 넣음' : ''}${m.warn ? ' ⚠ ' + esc(m.warn) : ''}</td></tr>`).join('')}</tbody></table>
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center"><button class="mt-btn p" id="imp-go">고른 회의록 넣기</button><span class="dv-hint" id="imp-st"></span></div>` : ''}
      <div style="margin-top:16px" class="dv-hint">다른 옮김 파일(.json)이 있으면: <input type="file" id="imp-file" accept=".json,application/json,.pdf,application/pdf"></div>
      <div class="dv-hint" id="imp-pdf" style="display:none;margin-top:8px;padding:10px 12px;border-radius:10px;background:#FFF8E1;color:#7A5B00">
        📕 <b>PDF는 여기서 바로 넣을 수 없어요.</b> PDF마다 번호 · 표 · 글꼴이 달라서 그대로 읽으면 글자가 깨지거나 순서가 섞여요.<br>
        Claude에게 PDF를 보내 주시면 «옮김 파일»로 만들어 이 목록에 함께 담아 드려요. 올린 뒤 여기서 «넣기»만 누르면 돼요.</div>`;
    box.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { cur = +b.dataset.pk; draw(packs[cur].pk); });
    const all = box.querySelector('#imp-all'); if(all) all.onchange = () => box.querySelectorAll('.imp-ck:not(:disabled)').forEach(c => c.checked = all.checked);
    box.querySelector('#imp-file').onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      if(/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){ box.querySelector('#imp-pdf').style.display = ''; e.target.value = ''; return; }
      let j = null; try{ j = JSON.parse(await f.text()); }catch(err){}
      if(!j || !Array.isArray(j.meetings)){ toast('회의록 옮김 파일(.json)이 아니에요.', 'err'); e.target.value = ''; return; }
      draw(j);
    };
    const go = box.querySelector('#imp-go');
    if(go) go.onclick = async () => {
      const ids = new Set([...box.querySelectorAll('.imp-ck:checked')].map(c => c.value));
      const pickd = ms.filter(m => ids.has(m.id)); if(!pickd.length) return;
      go.disabled = true; let n = 0;
      for(const m of pickd){
        box.querySelector('#imp-st').textContent = `${n + 1}/${pickd.length} — ${C.fmtMDY(m.date)} 넣는 중…`;
        try{ await importOne(m, pk.source || ''); n++; }catch(err){ console.error(err); toast(`${C.fmtMDY(m.date)} 회의록을 넣지 못했어요 — ${err.code || err.message}`, 'err'); }
      }
      toast(`${n}건을 넣었어요`); draw(pk);
    };
  };
  draw(packs.length ? packs[0].pk : null);
}
async function importOne(m, source){
  const ref = doc(db, 'meetings', m.id);
  const ex = await getDoc(ref); if(ex.exists()) return;
  const topics = [];
  for(const t of m.topics || []){
    const body = [];
    for(const b of t.body || []){
      if(b.k === 'img' && b.data){ const r = await STORE.putImage(m.org, m.id, b.data, 'img', b.cap || ''); body.push({ k: 'img', fid: r.fid, w: r.w, ht: r.ht, cap: b.cap || '' }); }
      else body.push(b);
    }
    topics.push({ id: t.id, title: t.title || '', body, dec: t.dec || [], tasks: [] });
  }
  const data = { org: m.org, sem: C.semOf(m.date), type: m.type || '', title: m.title || '', date: m.date, time: m.time || '', place: m.place || '',
    writerUid: '', writerName: m.writerName || '', att: {}, attNames: {}, guests: m.guests || '', topics, imported: true, source,
    rev: 1, createdBy: CU.uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp(), updatedByUid: CU.uid, updatedByName: CU.name || '',
    cmtCount: 0, deleted: false };
  await setDoc(ref, data);
  const { createdAt, updatedAt, ...snap } = data;
  try{ await setDoc(doc(db, 'meetingVersions', `${m.id}_1`), { meetingId: m.id, org: m.org, rev: 1, at: serverTimestamp(), atMs: Date.now(), uid: CU.uid, name: CU.name || '',
    sum: '예전 PDF에서 옮김', data: snap }); }catch(e){ /* 예전에 넣었다 지운 회의록 — 이력은 그대로 남아 있음 */ }
}

/* ═══ 누르기 ═══ */
document.addEventListener('click', async e => {
  const root = $I('mt'); if(!root || !root.contains(e.target)) return;
  if(VIEW === 'edit') return;                                      // 쓰기 화면은 편집기가 맡는다
  const orgB = e.target.closest('[data-org]');
  if(orgB){ ORG = orgB.dataset.org; TYPE = ''; try{ localStorage.setItem('mtg_org', ORG); }catch(_){} subscribeList(); renderList(); go({ org: ORG }, true); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act !== 'outmenu' && act !== 'moremenu') document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  switch(act){
    case 'new': go({ edit: 'new', to: ORG !== 'all' ? ORG : '' }); break;
    case 'lview': LVIEW = a.dataset.v === 'card' ? 'card' : 'toc'; lsSet('mtg_lview', LVIEW);
      document.querySelectorAll('#mt-lview button').forEach(b => b.classList.toggle('on', b.dataset.v === LVIEW)); paintRows(); break;
    case 'dview': DVIEW = a.dataset.v === 'a' ? 'a' : 'b'; lsSet('mtg_dview', DVIEW); paintDoc(); break;
    case 'jm': { const h = $I('tm-' + a.dataset.mo); if(h) h.scrollIntoView({ block: 'start', behavior: 'smooth' });
      document.querySelectorAll('.tc-nav button[data-mo]').forEach(b => b.classList.toggle('on', b === a)); break; }
    case 'pin': e.stopPropagation(); togglePin(a.dataset.mid, a.dataset.tid); break;
    case 'unpin': { e.stopPropagation(); const i = PINS.findIndex(p => p.k === a.dataset.k); if(i >= 0){ PINS.splice(i, 1); repaintPins(); savePins(); } break; }
    case 'goto': case 'gotok': { if(!CUR) break; const tid = a.dataset.tid; const f = FOLD[CUR.id];
      if(tid && f && f[tid]){ delete f[tid]; paintPaper(); }
      gotoEl(act === 'gotok' ? 'k-' + a.dataset.kid : 't-' + tid); break; }
    case 'fold': { if(!CUR) break; const f = FOLD[CUR.id] = FOLD[CUR.id] || {}; const tid = a.dataset.tid;
      if(f[tid]) delete f[tid]; else f[tid] = true; paintPaper(); break; }
    case 'foldall': { if(!CUR) break; const tps = CUR.topics || []; const f = FOLD[CUR.id] = FOLD[CUR.id] || {};
      if(tps.some(t => !f[t.id])) tps.forEach(t => f[t.id] = true); else FOLD[CUR.id] = {}; paintPaper(); break; }
    case 'open': go({ m: a.dataset.mid }); break;
    case 'topic': e.stopPropagation(); go({ m: a.dataset.mid, t: a.dataset.tid }); break;
    case 'back': go({ org: ORG }); break;
    case 'mine': go({ mine: 1 }); break;
    case 'qclear': Q = ''; renderList(); break;
    case 'settings': openSettings(); break;
    case 'import': openSettings('import'); break;
    case 'exportmany': openExport(null); break;
    case 'edit': go({ edit: CUR.id }); break;
    case 'hist': openHistory(CUR); break;
    case 'outmenu': case 'moremenu': { const dd = a.closest('.dd'); const was = dd.classList.contains('open'); document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open')); if(!was) dd.classList.add('open'); break; }
    case 'out': if(a.dataset.f === 'pick') openExport(CUR); else { try{ await doExport([CUR], a.dataset.f, { sum: false, att: true, img: true, cmt: false, head: true, title: C.titleOf(CUR) }, `${C.titleOf(CUR)}_${CUR.date}`); }catch(err){ toast('만들지 못했어요 — ' + err.message, 'err'); } } break;
    case 'copylink': { const u = new URL(location.href); u.search = '?m=' + CUR.id; try{ await navigator.clipboard.writeText(u.href); toast('주소를 복사했어요 — 쪽지로 보내 보세요'); }catch(_){ prompt('이 주소를 복사하세요', u.href); } break; }
    case 'dup': go({ edit: 'new', to: CUR.org, from: CUR.id }); break;
    case 'trash':
      if(!confirm('이 회의록을 휴지통으로 옮길까요? (수퍼 관리자가 되살릴 수 있어요)')) break;
      try{ await updateDoc(doc(db, 'meetings', CUR.id), { deleted: true, deletedAt: serverTimestamp(), deletedBy: CU.uid, deletedByName: CU.name || '' });
        await markTasks(CUR.id, true); toast('휴지통으로 옮겼어요'); go({ org: ORG }, true); }
      catch(err){ toast('옮기지 못했어요 — ' + (err.code || err.message), 'err'); }
      break;
    case 'attall': { const { on, off } = C.attSplit(CUR); modal('참석 · 불참', `<div style="font-size:13.5px;line-height:1.9"><b>참석 ${on.length}명</b><br>${on.map(x => esc(x.name)).join(' · ') || '없음'}<br><br><b>불참 ${off.length}명</b><br>${off.map(x => esc(x.name) + (x.r ? ` (${esc(x.r)})` : '')).join(' · ') || '없음'}${CUR.guests ? `<br><br><b>그 외</b><br>${esc(CUR.guests)}` : ''}</div>`); break; }
    case 'img': { const fid = a.dataset.fid; const src = await STORE.getImage(fid); if(!C.okSrc(src)) break; const lb = document.createElement('div'); lb.className = 'mm-lb'; lb.innerHTML = `<img src="${src}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); break; }
    case 'pdfall': OPEN[a.dataset.bid] = true; paintPaper(); break;
    case 'file': try{ toast('받는 중…'); await STORE.download(a.dataset.fid, a.dataset.name); }catch(err){ toast('받지 못했어요 — ' + err.message, 'err'); } break;
    case 'ed': openHistory(CUR, { rev: a.dataset.rev, tid: a.dataset.tid }); break;
    case 'tcmt': CMT_TAB = 't'; CMT_TGT = 't:' + a.dataset.tid; REPLY = null; paintSide(); setTimeout(() => { const t = $I('cm-in'); t && t.focus(); }, 30); break;
    case 'kcmt': CMT_TAB = 't'; CMT_TGT = 'k:' + a.dataset.kid; REPLY = null; paintSide(); setTimeout(() => { const t = $I('cm-in'); t && t.focus(); }, 30); break;
    case 'ctab': CMT_TAB = a.dataset.tab; REPLY = null; paintSide(); break;
    case 'tgtclear': CMT_TGT = ''; REPLY = null; paintSide(); break;
    case 'reply': REPLY = { root: a.dataset.cid, uid: a.dataset.to, name: a.dataset.name }; paintSide(); setTimeout(() => { const t = $I('cm-in'); t && t.focus(); }, 30); break;
    case 'rcancel': REPLY = null; paintSide(); break;
    case 'cmpost': postComment(); break;
    case 'cmedit': EDITING_CMT = a.dataset.cid; paintSide(); break;
    case 'cmcancel': EDITING_CMT = ''; paintSide(); break;
    case 'cmsave': { const v = ($I('cm-edit') || {}).value || ''; if(!v.trim()) break;
      try{ await updateDoc(doc(db, 'meetingComments', a.dataset.cid), { text: v.trim(), editedAt: serverTimestamp() }); EDITING_CMT = ''; }catch(err){ toast('고치지 못했어요 — ' + (err.code || err.message), 'err'); } break; }
    case 'cmdel': { if(!confirm('이 댓글을 지울까요?')) break; const c = CMTS.find(x => x.id === a.dataset.cid);
      try{ await updateDoc(doc(db, 'meetingComments', a.dataset.cid), { del: true, text: '', editedAt: serverTimestamp() });
        updateDoc(doc(db, 'meetings', CUR.id), { cmtCount: increment(-1) }).catch(()=>{});
        if(c && c.tgt.startsWith('k:')) updateDoc(doc(db, 'meetingTasks', c.tgt.slice(2)), { cmt: increment(-1) }).catch(()=>{});
      }catch(err){ toast('지우지 못했어요 — ' + (err.code || err.message), 'err'); } break; }
    case 'kstat': { const key = a.dataset.kid; popMenu(a, ['todo', 'doing', 'done'].map(s => ({ l: `${s === 'done' ? '✓ ' : ''}${C.STATUS[s].l}`, f: () => setTaskStatus(key, s) }))); break; }
    case 'mkst': setTaskStatus(a.dataset.kid, a.dataset.st); break;
    case 'mtask': go({ m: a.dataset.mid, k: a.dataset.kid }); break;
    case 'readall': NOTIFS.filter(n => !n.read).forEach(n => updateDoc(doc(db, 'mtgNotifs', n.id), { read: true, readAt: serverTimestamp() }).catch(()=>{})); setTimeout(() => { try{ window.refreshBadges && refreshBadges(); }catch(_){} }, 800); break;
    case 'nopen': { const n = NOTIFS.find(x => x.id === a.dataset.nid); if(!n) break;
      if(!n.read) updateDoc(doc(db, 'mtgNotifs', n.id), { read: true, readAt: serverTimestamp() }).catch(()=>{});
      const k = n.tgt && n.tgt.startsWith('k:') ? n.tgt.slice(2) : '';
      const t = n.tgt && n.tgt.startsWith('t:') ? n.tgt.slice(2) : '';
      go({ m: n.meetingId, k, t }); break; }
  }
});
document.addEventListener('mousedown', e => { if(!e.target.closest('.dd')) document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open')); });
let qTimer = null;
document.addEventListener('input', e => {
  if(e.target.id === 'mt-q'){ clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { Q = v.trim(); paintRows(); }, 220); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'mt-sem'){ SEM = e.target.value; subscribeList(); paintRows(); }
});

/* ═══ 시작 ═══ */
function boot(){
  onAuthStateChanged(auth, async user => {
    if(!user){ window.hideLoading && hideLoading(); $I('ls').style.display = 'flex'; $I('ms').style.display = 'none'; return; }
    let st = null;
    try{ st = await getDoc(doc(db, 'staff', user.uid)); }catch(e){ st = null; }
    if(!st || !st.exists()){ $I('l-msg').textContent = '교사 계정이 아니에요 — 교사 아이디로 로그인해 주세요.'; $I('ls').style.display = 'flex'; window.hideLoading && hideLoading(); return; }
    CU = { uid: user.uid, ...st.data() };
    window.ORGS = { daniel: '다니엘 아마츠', jihyebit: '지혜빛 선교원' };
    if(window.renderShell) renderShell('minutes', CU);
    if(window.guardPage && !guardPage(CU, 'minutes')) return;
    STORE = makeStore({ db, fs: FS, me: () => CU });
    await Promise.all([loadCfg(), loadStaff(), loadPins()]);
    computeOrgs();
    let saved = ''; try{ saved = localStorage.getItem('mtg_org') || ''; }catch(e){}
    const p = params();
    ORG = (p.get('org') && (SEE.includes(p.get('org')) || p.get('org') === 'all')) ? p.get('org')
      : (saved && (SEE.includes(saved) || saved === 'all')) ? saved
      : (SEE.includes(CU.org) ? CU.org : SEE[0]);
    subscribeList();
    watchNotifs();
    $I('ls').style.display = 'none'; $I('ms').style.display = 'block';
    await route();
    window.hideLoading && hideLoading();
  });
}
window.doLogin = async () => {
  const id = $I('l-id').value.trim(), pw = $I('l-pw').value, msg = $I('l-msg'); msg.textContent = '';
  try{ await signInWithEmailAndPassword(auth, `${id}@gyosa-seongyosa.staff`, pw); }
  catch(e){ msg.textContent = '로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
boot();
