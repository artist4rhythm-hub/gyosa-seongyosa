<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증명서 발급 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
:root {
  --gd:#1E3932; --gm:#00704A; --gl:#D4E9E2; --gp:#E8F3EF;
  --gold:#B08D3C; --goldd:#8A6410; --goldp:#F7EFD8;
  --iv:#F2F0EB; --ivd:#E3E1DA;
  --tx:#1F2320; --ts:#5A6560; --tl:#93A09A; --wh:#ffffff;
  --sh:0 2px 12px rgba(30,57,50,0.08); --r:12px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--iv);color:var(--tx);min-height:100vh;}

#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(150deg,#E8F3EF 0%,#F2F0EB 60%,#F7EFD8 100%);padding:24px;text-align:center;}
.gbox{background:var(--wh);border-radius:24px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(30,57,50,0.12);}
.gtitle{font-size:22px;font-weight:800;color:var(--gd);margin-bottom:8px;}
.gsub{font-size:14px;color:var(--ts);line-height:1.6;margin-bottom:20px;}
.gbtn{display:inline-block;width:100%;padding:14px;background:linear-gradient(135deg,#00704A,#1E3932);color:var(--wh);border:none;border-radius:var(--rs);font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;}

#ms{display:none;flex-direction:column;width:100%;}
.ah{display:none;}
.pg-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pg-link{padding:7px 14px;border-radius:8px;background:var(--wh);border:1px solid var(--ivd);color:var(--gm);font-size:13px;font-weight:600;text-decoration:none;}
.pg-link:hover{background:var(--gp);}
.ah{background:linear-gradient(135deg,#1E3932,#16302A);color:var(--wh);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.ahl{display:flex;align-items:center;gap:12px;}
.ahi{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.aht{font-size:16px;font-weight:700;}
.ahr{text-align:right;}
#hn{font-size:15px;font-weight:600;}
#hi{font-size:11px;opacity:.7;margin-top:2px;}
.homebtn{background:rgba(255,255,255,0.15);color:var(--wh);border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:4px;text-decoration:none;display:inline-block;}

.tc{padding:0;max-width:var(--page-dash,1680px);margin:0 auto;width:100%;}   /* v-112 넓은 화면 */
.actitle{font-size:17px;font-weight:800;color:var(--gd);margin-bottom:6px;}
.adesc{font-size:13px;color:var(--ts);margin-bottom:14px;line-height:1.5;}
.acard{background:var(--wh);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px;}

.bp{background:linear-gradient(135deg,#00704A,#1E3932);color:var(--wh);border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;}
.bs{background:var(--iv);color:var(--ts);border:1.5px solid var(--ivd);border-radius:8px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;}
.bm{background:var(--gp);color:var(--gm);border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}

.subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
/* 🔏 직인 보관 (v128 · 수퍼관리자) */
.sl-bar{border:1px solid var(--ivd);background:var(--wh);border-radius:12px;padding:10px 14px;margin:-6px 0 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.sl-bar.warn{background:var(--warn-bg,#FEF3C7);border-color:#F3D9A4}
.sl-t{font-size:13px;font-weight:900;color:var(--gd);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sl-chip{font-size:11px;font-weight:800;border-radius:7px;padding:2px 8px}
.sl-chip.ok{background:var(--ok-bg,#DCFCE7);color:var(--ok,#16A34A)}
.sl-chip.no{background:#fff;color:var(--warn,#B45309);border:1px solid #F3D9A4}
.sl-d{font-size:12px;color:var(--ts);line-height:1.6;flex:1;min-width:260px}
.sl-a{display:flex;gap:6px;flex-wrap:wrap}
.sl-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ivd);background:var(--wh);color:var(--gm);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.sl-btn.p{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}
.subtbtn{padding:9px 18px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--ivd);background:var(--wh);color:var(--ts);}
.subtbtn.on{background:var(--gm);color:var(--wh);border-color:var(--gm);}

.fgrp{display:flex;flex-direction:column;margin-bottom:12px;}
.fgrp label{font-size:12px;font-weight:700;color:var(--ts);margin-bottom:5px;}
.fgrp input,.fgrp select{height:40px;border:1.5px solid var(--ivd);border-radius:8px;padding:0 12px;font-size:14px;background:var(--iv);outline:none;width:100%;font-family:inherit;}

.slist{display:flex;flex-direction:column;gap:8px;}
.sitem{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--wh);border:1px solid var(--ivd);border-radius:10px;cursor:pointer;transition:border-color .12s,background .12s;}
.sitem:hover{border-color:var(--gm);background:var(--gp);}
.sname{font-size:15px;font-weight:700;color:var(--gd);}
.smeta{font-size:12px;color:var(--tl);margin-top:2px;}
/* 학년 아코디언 */
.gr-card{border:1px solid var(--ivd);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--wh);}
/* 넓은 화면 (v-112) — 학년 묶음·교직원 목록을 두 줄로 나란히 (칸이 440px 아래로 좁아지면 한 줄) */
#issue-slist.slist,#staff-slist.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(min(440px,100%),calc(50% - 6px)),1fr));gap:8px 12px;align-items:start;}
#issue-slist > .gr-card{margin-bottom:0;}
#issue-slist > .empty,#staff-slist > .empty{grid-column:1/-1;}
.gr-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;background:var(--iv);transition:background .12s;}
.gr-head:hover{background:var(--gp);}
.gr-arrow{font-size:12px;color:var(--tl);transition:transform .25s ease;}
.gr-card.open .gr-arrow{transform:rotate(180deg);}
.gr-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.gr-body-inner{padding:8px 12px 12px;}

.clist{display:flex;flex-direction:column;gap:10px;}
.citem{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wh);border:1px solid var(--ivd);border-radius:10px;flex-wrap:wrap;}

.empty{text-align:center;color:var(--tl);padding:30px;font-size:14px;}

.mov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.mbk{position:absolute;inset:0;background:rgba(20,25,60,0.5);}
.mbox{position:relative;background:var(--wh);border-radius:16px;padding:24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,0.3);margin:auto;}
.mtitle{font-size:18px;font-weight:800;color:var(--gd);margin-bottom:4px;}
.msub{font-size:13px;color:var(--ts);margin-bottom:16px;line-height:1.5;}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gd);color:var(--wh);padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#dc2626;} .toast.ok{background:var(--gm);}



/* ===== 증명서 A4 레이아웃 (고급) ===== */
.cert-sheet{
  position:relative;background:var(--c-bg,#fffdf9);width:210mm;min-height:297mm;padding:22mm 20mm;margin:0 auto;
  font-family:'Nanum Myeongjo','Noto Serif KR',serif;color:#1a1a1a;box-sizing:border-box;
}
.cert-sheet::before{
  content:'';position:absolute;top:10mm;left:10mm;right:10mm;bottom:10mm;
  border:1.5px solid var(--c-line,#b8935a);pointer-events:none;z-index:2;
}
.cert-sheet::after{
  content:'';position:absolute;top:11.5mm;left:11.5mm;right:11.5mm;bottom:11.5mm;
  border:0.5px solid var(--c-line2,#B08D3C);pointer-events:none;z-index:2;
}
.cert-bg{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:74mm;opacity:0.11;pointer-events:none;z-index:0;}
.cert-inner{position:relative;z-index:1;padding:2mm 8mm;}
.cert-docno{text-align:right;font-size:10.5pt;color:#555;letter-spacing:1px;margin-bottom:12mm;}
.cert-title{
  text-align:center;font-size:34pt;font-weight:800;letter-spacing:16px;color:var(--c-accent,#1a2440);
  margin:0 0 4mm;text-indent:16px;
}
.cert-title-line{width:52mm;height:2px;background:linear-gradient(90deg,transparent,var(--c-line,#b8935a),transparent);margin:0 auto 16mm;}
.cert-fields{margin:0 10mm 12mm;min-height:62mm;}
.cert-row{display:flex;font-size:13.5pt;margin-bottom:6.5mm;line-height:1.5;align-items:baseline;}
.cert-label{width:26mm;flex-shrink:0;color:#333;font-weight:600;display:inline-flex;justify-content:space-between;}
.cert-label>span{display:inline-block;}
.cert-colon{width:6mm;flex-shrink:0;color:#999;}
.cert-value{flex:1;color:#111;border-bottom:0.5px dotted #ccc;padding-bottom:1mm;word-break:keep-all;overflow-wrap:break-word;}
.cert-value.addr-val{font-size:12.5pt;line-height:1.45;}
.cert-statement{text-align:center;font-size:13.5pt;line-height:2.1;margin:16mm 0 22mm;color:#222;}
.cert-statement b{font-weight:700;color:var(--c-accent,#1a2440);}
.cert-issue{text-align:center;font-size:12.5pt;letter-spacing:1px;color:#222;margin-top:4mm}
.fc-tbl{width:100%;border-collapse:collapse;margin:8mm 0 4mm;font-size:11pt}
.fc-tbl th{background:#F5F2E9;border:1px solid #E0DCCF;padding:2.4mm 3mm;font-weight:800;color:#4a4a4a;font-size:10.5pt}
.fc-tbl td{border:1px solid #E0DCCF;padding:2.4mm 3mm;text-align:center;color:#222}
/* 🎓 확인서 — 용지를 세로로 채워 위아래 균형을 잡는다 (하단 안내문 자리 44mm 확보) */
.cert-sheet.former{height:297mm;display:flex;flex-direction:column}
.cert-sheet.former .cert-inner{flex:1;display:flex;flex-direction:column;padding:2mm 8mm 31mm}
.cert-sheet.former .cert-docno{margin-bottom:8mm}
.cert-sheet.former .cert-title{font-size:29pt;letter-spacing:12px;text-indent:12px;margin-bottom:3mm}
.cert-sheet.former .cert-title-line{margin-bottom:10mm}
.cert-sheet.former .cert-fields{margin:0 10mm 0;min-height:auto}
.cert-sheet.former .cert-row{font-size:11.5pt;margin-bottom:4.6mm;line-height:1.45}
.cert-sheet.former .cert-value.addr-val{font-size:11pt}
.cert-sheet.former .fc-tbl{width:calc(100% - 20mm);margin:8mm 10mm 0;font-size:10.5pt}
.cert-sheet.former .fc-tbl th{font-size:10pt;padding:2mm 3mm}
.cert-sheet.former .fc-tbl td{padding:2mm 3mm}
.cert-sheet.former .cert-statement{margin:9mm 0 0;font-size:12.2pt;line-height:1.9}
/* 아래 세 덩어리(발급일·기관명·대표자)는 바닥 쪽에 모이되 서로 넉넉히 벌린다 */
.cert-sheet.former .cert-issue{margin-top:auto;padding-top:10mm;font-size:12pt;letter-spacing:2px}
.cert-sheet.former .cert-org{margin-top:9mm}
.cert-sheet.former .cert-orgname{font-size:19pt;letter-spacing:2.5px}
.cert-sheet.former .cert-orgen{margin-top:3px}
.cert-sheet.former .cert-rep{margin-top:9mm;font-size:14pt}
.cert-sheet.former .cert-rep .stamp{width:19mm;height:19mm;left:calc(100% - 3mm)}
/* 과정 구간이 3개 이상이면 항목 간격만 한 단계 조인다 */
.cert-sheet.former.tight .cert-row{margin-bottom:3.8mm;font-size:11pt}
.cert-sheet.former.tight .cert-docno{margin-bottom:5mm}
.cert-sheet.former.tight .cert-title-line{margin-bottom:7mm}
.cert-sheet.former.tight .fc-tbl{margin-top:6mm;font-size:10pt}
.cert-sheet.former.tight .cert-statement{margin-top:7mm;font-size:11.6pt}
.cert-sheet.former.tight .cert-issue{padding-top:8mm}
.cert-sheet.former.tight .cert-org{margin-top:8mm}
.cert-sheet.former.tight .cert-rep{margin-top:8mm}
.cert-org{text-align:center;margin-top:8mm;}
.cert-orgname{font-size:22pt;font-weight:800;letter-spacing:3px;color:var(--c-accent,#1a2440);}
.cert-orgen{font-size:8.5pt;letter-spacing:4px;color:#888;margin-top:2px;font-family:serif;}
.cert-rep{position:relative;display:inline-block;margin-top:10mm;font-size:15pt;letter-spacing:2px;}
/* 지혜빛 재원증명서 전용 */
.cert-sheet.jh .cert-statement{text-align:left;margin:6mm 10mm 12mm;line-height:2.2;font-size:13pt;}
.cert-orginfo{margin:0 10mm 8mm;font-size:10.5pt;color:#333;}
.cert-orginfo-label{font-weight:700;color:var(--c-accent,#4c2a7a);margin-bottom:3mm;font-size:11pt;}
.cert-orginfo-row{display:flex;margin-bottom:2mm;line-height:1.5;align-items:baseline;}
.cert-orginfo-row .cert-label{width:22mm;font-size:10.5pt;}
.cert-orginfo-row .cert-colon{width:5mm;}
.cert-sheet.jh .cert-org{margin-top:14mm;}
.cert-rep .repname{font-weight:700;letter-spacing:4px;}
.cert-rep .stamp{position:absolute;left:calc(100% - 4mm);top:50%;transform:translateY(-50%);width:23mm;height:23mm;object-fit:contain;opacity:0.88;}
.cert-footer{position:absolute;bottom:16mm;left:20mm;right:20mm;font-size:8.5pt;color:#555;z-index:1;padding:0 8mm;}
/* 재직증명서: 항목이 많아 간격을 줄여 도장·하단과 겹치지 않게 */
.cert-sheet.emp .cert-row{margin-bottom:4.2mm;}
.cert-sheet.emp .cert-fields{margin-bottom:6mm;min-height:auto;}
.cert-sheet.emp .cert-statement{margin:7mm 0 10mm;}
.cert-sheet.emp .cert-org{margin-top:3mm;}
.cert-sheet.emp .cert-rep{margin-top:7mm;}
/* ═══ 재직·경력증명서: 지오메트릭 그린 (시안 I) ═══ */
.cert-sheet.geo{padding:0;background:#FCFBF5;overflow:hidden;}
.geo-tri{position:absolute;pointer-events:none;}
.geo-tri.gt{left:110mm;top:0;width:150mm;height:70mm;transform-origin:0 100%;transform:translateY(-70mm) rotate(24.7deg);background:linear-gradient(115deg,var(--g1),var(--g2));}
.geo-tri.gt-gold{left:110mm;top:0;width:140mm;height:2.4mm;transform-origin:0 0;transform:rotate(24.7deg);background:linear-gradient(90deg,#B08D3C,#E8D9A8);}
.geo-tri.gb{left:0;top:251mm;width:150mm;height:70mm;transform-origin:0 0;transform:rotate(24.7deg);background:linear-gradient(295deg,var(--g1),var(--g2));}
.geo-tri.gb-gold{left:0;top:251mm;width:140mm;height:2.4mm;transform-origin:0 0;transform:rotate(24.7deg) translateY(-2.4mm);background:linear-gradient(90deg,#E8D9A8,#B08D3C);}
.geo-star{position:absolute;top:14mm;right:14mm;color:#E8D9A8;font-size:12pt;}
.geo-btext{position:absolute;bottom:14mm;left:15mm;color:rgba(232,217,168,.92);font-size:7.5pt;letter-spacing:4px;}
.geo-in{position:absolute;top:29mm;left:22mm;right:22mm;}
.geo-docno{font-size:9pt;color:#8b968e;letter-spacing:1.5px;}
.geo-title{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:900;font-size:28pt;color:var(--ink);letter-spacing:12px;margin-top:8mm;}
.geo-en{font-size:8pt;color:#B08D3C;letter-spacing:6px;margin-top:3mm;font-weight:600;}
.geo-line{width:64mm;height:2px;background:linear-gradient(90deg,var(--ink),#B08D3C 55%,#FCFBF5);margin-top:5.5mm;}
.cert-sheet.geo .cert-fields{margin-top:10mm;max-width:154mm;min-height:auto;margin-bottom:0;}
.cert-sheet.geo .cert-row{font-size:12.2pt;margin-bottom:5.2mm;}
.cert-sheet.geo .cert-label{width:33mm;color:var(--ink);font-weight:700;}
.cert-sheet.geo .cert-colon{color:#B08D3C;}
.cert-sheet.geo .cert-value{border-bottom:0.5px solid #d6ddd6;padding-bottom:1.4mm;color:#20302a;}
.cert-sheet.geo .cert-statement{text-align:left;margin:10mm 0 0;font-size:12.6pt;line-height:2;color:var(--ink);}
.geo-org{margin-top:9mm;text-align:right;padding-right:6mm;}
.geo-orgname{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:19pt;font-weight:900;color:var(--ink);letter-spacing:5px;}
.geo-orgen{font-size:7pt;color:#8b968e;letter-spacing:4px;margin-top:1mm;}
.geo-rep{margin-top:5mm;font-size:12.5pt;color:var(--ink);letter-spacing:2px;position:relative;display:inline-block;padding-right:2mm;}
.geo-rep .stamp{position:absolute;right:-10mm;top:-8mm;width:22mm;height:22mm;opacity:.92;}
.geo-foot{position:absolute;bottom:12mm;right:20mm;text-align:right;font-size:7.6pt;color:#8b968e;line-height:1.85;}
.cert-footer .fline{width:100%;height:1px;background:linear-gradient(90deg,transparent,#b8935a 20%,#b8935a 80%,transparent);margin-bottom:3mm;}
.cert-footer .addr{margin-bottom:2.5mm;line-height:1.7;color:#444;text-align:center;}
.cert-footer .note{color:#777;font-size:7.8pt;line-height:1.65;}

/* ═══ 📅 v139 일정 확인서 — 공문 B-2 (무늬 띠 · 작은 글자 줄 · 진위 확인 칸) · A4 794×1123 ═══ */
.cert-sheet.sched{width:794px;height:1123px;min-height:1123px;padding:50px 72px 0;margin:0 auto;background:#fff;color:#16181d;
  font-family:'Noto Serif KR','Nanum Myeongjo',serif;word-break:keep-all;overflow-wrap:break-word;overflow:hidden;box-sizing:border-box}
.cert-sheet.sched::before,.cert-sheet.sched::after{display:none;content:none}
.cert-sheet.sched .sc-wm{position:absolute;left:217px;top:420px;width:360px;opacity:.045;pointer-events:none;z-index:0}
.cert-sheet.sched > *{position:relative;z-index:1}
.cert-sheet.sched > .sc-wm,.cert-sheet.sched > .sc-foot,.cert-sheet.sched > .sc-void{position:absolute}
.sc-top{display:flex;justify-content:flex-end;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:12px;color:#4a4f5c;line-height:1.5}
.sc-head{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:16px}
.sc-head .sc-emb{width:52px;height:auto}
.sc-headt{display:flex;flex-direction:column;align-items:center}
.sc-org{font-weight:900;font-size:32px;letter-spacing:.22em;text-indent:.22em;color:var(--sc-ink,#1b2a52);line-height:1.2;white-space:nowrap}
.sc-en{margin-top:4px;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:12px;font-weight:700;letter-spacing:.42em;text-indent:.42em;color:var(--sc-gold,#8a6c2c);line-height:1.5}
.sc-band{display:block;width:650px;height:26px;margin-top:16px}
.sc-band-x{border-top:1.5px solid var(--sc-ink,#1b2a52);border-bottom:1.5px solid var(--sc-ink,#1b2a52)}
.sc-meta{margin-top:20px;display:grid;grid-template-columns:64px 1fr;row-gap:10px;font-size:16px;line-height:1.55}
.sc-meta > b{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-weight:700}
.sc-meta .sc-title{font-weight:700}
.sc-rule{margin-top:16px;height:1px;background:#9aa0ab}
.sc-body{margin-top:20px;font-size:16px;line-height:1.9}
.sc-body .sc-p2{padding-left:20px;text-indent:-20px}

function calcAge(birth, refDate){
  if(!birth || birth.length<10) return '';
  const b = new Date(birth+'T00:00:00');
  const r = refDate ? new Date(refDate+'T00:00:00') : new Date();
  let age = r.getFullYear() - b.getFullYear();
  const m = r.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && r.getDate() < b.getDate())) age--;
  return age;
}

    if((c.students||[]).includes(sid) && c.grades && c.grades[sid]) return c.grades[sid];
  }
  return '';
}
function studentClass(sid){ return CLASSES.find(c=>(c.students||[]).includes(sid)); }
function gradeToDept(grade){
  const n = parseInt(grade,10);
  if(isNaN(n)) return '';
  if(n>=1 && n<=5) return '초등부';
  if(n>=6 && n<=9) return '중등부';
  if(n>=10 && n<=12) return '고등부';
  return '';
}
// 부서 → 교육과정 문구
function deptCourse(dept){
  if(dept==='초등부') return '초등교육과정';
  if(dept==='중등부') return '중등교육과정';
  if(dept==='고등부') return '고등교육과정';
  return '교육과정';
}
// 🏛 v138 증명서 발급 담당 — 내 기관의 모든 학생 · 교직원 증명서 (기관관리자와 같은 범위 · 직인 등록 · 삭제는 수퍼관리자)
let CERT_ISSUERS = [];
const isCertIssuer = () => !!CU && CERT_ISSUERS.includes(CU.uid);
// 이 학생을 담임이 발급할 수 있는지 (자기 반 학생) 또는 관리자
function canIssue(s){
  if(CU.role==='super' || CU.role==='org_admin' || isCertIssuer()) return myOrgs().includes(s.org);
  if(CU.role==='tab_admin'){
    // 부서장: 같은 기관+같은 부서
    if(!myOrgs().includes(s.org)) return false;
    const dept = gradeToDept(studentGrade(s.id));
    return CU.dept==='행정실' || CU.dept===dept || !CU.dept;
  }
  // 교사: 담임인 반의 학생
  const c = studentClass(s.id);
  return c && (c.teacherUid===CU.uid || (c.deputies||[]).includes(CU.uid) || (c.shadowUids||[]).includes(CU.uid));
}

// 날짜 포맷: YYYY-MM-DD → "YYYY년 M월 D일"
function korDate(raw){
  if(!raw) return '';
  const str = String(raw).trim();
  // 숫자 그룹 3개 추출 (구분자: - / . 공백 년월일 등 무엇이든)
  const nums = str.match(/\d+/g);
  if(!nums || nums.length<3) return str; // 파싱 불가 시 원본
  let [y, m, d] = nums.map(Number);
  // 2자리 연도 보정 (예: 05 → 2005, 99 → 1999)
  if(y < 100){ y += (y <= 40 ? 2000 : 1900); }
  if(m<1||m>12||d<1||d>31) return str; // 이상값이면 원본
  return `${y}년 ${m}월 ${d}일`;
}
function todayYMD(){ const n=new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; }

/* ═══ 🔏 직인 — 교직원만 읽는 보관함(config/seal_기관)에서 (v128) ═══
   예전: 사이트 파일 stamp-*.png — 깃허브 공개 저장소라 누구나 내려받을 수 있었다
   지금: Firebase config/seal_daniel · seal_jihyebit (보안 규칙: 교직원만 읽기 · 수퍼관리자만 쓰기 — v31 그대로)
   · 보관함에 없으면 잠깐 동안 예전 파일로 (옮기기 전 · 화면이 비지 않게)
   · 수퍼관리자: «보관함으로 옮기기»(사이트 파일 → 보관함 한 번에) · «새 직인 올리기» */
const SEAL_FILE = { daniel: 'stamp-daniel.png', jihyebit: 'stamp-jihyebit.png' };
const SEAL_SRC = {};      // org → 'db' | 'file'
async function loadSeals(){
  for(const org of Object.keys(ORG_CONFIG)){
    try{
      const s = await getDoc(doc(db, 'config', 'seal_' + org));
      const u = s.exists() ? String(s.data().dataUrl || '') : '';
      if(u.startsWith('data:image/')){ ORG_CONFIG[org].stamp = u; SEAL_SRC[org] = 'db'; continue; }
    }catch(e){}
    ORG_CONFIG[org].stamp = SEAL_FILE[org] || ORG_CONFIG[org].stamp; SEAL_SRC[org] = 'file';
  }
}
function renderSealBar(){
  const el = $I('seal-bar'); if(!el) return;
  if(!CU || CU.role !== 'super'){ el.innerHTML = ''; return; }
  const orgs = Object.keys(ORG_CONFIG);
  const left = orgs.filter(o => SEAL_SRC[o] !== 'db');
  const chips = orgs.map(o => `<span class="sl-chip ${SEAL_SRC[o]==='db'?'ok':'no'}">${SEAL_SRC[o]==='db'?'🔒':'⚠️'} ${esc(ORG_CONFIG[o].orgName)}</span>`).join('');
  el.innerHTML = `<div class="sl-bar ${left.length?'warn':''}">
    <div class="sl-t">🔏 직인 ${chips}</div>
    <div class="sl-d">${left.length
      ? '직인 원본이 아직 <b>사이트 파일</b>이라 누구나 내려받을 수 있어요. «보관함으로 옮기기»를 누르면 <b>교직원만 볼 수 있는 곳</b>으로 옮겨요. 옮긴 뒤 깃허브에서 <b>stamp-daniel.png · stamp-jihyebit.png</b>를 지워 주세요.'
      : '직인은 교직원만 볼 수 있는 보관함에 있어요. 깃허브에 stamp-*.png가 남아 있으면 지워 주세요.'}</div>
    <div class="sl-a">
      ${left.length ? `<button class="sl-btn p" onclick="sealMigrate()">🔒 보관함으로 옮기기</button>` : ''}
      ${orgs.map(o => `<label class="sl-btn">🖼 ${esc(ORG_CONFIG[o].orgName)} 직인 새로 올리기<input type="file" accept="image/png,image/*" style="display:none" onchange="sealUpload('${o}', this)"></label>`).join('')}
    </div>
  </div>`;
}
function sealFileToUrl(blob){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result || '')); fr.onerror = () => rej(new Error('파일을 읽지 못했어요')); fr.readAsDataURL(blob); });
}
async function sealShrink(url){
  // 문서 1MB 안 — 크면 긴 변 900px PNG 로 (투명 바탕 그대로)
  if(url.length <= 700 * 1024) return url;
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('그림을 열지 못했어요')); i.src = url; });
  const k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/png');
  if(out.length > 900 * 1024) throw new Error('그림이 너무 커요 — 더 작은 PNG로 올려 주세요');
  return out;
}
async function sealSave(org, url, how){
  await setDoc(doc(db, 'config', 'seal_' + org), { dataUrl: url, org, how, updatedAt: Timestamp.now(), updatedByUid: CU.uid, updatedByName: CU.name || '' });
  ORG_CONFIG[org].stamp = url; SEAL_SRC[org] = 'db';
}
window.sealMigrate = async () => {
  if(!CU || CU.role !== 'super') return;
  const done = [], miss = [];
  window.showLoading && window.showLoading('직인을 보관함으로 옮기는 중…');
  try{
    for(const org of Object.keys(ORG_CONFIG)){
      if(SEAL_SRC[org] === 'db') continue;
      try{
        const r = await fetch(SEAL_FILE[org] + '?_=' + Date.now(), { cache: 'no-store' });
        if(!r.ok) throw new Error('파일 없음');
        const b = await r.blob(); if(!/^image\//.test(b.type) && b.size < 100) throw new Error('그림 아님');
        await sealSave(org, await sealShrink(await sealFileToUrl(b)), 'migrate');
        done.push(ORG_CONFIG[org].orgName);
      }catch(e){ miss.push(ORG_CONFIG[org].orgName); }
    }
  } finally { window.hideLoading && window.hideLoading(); }
  renderSealBar(); if(curTab) showTab(curTab);
  if(done.length) toast(`🔒 ${done.join(' · ')} 직인을 보관함으로 옮겼어요 — 이제 깃허브에서 stamp 파일을 지워 주세요`, 'ok');
  if(miss.length) setTimeout(() => toast(`${miss.join(' · ')}: 사이트에 직인 파일이 없어요 — «직인 새로 올리기»로 올려 주세요`, 'err'), done.length ? 2600 : 0);
};
window.sealUpload = async (org, input) => {
  const f = input.files && input.files[0]; input.value = '';
  if(!f || !CU || CU.role !== 'super') return;
  if(!/^image\//.test(f.type)){ toast('그림 파일(PNG)을 골라 주세요', 'err'); return; }
  try{
    window.showLoading && window.showLoading('직인을 올리는 중…');
    await sealSave(org, await sealShrink(await sealFileToUrl(f)), 'upload');
    toast(`🔒 ${ORG_CONFIG[org].orgName} 직인을 보관함에 올렸어요`, 'ok');
  }catch(e){ toast('올리지 못했어요: ' + (e.message || ''), 'err'); }
  finally { window.hideLoading && window.hideLoading(); }
  renderSealBar(); if(curTab) showTab(curTab);
};

// 학생 목록만 갱신 (입력창은 건드리지 않음 → 검색 중복입력 방지)
let openGrades = {}; // 펼쳐진 학년 기억
function renderStudentList(){
  const list = $I('issue-slist');
  if(!list) return;
  const students = STUDENTS
    .filter(s=> CERT_MODE==='former' ? (s.status||'active')!=='active' : (s.status||'active')==='active')
    .filter(s=>s.org===issueOrg)
    .filter(s=>canIssue(s))
    .filter(s=>!issueSearch || (s.name||'').includes(issueSearch));

  if(!students.length){
    list.innerHTML = `<p class="empty">${CERT_MODE==='former'?'자퇴·전학 등으로 종료된 학생이 없습니다. (학생관리에서 상태를 바꾸면 여기에 나타납니다)':'발급 가능한 학생이 없습니다.'}</p>`;
    return;
  }

  // 검색 중이면 평면 목록 (결과 바로 보이게)
  if(issueSearch){
    const sorted = [...students].sort((a,b)=>(studentGrade(a.id)||'').localeCompare(studentGrade(b.id)||'')||(a.name||'').localeCompare(b.name||'','ko'));
    list.innerHTML = sorted.map(s=>studentItemHTML(s)).join('');
    return;
  }

  // 학년별 그룹
  const byGrade = {};
  students.forEach(s=>{
    const g = studentGrade(s.id) || '(학년 미지정)';
    (byGrade[g] = byGrade[g] || []).push(s);
  });
  // 학년 정렬 (숫자 학년 우선, 미지정 맨뒤)
  const grades = Object.keys(byGrade).sort((a,b)=>{
    const na=parseInt(a,10), nb=parseInt(b,10);
    if(isNaN(na)&&isNaN(nb)) return 0;
    if(isNaN(na)) return 1;
    if(isNaN(nb)) return -1;
    return na-nb;
  });

  const palette = ['#0891b2','#7c3aed','#db2777','#d97706','#059669','#2563eb','#dc2626','#4f46e5','#0d9488','#c026d3','#ea580c','#65a30d'];
  list.innerHTML = grades.map((g,gi)=>{
    const arr = byGrade[g].sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
    const dept = gradeToDept(g);
    const accent = palette[gi % palette.length];
    const open = !!openGrades[g];
    return `<div class="gr-card ${open?'open':''}" data-grade="${esc(g)}">
      <div class="gr-head" onclick="toggleGrade('${esc(g)}')">
        <span style="width:10px;height:10px;border-radius:50%;background:${accent};flex-shrink:0"></span>
        <span style="flex:1;font-size:15px;font-weight:700;color:var(--gd)">${esc(g)}${dept?` <span style="font-size:12px;color:var(--tl);font-weight:400">· ${dept}</span>`:''}</span>
        <span style="font-size:12px;color:var(--tl)">${arr.length}명</span>
        <span class="gr-arrow">▼</span>
      </div>
      <div class="gr-body">
        <div class="gr-body-inner">
          ${arr.map(s=>studentItemHTML(s)).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
  // 열린 학년의 body 높이 설정 (애니메이션)
  grades.forEach(g=>{
    if(openGrades[g]){
      const card = list.querySelector(`.gr-card[data-grade="${cssEsc(g)}"]`);
      if(card){ const body=card.querySelector('.gr-body'); const inner=card.querySelector('.gr-body-inner'); if(body&&inner) body.style.maxHeight = inner.scrollHeight+'px'; }
    }
  });
}
function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }
function studentItemHTML(s){
  const g = studentGrade(s.id);
  const cfg = ORG_CONFIG[s.org] || {};
  let metaLeft;
  if(cfg.layout==='age'){
    const age = calcAge(s.birth, todayYMD());
    metaLeft = (age!=='' ? `만 ${age}세` : '') + (g?` · ${g}`:'');
  } else {
    const dept = gradeToDept(g);
    metaLeft = `${g?g+' · ':''}${dept||''}`;
  }
  return `<div class="sitem" onclick="openPreview('${s.id}')" style="margin-bottom:6px">
    <div style="flex:1">
      <div class="sname">${esc(s.name)} <span style="font-size:12px;color:${s.gender==='남'?'#2b6cb0':'#d53f8c'}">${esc(s.gender||'')}</span></div>
      <div class="smeta">${metaLeft}${s.birth?' · '+s.birth:''}</div>
    </div>
    <button class="bm">증명서 확인 ›</button>
  </div>`;
}
function toggleGrade(g){
  const willOpen = !openGrades[g];
  openGrades[g] = willOpen;
  const list = $I('issue-slist');
  const card = list?.querySelector(`.gr-card[data-grade="${cssEsc(g)}"]`);
  if(!card) { renderStudentList(); return; }
  const body = card.querySelector('.gr-body');
  const inner = card.querySelector('.gr-body-inner');
  if(willOpen){
    card.classList.add('open');
    body.style.maxHeight = inner.scrollHeight + 'px';
    // 애니메이션 후 auto로 (내용 늘어나도 대응)
    setTimeout(()=>{ if(openGrades[g]) body.style.maxHeight = 'none'; }, 320);
  } else {

// 재직기간: 입사일 ~ 기준일 → "N년 N개월"
function tenureText(hireDate, refDate){
  if(!hireDate) return '';
  const a = new Date(hireDate+'T00:00:00');
  const b = new Date((refDate||todayYMD())+'T00:00:00');
  if(isNaN(a) || b < a) return '';
  let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) months--;
  const y = Math.floor(months/12), m = months%12;
  if(y<=0 && m<=0) return '1개월 미만';
  return `${y>0?y+'년 ':''}${m>0?m+'개월':''}`.trim();
}

/* ── 누구의 재직·경력증명서까지 발급할 수 있나 ──
   · 수퍼관리자: 전체
   · 기관관리자: 자기 기관 교직원 (두 기관 관리자는 두 기관 모두)
   · 부서장: 자기 부서원 (행정실장은 행정 업무 특성상 다니엘 전체)
   · 교사·협력교사: 본인 것만 */
function canIssueStaffCert(s){
  if(!CU || !s) return false;
  if(s.uid === CU.uid) return true;                       // 본인은 언제나
  const so = s.orgs && s.orgs.length ? s.orgs : [s.org];
  if(CU.role === 'super') return true;
  if(CU.role === 'org_admin' || isCertIssuer()) return so.some(o => myOrgs().includes(o));
  if(CU.role === 'tab_admin'){
    if(CU.dept === '행정실') return so.includes(CU.org);  // 행정실장: 기관 전체
    return s.org === CU.org && s.dept === CU.dept;        // 부서장: 자기 부서
  }
  return false;
}

  if(!canIssueStaffCert(s)){ toast('이 선생님의 증명서를 발급할 권한이 없습니다.','err'); return; }
  const quit = (s.acStatus||'active') === 'quit';
  const isCareer = mode === 'career' || quit;                // 퇴직자는 항상 경력증명서
  if(isCareer && !canIssueCareer()){
    toast('경력증명서는 부서장(행정실장) 이상만 발급할 수 있습니다.','err');
    return;
  }
  previewStaff = s;
  const org = (s.orgs && s.orgs.length ? s.orgs : [s.org]).includes(staffOrg) ? staffOrg : (s.org||'daniel');
  const cfg = ORG_CONFIG[org];

    {key:'position', label:'직위(직책)', type:'text', placeholder:'예: 교사, 행정실장'},

  const readVals = () => {

      v[f.key] = el ? el.value.trim() : (s[f.key]||'');   // 입력창이 아직 없으면 저장된 값
    });

    v.purpose = pu ? (pu.value.trim() || '제출용') : '제출용';
    const dc = $I('sv-dutyshow');
    v.dutyShown = dc ? dc.checked : false;
    return v;
  };
  const buildPreview = () => {
    const v = readVals();
    return buildEmployCert({ org, docNo:tempDocNo, issueDate, name:s.name||'',
      kind: isCareer ? 'career' : 'employ', leaveDate:v.leaveDate,
      duty:v.duty, dutyShown:v.dutyShown,
      birth:v.birth, address:v.address, hireDate:v.hireDate, position:v.position, purpose:v.purpose });
  };

  const fieldsHTML = fieldDefs.map(f=>{

        </label>

async function doIssueStaff(uid, org, mode){
  const s = STAFF_ALL.find(x=>x.uid===uid); if(!s) return;
  if(!canIssueStaffCert(s)){ toast('이 선생님의 증명서를 발급할 권한이 없습니다.','err'); return; }
  const cfg = ORG_CONFIG[org]; if(!cfg){ toast('이 기관은 발급을 지원하지 않습니다.','err'); return; }
  const issueDate = todayYMD();
  const isCareer = mode === 'career';
  const isQuit = (s.acStatus||'active') === 'quit';
  if(isCareer && !canIssueCareer()){
    toast('경력증명서는 부서장(행정실장) 이상만 발급할 수 있습니다.','err');
    return;
  }

  const birth = $I('sv-birth')?.value?.trim() || '';
  const address = $I('sv-address')?.value?.trim() || '';
  const hireDate = $I('sv-hireDate')?.value?.trim() || '';
  const leaveDate = $I('sv-leaveDate')?.value?.trim() || '';
  const position = $I('sv-position')?.value?.trim() || '';
  const duty = $I('sv-duty')?.value?.trim() || '';
  const dutyShown = $I('sv-dutyshow')?.checked || false;
  const purpose = $I('sv-purpose')?.value?.trim() || '제출용';

  const missing = [];
  if(!birth) missing.push('생년월일');
  if(!address) missing.push('집 주소');
  if(!hireDate) missing.push('입사일');
  if(isCareer && isQuit && !leaveDate) missing.push('퇴직일');
  if(!position) missing.push('직위');
  if(isCareer && dutyShown && !duty) missing.push('담당 업무');
  if(missing.length){
    toast(`${missing.join(', ')}을(를) 입력해주세요.`,'err');
    return;
  }
  if(isCareer && leaveDate && hireDate && leaveDate < hireDate){
    toast('퇴직일이 입사일보다 빠를 수 없습니다.','err');
    return;
  }
  if(!$I('sv-confirm')?.checked){
    toast('내용 확인 후 "이상 없음"에 체크해주세요.','err');
    return;
  }

  try {
    // 인사정보에 반영
    const updates = {};
    if(birth !== (s.birth||'')) updates.birth = birth;
    if(address !== (s.address||'')) updates.address = address;
    if(hireDate !== (s.hireDate||'')) updates.hireDate = hireDate;
    if(isCareer && leaveDate !== (s.leaveDate||'')) updates.leaveDate = leaveDate;
    if(position !== (s.position||'')) updates.position = position;
    if(isCareer && duty !== (s.duty||'')) updates.duty = duty;
    // 인사정보 저장은 보안 규칙상 관리자(수퍼 · 기관관리자)와 본인만 — 그 밖의 분(부서장 · 발급 담당)은 증명서에만 넣고 인사정보는 그대로 둔다
    // 🔒 v138 직책은 결재선·지급 결재를 정하므로 본인이 바꾸지 못한다 (보안 규칙 v33) — 본인 발급이면 직책은 증명서에만
    if(!['super','org_admin'].includes(CU.role)) delete updates.position;
    if(Object.keys(updates).length && (['super','org_admin'].includes(CU.role) || uid === CU.uid)){
      await updateDoc(doc(db,'staff',uid), updates); dropLists('staff');
      Object.assign(s, updates);
    }

    // 문서번호: [코드]-E/R-YYMMDD-NN (E=재직, R=경력)
    const kind = isCareer ? 'career' : 'employ';
    const codeLetter = isCareer ? 'R' : 'E';
    const datePart = issueDate.slice(2).replace(/-/g,'');
    const prefix = `${cfg.code}-${codeLetter}-${datePart}-`;
    const snap = await getDocs(query(collection(db,'certificates'), where('docNoDate','==',datePart), where('org','==',org), where('kind','==',kind)));
    const seq = snap.size + 1;
    const docNo = prefix + pad(seq);

    const record = {
      docNo, docNoDate: datePart, seq,
      kind, type: isCareer ? '경력' : '재직', org,
      staffUid: uid, studentName: s.name||'',   // 목록 표시 재사용
      grade: position,                           // 목록에서 직위로 표시
      birth, address, hireDate, position, purpose,
      leaveDate: isCareer ? leaveDate : '',
      duty: isCareer ? duty : '',
      dutyShown: isCareer ? dutyShown : false,
      issueDate,
      issuedByUid: CU.uid, issuedByName: CU.name||'',
      createdAt: Timestamp.now()
    };
    await addDoc(collection(db,'certificates'), record);
    if(window.logActivity) logActivity('발급', isCareer?'경력증명서':'재직증명서', s.name||'', docNo);
    closeStaffPreview();
    toast(`발급 완료 (${docNo})`,'ok');
    showTab('list');
  } catch(e){ toast('발급 실패: '+e.message,'err'); }
}
window.doIssueStaff = doIssueStaff;

   📅 v139 일정 확인서 — 공문형 (B-2 · 무늬 띠 · 작은 글자 줄 · 진위 확인 QR)
   학부모가 직장에 «자녀 돌봄 휴가» 등을 낼 때 내는 «기관 일정이 맞다»는 확인 공문.

     예전에 QR로 발급한 확인서도 다시 받으면 QR 없이 나온다. 예전 진위 기록(certVerify)은 «발급 취소 · 삭제» 때 함께 정리만 한다 (규칙 v42)
   ═══════════════════════════════════════════════════════════════ */

function scTargets(){

  if(SC.mode === 'all') return all.sort((a, b) => (scClsLabel(a.id)||'').localeCompare(scClsLabel(b.id)||'', 'ko') || (a.name||'').localeCompare(b.name||'', 'ko'));
  const g = String(SC.group || '');
  let out = [];
  if(g.startsWith('c:')){ const c = CLASSES.find(x => x.id === g.slice(2)); const ids = new Set((c && c.students) || []); out = all.filter(s => ids.has(s.id) && scClassOf(s.id) === c); }

  return out.sort((a, b) => (scClsLabel(a.id)||'').localeCompare(scClsLabel(b.id)||'', 'ko') || (a.name||'').localeCompare(b.name||'', 'ko'));

function scGroups(){
  const all = scEligible(SC.org), ids = new Set(all.map(s => s.id));
  const cls = CLASSES.filter(c => (c.org || 'daniel') === SC.org);
  const Y = scYear(), ys = cls.map(c => Number(c.year || 0));
  const maxY = ys.includes(Y) ? Y : Math.max(0, ...ys.filter(y => y < Y), ...(ys.some(y => y < Y) ? [] : ys));
  const classes = cls.filter(c => Number(c.year || 0) === maxY)
    .map(c => ({ v: 'c:' + c.id, label: c.name || '(이름 없는 반)', n: (c.students||[]).filter(sid => ids.has(sid) && scClassOf(sid) === c).length }))
    .filter(x => x.n > 0).sort((a, b) => a.label.localeCompare(b.label, 'ko'));
  const gm = {}; all.forEach(s => { const g = scGradeOf(s.id); if(g) gm[g] = (gm[g] || 0) + 1; });
  const grades = Object.keys(gm).sort((a, b) => (parseInt(a, 10) || 99) - (parseInt(b, 10) || 99) || a.localeCompare(b, 'ko')).map(g => ({ v: 'g:' + g, label: g, n: gm[g] }));

function scBind(){

  on('sc-end', 'change', e => { SC.end = e.target.value; SC.pick = ''; SC.wdays = []; SC.skips = []; scDrawSoon(); });
  ['reason', 'note', 'title', 'body', 'p1'].forEach(k => on('sc-' + k, 'input', e => { SC[k] = e.target.value; SC.dirty[k] = true; scPreviewSoon(); }));
  on('sc-search', 'input', e => { SC.search = e.target.value; const h = $I('sc-hits'); if(h) h.innerHTML = scHitsHTML(); });
  on('sc-search', 'keydown', e => { if(e.key === 'Enter'){ const f = document.querySelector('#sc-hits .sc-hit'); if(f){ e.preventDefault(); f.click(); } } });
  on('sc-det', 'toggle', e => { SC.detOpen = e.target.open; });

  txt('sc-guardian', 'guardian');

  on('sc-confirm', 'change', e => { SC.confirm = e.target.checked; });
}

/* ── 발급 ── */
async function scIssue(){
  if(!SC || SC.busy) return;
  const cfg = ORG_CONFIG[SC.org]; if(!cfg) return;
  const who = schedWho(SC.org);
  const tg = scTargets();
  const bad = [];
  if(!scYmd(SC.start)) bad.push('시작 날짜');
  if(scYmd(SC.end) && SC.end < SC.start){ toast('끝 날짜가 시작보다 빨라요.', 'err'); return; }
  if(!SC.title.trim()) bad.push('제목');
  if(!SC.body.trim()) bad.push('본문 문장');
  if(!SC.recv.trim()) bad.push('수신');
  if(!tg.length) bad.push(`대상 ${who}`);
  if(bad.length){ toast(`${bad.join(', ')}을(를) 넣어 주세요.`, 'err'); return; }
  if(!SC.confirm){ toast('내용을 확인한 뒤 «이상 없음»에 체크해 주세요.', 'err'); return; }
  if(tg.some(s => !canIssue(s))){ toast(`발급할 수 없는 ${who}이 섞여 있어요.`, 'err'); return; }
  const words = scBadWords();
  if(words.length && !confirm(`문서에 ${words.map(w => '«' + w + '»').join(' ')}이(가) 들어 있어요.\n등록 전에는 «학교 · 재학» 같은 말을 쓰지 않는 게 안전해요.\n\n그대로 발급할까요? («취소»를 누르고 «✨ 알맞은 말로 바꾸기»를 쓸 수 있어요)`)) return;
  if(tg.length > 1 && !confirm(`${tg.length}명에게 «${SC.title.trim()}»을(를) 한 장씩 발급할까요?\n(${who}마다 문서번호가 따로 붙어요)`)) return;
  SC.busy = true;
  const btn = $I('sc-issue'); if(btn){ btn.disabled = true; btn.style.opacity = '.5'; }
  window.showLoading && window.showLoading('일정 확인서를 발급하는 중…');
  try{
    const issueDate = todayYMD();
    const datePart = issueDate.slice(2).replace(/-/g, '');
    // 문서번호: 그날 · 기관의 «번호 칸»(certificates/_seq_S_기관_날짜)을 거래로 늘려 받는다 — 둘이 동시에 발급해도 겹치지 않음
    //   번호 칸이 처음이면 그날 이미 있는 일정 확인서의 가장 큰 번호에서 이어 간다 · 실패한 발급의 번호는 비어 있을 수 있음
    const prev = await getDocs(query(collection(db, 'certificates'), where('docNoDate', '==', datePart), where('org', '==', SC.org), where('kind', '==', 'schedule')));
    let floor = 0; prev.forEach(d => { floor = Math.max(floor, Number(d.data().seq) || 0); });
    const ctrRef = doc(db, 'certificates', `_seq_S_${SC.org}_${datePart}`);
    const seq = await runTransaction(db, async tx => {
      const cs = await tx.get(ctrRef);
      const cur = Math.max(floor, cs.exists() ? (Number(cs.data().n) || 0) : 0);
      tx.set(ctrRef, { kind: 'counter', of: 'schedule', org: SC.org, date: datePart, n: cur + tg.length, updatedAt: Timestamp.now(), updatedByUid: CU.uid });
      return cur;
    });
    const batchId = tg.length > 1 ? ('b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)) : '';
    const grpAll = scGroups();
    const grp = SC.mode === 'group' ? (grpAll.classes.concat(grpAll.grades).find(x => x.v === SC.group) || {}).label : (SC.mode === 'all' ? '모두' : '');
    const mk = withQR => tg.map((s, i) => {
      const n = seq + i + 1;
      const r = scRecFor(s);
      const code = withQR ? newVerifyCode() : '';
      const rec = {
        docNo: `${cfg.code}-S-${datePart}-${pad(n)}`, docNoDate: datePart, seq: n,
        kind: 'schedule', type: '일정확인', org: SC.org,
        studentId: s.id, studentName: s.name || '', grade: r.cls || '', cls: r.cls || '', birth: r.birth || '',
        guardian: r.guardian, recv: r.recv, sKind: SC.kind, schedName: (SC.name || '').trim(),
        title: r.title, body: r.body, p1: r.p1, rowLabel: r.rowLabel, start: r.start, end: r.end, wdays: r.wdays, skips: r.skips,
        reason: r.reason, note: r.note, charge: r.charge, verifyCode: code,
        batchId, batchSize: tg.length, batchLabel: grp || '',
        issueDate, issuedByUid: CU.uid, issuedByName: CU.name || '', createdAt: Timestamp.now()
      };
      // 공개 기록 — 규칙 v34 의 칸 길이에 맞춰 미리 자른다 (긴 이름 하나 때문에 반 전체가 QR 없이 나가지 않게)
      const ver = code ? {
        kind: 'schedule', title: rec.title.slice(0, 60), org: SC.org, orgName: String(cfg.orgName || '').slice(0, 30), docNo: rec.docNo, issueDate,
        maskedName: maskName(s.name).slice(0, 19) + (maskName(s.name).length > 19 ? '*' : ''), birthYear: (r.birth || '').slice(0, 4),
        period: `${schedPeriodText(rec.start, rec.end)} · ${schedDaysText(rec.start, rec.end, rec.wdays, rec.skips)}`.slice(0, 80),
        status: 'valid', issuedByUid: CU.uid, createdAt: Timestamp.now()
      } : null;
      return { rec, ver, code, id: '' };
    });
    // 학생마다 «진위 기록 + 발급 기록»을 같은 묶음에 (한 묶음 최대 150명 = 300건) — 한 묶음은 모두 저장되거나 모두 안 됨
    const PER = 150;
    const commit = async list => {
      let saved = 0;
      for(let i = 0; i < list.length; i += PER){
        const part = list.slice(i, i + PER);
        const b = writeBatch(db);
        part.forEach(x => {
          const ref = doc(collection(db, 'certificates')); x.id = ref.id;
          if(x.ver){ x.ver.certId = ref.id; b.set(doc(db, 'certVerify', x.code), x.ver); }   // 규칙 v34 — 같은 묶음의 발급 기록과 짝
          b.set(ref, x.rec);
        });
        try{ await b.commit(); saved += part.length; }
        catch(e){ part.forEach(x => { x.id = ''; }); e.saved = saved; throw e; }
        if(list.length > PER && window.setLoadStep) window.setLoadStep(`일정 확인서를 발급하는 중… (${saved} / ${list.length}명)`, Math.round(saved / list.length * 100));
      }
      return saved;
    };
    let list = mk(false), noQR = false, partial = null;          // v154 진위 확인 QR 없이만
    try{ await commit(list); }
    catch(e){
      const denied = e && (e.code === 'permission-denied' || /permission|insufficient/i.test(e.message || ''));
      if(SC.qr && denied && !e.saved){
        list = mk(false); noQR = true;            // 보안 규칙 v34 를 아직 게시하지 않았으면 — QR 없이라도 발급은 된다
        try{ await commit(list); }
        catch(e2){ if(!e2.saved) throw e2; partial = e2; }
      } else if(e.saved){ partial = e; }
      else throw e;
    }
    const recs = list.filter(x => x.id).map(x => Object.assign({ id: x.id }, x.rec));
    recs.forEach(r => { if(!CERTS.find(c => c.id === r.id)) CERTS.unshift(r); });
    const got = new Set(recs.map(r => r.studentId));
    SC.result = { recs, noQR, partial: partial ? { saved: recs.length, total: tg.length, msg: partial.message || '', missing: tg.filter(s => !got.has(s.id)).map(s => s.name || '') } : null };
    SC.confirm = false;
    if(window.logActivity) logActivity('발급', '일정 확인서', `${SC.title.trim()} · ${recs.length === 1 ? recs[0].studentName : recs.length + '명'}`, recs.length === 1 ? recs[0].docNo : `${recs[0].docNo} ~ ${recs[recs.length - 1].docNo}`);
    if(partial) toast(`${tg.length}명 가운데 ${recs.length}명만 발급됐어요 — 아래 안내를 확인해 주세요`, 'err');
    else toast(noQR ? `발급 완료 — 진위 확인 QR 없이 (${recs.length}장)` : `발급 완료 (${recs.length === 1 ? recs[0].docNo : recs.length + '장'})`, noQR ? 'err' : 'ok');
    scDraw();
    setTimeout(() => $I('sc-result')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50);
  }catch(e){ toast('발급 실패: ' + (e.message || ''), 'err'); }
  finally{
    SC.busy = false; window.hideLoading && window.hideLoading();

// 학생+옵션 → rec 변환 후 렌더 (미리보기용)
/* ═══ 🎓 재학 사실 확인서 ═══
   반편성 이력(classes: year + grades[sid])에서 과정 구간을 스스로 계산합니다. */
function courseSegments(sid, startDs, endDs){
  /* 재학기간 전체를 학년으로 환산해 과정 구간을 만든다.
     반편성 원장에 남아 있는 해를 «기준점»으로 잡고, 없는 해는 학년을 ±1씩 되짚어 채운다.
     (학년도: 3월 시작 ~ 이듬해 2월) */
  const ay = ds => { if(!ds) return null; const y=Number(String(ds).slice(0,4)), m=Number(String(ds).slice(5,7));
    return (m>=3) ? y : y-1; };
  const startAY = ay(startDs), endAY = ay(endDs);
  if(startAY==null || endAY==null || endAY < startAY) return [];

  // ① 반편성 원장에서 «학년도 → 학년» 알아낸 것들
  const known = {};
  CLASSES.forEach(c=>{
    if(!(c.students||[]).includes(sid)) return;
    const g = parseInt((c.grades && c.grades[sid]) || c.grade || '', 10);
    const y = Number(c.year);
    if(!isNaN(g) && y) known[y] = g;
  });
  const anchors = Object.keys(known).map(Number).sort((x,z)=>x-z);
  if(!anchors.length) return [];

  // ② 재학 기간의 모든 학년도를 채운다 (아는 해는 그대로, 모르는 해는 기준점에서 환산)
  const gradeAt = y => {
    if(known[y] != null) return known[y];
    let best = anchors[0];
    anchors.forEach(a2=>{ if(Math.abs(a2-y) < Math.abs(best-y)) best = a2; });
    return known[best] + (y - best);
  };
  const rows = [];
  for(let y=startAY; y<=endAY; y++){
    const g = gradeAt(y);
    if(!(g>=1 && g<=12)) continue;                 // 환산이 범위를 벗어나면 건너뛴다
    rows.push({ y, g });
  }
  if(!rows.length) return [];

  // ③ 같은 과정끼리 이어 붙이기
  const segs = [];
  rows.forEach(r=>{
    const dept = gradeToDept(String(r.g));
    const last = segs[segs.length-1];
    if(last && last.dept===dept){ last.y2=r.y; last.g2=r.g; }
    else segs.push({ dept, y1:r.y, y2:r.y, g1:r.g, g2:r.g });
  });

  // ④ 실제 입학월·종료월을 양끝에 반영
  const mm = ds => String(ds).slice(5,7);
  return segs.map(s=>({
    dept: s.dept || '교육과정',
    course: deptCourse(s.dept),
    period: `${s.y1===startAY ? `${String(startDs).slice(0,4)}.${mm(startDs)}` : `${s.y1}.03`}`
          + ` ~ `
          + `${s.y2===endAY ? `${String(endDs).slice(0,4)}.${mm(endDs)}` : `${s.y2+1}.02`}`,
    grades: s.g1===s.g2 ? `${s.g1}학년` : `${s.g1} ~ ${s.g2}학년`
  }));
}
function periodText(a, b){
  if(!a || !b) return '';
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  let m = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(d2.getDate() < d1.getDate()) m--;
  const y=Math.floor(m/12), mo=m%12;
  return `${y?`${y}년 `:''}${mo?`${mo}개월`:(y?'':'1개월 미만')}`.trim();
}

async function doIssue(sid, mode){
  const s = STUDENTS.find(x=>x.id===sid);
  if(!s) return;
  const cfg = ORG_CONFIG[s.org];
  if(!cfg){ toast('이 기관은 증명서 발급을 지원하지 않습니다.','err'); return; }
  const FORMER = (mode==='former') || (CERT_MODE==='former');
  const issueDate = todayYMD();

  // 입력 필드에서 값 수집
  const newAddr = $I('pv-address')?.value.trim() || '';
  const newBirth = $I('pv-birth')?.value.trim() || '';
  const newAdmit = $I('pv-admitDate')?.value.trim() || '';
  const newEnd = $I('pv-endDate')?.value.trim() || '';

  // 필수 항목 검증
  const missing = [];
  if(!newAddr) missing.push('주소');
  if(!newBirth) missing.push('생년월일');
  if(FORMER){
    if(!newAdmit) missing.push('입학일');
    if(!newEnd) missing.push('종료일');
  } else if(cfg.layout==='grade' && !newAdmit) missing.push('입학일');
  if(FORMER && newAdmit && newEnd && newEnd < newAdmit){
    toast('종료일이 입학일보다 빠를 수 없습니다.','err'); return;
  }
  if(missing.length){
    toast(`${missing.join(', ')}을(를) 입력해주세요.`,'err');
    const km = missing[0]==='주소'?'address':missing[0]==='생년월일'?'birth':'admitDate';
    const first = $I('pv-'+km);
    if(first){ first.focus(); first.style.borderColor='#dc2626'; }
    return;
  }
  // 확인 체크 검증
  if(!$I('pv-confirm')?.checked){
    toast('내용 확인 후 "이상 없음"에 체크해주세요.','err');
    return;
  }

  try {
    // 바뀐/입력된 정보를 학생 정보에 반영
    const updates = {};
    if(newAddr !== (s.address||'')) updates.address = newAddr;
    if(newBirth !== (s.birth||'')) updates.birth = newBirth;
    if($I('pv-admitDate') && newAdmit !== (s.admitDate||'')) updates.admitDate = newAdmit;
    if(Object.keys(updates).length){
      await updateDoc(doc(db,'students',sid), updates); dropLists('students');
      Object.assign(s, updates);
    }

    // 문서번호: [코드]-C-YYMMDD-NN (그날+기관 발급 순번)
    const datePart = issueDate.slice(2).replace(/-/g,''); // YYMMDD
    const prefix = `${cfg.code}-C-${datePart}-`;
    const snap = await getDocs(query(collection(db,'certificates'), where('docNoDate','==',datePart), where('org','==',s.org)));
    const seq = snap.docs.filter(d => (d.data() || {}).kind !== 'schedule').length + 1;   // 📅 v139 일정 확인서(S 번호)는 따로 센다
    const docNo = prefix + pad(seq);

    const g = studentGrade(s.id);
    const dept = gradeToDept(g);
    if(FORMER){
      const f = (window.__readFormer ? window.__readFormer() : {admitType:'new', endType:'quit', endSchool:''});
      const segs = courseSegments(s.id, newAdmit, newEnd);
      const rec = {
        docNo, docNoDate: datePart, seq,
        kind: 'former', type: '재학사실', org: s.org,
        studentId: sid, studentName: s.name||'',
        grade: g||'', dept: dept||'',
        birth: newBirth, address: newAddr,
        admitDate: newAdmit, startDate: newAdmit, endDate: newEnd,
        admitType: f.admitType, endType: f.endType, endSchool: f.endSchool,
        segs, issueDate,
        issuedByUid: CU.uid, issuedByName: CU.name||'',
        createdAt: Timestamp.now()
      };
      await addDoc(collection(db,'certificates'), rec);
      closePreview();
      toast(`재학 사실 확인서 발급 완료 (${docNo})`,'ok');
      showTab('list');
      return;
    }
    const record = {
      docNo, docNoDate: datePart, seq,
      type: cfg.verb, org: s.org,
      studentId: sid, studentName: s.name||'',
      grade: g||'', dept: dept||'', course: deptCourse(dept),
      birth: s.birth||'', address: s.address||'', admitDate: s.admitDate||'',
      issueDate,
      issuedByUid: CU.uid, issuedByName: CU.name||'',
      createdAt: Timestamp.now()
    };
    if(cfg.layout==='age'){ record.ageText = `만 ${calcAge(s.birth, issueDate)}세`; }
    await addDoc(collection(db,'certificates'), record);
    closePreview();
    toast(`발급 완료 (${docNo})`,'ok');
    showTab('list');
  } catch(e){ toast('발급 실패: '+e.message,'err'); }
}

// ── 발급 목록 ──
let CERTS = [];
async function renderList(){
  const box = $I('tab-list');
  box.innerHTML = '<div class="acard"><p class="empty">불러오는 중...</p></div>';
  window.showLoading('발급 목록을 불러오는 중…');
  try {
    window.setLoadStep('증명서 대장 불러오는 중…', 45);
    const snap = await getDocs(collection(db,'certificates'));
    CERTS = []; snap.forEach(d=>CERTS.push({id:d.id, ...d.data()}));
    CERTS = CERTS.filter(c=>c.kind !== 'counter');     // 📅 v139 일정 확인서 번호 세는 칸
    const orgs = myOrgs();
    CERTS = CERTS.filter(c=>orgs.includes(c.org));
    /* 교직원 증명서(재직·경력)는 개인정보(생년월일·주소)가 담기니
       발급 범위와 같은 규칙으로만 보인다. 학생 재학증명서는 기관 기준 유지. */
    CERTS = CERTS.filter(c=>{
      if(c.kind!=='employ' && c.kind!=='career') return true;   // 재학증명서·재학사실확인서
      const s = STAFF_ALL.find(x=>x.uid===c.staffUid);
      if(s) return canIssueStaffCert(s);
      // 명부에서 지워진 분의 기록은 관리자만
      return ['super','org_admin'].includes(CU.role);
    });
    CERTS.sort((a,b)=>{
      const ta = a.createdAt?.seconds||0, tb=b.createdAt?.seconds||0;
      return tb-ta;
    });
    window.setLoadStep('정리하는 중…', 90);
  } catch(e){ window.hideLoading(); box.innerHTML = `<div class="acard"><p class="empty">불러올 수 없습니다: ${esc(e.message)}</p></div>`; return; }
  finally { window.hideLoading(); }
  drawCertList();
}
window.renderList = renderList;

/* 📅 v139 — 일정 확인서는 한꺼번에 발급한 것(같은 batchId)을 한 줄로 묶고, «한 장씩 보기»로 펼친다 */
const CG_OPEN = {};
const isSchedMgr = () => !!CU && (['super','org_admin'].includes(CU.role) || isCertIssuer());
function canRevokeSched(c){
  if(!CU || !c) return false;
  if(isSchedMgr()) return true;
  if(c.issuedByUid !== CU.uid) return false;
  return !c.revoked || !c.revokedByUid || c.revokedByUid === CU.uid;     // 관리자가 취소한 것은 관리자만 되돌림
}
function certItemHTML(c, sub){
  const sch = c.kind === 'schedule';
  const label = sch ? `${esc(c.cls||c.grade||'')}${(c.cls||c.grade)?' · ':''}📅 ${esc(c.title||'일정 확인서')}` : `${esc(c.grade||'')} · ${esc(c.type)}증명서`;
  return `
          <div class="citem${sub?' sub':''}${c.revoked?' revoked':''}">
            <div style="flex:1;min-width:180px">
              <div style="font-size:15px;font-weight:700;color:var(--gd)">${esc(c.studentName)} <span style="font-size:12px;color:var(--tl);font-weight:400">${label}</span>${c.revoked?'<span class="c-void">발급 취소</span>':''}</div>
              <div style="font-size:12px;color:var(--tl);margin-top:2px">${esc(c.docNo)} · 발급일 ${esc(c.issueDate)} · ${esc(c.issuedByName||'')}</div>
            </div>
            <button class="bm" onclick="previewCert('${c.id}')">미리보기</button>
            ${sch ? `<button class="bs" style="padding:8px 14px" onclick="pdfCert('${c.id}',1)">📄 PDF (직인 포함)</button>` : ''}
            <button class="bs" style="padding:8px 14px" onclick="pdfCert('${c.id}')">${sch?'🖨 인쇄용 (도장 없이)':'📄 PDF (도장 없이)'}</button>
            <button class="bs" style="padding:8px 14px" onclick="imageCert('${c.id}')">🖼️ 이미지 (${sch?'직인':'도장'} 포함)</button>
            ${sch && canRevokeSched(c) ? `<button class="bm${c.revoked?'':' danger'}" onclick="schedRevoke(['${c.id}'], ${c.revoked?'false':'true'})">${c.revoked?'↩ 취소 되돌리기':'발급 취소'}</button>` : ''}
            ${CU.role==='super' ? `<button class="bm" style="background:var(--danger-bg);color:var(--danger)" onclick="delCert('${c.id}')">삭제</button>` : ''}
          </div>`;
}
function certGroupHTML(list){
  const a = list[0], z = list[list.length-1], open = !!CG_OPEN[a.batchId];
  const nRev = list.filter(c=>c.revoked).length;
  const canAll = list.every(canRevokeSched);
  return `
          <div class="cgroup">
            <div class="citem">
              <div style="flex:1;min-width:200px">
                <div style="font-size:15px;font-weight:700;color:var(--gd)">📅 ${esc(a.title||'일정 확인서')} <span style="font-size:12px;color:var(--tl);font-weight:400">${a.batchLabel?esc(a.batchLabel)+' · ':''}${list.length}명</span>${nRev?`<span class="c-void">취소 ${nRev}장</span>`:''}</div>
                <div style="font-size:12px;color:var(--tl);margin-top:2px">${esc(a.docNo)} ~ ${esc(z.docNo)} · 발급일 ${esc(a.issueDate)} · ${esc(a.issuedByName||'')}</div>
              </div>
              <button class="bs" style="padding:8px 14px" onclick="pdfCertGroup('${a.batchId}',1)">📄 한 파일 PDF (직인 포함)</button>
              <button class="bs" style="padding:8px 14px" onclick="pdfCertGroup('${a.batchId}',0)">🖨 인쇄용 (도장 없이)</button>
              <button class="bm" onclick="toggleCertGroup('${a.batchId}')">${open?'접기 ▴':'한 장씩 보기 ▾'}</button>
              ${canAll && nRev < list.length ? `<button class="bm danger" onclick="schedRevokeGroup('${a.batchId}')">모두 발급 취소</button>` : ''}
            </div>
            ${open ? `<div class="cg-body">${list.map(c=>certItemHTML(c, true)).join('')}</div>` : ''}
          </div>`;
}
function drawCertList(){
  const box = $I('tab-list'); if(!box) return;
  const seen = new Set(), rows = [];
  CERTS.forEach(c=>{
    if(c.kind==='schedule' && c.batchId && (c.batchSize||0) > 1){
      if(seen.has(c.batchId)) return; seen.add(c.batchId);
      const list = CERTS.filter(x=>x.batchId===c.batchId).sort((x,y)=>(x.seq||0)-(y.seq||0));
      rows.push(list.length > 1 ? certGroupHTML(list) : certItemHTML(list[0]));
    } else rows.push(certItemHTML(c));
  });
  box.innerHTML = `
    <div class="acard">
      <h3 class="actitle">📋 발급 목록</h3>
      <p class="adesc">발급된 증명서 목록입니다. 학생 증명서 · 일정 확인서는 같은 기관 선생님이, 재직·경력증명서는 발급 권한이 있는 범위까지만 보입니다. <b>PDF (도장 없이)</b>는 출력용(인쇄 후 행정실에서 직인 날인), <b>이미지</b>는 도장이 포함되어 바로 사용할 수 있습니다. 📅 일정 확인서는 <b>PDF (직인 포함)</b>로 학부모에게 바로 보낼 수 있어요.</p>
      <div class="clist">
        ${rows.length ? rows.join('') : '<p class="empty">아직 발급된 증명서가 없습니다.</p>'}
      </div>
    </div>`;
}
window.toggleCertGroup = id => { CG_OPEN[id] = !CG_OPEN[id]; drawCertList(); };
window.pdfCertGroup = (id, stamp) => {
  const list = CERTS.filter(c=>c.batchId===id && !c.revoked).sort((x,y)=>(x.seq||0)-(y.seq||0));
  if(!list.length){ toast('받을 문서가 없어요 (모두 발급 취소됨).','err'); return; }
  return pdfCertMany(list, !!stamp);
};
/* 발급 취소 · 되돌리기 — 발급 기록에 표시 (v154 예전에 QR로 발급한 것은 진위 기록(certVerify)도 함께 · 안 되어도 취소는 됨) */
async function schedRevoke(ids, on){
  const list = ids.map(id=>CERTS.find(c=>c.id===id)).filter(c=>c && c.kind==='schedule' && canRevokeSched(c) && !!c.revoked !== !!on);
  if(!list.length) return;
  const one = list.length === 1;
  const msg = on
    ? (one ? `${list[0].studentName} — ${list[0].docNo}\n이 확인서를 «발급 취소»로 바꿀까요?\n\n다시 받으면 «발급 취소» 표시가 크게 찍혀요.`
           : `${list.length}장을 모두 «발급 취소»로 바꿀까요?\n\n다시 받으면 «발급 취소» 표시가 크게 찍혀요.`)
    : `«발급 취소»를 되돌릴까요?`;
  if(!confirm(msg)) return;
  let ok = 0, fail = 0;
  for(const c of list){
    try{
      if(c.verifyCode){ try{ await updateDoc(doc(db,'certVerify',c.verifyCode), { status: on ? 'revoked' : 'valid', revokedAt: Timestamp.now(), revokedByUid: CU.uid }); }catch(e){ console.warn('[발급 취소 · 예전 진위 기록]', c.docNo, e); } }
      await updateDoc(doc(db,'certificates',c.id), { revoked: !!on, revokedAt: Timestamp.now(), revokedByUid: CU.uid, revokedByName: CU.name||'' });
      c.revoked = !!on; ok++;
    }catch(e){ fail++; console.warn('[발급 취소]', c.docNo, e); }
  }
  if(ok && window.logActivity) logActivity(on ? '발급 취소' : '취소 되돌리기', '일정 확인서', one ? list[0].studentName : `${ok}장`, one ? list[0].docNo : '');
  toast(fail ? `${ok}장 처리 · ${fail}장 실패 (권한 · 연결을 확인해 주세요)` : (on ? `발급 취소했어요 (${ok}장)` : '되돌렸어요'), fail ? 'err' : 'ok');
  drawCertList();
}
window.schedRevoke = schedRevoke;
window.schedRevokeGroup = id => schedRevoke(CERTS.filter(c=>c.batchId===id && !c.revoked).map(c=>c.id), true);

// 발급 기록으로부터 증명서 HTML 재생성 (발급 당시 값 사용)
function buildCertFromRecord(c, opts){
  if(c.kind === 'schedule') return buildSchedCert(schedRecFromCert(c, opts));
  if(c.kind === 'employ' || c.kind === 'career'){
    return buildEmployCert({
      org: c.org, docNo: c.docNo, issueDate: c.issueDate, kind: c.kind,
      name: c.studentName, birth: c.birth, address: c.address,
      hireDate: c.hireDate, leaveDate: c.leaveDate, position: c.position,
      duty: c.duty, dutyShown: c.dutyShown, purpose: c.purpose,
      hideStamp: opts && opts.hideStamp
    });
  }
  if(c.kind === 'former'){
    return buildFormerCert({
      org: c.org, docNo: c.docNo, issueDate: c.issueDate,
      name: c.studentName, birth: c.birth, address: c.address,
      startDate: c.startDate || c.admitDate, endDate: c.endDate,
      admitType: c.admitType, endType: c.endType, endSchool: c.endSchool,
      segs: c.segs || [], hideStamp: opts && opts.hideStamp
    });
  }
  return buildCert({
    org: c.org, docNo: c.docNo, issueDate: c.issueDate,
    grade: c.grade, name: c.studentName, birth: c.birth,
    address: c.address, admitDate: c.admitDate,
    course: c.course || deptCourse(c.dept),
    ageText: c.ageText,
    hideStamp: opts && opts.hideStamp
  });
}

// 증명서를 A4 캔버스로 렌더 (공통) — hideStamp로 도장 유무
async function renderCertCanvas(c, hideStamp, quick, scale){
  if(!window.html2canvas){
    loadHtml2Canvas();
    // 5초까지 로딩을 기다렸다가 진행 — 버튼을 다시 누를 필요 없게
    await new Promise((res, rej)=>{
      let n = 0;
      const t = setInterval(()=>{
        if(window.html2canvas){ clearInterval(t); res(); }
        else if(++n > 50){ clearInterval(t); rej(new Error('이미지 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.')); }
      }, 100);
    });
  }
  const MM = 3.779527559;
  const W = Math.round(210 * MM);   // 794px
  const H = Math.round(297 * MM);   // 1123px
  const holder = document.createElement('div');
  holder.style.cssText = `position:fixed;left:-9999px;top:0;width:${W}px;height:${H}px;background:#ffffff;overflow:hidden;`;
  holder.innerHTML = buildCertFromRecord(c, {hideStamp});
  document.body.appendChild(holder);
  const sheet = holder.querySelector('.cert-sheet');
  if(sheet){ sheet.style.width = W+'px'; sheet.style.minHeight = H+'px'; sheet.style.height = H+'px'; sheet.style.margin = '0'; sheet.style.boxSizing='border-box'; }
  try {
    if(document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    await new Promise(r=>setTimeout(r, quick ? 80 : 400));
    // html2canvas는 옵션 문자열을 자체 파서로 읽어 var(--…)를 이해하지 못한다 → 실제 색으로 풀어 전달
    const rawBg = (ORG_CONFIG[c.org]?.theme?.bg) || '#ffffff';
    const bgFixed = (typeof rawBg === 'string' && rawBg.includes('var('))
      ? (getComputedStyle(document.documentElement).getPropertyValue((rawBg.match(/var\((--[^,)]+)/)||[])[1]||'').trim() || '#ffffff')
      : rawBg;
    const canvas = await window.html2canvas(sheet, {
      backgroundColor: bgFixed,
      width: W, height: H, windowWidth: W, windowHeight: H,
      scale: scale || 2, useCORS:true, logging:false
    });
    return canvas;
  } finally { holder.remove(); }
}

// 파일 이름 — 일정 확인서는 «일정확인서_제목_이름_문서번호» (나머지는 예전 그대로)
function certFileName(c, ext){
  if(c.kind === 'schedule'){
    const parts = ['일정확인서', c.title, c.studentName, c.docNo];
    try{ if(window.FN && FN.make) return FN.make(parts, { ext }); }catch(e){}
    return parts.filter(Boolean).join('_').replace(/[\\/:*?"<>|]/g, '') + ext;
  }
  return `${c.type}증명서_${c.studentName}_${c.docNo}${ext}`;
}
// PDF 저장 — 기본은 도장 없이(인쇄 후 행정실 직인 날인용) · stamp 면 직인 포함 (📅 일정 확인서)
async function pdfCert(id, stamp){
  const c = CERTS.find(x=>x.id===id); if(!c) return;
  return pdfCertMany([c], !!stamp);
}
/* 여러 장을 한 PDF 로 (📅 일정 확인서 묶음) — 한 장이면 예전 pdfCert 와 같다 */
async function pdfCertMany(list, stamp){
  list = (list||[]).filter(Boolean); if(!list.length) return;
  const many = list.length > 1;
  const tag = stamp ? '직인 포함' : '도장 없이';
  if(many){ window.showLoading && window.showLoading(`PDF를 만드는 중… (0 / ${list.length}장)`); }
  else toast('PDF를 만드는 중…');
  try {
    await ensureJsPDF();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    for(let i = 0; i < list.length; i++){
      if(many && window.setLoadStep) window.setLoadStep(`PDF를 만드는 중… (${i+1} / ${list.length}장)`, Math.round(i / list.length * 100));
      const canvas = await renderCertCanvas(list[i], !stamp, i > 0, many ? 1.5 : 2);
      const imgData = canvas.toDataURL('image/jpeg', many ? 0.88 : 0.95);
      canvas.width = canvas.height = 0;            // 메모리 바로 돌려주기 (여러 장일 때)
      if(i) pdf.addPage('a4', 'portrait');
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    }
    const c = list[0], z = list[list.length-1];
    let fname = certFileName(c, '.pdf');
    if(many){
      const parts = ['일정확인서', c.title, c.batchLabel || `${list.length}명`, `${c.docNo}~${String(z.docNo).split('-').pop()}`];
      try{ fname = (window.FN && FN.make) ? FN.make(parts, { ext:'.pdf' }) : parts.join('_') + '.pdf'; }catch(e){ fname = parts.join('_') + '.pdf'; }
    }
    if(many && window.hideLoading) window.hideLoading();
    // 아이패드·휴대폰: 공유 시트 ("파일에 저장" 선택) · 컴퓨터: 바로 내려받기
    let shared = false;
    if(isTouchDevice() && navigator.canShare){
      try {
        const file = new File([pdf.output('blob')], fname, {type:'application/pdf'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file]});
          shared = true;
        }
      } catch(e){ if(e && e.name==='AbortError'){ return; } }
    }
    if(!shared) pdf.save(fname);
    toast(shared ? `공유 시트에서 "파일에 저장"을 누르면 담깁니다. (${tag})` : `PDF를 저장했습니다. (${many ? list.length + '장 · ' : ''}${tag})`,'ok');
  } catch(e){ toast('PDF 저장 실패: '+(e.message||''),'err'); }
  finally { if(many && window.hideLoading) window.hideLoading(); }
}
window.pdfCert = pdfCert;
window.pdfCertMany = pdfCertMany;

/* ── 기기별 저장 방법 ──
   · 아이패드·아이폰·휴대폰(터치 기기): 공유 시트를 띄운다 → "이미지 저장"을 누르면 사진 앱에 담긴다.
     (예전 방식(데이터 주소 + download 속성)은 아이패드 사파리가 무시해서 아무 일도 안 일어났다)
   · 컴퓨터: 파일로 바로 내려받는다.
   · 공유 시트가 없는 옛 기기: 이미지를 화면에 띄우고 길게 눌러 저장하도록 안내한다. */
const isTouchDevice = () => (navigator.maxTouchPoints||0) > 0 || 'ontouchstart' in window;

async function saveCanvasImage(canvas, filename){
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  if(!blob) throw new Error('이미지 생성에 실패했습니다.');
  // ① 터치 기기: 공유 시트 (사진 앱 저장·카톡 전송 등)
  if(isTouchDevice() && navigator.canShare){
    try {
      const file = new File([blob], filename, {type:'image/png'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return 'share';
      }
    } catch(e){
      if(e && e.name === 'AbortError') return 'cancel';   // 사용자가 시트를 닫음 — 오류 아님
      /* 공유 실패 시 아래 방법으로 이어간다 */
    }
  }
  // ② 컴퓨터: 바로 내려받기
  if(!isTouchDevice()){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    return 'download';
  }
  // ③ 옛 터치 기기: 길게 눌러 저장
  showImageSaveModal(URL.createObjectURL(blob), filename);
  return 'modal';
}

function showImageSaveModal(url, filename){
  document.getElementById('imgsave-mod')?.remove();
  const el = document.createElement('div'); el.id = 'imgsave-mod'; el.className='mov';
  el.innerHTML = `
    <div class="mbk" onclick="document.getElementById('imgsave-mod').remove()"></div>
    <div class="mbox" style="max-width:560px">
      <div class="mtitle">🖼️ 이미지 저장</div>
      <div class="msub">아래 이미지를 <b>길게 눌러</b> "사진에 추가" 또는 "이미지 저장"을 선택하세요.</div>
      <div style="max-height:60vh;overflow:auto;border:1px solid var(--ivd);border-radius:10px;background:var(--iv);padding:8px;text-align:center">
        <img src="${url}" alt="${esc(filename)}" style="max-width:100%;height:auto;border-radius:6px">
      </div>
      <div class="mact"><button class="bs" onclick="document.getElementById('imgsave-mod').remove()">닫기</button></div>
    </div>`;
  document.body.appendChild(el);
}

// 이미지 저장 (도장 포함) — 바로 사용
async function imageCert(id){
  const c = CERTS.find(x=>x.id===id); if(!c) return;
  return imageCertRec(c);
}
async function imageCertRec(c){
  if(!c) return;
  toast('이미지를 만드는 중…');
  try {
    const canvas = await renderCertCanvas(c, false); // 도장 포함
    const how = await saveCanvasImage(canvas, certFileName(c, '.png'));
    if(how==='share') toast('공유 시트에서 "이미지 저장"을 누르면 사진에 담깁니다.','ok');
    else if(how==='download') toast('이미지를 저장했습니다. (도장 포함)','ok');
    else if(how==='modal') toast('이미지를 길게 눌러 저장하세요.','ok');
  } catch(e){ toast('이미지 저장 실패: '+(e.message||''),'err'); }
}
window.imageCert = imageCert;
window.imageCertRec = imageCertRec;

function loadHtml2Canvas(){
  if(window.html2canvas || document.getElementById('h2c-script')) return;
  const sc = document.createElement('script');
  sc.id='h2c-script';
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  document.head.appendChild(sc);
}
loadHtml2Canvas();

// jsPDF 동적 로드
function ensureJsPDF(){
  return new Promise((resolve, reject)=>{
    if(window.jspdf && window.jspdf.jsPDF) return resolve();
    let sc = document.getElementById('jspdf-script');
    if(sc){
      // 로딩 중이면 대기
      const chk = setInterval(()=>{ if(window.jspdf&&window.jspdf.jsPDF){ clearInterval(chk); resolve(); } }, 100);
      setTimeout(()=>{ clearInterval(chk); if(!(window.jspdf&&window.jspdf.jsPDF)) reject(new Error('PDF 모듈 로드 실패')); }, 8000);
      return;
    }
    sc = document.createElement('script');
    sc.id = 'jspdf-script';
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = ()=> resolve();
    sc.onerror = ()=> reject(new Error('PDF 모듈을 불러올 수 없습니다.'));
    document.head.appendChild(sc);
  });
}

async function delCert(id){
  if(CU.role!=='super'){ toast('슈퍼관리자만 삭제할 수 있습니다.','err'); return; }
  const c = CERTS.find(x=>x.id===id); if(!c) return;
  const sch = c.kind === 'schedule';
  if(!confirm(`${c.studentName} 학생의 ${sch ? '일정 확인서' : '증명서'}(${c.docNo})를 발급 목록에서 삭제할까요?`)) return;
  try {
    if(sch && c.verifyCode){
      try{ await deleteDoc(doc(db,'certVerify',c.verifyCode)); }
      catch(e){ toast('진위 확인 기록을 지우지 못해 삭제를 멈췄어요: ' + (e.message||''), 'err'); return; }
    }
    await deleteDoc(doc(db,'certificates',id));
    toast('삭제했습니다.');
    renderList();
  } catch(e){ toast('삭제 실패: '+e.message,'err'); }
}
window.delCert = delCert;
