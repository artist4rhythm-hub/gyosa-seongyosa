<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아리 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
.cb-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cb-top select{padding:9px 12px;border:1.5px solid var(--ivd);border-radius:10px;font-size:14px;font-weight:800;font-family:inherit;background:var(--wh,#fff)}
.cb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cb-tabs button{border:1.5px solid var(--ivd);background:var(--wh,#fff);border-radius:100px;padding:8px 15px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ts)}
.cb-tabs button.on{background:var(--gd);border-color:var(--gd);color:#fff}
.card{background:var(--wh,#fff);border:1px solid var(--ivd);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:14.5px;font-weight:900;color:var(--gd);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.f label{display:block;font-size:11.5px;font-weight:800;color:var(--ts);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1.5px solid var(--ivd);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--wh,#fff)}
.f textarea{min-height:80px;resize:vertical}
.pill{display:inline-block;border-radius:100px;padding:3px 10px;font-size:10.5px;font-weight:800}
.st-draft{background:#F1F0EC;color:#6B7280}.st-recruiting{background:#DBEAFE;color:#1D4ED8}.st-enrolling{background:#FEF3C7;color:#B45309}
.st-lottery{background:#EDE9FE;color:#6D28D9}.st-confirmed{background:#DCFCE7;color:#15803D}.st-running{background:#CCFBF1;color:#0F766E}
.st-settling{background:#FDE68A;color:#92400E}.st-locked{background:#E5E7EB;color:#374151}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ivd);border-radius:100px;padding:4px 10px;font-size:12px;background:var(--wh,#fff)}
.chip b{color:var(--gd)}
.chip button{border:none;background:none;cursor:pointer;color:var(--tl);font-size:13px;padding:0 2px}
.ap{border:1px solid var(--ivd);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--wh,#fff)}
.ap .t{font-size:14.5px;font-weight:900}
.ap .m{font-size:12px;color:var(--ts);margin-top:3px}
.ap .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.ap .act select{padding:6px 9px;border:1px solid var(--ivd);border-radius:8px;font-size:12px;font-family:inherit}
.tgrid{display:grid;grid-template-columns:52px repeat(5,1fr);gap:2px;font-size:11px}
.tgrid .h{background:var(--gd);color:#fff;text-align:center;padding:6px 0;border-radius:6px;font-weight:800}
.tgrid .tm{color:var(--tl);text-align:right;padding-right:4px;line-height:22px}
.tgrid .cell{position:relative;background:var(--iv);border-radius:4px;min-height:22px}
.blk.v{writing-mode:vertical-rl;text-orientation:upright;font-size:11.5px;letter-spacing:.08em;line-height:1.15;padding:7px 3px}
.blk.v .bg{font-size:9px;font-weight:700;opacity:.85;margin-top:6px;letter-spacing:0}
.blk{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 5px;font-size:10.5px;font-weight:800;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}
.alert{display:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.alert.ok{display:block;background:#DCFCE7;color:#16A34A}.alert.err{display:block;background:#FDECEA;color:#C0392B}
.set2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:860px){.set2{grid-template-columns:minmax(0,1fr)}}
.chipbtn{border:1.5px solid var(--ivd);background:var(--wh,#fff);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ts)}
.chipbtn.on{background:var(--gd);border-color:var(--gd);color:#fff}
.tl{margin:10px 0 6px;height:26px;border-radius:100px;background:var(--iv);position:relative;overflow:hidden}
.tl .bar{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#1E3932,#2F6FD0);border-radius:100px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.fee2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feebox{border:1px solid var(--ivd);border-radius:12px;padding:11px 13px;background:var(--gp)}
.feebox.joy{background:#F3EEFF;border-color:#DDD3F5}
.feebox .ft{font-size:13px;font-weight:900;color:var(--gd);margin-bottom:6px}
.fx{margin-top:7px;font-size:11.5px;color:var(--ts);line-height:1.7}
.roomchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ivd);border-radius:100px;padding:6px 6px 6px 13px;font-size:12.5px;font-weight:800;cursor:pointer;background:var(--wh,#fff);color:var(--ts)}
.roomchip.on{background:var(--gd);border-color:var(--gd);color:#fff}
.roomchip .x{border:none;background:rgba(0,0,0,.08);border-radius:100px;width:20px;height:20px;cursor:pointer;font-size:11px;color:inherit}
.q-row{display:grid;grid-template-columns:1fr 110px 90px 110px auto;gap:6px;align-items:center;margin-bottom:6px}
.q-row input,.q-row select{padding:7px 9px;border:1px solid var(--ivd);border-radius:8px;font-size:12.5px;font-family:inherit}
.small{font-size:11.5px;color:var(--tl)}
.pmodal .pinfo{display:grid;grid-template-columns:112px 1fr;gap:0;border:1px solid var(--ivd);border-radius:12px;overflow:hidden;margin-top:14px}
.pmodal .pinfo>div{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--iv)}
.pmodal .pinfo>div:nth-child(odd){background:var(--gp);font-weight:800;color:var(--gd);font-size:12px}
.pmodal .pinfo>div:nth-last-child(-n+2){border-bottom:none}
.pmodal .qa{border:1px solid var(--ivd);border-radius:12px;padding:12px 14px;margin-top:10px}
.pmodal .qa .qt{font-size:12.5px;font-weight:900;color:var(--gd);margin-bottom:6px}
.pmodal .qa .qb{font-size:13px;line-height:1.75;white-space:pre-wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--wh,#fff);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
.cal2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:860px){.cal2{grid-template-columns:minmax(0,1fr)}}
.cal{border:1px solid var(--ivd);border-radius:12px;padding:10px;background:var(--wh,#fff);min-width:0}
.cg{min-width:0}
.cg .d{min-width:0;overflow:hidden}
.cg .d .lb{display:block;margin-top:2px;font-size:10px;color:#1D4ED8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ttl{font-size:13px;font-weight:900;color:var(--gd);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .wd{text-align:center;font-size:10.5px;color:var(--tl);padding:2px 0}
.cg .d{min-height:58px;border:1px solid var(--iv);border-radius:7px;padding:3px 4px;font-size:10.5px;background:var(--wh,#fff);position:relative}
.cg .d .n{font-size:11px;font-weight:800;color:var(--ts)}
.cg .d.out{opacity:.25}
.cg .d.we{background:#FAFAF8}.cg .d.we .n{color:#B8B4AA}
.cg .d .ev{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;background:#EEF4FF;color:#1D4ED8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cg .d .ev.hol{background:#FEF2F2;color:#B91C1C}
.cg .d.pick{cursor:pointer}
.cg .d.pick:hover{border-color:var(--gd)}
.cg .d.blk{background:#FEF2F2;border-color:#FCA5A5}
.cg .d.blk .n{color:#B91C1C}
.cg .d .rs{display:block;margin-top:2px;font-size:10px;color:#B91C1C;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg .d.has:not(.blk){border-color:#93C5FD}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{background:var(--gp);color:var(--gd);padding:7px 8px;text-align:left;border-bottom:1px solid var(--ivd)}
table.tb td{padding:7px 8px;border-bottom:1px solid var(--iv);vertical-align:top}
tr.blocked td{color:#B91C1C;background:#FEF2F2}

/* ── 👑 관리자 지정: 서랍식 목록 ── */
#mgr-list{display:block;width:100%}
.mgr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.drw{border:1px solid var(--ivd,#DFE7E1);border-radius:12px;background:var(--wh,#fff);margin-bottom:8px;overflow:hidden}
.drw>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:13px}
.drw>summary::-webkit-details-marker{display:none}
.drw>summary b{font-weight:900}
.drw>summary em{font-style:normal;font-size:11.5px;color:var(--tw,#7C8A80);font-weight:700;margin-left:auto}
.drw>summary::after{content:'▾';color:var(--tw,#7C8A80);transition:transform .15s}
.drw[open]>summary::after{transform:rotate(180deg)}
.drw-body{display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px 12px}
.mchip{border:1.5px solid var(--ivd,#DFE7E1);background:var(--wh,#fff);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ts,#3F4A44)}
.mchip i{font-style:normal;font-size:10.5px;color:var(--tw,#8A968E);margin-left:5px;font-weight:700}
.mchip.on{background:#1E3932;border-color:#1E3932;color:#fff}
.mchip.on i{color:#CFE0D6}
.drw-body.tblwrap{display:block;padding:4px 12px 12px}
.drw:not([open])>.drw-body{display:none}
.drw[open]>.drw-body.tblwrap{display:block}
.dsum .dcnt{margin-left:auto}
.drw-foot{display:flex;justify-content:flex-end;padding:9px 12px 12px;border-top:1px dashed var(--iv,#EDEBE4)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#15803D}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px #DCFCE7}
.dsum{gap:8px}
.dsum .dt{font-size:14px;font-weight:900;color:var(--gd,#1E3932)}
.dsum .dm{font-size:11.5px;color:var(--tw,#7C8A80);font-weight:700}
.dsum .dcnt{font-size:11.5px;color:var(--ts,#3F4A44);font-weight:700}
.dsum .dcnt b{font-weight:900;color:var(--gd,#1E3932)}
.dstop{margin-left:auto;font-size:11.5px;color:var(--tw,#7C8A80);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.drw{position:relative;isolation:isolate}
.drw .tb{width:100%}
.drw .tb th{position:static;white-space:nowrap}
.rm2{font-style:normal;cursor:pointer;font-size:11px;opacity:.5;margin-left:2px}.rm2:hover{opacity:1}
</style>
</head>
<body>
<div id="ls" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--iv,#F5F3EC);align-items:center;justify-content:center">
  <div style="background:var(--wh,#fff);border:1px solid var(--ivd);border-radius:16px;padding:28px;max-width:340px;width:92%">
    <div style="font-size:17px;font-weight:900;color:var(--gd);margin-bottom:6px">🎨 동아리</div>
    <div style="font-size:12.5px;color:var(--ts);margin-bottom:10px">교사 선교사 계정으로 로그인해 주세요.</div>
    <div id="l-who" style="display:none;background:#FEF3C7;color:#92400E;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.6;margin-bottom:12px"></div>
    <label style="font-size:12px;font-weight:700">아이디</label>
    <input type="text" id="l-id" style="width:100%;margin:4px 0 10px;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-family:inherit">
    <label style="font-size:12px;font-weight:700">비밀번호</label>
    <input type="password" id="l-pw" style="width:100%;margin:4px 0 14px;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-family:inherit">
    <button class="bp" style="width:100%" onclick="doLogin()">로그인</button>
    <div class="alert" id="l-msg"></div>
  </div>
</div>

<div id="ms" style="display:none">
  <div id="ms-wrap" style="max-width:1080px;margin:0 auto;padding:4px 4px 40px;transition:max-width .2s">
    <div style="font-size:19px;font-weight:900;color:var(--gd);margin:4px 0 4px">🎨 방과후 동아리 · 조이클래스</div>
    <p style="font-size:12.5px;color:var(--ts);margin:0 0 12px;line-height:1.6">
      학기 하나 = 책 한 권. 학기를 열고 → 강사 모집 링크로 개설 신청을 받고 → 취합해 공고합니다.</p>

    <div class="cb-top">
      <select id="sem-sel" onchange="pickSem(this.value)"></select>
      <button class="bs" onclick="newSem()">＋ 새 학기</button>
      <span id="sem-status"></span>
      <span style="margin-left:auto" id="sem-flow"></span>
      <span style="display:flex;gap:4px;align-items:center;font-size:11px;color:var(--tl)">폭
        <button class="bs" style="padding:5px 10px;font-size:11px" onclick="admW(1080)">보통</button>
        <button class="bs" style="padding:5px 10px;font-size:11px" onclick="admW(1400)">넓게</button>
        <button class="bs" style="padding:5px 10px;font-size:11px" onclick="admW(0)">전체</button></span>
    </div>

    <div class="cb-tabs" id="tabs">
      <button class="on" onclick="showTab('set')">⚙️ 학기 설정</button>
      <button onclick="showTab('block')">🚫 학사 휴강</button>
      <button onclick="showTab('q')">📝 질문 양식</button>
      <button onclick="showTab('link')">🔗 모집 링크</button>
      <button onclick="showTab('apps')">📥 신청 취합</button>
      <button onclick="showTab('grid')">🗓 요일·시간 그리드</button>
      <button onclick="showTab('enroll')">👨‍👩‍👧 신청 현황·배정</button>
    </div>

    <div id="body"><div class="small">학기를 선택하거나 새로 만드세요.</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, deleteField, collection, getDocs, query, where, onSnapshot, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const $I = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const STATUS = { draft:'초안', recruiting:'강사 모집중', planning:'계획서 제출중', enrolling:'학부모 신청중', adjusting:'순위 조정·최종 결정', confirmed:'확정', running:'운영중', settling:'정산', locked:'잠금' };
const FLOW = ['draft','recruiting','planning','enrolling','adjusting','confirmed','running','settling','locked'];
/* 일정표 기본 항목 — role은 시스템이 의미를 아는 꼬리표(강사 포털·학부모 화면이 참조), label은 자유 */
const MS_ROLES = { recruitStart:'강사 모집 시작', recruitEnd:'강사 모집 마감', planEnd:'활동 계획서 제출 마감', notice:'동아리 신청 공고',
  enrollStart:'학부모 신청 시작', enrollEnd:'학부모 신청 마감', adjust:'1·2·3순위 조정', final:'최종 결정', custom:'(기타)' };
function defaultMilestones(){ return ['recruitStart','recruitEnd','planEnd','notice','enrollStart','enrollEnd','adjust','final']
  .map((r,i)=>({ id:'m'+i, role:r, label:MS_ROLES[r], at:'' })); }
function ms(role){ return (SEM?.milestones||[]).find(m=>m.role===role) || null; }
const WD = ['일','월','화','수','목','금','토'];
const PORTAL = 'https://artist4rhythm-hub.github.io/daniel-parents/club.html';

let CU=null, SEMS=[], SEM=null, APPS=[], TAB='set', CLUB_MGRS=[], STAFF_ALL=null, VIEW_ONLY=false, UNSUBS=[], SHOW_TRASH=false;
const LIVE = ()=> APPS.filter(a=>!a.deleted);
const TRASH = ()=> APPS.filter(a=>a.deleted);
const UNIFIED_POS = ['교장','교감','행정실장'];
function myOrgs(){ if(!CU) return []; if(CU.role==='super'||UNIFIED_POS.includes(CU.position||'')) return ['daniel','jihyebit']; return (CU.orgs&&CU.orgs.length)?CU.orgs:[CU.org]; }
const toast = (t)=>{ const el=document.createElement('div'); el.textContent=t; el.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1E3932;color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;z-index:9999'; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); };

window.admW = (w)=>{ const el=$I('ms-wrap'); if(!el) return; el.style.maxWidth = w? w+'px':'98%'; try{ localStorage.setItem('clubadm_w', String(w)); }catch(e){} };
setTimeout(()=>{ const w = Number(localStorage.getItem('clubadm_w')||1080); window.admW(w); }, 0);
function korEmail(id){ return `${id}@gyosa-seongyosa.staff`; }
window.doLogin = async function(){
  const id=$I('l-id').value.trim(), pw=$I('l-pw').value, m=$I('l-msg'); m.className='alert';
  try{ await signInWithEmailAndPassword(auth, korEmail(id), pw); }
  catch(e){ m.className='alert err'; m.textContent='로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
onAuthStateChanged(auth, async user=>{
  if(!user){ window.hideLoading&&hideLoading(); $I('ls').style.display='flex'; $I('ms').style.display='none'; return; }
  const st = await getDoc(doc(db,'staff',user.uid));
  if(!st.exists()){
    const who = $I('l-who');
    who.style.display='block';
    who.innerHTML = `지금 이 브라우저는 <b>강사 포털 계정</b>(${esc(user.email||'이메일 계정')})으로 로그인되어 있어요.<br>
      같은 브라우저의 로그인 자리는 하나라, 아래에서 교사 계정으로 로그인하면 강사 쪽은 로그아웃됩니다.<br>
      <span style="font-weight:800">💡 강사·학부모 테스트는 시크릿 창(또는 다른 브라우저)에서 하시면 교사 세션이 안 밀려요.</span>`;
    $I('ls').style.display='flex'; $I('ms').style.display='none';
    window.hideLoading&&hideLoading();
    return;
  }
  CU = { uid:user.uid, ...st.data() };
  window.ORGS = ORGS;
  if(window.renderShell) renderShell('club', CU);
  // 🔐 접근: 수퍼관리자 + 지정된 동아리 관리자만

async function buildRosters(){
  // ✅ 확정 시: 배정+참여확정 학생 명단을 각 신청서에 박제 — 강사가 출석 화면에서 자기 문서로 읽는다
  const snap = await getDocs(query(collection(db,'clubEnrollments'), where('semId','==',SEM.id)));
  const es = snap.docs.map(d=>({id:d.id, ...d.data()}));
  const clubs = LIVE().filter(a=>a.status==='approved' && a.published && !a.cancelled);
  let n = 0;
  for(const c of clubs){
    const roster = es.filter(e=> [...r1LiveSet(e)].includes(c.id) || (e.result2||[]).some(r=>r.clubId===c.id && r.state==='assigned'))
      .map(e=>({ studentId:e.studentId, studentName:e.studentName||'', className:e.className||'', grade:e.grade||'' }))
      .sort((a,b)=>String(a.studentName).localeCompare(String(b.studentName),'ko'));
    try{ await updateDoc(doc(db,'clubApplications',c.id), { roster, rosterAt:Timestamp.now() });
      const local = APPS.find(x=>x.id===c.id); if(local){ local.roster = roster; }
      n++; }catch(e){}
  }
  toast(`배정 명단을 ${n}개 동아리에 박제했습니다 ✓ (강사 출석 화면에 반영)`);
}

let CAL_YM = null, AC = null;   // 보고 있는 달, 학사 데이터 캐시 {events:[], holidays:[]}
async function loadAcademic(){
  if(AC) return AC;
  const [ev, ho] = await Promise.all([getDocs(collection(db,'academicEvents')), getDocs(collection(db,'holidays'))]);
  const events = ev.docs.map(d=>({id:d.id, ...d.data()})).filter(e=>e.startDate&&e.endDate)
    .filter(e=>{ const os = Array.isArray(e.orgs)&&e.orgs.length ? e.orgs : [e.org||'daniel']; return os.includes(SEM.org)||os.includes('all')||e.org==='both'; });
  const holidays = ho.docs.map(d=>d.data()).filter(h=>h.date && ((h.org||'all')==='all'||h.org===SEM.org) && (h.who||'all')!=='staff');
  AC = { events, holidays }; return AC;
}
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayItems(ds){
  const out = [], seen = new Set();
  const push = (t,hol)=>{ const k=String(t).replace(/\s+/g,''); if(seen.has(k)) return; seen.add(k); out.push({t,hol}); };
  AC.holidays.filter(h=>h.date===ds).forEach(h=>push(h.name||'공휴일', true));
  AC.events.filter(e=>ds>=e.startDate && ds<=e.endDate).forEach(e=>push(e.title||'행사', false));
  return out;
}

function overlap(a,b){ // 두 동아리 시간 겹침 — 요일 교집합(숫자 정규화)이 있을 때만 시간 비교
  const nA=(a.weekdays||[]).map(Number), nB=(b.weekdays||[]).map(Number);
  if(!nA.some(w=>Number.isInteger(w)&&nB.includes(w))) return false;
  const a0=toMin(a.start), a1=a0+(Number(a.durMin)||0), b0=toMin(b.start), b1=b0+(Number(b.durMin)||0);
  return a0<b1 && b0<a1;
}
function clubStat(c){
  const picks = ENR.filter(e=>(e.picks||[]).some(p=>p.clubId===c.id));
  const first = picks.filter(e=>(e.picks||[]).find(p=>p.clubId===c.id).rank===1);
  const byRank = {1:0,2:0,3:0};
  picks.forEach(e=>{ const r=(e.picks||[]).find(p=>p.clubId===c.id).rank; byRank[r]=(byRank[r]||0)+1; });
  const assigned = ENR.filter(e=>(e.result||[]).some(r=>r.clubId===c.id && r.state==='assigned'));
  const st = c.cancelled ? 'cancelled' : first.length > (c.maxN||0) ? 'over' : first.length < (c.minN||0) ? 'under' : 'ok';
  return { picks, first, assigned, st, byRank };
}

window.autoAssign2 = async ()=>{
  await snapEnr('2차 자동 배정 전');
  const clubs = LIVE().filter(a=>a.status==='approved' && a.published);
  const byId = {}; clubs.forEach(c=>byId[c.id]=c);
  const cap = {}, lim = {}, closedM = {}, waitClub = {};
  clubs.forEach(c=>{
    const base = Math.max(0, (c.r1Conf!=null ? Number(c.r1Conf) : confirmedN(c.id)) - cancelsOf(c.id));   // 🙅 취소 반영
    cap[c.id]=base; lim[c.id]=Number(c.maxN)||999;
    closedM[c.id] = !!c.r2Closed || !c.r2Open || !!c.cancelled || (lim[c.id]-base)<=0;
    waitClub[c.id] = !c.cancelled && !c.r2Open && (lim[c.id]-base)>0;               // ⏳ 취소로 자리 난 완료 동아리
  });
  const firstOf = e => [...r1LiveSet(e)].map(id=>byId[id]).filter(Boolean);
  const res = {}; ENR.forEach(e=>res[e.id]=[]);
  const tryAssign = (e, c)=>{
    const mine = [...firstOf(e), ...res[e.id].filter(r=>r.state==='assigned').map(r=>byId[r.clubId])];
    if(mine.some(m=>overlap(m,c))){ res[e.id].push({clubId:c.id, state:'overlap'}); return; }
    if(cap[c.id] >= lim[c.id]){ res[e.id].push({clubId:c.id, state:'full'}); return; }
    cap[c.id]++; res[e.id].push({clubId:c.id, state:'assigned', ...(histOf(e,c.id)?{hist:true}:{})});
  };
  // ⏳ 대기 — 취소로 자리 난 «모집 완료» 동아리: 대기 학생끼리 제비뽑기 (당첨 = 즉시 확정)
  for(const c of clubs){
    if(!waitClub[c.id]) continue;
    const ws = ENR.filter(e=>(e.waits2||[]).includes(c.id) && ![...r1LiveSet(e)].includes(c.id));
    if(!ws.length) continue;
    const seats = lim[c.id] - cap[c.id];
    if(ws.length > seats) ws.forEach(e=> (e.lottery2||{})[c.id] ? tryAssign(e,c) : res[e.id].push({clubId:c.id, state:'lost', wait:true}));
    else ws.forEach(e=> tryAssign(e,c));
  }
  for(const c of clubs){
    const q1 = ENR.filter(e=>slotPicks(e).some(p=>p.clubId===c.id && p.rank===1));
    if(!q1.length) continue;
    if(closedM[c.id]){ q1.forEach(e=>res[e.id].push({clubId:c.id, state:'closed'})); continue; }
    const seats = lim[c.id] - cap[c.id];
    if(q1.length > seats) q1.forEach(e=> (e.lottery2||{})[c.id] ? tryAssign(e,c) : res[e.id].push({clubId:c.id, state:'lost'}));
    else q1.forEach(e=> tryAssign(e,c));
  }
  // 2순위 — 이 층도 초과 시 «제비뽑기» (체크된 학생만 배정)
  const laddQ = {};
  const alive = e => { const p1 = slotPicks(e).filter(p=>p.rank===1);
    return p1.length===0 || p1.some(p=>{ const r = res[e.id].find(x=>x.clubId===p.clubId); return !r || r.state!=='assigned'; }); };
  for(const e of ENR) if(alive(e)) slotPicks(e).filter(p=>p.rank===2).forEach(p=>{ laddQ[p.clubId]=(laddQ[p.clubId]||0)+1; });
  for(const e of ENR){
    const pks2 = slotPicks(e).filter(p=>p.rank===2);
    if(!pks2.length) continue;
    let stop = !alive(e);
    for(const pk of pks2){
      const c = byId[pk.clubId]; if(!c) continue;
      if(res[e.id].some(r=>r.clubId===c.id)) continue;
      if(stop){ res[e.id].push({clubId:c.id, state:'skipped'}); continue; }
      if(closedM[c.id]){ res[e.id].push({clubId:c.id, state:'closed'}); continue; }
      const need = (laddQ[c.id]||0) > (lim[c.id] - cap[c.id]);
      if(need && !(e.lottery2||{})[c.id]){ res[e.id].push({clubId:c.id, state:'lost'}); continue; }
      const before = cap[c.id];
      tryAssign(e, c);
      if(cap[c.id] > before) stop = true;
    }
  }
  let n=0;
  for(const e of ENR){ if(!slotPicks(e).length) continue;
    await updateDoc(doc(db,'clubEnrollments',e.id), { result2: res[e.id], assigned2At: Timestamp.now() }); e.result2 = res[e.id]; n++; }
  clubLog('2차 배정 실행', `${n}건 저장`);
  toast(`🎯 2차 배정 ${n}건 저장 — 초과는 제비뽑기 반영 · 배정 = 즉시 확정`); renderEnroll();
};
window.openR2 = ()=>{
  if(!SEM.r1Done){ toast('먼저 ✅ 1차 확정·기록 저장을 진행해 주세요','err'); return; }
  const clubs = LIVE().filter(a=>a.status==='approved' && a.published && !a.cancelled);
  const opens = clubs.map(c=>({c, left:(c.r1Left!=null?Number(c.r1Left):leftOf(c))})).filter(x=>x.left>0 && x.c.r1Class!=='full');
  const def = SEM.r2CloseAt || '';
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal" style="max-width:470px"><h3 style="margin:0 0 8px">🎯 추가 모집 열기</h3>
    <div class="small" style="line-height:1.85">빈자리 동아리 <b>${opens.length}개</b>가 열립니다 (꽉 찬 동아리는 「모집 완료」로 잠김).<br>
      학부모는 <b>1·2순위만</b> 신청하고, 1차 확정과 겹치는 시간은 선택이 막힙니다.<br>
      각 동아리 「잔여 N자리」는 지금 시점(정원 − 1차 확정)으로 안내됩니다.</div>
    <div class="small" style="margin:10px 0 4px;font-weight:800">추가 모집 마감 일시</div>
    <input type="datetime-local" id="r2at" value="${def}" style="width:100%;height:38px;border:1.5px solid var(--ivd,#E3E1DA);border-radius:10px;padding:0 10px;font-family:inherit">
    <div class="row" style="justify-content:flex-end;margin-top:14px;gap:8px">
      <button class="bs" onclick="this.closest('.modal-bg').remove()">취소</button>
      <button class="bp" style="background:#B45309;border-color:#B45309" onclick="doOpenR2(); this.closest('.modal-bg').remove()">🎯 추가 모집 열기</button></div></div>`;
  document.body.appendChild(bg);
};
window.doOpenR2 = async ()=>{
  const at = ($I('r2at')||{}).value || '';
  await snapSems('추가 모집 열기 전'); await snapEnr('추가 모집 열기 전');
  const clubs = LIVE().filter(a=>a.status==='approved' && a.published);
  for(const c of clubs){ const left = (c.r1Left!=null ? Number(c.r1Left) : leftOf(c));
    await setApp(c.id, { r2Open: left>0 && !c.cancelled && c.r1Class!=='full', r2Left: left, r2Closed:false }); }
  await updateDoc(doc(db,'clubSemesters',SEM.id), { round:2, r2CloseAt:at, status:'enrolling', statusAt:Timestamp.now() });
  Object.assign(SEM, { round:2, r2CloseAt:at, status:'enrolling' });
  paintStatus(); toast('🎯 추가 모집을 열었습니다 — 학부모 화면이 2차 모드로 바뀝니다');
};
window.cancelR2 = async ()=>{
  if(!confirm('추가 모집을 취소하고 1차 «순위 조정» 단계로 되돌릴까요?\n2차 신청 기록은 지워지지 않고 숨겨지며, 다시 열면 이어집니다.')) return;
  await updateDoc(doc(db,'clubSemesters',SEM.id), { round:1, status:'adjusting', statusAt:Timestamp.now() });
  Object.assign(SEM, { round:1, status:'adjusting' }); paintStatus(); toast('1차 «순위 조정»으로 되돌렸습니다');
};
window.autoAssign = async ()=>{
  await snapEnr('자동 배정 전');
  const clubs = LIVE().filter(a=>a.status==='approved' && a.published);
  const byId = {}; clubs.forEach(c=>byId[c.id]=c);
  const cap = {}; clubs.forEach(c=>cap[c.id]=0);
  // 1) 1순위부터 3순위까지 차례로: 초과 동아리는 «당첨» 체크된 1순위만, 정원 안이면 그대로
  const result = {}; ENR.forEach(e=>result[e.id]=[]);
  const ENR_T = ENR.slice().sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));   // 보충층은 신청 시각 순(선착)
  for(let rank=1; rank<=3; rank++){
    for(const e of (rank===1 ? ENR : ENR_T)){
      // 1지망: 시간이 안 겹치면 전부 도전 · 2~3지망: 🪜 보충 사다리 (1지망 실패 시에만, 층 전체에서 최대 1개, 경쟁 시 선착순)
      const pks = (e.picks||[]).filter(p=>p.rank===rank);
      if(!pks.length) continue;
      if(rank>=2){
        const p1 = (e.picks||[]).filter(p=>p.rank===1);
        const fail1 = p1.length===0 || p1.some(p=>{ const r=result[e.id].find(x=>x.clubId===p.clubId); return !r || r.state!=='assigned'; });
        const ladderWon = result[e.id].some(r=>r.state==='assigned' && r.viaLadder);
        if(!fail1 || ladderWon){ pks.forEach(pk=>result[e.id].push({clubId:pk.clubId, state:'skipped'})); continue; }
      }
      let stop = false;
      for(const pk of pks){
        const c = byId[pk.clubId]; if(!c) continue;
        if(stop){ result[e.id].push({clubId:c.id, state:'skipped'}); continue; }   // 같은 층에서 이미 확보 → 자동 미지원
        if(c.cancelled){ result[e.id].push({clubId:c.id, state:'cancelled'}); continue; }
        if((e.final||{})[c.id]===false){ result[e.id].push({clubId:c.id, state:'declined'}); continue; }  // 학부모가 참여 취소 → 자리 비움
        const st = clubStat(c).st;
        if(st==='over' && rank===1 && !(e.lottery||{})[c.id]){ result[e.id].push({clubId:c.id, state:'lost'}); continue; }
        // 시간 겹침: 이미 배정된 것과
        const mine = result[e.id].filter(r=>r.state==='assigned').map(r=>byId[r.clubId]);
        if(mine.some(m=>overlap(m,c))){ result[e.id].push({clubId:c.id, state:'overlap'}); continue; }
        if(cap[c.id] >= (c.maxN||999)){ result[e.id].push({clubId:c.id, state:'full'}); continue; }
        cap[c.id]++; result[e.id].push({clubId:c.id, state:'assigned', ...(rank>=2?{viaLadder:true}:{})});
        if(rank>=2) stop = true;
      }
    }
  }
  let n=0;
  for(const e of ENR){ await updateDoc(doc(db,'clubEnrollments',e.id), { result: result[e.id], assignedAt: Timestamp.now() }); e.result = result[e.id]; n++; }
  toast(`${n}건 배정 결과 저장 — 최소 미달 동아리는 «폐강 처리» 후 다시 실행하세요`); renderEnroll();
};

  try{ await updateDoc(doc(db,'clubApplications',id), { deleted:true, deletedAt:Timestamp.now(), deletedBy:CU.name||'' });

};
window.restoreApp = async (id)=>{

window.hardDelete = async (id)=>{

  }catch(e){ toast('영구 삭제 실패: '+(e.message||'')); }
};

/* 🔗 강사 계정 연결 — clubInstructors(포털에 로그인한 사람들) 중에서 고른다 */
window.assignOwner = async (appId)=>{
  const a = APPS.find(x=>x.id===appId); if(!a) return;

  const list = snap.docs.map(d=>({uid:d.id, ...d.data()})).filter(x=>x.email||x.name)
    .sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ko'));

  const bg = document.createElement('div'); bg.className='modal-bg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal" style="max-width:460px">
    <div style="font-size:15px;font-weight:900;color:var(--gd)">🔗 「${esc(a.title||'')}」 강사 계정 연결</div>
    <div class="small" style="margin:6px 0 10px">연결하면 그 계정이 이 신청서의 주인이 되어 수정·출석 체크를 할 수 있습니다.</div>
    <select id="own-sel" style="width:100%;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-family:inherit;font-size:13.5px">
      ${list.map(x=>`<option value="${x.uid}" data-email="${esc(x.email||'')}"${x.uid===a.uid?' selected':''}>${esc(x.name||'(이름 없음)')} · ${esc(x.email||'')}${x.uid===a.uid?' (현재)':''}</option>`).join('')}
    </select>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="bs" onclick="this.closest('.modal-bg').remove()">취소</button>
      <button class="bp" id="own-save">연결</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#own-save').onclick = async ()=>{
    await snapApps('강사 계정 연결 전');
    const sel = bg.querySelector('#own-sel');
    const uid = sel.value, email = sel.selectedOptions[0].dataset.email||'';
    try{
      await updateDoc(doc(db,'clubApplications',appId), { uid, email, ownerAssignedBy: CU.name||'', ownerAssignedAt: Timestamp.now() });
      a.uid = uid; a.email = email;
      const sp = $I('own-'+appId); if(sp) sp.textContent = email||uid;
      toast('강사 계정을 연결했습니다'); bg.remove();
    }catch(e){ alert('연결 실패: '+(e.message||'')); }
  };
};

/* ── 🗓 요일·시간 그리드 ── */
function toMin(t){ const [h,m]=String(t||'0:0').split(':').map(Number); return h*60+m; }
let GRID_SEL = new Set();
window.gridPick = (g)=>{
  if(g==='전체') GRID_SEL.clear();
  else GRID_SEL.has(g) ? GRID_SEL.delete(g) : GRID_SEL.add(g);
  renderGrid();
};
function gridMatch(a){
  if(!GRID_SEL.size) return true;
  if(!(a.gradeSel && a.gradeSel.length)) return true;
  return a.gradeSel.some(g=>GRID_SEL.has(g));
}
window.gridInfo = (id)=>{
  const a = APPS.find(x=>x.id===id); if(!a) return;
  const gl = (a.gradeSel&&a.gradeSel.length)?sortG(a.gradeSel).join('·'):'전체 학년';
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal" style="max-width:420px">
    <div class="row"><span class="pill ${a.type==='joy'?'st-lottery':'st-recruiting'}">${a.type==='joy'?'조이클래스':'동아리'}</span>
      <b style="font-size:15.5px">${esc(a.title||'')}</b></div>
    ${a.intro?`<div class="small" style="margin-top:5px;line-height:1.6">💬 ${esc(a.intro)}</div>`:''}
    <div style="font-size:13px;line-height:2;margin-top:9px">
      👤 ${esc(a.instructorName||'')}${a.coInstructors?' · '+esc(a.coInstructors):''}<br>
      🎯 ${esc(gl)}${a.gradeNote?` <span class="small" style="color:#1D4ED8">(${esc(a.gradeNote)})</span>`:''} · 👥 ${a.minN||0}~${a.maxN||0}명<br>
      🗓 ${(a.weekdays||[]).filter(w=>WD[w]).map(w=>WD[w]).join('·')} ${a.start||''} · ${a.durMin||0}분 · ${liveCount(a)}회<br>
      💰 학기 1인 ${semTotal(a).toLocaleString()}원 · 📍 ${esc(a.room||a.place||'미정')}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="bs" onclick="this.closest('.modal-bg').remove()">닫기</button>
      <button class="bp" onclick="this.closest('.modal-bg').remove(); viewApp('${a.id}')">상세 보기 →</button></div></div>`;
  document.body.appendChild(bg);
};
function renderGrid(){
  const s0 = toMin(SEM.timeStart||'15:20'), s1 = toMin(SEM.timeEnd||'17:20'), STEP=10;
  const rows = Math.ceil((s1-s0)/STEP);
  const colors = ['#2F6FD0','#8B5CF6','#16A34A','#D97706','#DC2626','#0F766E','#7C3AED','#B45309','#0EA5E9','#DB2777','#65A30D','#9333EA','#EA580C','#0891B2','#4F46E5','#CA8A04'];
  const all = LIVE().filter(a=>a.status!=='rejected');
  const chips = ['전체', ...sortG(SEM.gradeList||[])].map(g=>{
    const on = g==='전체' ? !GRID_SEL.size : GRID_SEL.has(g);
    return `<button class="chipbtn ${on?'on':''}" onclick="gridPick('${g}')">${g}</button>`; }).join('');
  const selTxt = GRID_SEL.size ? sortG([...GRID_SEL]).join('·') : '';
  let html = `<div class="card"><h3>요일 × 시간 (${SEM.timeStart}~${SEM.timeEnd}) · 반려·휴지통 제외 · 블록을 누르면 요약</h3>
    <div class="row" style="margin-bottom:8px;gap:5px"><span class="small">학년(복수 선택):</span>${chips}</div>
    <div class="small" style="margin-bottom:8px">${GRID_SEL.size
      ? `<b>${selTxt}</b> 학생이 신청 가능한 동아리만 진하게 — 같은 칸에 진한 블록이 나란히면 그 학년(들)은 하나만 고르게 됩니다.`
      : '학년 칩을 누르면(여러 개 가능) 해당 학년이 고를 수 있는 동아리만 진하게 남습니다.'}</div>
    <div class="tgrid"><div></div>${[1,2,3,4,5].map(w=>`<div class="h">${WD[w]}</div>`).join('')}`;
  for(let r=0;r<rows;r++){
    const t = s0 + r*STEP;
    html += `<div class="tm">${r%3===0?String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'):''}</div>`;
    for(let w=1;w<=5;w++) html += `<div class="cell" id="g-${w}-${r}"></div>`;
  }
  html += `</div><div class="row" style="margin-top:10px">${all.map(a=>`<span class="chip" style="cursor:pointer;${gridMatch(a)?'':'opacity:.3'}" onclick="gridInfo('${a.id}')"><span style="width:10px;height:10px;border-radius:3px;background:${colors[all.indexOf(a)%colors.length]}"></span>${esc(a.title||'')} <span class="small">${esc((a.gradeSel&&a.gradeSel.length)?sortG(a.gradeSel).join('·'):'전체')}</span></span>`).join('')}</div></div>`;
  $I('body').innerHTML = html;
  for(let w=1; w<=5; w++){
    const day = all.filter(a=>(a.weekdays||[]).includes(w))
      .map(a=>({ a, st: toMin(a.start||SEM.timeStart), en: toMin(a.start||SEM.timeStart)+(a.durMin||60) }))
      .sort((x,y)=>x.st-y.st || y.en-x.en);
    const laneEnd = [];
    day.forEach(b=>{ let L = laneEnd.findIndex(e=>e<=b.st); if(L<0){ L=laneEnd.length; laneEnd.push(0); } laneEnd[L]=b.en; b.lane=L; });
    const N = Math.max(1, laneEnd.length);
    // D안: 레인 실제 폭을 재서 58px 미만이면 세로쓰기(한글 바로 선 채 위→아래)로 자동 전환
    const cw = $I(`g-${w}-0`)?.offsetWidth || 0;
    const laneW = cw ? (cw * (100/N) / 100 - 4) : 999;
    const vert = laneW < 58;
    day.forEach(b=>{
      const r0 = Math.max(0, Math.floor((b.st-s0)/STEP)), span = Math.max(1, Math.round((b.en-b.st)/STEP));
      const cell = $I(`g-${w}-${r0}`); if(!cell) return;
      const hit = gridMatch(b.a);
      const gl = (b.a.gradeSel&&b.a.gradeSel.length)?sortG(b.a.gradeSel).join('·'):'전체';
      const d = document.createElement('div'); d.className = 'blk' + (vert?' v':'');
      const wd = (100/N), lf = b.lane*wd;
      d.style.cssText = `top:1px;height:${span*24-4}px;background:${colors[all.indexOf(b.a)%colors.length]};left:calc(${lf}% + 2px);width:calc(${wd}% - 4px);cursor:pointer;${vert?'':'white-space:normal;line-height:1.3;'}${hit?'':'opacity:.16;filter:saturate(.4)'}`;
      d.title = `${b.a.title} · ${b.a.start} ${b.a.durMin}분 · 🎯 ${gl} · ${b.a.room||'교실 미배정'} — 클릭하면 요약`;
      d.innerHTML = vert
        ? `${esc(b.a.title)}<div class="bg">🎯 ${esc(gl)}</div>`
        : `<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.a.title)}</div><div style="font-size:9px;font-weight:700;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎯 ${esc(gl)}</div>`;
      d.onclick = ()=>gridInfo(b.a.id);
      cell.appendChild(d);
    });
  }
}
