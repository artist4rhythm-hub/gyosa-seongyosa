<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아리 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
.cb-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cb-top select{padding:9px 12px;border:1.5px solid var(--ivd);border-radius:10px;font-size:14px;font-weight:800;font-family:inherit;background:var(--wh,#fff)}
.cb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cb-tabs button{border:1.5px solid var(--ivd);background:var(--wh,#fff);border-radius:100px;padding:8px 15px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ts)}
.cb-tabs button.on{background:var(--gd);border-color:var(--gd);color:#fff}
.card{background:var(--wh,#fff);border:1px solid var(--ivd);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:14.5px;font-weight:900;color:var(--gd);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.f label{display:block;font-size:11.5px;font-weight:800;color:var(--ts);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1.5px solid var(--ivd);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--wh,#fff)}
.f textarea{min-height:80px;resize:vertical}
.pill{display:inline-block;border-radius:100px;padding:3px 10px;font-size:10.5px;font-weight:800}
.st-draft{background:#F1F0EC;color:#6B7280}.st-recruiting{background:#DBEAFE;color:#1D4ED8}.st-enrolling{background:#FEF3C7;color:#B45309}
.st-lottery{background:#EDE9FE;color:#6D28D9}.st-confirmed{background:#DCFCE7;color:#15803D}.st-running{background:#CCFBF1;color:#0F766E}
.st-settling{background:#FDE68A;color:#92400E}.st-locked{background:#E5E7EB;color:#374151}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ivd);border-radius:100px;padding:4px 10px;font-size:12px;background:var(--wh,#fff)}
.chip b{color:var(--gd)}
.chip button{border:none;background:none;cursor:pointer;color:var(--tl);font-size:13px;padding:0 2px}
.ap{border:1px solid var(--ivd);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--wh,#fff)}
.ap .t{font-size:14.5px;font-weight:900}
.ap .m{font-size:12px;color:var(--ts);margin-top:3px}
.ap .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.ap .act select{padding:6px 9px;border:1px solid var(--ivd);border-radius:8px;font-size:12px;font-family:inherit}
.tgrid{display:grid;grid-template-columns:52px repeat(5,1fr);gap:2px;font-size:11px}
.tgrid .h{background:var(--gd);color:#fff;text-align:center;padding:6px 0;border-radius:6px;font-weight:800}
.tgrid .tm{color:var(--tl);text-align:right;padding-right:4px;line-height:22px}
.tgrid .cell{position:relative;background:var(--iv);border-radius:4px;min-height:22px}
.blk{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 5px;font-size:10.5px;font-weight:800;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}
.alert{display:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
.alert.ok{display:block;background:#DCFCE7;color:#16A34A}.alert.err{display:block;background:#FDECEA;color:#C0392B}
.q-row{display:grid;grid-template-columns:1fr 110px 90px 110px auto;gap:6px;align-items:center;margin-bottom:6px}
.q-row input,.q-row select{padding:7px 9px;border:1px solid var(--ivd);border-radius:8px;font-size:12.5px;font-family:inherit}
.small{font-size:11.5px;color:var(--tl)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--wh,#fff);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
.cal2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.cal2{grid-template-columns:1fr}}
.cal{border:1px solid var(--ivd);border-radius:12px;padding:10px;background:var(--wh,#fff)}
.cal .ttl{font-size:13px;font-weight:900;color:var(--gd);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .wd{text-align:center;font-size:10.5px;color:var(--tl);padding:2px 0}
.cg .d{min-height:58px;border:1px solid var(--iv);border-radius:7px;padding:3px 4px;font-size:10.5px;background:var(--wh,#fff);position:relative}
.cg .d .n{font-size:11px;font-weight:800;color:var(--ts)}
.cg .d.out{opacity:.25}
.cg .d.we{background:#FAFAF8}.cg .d.we .n{color:#B8B4AA}
.cg .d .ev{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;background:#EEF4FF;color:#1D4ED8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cg .d .ev.hol{background:#FEF2F2;color:#B91C1C}
.cg .d.pick{cursor:pointer}
.cg .d.pick:hover{border-color:var(--gd)}
.cg .d.blk{background:#FEF2F2;border-color:#FCA5A5}
.cg .d.blk .n{color:#B91C1C}
.cg .d .rs{display:block;margin-top:2px;font-size:10px;color:#B91C1C;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg .d.has:not(.blk){border-color:#93C5FD}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{background:var(--gp);color:var(--gd);padding:7px 8px;text-align:left;border-bottom:1px solid var(--ivd)}
table.tb td{padding:7px 8px;border-bottom:1px solid var(--iv);vertical-align:top}
tr.blocked td{color:#B91C1C;background:#FEF2F2}
</style>
</head>
<body>
<div id="ls" style="display:none;min-height:100vh;align-items:center;justify-content:center">
  <div style="background:var(--wh,#fff);border:1px solid var(--ivd);border-radius:16px;padding:28px;max-width:340px;width:92%">
    <div style="font-size:17px;font-weight:900;color:var(--gd);margin-bottom:6px">🎨 동아리</div>
    <div style="font-size:12.5px;color:var(--ts);margin-bottom:14px">교사 선교사 계정으로 로그인해 주세요.</div>
    <label style="font-size:12px;font-weight:700">아이디</label>
    <input type="text" id="l-id" style="width:100%;margin:4px 0 10px;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-family:inherit">
    <label style="font-size:12px;font-weight:700">비밀번호</label>
    <input type="password" id="l-pw" style="width:100%;margin:4px 0 14px;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-family:inherit">
    <button class="bp" style="width:100%" onclick="doLogin()">로그인</button>
    <div class="alert" id="l-msg"></div>
  </div>
</div>

<div id="ms" style="display:none">
  <div style="max-width:1080px;margin:0 auto;padding:4px 4px 40px">
    <div style="font-size:19px;font-weight:900;color:var(--gd);margin:4px 0 4px">🎨 방과후 동아리 · 조이클래스</div>
    <p style="font-size:12.5px;color:var(--ts);margin:0 0 12px;line-height:1.6">
      학기 하나 = 책 한 권. 학기를 열고 → 강사 모집 링크로 개설 신청을 받고 → 취합해 공고합니다.</p>

    <div class="cb-top">
      <select id="sem-sel" onchange="pickSem(this.value)"></select>
      <button class="bs" onclick="newSem()">＋ 새 학기</button>
      <span id="sem-status"></span>
      <span style="margin-left:auto" id="sem-flow"></span>
    </div>

    <div class="cb-tabs" id="tabs">
      <button class="on" onclick="showTab('set')">⚙️ 학기 설정</button>
      <button onclick="showTab('block')">🚫 불가 일정</button>
      <button onclick="showTab('q')">📝 질문 양식</button>
      <button onclick="showTab('link')">🔗 모집 링크</button>
      <button onclick="showTab('apps')">📥 신청 취합</button>
      <button onclick="showTab('grid')">🗓 요일·시간 그리드</button>
    </div>

    <div id="body"><div class="small">학기를 선택하거나 새로 만드세요.</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const $I = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const STATUS = { draft:'초안', recruiting:'강사 모집중', planning:'계획서 제출중', enrolling:'학부모 신청중', adjusting:'순위 조정·최종 결정', confirmed:'확정', running:'운영중', settling:'정산', locked:'잠금' };
const FLOW = ['draft','recruiting','planning','enrolling','adjusting','confirmed','running','settling','locked'];
/* 일정표 기본 항목 — role은 시스템이 의미를 아는 꼬리표(강사 포털·학부모 화면이 참조), label은 자유 */
const MS_ROLES = { recruitStart:'강사 모집 시작', recruitEnd:'강사 모집 마감', planEnd:'활동 계획서 제출 마감', notice:'동아리 신청 공고',
  enrollStart:'학부모 신청 시작', enrollEnd:'학부모 신청 마감', adjust:'1·2·3순위 조정', final:'최종 결정', custom:'(기타)' };
function defaultMilestones(){ return ['recruitStart','recruitEnd','planEnd','notice','enrollStart','enrollEnd','adjust','final']
  .map((r,i)=>({ id:'m'+i, role:r, label:MS_ROLES[r], at:'' })); }
function ms(role){ return (SEM?.milestones||[]).find(m=>m.role===role) || null; }
const WD = ['일','월','화','수','목','금','토'];
const PORTAL = 'https://artist4rhythm-hub.github.io/daniel-parents/club.html';

let CU=null, SEMS=[], SEM=null, APPS=[], TAB='set';
const UNIFIED_POS = ['교장','교감','행정실장'];
function myOrgs(){ if(!CU) return []; if(CU.role==='super'||UNIFIED_POS.includes(CU.position||'')) return ['daniel','jihyebit']; return (CU.orgs&&CU.orgs.length)?CU.orgs:[CU.org]; }
const toast = (t)=>{ const el=document.createElement('div'); el.textContent=t; el.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1E3932;color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;z-index:9999'; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); };

function korEmail(id){ return `${id}@gyosa-seongyosa.staff`; }
window.doLogin = async function(){
  const id=$I('l-id').value.trim(), pw=$I('l-pw').value, m=$I('l-msg'); m.className='alert';
  try{ await signInWithEmailAndPassword(auth, korEmail(id), pw); }
  catch(e){ m.className='alert err'; m.textContent='로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
onAuthStateChanged(auth, async user=>{
  if(!user){ window.hideLoading&&hideLoading(); $I('ls').style.display='flex'; $I('ms').style.display='none'; return; }
  const st = await getDoc(doc(db,'staff',user.uid));
  if(!st.exists()){ $I('ls').style.display='flex'; return; }
  CU = { uid:user.uid, ...st.data() };
  window.ORGS = ORGS;
  if(window.renderShell) renderShell('club', CU);
  $I('ls').style.display='none'; $I('ms').style.display='';
  window.hideLoading&&hideLoading();
  await loadSems();
});

/* ── 학기 ── */
async function loadSems(){
  const snap = await getDocs(collection(db,'clubSemesters'));
  SEMS = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(s=>myOrgs().includes(s.org))
    .sort((a,b)=>String(b.rangeFrom||'').localeCompare(String(a.rangeFrom||'')));
  $I('sem-sel').innerHTML = SEMS.length ? SEMS.map(s=>`<option value="${s.id}">${esc(s.name)} · ${ORGS[s.org]||s.org}</option>`).join('')
    : '<option value="">(학기 없음)</option>';
  if(SEMS.length) pickSem(SEMS[0].id);
}
window.pickSem = async (id)=>{
  SEM = SEMS.find(s=>s.id===id) || null;
  $I('sem-sel').value = id;
  if(SEM && !Array.isArray(SEM.milestones)){   // 옛 필드 이관
    const m = defaultMilestones();
    const set = (r,v)=>{ const x=m.find(y=>y.role===r); if(x) x.at = v||''; };
    set('recruitStart', SEM.applyFrom); set('recruitEnd', SEM.applyTo); set('enrollStart', SEM.enrollFrom); set('enrollEnd', SEM.enrollTo); set('final', SEM.cancelUntil);
    SEM.milestones = m;
  }
  if(SEM){ await loadApps(); }
  paintStatus(); render();
};
window.newSem = async ()=>{
  const name = prompt('학기 이름 (예: 2026학년도 2학기)'); if(!name) return;
  const orgs = myOrgs(); let org = orgs[0];
  if(orgs.length>1){ const o = prompt('기관: daniel(다니엘) / jihyebit(지혜빛)', 'daniel'); if(o==='jihyebit') org='jihyebit'; }
  const y = new Date().getFullYear();
  const ref = await addDoc(collection(db,'clubSemesters'), {
    name, org, status:'draft',
    rangeFrom:`${y}-09-01`, rangeTo:`${y}-12-31`, milestones: defaultMilestones(),
    timeStart:'15:20', timeEnd:'17:20', maxMin:120, feeClub:5000, feeJoy:3000,
    refundRule:'결석 회차는 보강이 없으면 환불합니다. (세부 기준은 담당 교사가 안내)',
    rooms:[], blocked:[], questions:[
      {id:'q1', label:'이 프로그램의 목적은 무엇인가요? 참여 학생들에게 어떤 성장·배움이 있기를 계획하십니까?', type:'long', required:true, forType:'both'},
      {id:'q2', label:'목적을 이루기 위한 전략(방법)은 무엇인가요?', type:'long', required:true, forType:'both'},
    ],
    createdAt: Timestamp.now(), createdBy: CU.name||'' });
  await loadSems(); pickSem(ref.id); toast('새 학기를 만들었습니다');
};
function paintStatus(){
  if(!SEM){ $I('sem-status').innerHTML=''; $I('sem-flow').innerHTML=''; return; }
  $I('sem-status').innerHTML = `<span class="pill st-${SEM.status}">${STATUS[SEM.status]||SEM.status}</span>`;
  const i = FLOW.indexOf(SEM.status);
  const prev = FLOW[i-1], next = FLOW[i+1];
  $I('sem-flow').innerHTML = `
    ${prev?`<button class="bs" onclick="setStatus('${prev}')">← ${STATUS[prev]}</button>`:''}
    ${next?`<button class="bp" onclick="setStatus('${next}')">${STATUS[next]} 단계로 →</button>`:''}`;
}
window.setStatus = async (st)=>{
  if(st==='locked' && !confirm('학기를 잠그면 모든 기록이 읽기 전용이 됩니다. 계속할까요?')) return;
  await updateDoc(doc(db,'clubSemesters',SEM.id), { status: st, statusAt: Timestamp.now() });
  SEM.status = st; paintStatus(); toast(`«${STATUS[st]}» 단계로 바꿨습니다`);
};
window.showTab = (t)=>{ TAB=t; document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on', ['set','block','q','link','apps','grid'][i]===t)); render(); };

function render(){
  if(!SEM){ $I('body').innerHTML='<div class="small">학기를 선택하거나 새로 만드세요.</div>'; return; }
  ({ set:renderSet, block:renderBlock, q:renderQ, link:renderLink, apps:renderApps, grid:renderGrid })[TAB]();
}

/* ── ⚙️ 설정 ── */
function renderSet(){
  const s = SEM;
  $I('body').innerHTML = `
  <div class="card f"><h3>기본</h3>
    <div class="grid2">
      <div><label>학기 이름</label><input id="s-name" value="${esc(s.name)}"></div>
      <div><label>기관</label><input value="${ORGS[s.org]||s.org}" disabled></div>
      <div><label>학기 시작</label><input type="date" id="s-from" value="${s.rangeFrom||''}"></div>
      <div><label>학기 끝</label><input type="date" id="s-to" value="${s.rangeTo||''}"></div>
    </div></div>
  <div class="card f"><h3>📅 일정표 (관리자가 추가·삭제·이름 변경)</h3>
    <div class="small" style="margin-bottom:8px">위에서 아래 순서로 진행됩니다. 꼬리표(역할)는 강사 포털·학부모 화면이 참고하는 표시이고, 이름은 자유롭게 바꿔도 됩니다.
      실제 쓰기 허용은 상단 «단계» 버튼이 결정하고, 여기 날짜는 안내·마감 표시용입니다.</div>
    <div id="ms-list">${(s.milestones||[]).map((m,i)=>msRow(m,i)).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="bs" onclick="addMs()">＋ 일정 추가</button></div></div>
  <div class="card f"><h3>수업 시간 · 요금 · 환불 기준</h3>
    <div class="grid2">
      <div><label>수업 가능 시작</label><input type="time" id="s-ts" value="${s.timeStart||'15:20'}"></div>
      <div><label>수업 가능 끝</label><input type="time" id="s-te" value="${s.timeEnd||'17:20'}"></div>
      <div><label>최대 길이(분)</label><input type="number" id="s-max" value="${s.maxMin||120}"></div>
      <div><label>동아리 요율 (원/시간/1인)</label><input type="number" id="s-fc" value="${s.feeClub||5000}"></div>
      <div><label>조이클래스 요율 (원/시간/1인)</label><input type="number" id="s-fj" value="${s.feeJoy||3000}"></div>
    </div>
    <div style="margin-top:8px"><label>환불 기준 (학부모·강사에게 그대로 보입니다)</label><textarea id="s-rr">${esc(s.refundRule||'')}</textarea></div></div>
  <div class="card f"><h3>교실 목록 (배정용 · 한 줄에 하나)</h3>
    <textarea id="s-rooms" placeholder="예)&#10;DA 샬롬반&#10;예배실&#10;202호 이레반">${esc((s.rooms||[]).join('\\n'))}</textarea></div>
  <div class="row"><button class="bp" onclick="saveSet()">설정 저장</button><span class="small">저장 후 강사 포털에 바로 반영됩니다.</span></div>
  <div class="alert" id="s-msg"></div>`;
}
function msRow(m,i){
  return `<div class="q-row" style="grid-template-columns:1fr 200px 150px auto" data-i="${i}">
    <input class="ms-label" value="${esc(m.label||'')}" placeholder="일정 이름">
    <input class="ms-at" type="datetime-local" value="${esc(m.at||'')}">
    <select class="ms-role">${Object.entries(MS_ROLES).map(([k,v])=>`<option value="${k}"${m.role===k?' selected':''}>${v}</option>`).join('')}</select>
    <span><button class="bs" onclick="moveMs(${i},-1)">↑</button> <button class="bs" onclick="moveMs(${i},1)">↓</button> <button class="bs" onclick="delMs(${i})">✕</button></span></div>`;
}

/* ── 🚫 불가 일정: 왼쪽 학사일정 달력(읽기) · 오른쪽 동아리 달력(클릭으로 불가 체크) ── */
let CAL_YM = null, AC = null;   // 보고 있는 달, 학사 데이터 캐시 {events:[], holidays:[]}
async function loadAcademic(){
  if(AC) return AC;
  const [ev, ho] = await Promise.all([getDocs(collection(db,'academicEvents')), getDocs(collection(db,'holidays'))]);
  const events = ev.docs.map(d=>({id:d.id, ...d.data()})).filter(e=>e.startDate&&e.endDate)
    .filter(e=>{ const os = Array.isArray(e.orgs)&&e.orgs.length ? e.orgs : [e.org||'daniel']; return os.includes(SEM.org)||os.includes('all')||e.org==='both'; });
  const holidays = ho.docs.map(d=>d.data()).filter(h=>h.date && ((h.org||'all')==='all'||h.org===SEM.org) && (h.who||'all')!=='staff');
  AC = { events, holidays }; return AC;
}
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayItems(ds){
  const out = [];
  AC.holidays.filter(h=>h.date===ds).forEach(h=>out.push({t:h.name||'공휴일', hol:true}));
  AC.events.filter(e=>ds>=e.startDate && ds<=e.endDate).forEach(e=>out.push({t:e.title||'행사', hol:false}));
  return out;
}
async function renderBlock(){
  await loadAcademic();
  if(!CAL_YM){ const f = SEM.rangeFrom||ymd(new Date()); CAL_YM = f.slice(0,7); }
  const [Y,M] = CAL_YM.split('-').map(Number);
  const first = new Date(Y, M-1, 1), last = new Date(Y, M, 0);
  const blocked = {}; (SEM.blocked||[]).forEach(b=>blocked[b.date]=b.reason||'운영 불가');
  const inRange = ds => ds>=SEM.rangeFrom && ds<=SEM.rangeTo;
  const head = `<div class="row" style="justify-content:center;gap:12px;margin-bottom:10px">
      <button class="bs" onclick="calMove(-1)">‹</button><b style="font-size:15px;color:var(--gd)">${Y}년 ${M}월</b><button class="bs" onclick="calMove(1)">›</button>
      <span class="small">학기 ${SEM.rangeFrom} ~ ${SEM.rangeTo} · 불가 ${(SEM.blocked||[]).length}일</span></div>`;
  const wdh = ['일','월','화','수','목','금','토'].map(w=>`<div class="wd">${w}</div>`).join('');
  let L = wdh, R = wdh;
  for(let i=0;i<first.getDay();i++){ L+='<div></div>'; R+='<div></div>'; }
  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(Y, M-1, d), ds = ymd(dt), we = dt.getDay()===0||dt.getDay()===6;
    const items = dayItems(ds), out = !inRange(ds);
    L += `<div class="d ${we?'we':''} ${out?'out':''} ${items.length?'has':''}"><span class="n">${d}</span>${items.slice(0,3).map(it=>`<span class="ev ${it.hol?'hol':''}" title="${esc(it.t)}">${esc(it.t)}</span>`).join('')}${items.length>3?`<span class="small">+${items.length-3}</span>`:''}</div>`;
    const bk = blocked[ds];
    R += `<div class="d ${we?'we':''} ${out?'out':''} ${bk?'blk':''} ${(!out&&!we)?'pick':''} ${items.length?'has':''}" ${(!out&&!we)?`onclick="toggleBlock('${ds}')"`:''} title="${bk?esc(bk)+' — 클릭하면 해제':(items.length?'학사: '+esc(items.map(i=>i.t).join(', '))+' — 클릭하면 불가로':'클릭하면 불가로')}">
      <span class="n">${d}</span>${bk?`<span class="rs">🚫 ${esc(bk)}</span>`:(items.length?`<span class="small" style="color:#1D4ED8">${esc(items[0].t)}</span>`:'')}</div>`;
  }
  $I('body').innerHTML = `<div class="card"><h3>운영 불가 일정 — 왼쪽 학사일정을 보며 오른쪽 달력에서 클릭</h3>
    ${head}
    <div class="cal2">
      <div class="cal"><div class="ttl">📚 학사일정 · 공휴일 <span class="small">읽기 전용</span></div><div class="cg">${L}</div></div>
      <div class="cal"><div class="ttl">🎨 동아리 운영 달력 <span class="small">평일 클릭 = 불가 지정/해제</span></div><div class="cg">${R}</div></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="bs" onclick="blockMonthEvents()">이 달의 학사 행사·공휴일 전부 불가로</button>
      <button class="bs" onclick="importHolidays()">📅 학기 전체 공휴일 불러오기</button>
      <button class="bs" onclick="importAllEvents()">🗓 학기 전체 학사 행사 불러오기</button>
      <button class="bs" style="color:#B91C1C" onclick="clearBlocks()">전부 지우기</button>
    </div>
    <div class="small" style="margin-top:6px">불가로 지정한 날은 강사 회차표에서 자동으로 «휴강»으로 빠지고 이유가 표시됩니다. 주말은 운영일이 아니라 지정하지 않습니다.</div>
  </div>`;
}
window.calMove = (d)=>{ const [Y,M]=CAL_YM.split('-').map(Number); const n=new Date(Y, M-1+d, 1); CAL_YM = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; renderBlock(); };
async function saveBlocked(arr){
  const map = {}; arr.forEach(b=>{ if(b.date) map[b.date] = b; });
  const blocked = Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
  await updateDoc(doc(db,'clubSemesters',SEM.id), { blocked });
  SEM.blocked = blocked; renderBlock();
}
window.toggleBlock = async (ds)=>{
  const cur = (SEM.blocked||[]).find(b=>b.date===ds);
  if(cur) return saveBlocked((SEM.blocked||[]).filter(b=>b.date!==ds));
  const items = dayItems(ds);
  let reason = items.length ? items[0].t : '';
  if(!reason){ reason = prompt('불가 이유 (예: 체육대회)', '운영 불가'); if(reason===null) return; }
  saveBlocked([...(SEM.blocked||[]), {date:ds, reason:reason||'운영 불가', src: items.length?'academic':'manual'}]);
};
window.blockMonthEvents = async ()=>{
  const [Y,M]=CAL_YM.split('-').map(Number); const last=new Date(Y,M,0).getDate(); const add=[];
  for(let d=1; d<=last; d++){ const dt=new Date(Y,M-1,d), ds=ymd(dt); if(dt.getDay()===0||dt.getDay()===6) continue; if(ds<SEM.rangeFrom||ds>SEM.rangeTo) continue;
    const it = dayItems(ds); if(it.length) add.push({date:ds, reason:it[0].t, src:'academic'}); }
  if(!add.length) return toast('이 달에는 학사 행사·공휴일이 없습니다');
  await saveBlocked([...(SEM.blocked||[]), ...add]); toast(`${add.length}일 추가`);
};
window.importHolidays = async ()=>{
  await loadAcademic();
  const add = AC.holidays.filter(h=>h.date>=SEM.rangeFrom && h.date<=SEM.rangeTo).map(h=>({date:h.date, reason:h.name||'공휴일', src:'holiday'}));

  await saveBlocked([...(SEM.blocked||[]), ...add]); toast(`공휴일 ${add.length}일 추가`);
};
window.importAllEvents = async ()=>{
  await loadAcademic(); const add=[];
  AC.events.forEach(e=>{ let d=new Date(e.startDate+'T00:00:00'); const end=new Date(e.endDate+'T00:00:00');
    while(d<=end){ const ds=ymd(d); if(ds>=SEM.rangeFrom&&ds<=SEM.rangeTo&&d.getDay()!==0&&d.getDay()!==6) add.push({date:ds, reason:e.title||'학사 행사', src:'academic'}); d.setDate(d.getDate()+1); } });
  if(!add.length) return toast('학기 범위 안의 행사가 없습니다');
  if(!confirm(`학사 행사 날짜 ${add.length}일을 전부 불가로 넣을까요? (행사가 있어도 동아리가 가능한 날은 오른쪽 달력에서 클릭해 해제하면 됩니다)`)) return;
  await saveBlocked([...(SEM.blocked||[]), ...add]); toast(`${add.length}일 추가`);
};
window.clearBlocks = async ()=>{ if(!confirm('불가 일정을 전부 지울까요?')) return; await saveBlocked([]); };

      <tr><th>장소·준비물</th><td>희망 ${esc(a.place||'미정')} / 배정 ${esc(a.room||'미배정')} · ${esc(a.materials||'')}</td></tr>
      <tr><th>회비</th><td>1회 ${feeOf(a).toLocaleString()}원 × ${liveCount(a)}회 = <b>${(feeOf(a)*liveCount(a)).toLocaleString()}원</b> (1인 학기)</td></tr>
      <tr><th>계좌</th><td>${esc(a.bank?.bank||'')} ${esc(a.bank?.account||'')} ${esc(a.bank?.holder||'')}</td></tr>
      ${qs.map(q=>`<tr><th>${esc(q.label)}</th><td style="white-space:pre-wrap">${esc((a.answers||{})[q.id]||'')}</td></tr>`).join('')}
    </table>
    <div style="font-size:13px;font-weight:900;color:var(--gd);margin:14px 0 6px">수업 활동 계획</div>
    <table class="tb"><tr><th>회</th><th>수업일</th><th>활동 내용</th><th>준비물</th><th>재료비</th></tr>
      ${(a.sessions||[]).map(s=>`<tr class="${s.blocked?'blocked':''}"><td>${s.blocked?'':s.no}</td><td>${s.date} (${WD[new Date(s.date+'T00:00:00').getDay()]})</td><td>${s.blocked?'<b>'+esc(s.reason||'휴강')+'</b>':esc(s.content||'')}</td><td>${esc(s.materials||'')}</td><td>${esc(s.cost||'')}</td></tr>`).join('')}
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="bp" onclick="this.closest('.modal-bg').remove()">닫기</button></div></div>`;
  document.body.appendChild(bg);
};

/* ── 🗓 요일·시간 그리드 ── */
function toMin(t){ const [h,m]=String(t||'0:0').split(':').map(Number); return h*60+m; }
function renderGrid(){
  const s0 = toMin(SEM.timeStart||'15:20'), s1 = toMin(SEM.timeEnd||'17:20'), STEP=10;
  const rows = Math.ceil((s1-s0)/STEP);
  const colors = ['#2F6FD0','#8B5CF6','#16A34A','#D97706','#DC2626','#0F766E','#7C3AED','#B45309'];
  const apps = APPS.filter(a=>a.status!=='rejected');
  let html = `<div class="card"><h3>요일 × 시간 (${SEM.timeStart}~${SEM.timeEnd}) · 반려 제외</h3><div class="small" style="margin-bottom:8px">같은 칸에 여러 블록이 겹치면 시간이 충돌하는 동아리입니다 — 교실이 다르면 괜찮고, 같은 학년 대상이면 학부모가 하나만 고르게 됩니다.</div>
    <div class="tgrid"><div></div>${[1,2,3,4,5].map(w=>`<div class="h">${WD[w]}</div>`).join('')}`;
  for(let r=0;r<rows;r++){
    const t = s0 + r*STEP;
    html += `<div class="tm">${r%3===0?String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'):''}</div>`;
    for(let w=1;w<=5;w++){
      html += `<div class="cell" id="g-${w}-${r}"></div>`;
    }
  }
  html += `</div><div class="row" style="margin-top:10px">${apps.map((a,i)=>`<span class="chip"><span style="width:10px;height:10px;border-radius:3px;background:${colors[i%colors.length]}"></span>${esc(a.title||'')}</span>`).join('')}</div></div>`;
  $I('body').innerHTML = html;
  apps.forEach((a,i)=>{
    const st = toMin(a.start||SEM.timeStart), r0 = Math.max(0, Math.floor((st-s0)/STEP)), span = Math.max(1, Math.round((a.durMin||60)/STEP));
    (a.weekdays||[]).forEach(w=>{
      const cell = $I(`g-${w}-${r0}`); if(!cell) return;
      const n = cell.querySelectorAll('.blk').length;
      const d = document.createElement('div'); d.className='blk';
      d.style.cssText = `top:1px;height:${span*24-4}px;background:${colors[i%colors.length]};left:${2+n*6}px;opacity:${n?0.85:1}`;
      d.title = `${a.title} · ${a.start} ${a.durMin}분 · ${a.room||'교실 미배정'}`;
      d.textContent = `${a.title}${a.room?' · '+a.room:''}`;
      cell.appendChild(d);
    });
  });
}
</script>
