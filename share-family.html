<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가정통신문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gd:#1E3932; --gm:#00704A; --gl:#D4E9E2; --gp:#E8F3EF;
  --iv:#F2F0EB; --ivd:#E3E1DA; --tx:#1F2320; --ts:#5A6560; --tl:#93A09A; --wh:#fff;
  --amber:#B45309; --amberp:#FFF4E5; --red:#C0392B; --redp:#FDECEA;
  --sh:0 2px 12px rgba(30,57,50,.08); --r:12px;
}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--iv);z-index:100}
#gate .gbox{text-align:center}
#gate .gtitle{font-size:17px;font-weight:900;color:var(--gd);margin-bottom:8px}
#gate .gsub{font-size:13px;color:var(--ts)}
#gate .gbtn{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;color:#fff;
  background:var(--gd);border-radius:9px;padding:9px 18px;text-decoration:none}
#ms{display:none;flex-direction:column;gap:12px}

.panel{background:var(--wh);border:1px solid var(--ivd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.ptitle{font-size:15px;font-weight:900;color:var(--gd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdesc{font-size:12px;color:var(--ts);margin-top:3px;line-height:1.6}

.btn{font-family:inherit;font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:9px;
  border:1px solid var(--gm);background:var(--gm);color:#fff;cursor:pointer}
.btn.line{background:var(--wh);color:var(--gm)}
.btn.gray{background:var(--wh);border-color:var(--ivd);color:var(--ts)}
.btn.red{background:var(--wh);border-color:var(--red);color:var(--red)}
.btn.sm{font-size:11px;padding:6px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.famtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.famtbl th{background:var(--gd);color:#fff;font-weight:800;padding:8px 9px;text-align:left;font-size:11.5px;white-space:nowrap}
.famtbl td{padding:8px 9px;border-bottom:1px solid var(--iv);vertical-align:middle}
.famtbl tr.rowbtn{cursor:pointer}
.famtbl tr.rowbtn:hover td{background:#FAFAF7}
.famtbl td.c,.famtbl th.c{text-align:center}
.tblwrap{overflow-x:auto;border-radius:9px;border:1px solid var(--ivd)}
.tblwrap .famtbl{min-width:640px}

.pill{display:inline-block;font-size:10px;font-weight:800;border-radius:100px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--gp);color:var(--gm)}
.pill.req{background:var(--amberp);color:var(--amber)}
.pill.gray{background:var(--iv);color:var(--ts)}
.pill.red{background:var(--redp);color:var(--red)}
.pill.blue{background:#E3EDF7;color:#33587D}
.pill.click{cursor:pointer}

/* ═══ 블록 카드 ═══ */
.blk{background:var(--wh);border:1px solid var(--ivd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.blk.internal{border-style:dashed;border-color:#C9C4B8}
.blkhead{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#FAFAF7;
  border-bottom:1px solid var(--iv);flex-wrap:wrap}
.blkhead .bt{font-size:13.5px;font-weight:900;color:var(--gd);flex:1;min-width:120px}
.blkhead .bico{font-size:14px}
.iconbtn{font-family:inherit;font-size:12px;border:1px solid var(--ivd);background:var(--wh);
  border-radius:7px;padding:4px 8px;cursor:pointer;color:var(--ts)}
.iconbtn:hover{border-color:var(--gm);color:var(--gm)}
.iconbtn.danger:hover{border-color:var(--red);color:var(--red)}
.blkbody{padding:12px 14px;font-size:12.5px}
.blkbody .empty{color:var(--tl);font-size:12px;padding:6px 0}

/* 미리보기 안 렌더링 */
.rv-t{white-space:pre-wrap;line-height:1.75;color:var(--tx)}
.rv-red{white-space:pre-wrap;line-height:1.7;color:var(--red);font-size:12px;margin-top:8px}
.rv-kv{width:100%;border-collapse:collapse;font-size:12.5px}
.rv-kv th{width:1%;white-space:nowrap;background:var(--iv);color:var(--gd);font-weight:900;text-align:left;
  padding:8px 10px;border-bottom:2px solid var(--wh);font-size:12px;vertical-align:top}
.rv-kv td{padding:8px 10px;border-bottom:1px solid var(--iv);white-space:pre-wrap;line-height:1.6}
.rv-kv tr:nth-child(even) td{background:#F3F7F4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-tb{width:100%;border-collapse:collapse;font-size:12px}
/* 줄무늬 음영 — 짝수 줄에 옅은 초록빛을 깔아 시선이 줄을 따라가게 한다 (인쇄에도 유지) */
.rv-tb.st-zebra td.zc1{background:#F3F7F4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* 묶음 음영 — 병합 묶음이 바뀔 때마다 번갈아 (줄무늬도 병합 표에선 이 방식으로 통일) */
.rv-tb.st-band tr.band0 td, .rv-tb.st-zebra tr.band0 td{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-tb.st-band tr.band1 td, .rv-tb.st-zebra tr.band1 td{background:#EDF4EF;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* ═══ 🎨 표 색상 스타일 (엑셀식 테마) ═══ */
.rv-tb.th-navy th{background:#0C2A44}
.rv-tb.th-navy.st-zebra td.zc1,.rv-tb.th-navy.st-zebra tr.band1 td,.rv-tb.th-navy.st-band tr.band1 td{background:#EDF2F9!important}
.rv-tb.th-gray th{background:#4B5563}
.rv-tb.th-gray.st-zebra td.zc1,.rv-tb.th-gray.st-zebra tr.band1 td,.rv-tb.th-gray.st-band tr.band1 td{background:#F3F4F6!important}
.rv-tb.th-warm th{background:#8A6410}
.rv-tb.th-warm.st-zebra td.zc1,.rv-tb.th-warm.st-zebra tr.band1 td,.rv-tb.th-warm.st-band tr.band1 td{background:#F9F3E4!important}
.rv-tb.th-line th{background:#fff!important;color:#1F2320;border-bottom:2.5px solid #1F2320;border-top:2.5px solid #1F2320}
.rv-tb.th-line.st-zebra td.zc1,.rv-tb.th-line.st-zebra tr.band1 td,.rv-tb.th-line.st-band tr.band1 td{background:#F6F6F4!important}
.rv-tb.th-navy th,.rv-tb.th-gray th,.rv-tb.th-warm th,.rv-tb.th-line th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-tb tr:hover td{background:#EAF2EC}
.rv-tb th{background:var(--gd);color:#fff;font-weight:800;padding:7px 8px;text-align:left;font-size:11px;white-space:nowrap}
.rv-tb td{padding:7px 8px;border-bottom:1px solid var(--iv);white-space:pre-wrap;line-height:1.55;vertical-align:top}
.rv-tb tr.sumrow td{background:var(--iv) !important;font-weight:900}
.rv-tb tr.hlrow td{background:#FFF6BF !important;font-weight:900}
.rv-sch{width:100%;border-collapse:collapse;font-size:11.5px}
.rv-sch th{background:var(--gd);color:#fff;font-weight:800;padding:6px 7px;text-align:center;font-size:11px;white-space:nowrap}
.rv-sch td{border:1px solid var(--ivd);padding:6px 7px;text-align:center;white-space:pre-wrap;line-height:1.45}
.rv-sch td.tm{background:var(--iv);font-weight:800;color:var(--ts);white-space:nowrap;font-size:10.5px}
/* ── 시간 계획 v2: 발행 화면 (시간 비례 카드) ── */
.rv-tg{border:1px solid var(--ivd);border-radius:9px;overflow:hidden;background:var(--wh)}
.rv-tg .tg-hd{display:flex;background:var(--gd)}
.rv-tg .tg-corner{flex:0 0 56px;color:#fff;font-size:10.5px;font-weight:800;text-align:center;padding:7px 0}
.rv-tg .tg-dh{color:#fff;font-size:11px;font-weight:800;text-align:center;padding:7px 4px;border-left:1px solid rgba(255,255,255,.18)}
.rv-tg .tg-bd{position:relative;display:flex}
.rv-tg .tg-axis{flex:0 0 56px;position:relative;background:var(--iv);border-right:1px solid var(--ivd)}
.rv-tg .tg-hl{position:absolute;right:6px;transform:translateY(-6px);font-size:9.5px;font-weight:800;color:var(--ts)}
.rv-tg .tg-cols{flex:1;position:relative}
.rv-tg .tg-line{position:absolute;left:0;right:0;border-top:1px solid var(--iv)}
.rv-tg .tg-card{position:absolute;border:1px solid rgba(30,57,50,.16);border-radius:5px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:1px 3px;box-sizing:border-box}
.rv-tg .tg-tt{font-size:10.5px;font-weight:700;color:#243029;text-align:center;line-height:1.3;word-break:keep-all}
.rv-tg .tg-tm{font-size:8.5px;color:#5A6560;font-weight:600}
.rv-tg .tg-tt{font-size:11px}
.rv-tg .tg-st{font-size:9px;font-weight:600;color:#4a5651;line-height:1.2;text-align:center;word-break:keep-all}
/* ── 시간 계획 v2: 편집 빌더 ── */
.sv-top,.sv-pal{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.sv-pal{background:var(--iv);border-radius:9px;padding:9px 10px}
.sv-lb{font-size:11px;font-weight:800;color:var(--ts);white-space:nowrap}
.sv-tin{width:62px;text-align:center;padding:6px 4px}
select.sv-sel{width:96px;min-width:96px;flex:0 0 auto;padding:6px 6px;font-size:12.5px}
.sv-top{margin-bottom:6px}
.sv-durs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sv-dur{font-size:11px;font-weight:700;border:1px solid var(--ivd);background:var(--wh);color:var(--ts);
  border-radius:100px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.sv-dur.on{background:var(--gm);border-color:var(--gm);color:#fff}
.sv-dots{display:flex;gap:4px}
.sv-dot{width:17px;height:17px;border-radius:50%;border:1px solid var(--ivd);cursor:pointer;box-sizing:border-box}
.sv-dot.on{border:2px solid var(--gm)}
.sv-tray{display:flex;flex-direction:column;gap:6px;min-height:40px;justify-content:center;
  border:1.5px dashed var(--ivd);border-radius:9px;padding:8px 10px;margin-bottom:8px;background:var(--iv)}
.sv-trayhd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--gd);flex-wrap:wrap}
.sv-traylist{display:flex;gap:7px;flex-wrap:wrap}
.sv-trayhint{font-size:11px;color:var(--tl)}
.sv-tcard{font-size:12px;font-weight:700;color:#243029;border:1px solid rgba(30,57,50,.2);border-radius:8px;
  padding:7px 11px;cursor:grab;user-select:none;touch-action:none;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 1px 4px rgba(30,57,50,.10)}
.sv-tcard:active{cursor:grabbing}
.sv-tcttl{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-tcdur{font-size:10px;color:#405249;font-weight:800;background:rgba(255,255,255,.65);border-radius:100px;padding:2px 7px}
.sv-tdel{cursor:pointer;color:var(--red);font-size:10px;font-weight:800}
.sv-tdup{cursor:pointer;color:var(--gm);font-size:11px;font-weight:800}
.sv-ghost{position:fixed;z-index:999;pointer-events:none;font-size:11.5px;font-weight:700;color:#243029;
  border:1px solid rgba(30,57,50,.25);border-radius:7px;padding:5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.92}
.sv-card-ed{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--gp);
  border:1px solid var(--gl);border-radius:9px;padding:8px 10px;margin-bottom:8px}
.sv-wrap{border:1px solid var(--ivd);border-radius:9px;overflow:hidden}
.sv-hd{display:flex;background:var(--gd)}
.sv-corner{flex:0 0 56px;color:#fff;font-size:10.5px;font-weight:800;text-align:center;padding:8px 0}
.sv-dh{display:flex;align-items:center;gap:3px;padding:5px 5px;border-left:1px solid rgba(255,255,255,.18);box-sizing:border-box}
.sv-dh input{flex:1;min-width:0;background:rgba(255,255,255,.12);border:none;border-radius:6px;
  color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:4px 3px;font-family:inherit;outline:none}
.sv-scroll{max-height:calc(95vh - 330px);min-height:340px;overflow-y:auto}
.sv-bd{position:relative;display:flex}
.sv-axis{flex:0 0 56px;position:relative;background:var(--iv);border-right:1px solid var(--ivd)}
.sv-hl{position:absolute;right:6px;transform:translateY(-6px);font-size:9.5px;font-weight:800;color:var(--ts)}
.sv-cols{flex:1;position:relative;touch-action:none;cursor:crosshair}
.sv-gl{position:absolute;left:0;right:0;border-top:1px solid var(--iv);pointer-events:none}
.sv-gl.hr{border-top:1px solid var(--ivd)}
.sv-vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--ivd);pointer-events:none}
.sv-card{position:absolute;border:1px solid rgba(30,57,50,.2);border-radius:5px;overflow:hidden;cursor:grab;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:1px 3px;
  box-sizing:border-box;user-select:none;touch-action:none;transition:box-shadow .1s}
.sv-card.sel{box-shadow:0 0 0 2px var(--gm), 0 4px 12px rgba(0,0,0,.14);z-index:5}
.sv-card.bad{box-shadow:0 0 0 2.5px var(--red), 0 4px 14px rgba(192,57,43,.35);background:var(--redp) !important;z-index:6}
.sv-ctt{font-size:10.5px;font-weight:700;color:#243029;text-align:center;line-height:1.25;word-break:keep-all;pointer-events:none}
.sv-ctm{font-size:8.5px;color:#5A6560;font-weight:600;pointer-events:none}
.sv-ctt{font-size:11px}
.sv-cst{font-size:9px;font-weight:600;color:#4a5651;pointer-events:none;line-height:1.2;
  text-align:center;word-break:keep-all}
.sv-tcst{font-size:10px;font-weight:600;color:#5A6560}
.sv-rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.draftbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--amber);
  background:var(--amberp);border:1px solid var(--amber);border-radius:9px;padding:8px 11px;margin-bottom:10px}
.fnp-wrap{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
  border:1px solid var(--ivd);border-radius:9px;padding:10px}
.fnp-grp{border-bottom:1px dashed var(--iv);padding-bottom:8px}
.fnp-grp:last-child{border-bottom:none;padding-bottom:0}
.fnp-gh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:900;color:var(--gd);cursor:pointer;margin-bottom:5px}
.fnp-cnt{font-size:10.5px;font-weight:700;color:var(--gm);background:var(--gp);border-radius:100px;padding:2px 8px}
.fnp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:3px 8px}
.fnp-it{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer;white-space:nowrap}
.fnp-gd{font-size:9px;font-weight:800;border-radius:6px;padding:1px 4px}
.fnp-gd.m{background:var(--m-bg,#E6F0FB);color:var(--m-tx,#2B6CB0)}
.fnp-gd.f{background:var(--f-bg,#FCE8F3);color:var(--f-tx,#D53F8C)}
.fnp-coop .fnp-gh{color:var(--goldd,#8a6410)}
.fnp-coopbadge{font-size:9.5px;font-weight:800;color:#8a6410;background:#F7EFD8;border-radius:100px;padding:2px 8px}
.fnp-gd.n{background:#EEF0EE;color:#6b756f}
.fnp-gd.gd-edit{cursor:pointer;box-shadow:0 0 0 1px rgba(30,57,50,.12)}
.fnp-gd.gd-edit:hover{box-shadow:0 0 0 1.5px var(--gm)}
.sv-rz::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:22px;height:3px;border-radius:2px;background:rgba(30,57,50,.25)}
.rv-cover{--gold:#B98A2F;--goldl:#D9B871;--serif:'Noto Serif KR',serif;
  border:2px solid var(--gd);border-radius:12px;padding:34px 20px;text-align:center;position:relative}
.rv-cover .cbig{font-family:var(--serif);font-size:27px;font-weight:900;color:var(--gd);
  letter-spacing:3px;line-height:1.45;word-break:keep-all}
.rv-cover .csub{font-size:12px;color:var(--gold);margin-top:10px;font-weight:800;letter-spacing:4px}
.rv-cover .cmeta{font-size:12.5px;color:var(--tx);margin-top:16px;line-height:2}
.rv-cover .clogo{height:52px;max-width:180px;object-fit:contain;display:block;margin:0 auto 14px}
/* 시안 1 — 클래식: 얇은 골드 안쪽 선 */
.rv-cover:not([class*="cv-"])::after{content:'';position:absolute;inset:7px;
  border:1px solid var(--goldl);border-radius:8px;pointer-events:none}
/* 시안 2 — 엘레강스: 이중 테두리 + 장식 */
.rv-cover.cv-elegant{border:1px solid var(--gd);border-radius:3px;padding:9px}
.cv-elegant .cinner{border:1px solid var(--goldl);border-radius:2px;padding:40px 22px 34px}
.cv-elegant .cdeco{font-size:10px;color:var(--gold);letter-spacing:9px;margin-bottom:16px}
.cv-elegant .cbig{font-size:29px;letter-spacing:5px}
.cv-elegant .csub{color:var(--ts);letter-spacing:5px}
.cv-elegant .cdeco-line{width:56px;height:1.5px;background:var(--gold);margin:18px auto;position:relative}
.cv-elegant .cdeco-line::before,.cv-elegant .cdeco-line::after{content:'◆';position:absolute;top:-6px;
  font-size:8px;color:var(--gold)}
.cv-elegant .cdeco-line::before{left:-16px}.cv-elegant .cdeco-line::after{right:-16px}
/* 시안 3 — 밴드: 상단 진초록 띠 */
.rv-cover.cv-band{border:none;border-radius:12px;overflow:hidden;padding:0;
  box-shadow:0 0 0 1px var(--ivd)}
.cv-band .cband{background:var(--gd);display:flex;align-items:center;justify-content:center;
  gap:12px;padding:14px 16px}
.cv-band .cband .clogo{height:34px;margin:0;background:#fff;border-radius:8px;padding:3px 7px}
.cv-band .cband-t{color:#fff;font-size:13.5px;font-weight:800;letter-spacing:3px}
.cv-band .cbody{padding:36px 18px 30px}
.cv-band .cbig{font-size:27px}
.cv-band .cfoot-line{height:6px;background:linear-gradient(90deg,var(--gd),var(--gold),var(--gd))}
.cv-band .cbig{font-size:28px}
.cv-band .csub{color:var(--gold)}
/* 시안 4 — 미니멀: 왼쪽 정렬 + 선 하나 */
.rv-cover.cv-minimal{border:none;border-radius:0;text-align:left;padding:30px 8px 22px}
.cv-minimal .clogo{margin:0 0 16px;height:44px}
.cv-minimal .csub{margin:0 0 6px;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
.cv-minimal .cbig{font-size:30px;line-height:1.25;letter-spacing:0}
.cv-minimal .cline{height:3px;width:96px;margin:20px 0 16px;
  background:linear-gradient(90deg,var(--gd) 60%,var(--gold) 60%)}
.cv-minimal .cbig{font-size:31px}
.cv-minimal .csub{color:var(--gold);letter-spacing:5px}
.cv-minimal .cmeta{margin-top:0}
/* 시안 5 — 그라데이션: 깊은 초록 물결 */
.rv-cover.cv-gradient{border:none;padding:48px 20px;
  background:radial-gradient(ellipse at 50% -10%,rgba(217,184,113,.18),transparent 55%),
    linear-gradient(150deg,#0F2C21,#1E5741 55%,#2d6a4f);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-gradient::before,.cv-gradient::after{content:'';position:absolute;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--goldl),transparent)}
.cv-gradient::before{top:14px}.cv-gradient::after{bottom:14px}
.cv-gradient .cbig{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.cv-gradient .csub{color:rgba(255,255,255,.85)}
.cv-gradient .cmeta{color:rgba(255,255,255,.92)}
.cv-gradient .cdot{color:#D9B871;font-size:13px;letter-spacing:8px;margin:12px 0 2px}

/* 시안 6 — 투톤: 하단 진초록 분할 */
.rv-cover.cv-duotone{border:none;padding:0;overflow:hidden;border-radius:12px;

.cv-duotone .cbody{background:#FBF7EE;padding:44px 18px 34px}
.cv-duotone .du-foot{background:var(--gd);padding:18px;border-top:2.5px solid var(--gold)}
.cv-duotone .du-foot .cmeta{color:#fff;margin-top:0}
/* 시안 7 — 티켓 */
.rv-cover.cv-ticket{border:none;padding:0;position:relative}
.cv-ticket .tk-in{border:2px dashed var(--gm);border-radius:14px;padding:34px 26px;background:var(--wh)}
.cv-ticket .tk-lb{display:inline-block;font-size:10px;font-weight:900;letter-spacing:4px;color:var(--gold);
  border:1px solid var(--goldl);border-radius:100px;padding:4px 16px;margin-bottom:16px;text-transform:uppercase}
.cv-ticket .tk-dash{border-top:1.5px dashed var(--ivd);margin:18px 30px}
.cv-ticket .tk-hole{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;

/* 시안 8 — 코너 프레임 */
.rv-cover.cv-corner{border:none;position:relative;padding:46px 24px}
.cv-corner .ck{position:absolute;width:36px;height:36px;border:0 solid var(--gold)}
.cv-corner .cbig{font-size:29px}
.cv-corner .ck.tl{top:8px;left:8px;border-top-width:4px;border-left-width:4px}
.cv-corner .ck.tr{top:8px;right:8px;border-top-width:4px;border-right-width:4px}
.cv-corner .ck.bl{bottom:8px;left:8px;border-bottom-width:4px;border-left-width:4px}
.cv-corner .ck.br{bottom:8px;right:8px;border-bottom-width:4px;border-right-width:4px}
/* 시안 9 — 리본 */
.rv-cover.cv-ribbon{border:none;padding:0;display:flex;overflow:hidden;border-radius:12px;
  box-shadow:0 0 0 1px var(--ivd);text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-ribbon .rb-bar{flex:0 0 14px;background:linear-gradient(180deg,#D9B871,#B98A2F)}
.cv-ribbon .rb-body{flex:1;padding:36px 26px;background:var(--wh)}
.cv-ribbon .clogo{margin:0 0 14px}
.cv-ribbon .csub{margin-top:0;letter-spacing:4px}
.cv-ribbon .cbig{margin-top:6px}
.cv-ribbon .cmeta{margin-top:16px}
/* 시안 10 — 인장 워터마크 */
.rv-cover.cv-seal{border:1px solid var(--ivd);position:relative;overflow:hidden;padding:48px 20px 44px}
.cv-seal::before{content:'';position:absolute;top:12px;left:14%;right:14%;height:5px;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.cv-seal .seal-wm{position:absolute;right:-16px;bottom:-16px;width:190px;opacity:.12;transform:rotate(-12deg);pointer-events:none}
.cv-seal .seal-body{position:relative}
/* 시안 11 — 아웃라인 */
.rv-cover.cv-outline{border:none;position:relative;padding:52px 20px 40px;overflow:hidden}
.cv-outline .cbig-ghost{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  font-size:52px;font-weight:900;letter-spacing:6px;white-space:nowrap;
  color:transparent;-webkit-text-stroke:1.5px var(--gp);pointer-events:none}
.cv-outline .cbig{position:relative}
/* 시안 12 — 보태닉 */
.rv-cover.cv-botanic{border:1.5px solid #CBB98F;background:#FBF7EE;position:relative;padding:44px 22px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-botanic .bt{position:absolute;font-size:30px;color:#9BB59B}
.cv-botanic .bt.tl{top:10px;left:14px}
.cv-botanic .bt.br{bottom:10px;right:14px;transform:rotate(180deg)}
.cv-botanic .cdeco{color:var(--gold);font-size:13px;margin-bottom:12px;letter-spacing:4px}
.cv-botanic .cbig{letter-spacing:4px}
/* 시안 13 — 포스터: 배경 이미지 + 어두운 베일 */
.rv-cover.cv-poster{border:none;border-radius:12px;overflow:hidden;position:relative;
  background-size:cover;background-position:center;background-color:#1E3932;
  padding:0;min-height:280px;display:flex;align-items:stretch;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-poster .po-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,20,.25),rgba(10,25,20,.72))}
.cv-poster .po-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding:40px 24px 30px}
.cv-poster .cbig{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cv-poster .csub{color:rgba(255,255,255,.88)}
.cv-poster .cmeta{color:rgba(255,255,255,.95)}
.cv-poster .clogo{background:rgba(255,255,255,.92);border-radius:10px;padding:5px 9px;margin:0 auto 10px}
/* 표지 편집창 미리보기 */
.cv-pv{border:1.5px dashed var(--ivd);border-radius:12px;padding:10px;background:var(--iv);
  max-height:320px;overflow-y:auto;zoom:.62}
/* 예산 편집기 — 구분 관리·드래그·병합·소계 */
.bg-cats{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px;
  background:var(--iv);border-radius:10px;padding:7px 10px}
.bg-cats-lb{font-size:11.5px;font-weight:900;color:var(--gd);margin-right:2px}
.bg-cat-chip{font-size:11.5px;font-weight:800;color:var(--gm);background:var(--wh);
  border:1px solid var(--ivd);border-radius:100px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px}
.bg-cat-chip i{font-style:normal;font-size:9px;color:var(--tl);cursor:pointer;font-weight:900}
.bg-cat-chip i:hover{color:var(--red)}
.bg-catsel{min-width:86px;padding:6px 6px;font-size:12px}
.bg-drag{cursor:grab;text-align:center;color:var(--tl);font-size:13px;user-select:none;touch-action:none;width:26px}
.bg-drag:active{cursor:grabbing}
tr.bg-dragging{opacity:.55;outline:2px dashed var(--gm)}
.bg-same{font-size:11px;color:var(--tl);font-weight:700}
.tb-cell{position:relative}
.tb-cell input{padding-right:22px}
.tb-mg{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:17px;height:17px;
  border:1px solid var(--ivd);border-radius:5px;background:var(--wh);color:var(--tl);
  font-size:9px;font-weight:900;cursor:pointer;line-height:1;padding:0}
.tb-mg:hover{border-color:var(--gm);color:var(--gm)}
.tb-mg.on{background:var(--gp);border-color:var(--gm);color:var(--gm)}
.tb-merged{background:var(--iv)}
.bg-mg.on{background:var(--gp);border-color:var(--gm);color:var(--gm)}
tr.bg-subrow td{background:#F4F1E4}
.bg-sublb{font-weight:900;color:#8a6410}
.bg-subhint{font-size:10px;color:#b09a5e;text-align:right;padding-right:8px}
tr.bg-subrow .bg-amt{color:#8a6410}
/* 발행 표 — 병합·소계 */
.rv-tb td.mg{vertical-align:middle;background:#F7FAF8 !important;border-right:1px solid var(--ivd)}
.rv-tb tr.subrow td{background:#F4F1E4 !important;border-top:1.5px solid var(--gm)}
.rv-tb .sub-lb{font-weight:900;color:#8a6410;text-align:right;padding-right:10px}
.rv-tb tr.subrow .acc b{font-weight:900;color:#8a6410}
/* 회계식 정렬 — ₩ 왼쪽 고정, 숫자 오른쪽 정렬(고정폭 숫자), 수량·단위 분리 */
.rv-tb th.thr{text-align:right}
.rv-tb td.num{padding-right:9px}

/* ═══ 📱 좁은 화면 표 개선 (발행 보기 전용 · 인쇄는 표 그대로) ═══ */
/* ① 공통: 단어 단위 줄바꿈 — 「2학년」이 중간에 끊기지 않는다 */
.rv-tb td, .rv-kv td, .rv-ag td, .rv-t, .rv-note, .rv-red{word-break:keep-all;overflow-wrap:break-word}
/* ② 명단 2단 · 연락처 카드 (좁은 화면에서만 표 대신 표시) */
.rv-tb td.nwc{white-space:nowrap}
.m-alt{display:none}
.m-hint{display:none;font-size:10.5px;color:var(--tl);margin-top:4px;text-align:right}
.m-roster .mr-row{padding:9px 2px;border-bottom:1px solid var(--iv)}
.m-roster .mr-row:nth-child(even){background:#F3F7F4}
.m-roster .mr-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.m-roster .mr-g{font-size:12px;font-weight:900;color:#fff;background:var(--gm);border-radius:7px;padding:3px 9px;white-space:nowrap}
.m-roster .mr-g.sum{background:var(--gd)}
.m-roster .mr-c{font-size:11.5px;font-weight:800;color:var(--gd)}
.m-roster .mr-n{font-size:12.5px;line-height:1.75;padding:0 2px;word-break:keep-all}
.m-roster .mr-x{font-size:11.5px;color:var(--ts);margin-top:3px;word-break:keep-all}
.m-cards{flex-direction:column;gap:8px}
.m-cards .mc{border:1px solid var(--ivd);border-radius:11px;padding:10px 12px;background:#FDFDFB}
.m-cards .mc+.mc{margin-top:8px}
.m-cards .mc-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.m-cards .mc-name{font-size:13.5px;font-weight:900;color:var(--gd)}
.m-cards .mc-role{font-size:10px;font-weight:800;color:var(--gm);background:var(--gp);border-radius:100px;padding:2px 8px}
.m-cards .mc-l{font-size:12px;color:var(--ts);line-height:1.6;margin-top:2px;word-break:keep-all}
.m-cards .mc-l b{color:var(--gd);font-weight:800}
.m-cards .mc-tel{display:inline-block;font-size:12.5px;font-weight:800;color:var(--gm);text-decoration:none;
  border:1px solid var(--gl);background:var(--gp);border-radius:8px;padding:4px 10px;margin-top:6px}
/* 💳 계좌 복사 버튼 */
.kv-copy{margin-left:6px;font-size:10.5px;font-weight:800;color:var(--gm);background:var(--gp);
  border:1px solid var(--gl);border-radius:7px;padding:2px 8px;cursor:pointer;vertical-align:1px;
  font-family:inherit;white-space:nowrap}
.kv-copy.ok{color:#fff;background:var(--gm);border-color:var(--gm)}
/* 💰 예산 표: 글자 단위 쪼개짐 방지 + 좁은 화면에서 숫자 열 압축 */
.rv-tb.rv-bg td{overflow-wrap:normal}
.rv-tb.rv-bg td.mg{word-break:keep-all;min-width:3.2em}
@media (max-width:640px){
  .rv-tb.rv-bg{font-size:11px}
  .rv-tb.rv-bg th,.rv-tb.rv-bg td{padding:6px 4px}
  .rv-tb.rv-bg .acc{min-width:0;gap:2px;justify-content:flex-end}
  .rv-tb.rv-bg .acc i{font-size:9px}
  .rv-tb.rv-bg .accq{min-width:0;gap:2px;white-space:nowrap}
  .rv-tb.rv-bg .accq i{width:auto;font-size:9px}
  .rv-tb.rv-bg .sub-lb{white-space:nowrap}
}
@media (max-width:640px){
  .tbwrap.has-malt>.rv-tbwrap{display:none}
  .tbwrap.has-malt>.m-alt{display:block}
  .m-hint{display:block}
  .rv-kv th{max-width:32vw;white-space:normal;word-break:keep-all}
}
@media print{
  .m-alt, .m-hint, .kv-copy{display:none !important}
  .tbwrap.has-malt>.rv-tbwrap{display:block !important}
}
.acc{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:88px}
.acc i{font-style:normal;font-size:10px;color:var(--ts);font-weight:700}
.acc b{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.2px}

.accq i{font-style:normal;font-size:10px;color:var(--ts);width:26px;text-align:left}
.sumrow .acc b,.hlrow .acc b{font-weight:900}
/* 편집창 줄별 소계 */
.ed-tbl td.bg-amt{text-align:right;font-size:12px;font-weight:800;color:var(--gm);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px;min-width:92px}
/* ── 배정 빌더 (조·차량·숙소) ── */
.ag-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ag-sum{font-size:11.5px;font-weight:800;color:var(--gm);margin-left:auto}
.ag-wrap{display:flex;gap:14px;align-items:flex-start;min-height:300px}
.ag-pool{flex:0 0 344px;border:1.5px dashed var(--ivd);border-radius:13px;padding:12px;background:var(--iv);
  position:sticky;top:0;max-height:calc(95vh - 300px);overflow-y:auto}
.ag-ph{font-size:12.5px;font-weight:900;color:var(--gd);margin-bottom:6px;display:flex;gap:6px;align-items:center}
#ag-pool{display:block}
.ag-psum{font-size:11.5px;color:var(--ts);line-height:1.9;margin-bottom:9px;
  background:var(--wh);border:1px solid var(--ivd);border-radius:10px;padding:7px 10px}
.ag-psum b{color:var(--gd);font-weight:900}
.ag-psum i{font-style:normal;font-size:10px;color:var(--tl)}
.ag-psum .sep{margin:0 6px;color:var(--ivd)}
.ag-units{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px;
  max-height:calc(95vh - 300px);overflow-y:auto;padding-right:2px}
.ag-unit{border:2px solid var(--ivd);border-radius:14px;padding:13px 14px;background:var(--wh);min-height:280px;
  display:flex;flex-direction:column}
.ag-unit .ag-us{flex:1}
.ag-uh2.ag-tus{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:stretch}
.ag-uh2.ag-tus .ed-mini{min-height:68px;border-radius:12px;border-style:dashed}
.ag-uh2.ag-tus .ag-gauge{align-self:center;justify-self:end;grid-column:-2/-1}
.ag-unit.drop{cursor:copy;border-color:var(--gm);box-shadow:0 0 0 1px var(--gp)}
.ag-uh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.ag-uname{font-family:inherit;font-size:16px;font-weight:900;color:var(--gd);border:none;
  border-bottom:1.5px dashed var(--ivd);background:none;width:100px;padding:3px 1px;outline:none}
.ag-uname:focus{border-bottom-color:var(--gm)}
.ag-cnt{font-size:12px;font-weight:800;color:var(--gm);background:var(--gp);border-radius:100px;padding:4px 11px;margin-left:auto}
.ag-uh2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.ag-unit .ed-mini{font-size:13px;padding:8px 13px;border-radius:10px;border-width:1.5px}
.ag-unit .ag-uh .ed-mini{font-size:12px;padding:5px 10px}
.ag-gauge{font-size:13px;font-weight:900;color:var(--gm);background:var(--gp);border-radius:100px;padding:5px 12px}
.ag-gauge.over{color:#fff;background:var(--red)}
.ag-caps{display:flex;gap:3px;align-items:center}
.ag-caps b{font-size:10px;font-weight:800;border:1px solid var(--ivd);border-radius:100px;padding:2px 6px;
  cursor:pointer;color:var(--ts);background:var(--wh)}
.ag-caps b.on{background:var(--gm);border-color:var(--gm);color:#fff}
.ag-gsel{width:64px;flex:none;padding:4px 5px;font-size:11.5px}
.ag-min{flex:1;min-width:90px;padding:5px 7px;font-size:11.5px}
.ag-us{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  min-height:150px;padding-top:4px;align-content:start}
.ag-hint{font-size:12px;color:var(--tl);padding:6px 0}
.ag-pgh{font-size:13px;font-weight:900;color:var(--gd);margin:10px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.ag-pgh span{font-size:10.5px;font-weight:700;color:var(--tl)}
.ag-pgrp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ag-pool.dropover{border-color:var(--gm);background:var(--gp)}
.ag-unit.dropover{border-color:var(--gm);box-shadow:0 0 0 2px var(--gm);background:var(--gp)}
.ag-ghost{position:fixed;z-index:999;pointer-events:none;background:var(--gd);color:#fff;
  font-size:14px;font-weight:800;border-radius:12px;padding:9px 17px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ag-stu{touch-action:none}
.ag-stu,.ag-tch{font-family:inherit;border:2px solid var(--ivd);border-radius:12px;background:var(--wh);
  cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:11px 6px 9px;min-height:68px;position:relative;box-shadow:0 2px 5px rgba(30,57,50,.08)}
.ag-stu:active,.ag-tch:active{cursor:grabbing}
.ag-stu .n,.ag-tch .n{font-size:15px;font-weight:900;color:var(--tx);line-height:1.15;word-break:keep-all}
.ag-stu .meta,.ag-tch .meta{display:flex;align-items:center;gap:4px}
.ag-stu .fnp-gd{font-size:10px;padding:2px 7px}
.ag-stu b,.ag-tch b{font-size:10px;font-weight:900;color:var(--ts);background:var(--iv);border-radius:6px;padding:2px 6px}
.ag-stu i,.ag-tch i{font-style:normal;position:absolute;top:3px;right:5px;font-size:12px;color:var(--red);font-weight:900}
.ag-tch{border-color:#D9B871;background:#FDFAF2}
.ag-drvbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ag-drvlb{font-size:12.5px;font-weight:800;color:var(--gd);background:var(--gp);border-radius:100px;padding:5px 12px}
.ag-drvlb b{color:var(--gm)}
.ag-drv{position:absolute;top:3px;left:5px;font-size:13px;cursor:pointer;opacity:.35;filter:grayscale(1)}
.ag-drv:hover{opacity:.8;filter:none}
.ag-drv.on{opacity:1;filter:none}
.ag-tch.drv{border-color:var(--gm);background:var(--gp);box-shadow:0 0 0 2px var(--gm)}
.ag-tch .n{color:#7a5a14}
.ag-tch b{background:#F4E9CC;color:#8a6410}
.ag-stu.sel{border-color:var(--gm);background:var(--gp);box-shadow:0 0 0 2.5px var(--gm)}
.ag-stu.warn{border-color:var(--red);background:var(--redp,#FDECEC)}
/* 배정 발행 표 */
.rv-ag{width:100%;border-collapse:collapse;font-size:11.5px}
.rv-ag tr:nth-child(even) td{background:#F3F7F4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rv-ag th{background:var(--gd);color:#fff;font-weight:800;padding:6px 7px;text-align:center;font-size:11px}
.rv-ag th small{font-weight:600;opacity:.85}
.rv-ag th.tch{background:var(--gm)}
.rv-ag td{border:1px solid var(--ivd);padding:5px 7px;vertical-align:top;line-height:1.7}
.rv-ag td.c{text-align:center}
.rv-ag td.lb{background:var(--iv);font-weight:800;color:var(--ts);text-align:center;white-space:nowrap}
.rv-ag td small{font-size:9.5px;color:var(--ts)}
/* 표지 시안 고르기 카드 (편집기) */
.cv-styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.cv-sty{border:1.5px solid var(--ivd);border-radius:10px;padding:9px 11px;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;background:var(--wh)}
.cv-sty input{display:none}
.cv-sty b{font-size:12.5px;color:var(--gd)}
.cv-sty span{font-size:10.5px;color:var(--ts)}
.cv-sty.on{border-color:var(--gm);background:var(--gp);box-shadow:0 0 0 1px var(--gm)}
.rv-note{font-size:11.5px;color:var(--ts);margin-top:7px;white-space:pre-wrap;line-height:1.6}

/* ═══ 모달 ═══ */
.mbk{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--wh);border-radius:15px;width:100%;max-width:600px;max-height:90vh;

function renderScheduleV2(d){

      <tr><td class="lb">교사</td>${units.map(u=>`<td class="c">${esc(String(u.tN||'').split(',').map(x=>x.trim()).filter(n=>n&&n!==u.drvN).join(', '))}</td>`).join('')}</tr>
      <tr><td class="lb">학생 <small>${units.reduce((a,u)=>a+u.students.length,0)}명</small></td>
        ${units.map(u=>`<td class="stu">${u.students.map(nm).join('<br>')||''}</td>`).join('')}</tr>
    </table></div>`;
  } else if(d.kind==='lodging'){
    core=`${d.info?`<div class="rv-t" style="margin-bottom:8px">${esc(d.info)}</div>`:''}
      <div style="overflow-x:auto"><table class="rv-ag rows">
      <tr><th>호실</th><th>담당</th><th>성</th><th>구분</th><th>명단</th><th>비고</th></tr>
      ${units.map(u=>`<tr>
        <td class="c"><b>${esc(u.name||'')}</b></td>
        <td class="c">${esc(u.tN||'')}</td>
        <td class="c"><span class="fnp-gd ${u.gender==='남'?'m':u.gender==='여'?'f':''}">${esc(u.gender||'')}</span></td>
        <td class="c">${esc(u.label||'')}</td>
        <td>${u.students.map(nm).join(', ')}</td>
        <td class="c">${esc(u.memo||'')}</td></tr>`).join('')}
    </table></div>`;
  } else {
    const maxR=Math.max(...units.map(u=>u.students.length),0);
    core=`<div style="overflow-x:auto"><table class="rv-ag">
      <tr>${units.map(u=>`<th class="tch">${esc(u.tN||'')}</th>`).join('')}</tr>
      <tr>${units.map(u=>`<th>${esc(u.name||'')} <small>(${u.students.length}명)</small></th>`).join('')}</tr>
      ${[...Array(maxR)].map((_,r)=>`<tr>${units.map(u=>
        `<td class="c">${u.students[r]?nm(u.students[r]):''}</td>`).join('')}</tr>`).join('')}
    </table></div>`;
  }
  return core + (d.note?`<div class="rv-note">${esc(d.note)}</div>`:'');
}
/* 💳 계좌 줄이면 번호 복사 버튼을 붙인다 (라벨에 「계좌」 + 값에 숫자 7자리 이상) */
function acctCopyBtn(label, val){
  if(!/계좌/.test(String(label||''))) return '';
  const m=String(val||'').match(/\d[\d\s-]{5,}\d/);
  if(!m) return '';
  const digits=m[0].replace(/\D/g,'');
  if(digits.length<7) return '';
  return ` <button type="button" class="kv-copy" data-acct="${digits}">📋 복사</button>`;
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('.kv-copy'); if(!b) return;
  const t=b.dataset.acct||'';
  try{ await navigator.clipboard.writeText(t); }
  catch(_){ const ta=document.createElement('textarea'); ta.value=t;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if(b.dataset.o==null) b.dataset.o=b.textContent;
  b.textContent='복사됨 ✓'; b.classList.add('ok');
  setTimeout(()=>{ b.textContent=b.dataset.o; b.classList.remove('ok'); },1600);
});
window.addEventListener('beforeprint', ()=>{
  // ⏰ 시간계획이 한 장을 넘으면 그 표만 살짝 줄여 한 장에 맞춘다
  document.querySelectorAll('.rv-tg').forEach(tg=>{
    const bd = tg.querySelector('.tg-bd');
    const h = (parseFloat(bd && bd.style.height) || 0) + 34;
    const MAX = 950;
    tg.style.zoom = h > MAX ? Math.max(.6, MAX/h).toFixed(3) : '';
  });
});
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('.rv-tg').forEach(tg=>{ tg.style.zoom=''; });
});


/* 📊 게시 링크 조회 기록 — 관리자(수퍼)만 열람. 실패해도 화면에 영향 없음 */
async function logShareView(kind, shareId, title){
  try{
    let ip='';
    try{
      const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 2500);
      const r = await fetch('https://api.ipify.org?format=json', {signal:ctl.signal});
      ip = (await r.json()).ip || '';
    }catch(_){/* IP는 참고 정보 — 못 얻어도 기록은 남긴다 */}
    const ua = navigator.userAgent || '';
    const os = /iPhone|iPad|iPod/.test(ua)?'iOS' : /Android/.test(ua)?'Android'
             : /Macintosh/.test(ua)?'Mac' : /Windows/.test(ua)?'Windows' : '기타';
    const mob = /Mobi|Android|iPhone|iPad/.test(ua);
    await addDoc(collection(db,'shareViewLogs'), {
      kind, shareId: String(shareId||''), title: String(title||'').slice(0,80),
      at: serverTimestamp(), ip,
      device: os + (mob?' · 모바일':' · PC'),
      ua: ua.slice(0,300),
      lang: navigator.language || '',
      scr: (screen&&screen.width) ? screen.width+'×'+screen.height : '',
      ref: String(document.referrer||'').slice(0,200)
    });
  }catch(_){/* 조회 기록 실패는 무시 */}
}

        <div class="cbig">${esc(d.big||'')}</div>
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cdeco-line"></div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    if(st==='minimal') return `<div class="rv-cover cv-minimal">
      ${logo}
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cbig">${esc(d.big||'')}</div>
      <div class="cline"></div>
      <div class="cmeta">${meta}</div></div>`;
    if(st==='gradient') return `<div class="rv-cover cv-gradient">
      ${logo}
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cbig">${esc(d.big||'')}</div>
      <div class="cdot">✦</div>
      <div class="cmeta">${meta}</div></div>`;
    if(st==='ticket') return `<div class="rv-cover cv-ticket">
      <div class="tk-in">
        ${logo}
        <div class="tk-lb">ADMIT · ${esc(d.sub||'가정통신문')}</div>
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="tk-dash"></div>
        <div class="cmeta">${meta}</div>
      </div>
      <span class="tk-hole l"></span><span class="tk-hole r"></span></div>`;
    if(st==='corner') return `<div class="rv-cover cv-corner">
      <span class="ck tl"></span><span class="ck tr"></span><span class="ck bl"></span><span class="ck br"></span>
      ${logo}
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div></div>`;
    if(st==='ribbon') return `<div class="rv-cover cv-ribbon">
      <div class="rb-bar"></div>
      <div class="rb-body">
        ${logo}
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    if(st==='seal'){
      const sealSrc = d.logo==='daniel' ? 'stamp-daniel.png'
                    : d.logo==='jihyebit' ? 'stamp-jihyebit.png'
                    : d.logo==='url' ? (d.logoUrl||'') : '';
      return `<div class="rv-cover cv-seal">
      ${sealSrc?`<img class="seal-wm" src="${esc(sealSrc)}" alt="">`:''}
      <div class="seal-body">
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    }
    if(st==='duotone') return `<div class="rv-cover cv-duotone">
      <div class="cbody">
        ${logo}
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
      </div>
      <div class="du-foot"><div class="cmeta">${meta}</div></div></div>`;
    if(st==='outline') return `<div class="rv-cover cv-outline">
      ${logo}
      <div class="cbig-ghost">${esc(d.big||'')}</div>
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div></div>`;
    if(st==='poster'){
      const bg = d.bgUrl ? `background-image:url('${esc(d.bgUrl)}')` : '';
      return `<div class="rv-cover cv-poster" style="${bg}">
      <div class="po-veil"></div>
      <div class="po-body">
        ${logo}
        ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
        <div class="cbig">${esc(d.big||'')}</div>
        <div class="cmeta">${meta}</div>
      </div></div>`;
    }
    if(st==='botanic') return `<div class="rv-cover cv-botanic">
      <span class="bt tl">❦</span><span class="bt br">❦</span>
      ${logo}
      <div class="cdeco">— ❧ —</div>
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div></div>`;
    return `<div class="rv-cover">
      ${logo}
      <div class="cbig">${esc(d.big||'')}</div>
      ${d.sub?`<div class="csub">${esc(d.sub)}</div>`:''}
      <div class="cmeta">${meta}</div>
    </div>`;
  }
  if(b.type === 'text'){
    if(!d.body && !d.red) return '';
    return `${d.body?`<div class="rv-t">${esc(d.body)}</div>`:''}
      ${d.red?`<div class="rv-red">${esc(d.red)}</div>`:''}`;
  }
  if(b.type === 'kv'){
    const rows = (d.rows||[]).filter(r=>r.k||r.v);
    if(!rows.length) return '';
    return `<table class="rv-kv">${rows.map(r=>
      `<tr><th>${esc(r.k)}</th><td>${esc(r.v)}${acctCopyBtn(r.k, r.v)}</td></tr>`).join('')}</table>
      ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
  }
  if(b.type === 'table'){
    const cols = d.cols||[], rows = (d.rows||[]).filter(r=>(r.c||[]).some(x=>x));
    if(!rows.length) return '';
    const MG='⤴';
    // 셀에 ⤴ 표시가 있으면 위 칸과 세로 병합 — 열마다 따로 이어진다
    const span=(ri,ci)=>{ let n=1;
      while(rows[ri+n] && (rows[ri+n].c||[])[ci]===MG) n++;
      return n; };
    const nm = s=>String(s||'').replace(/\s+/g,'');
    const oneLine = s=>esc(String(s||'').replace(/\s*\n\s*/g,' '));
    // 📱 좁은 화면 대체 뷰 판별 — 병합(⤴)이 있으면 표 그대로 둔다
    const hasMG = rows.some(r=>(r.c||[]).includes(MG));
    const phoneIdx = cols.findIndex(c=>/연락처|전화/.test(nm(c)));
    const isRoster = !hasMG && phoneIdx<0 && cols.length>=2 && cols.length<=4 &&
      /학년|반$/.test(nm(cols[0])) && cols.some(c=>/명단|이름/.test(nm(c)));
    const isCards  = !hasMG && phoneIdx>=0 && cols.length>=2;
    const cntIdx = cols.findIndex((c,i)=>i>0 && /인원|^명$/.test(nm(c)));
    const listIdx = cols.findIndex(c=>/명단|이름/.test(nm(c)));
    // 명단표의 학년·인원 칸은 줄바꿈 없이 한 줄로 (화면·인쇄 공통)
    const nw = new Set(isRoster ? [0, cntIdx].filter(i=>i>=0) : []);
    // 🎨 표 무늬 — 병합 표는 줄무늬도 «묶음 단위»로 통일 (홀수 줄 묶음이어도 안 어긋난다)
    const tst = d.tstyle || (hasMG ? 'band' : 'zebra');
    const thm = d.ttheme || 'green';
    const mgCnt = cols.map((_,ci)=>rows.reduce((a,r)=>a+(((r.c||[])[ci]===MG)?1:0),0));
    const bandCol = ((tst==='band'||tst==='zebra') && hasMG) ? mgCnt.indexOf(Math.max(...mgCnt)) : -1;
    let __gi = -1;
    const zc = cols.map(()=>0);   // 🦓 열별 «보이는 칸» 순번 — 병합 덩어리도 칸 단위로 번갈아 칠한다
    const body=rows.map((r,ri)=>{
      if(bandCol>=0 && (r.c||[])[bandCol]!==MG) __gi++;
      return `<tr${bandCol>=0?` class="band${__gi%2}"`:''}>${cols.map((_,ci)=>{
      const v=(r.c||[])[ci]||'';
      if(v===MG) return '';                                  // 위 칸이 rowspan으로 덮는다
      const n=span(ri,ci);
      const zcls = (tst==='zebra' && !hasMG) ? ('zc'+((zc[ci]++)%2)) : '';   // 병합 표는 tr 묶음색이 담당
      const cls=[n>1?'mg':'', nw.has(ci)?'nwc':'', zcls].filter(Boolean).join(' ');
      return `<td${n>1?` rowspan="${n}"`:''}${cls?` class="${cls}"`:''}>${esc(v)}</td>`;
    }).join('')}</tr>`;}).join('');
    let malt='';
    if(isRoster){
      // 명단표: 「학년 배지 + 인원」 한 줄 / 「이름들」 한 줄로 쌓는다
      malt = `<div class="m-alt m-roster">${rows.map(r=>{
        const c=r.c||[]; const g=String(c[0]||''); const sum=/합계|총계/.test(nm(g));
        const extra=cols.map((cl,i)=>(i===0||i===cntIdx||i===listIdx||!(c[i]))?'':
          `<div class="mr-x"><b>${esc(cl)}</b> ${oneLine(c[i])}</div>`).join('');
        return `<div class="mr-row"><div class="mr-h"><span class="mr-g${sum?' sum':''}">${oneLine(g)}</span>${
          cntIdx>=0&&c[cntIdx]?`<span class="mr-c">${oneLine(c[cntIdx])}</span>`:''}</div>${
          listIdx>=0&&c[listIdx]?`<div class="mr-n">${oneLine(c[listIdx])}</div>`:''}${extra}</div>`;
      }).join('')}</div>`;
    } else if(isCards){
      // 연락처·병원 등: 카드 + 전화 바로 걸기
      const ni=cols.findIndex(c=>/이름|성명|병원|기관|장소/.test(nm(c)));
      const nameIdx=ni>=0?ni:0;
      const roleIdx=cols.findIndex((c,i)=>i!==nameIdx && /구분|직책|역할/.test(nm(c)));
      malt = `<div class="m-alt m-cards">${rows.map(r=>{
        const c=r.c||[];
        const phRaw=String(c[phoneIdx]||'');
        const tel=(phRaw.match(/0\d{1,2}[- ]?\d{3,4}[- ]?\d{4}/)||[])[0]||'';
        const lines=cols.map((cl,i)=>(i===nameIdx||i===roleIdx||i===phoneIdx||!(c[i]))?'':
          `<div class="mc-l"><b>${esc(cl)}</b> ${oneLine(c[i])}</div>`).join('');
        return `<div class="mc"><div class="mc-t"><span class="mc-name">${oneLine(c[nameIdx]||'')}</span>${
          roleIdx>=0&&c[roleIdx]?`<span class="mc-role">${oneLine(c[roleIdx])}</span>`:''}</div>${lines}${
          tel?`<a class="mc-tel" href="tel:${tel.replace(/[^0-9]/g,'')}">📞 ${esc(tel)}</a>`
             :(phRaw?`<div class="mc-l">${oneLine(phRaw)}</div>`:'')}</div>`;
      }).join('')}</div>`;
    }
    const hint = (!malt && cols.length>=5) ? `<div class="m-hint">↔ 표가 넓어요 — 옆으로 밀어 보세요</div>` : '';
    return `<div class="tbwrap${malt?' has-malt':''}">
      <div class="rv-tbwrap" style="overflow-x:auto"><table class="rv-tb st-${tst} th-${thm}">
      <tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
      ${body}
    </table></div>${hint}${malt}</div>
    ${d.note?`<div class="rv-note">${esc(d.note)}</div>`:''}`;
  }
  if(b.type === 'budget') return renderBudget(d);
  if(b.type === 'schedule') return renderSchedule(d);
  if(b.type === 'assign') return renderAssign(d);
  return '';
}

    // 인쇄에서 표지가 있으면 제목줄을 숨기고 표지가 첫 장을 통째로 쓰게 한다
    if(blocks.some(b=>b && b.type==='cover' && b.data && (b.data.big||b.data.period||b.data.place))) document.body.classList.add('has-cover');
  } catch(e){ V.innerHTML = `<div class="sh-empty">불러올 수 없습니다.<br><small>${esc(e.message)}</small></div>`; }
}
boot();
</script>

<script>
/* 학부모 사이트에서 넘어온 경우(pfrom=daniel|jihyebit) 맨 위에 «학부모 홈으로» 복귀 바를 띄운다 */
(function(){
  try{
    var p = new URLSearchParams(location.search).get('pfrom');
    if(p!=='daniel' && p!=='jihyebit') return;
    var col = p==='jihyebit' ? '#5E4B8B' : '#0C2A44';
    var bar = document.createElement('a');
    bar.href = 'https://artist4rhythm-hub.github.io/daniel-parents/home-'+p+'.html';
    bar.textContent = '← 학부모 홈으로 돌아가기';
    bar.style.cssText = 'position:sticky;top:0;z-index:9999;display:block;background:'+col+
      ';color:#fff;text-align:center;padding:11px 14px;font-size:13.5px;font-weight:800;text-decoration:none;font-family:inherit';
    document.body.insertBefore(bar, document.body.firstChild);
  }catch(e){}
})();
</script>
