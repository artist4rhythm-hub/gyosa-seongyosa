<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아리 현황 · 교사 선교사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
:root{
  --cs-pt:#0C2A44; --cs-pt2:#1E4B74; --cs-gold:#D8B45A;
  --cs-cream:#FBFAF7; --cs-ink:#22262B; --cs-ink2:#5A5F66; --cs-ink3:#8A8F98;
  --cs-line:#E7E4DC; --cs-row:#FAF9F4; --cs-wh:#FFFFFF;
  --ac-bg:#EDEEF0; --ac-ink:#5B6068; --ac-line:#D8DADF;
}
#cs{max-width:560px;margin:0 auto;padding:14px 12px 90px;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--cs-ink)}
body.share-mode{background:#EFEDE7}
body.share-mode #tb,body.share-mode #sb{display:none!important}

.ph{background:linear-gradient(135deg,var(--cs-pt) 0%,var(--cs-pt2) 100%);border-radius:14px;color:#fff;
  padding:14px 16px;display:flex;align-items:center;gap:11px;margin-bottom:10px}
.ph .em{font-size:22px}
.ph b{font-size:15px;font-weight:900;display:block;letter-spacing:-.01em}
.ph span{font-size:11px;opacity:.75;font-weight:500}
.ph .yr{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.14);border-radius:8px;padding:3px 9px;
  font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools select{padding:7px 9px;border:1.5px solid var(--cs-line);border-radius:10px;font-family:inherit;
  font-size:12.5px;font-weight:800;background:var(--cs-wh);color:var(--cs-ink)}
.tb-btn{padding:7px 12px;border:1.5px solid var(--cs-line);border-radius:10px;background:var(--cs-wh);
  font-family:inherit;font-size:12px;font-weight:800;color:var(--cs-ink2);cursor:pointer}
.tb-btn.pr{background:var(--cs-pt);border-color:var(--cs-pt);color:#fff}
.pubnote{font-size:10.5px;color:var(--cs-ink3);width:100%}

.secT{font-size:13.5px;font-weight:900;color:var(--cs-ink);margin:16px 2px 8px;display:flex;align-items:center;gap:7px}
.secT .mini{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--cs-ink3);cursor:pointer}

/* A-1 카드 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ccard{background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:12px;padding:11px 12px;cursor:pointer}
.ccard .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.ccard b{font-size:13px;font-weight:900;letter-spacing:-.01em}
.ccard .m{font-size:10.8px;color:var(--cs-ink2);margin-top:4px;font-weight:600}
.ccard .n{font-size:10.8px;color:var(--cs-ink3);margin-top:2px;font-weight:700}
.ccard .n em{font-style:normal;color:var(--cs-pt);font-weight:900}
.ccard.open{grid-column:1/-1;border-color:#CFE0F2;box-shadow:0 2px 10px rgba(12,42,68,.08)}
.roster{margin-top:9px;padding-top:9px;border-top:1px dashed var(--cs-line);display:flex;flex-wrap:wrap;gap:5px}
.stu{font-size:10.8px;font-weight:800;color:var(--cs-ink);background:var(--cs-row);border:1px solid var(--cs-line);
  border-radius:8px;padding:3px 8px}
.stu i{font-style:normal;font-weight:600;color:var(--cs-ink3);font-size:9.8px;margin-left:3px}
.roster .none{font-size:10.8px;color:var(--cs-ink3);font-weight:600}

/* 달력 공통 */
.mtabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.mtab{flex:1;min-width:52px;text-align:center;font-size:12px;font-weight:800;color:var(--cs-ink3);
  background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:10px;padding:7px 0;cursor:pointer}
.mtab.on{background:var(--cs-pt);color:#fff;border-color:var(--cs-pt)}
.vsw{display:flex;gap:0;border:1.5px solid var(--cs-line);border-radius:10px;overflow:hidden;margin-left:auto}
.vsw button{border:0;background:var(--cs-wh);font-family:inherit;font-size:11.5px;font-weight:800;
  color:var(--cs-ink3);padding:6px 11px;cursor:pointer}
.vsw button.on{background:var(--cs-pt);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--cs-ink2);
  background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:999px;padding:3px 9px;cursor:pointer;user-select:none}
.lg .dot{width:8px;height:8px;border-radius:50%}
.lg.off{opacity:.35;text-decoration:line-through}
.lg.ac{background:var(--ac-bg);color:var(--ac-ink);border-color:var(--ac-line);cursor:default}

/* B-1 월 그리드 */
.cal{background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:13px;overflow:hidden}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);background:var(--cs-pt)}
.cal .wk div{font-size:10px;font-weight:800;color:#fff;text-align:center;padding:5px 0;opacity:.9}
.row7{display:grid;grid-template-columns:repeat(7,1fr)}
.cd{min-height:66px;border-top:1px solid var(--cs-line);border-right:1px solid var(--cs-line);
  padding:3px 3px 4px;cursor:pointer;background:var(--cs-wh)}
.cd:nth-child(7n){border-right:0}
.cd .dn{font-size:10px;font-weight:800;color:var(--cs-ink2);font-variant-numeric:tabular-nums}
.cd.dim{cursor:default}
.cd.dim .dn{color:#C9CCD2}
.cd.sun .dn{color:#D26060}.cd.sat .dn{color:#5B8DEF}
.cd.today{background:#FDF8EC}.cd.today .dn{color:#B08A2E}
.cd.sel{outline:2px solid var(--cs-gold);outline-offset:-2px;border-radius:6px}
.acb{height:12px;border-radius:3px;background:var(--ac-bg);color:var(--ac-ink);font-size:8.5px;font-weight:800;
  line-height:12px;padding:0 3px;white-space:nowrap;overflow:hidden;margin-top:2px;border:1px solid var(--ac-line)}
.acb.cont{border-radius:0;margin-left:-4px;margin-right:-4px;border-left:0;border-right:0}
.acb.sL{border-radius:3px 0 0 3px;margin-right:-4px;border-right:0}
.acb.sR{border-radius:0 3px 3px 0;margin-left:-4px;border-left:0}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;padding:0 1px}
.dd{width:7px;height:7px;border-radius:50%}
.dd.more{width:auto;height:auto;font-size:8px;font-weight:900;color:var(--cs-ink3);line-height:7px}

/* 날짜 시트 */
.sheet{background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:13px;margin-top:10px;overflow:hidden}
.sheet .sh{background:var(--cs-row);padding:9px 13px;font-size:12.5px;font-weight:900;border-bottom:1px solid var(--cs-line)}
.sheet .sh span{font-weight:700;color:var(--cs-ink3);font-size:10.5px;margin-left:5px}
.sit{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--cs-line);cursor:pointer}
.sit:last-child{border-bottom:0}
.sit .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.sit b{font-size:12.5px;font-weight:900}
.sit .no{font-size:10px;font-weight:900;color:#fff;border-radius:6px;padding:1px 6px;flex:none}
.sit .t{font-size:10.8px;color:var(--cs-ink2);font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.sit.ac{background:#FAFBFC;cursor:pointer}
.sit.ac b{color:var(--ac-ink)}
.sit.ac .bar{background:var(--ac-line)}
.sit.none{color:var(--cs-ink3);font-size:11px;font-weight:600;cursor:default}

/* B-2 주간 */
.wcard{background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:13px;overflow:hidden;margin-bottom:10px}
.wcard .whd{background:var(--cs-row);padding:8px 13px;font-size:12px;font-weight:900;
  border-bottom:1px solid var(--cs-line);display:flex;align-items:center}
.wcard .whd span{margin-left:auto;font-weight:700;color:var(--cs-ink3);font-size:10.5px;font-variant-numeric:tabular-nums}
.drow{display:flex;gap:10px;padding:8px 13px;border-top:1px solid var(--cs-line);align-items:flex-start}
.drow:first-of-type{border-top:0}
.drow .dl{width:40px;flex:none;text-align:center}
.drow .dl b{display:block;font-size:12px;font-weight:900}
.drow .dl span{font-size:9.5px;color:var(--cs-ink3);font-weight:700}
.drow.off{background:#FAFAFB}
.drow.off .dl b{color:#C9CCD2}
.drow.today2{background:#FDF8EC}
.dbody{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.acline{font-size:10.3px;font-weight:800;color:var(--ac-ink);background:var(--ac-bg);border:1px solid var(--ac-line);
  border-radius:6px;padding:2px 8px;align-self:flex-start;cursor:pointer}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:#fff;
  border-radius:8px;padding:4px 9px;align-self:flex-start;cursor:pointer}
.cchip i{font-style:normal;font-weight:700;font-size:9.8px;opacity:.88;font-variant-numeric:tabular-nums}
.emp{font-size:10.3px;color:#C6C9CE;font-weight:700}

/* 상세 팝 */
.cs-bg{position:fixed;inset:0;background:rgba(20,26,32,.45);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px}
.pop{background:var(--cs-wh);border-radius:14px;overflow:hidden;max-width:330px;width:100%;box-shadow:0 8px 26px rgba(20,30,40,.2)}
.pop .pt{padding:11px 14px;color:#fff;font-weight:900;font-size:13.5px}
.pop.acp .pt{background:#6A6F78}
.pop .pb{padding:11px 14px;font-size:11.5px;color:var(--cs-ink2);line-height:1.8}
.pop .pb b{color:var(--cs-ink)}
.pop .foot{border-top:1px dashed var(--cs-line);padding:8px 14px;font-size:10px;color:var(--cs-ink3)}

.empty{background:var(--cs-wh);border:1px dashed var(--cs-line);border-radius:12px;padding:22px 14px;
  text-align:center;font-size:12px;color:var(--cs-ink3);font-weight:600}
.sfoot{margin-top:26px;text-align:center;font-size:10.5px;color:var(--cs-ink3);line-height:1.9}

/* 로그인 */
#ls{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--cs-wh);border:1px solid var(--cs-line);border-radius:16px;padding:26px 22px;max-width:340px;width:100%}
.lbox h1{font-size:16px;font-weight:900;text-align:center;color:var(--cs-pt)}
.lbox p{font-size:11.5px;color:var(--cs-ink3);text-align:center;margin:4px 0 14px}
.lbox input{width:100%;padding:11px 12px;border:1.5px solid var(--cs-line);border-radius:10px;font-family:inherit;
  font-size:13.5px;margin-bottom:8px;box-sizing:border-box}
.lbox button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--cs-pt);color:#fff;
  font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.alert{font-size:11.5px;color:#B91C1C;text-align:center;margin-top:8px;min-height:15px}
@media (max-width:420px){ .grid2{grid-template-columns:1fr 1fr} .cd{min-height:60px} }
</style>
</head>
<body>
<div id="tb"></div><div id="sb"></div>

<div id="ls"><div class="lbox">
  <h1>📊 동아리 현황</h1><p>교사 계정으로 로그인해 주세요</p>
  <input id="l-id" placeholder="아이디" autocomplete="username">
  <input id="l-pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">로그인</button>
  <div id="l-msg" class="alert"></div>
</div></div>

<div id="ms" style="display:none"><div id="cs"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, addDoc, collection, getDocs, query, where, Timestamp, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const $I = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const WD = ['일','월','화','수','목','금','토'];
const PALETTE = ['#5B8DEF','#E8734A','#58B368','#9B6DD6','#E5A83B','#4FB3BF','#E06C9F','#7E9C3F','#6B7FD7','#C2924B'];
const SHARE_ID = new URLSearchParams(location.search).get('share');
const SHARE = !!SHARE_ID;
const toast = t=>{ const el=document.createElement('div'); el.textContent=t;
  el.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1E3932;color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;z-index:9999';
  document.body.appendChild(el); setTimeout(()=>el.remove(),2400); };

/* ── 상태 ── */
let CU=null, SEMS=[], SEM=null, CLUBS=[], ENR=[], SNAP=null, ACAD=null, ACID='';
let MONTHS=[], MON='', VIEW='cal', SELD='', HIDE=new Set(), OPENC=new Set();

/* ── 날짜 도우미 ── */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayS = ymd(new Date());
function addMin(hhmm, m){ if(!hhmm) return ''; const [h,mi]=hhmm.split(':').map(Number);
  const t=h*60+mi+(Number(m)||0); return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`; }
const mLabel = ym => `${Number(ym.slice(5,7))}월`;
const dLabel = ds => { const d=new Date(ds+'T00:00:00'); return `${Number(ds.slice(5,7))}월 ${Number(ds.slice(8,10))}일 ${WD[d.getDay()]}요일`; };

/* ── 세션 정규화: 휴강 제외 + n/총차시 번호 ── */
function bkMap(){ const m={}; (SEM?.blocked||[]).forEach(b=>{ if(b.date) m[b.date]=b.reason||'운영 불가'; }); return m; }
const isOff = (x,m)=> x.skip || (!x.extra && !x.override && (x.blocked || m[x.date]));
function liveSessions(c){
  const m = bkMap();
  const arr = (c.sessions||[]).filter(x=>x && x.date && !isOff(x,m))
    .map(x=>({ date:x.date, time:x.time||c.start||'', end:addMin(x.time||c.start||'', c.durMin||60) }))
    .sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
  const total = arr.length;
  return arr.map((s,i)=>({ ...s, no:i+1, total }));
}

/* ── 색: 도장 색 우선, 없으면 제목순 자동 ── */
function colorOf(cid){
  if(SNAP?.colors && SNAP.colors[cid]) return SNAP.colors[cid];
  const order = CLUBS.slice().sort((a,b)=>String(a.title).localeCompare(String(b.title),'ko')).map(c=>c.id);
  return PALETTE[ order.indexOf(cid) % PALETTE.length ];
}

/* ── 명단: 교사=실시간 · 공유=도장 스냅샷 ── */
function rosterOf(cid){
  if(SHARE){ const c=(SNAP?.clubs||[]).find(x=>x.id===cid); return c?.roster||[]; }
  const out=[];
  ENR.forEach(e=>{
    const r1 = new Set(e.r1Final||[]);
    Object.entries(e.r2Cancel||{}).forEach(([k,v])=>{ if(v) r1.delete(k); });
    const a1 = e.r1Final ? r1.has(cid)
      : (e.result||[]).some(r=>r.clubId===cid && r.state==='assigned' && (e.final||{})[r.clubId]!==false);
    const a2 = (e.result2||[]).some(r=>r.clubId===cid && r.state==='assigned');
    if(a1||a2) out.push({ n:e.studentName||'', g:e.grade||'', c:e.className||'' });
  });
  return out.sort((a,b)=> (parseInt(a.g)||99)-(parseInt(b.g)||99) || String(a.n).localeCompare(String(b.n),'ko'));
}

/* ── 학사 레이어 ── */
async function loadAcad(id){
  try{
    const d0 = await getDoc(doc(db,'sharedAcademic', id));
    if(!d0.exists()) return null;
    const m = d0.data();
    if(m.snapshot) return m.snapshot;
    const n = m.chunks||0; let js='';
    for(let i=0;i<n;i++){ const c=await getDoc(doc(db,'sharedAcademic', `${id}__c${i}`));
      if(c.exists()) js += (c.data().part||''); }
    return js ? JSON.parse(js) : null;
  }catch(e){ return null; }
}
async function pickAcadId(){                    // 교사 모드: 학부모용 최신 공유본 자동 선택
  try{
    const ss = await getDocs(collection(db,'sharedAcademic'));
    const list = ss.docs.filter(d=>!d.id.includes('__c')).map(d=>({id:d.id, ...d.data()}))
      .filter(d=> (d.audience||'parent')==='parent' && d.active!==false)
      .filter(d=> !d.shareOrg || d.shareOrg==='all' || d.shareOrg===SEM?.org)
      .sort((a,b)=> (b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
    return list[0]?.id || '';
  }catch(e){ return ''; }
}
function acadItemsOf(ds){
  if(!ACAD) return [];
  const out=[];
  (ACAD.events||[]).forEach(e=>{
    const f = e.start || e.from || e.date;          // 학사 원본은 start·end — 혹시 모를 별칭까지 흡수
    const t = e.end || e.to || f;
    if(f && ds>=f && ds<=t) out.push({ kind:'ev', t:e.title||'학사 행사', from:f, to:t, start: ds===f });
  });
  (ACAD.holidays||[]).forEach(h=>{ if(h.date===ds) out.push({ kind:'hd', t:h.name||'쉬는 날', from:h.date, to:h.date, start:true }); });
  return out;
}

/* ── 데이터 적재 ── */
async function loadClubs(){
  const qy = SHARE
    ? query(collection(db,'clubApplications'), where('semId','==',SEM.id), where('published','==',true))
    : query(collection(db,'clubApplications'), where('semId','==',SEM.id));
  const ss = await getDocs(qy);
  CLUBS = ss.docs.map(d=>({id:d.id, ...d.data()}))
    .filter(c=>!c.deleted && !c.cancelled && c.status==='approved' && (c.sessions||[]).length)
    .filter(c=> SHARE ? true : true);
  MONTHS = [...new Set(CLUBS.flatMap(c=>liveSessions(c).map(s=>s.date.slice(0,7))))].sort();
  if(!MONTHS.includes(MON)) MON = MONTHS.includes(todayS.slice(0,7)) ? todayS.slice(0,7) : (MONTHS[0]||'');
}
async function boot(){
  if(SHARE){
    document.body.classList.add('share-mode');
    const sd = await getDoc(doc(db,'clubStatusShare', SHARE_ID));
    if(!sd.exists()){ $I('ms').style.display='block'; $I('cs').innerHTML =
      '<div class="empty" style="margin-top:60px">아직 게시되지 않은 현황이에요.<br>기관에 문의해 주세요 🙏</div>'; window.hideLoading&&hideLoading(); return; }
    SNAP = sd.data();
    const sm = await getDoc(doc(db,'clubSemesters', SNAP.semId));
    SEM = sm.exists() ? {id:sm.id, ...sm.data()} : {id:SNAP.semId, name:SNAP.semName, org:SNAP.org, blocked:[]};
    ACID = SNAP.acShareId||'';
    if(ACID) ACAD = await loadAcad(ACID);

/* 📊 게시 링크 조회 기록 — 실패해도 화면 영향 없음 (규칙 v18 게시 후부터 쌓입니다) */
async function logShareView(kind, shareId, title){
  try{
    const ua = navigator.userAgent || '';
    const os = /iPhone|iPad|iPod/.test(ua)?'iOS' : /Android/.test(ua)?'Android'
             : /Macintosh/.test(ua)?'Mac' : /Windows/.test(ua)?'Windows' : '기타';
    const mob = /Mobi|Android|iPhone|iPad/.test(ua);
    await addDoc(collection(db,'shareViewLogs'), {
      kind, shareId: String(shareId||''), title: String(title||'').slice(0,80),
      at: serverTimestamp(),
      device: os + (mob?' · 모바일':' · PC'),
      lang: navigator.language || '',
      ref: String(document.referrer||'').slice(0,200)
    });
  }catch(_){/* 무시 */}
}
    await loadClubs();
    logShareView('clubStatus', SHARE_ID, `${(ORGS[SNAP.org]||SNAP.org||'')} 동아리 현황`);
    $I('ms').style.display='block'; render(); window.hideLoading&&hideLoading();
    document.addEventListener('visibilitychange', async ()=>{ if(document.hidden) return;
      try{ await loadClubs(); if(ACID) ACAD = await loadAcad(ACID); render(); }catch(e){} });
    return;
  }
  onAuthStateChanged(auth, async user=>{
    if(!user){ window.hideLoading&&hideLoading(); $I('ls').style.display='flex'; $I('ms').style.display='none'; return; }
    const st = await getDoc(doc(db,'staff', user.uid));
    if(!st.exists()){ $I('l-msg').textContent='교사 계정이 아니에요 — 교사 아이디로 로그인해 주세요.';
      $I('ls').style.display='flex'; window.hideLoading&&hideLoading(); return; }
    CU = { uid:user.uid, ...st.data() };
    window.ORGS = ORGS;
    if(window.renderShell) renderShell('clubstat', CU);
    const ss = await getDocs(collection(db,'clubSemesters'));
    const orgs = orgCore.myOrgs(CU,'stdDF');   // 🏛 org-core 원장 위임
    SEMS = ss.docs.map(d=>({id:d.id, ...d.data()})).filter(s=>orgs.includes(s.org))
      .sort((a,b)=> String(b.rangeFrom||'').localeCompare(String(a.rangeFrom||'')));
    document.addEventListener('visibilitychange', async ()=>{        // 탭에 돌아오면 폐강·명단 변화 즉시 반영
      if(document.hidden || SHARE || !SEM) return;
      try{ await loadClubs();
        const enr = await getDocs(query(collection(db,'clubEnrollments'), where('semId','==',SEM.id)));
        ENR = enr.docs.map(d=>({id:d.id, ...d.data()})).filter(e=>!e.deleted);
        render(); }catch(e){}
    });
    if(!SEMS.length){ $I('ls').style.display='none'; $I('ms').style.display='block';
      $I('cs').innerHTML='<div class="empty" style="margin-top:40px">아직 동아리 학기가 없어요.</div>'; window.hideLoading&&hideLoading(); return; }
    SEM = SEMS[0];
    await reloadSem();
    $I('ls').style.display='none'; $I('ms').style.display='block'; window.hideLoading&&hideLoading();
  });
}
async function reloadSem(){
  SNAP=null; ACAD=null; OPENC.clear(); HIDE.clear(); SELD='';
  try{ const sd = await getDoc(doc(db,'clubStatusShare', SEM.id)); if(sd.exists()) SNAP = sd.data(); }catch(e){}
  ACID = SNAP?.acShareId || await pickAcadId();
  if(ACID) ACAD = await loadAcad(ACID);
  await loadClubs();
  const enr = await getDocs(query(collection(db,'clubEnrollments'), where('semId','==',SEM.id)));
  ENR = enr.docs.map(d=>({id:d.id, ...d.data()})).filter(e=>!e.deleted);
  render();
}
window.pickSem = async id=>{ const s=SEMS.find(x=>x.id===id); if(!s) return; SEM=s; window.showLoading&&showLoading(); await reloadSem(); window.hideLoading&&hideLoading(); };

/* ── 📊 현황 게시 도장 (수퍼) ── */
window.stampStatus = async ()=>{
  if(!CU || CU.role!=='super') return;
  const colors={}; CLUBS.forEach(c=>{ colors[c.id]=colorOf(c.id); });
  const clubs = CLUBS.map(c=>({ id:c.id, title:c.title||'', roster:rosterOf(c.id) }));
  const acid = ACID || await pickAcadId();
  try{
    await setDoc(doc(db,'clubStatusShare', SEM.id), {
      org:SEM.org, semId:SEM.id, semName:SEM.name||'', acShareId:acid, colors, clubs,
      publishedAt:Timestamp.now(), byUid:CU.uid, byName:CU.name||''
    });
    SNAP = { org:SEM.org, semId:SEM.id, semName:SEM.name||'', acShareId:acid, colors, clubs, publishedAt:{seconds:Date.now()/1000} };
    ACID = acid;
    toast('📊 현황을 게시했습니다 — 링크가 최신 명단으로 갱신됐어요'); render();
  }catch(e){ toast('게시 실패: '+(e.code==='permission-denied'?'규칙 v17 게시가 필요합니다':(e.message||''))); }
};
window.copyShare = ()=>{
  const url = location.origin + location.pathname + '?share=' + SEM.id;
  navigator.clipboard?.writeText(url).then(()=>toast('공유 링크를 복사했어요')).catch(()=>prompt('이 링크를 복사하세요', url));
};

/* ── 렌더 ── */
function render(){
  const secs={}; CLUBS.forEach(c=>{ secs[c.id]=liveSessions(c); });
  const students = new Set(); CLUBS.forEach(c=>rosterOf(c.id).forEach(s=>students.add(s.n+'|'+s.g)));
  const range = MONTHS.length? `${MONTHS[0].slice(0,4)}.${MONTHS[0].slice(5,7)} – ${MONTHS.at(-1).slice(0,4)}.${MONTHS.at(-1).slice(5,7)}` : '';
  let h = '';
  if(!SHARE){
    h += `<div class="tools">
      <select onchange="pickSem(this.value)">${SEMS.map(s=>`<option value="${s.id}"${s.id===SEM.id?' selected':''}>${esc(ORGS[s.org]||s.org)} · ${esc(s.name||s.id)}</option>`).join('')}</select>
      ${CU?.role==='super'?`<button class="tb-btn pr" onclick="stampStatus()">📊 현황 게시</button>`:''}
      ${SNAP?`<button class="tb-btn" onclick="copyShare()">🔗 링크 복사</button>`:''}
      <div class="pubnote">${SNAP?`게시됨 · ${SNAP.byName?esc(SNAP.byName)+' · ':''}명단·색은 도장 시점 기준, 일정·학사는 실시간 반영`:'아직 게시 전 — 「📊 현황 게시」를 누르면 학부모 공유 링크가 생깁니다 (명단은 도장 시점으로 담겨요)'}</div>
    </div>`;
  }
  h += `<div class="ph"><div class="em">🎨</div>
    <div><b>${esc(ORGS[SEM.org]||SEM.org)} · 동아리 현황</b><span>${esc(SEM.name||'')} · 확정 ${CLUBS.length}개 · 참여 ${students.size}명</span></div>
    ${range?`<div class="yr">${range}</div>`:''}</div>`;

  if(!CLUBS.length){
    h += `<div class="empty">확정·공고된 동아리가 아직 없어요.</div>`;
    $I('cs').innerHTML = h; return;
  }

  /* Ⅰ. A-1 카드 */
  const allOpen = OPENC.size===CLUBS.length;
  h += `<div class="secT">🎯 개설 동아리 <span class="mini" onclick="togAll()">${allOpen?'모두 접기':'모두 펼치기'}</span></div><div class="grid2">`;
  CLUBS.slice().sort((a,b)=>String(a.title).localeCompare(String(b.title),'ko')).forEach(c=>{
    const col=colorOf(c.id), r=rosterOf(c.id), open=OPENC.has(c.id), ses=secs[c.id];
    const days=(c.weekdays||[]).map(w=>WD[w]).join('·');
    h += `<div class="ccard${open?' open':''}" onclick="togC('${c.id}')">
      <b><span class="dot" style="background:${col}"></span>${esc(c.title||'')}</b>
      <div class="m">${days} ${esc(c.start||'')}${c.start?`–${addMin(c.start,c.durMin||60)}`:''}${c.loc?` · ${esc(c.loc)}`:''}</div>
      <div class="n">👥 <em>${r.length}명</em>${c.instr?` · ${esc(c.instr)} 강사`:''} · 총 ${ses.length?ses[0].total:0}차시</div>
      ${open?`<div class="roster">${r.length? r.map(s=>`<span class="stu">${esc(s.n)}<i>${esc(String(s.g).replace('학년',''))}${s.c?'·'+esc(String(s.c).replace('반','')):''}</i></span>`).join('')
        : `<span class="none">${SHARE?'명단은 게시 이후 표시됩니다':'확정된 참여자가 아직 없어요'}</span>`}</div>`:''}
    </div>`;
  });
  h += `</div>`;

  /* Ⅱ. 달력 */
  h += `<div class="secT">🗓 월별 일정
    <div class="vsw"><button class="${VIEW==='cal'?'on':''}" onclick="setView('cal')">📅 월</button><button class="${VIEW==='week'?'on':''}" onclick="setView('week')">📋 주</button></div></div>`;
  h += `<div class="mtabs">${MONTHS.map(m=>`<div class="mtab${m===MON?' on':''}" onclick="setMon('${m}')">${mLabel(m)}</div>`).join('')}</div>`;
  h += `<div class="legend"><span class="lg ac">학사일정</span>${CLUBS.slice().sort((a,b)=>String(a.title).localeCompare(String(b.title),'ko')).map(c=>
    `<span class="lg${HIDE.has(c.id)?' off':''}" onclick="togHide('${c.id}')"><span class="dot" style="background:${colorOf(c.id)}"></span>${esc((c.title||'').slice(0,7))}</span>`).join('')}</div>`;

  h += VIEW==='cal' ? calHTML(secs) : weekHTML(secs);
  if(VIEW==='cal' && SELD) h += sheetHTML(SELD, secs);

  h += `<div class="sfoot">회색은 학사일정(학부모 공유본), 색은 동아리 수업이에요 · 항목을 누르면 자세히 보여요<br>${SHARE?'일정이 바뀌면 이 화면도 자동으로 갱신됩니다':''}</div>`;
  $I('cs').innerHTML = h;
}
function sesOn(ds, secs){
  const out=[];
  CLUBS.forEach(c=>{ if(HIDE.has(c.id)) return;
    (secs[c.id]||[]).forEach(s=>{ if(s.date===ds) out.push({c, s}); }); });
  return out.sort((a,b)=> a.s.time.localeCompare(b.s.time) || String(a.c.title).localeCompare(String(b.c.title),'ko'));
}
function calHTML(secs){
  const y=Number(MON.slice(0,4)), m=Number(MON.slice(5,7));
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const start=new Date(first); start.setDate(1-first.getDay());
  let h = `<div class="cal"><div class="wk">${WD.map(w=>`<div>${w}</div>`).join('')}</div>`;
  for(let w=0; w<6; w++){
    const rs=new Date(start); rs.setDate(start.getDate()+w*7);
    if(rs>last) break;                                    // 행 시작이 월을 넘어가면 종료
    h += `<div class="row7">`;
    for(let i=0;i<7;i++){
      const d=new Date(start); d.setDate(start.getDate()+w*7+i);
      const ds=ymd(d), inM=(d.getMonth()+1===m);
      const ac=inM?acadItemsOf(ds):[], ses=inM?sesOn(ds,secs):[];
      const cls=['cd']; if(!inM)cls.push('dim'); if(i===0)cls.push('sun'); if(i===6)cls.push('sat');
      if(ds===todayS&&inM)cls.push('today'); if(ds===SELD)cls.push('sel');
      h += `<div class="${cls.join(' ')}"${inM?` onclick="pickDay('${ds}')"`:''}><div class="dn">${d.getDate()}</div>`;
      ac.slice(0,2).forEach(a=>{
        const multi=a.from!==a.to, st=a.from===ds, en=a.to===ds;
        const bc = multi ? (st?'acb sL':(en?'acb sR':'acb cont')) : 'acb';
        h += `<div class="${bc}">${(st||i===0)?esc(a.t):''}</div>`; });
      if(ses.length){ h += `<div class="dots">${ses.slice(0,4).map(x=>`<span class="dd" style="background:${colorOf(x.c.id)}"></span>`).join('')}${ses.length>4?`<span class="dd more">+${ses.length-4}</span>`:''}</div>`; }
      h += `</div>`;
    }
    h += `</div>`;
  }
  return h+`</div>`;
}
function sheetHTML(ds, secs){
  const ac=acadItemsOf(ds), ses=sesOn(ds,secs), bk=bkMap()[ds];
  let h = `<div class="sheet"><div class="sh">${dLabel(ds)}<span>탭한 날짜</span></div>`;
  ac.forEach((a,i)=> h += `<div class="sit ac" onclick="popAc(${i},'${ds}')"><span class="bar"></span><b>${esc(a.t)}</b><span class="t">${a.from===a.to?'하루':`${a.from.slice(5).replace('-','.')}–${a.to.slice(5).replace('-','.')}`}</span></div>`);
  ses.forEach(x=> h += `<div class="sit" onclick="popSes('${x.c.id}','${x.s.date}')"><span class="bar" style="background:${colorOf(x.c.id)}"></span>
    <b>${esc(x.c.title||'')}</b><span class="no" style="background:${colorOf(x.c.id)}">${x.s.no}/${x.s.total}차시</span>
    <span class="t">${x.s.time}–${x.s.end}${x.c.loc?` · ${esc(x.c.loc)}`:''}</span></div>`);
  if(!ac.length && !ses.length) h += `<div class="sit none">${bk?`동아리 휴강 — ${esc(bk)}`:'이날은 학사·동아리 일정이 없어요'}</div>`;
  else if(bk && !ses.length) h += `<div class="sit none">동아리 휴강 — ${esc(bk)}</div>`;
  return h+`</div>`;
}
function weekHTML(secs){
  const y=Number(MON.slice(0,4)), m=Number(MON.slice(5,7));
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const start=new Date(first); start.setDate(first.getDate()-((first.getDay()+6)%7));   // 월요일 기준
  let h='', wn=0;
  for(let ws=new Date(start); ws<=last; ws.setDate(ws.getDate()+7)){
    const we=new Date(ws); we.setDate(ws.getDate()+6);
    if(we < first) continue;                               // 주 전체가 지난달이면 건너뜀
    wn++;
    let rows='';
    for(let i=0;i<7;i++){
      const d=new Date(ws); d.setDate(ws.getDate()+i);
      if(d.getMonth()+1!==m) continue;
      const ds=ymd(d), ac=acadItemsOf(ds), ses=sesOn(ds,secs), bk=bkMap()[ds];
      if(i>=5 && !ac.length && !ses.length) continue;                 // 토·일은 내용 있을 때만
      const off = !!bk || ac.some(a=>a.kind==='hd');
      rows += `<div class="drow${off?' off':''}${ds===todayS?' today2':''}"><div class="dl"><b>${d.getDate()}</b><span>${WD[d.getDay()]}</span></div><div class="dbody">`;
      ac.forEach((a,ai)=>{ rows += `<div class="acline" onclick="popAc(${ai},'${ds}')">${esc(a.t)}</div>`; });
      ses.forEach(x=>{ rows += `<span class="cchip" style="background:${colorOf(x.c.id)}" onclick="popSes('${x.c.id}','${x.s.date}')">${esc(x.c.title||'')} <i>${x.s.no}/${x.s.total} · ${x.s.time}</i></span>`; });
      if(!ac.length && !ses.length) rows += `<span class="emp">일정 없음</span>`;
      else if(bk && !ses.length && !ac.length) rows += `<span class="emp">동아리 휴강</span>`;
      rows += `</div></div>`;
    }
    if(rows) h += `<div class="wcard"><div class="whd">${m}월 ${['첫','둘','셋','넷','다섯','여섯'][wn-1]||wn}째 주<span>${ws.getMonth()+1}.${ws.getDate()} – ${we.getMonth()+1}.${we.getDate()}</span></div>${rows}</div>`;
  }
  return h || `<div class="empty">이 달에는 표시할 일정이 없어요.</div>`;
}

/* ── 상호작용 ── */
window.togC = id=>{ OPENC.has(id)?OPENC.delete(id):OPENC.add(id); render(); };
window.togAll = ()=>{ if(OPENC.size===CLUBS.length) OPENC.clear(); else CLUBS.forEach(c=>OPENC.add(c.id)); render(); };
window.setMon = m=>{ MON=m; SELD=''; render(); };
window.setView = v=>{ VIEW=v; render(); };
window.togHide = id=>{ HIDE.has(id)?HIDE.delete(id):HIDE.add(id); render(); };
window.pickDay = ds=>{ SELD = (SELD===ds)?'':ds; render();
  if(SELD){ setTimeout(()=>{ document.querySelector('.sheet')?.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 40); } };
function popBG(html){ const bg=document.createElement('div'); bg.className='cs-bg';
  bg.addEventListener('click', ev=>{ if(ev.target===bg) bg.remove(); });
  bg.innerHTML=html; document.body.appendChild(bg); }
window.popAc = (i, ds)=>{ const a=acadItemsOf(ds)[i]; if(!a) return;
  popBG(`<div class="pop acp"><div class="pt">🗓 ${esc(a.t)}</div>
    <div class="pb"><b>${a.from===a.to? a.from.replace(/-/g,'.') : `${a.from.replace(/-/g,'.')} – ${a.to.replace(/-/g,'.')}`}</b></div>
    <div class="foot">학사일정(학부모 공유본)에서 자동으로 가져왔어요 — 원본이 바뀌면 함께 갱신됩니다</div></div>`); };
window.popSes = (cid, ds)=>{ const c=CLUBS.find(x=>x.id===cid); if(!c) return;
  const s=liveSessions(c).find(x=>x.date===ds); if(!s) return;
  const r=rosterOf(cid);
  popBG(`<div class="pop"><div class="pt" style="background:${colorOf(cid)}">${esc(c.title||'')} · ${s.no}/${s.total}차시</div>
    <div class="pb"><b>${dLabel(ds)} ${s.time} – ${s.end}</b>${c.loc?` · ${esc(c.loc)}`:''}<br>
    ${c.instr?`${esc(c.instr)} 강사 · `:''}참여 ${r.length}명</div>
    <div class="foot">보강·시간 변경은 강사 입력 즉시 이 달력에 반영됩니다</div></div>`); };

window.doLogin = async ()=>{
  const id=$I('l-id').value.trim(), pw=$I('l-pw').value, msg=$I('l-msg'); msg.textContent='';
  try{ await signInWithEmailAndPassword(auth, `${id}@gyosa-seongyosa.staff`, pw); }
  catch(e){ msg.textContent='로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
boot();
</script>
