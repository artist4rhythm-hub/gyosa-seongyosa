<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 학부모 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
/* 👨‍👩‍👧 우리 반 학부모 (v124) — 왼쪽 학부모 연결 · 오른쪽 우리 반 게시판 */
.cp-wrap{max-width:var(--page-dash,1680px);margin:0 auto;padding:4px 4px 40px}
.cp-hd{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.cp-hd .t{font-size:19px;font-weight:900;color:var(--gd)}
.cp-hd small{font-size:12.5px;color:var(--ts);font-weight:600}
.cp-cls{display:flex;align-items:center;gap:10px;background:var(--wh);border:1px solid var(--ivd);border-radius:12px;padding:11px 14px;margin-bottom:12px;flex-wrap:wrap}
.cp-yr{font-size:11px;font-weight:800;color:var(--gm);background:var(--gp);border-radius:100px;padding:3px 9px;white-space:nowrap}
.cp-cn{font-size:15.5px;font-weight:900;color:var(--ink,#1F2320)}
.cp-who{font-size:12px;color:var(--ts)}
.cp-sp{flex:1}
.cp-cls select{padding:7px 10px;border:1.5px solid var(--ivd);border-radius:9px;font-size:12.5px;font-weight:700;font-family:inherit;background:var(--wh);color:var(--ts);max-width:320px}
.cp-link{font-size:12px;font-weight:800;color:var(--gm);text-decoration:none;border:1.5px solid var(--gl);border-radius:9px;padding:6px 10px;white-space:nowrap}
.cp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:1100px){ .cp-grid{grid-template-columns:minmax(0,1fr)} }
.cp-card{background:var(--wh);border:1px solid var(--ivd);border-radius:14px;padding:16px;min-width:0}
.cp-empty,.pc-empty,.pb-empty{color:var(--tl);text-align:center;padding:30px 10px;font-size:13px;line-height:1.7}
.btn{background:var(--gm);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.sub{background:var(--gp);color:var(--gd);border:1px solid var(--gl)}
.btn:disabled{opacity:.5}
.msg{border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;margin-top:10px;display:none;line-height:1.6}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.msg.err{display:block;background:var(--danger-bg);color:var(--danger)}
/* 학부모 연결 */
.cp-ch,.pb-ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cp-ch b,.pb-ch b{font-size:14.5px;font-weight:900;color:var(--ink,#1F2320)}
.cp-mut,.pb-mut{font-size:11.5px;color:var(--tl)}
.cp-big{font-size:22px;font-weight:900;color:var(--gm)}.cp-big small{font-size:13px;color:var(--ts);font-weight:700}
.cp-pg{height:10px;border-radius:10px;background:var(--iv);overflow:hidden;margin:6px 0 8px}.cp-pg i{display:block;height:100%;background:#7CC4A4;border-radius:10px}
.cp-r{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line-soft,#EEECE6)}
.cp-r.fl{background:var(--warn-bg,#FEF3C7);border-radius:9px;padding:8px 8px}
.cp-n b{font-size:13px}
.cp-s{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.cp-a{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.cp-code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--tl);margin-right:4px;white-space:nowrap}
.cp-ft{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.cp-ok{font-size:12.5px;font-weight:800;color:var(--gm)}
.cp-note{font-size:11.5px;color:var(--ts);background:var(--iv);border-radius:10px;padding:8px 11px;margin-top:10px;line-height:1.6}
@media (max-width:620px){ .cp-r{grid-template-columns:minmax(0,1fr)} .cp-a{justify-content:flex-start} }
.pc-why{display:flex;flex-direction:column;gap:1px;margin-top:3px}
.pc-why span{font-size:10.5px;color:var(--warn,#B45309);font-weight:700}
.pc-b{font-size:10px;font-weight:800;border-radius:100px;padding:1px 7px;margin-left:5px}
.pc-b.lv{background:var(--warn-bg);color:var(--warn)}.pc-b.gd{background:var(--info-bg);color:var(--info)}.pc-b.qt{background:var(--iv);color:var(--tl)}
.pc-sl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;border-radius:9px;background:var(--gp);color:var(--gm);font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pc-sl small{font-weight:500;color:var(--ts)}.pc-sl i{font-style:normal;font-weight:600;color:var(--ts)}
.pc-sl.wt{background:var(--warn-bg);color:var(--warn)}.pc-sl.gr{background:var(--info-bg);color:var(--info)}
.pc-sl.no{background:var(--iv);color:var(--tl)}.pc-sl.em{background:var(--wh);border:1.5px dashed var(--ivd);color:var(--tl)}
.pc-x{font-size:11px;font-weight:800;color:var(--ts);border:1px solid var(--ivd);border-radius:8px;padding:4px 8px;background:var(--wh);cursor:pointer;font-family:inherit;white-space:nowrap}
.pc-x:hover{border-color:var(--gm);color:var(--gm)}.pc-x.dg{color:var(--danger);border-color:var(--danger-bg)}
.pc-b2{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:10px;font-weight:800;font-size:12px;border:1.5px solid var(--gl);background:var(--wh);color:var(--gm);cursor:pointer;font-family:inherit}
.pc-b2:hover{background:var(--gp)}
/* 우리 반 게시판 */
.pb-sp{flex:1}
.pb-new{font-size:10px;font-weight:900;color:#fff;background:#E2554A;border-radius:100px;padding:2px 7px;white-space:nowrap}
.pb-w{border:1.5px solid var(--ivd);border-radius:12px;padding:10px 12px;background:var(--iv);margin-bottom:4px}
.pb-w input:not([type=checkbox]),.pb-w textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--ivd);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;background:var(--wh);color:inherit;outline:none}
.pb-w textarea{min-height:76px;margin-top:6px;resize:vertical;line-height:1.6}
.pb-w input:focus,.pb-w textarea:focus{border-color:var(--gm)}
.pb-tb input[type=checkbox]{width:15px;height:15px;margin:0}
.pb-tb{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ts)}
.pb-tb label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.pb-p{border:1px solid var(--ivd);border-radius:12px;padding:11px 13px;margin-top:9px;background:var(--wh)}
.pb-p.hid{opacity:.72;border-style:dashed}
.pb-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pb-tt{font-weight:900;font-size:13.5px;word-break:keep-all}
.pb-pin{font-size:10px;font-weight:900;color:var(--gold);background:var(--gold-bg);border-radius:100px;padding:2px 8px;white-space:nowrap}
.pb-tag{font-size:10px;font-weight:800;color:var(--tl);background:var(--iv);border-radius:100px;padding:2px 8px;white-space:nowrap}
.pb-tag.hd{color:var(--warn);background:var(--warn-bg)}
.pb-m{font-size:11.5px;color:var(--tl);margin-top:3px}.pb-m b{color:var(--ts)}
.pb-b{font-size:12.5px;color:var(--ts);margin-top:6px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.pb-b a{color:var(--gm);font-weight:700;word-break:break-all}
.pb-cs{margin-top:8px;border-top:1px solid var(--line-soft,#EEECE6);padding-top:6px}
.pb-c{margin:6px 0 0 6px;padding:7px 10px;border-left:3px solid var(--ivd);border-radius:0 8px 8px 0}
.pb-c.nw{border-left-color:#F2B866;background:var(--warn-bg)}
.pb-c.hid{opacity:.7}
.pb-cw{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tl);flex-wrap:wrap}.pb-cw b{color:var(--ts)}
.pb-cb{font-size:12.5px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.pb-ci{display:flex;gap:6px;margin-top:8px}
.pb-ci input{flex:1;min-width:0;border:1.5px solid var(--ivd);border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit;background:var(--wh);color:inherit;outline:none}
.pb-ac{display:flex;gap:5px;margin-top:9px;align-items:center;flex-wrap:wrap}
.pb-x{font-size:11px;font-weight:800;color:var(--ts);border:1px solid var(--ivd);border-radius:8px;padding:4px 9px;background:var(--wh);cursor:pointer;font-family:inherit;white-space:nowrap}
.pb-x:hover{border-color:var(--gm);color:var(--gm)}.pb-x.dg{color:var(--danger)}.pb-x.sm{padding:2px 7px;font-size:10.5px}
.pb-note{font-size:11.5px;color:var(--warn,#B45309);background:var(--warn-bg,#FEF3C7);border-radius:10px;padding:8px 11px;margin:0 0 8px;line-height:1.6}
.pb-more{display:block;width:100%;margin-top:10px;padding:9px;border:1.5px dashed var(--ivd);border-radius:10px;background:none;color:var(--ts);font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.cp-none{background:var(--wh);border:1px solid var(--ivd);border-radius:14px;padding:30px 20px;text-align:center;color:var(--ts);font-size:13.5px;line-height:1.8}
.cp-none a{color:var(--gm);font-weight:800}
@media print {
  body *{visibility:hidden}
  #print-area, #print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>
<body>
<div id="ls" style="display:none;min-height:100vh;align-items:center;justify-content:center">
  <div style="background:var(--wh,#fff);border:1px solid var(--ivd);border-radius:16px;padding:28px;max-width:340px;width:92%">
    <div style="font-size:17px;font-weight:900;color:var(--gd);margin-bottom:6px">👨‍👩‍👧 우리 반 학부모</div>
    <div style="font-size:12.5px;color:var(--ts);margin-bottom:14px">로그인해 주세요 — 교사 선교사 계정 그대로 쓰시면 돼요.</div>
    <label style="font-size:12px;font-weight:700">아이디</label>
    <input type="text" id="l-id" autocomplete="username" style="width:100%;margin:4px 0 10px;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-size:14px;font-family:inherit;box-sizing:border-box">
    <label style="font-size:12px;font-weight:700">비밀번호</label>
    <input type="password" id="l-pw" autocomplete="current-password" style="width:100%;margin:4px 0 14px;padding:10px 12px;border:1.5px solid var(--ivd);border-radius:9px;font-size:14px;font-family:inherit;box-sizing:border-box">
    <button class="btn" style="width:100%" onclick="doLogin()">로그인</button>
    <div id="l-msg" style="display:none;margin-top:10px;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700"></div>
  </div>
</div>

<div id="ms" style="display:none">
  <div class="cp-wrap">
    <div class="cp-hd"><span class="t">👨‍👩‍👧 우리 반 학부모</span><small id="who"></small></div>
    <div id="cp-top"></div>
    <div class="cp-grid" id="cp-grid" style="display:none">
      <div class="cp-card" id="cp-conn"></div>
      <div class="cp-card" id="cp-board"></div>
    </div>
  </div>
</div>
<div id="print-area" style="display:none"></div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, collection, getDocs, query, where }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import * as Conn from './parent-conn.js?v=124';    // 👨‍👩‍👧 학부모 연결 (담임 모드)
import * as Board from './parent-board.js?v=124';  // 💬 우리 반 게시판

const __cfg = ({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const app = getApps().length ? getApp() : initializeApp(__cfg);
const auth = getAuth(app);
const db = (()=>{ try{ return initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); }catch(e){ return getFirestore(app); } })();
const $I = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORG_L = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };

let CU = null, MINE = [], OTHERS = [], CUR = null;
const isAdmin = () => CU && (CU.role === 'super' || CU.role === 'org_admin');

function korEmail(id){ return `${id}@gyosa-seongyosa.staff`; }
window.doLogin = async function(){
  const id=$I('l-id').value.trim(), pw=$I('l-pw').value, m=$I('l-msg');
  const bad = t => { m.style.display='block'; m.style.background='var(--danger-bg)'; m.style.color='var(--danger)'; m.textContent=t; };
  if(!id||!pw) return bad('아이디와 비밀번호를 입력해 주세요.');
  try{ await signInWithEmailAndPassword(auth, korEmail(id), pw); }
  catch(e){ bad('로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'); }
};
$I('l-pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

/* ── 내 반 (담임 · 부담임) · 관리자는 기관의 모든 반 ── */
async function loadClasses(){
  const y = new Date().getFullYear();
  const [a, b] = await Promise.all([
    getDocs(query(collection(db,'classes'), where('teacherUid','==',CU.uid))).catch(()=>null),
    getDocs(query(collection(db,'classes'), where('deputies','array-contains',CU.uid))).catch(()=>null),
  ]);
  const seen = new Map();
  [...(a?a.docs:[]), ...(b?b.docs:[])].forEach(d=>{ const v = d.data(); if(!v.deleted) seen.set(d.id, Object.assign({ id:d.id }, v)); });
  let mine = [...seen.values()];
  const yr = mine.some(c=>Number(c.year)===y) ? y : y-1;
  mine = mine.filter(c=>Number(c.year)===yr);
  MINE = Board.decorate(mine).map(c=>Object.assign(c, { role: c.teacherUid===CU.uid ? '담임' : '부담임' }));
  OTHERS = [];
  if(isAdmin()){
    const orgs = (window.orgCore && orgCore.myOrgs) ? orgCore.myOrgs(CU,'stdDF') : (CU.role==='super' ? ['daniel','jihyebit'] : [CU.org||'daniel']);
    for(const yy of [y, y-1]){
      const q = await getDocs(query(collection(db,'classes'), where('year','==',yy)));
      const list = q.docs.map(d=>Object.assign({ id:d.id }, d.data())).filter(c=>!c.deleted && orgs.includes(c.org||'daniel') && String(c.name||'').trim() && !seen.has(c.id));
      if(list.length){ OTHERS = Board.decorate(list); break; }
    }
  }
}
const allCls = () => [...MINE, ...OTHERS];
const staffName = uid => { const s = Conn.S.staff.get(uid); return s ? (s.name||'') : ''; };

function renderTop(){
  const c = CUR;
  const opts = (list, g) => list.length ? `<optgroup label="${g}">${list.map(x=>`<option value="${esc(x.id)}" ${c&&x.id===c.id?'selected':''}>${esc(x.label)}${x.org&&isAdmin()&&CU.role==='super'?' · '+esc(ORG_L[x.org]||''):''}</option>`).join('')}</optgroup>` : '';
  const pick = allCls().length > 1 ? `<select onchange="cpPick(this.value)">${opts(MINE, '내 반')}${opts(OTHERS, isAdmin()?'다른 반 (관리자)':'다른 반')}</select>` : '';
  const t = c ? staffName(c.teacherUid) : '', ds = c ? (c.deputies||[]).map(staffName).filter(Boolean) : [];
  $I('cp-top').innerHTML = c ? `<div class="cp-cls"><span class="cp-yr">${esc(String(c.year||''))}학년도</span>
      <span class="cp-cn">${esc([Board.subOf(c), c.name].filter(Boolean).join(' · '))}</span>
      <span class="cp-who">${t?'담임 '+esc(t):''}${ds.length?' · 부담임 '+esc(ds.join(', ')):''} · 학생 ${(c.students||[]).length}명${c.role?` · 나는 <b>${esc(c.role)}</b>`:''}</span>
      <span class="cp-sp"></span>${pick}<a class="cp-link" href="history.html" title="해마다의 반 · 담임 · 학생과 그 반에 나간 학부모 공지">🗂 지난 학년도 기록</a></div>` : '';
}
async function openClass(id){
  CUR = allCls().find(c=>c.id===id) || allCls()[0] || null;
  if(!CUR) return;
  try{ history.replaceState(null, '', 'class-parents.html?c=' + encodeURIComponent(CUR.id)); }catch(e){}
  $I('cp-grid').style.display = '';
  $I('cp-conn').innerHTML = '<div class="cp-empty">불러오는 중…</div>';
  $I('cp-board').innerHTML = '<div class="cp-empty">불러오는 중…</div>';
  try{ await Conn.loadClass(CUR); Conn.renderClassCard($I('cp-conn')); }
  catch(e){ $I('cp-conn').innerHTML = `<div class="cp-empty">불러오지 못했어요: ${esc(e.message||'')}</div>`; }
  renderTop();
  try{ await Board.load(CUR); Board.render($I('cp-board')); await Board.seen(); }
  catch(e){ $I('cp-board').innerHTML = `<div class="cp-empty">게시판을 불러오지 못했어요: ${esc(e.message||'')}</div>`; }
}
window.cpPick = id => openClass(id);

onAuthStateChanged(auth, async user=>{
  if(!user){ window.hideLoading && window.hideLoading(); $I('ls').style.display='flex'; $I('ms').style.display='none'; return; }
  try{
    const st = await getDoc(doc(db,'staff',user.uid));
    if(!st.exists()){ $I('ls').style.display='flex'; return; }
    CU = { uid:user.uid, ...st.data() };
    window.ORGS = ORG_L;
    if(window.renderShell) renderShell('myparents', CU);
    $I('ls').style.display='none'; $I('ms').style.display='';
    if(window.guardPage && !guardPage(CU,'myparents')){ window.hideLoading && window.hideLoading(); return; }
    $I('who').textContent = `${CU.name||''} 선생님`;
    Conn.init({ db, CU, getOrg: () => (CUR && CUR.org) || 'daniel', ORG_L, $I, onChange: () => Conn.renderClassCard($I('cp-conn')) });
    Board.init({ db, auth, CU, $I });
    await loadClasses();
    window.hideLoading && window.hideLoading();
    if(!allCls().length){
      $I('cp-top').innerHTML = `<div class="cp-none">올해 반편성에 <b>담임 · 부담임</b>으로 맡은 반이 없어요.<br>
        반편성에서 담임 · 부담임으로 지정되면 여기서 우리 반 학부모 연결과 반 게시판을 볼 수 있어요.<br>
        <a href="class.html">반편성 열기 →</a></div>`;
      return;
    }
    const want = new URLSearchParams(location.search).get('c');
    await openClass(want && allCls().some(c=>c.id===want) ? want : allCls()[0].id);
  }catch(e){
    window.hideLoading && window.hideLoading();
    document.body.insertAdjacentHTML('afterbegin', `<div style="background:var(--danger-bg);color:var(--danger);padding:10px 14px;font-size:13px;font-weight:700">불러오지 못했습니다: ${esc(e.message||'')}</div>`);
  }
});
</script>
<script src="qr.js?v=122"></script>
<script src="student-status.js"></script>
<script src="modal-close.js"></script>
<script src="org-core.js"></script>
<script src="menu.js"></script>
<script src="filename.js"></script>
<script src="sidebar.js"></script>
<script type="module" src="union.js?v=64"></script>
<script type="module" src="badges.js"></script>
</body>
</html>
