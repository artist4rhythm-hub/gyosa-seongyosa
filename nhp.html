<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나학평 · 교사 선교사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Sans:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
/* ═══ 📒 나학평 (v141) — 나의 학교생활 평가서 · 다니엘 아마츠 ═══ */
#nh{width:100%;max-width:var(--page-wide,1440px);margin:0 auto;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);padding-bottom:90px}
#nh *{box-sizing:border-box}
.nh-btn{font-family:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:0 14px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;line-height:1}
.nh-btn:hover{border-color:var(--sb-green)}
.nh-btn.p{background:var(--sb-house);border-color:var(--sb-house);color:#fff}
.nh-btn.g{background:var(--sb-green);border-color:var(--sb-green);color:#fff}
.nh-btn.w{background:#FEF3C7;border-color:#F3D58A;color:#8A5A00}
.nh-btn.r{background:var(--danger-bg);border-color:#F1C0BA;color:var(--danger)}
.nh-btn.pu{background:#EDE9FE;border-color:#D8CCFA;color:#5B21B6}
.nh-btn.sm{height:32px;font-size:12px;padding:0 11px;border-radius:9px}
.nh-btn.xs{height:26px;font-size:11.5px;padding:0 9px;border-radius:8px}
.nh-btn.ghost{background:transparent}
.nh-btn:disabled{opacity:.45;cursor:not-allowed}
.nh-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.nh-head .cr{font-size:12px;font-weight:700;color:var(--ink-2)}
.nh-head h1{margin:2px 0 0;font-size:25px;font-weight:900;letter-spacing:-.02em}
.nh-head h1 small{font-size:13px;font-weight:700;color:var(--ink-2);margin-left:6px}
.nh-sp{flex:1}
.nh-sel{font-family:inherit;font-size:13px;font-weight:800;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);max-width:100%}
.nh-in{font-family:inherit;font-size:13px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--surface);color:var(--ink);min-width:0}
.nh-in:focus,.nh-ta:focus,.nh-sel:focus{outline:2px solid #9CCBB6;outline-offset:0;border-color:var(--sb-green)}
.nh-ta{font-family:inherit;font-size:13px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);width:100%;resize:vertical;min-height:70px}
.nh-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.nh-tabs button{font-family:inherit;font-size:13px;font-weight:800;border:1px solid transparent;background:transparent;color:var(--ink-2);height:36px;padding:0 13px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nh-tabs button:hover{background:var(--sb-mint-2)}
.nh-tabs button.on{background:var(--sb-house);color:#fff}
.nh-tabs .bd{background:#E8875B;color:#fff;border-radius:100px;font-size:10.5px;padding:1px 7px;font-weight:900}
.nh-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.nh-card h3{margin:0 0 4px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nh-card h3 small{font-size:12px;color:var(--ink-2);font-weight:700}
.nh-desc{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin:0 0 10px}
.nh-empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:38px 20px;text-align:center;color:var(--ink-2);font-size:13.5px;line-height:1.8}
.nh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.nh-it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .12s,box-shadow .12s;min-width:0}
.nh-it:hover{border-color:#9CCBB6;box-shadow:var(--shadow)}
.nh-it .t{font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px;min-width:0}
.nh-it .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh-it .m{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nh-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.nh-bar i{display:block;height:100%;background:var(--sb-green);border-radius:4px}
.ch{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;border-radius:100px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.ch.gray{background:#EEF0EE;color:#5A6560}.ch.warn{background:#FEF3C7;color:#9A5B00}.ch.info{background:#DBEAFE;color:#1D4ED8}
.ch.purple{background:#EDE9FE;color:#5B21B6}.ch.ok{background:#DCFCE7;color:#15803D}.ch.mint{background:var(--sb-mint-2);color:var(--sb-green)}
.ch.type{background:#F1EFE8;color:#6B5E3C}.ch.red{background:var(--danger-bg);color:var(--danger)}
html[data-theme="dark"] .ch.gray{background:#24302B;color:#A9BDB4}html[data-theme="dark"] .ch.type{background:#2A2618;color:#D9C89A}
.nh-sec{margin:16px 2px 8px;font-size:13px;font-weight:900;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.nh-sec b{color:var(--ink);font-size:14px}
.nh-note{display:flex;gap:10px;align-items:flex-start;background:#FFFBEA;border:1px solid #F3E2A6;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px;line-height:1.6;cursor:pointer}
html[data-theme="dark"] .nh-note{background:var(--gold-bg);border-color:var(--gold-line)}
.nh-note b{font-weight:900}.nh-note small{display:block;color:var(--ink-2);font-size:11.5px}
.nh-warn{background:#FEF3C7;border:1px solid #F3D58A;color:#7A4E00;border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.nh-info{background:var(--sb-mint-2);border:1px solid #CFE6DC;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
html[data-theme="dark"] .nh-warn{background:var(--warn-bg);border-color:#5A4A20;color:var(--warn)}
/* 진행 현황 */
.bd-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.bd-sec .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bd-sec .hd b{font-size:14.5px;font-weight:900}
.bd-cells{display:flex;flex-wrap:wrap;gap:6px}
.bd-c{font-family:inherit;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;max-width:100%}
.bd-c i{width:9px;height:9px;border-radius:50%;flex:none}
.bd-c small{color:var(--ink-3);font-weight:700}
.bd-c.mine{box-shadow:inset 0 0 0 2px #E8875B}
.dot-gray{background:#C8CEC9}.dot-warn{background:#E8A33D}.dot-info{background:#3B82F6}.dot-purple{background:#8B5CF6}.dot-ok{background:#16A34A}
.bd-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bd-sum .ch{font-size:12px;padding:4px 12px}
/* 표 */
.nh-tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%}
.nh-t{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.nh-t th,.nh-t td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:6px 8px;text-align:left;vertical-align:middle;background:var(--surface)}
.nh-t th{position:sticky;top:0;z-index:2;background:var(--sb-mint-2);font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.nh-t th.sv{writing-mode:horizontal-tb;max-width:110px;white-space:normal;line-height:1.3}
.nh-t td.fc,.nh-t th.fc{position:sticky;left:0;z-index:1}
.nh-t th.fc{z-index:3}
.nh-t tr.grp td{background:#F7F5EE;font-weight:800;color:var(--ink-2);font-size:11.5px}
html[data-theme="dark"] .nh-t tr.grp td{background:#1A2621}
.nh-t td.c,.nh-t th.c{text-align:center}
.nh-t input.nh-in{height:30px;width:100%}
.nh-t input.num{width:64px;text-align:center}
/* 5단계 */
.lv{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:8px;font-weight:900;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:pointer;font-family:inherit;padding:0}
.lv.v5{background:#DCF3E8;border-color:#9FD8BE;color:#0F7A51}.lv.v4{background:#EAF6DA;border-color:#C4E3A0;color:#4C7A12}
.lv.v3{background:#FDF3D3;border-color:#F1D98C;color:#8A6410}.lv.v2{background:#FDE7DA;border-color:#F4BF9F;color:#B4501E}
.lv.v1{background:#FBDEDE;border-color:#EFAAAA;color:#B42318}
.lv:focus{outline:2px solid var(--sb-green);outline-offset:1px}
.lvs{display:flex;gap:5px;flex-wrap:wrap}
.lvs button{font-family:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:9px;padding:6px 9px;cursor:pointer;min-width:62px}
.lvs button.on.v5{background:#0F7A51;border-color:#0F7A51;color:#fff}.lvs button.on.v4{background:#5E9A1B;border-color:#5E9A1B;color:#fff}
.lvs button.on.v3{background:#C08E14;border-color:#C08E14;color:#fff}.lvs button.on.v2{background:#D2622A;border-color:#D2622A;color:#fff}
.lvs button.on.v1{background:#C0392B;border-color:#C0392B;color:#fff}
.sv-dot{font-size:11px;font-weight:800;color:var(--ink-3)}
.sv-dot.on{color:var(--sb-green)}.sv-dot.err{color:var(--danger)}
/* 과목 화면 */
.sj-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}
.sj-top .tt{flex:1;min-width:240px}
.sj-top .tt .k{font-size:12px;font-weight:800;color:var(--ink-2)}
.sj-top .tt h2{margin:2px 0 6px;font-size:21px;font-weight:900;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sj-top .tt .m{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sj-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.sj-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.sj-tabs button{font-family:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);height:34px;padding:0 13px;border-radius:9px;cursor:pointer}
.sj-tabs button.on{background:var(--sb-mint-2);border-color:#9CCBB6;color:var(--sb-green)}
.st-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.st-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.st-nav b{font-size:16px;font-weight:900}
.it-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.it-row:last-child{border-bottom:0}
.it-row .tx{font-size:13px;line-height:1.55}
.it-row .tx small{display:block;color:var(--ink-3);font-weight:800;font-size:11px}
.nr-wrap{background:#fff;color:#15181A;border:1px solid #DDD9CE;border-radius:8px;padding:30px 36px;box-shadow:0 2px 14px rgba(30,57,50,.07)}
.lg-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.6}
.lg-row b{font-weight:800}.lg-row small{color:var(--ink-3)}
.stu-chips{display:flex;flex-wrap:wrap;gap:5px}
.stu-chips button{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:100px;padding:4px 10px;cursor:pointer}
.stu-chips button.on{background:var(--sb-house);border-color:var(--sb-house);color:#fff}
.stu-chips button.dn::after{content:' ✓';color:var(--sb-green)}
.stu-chips button.on.dn::after{color:#9FE0C2}
/* 설정 */
.dr{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.dr>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:900}
.dr>summary::-webkit-details-marker{display:none}
.dr>summary::after{content:'▾';margin-left:auto;color:var(--ink-3);transition:transform .15s}
.dr[open]>summary::after{transform:rotate(180deg)}
.dr>summary small{font-size:12px;font-weight:700;color:var(--ink-2)}
.dr .db{padding:2px 18px 16px}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
.fl>label,.fl>span.l{font-size:12px;font-weight:800;color:var(--ink-2)}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.frow>.fl{flex:1;min-width:160px}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk .p{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:100px;padding:4px 6px 4px 11px;font-size:12.5px;font-weight:700;background:var(--surface)}
.pk .p button{border:0;background:var(--sb-mint-2);border-radius:50%;width:20px;height:20px;cursor:pointer;color:var(--ink-2);font-size:11px;padding:0}
.stg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--surface)}
.stg .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.stg .no{width:26px;height:26px;border-radius:50%;background:var(--sb-house);color:#fff;font-weight:900;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.stg.fin .no{background:#6D28D9}
.cell-row{display:grid;grid-template-columns:36px minmax(140px,1.2fr) 110px minmax(160px,1.4fr) 90px auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.cell-row:last-child{border-bottom:0}
.cell-row .ord{display:flex;flex-direction:column;gap:2px}
.cell-row .ord button{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:16px;line-height:12px;font-size:9px;cursor:pointer;color:var(--ink-2);padding:0}
.tlist .tl-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.tlist .tl-row:last-child{border-bottom:0}
/* 출력 */
.pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.pv-pages{background:#E9E6DD;border-radius:12px;padding:20px 10px;overflow:auto}
html[data-theme="dark"] .pv-pages{background:#0C1512}
.pv-pages .np{transform-origin:top center}
.st-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.st-list .st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.st-list .st b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.st-list .st.st2{display:block}
.st2 .st-h{display:flex;align-items:center;gap:6px}
.st2 .st-l{font-size:12px;color:var(--ink-2);margin:4px 0 7px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st2 .st-b{display:flex;gap:4px;flex-wrap:wrap}
/* 출력본 편집 */
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.ed-side{position:sticky;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 40px);overflow:auto;padding:14px 16px}
.ed-pop{position:fixed;z-index:1200;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-md);padding:12px;width:min(420px,calc(100vw - 20px))}
.ed-pop .orig{font-size:12px;color:var(--ink-2);background:var(--sb-mint-2);border-radius:8px;padding:6px 9px;margin-bottom:8px;max-height:110px;overflow:auto;white-space:pre-wrap}
.tr-row{border-bottom:1px solid var(--line-soft);padding:8px 0;display:flex;flex-direction:column;gap:5px}
.tr-row .ko{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55}
.tr-row .ko b{color:var(--ink-3);font-size:11px;margin-right:4px}
/* 모달 · 알림 */
.mm-ov{position:fixed;inset:0;background:rgba(15,25,21,.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
.mm-box{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:720px;position:relative;font-family:'Noto Sans KR',-apple-system,sans-serif}
.mm-box.wide{max-width:1120px}.mm-box.mid{max-width:900px}
.mm-h{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:900}
.mm-h .x{margin-left:auto;border:0;background:var(--sb-mint-2);color:var(--ink-2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;flex:none}
.mm-b{padding:16px 20px;max-height:calc(100vh - 210px);overflow:auto}
.mm-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1E3932;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:12px;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;line-height:1.5}
.toast.err{background:#B42318}
.pop{position:fixed;z-index:1300;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:150px}
.pop button{display:flex;width:100%;gap:8px;align-items:center;font-family:inherit;font-size:13px;font-weight:800;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop button:hover{background:var(--sb-mint-2)}
.ck{display:inline-flex;gap:7px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--sb-green)}
.wz-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.wz-steps span{font-size:12px;font-weight:800;border-radius:100px;padding:4px 12px;background:#EEF0EE;color:#5A6560}
.wz-steps span.on{background:var(--sb-house);color:#fff}
.wz-steps span.dn{background:var(--sb-mint-2);color:var(--sb-green)}
@media (max-width:1000px){ .ed-grid{grid-template-columns:1fr} .ed-side{position:static;max-height:none} }
@media (max-width:700px){
  .nh-head h1{font-size:21px}
  .sj-top{padding:12px 13px}
  .sj-top .tt h2{font-size:18px}
  .nh-card{padding:13px 13px}
  .cell-row{grid-template-columns:30px minmax(0,1fr) auto;row-gap:6px}
  .cell-row .hide-m{display:none}
  .nr-wrap{padding:16px 12px}
  .mm-ov{padding:10px}
  .it-row{grid-template-columns:1fr}
  .it-row .lvs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .it-row .lvs button{min-width:0;padding:7px 2px;font-size:11.5px;letter-spacing:-.02em}
}
/* 로그인 */
#ls{display:none;min-height:100vh;align-items:center;justify-content:center;background:#F2F0EB}

<script type="module">

/* ── 작은 부품 ── */
A.toast = function(t, kind){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), kind === 'err' ? 4800 : 2600);
};
A.modal = function(title, body, foot, cls){
  const ov = document.createElement('div'); ov.className = 'mm-ov';
  ov.innerHTML = `<div class="mm-box ${cls || ''}" role="dialog" aria-modal="true">
    <div class="mm-h"><span style="min-width:0">${title}</span><button class="x" aria-label="닫기" data-x>✕</button></div>
    <div class="mm-b">${body}</div>${foot ? `<div class="mm-f">${foot}</div>` : ''}</div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); if(m.onClose) m.onClose(); };
  const onKey = e => { if(e.key === 'Escape' && document.body.lastElementChild === ov) close(); };
  ov.addEventListener('mousedown', e => { if(e.target === ov) close(); });
  ov.querySelector('[data-x]').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
  const m = { el: ov, box: ov.querySelector('.mm-box'), body: ov.querySelector('.mm-b'), close, onClose: null };
  return m;
};
A.confirm = function(title, msg, okLabel, danger){
  return new Promise(res => {
    const m = A.modal(title, `<div style="font-size:13.5px;line-height:1.75">${msg}</div>`,
      `<button class="nh-btn" data-n>취소</button><button class="nh-btn ${danger ? 'r' : 'p'}" data-y>${esc(okLabel || '확인')}</button>`);
    let done = false;
    m.onClose = () => { if(!done) res(false); };
    m.box.querySelector('[data-n]').onclick = () => { m.close(); };
    m.box.querySelector('[data-y]').onclick = () => { done = true; m.close(); res(true); };
  });
};
A.prompt = function(title, label, value, opt){
  opt = opt || {};
  return new Promise(res => {
    const m = A.modal(title, `<div class="fl"><label>${label}</label>${opt.multi
      ? `<textarea class="nh-ta" data-v rows="4" placeholder="${esc(opt.ph || '')}">${esc(value || '')}</textarea>`
      : `<input class="nh-in" data-v value="${esc(value || '')}" placeholder="${esc(opt.ph || '')}">`}</div>${opt.help ? `<div class="nh-desc">${opt.help}</div>` : ''}`,
      `<button class="nh-btn" data-n>취소</button><button class="nh-btn ${opt.danger ? 'r' : 'p'}" data-y>${esc(opt.ok || '확인')}</button>`);
    let done = false;
    const inp = m.box.querySelector('[data-v]'); setTimeout(() => inp.focus(), 30);
    m.onClose = () => { if(!done) res(null); };
    m.box.querySelector('[data-n]').onclick = () => m.close();
    m.box.querySelector('[data-y]').onclick = () => {
      const v = inp.value;
      if(opt.required && !v.trim()){ A.toast(opt.required, 'err'); return; }
      done = true; m.close(); res(v);
    };
    if(!opt.multi) inp.addEventListener('keydown', e => { if(e.key === 'Enter') m.box.querySelector('[data-y]').click(); });
  });
};
A.popMenu = function(anchor, items){
  document.querySelectorAll('.pop').forEach(p => p.remove());
  const r = anchor.getBoundingClientRect();
  const p = document.createElement('div'); p.className = 'pop';
  p.innerHTML = items.map((it, i) => `<button data-i="${i}">${it.l}</button>`).join('');
  document.body.appendChild(p);
  const w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
  p.style.top = (r.bottom + 4 + h > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  const off = e => { if(!p.contains(e.target)){ p.remove(); document.removeEventListener('mousedown', off, true); } };
  setTimeout(() => document.addEventListener('mousedown', off, true), 0);
  p.onclick = e => { const b = e.target.closest('button'); if(!b) return; p.remove(); document.removeEventListener('mousedown', off, true); items[+b.dataset.i].f(); };
  return p;
};
A.errText = function(e){
  const c = (e && e.code) || '';
  if(/permission/.test(c)) return A.ruleMissing ? '보안 규칙 v35가 아직 게시되지 않았어요' : '권한이 없어요 (이미 다음 단계로 넘어갔거나 맡은 칸이 아니에요)';
  if(/unavailable|network/.test(c)) return '인터넷 연결을 확인해 주세요';
  return (e && (e.message || e.code)) || '알 수 없는 오류';
};
A.staffName = uid => (A.SMAP[uid] && A.SMAP[uid].name) || '';
A.secOf = id => ((A.TERM && A.TERM.sections) || []).find(s => s.id === id) || null;
A.subOf = id => A.SUBS.find(s => s.id === id) || null;
A.stuName = sid => (A.STU[sid] && A.STU[sid].name) || '(이름 없음)';
A.stuLabel = sid => { const s = A.STU[sid]; return s ? `${s.name}${s.studentNo ? ` (${s.studentNo})` : ''}` : '(학생 정보 없음)'; };
A.subStudents = sub => C.subStudents(sub, A.secOf(sub.secId)).slice().sort((a, b) => String(A.STU[a] && A.STU[a].studentNo || 'z').localeCompare(String(A.STU[b] && A.STU[b].studentNo || 'z')) || A.stuName(a).localeCompare(A.stuName(b), 'ko'));
A.subLabel = sub => sub ? (sub.kind === 'subj' ? sub.name : (sub.name || (C.KINDS[sub.kind] || {}).ko || sub.kind)) : '';
A.staffPick = () => A.STAFF.filter(s => (s.acStatus || 'active') !== 'quit' && !s.noAuth)
  .filter(s => s.role === 'super' || s.org === 'daniel' || (s.orgs || []).includes('daniel'))
  .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
A.stateChip = sub => { const s = C.stateOf(sub); return `<span class="ch ${s.tone}">${esc(s.ko)}</span>`; };
A.typeChip = sub => sub.kind === 'subj' ? `<span class="ch type">${esc((C.TYPES[sub.type] || C.TYPES.E).short)}</span>` : `<span class="ch type">${esc((C.KINDS[sub.kind] || {}).icon || '')} ${esc(((C.KINDS[sub.kind] || {}).ko || '').split(' (')[0])}</span>`;
A.me = () => ({ uid: A.CU.uid, name: A.CU.name || '' });

/* ── 저장 ── */
A.saveSub = async function(id, patch){
  const p = Object.assign({}, patch, { updatedAt: serverTimestamp(), updatedBy: A.CU.uid });
  await updateDoc(doc(db, 'nhpSubjects', id), p);
  const s = A.subOf(id); if(s) Object.assign(s, patch);
};
/* 상태 바꾸기 — 알림까지 */
A.act = async function(sub, act, msg){
  const before = Object.assign({}, sub);
  const patch = C.patchFor(sub, act, A.me(), msg);
  await A.saveSub(sub.id, patch);
  const after = Object.assign({}, before, patch);
  const sec = A.secOf(sub.secId);
  const where = `${C.secLabel(sec)} · ${A.subLabel(sub)}`;
  const link = `nhp.html#s/${sub.id}`;
  let to = [], title = '', body = '', kind = '';
  if(act === 'redo'){ to = sub.teacherUids || []; kind = 'redo'; title = '↩️ 나학평 수정 요청'; body = `${where} — ${msg || ''}`; }
  else if(act === 'approve'){ to = sub.teacherUids || []; kind = 'done'; title = '✅ 나학평 승인'; body = `${where} — 최종 승인되었어요`; }
  else if(act === 'reopen'){ to = sub.teacherUids || []; kind = 'reopen'; title = '🔓 나학평 다시 열림'; body = `${where}${msg ? ' — ' + msg : ''}`; }
  else if(act === 'submit' || act === 'ok'){ to = C.turnOf(after); kind = 'turn'; title = '📒 나학평 검토할 칸'; body = `${where} — ${C.stateOf(after).ko}`; }
  to = C.uniq(to).filter(u => u !== A.CU.uid);
  if(!to.length) return patch;
  // 알림 (받는 사람만 읽는 곳) — «검토할 칸»은 너무 많아지지 않게 화면 «내 할 일»과 사이드바 숫자로만, 나머지는 알림 + 휴대폰
  if(kind !== 'turn'){
    try{
      const bt = writeBatch(db);
      to.forEach(u => bt.set(doc(collection(db, 'nhpNotifs')), { toUid: u, fromUid: A.CU.uid, fromName: A.CU.name || '', kind, termId: sub.termId,
        subjectId: sub.id, text: body.slice(0, 300), read: false, createdAt: serverTimestamp() }));
      await bt.commit();
    }catch(e){}
  }
  try{ notifyStaff(auth, db, { uids: to, kind: 'etc', title, body, link }); }catch(e){}
  return patch;
};

/* ── 읽기 ── */
async function loadStaff(){
  const snap = await cachedCol(db, 'staff', { uid: A.CU.uid });
  A.STAFF = []; A.SMAP = {};
  snap.forEach(d => { const s = Object.assign({ uid: d.id }, d.data()); A.STAFF.push(s); A.SMAP[d.id] = s; });
}
async function loadStudents(){
  // v142: 늘 서버에서 — 탭에 기억해 둔 학생 명단은 이름 · 학번 · 반만 남겨 두어서(listcache) 생년월일 · 영문 이름이 빠진다
  const snap = await cachedCol(db, 'students', { uid: A.CU.uid, fresh: true });
  A.STU = {}; snap.forEach(d => { A.STU[d.id] = Object.assign({ id: d.id }, d.data()); });
}
/* 학생 알아보기 — 생년월일 · 학번 · 올해 반 (같은 이름 학생을 가르기 위해) */
A.stuClassOf = function(sid){
  const y = A.TERM ? Number(A.TERM.year) : new Date().getFullYear();
  const c = (A.CLASSES || []).find(x => x.org === C.ORG && Number(x.year) === y && (x.students || []).includes(sid));
  if(!c) return '';
  const g = (c.grades && c.grades[sid]) || (Array.isArray(c.gradeList) && c.gradeList.length === 1 ? c.gradeList[0] : c.grade) || '';
  return `${c.name || ''}${g ? ' ' + g : ''}`;
};
A.stuInfo = function(sid){
  const s = A.STU[sid]; if(!s) return '';
  const st = window.StuStatus ? StuStatus.status(s) : (s.status || 'active');
  const ST = { leave: '휴학', quit: '자퇴', grad: '졸업', egrad: '조기졸업' };
  return [s.birth ? s.birth : '생일 없음', s.studentNo ? '학번 ' + s.studentNo : '', A.stuClassOf(sid), ST[st] || ''].filter(Boolean).join(' · ');
};
/* 학생 고르기 (한 명) — 같은 이름 · 비슷한 출생연도를 위에 · «잇지 않음»도 고를 수 있음
   돌려주는 값: 학생 id · '' (잇지 않음) · null (취소) */
A.pickStudent = function(title, opt){
  opt = opt || {};
  return new Promise(res => {
    const nm = String(opt.name || '').replace(/\s+/g, '');
    const eb = opt.birthYear || 0;
    const by = s => Number(String(s.birth || '').slice(0, 4)) || 0;
    const all = Object.values(A.STU).filter(s => s.org === C.ORG && !s.deleted);
    const score = s => (String(s.name || '').replace(/\s+/g, '') === nm ? 100 : 0) + (eb && by(s) ? Math.max(0, 10 - Math.abs(by(s) - eb) * 5) : 0);
    all.sort((a, b) => score(b) - score(a) || String(a.name).localeCompare(String(b.name), 'ko'));
    const m = A.modal(esc(title), `${opt.help ? `<div class="nh-desc">${opt.help}</div>` : ''}
      <input class="nh-in" data-q placeholder="이름 찾기" style="width:100%;margin:6px 0 10px">
      <label class="ck" style="display:flex;margin-bottom:6px"><input type="radio" name="pk-stu" value=""${!opt.current ? ' checked' : ''}><b>— 잇지 않음 (이름으로만 보관) —</b></label>
      <div data-list style="max-height:52vh;overflow:auto"></div>`,
      '<button class="nh-btn" data-c>취소</button><button class="nh-btn p" data-ok>저장</button>', 'mid');
    const box = m.box.querySelector('[data-list]');
    let cur = opt.current || '';
    const draw = () => {
      const q = m.box.querySelector('[data-q]').value.trim();
      const list = all.filter(s => !q || String(s.name || '').includes(q)).slice(0, 200);
      box.innerHTML = list.map(s => { const same = score(s) >= 100; return `<label class="ck" style="display:flex;align-items:baseline;gap:6px;padding:4px 0;border-bottom:1px solid var(--line-soft)"><input type="radio" name="pk-stu" value="${esc(s.id)}"${cur === s.id ? ' checked' : ''}><b>${esc(s.name || '')}</b><small style="color:var(--ink-2)">${esc(A.stuInfo(s.id))}</small>${same ? '<span class="ch mint" style="margin-left:auto">이름 같음</span>' : ''}</label>`; }).join('') || '<div class="nh-desc">찾는 학생이 없어요.</div>';
    };
    m.box.addEventListener('change', e => { if(e.target.name === 'pk-stu') cur = e.target.value; });
    m.box.querySelector('[data-q]').addEventListener('input', draw);
    let done = false;
    m.onClose = () => { if(!done) res(null); };
    m.box.querySelector('[data-c]').onclick = () => m.close();
    m.box.querySelector('[data-ok]').onclick = () => { done = true; m.close(); res(cur); };
    draw();
  });
};
A.loadClasses = async function(){
  if(A.CLASSES) return A.CLASSES;
  const snap = await cachedCol(db, 'classes', { uid: A.CU.uid });
  A.CLASSES = []; snap.forEach(d => A.CLASSES.push(Object.assign({ id: d.id }, d.data())));
  return A.CLASSES;
};
A.loadTerms = async function(){
  const snap = await getDocs(collection(db, 'nhpTerms'));
  A.TERMS = []; snap.forEach(d => A.TERMS.push(Object.assign({ id: d.id }, d.data())));
  A.TERMS.sort((a, b) => (b.year - a.year) || (b.term - a.term));
};
let unSubs = null, unNotif = null, unTerm = null;
A.useTerm = async function(id){
  if(unSubs){ unSubs(); unSubs = null; }
  if(unTerm){ unTerm(); unTerm = null; }
  A.TERM = A.TERMS.find(t => t.id === id) || null;
  A.SUBS = []; A.ENT = {}; A.LISTS = {};
  if(!A.TERM) return;
  lsSet('nhp_term', id);
  await new Promise(res => {
    let first = true;
    unSubs = onSnapshot(query(collection(db, 'nhpSubjects'), where('termId', '==', id)), snap => {
      A.SUBS = []; snap.forEach(d => A.SUBS.push(Object.assign({ id: d.id }, d.data())));
      A.SUBS.sort((a, b) => (a.order || 0) - (b.order || 0));
      if(first){ first = false; res(); } else softRender();
    }, err => { A.toast('칸 목록을 받지 못했어요 — ' + A.errText(err), 'err'); if(first){ first = false; res(); } });
  });
  unTerm = onSnapshot(doc(db, 'nhpTerms', id), d => {
    if(!d.exists()) return;
    const t = Object.assign({ id: d.id }, d.data());
    const i = A.TERMS.findIndex(x => x.id === id); if(i >= 0) A.TERMS[i] = t;
    const changed = JSON.stringify(A.TERM) !== JSON.stringify(t);
    A.TERM = t; if(changed) softRender();
  }, () => {});
  try{ const l = await getDoc(doc(db, 'nhpLists', id)); A.LISTS = l.exists() ? l.data() : {}; }catch(e){ A.LISTS = {}; }
};
A.reloadLists = async function(){ try{ const l = await getDoc(doc(db, 'nhpLists', A.TERM.id)); A.LISTS = l.exists() ? l.data() : {}; }catch(e){} };
A.getEntry = async function(subId, fresh){
  if(!fresh && A.ENT[subId]) return A.ENT[subId];
  try{ const d = await getDoc(doc(db, 'nhpEntries', subId)); A.ENT[subId] = d.exists() ? d.data() : { rows: {} }; }
  catch(e){ A.ENT[subId] = { rows: {} }; }
  return A.ENT[subId];
};
/* 반 한 곳의 입력을 한꺼번에 (출력 · 미리보기) */
A.loadSectionEntries = async function(secId){
  const subs = A.SUBS.filter(s => s.secId === secId);
  await Promise.all(subs.map(s => A.getEntry(s.id, true)));
  const out = {}; subs.forEach(s => { out[s.id] = A.ENT[s.id]; });
  return out;
};
function watchNotifs(){
  if(unNotif) unNotif();
  unNotif = onSnapshot(query(collection(db, 'nhpNotifs'), where('toUid', '==', A.CU.uid), where('read', '==', false)), snap => {
    A.NOTIFS = []; snap.forEach(d => A.NOTIFS.push(Object.assign({ id: d.id }, d.data())));
    A.NOTIFS.sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));
    if(VIEW === 'home') softRender();
  }, () => {});
}
A.readNotif = async function(n){ try{ await updateDoc(doc(db, 'nhpNotifs', n.id), { read: true, readAt: serverTimestamp() }); }catch(e){} };

/* ═══ 화면 고르기 (주소 # 뒤) ═══
   #home · #board · #print · #print/반id · #past · #setup · #s/칸id/탭 */
let VIEW = 'home';
function parseHash(){
  const h = (location.hash || '#home').slice(1).split('/');
  return { v: h[0] || 'home', a: decodeURIComponent(h[1] || ''), b: decodeURIComponent(h[2] || '') };
}
A.go = function(v){ if(location.hash === '#' + v) route(); else location.hash = v; };
window.addEventListener('hashchange', () => route());
let RENDER_T = null;
function softRender(){
  // 입력 중에는 화면을 다시 그리지 않는다 (글을 쓰는 칸이 날아가지 않게) — 입력 화면은 스스로 고친다
  if(VIEW === 's'){ if(ENTRY.onLive) ENTRY.onLive(A); return; }
  if(VIEW === 'setup'){ if(SETUP.onLive) SETUP.onLive(A); return; }
  if(VIEW === 'edit') return;
  clearTimeout(RENDER_T); RENDER_T = setTimeout(() => route(true), 250);
}
async function route(soft){
  const r = parseHash();
  VIEW = r.v;
  const root = $I('nh');
  if(!A.CU) return;
  if(r.v === 's'){ root.innerHTML = headHTML('home') + `<div id="nh-body"></div>`; bindHead(); await ENTRY.render(A, $I('nh-body'), r.a, r.b); return; }
  if(r.v === 'setup'){ root.innerHTML = headHTML('setup') + `<div id="nh-body"></div>`; bindHead(); await SETUP.render(A, $I('nh-body'), r.a); return; }
  if(r.v === 'edit'){ root.innerHTML = headHTML(r.a.startsWith('past') ? 'past' : 'print') + `<div id="nh-body"></div>`; bindHead(); await EDIT.render(A, $I('nh-body'), r.a, r.b); return; }
  const y = soft ? window.scrollY : 0;
  let body = '';
  if(r.v === 'board') body = boardHTML();
  else if(r.v === 'print') body = await printHTML(r.a);
  else if(r.v === 'past') body = await pastHTML(r.a);
  else { VIEW = 'home'; body = homeHTML(); }
  root.innerHTML = headHTML(VIEW) + `<div id="nh-body">${body}</div>`;
  bindHead();
  if(soft) window.scrollTo(0, y);
}
A.route = route;

function dueText(d){
  if(!d) return '';
  const t = new Date(d + 'T23:59:59'), n = new Date();
  const days = Math.ceil((t - n) / 864e5);
  if(days < 0) return `<span class="ch red">마감 ${-days}일 지남</span>`;
  if(days === 0) return `<span class="ch warn">오늘 마감</span>`;
  return `<span class="ch ${days <= 3 ? 'warn' : 'gray'}">D-${days}</span>`;
}

let BD_F = lsGet('nhp_bdf', 'all');
function boardHTML(){

async function bulkAct(secId){
  const uid = A.CU.uid;
  const ss = A.SUBS.filter(s => s.secId === secId && !s.removed && (s.turn || []).includes(uid) && (s.state === 'review' || s.state === 'final'));
  if(!ss.length) return;
  const fin = ss.filter(s => s.state === 'final').length, rv = ss.length - fin;
  const ok = await A.confirm('한꺼번에 넘기기', `${esc(C.secLabel(A.secOf(secId)))}에서 지금 내 차례인 <b>${ss.length}칸</b>을 넘깁니다.<br>${rv ? `· 검토완료 → 다음 단계: ${rv}칸<br>` : ''}${fin ? `· 최종 승인(잠김): ${fin}칸<br>` : ''}<span style="color:var(--ink-2)">내용을 다 보셨는지 한 번 더 확인해 주세요. (미리보기로 학생별 문서를 볼 수 있어요)</span>`, '모두 넘기기');
  if(!ok) return;
  window.showLoading && showLoading('넘기는 중…');
  let n = 0, f = 0;
  for(const s of ss){
    try{ await A.act(s, s.state === 'final' ? 'approve' : 'ok'); n++; window.setLoadStep && setLoadStep(`넘기는 중… ${n}/${ss.length}`, Math.round(n / ss.length * 100)); }
    catch(e){ f++; }
  }

  A.toast(f ? `${n}칸 넘김 · ${f}칸 실패 (${A.errText({ code: 'permission' })})` : `${n}칸을 넘겼어요 ✓`, f ? 'err' : '');
  route(true);
}

    <div class="pv-pages"><div class="np-pages" style="--np-zoom:.8"></div></div>`, '', 'wide');
  const holder = m.box.querySelector('.np-pages');
  pages.forEach(p => holder.appendChild(p));
  if(innerWidth < 900){ holder.style.setProperty('--np-zoom', String(Math.max(0.35, (innerWidth - 60) / 794))); m.box.querySelector('[data-x-zoom]').style.display = 'none'; }
  m.box.querySelector('[data-x-zoom]').onchange = e => holder.style.setProperty('--np-zoom', e.target.value);
  m.box.querySelector('[data-x-print]').onclick = () => P.printPages(pages, [doc.lang === 'en' ? 'My School Life' : '나학평', doc.cover.term, doc.cover.cls, doc.cover.name]);
  m.box.querySelector('[data-x-pdf]').onclick = async () => {
    window.showLoading && showLoading('PDF를 만드는 중…');
    try{ await P.pdfPages([pages], A.fileName(doc, opt.draft ? '승인 전' : (opt.suffix || '')), { onStep: (i, n) => window.setLoadStep && setLoadStep(`PDF ${i} / ${n}쪽`, Math.round(i / n * 100)) }); }
    catch(e){ A.toast('PDF를 만들지 못했어요 — ' + (e.message || e), 'err'); }
    window.hideLoading && hideLoading();
  };
  return m;
};
async function sectionPages(secId, cb){
  const sec = A.secOf(secId);
  const ss = A.SUBS.filter(s => s.secId === secId && !s.removed);
  const draft = ss.some(s => s.state !== 'done');
  const entries = await A.loadSectionEntries(secId);
  const ids = (sec.students || []).slice().sort((a, b) => String((A.STU[a] || {}).studentNo || 'z').localeCompare(String((A.STU[b] || {}).studentNo || 'z')));
  const sets = [];
  for(let i = 0; i < ids.length; i++){
    const sid = ids[i]; const st = A.STU[sid] || { name: '' };
    cb && cb(i + 1, ids.length, st.name);
    const doc = C.buildReport({ term: A.TERM, sec, stu: { id: sid, name: st.name, studentNo: st.studentNo }, subs: ss, entries, lists: A.LISTS, staffName: A.staffName });
    sets.push(await A.pagesOf(doc, { footR: (st.name || '') + (draft ? ' · 승인 전 미리보기' : '') }));
  }
  return { sets, draft, sec };
}
async function sectionPdf(secId, print){
  window.showLoading && showLoading('반 전체 문서를 만드는 중…');
  try{
    const { sets, draft, sec } = await sectionPages(secId, (i, n, nm) => window.setLoadStep && setLoadStep(`문서 만드는 중… ${i}/${n} ${nm}`, Math.round(i / n * 40)));
    if(print){ window.hideLoading && hideLoading(); P.printPages(sets.flat(), ['나학평', C.termLabel(A.TERM), C.secLabel(sec)]); return; }
    const name = window.FN ? FN.make(['나학평', C.termLabel(A.TERM), C.secLabel(sec), draft ? '승인 전' : ''], { ext: '.pdf' }) : '나학평.pdf';
    await P.pdfPages(sets, name, { onStep: (i, n) => window.setLoadStep && setLoadStep(`PDF ${i} / ${n}쪽`, 40 + Math.round(i / n * 60)) });
  }catch(e){ A.toast('만들지 못했어요 — ' + (e.message || e), 'err'); console.error(e); }
  window.hideLoading && hideLoading();
}
/* 🔒 원본 확정 — 반 학생마다 지금 문서를 원본으로 (예전 원본이 있으면 «새 원본으로 바뀜» 표시 · 그대로 보관) */
async function issueOriginals(secId){
  const sec = A.secOf(secId);
  const ss = A.SUBS.filter(s => s.secId === secId && !s.removed);
  if(ss.some(s => s.state !== 'done')){ A.toast('승인 전 칸이 있어요.', 'err'); return; }
  let old = [];
  try{ const q = await getDocs(query(collection(db, 'nhpReports'), where('termId', '==', A.TERM.id), where('secId', '==', secId))); q.forEach(d => old.push(Object.assign({ id: d.id }, d.data()))); }catch(e){}
  const ok = await A.confirm('🔒 원본 확정', `${esc(C.secLabel(sec))} <b>${(sec.students || []).length}명</b>의 나학평을 원본으로 확정합니다.<br>· 원본은 그 뒤로 <b>내용을 바꿀 수 없어요</b> (보관용 · 학부모 발송용)<br>${old.length ? `· 이미 확정한 원본 ${old.filter(o => !o.superseded).length}개는 «새 원본으로 바뀜» 표시를 하고 그대로 보관해요<br>` : ''}· 고쳐서 내보내야 하면 «출력본»을 만드세요 (원본은 그대로)`, '원본 확정');
  if(!ok) return;
  window.showLoading && showLoading('원본을 만드는 중…');
  try{
    const entries = await A.loadSectionEntries(secId);
    const ids = sec.students || [];
    let n = 0;
    for(let i = 0; i < ids.length; i += 20){
      const bt = writeBatch(db);
      ids.slice(i, i + 20).forEach(sid => {
        const st = A.STU[sid] || { name: '' };
        const doc0 = C.buildReport({ term: A.TERM, sec, stu: { id: sid, name: st.name, studentNo: st.studentNo }, subs: ss, entries, lists: A.LISTS, staffName: A.staffName });
        const prev = old.filter(o => o.sid === sid);
        const ver = prev.reduce((m, o) => Math.max(m, o.ver || 1), 0) + 1;
        prev.filter(o => !o.superseded).forEach(o => bt.update(doc(db, 'nhpReports', o.id), { superseded: true, supersededAt: serverTimestamp(), supersededBy: A.CU.uid }));
        bt.set(doc(db, 'nhpReports', `${A.TERM.id}__${sid}__v${ver}`), { termId: A.TERM.id, org: C.ORG, secId, secName: C.secLabel(sec), sid, ver, src: 'live', doc: doc0,
          stuName: st.name || '', stuNo: st.studentNo || '', issuedBy: A.CU.uid, issuedByName: A.CU.name || '', issuedAt: serverTimestamp() });
        n++;
      });
      await bt.commit();
      window.setLoadStep && setLoadStep(`원본 ${n}/${ids.length}`, Math.round(n / ids.length * 100));
    }
    A.toast(`${n}명의 원본을 확정했어요 🔒`);
  }catch(e){ A.toast('원본을 만들지 못했어요 — ' + A.errText(e), 'err'); }
  window.hideLoading && hideLoading();
  route(true);
}

/* ═══ 🗂 지난 나학평 (옮겨 온 원본 · 지난 학기 원본) ═══
   · 학기 문서의 반 목록으로 서랍을 만들고, 서랍을 열 때 그 반 원본만 읽는다 (원본 문서가 커서 학기 전체를 한 번에 읽지 않게) */
async function pastHTML(termId){
  const terms = A.TERMS;
  const t = terms.find(x => x.id === termId) || null;
  let h = `<div class="nh-card"><h3>🗂 지난 나학평</h3><p class="nh-desc">예전 나학평 프로그램에서 옮겨 온 자료와, 원본을 확정한 학기를 봅니다. <b>원본은 그대로 보존</b>되고, 용어를 바꾸거나 일부를 가리거나 영문으로 내보낼 때는 «출력본»을 만들어요.${A.isMgr ? ' 옮겨 온 원본이 다른 학생과 이어졌거나 «연결 안 됨»이면 «🔗 잇기»로 고칠 수 있어요 (내용은 그대로).' : ''}</p>
    <div class="frow"><div class="fl" style="max-width:360px"><label>학기</label><select class="nh-sel" id="ps-term"><option value="">학기를 고르세요</option>${terms.map(x => `<option value="${esc(x.id)}"${x.id === termId ? ' selected' : ''}>${esc(C.termLabel(x))}${x.src === 'import' ? ' · 옮겨 온 자료' : ''}</option>`).join('')}</select></div></div></div>`;
  if(!t) return h;
  const secs = (t.sections || []).slice().sort((a, b) => (a.gradeNo || 99) - (b.gradeNo || 99) || String(a.name).localeCompare(String(b.name), 'ko'));
  if(!secs.length) return h + `<div class="nh-empty">이 학기에는 반이 없어요.</div>`;
  h += secs.map(s => { const n = t.src === 'import' ? (s.n || (s.students || []).length) : (s.students || []).length;
    return `<details class="dr" data-pastsec="${esc(s.id)}" data-term="${esc(t.id)}"><summary>${esc(C.secLabel(s))} <small>${n ? n + '명' : ''}</small></summary><div class="db"><div class="nh-desc">여는 중…</div></div></details>`; }).join('');
  return h;
}
const PAST_REPS = {};
async function loadPastSec(det, force){
  if(det.dataset.loaded && !force) return;
  det.dataset.loaded = '1';
  const box = det.querySelector('.db');
  try{ await A.loadClasses(); }catch(e){}
  let reps = [];
  try{
    const q = await getDocs(query(collection(db, 'nhpReports'), where('termId', '==', det.dataset.term), where('secId', '==', det.dataset.pastsec)));
    q.forEach(d => { const x = d.data(); if(!x.superseded) reps.push({ id: d.id, sid: x.sid || '', src: x.src || '', stuName: x.stuName || (x.doc && x.doc.cover && x.doc.cover.name) || '', stuNo: x.stuNo || '', ver: x.ver || 1, termId: x.termId, secName: x.secName || '' }); });
  }catch(e){ box.innerHTML = `<div class="nh-warn">원본을 읽지 못했어요 — ${esc(A.errText(e))}</div>`; return; }
  if(!reps.length){ box.innerHTML = `<div class="nh-desc">확정한 원본이 없어요.</div>`; return; }
  reps.forEach(r => { PAST_REPS[r.id] = r; });
  const canLink = A.isMgr;
  box.innerHTML = `<div class="st-list">${reps.sort((a, b) => String(a.stuNo).localeCompare(String(b.stuNo)) || a.stuName.localeCompare(b.stuName, 'ko')).map(r => {
    // v142: 옮겨 온 원본은 «어느 학생인지»(잇기)만 나중에 고칠 수 있다 — 내용은 그대로
    const link = r.src !== 'import' ? '' : r.sid ? `<span title="${esc(A.stuInfo(r.sid))}">🔗 ${esc(A.stuName(r.sid))}${A.STU[r.sid] && A.STU[r.sid].birth ? ' · ' + esc(A.STU[r.sid].birth) : ''}</span>` : '<span class="ch warn" title="교사 선교사 학생과 아직 연결되지 않음">연결 안 됨</span>';
    return `<div class="st st2"><div class="st-h"><b title="${esc(r.stuName)} ${esc(r.stuNo)}">${esc(r.stuName || A.stuName(r.sid))}</b>${r.ver > 1 ? `<span class="ch gray">v${r.ver}</span>` : ''}</div>
      <div class="st-l">${link}</div>
      <div class="st-b"><button class="nh-btn xs" data-rp="${esc(r.id)}">원본 보기</button><button class="nh-btn xs" data-red="${esc(r.id)}">출력본</button>${canLink && r.src === 'import' ? `<button class="nh-btn xs" data-rlink="${esc(r.id)}" title="이 원본이 교사 선교사의 어느 학생인지 고치기 (내용은 그대로)">🔗 잇기</button>` : ''}</div></div>`;
  }).join('')}</div>`;
}
/* 🔗 옮겨 온 원본 — 학생 잇기 고치기 (나학평 담당) · 같은 예전 학번의 다른 학기 원본도 함께 고칠지 묻는다 */
async function relinkReport(rid){
  const r = PAST_REPS[rid]; if(!r) return;
  try{ await A.loadClasses(); }catch(e){}
  const by = /^\d{8}$/.test(r.stuNo) ? Number(r.stuNo.slice(0, 4)) - 7 : 0;
  const sid = await A.pickStudent(`🔗 ${r.stuName} (예전 학번 ${r.stuNo || '-'}) — 어느 학생인가요?`, { name: r.stuName, birthYear: by, current: r.sid,
    help: `원본 내용은 그대로 두고, 교사 선교사의 어느 학생 것인지만 고쳐요.${by ? ` 예전 학번으로 보면 ${by}년생쯤이에요.` : ''}` });
  if(sid == null || sid === r.sid) return;
  // 같은 예전 학번의 다른 원본 (다른 학기) — 함께 고칠지
  let others = [];
  if(r.stuNo){
    try{ const q = await getDocs(query(collection(db, 'nhpReports'), where('stuNo', '==', r.stuNo))); q.forEach(d => { const x = d.data(); if(d.id !== rid && x.src === 'import' && (x.sid || '') !== sid && String(x.stuName || '') === String(r.stuName || '')) others.push({ id: d.id, termId: x.termId }); }); }catch(e){}
  }
  let all = false;
  if(others.length) all = await A.confirm('🔗 다른 학기도 함께?', `같은 예전 학번(${esc(r.stuNo)} · ${esc(r.stuName)})의 다른 학기 원본 <b>${others.length}개</b>도 같은 학생으로 고칠까요?<br><span style="color:var(--ink-2)">${others.map(o => esc(C.termLabel(A.TERMS.find(t => t.id === o.termId) || { id: o.termId }))).join(', ')}</span>`, '모두 고치기');
  const ids = [rid].concat(all ? others.map(o => o.id) : []);
  try{
    const bt = writeBatch(db);
    ids.forEach(id => bt.update(doc(db, 'nhpReports', id), { sid: sid || '', linkedBy: A.CU.uid, linkedByName: A.CU.name || '', linkedAt: serverTimestamp() }));
    await bt.commit();
    A.toast(sid ? `${ids.length}개 원본을 «${A.stuName(sid)}» 학생과 이었어요 ✓ (내용은 그대로)` : `${ids.length}개 원본의 연결을 풀었어요 (이름으로 보관)`);
  }catch(e){ A.toast('고치지 못했어요 — ' + A.errText(e) + (/permission/.test((e && e.code) || '') ? ' (보안 규칙 v36이 필요해요)' : ''), 'err'); return; }
  document.querySelectorAll('details[data-pastsec]').forEach(d => { if(d.dataset.loaded) loadPastSec(d, true); });
}
document.addEventListener('toggle', e => { const d = e.target; if(d && d.matches && d.matches('details[data-pastsec]') && d.open) loadPastSec(d); }, true);
async function viewReport(rid){
  window.showLoading && showLoading('원본을 여는 중…');
  try{
    const d = await getDoc(doc(db, 'nhpReports', rid));
    if(!d.exists()) throw new Error('원본이 없어요');
    const r = d.data();
    const pages = await A.pagesOf(r.doc);
    window.hideLoading && hideLoading();
    A.showPages(pages, `🔒 원본 — ${esc(r.doc.cover.name)} · ${esc(r.doc.cover.term)}`, r.doc, { suffix: '원본' });
  }catch(e){ window.hideLoading && hideLoading(); A.toast('열지 못했어요 — ' + A.errText(e), 'err'); }
}

/* ═══ 누르기 (한 곳에서) ═══ */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-act],[data-open],[data-notif],[data-board],[data-printsec],[data-bdf],[data-bulk],[data-pv],[data-edo],[data-prall],[data-prprint],[data-issue],[data-rp],[data-red],[data-rlink]');
  if(!t || !$I('nh').contains(t)) return;
  if(t.dataset.go){ A.go(t.dataset.go); return; }
  if(t.dataset.open){ A.go('s/' + t.dataset.open); return; }
  if(t.dataset.board){ BD_F = 'all'; A.go('board'); return; }
  if(t.dataset.printsec){ e.stopPropagation(); A.go('print/' + t.dataset.printsec); return; }
  if(t.dataset.bdf){ BD_F = t.dataset.bdf; lsSet('nhp_bdf', BD_F); route(true); return; }
  if(t.dataset.bulk){ bulkAct(t.dataset.bulk); return; }
  if(t.dataset.pv){ previewStudent(t.dataset.sec, t.dataset.pv); return; }
  if(t.dataset.edo){ A.go(`edit/live:${t.dataset.sec}:${t.dataset.edo}`); return; }
  if(t.dataset.prall){ sectionPdf(t.dataset.prall); return; }
  if(t.dataset.prprint){ sectionPdf(t.dataset.prprint, true); return; }
  if(t.dataset.issue){ issueOriginals(t.dataset.issue); return; }
  if(t.dataset.rp){ viewReport(t.dataset.rp); return; }
  if(t.dataset.red){ A.go(`edit/past:${t.dataset.red}`); return; }
  if(t.dataset.rlink){ relinkReport(t.dataset.rlink); return; }
  if(t.dataset.notif){ const n = A.NOTIFS.find(x => x.id === t.dataset.notif); if(n){ A.readNotif(n); if(n.subjectId) A.go('s/' + n.subjectId); } return; }
  const a = t.dataset.act;
  if(a === 'newterm'){ SETUP.openWizard(A); return; }
  if(a === 'readall'){ A.NOTIFS.forEach(n => A.readNotif(n)); return; }
});
document.addEventListener('change', e => {
  if(e.target.id === 'pr-sec') A.go('print/' + e.target.value);
  if(e.target.id === 'ps-term') A.go('past/' + e.target.value);
});

/* ═══ 시작 ═══ */
function boot(){
  onAuthStateChanged(auth, async user => {
    if(!user){ window.hideLoading && hideLoading(); $I('ls').style.display = 'flex'; $I('ms').style.display = 'none'; return; }
    let st = null;
    try{ st = await getDoc(doc(db, 'staff', user.uid)); }catch(e){ st = null; }
    if(!st || !st.exists()){ $I('l-msg').textContent = '교사 계정이 아니에요 — 교사 아이디로 로그인해 주세요.'; $I('ls').style.display = 'flex'; window.hideLoading && hideLoading(); return; }
    A.CU = Object.assign({ uid: user.uid }, st.data());
    window.ORGS = { daniel: '다니엘 아마츠', jihyebit: '지혜빛 선교원' };
    if(window.renderShell) renderShell('nhp', A.CU);
    if(window.guardPage && !guardPage(A.CU, 'nhp')) return;
    window.fileNameContext = () => ['나학평', A.TERM ? C.termLabel(A.TERM) : ''];
    const orgs = (A.CU.orgs && A.CU.orgs.length) ? A.CU.orgs : [A.CU.org];
    const reader = A.CU.role === 'super' || orgs.includes('daniel');
    $I('ls').style.display = 'none'; $I('ms').style.display = 'block';
    if(!reader || (A.CU.acStatus || 'active') === 'quit'){
      $I('nh').innerHTML = `<div class="nh-empty" style="margin-top:30px">📒 나학평은 <b>다니엘 아마츠</b> 선생님들이 쓰는 화면이에요.<br>접근 기관에 다니엘 아마츠가 없으면 볼 수 없어요. (관리자 › 인사정보에서 접근 기관을 확인해 주세요)</div>`;
      window.hideLoading && hideLoading(); return;
    }
    try{
      let mgr = [];
      try{ const m = await getDoc(doc(db, 'config', 'nhpManagers')); mgr = m.exists() ? (m.data().uids || []) : []; }catch(e){}
      A.isMgr = A.CU.role === 'super' || (A.CU.role === 'org_admin' && orgs.includes('daniel')) || mgr.includes(A.CU.uid);
      await Promise.all([loadStaff(), loadStudents()]);
      try{ await A.loadTerms(); }
      catch(e){ if(/permission/.test(e.code || '')) A.ruleMissing = true; else throw e; }
      try{ const c = await getDoc(doc(db, 'nhpConfig', 'main')); A.CFG = c.exists() ? c.data() : {}; }catch(e){ A.CFG = {}; }
      const saved = lsGet('nhp_term', '');
      const pick = A.TERMS.find(t => t.id === saved) || A.TERMS.find(t => t.src !== 'import' && t.status !== 'closed') || A.TERMS[0];
      if(pick) await A.useTerm(pick.id);
      if(!A.ruleMissing) watchNotifs();
    }catch(e){ A.toast('불러오지 못했어요 — ' + A.errText(e), 'err'); console.error(e); }
    await route();
    window.hideLoading && hideLoading();
  });
}
$I('l-go').onclick = async () => {
  const id = $I('l-id').value.trim(), pw = $I('l-pw').value, msg = $I('l-msg'); msg.textContent = '';
  try{ await signInWithEmailAndPassword(auth, `${id}@gyosa-seongyosa.staff`, pw); }
  catch(e){ msg.textContent = '로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
$I('l-pw').addEventListener('keydown', e => { if(e.key === 'Enter') $I('l-go').click(); });
boot();
