<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  collection, query, where, getDocs, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import * as Conn from './parent-conn.js?v=124';   // 👨‍👩‍👧 연결 현황판 · 🎫 코드(30일) · QR 코드표 (v122 · v123 · v124)
import * as Board from './parent-board.js?v=124';  // 💬 게시판 관리 — 반편성 한 칸마다 (v124 · 우리 반 학부모 화면과 같은 것)
import { gateCall } from './gate-client.js?v=122';

const __cfg = ({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const app = getApps().length ? getApp() : initializeApp(__cfg);
const auth = getAuth(app);
const db = (()=>{ try{ return initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); }catch(e){ return getFirestore(app); } })();
const $I = id => document.getElementById(id);
const esc = t => String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n||0).toLocaleString('ko-KR');
const fmt = ts => { if(!ts?.seconds) return '-'; const d=new Date(ts.seconds*1000); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

const ORG_L = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const PARENT_URL = 'https://artist4rhythm-hub.github.io/daniel-parents';
let CU=null, ORG='daniel', TAB='conn';
let STUDENTS=[], LINKS=[], POSTS=[];

window.pick = t => { TAB=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); render(); };
window.setOrg = o => { ORG=o; renderOrgPick(); render(); };
function renderOrgPick(){
  const __orgs = (window.orgCore ? orgCore.lockTo(CU, ['jihyebit','daniel']) : [ (CU&&(CU.primaryOrg||CU.org)) || 'daniel' ]);
  if(__orgs.length && !__orgs.includes(ORG)) ORG = __orgs[0];      // 잠긴 상태면 내 기관으로
  $I('orgpick').innerHTML = __orgs.map(o=>{
    const can = CU.role==='super' || (CU.org===o);
    return `<button class="orgbtn o-${o} ${o===ORG?'on':''}" ${can?`onclick="setOrg('${o}')"`:'disabled title="다른 기관은 수퍼관리자만"'}>${ORG_L[o]}</button>`;
  }).join('');
}

/* ═══ 데이터 로드 ═══ */
async function loadStudents(){
  const snap = await getDocs(query(collection(db,'students'), where('org','==',ORG)));
  STUDENTS = [];
  snap.forEach(d=>{ const v=d.data(); if(v.status==='quit'||v.deleted) return; STUDENTS.push({id:d.id, ...v}); });
  STUDENTS.sort((a,b)=>(String(a.grade)||'').localeCompare(String(b.grade)||'','ko') || (a.name||'').localeCompare(b.name||'','ko'));
}
async function loadLinks(){
  const snap = await getDocs(query(collection(db,'parentLinks'), where('org','==',ORG)));
  LINKS = []; snap.forEach(d=>LINKS.push({id:d.id, ...d.data()}));
}
async function loadPosts(scope, classKey){
  const conds=[where('org','==',ORG)];
  if(scope) conds.push(where('scope','==',scope));
  const snap = await getDocs(query(collection(db,'parentPosts'), ...conds));
  POSTS=[]; snap.forEach(d=>POSTS.push({id:d.id, ...d.data()}));
  if(classKey) POSTS = POSTS.filter(p=>p.classKey===classKey);
  POSTS.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
}

/* ═══ 🎫 가입 코드 (반 단위 일괄 발급 + 인쇄) ═══ */
function genJoinCode(org){
  const prefix = org==='daniel'?'DA': org==='jihyebit'?'JH':'ST';
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const pick = n => Array.from({length:n},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  return `${prefix}-${pick(2)}-${pick(4)}`;
}
async function genUnique(org){
  for(let i=0;i<8;i++){ const c=genJoinCode(org);
    try{ const ex=await getDoc(doc(db,'joinCodes',c)); if(!ex.exists()) return c; }catch(e){ return c; } }
  return genJoinCode(org)+Math.floor(Math.random()*9);
}

const enrolledSt = s => { const st = window.StuStatus ? StuStatus.status(s) : (s.status||'active'); return st==='active' || st==='leave'; };
const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''),'ko');
function pickedLabel(){ const sel=$I('cls'); return sel && sel.selectedOptions[0] ? sel.selectedOptions[0].textContent.split(' · ')[0] : ''; }
function classStudents(){
  const v = $I('cls')?.value||''; const S = Conn.S;
  if(v==='__out'){ const inR = new Set(S.classes.flatMap(c=>c.students||[])); return [...S.students.values()].filter(s=>!inR.has(s.id) && enrolledSt(s)).sort(byName); }
  const c = S.classes.find(x=>x.id===v);
  return ((c && c.students)||[]).map(id=>S.students.get(id)).filter(s=>s && enrolledSt(s)).sort(byName);
}
window.renderCodeTable = function(){
  const q = ($I('code-q')?.value||'').trim(); const S = Conn.S;
  const list = q ? [...S.students.values()].filter(s=>(s.name||'').includes(q) && enrolledSt(s)).sort(byName) : classStudents();
  const now = Date.now();
  $I('code-table').innerHTML = list.length ? `<table>
    <tr><th>이름</th><th>반 (반편성)</th><th>가입 코드</th><th>쓸 수 있는 기간</th><th>학부모 연결</th><th></th></tr>
    ${list.map(s=>{
      const n = S.links.filter(l=>l.studentId===s.id && l.status==='active').length;
      const c = Conn.classOf(s.id); const jc = s.joinCode ? S.codes.get(s.joinCode) : null;
      const exp = jc && jc.expiresAt ? (jc.expiresAt.seconds||0)*1000 : 0;
      const expTxt = !s.joinCode ? '—' : !exp ? '<span class="pill off">기한 없음 (옛 코드)</span>' : exp < now ? '<span class="pill" style="background:#FDECEA;color:#C0392B">만료</span>' : `${new Date(exp).getMonth()+1}/${new Date(exp).getDate()}까지`;
      return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(c? [ (c.grades&&c.grades[s.id])||c.grade||'', c.name].filter(Boolean).join(' ') : '반편성에 없음')}</td>
      <td class="codecell">${esc(s.joinCode||'—')}</td><td style="font-size:11.5px">${expTxt}</td>
      <td>${n ? `<span class="pill on">${n}명 연결됨</span>` : '<span class="pill off">아직</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn sub" style="padding:5px 10px;font-size:11.5px" onclick="reissueOne('${s.id}')">↻ ${s.joinCode?'재발급':'발급'}</button>
        ${s.joinCode?`<button class="btn sub" style="padding:5px 10px;font-size:11.5px" onclick="pcPrint(['${s.id}'])">🖨</button>`:''}
      </td></tr>`;}).join('')}
  </table>` : `<div class="empty">${q?'검색 결과가 없습니다.':'이 반에 학생이 없습니다.'}</div>`;
};
// 한 명만 새 코드로 — 그 학생의 기존 코드만 무효화, 다른 학생·기존 연결은 그대로
window.reissueOne = async function(sid){
  const s = Conn.S.students.get(sid); if(!s) return;
  if(s.joinCode && !confirm(`${s.name} 학생에게 새 가입코드를 발급할까요?\n기존 코드(${s.joinCode})는 쓸 수 없게 됩니다.\n이미 연결된 학부모는 그대로 유지돼요.`)) return;
  const msg=$I('code-msg'); msg.className='msg';
  try{
    window.showLoading && window.showLoading('새 코드를 만드는 중…');
    const code = await Conn.issueCode(s);
    msg.className='msg ok'; msg.textContent=`✅ ${s.name} — 새 코드 ${code} 발급 완료 (30일 동안)`;
  }catch(e){ msg.className='msg err'; msg.textContent='발급 실패: '+(e.message||''); }
  finally{ window.hideLoading && window.hideLoading(); renderCodeTable(); }
};
window.issueClass = async function(force){
  const list=classStudents();
  const now=Date.now();
  const usable = s => { const jc = s.joinCode ? Conn.S.codes.get(s.joinCode) : null; return !!s.joinCode && !(jc && jc.expiresAt && (jc.expiresAt.seconds||0)*1000 < now); };
  const targets = force ? list : list.filter(s=>!usable(s));
  const msg=$I('code-msg'); msg.className='msg';
  if(!targets.length){ msg.className='msg ok'; msg.textContent='발급할 학생이 없어요 — 모두 쓸 수 있는 코드가 있습니다. (재발급하려면 «전원 새 코드로»)'; return; }
  if(force && !confirm(`${targets.length}명 전원에게 새 코드를 발급할까요?\n기존 코드는 쓸 수 없게 됩니다 — 이미 연결된 학부모는 그대로 유지돼요.`)) return;
  window.showLoading && window.showLoading('가입 코드를 만드는 중…');
  let ok=0;
  for(const s of targets){
    try{ await Conn.issueCode(s); ok++; window.setLoadDetail && window.setLoadDetail(`${ok} / ${targets.length}명`); }catch(e){}
  }
  window.hideLoading && window.hideLoading();
  msg.className='msg ok'; msg.textContent=`✅ ${ok}명에게 발급했습니다 (30일 동안) — «코드표 인쇄»로 나눠주세요.`;
  renderCodeTable();
};

  try{ const d = await getDoc(doc(db,'parentPosts',id)); const v = d.exists() ? d.data() : null;
    box.innerHTML = v ? `<div style="white-space:pre-wrap;font-size:12.5px;color:var(--ts);line-height:1.6">${esc(v.body||'')}</div><div style="font-size:11px;color:var(--tl);margin-top:4px">💬 댓글 ${v.commentCount||0}</div>` : '이미 지워진 글이에요.'; }
  catch(e){ box.textContent = '불러오지 못했어요: ' + (e.message||''); }
  box.style.display = '';
};
window.delPend = async id => {

    const cs = await getDocs(query(collection(db,'parentComments'), where('postId','==',id)));
    for(const c of cs.docs){ try{ await deleteDoc(c.ref); }catch(e){} }
    await deleteDoc(doc(db,'parentPosts',id));
    const r = $I('pend-' + id); if(r) r.remove();
    const m = $I('pend-msg'); m.className = 'msg ok'; m.textContent = '✅ 지웠어요 — 다음 점검 때 목록에서도 빠져요.';
  }catch(e){ alert('지우지 못했어요: ' + (e.message||'')); }
};
window.assignPend = async id => {
  const sel = $I('pend-s-' + id), m = $I('pend-msg'); if(!sel) return;
  const j = await gateCall('assignPost', { postId: id, classId: sel.value });
  m.className = 'msg ' + (j.ok ? 'ok' : 'err');
  const ERR = { 'no-gate':'출입 서버 주소가 없어요', already:'이미 반으로 옮겨진 글이에요 (새로고침해 주세요)', 'not-a-candidate':'후보가 아닌 반이에요', 'no-class':'반을 찾지 못했어요', 'no-post':'이미 지워진 글이에요', network:'출입 서버에 닿지 않아요' };
  if(j.ok){ const r = $I('pend-' + id); if(r) r.remove();
    m.textContent = (j.classKeys && j.classKeys.length > 1) ? `✅ 이름이 같은 반 ${j.classKeys.length}곳에 하나씩 올렸어요 — 반마다 그 반 학부모에게만 보여요.`
      : `✅ 옮겼어요 — 그 반 학부모에게만 보여요${j.comments ? ` (댓글 ${j.comments}개도 함께)` : ''}.`; }
  else m.textContent = '옮기지 못했어요: ' + (ERR[j.error] || j.error || '');
};

  const pane=$I('pane');
  let words=[];
  try{ const s=await getDoc(doc(db,'parentConfig','badwords')); if(s.exists()&&Array.isArray(s.data().words)) words=s.data().words; }catch(e){}
  pane.innerHTML=`<div class="card">
    <div class="ct">🚫 금칙어 관리 <span style="font-size:11px;font-weight:600;color:var(--tl)">(두 기관 공통)</span></div>
    <div class="cd">기본 욕설·비방어는 이미 걸러지고, 여기에 학교가 추가로 막을 단어를 넣습니다.
      한 줄에 하나씩 · 띄어쓰기·기호를 끼운 변형("바!보")도 자동으로 잡습니다.</div>
    <textarea id="bw" style="min-height:140px" placeholder="예)&#10;바보&#10;멍청이">${esc(words.join('\n'))}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="saveBad()">저장</button>
      <span style="font-size:11.5px;color:var(--tl)">현재 추가 단어 ${words.length}개</span></div>
    <div class="msg" id="bw-msg"></div>
  </div>`;
}
window.saveBad = async function(){
  const msg=$I('bw-msg'); msg.className='msg';
  const words=[...new Set($I('bw').value.split('\n').map(w=>w.trim()).filter(w=>w && w.length<=20))];
  try{
    await setDoc(doc(db,'parentConfig','badwords'),{ words, updatedAt:Timestamp.now(), updatedBy:CU.name||'' });
    msg.className='msg ok'; msg.textContent=`✅ ${words.length}개 단어를 저장했습니다 — 게시판에 바로 적용돼요.`;
  }catch(e){ msg.className='msg err'; msg.textContent='실패: '+(e.message||''); }
};

/* ═══ 👨‍👩‍👧 연결 현황 — 반별 서랍 현황판 (parent-conn.js) ═══ */
async function renderConn(){
  const pane=$I('pane');
  pane.innerHTML='<div class="card"><div class="empty">불러오는 중…</div></div>';
  try{ await Conn.load(); Conn.renderBoard(pane); Conn.autoSweep().catch(()=>{}); }
  catch(e){ pane.innerHTML=`<div class="card"><div class="empty">불러오지 못했습니다: ${esc(e.message||'')}</div></div>`; }
}

/* ═══ 라우팅 ═══ */
async function render(){
  if(TAB==='codes'){ await renderCodes(); }
  else if(TAB==='links') await renderLinks();
  else if(TAB==='board') await renderBoard();
  else if(TAB==='bad') await renderBad();
  else if(TAB==='conn') await renderConn();
}

function korEmail(id){ return `${id}@gyosa-seongyosa.staff`; }
window.gateLogin = async function(){
  const id = $I('ga-id').value.trim(), pw = $I('ga-pw').value;
  const m = $I('ga-msg'); m.className='msg';
  if(!id || !pw){ m.className='msg err'; m.textContent='아이디와 비밀번호를 입력해 주세요.'; return; }
  $I('ga-btn').disabled = true;
  try { await signInWithEmailAndPassword(auth, korEmail(id), pw); }
  catch(e){ m.className='msg err'; m.textContent='로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
  finally { $I('ga-btn').disabled = false; }
};
$I('ga-pw')?.addEventListener?.('keydown', e=>{ if(e.key==='Enter') gateLogin(); });

onAuthStateChanged(auth, async user => {
  if(!user){
    $I('gate-msg').textContent='로그인해 주세요 — 교사 선교사 계정 그대로 쓰시면 돼요.';
    $I('gate-login').style.display='';
    return;
  }
  $I('gate-login').style.display='none';
  try{
    const s = await getDoc(doc(db,'staff',user.uid));
    if(!s.exists()){ $I('gate-msg').textContent='교직원 계정이 아닙니다.'; return; }
    CU = { uid:user.uid, ...s.data() };
    if(CU.role!=='super' && CU.role!=='org_admin'){
      $I('gate-msg').textContent='수퍼관리자·기관관리자만 쓸 수 있는 화면입니다.'; return;
    }
    ORG = (CU.org==='jihyebit') ? 'jihyebit' : 'daniel';
    $I('who').textContent = `${CU.name||''} · ${CU.role==='super'?'수퍼관리자':'기관관리자'}`;
    Conn.init({ db, CU, getOrg: () => ORG, ORG_L, $I, onChange: () => { if(TAB==='codes' && $I('code-table')) renderCodeTable(); } });
    $I('gate').style.display='none';
    window.ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
    if(window.renderShell) renderShell('parentadm', CU);   // 공통 좌측 메뉴 + 상단바
    $I('ms').style.display='';
    renderOrgPick();
    await render();
    window.hideLoading && window.hideLoading();
  }catch(e){ $I('gate-msg').textContent='불러오지 못했습니다: '+(e.message||''); }
});
