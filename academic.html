<head>

<!-- 다크 모드: 화면 그리기 전에 먼저 적용 (흰 화면 깜빡임 방지) -->
<script>
  (function(){
    var pref='auto';
    try{ pref=localStorage.getItem('gyosa_theme')||'auto'; }catch(e){}
    var dark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg,#f4f2ec);color:var(--ink,#1a2420)}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#f4f2ec);z-index:100}
  #gate .box{text-align:center}
  #gate-msg{font-size:14px;color:var(--ts,#5a6560);margin-bottom:14px}
  #gate-btn{display:none;font-family:inherit;font-size:13px;font-weight:700;padding:9px 18px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:9px;background:var(--wh,#fff);color:var(--gm,#00704A);cursor:pointer}

  .ac-wrap{ max-width:1400px; margin:0 auto; padding:20px; }
  .ac-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  .ac-title{ font-size:22px; font-weight:800; color:var(--gd); margin:0; display:flex; align-items:center; gap:10px; }
  .ac-toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* 연/월 이동 */
  .ac-nav{ display:flex; align-items:center; gap:4px; background:var(--wh); border:1px solid var(--ivd); border-radius:12px; padding:4px; }
  .ac-nav button{ width:36px; height:36px; border:none; background:none; border-radius:8px; font-size:18px; cursor:pointer; color:var(--gd); display:flex; align-items:center; justify-content:center; transition:background .12s; }
  .ac-nav button:hover{ background:var(--gp); }
  .ac-ym{ min-width:120px; text-align:center; font-size:16px; font-weight:800; color:var(--gd); }
  .ac-ym small{ display:block; font-size:11px; font-weight:600; color:var(--tl); }

  /* 뷰 토글 */
  .ac-viewtoggle{ display:flex; background:var(--wh); border:1px solid var(--ivd); border-radius:10px; overflow:hidden; }
  .ac-viewtoggle button{ padding:8px 16px; border:none; background:none; font-size:13px; font-weight:700; color:var(--ts); cursor:pointer; font-family:inherit; transition:all .12s; }
  .ac-viewtoggle button.on{ background:var(--gm); color:#fff; }

  /* ── 월 달력 ── */
  .cal{ background:var(--wh); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--ivd); }
  .cal-grid{ display:grid; grid-template-columns:64px repeat(7, 1fr); }

  /* 요일 헤더 */
  .cal-dowhead{ display:contents; }
  .cal-dow{ padding:12px 8px; text-align:center; font-size:14px; font-weight:800; background:var(--gd); color:#fff; border-bottom:2px solid var(--gm); }
  .cal-dow.wk{ font-size:12px; background:var(--gd); }
  .cal-dow.sun{ color:#FFB4A8; }
  .cal-dow.sat{ color:#A8C8FF; }

  /* 주차 라벨 (좌측) */
  .cal-wk{ padding:8px 4px; text-align:center; font-size:10px; font-weight:700; color:var(--ts); background:var(--gp); border-right:1px solid var(--ivd); border-bottom:1px solid var(--ivd); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; line-height:1.2; }
  .cal-wk .wknum{ font-size:15px; font-weight:800; color:var(--gd); }
  .cal-wk.break{ background:var(--m-bg); color:var(--m-tx); }
  .cal-wk.break .wknum{ color:var(--m-tx); font-size:10px; }

  /* 날짜 셀 */
  .cal-cell{ border-right:1px solid var(--ivd); border-bottom:1px solid var(--ivd); min-height:120px; display:flex; flex-direction:column; position:relative; background:var(--wh); }
  .cal-cell.empty{ background:var(--iv); }
  .cal-cell.sunday{ background:var(--f-bg); }
  .cal-cell.saturday{ background:var(--m-bg); }
  .cal-cell.holiday{ background:var(--danger-bg); }

  /* 날짜 숫자 */
  .cal-daynum{ padding:5px 8px; font-size:15px; font-weight:800; color:var(--gd); display:flex; align-items:baseline; gap:6px; }
  .cal-cell.sunday .cal-daynum, .cal-cell.holiday .cal-daynum{ color:var(--danger); }
  .cal-cell.saturday .cal-daynum{ color:var(--m-tx); }
  .cal-holname{ font-size:10px; font-weight:700; color:var(--danger); line-height:1.2; }

  /* 오전/오후 영역 — 항상 같은 높이 (공휴일·빈 날도 정렬 유지) */
  .cal-slots{ flex:1; display:flex; flex-direction:column; }
  .cal-slot{ flex:1 1 0; border-top:1px dashed var(--ivd); padding:2px 4px 2px 4px; min-height:38px; position:relative; }
  .cal-slot-lab{ font-size:8px; font-weight:700; color:var(--tl); position:absolute; left:3px; top:2px; opacity:.5; pointer-events:none; }

  /* 행사 칩 */
  .ev-chip{ font-size:10.5px; font-weight:700; line-height:1.25; padding:3px 6px; border-radius:5px; margin:2px 0 2px 14px; color:#fff; word-break:keep-all; cursor:pointer; transition:filter .1s; }
  .ev-chip:hover{ filter:brightness(1.06); }
  .ev-chip .ev-sub{ display:block; font-size:8.5px; font-weight:600; opacity:.9; }
  .ev-chip .ev-tgt{ display:block; font-size:8.5px; font-weight:600; opacity:.85; }
  .ev-chip.compact{ margin-left:14px; padding:2px 6px; }

  /* 종일 행사 배너 (셀 상단 가로 표시) */
  .ev-allday{ font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin:2px 4px; color:#fff; text-align:center; word-break:keep-all; cursor:pointer; }

  /* 범례 */
  .ac-legend{ display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; padding:12px 16px; background:var(--wh); border-radius:12px; border:1px solid var(--ivd); font-size:12px; }
  .ac-legend span{ display:inline-flex; align-items:center; gap:6px; color:var(--ts); font-weight:600; }
  .ac-legend i{ width:14px; height:14px; border-radius:4px; display:inline-block; }

  .ac-empty{ padding:60px 20px; text-align:center; color:var(--tl); font-size:14px; }

  @media(max-width:768px){
    .cal-grid{ grid-template-columns:44px repeat(7,1fr); }
    .cal-cell{ min-height:80px; }
    .ev-chip{ font-size:9px; margin-left:2px; }
    .cal-slot-lab{ display:none; }
    .ev-chip, .ev-allday{ margin-left:2px; }
  }


  /* ── 시스템 통합에서 더해진 부분 ── */
  .panel{background:var(--wh,#fff);border:1px solid var(--ivd,#E3E1DA);border-radius:14px;
    padding:16px 18px;margin-bottom:14px}
  .ptitle{font-size:14px;font-weight:800;color:var(--gd,#1E3932);display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .pdesc{font-size:12px;color:var(--ts,#5A6560);line-height:1.7;margin-bottom:12px}
  .btn{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:9px;background:var(--wh,#fff);
    color:var(--ts,#5A6560);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--gm,#00704A);color:var(--gm,#00704A)}
  .btn-p{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}
  .btn-p:hover{filter:brightness(1.07);color:#fff}
  .btn-dg{color:var(--danger,#C0392B)}
  .btn-sm{font-size:11.5px;padding:6px 11px}

  /* 보기 전용 안내 */
  .ro-bar{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;margin-bottom:12px;
    background:var(--goldp,#F7EFD8);border:1px solid var(--goldd,#8A6410);border-radius:12px}
  .ro-bar b{font-size:13.5px;color:var(--goldd,#8A6410)}
  .ro-d{font-size:12.5px;color:var(--ts,#5A6560);line-height:1.7;margin-top:3px}

  /* 연도 고르기 */
  .yr-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .yr-sel{font-family:inherit;font-size:13px;font-weight:700;padding:8px 12px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:9px;background:var(--wh,#fff);color:var(--ink,#1F2320)}

  /* 학기·방학 목록 */
  .tb-list{display:flex;flex-direction:column;gap:7px}
  .tb-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:10px;background:var(--wh,#fff)}
  .tb-nm{font-size:12.5px;font-weight:800;color:var(--gd,#1E3932);min-width:96px}
  .tb-dt{font-size:11.5px;color:var(--ts,#5A6560)}
  .tb-act{margin-left:auto;display:flex;gap:5px}
  .tb-none{font-size:12px;color:var(--tl,#93A09A);padding:10px 2px}

  /* 대화상자 */
  .mov{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:18px}
  .mbk{position:absolute;inset:0;background:rgba(15,25,21,.5)}
  .mbox{position:relative;z-index:1;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:var(--wh,#fff);border-radius:16px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mtitle{font-size:16px;font-weight:800;color:var(--gd,#1E3932);margin-bottom:4px}
  .msub{font-size:12px;color:var(--tl,#93A09A);line-height:1.6;margin-bottom:14px}
  .mact{display:flex;gap:7px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .fld-label{display:block;font-size:12px;font-weight:800;color:var(--ts,#5A6560);margin:12px 0 5px}
  .fld-input{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
    border:1.5px solid var(--ivd,#E3E1DA);border-radius:9px;background:var(--wh,#fff);color:var(--ink,#1F2320)}
  .fld-input:focus{outline:none;border-color:var(--gm,#00704A)}
  .fld-row{display:flex;gap:8px;flex-wrap:wrap}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 11px;
    border:1.5px solid var(--ivd,#E3E1DA);border-radius:8px;background:var(--wh,#fff);
    color:var(--ts,#5A6560);cursor:pointer}
  .chip.on{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}
  .cat-chip.on{color:#fff;border-color:transparent}
  .col-dots{display:flex;gap:6px;flex-wrap:wrap}
  .col-dot{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .col-dot.on{border-color:var(--gd,#1E3932)}

  /* 담당자에게만: 빈 칸을 누르면 추가된다는 힌트 */
  .can-edit .cal-slot{cursor:pointer}
  .can-edit .cal-slot:hover{background:var(--gp,#E8F3EF)}
  .ev-chip, .ev-allday{cursor:default}
  .can-edit .ev-chip, .can-edit .ev-allday{cursor:pointer}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:900;
    background:var(--gd,#1E3932);color:#fff;font-size:13px;font-weight:700;padding:11px 18px;
    border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
  .toast.err{background:var(--danger,#C0392B)}
</style>
</head>
<body>

<div id="gate"><div class="box"><div id="gate-msg">불러오는 중…</div><button id="gate-btn" onclick="location.reload()">다시 시도</button></div></div>

<div id="ms" style="display:none">
  <div class="ac-wrap">

    <div id="ro-mount"></div>

    <div class="ac-head">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

import { getFirestore, doc, getDoc, setDoc, deleteDoc, addDoc, updateDoc,
  collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $I = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT = null;
function toast(msg, kind){
  const el = $I('toast'); if(!el) return;
  el.textContent = msg;
  el.className = 'toast on' + (kind==='err' ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(()=> el.className = 'toast', 2600);
}

/* ═══════════════════════════════════════════════
   공휴일 (holidays-kr.js 내장 — 서버 없이 작동)
   ═══════════════════════════════════════════════ */
const FIXED_HOLIDAYS = [
  { m:1,d:1,name:'새해 첫날' },{ m:3,d:1,name:'삼일절' },{ m:5,d:5,name:'어린이날' },
  { m:6,d:6,name:'현충일' },{ m:8,d:15,name:'광복절' },{ m:10,d:3,name:'개천절' },
  { m:10,d:9,name:'한글날' },{ m:12,d:25,name:'성탄절' },
];
const LUNAR_HOLIDAYS = {
  2026:[{date:'2026-02-16',name:'설날 연휴'},{date:'2026-02-17',name:'설날'},{date:'2026-02-18',name:'설날 연휴'},
        {date:'2026-05-24',name:'부처님오신날'},{date:'2026-09-24',name:'추석 연휴'},{date:'2026-09-25',name:'추석'},{date:'2026-09-26',name:'추석 연휴'}],
  2027:[{date:'2027-02-06',name:'설날 연휴'},{date:'2027-02-07',name:'설날'},{date:'2027-02-08',name:'설날 연휴'},
        {date:'2027-05-13',name:'부처님오신날'},{date:'2027-09-14',name:'추석 연휴'},{date:'2027-09-15',name:'추석'},{date:'2027-09-16',name:'추석 연휴'}],
  2028:[{date:'2028-01-26',name:'설날 연휴'},{date:'2028-01-27',name:'설날'},{date:'2028-01-28',name:'설날 연휴'},
        {date:'2028-05-02',name:'부처님오신날'},{date:'2028-10-02',name:'추석 연휴'},{date:'2028-10-03',name:'추석'},{date:'2028-10-04',name:'추석 연휴'}],
};
const SUBSTITUTE_HOLIDAYS = {
  2026:[{date:'2026-03-02',name:'삼일절 대체휴일'},{date:'2026-05-25',name:'대체공휴일'},{date:'2026-08-17',name:'광복절 대체휴일'}],
};
function ymd(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function getHolidaysKR(year){
  const map={};
  FIXED_HOLIDAYS.forEach(h=>{ map[ymd(year,h.m,h.d)]=h.name; });
  (LUNAR_HOLIDAYS[year]||[]).forEach(h=>{ map[h.date]=h.name; });
  (SUBSTITUTE_HOLIDAYS[year]||[]).forEach(h=>{ map[h.date]=h.name; });
  return map;
}
function hasHolidayData(year){ return !!LUNAR_HOLIDAYS[year]; }

/* ═══════════════════════════════════════════════
   분류 · 시간대 · 대상
   ═══════════════════════════════════════════════ */
const CATEGORIES = {
  event:{label:'행사',color:'#8B5CF6'}, program:{label:'프로그램',color:'#3B82F6'},
  break:{label:'방학',color:'#F97316'}, exam:{label:'시험',color:'#16A34A'},
  worship:{label:'예배·기도회',color:'#0D9488'}, admin:{label:'행정',color:'#6B7280'},
};
const TIME_SLOTS = { am:'오전', pm:'오후', allday:'종일' };
const EV_COLORS = ['#8B5CF6','#3B82F6','#0D9488','#16A34A','#F97316','#E11D48','#6B7280','#B5A642'];

/* 학년 — 시간표 시스템과 같은 이름을 쓴다 */
const GRADE_ORDER = {
  daniel: ['1학년','2학년','3학년','4학년','5학년','6학년','7학년','8학년','9학년','10학년','11학년','12학년'],
  jihyebit: ['4세','5세','6세','7세'],
};
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };

/* 부서 — 시간표 틀에 정해둔 부서(초등부·중등부·고등부)를 그대로 가져온다 */
let DEPTS = [];
async function loadDepts(){
  const set = new Set();
  try {
    const s = await getDoc(doc(db,'timetables','main'));
    const list = (s.exists() && s.data().list) ? s.data().list : [];
    list.forEach(f => (f.snapshot?.departments||[]).forEach(d=>{ if(d.name) set.add(d.name); }));
  } catch(e){}
  DEPTS = [...set];
  if(!DEPTS.length) DEPTS = ['초등부','중등부','고등부'];   // 틀이 아직 없을 때
}

/* ═══════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════ */
let CU = null;                 // 지금 로그인한 사람
let CAN_EDIT = false;          // 학사일정을 고칠 수 있는가
let YEARS = [];                // 만들어 둔 학년도 목록
let YEAR_INFO = { year:0, label:'', terms:[], breaks:[] };
let EVENTS = [];
let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth()+1;
let curView = 'teacher';
let curOrg = 'daniel';

const isSuper = () => !!CU && CU.role === 'super';

async function loadEditors(){
  let uids = [];
  try {
    const s = await getDoc(doc(db,'academicConfig','editors'));
    uids = (s.exists() && Array.isArray(s.data().uids)) ? s.data().uids : [];
  } catch(e){}
  CAN_EDIT = isSuper() || CU?.role === 'org_admin' || uids.includes(CU?.uid);
}
function needEdit(){
  if(CAN_EDIT) return true;
  toast('학사일정을 고칠 권한이 없습니다. 관리자에게 문의해 주세요.','err');
  return false;
}

/* ═══════════════════════════════════════════════
   불러오기 · 저장
   ═══════════════════════════════════════════════ */
async function loadYears(){
  YEARS = [];
  try {
    const snap = await getDocs(collection(db,'academicYears'));
    YEARS = snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.year||0)-(a.year||0));
  } catch(e){}
}

async function loadYear(year){
  YEAR_INFO = { year, label:`${year}학년도`, terms:[], breaks:[] };
  const hit = YEARS.find(y=>String(y.year)===String(year));
  if(hit){
    YEAR_INFO = { year:hit.year, label:hit.label||`${year}학년도`,
      terms: hit.terms||[], breaks: hit.breaks||[] };
  }
}

async function saveYear(){
  if(!needEdit()) return;
  try {
    await setDoc(doc(db,'academicYears', String(YEAR_INFO.year)), {
      year: Number(YEAR_INFO.year),
      label: YEAR_INFO.label || `${YEAR_INFO.year}학년도`,
      terms: YEAR_INFO.terms, breaks: YEAR_INFO.breaks,
      weekStart: 'sun',
      updatedByUid: CU?.uid||'', updatedByName: CU?.name||'', updatedAt: Timestamp.now(),
    }, { merge:true });
    await loadYears();
  } catch(e){ toast('저장 실패: '+(e.message||''),'err'); }
}

async function loadEvents(year){
  EVENTS = [];
  try {
    const snap = await getDocs(query(collection(db,'academicEvents'), where('year','==',Number(year))));
    EVENTS = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  } catch(e){}
}

/* ═══════════════════════════════════════════════
   유틸
   ═══════════════════════════════════════════════ */
function pad(n){ return String(n).padStart(2,'0'); }
function dateStr(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dowOf(y,m,d){ return new Date(y,m-1,d).getDay(); }

function breakOf(ds){
  const b = (YEAR_INFO.breaks||[]).find(b=> ds>=b.start && ds<=b.end);
  return b ? b.name : null;
}
function termOf(ds){
  const t = (YEAR_INFO.terms||[]).find(t=> ds>=t.start && ds<=t.end);
  return t ? t.name : null;
}

/* 그 날짜에 보일 행사 (기간·요일·공개대상 걸러내기) */
function eventsOn(ds){
  const dow = new Date(ds+'T00:00:00').getDay();
  return EVENTS.filter(e=>{
    if(ds < e.startDate || ds > e.endDate) return false;
    if(Array.isArray(e.weekdays) && e.weekdays.length && !e.weekdays.includes(dow)) return false;
    if(curView==='parent' && !(e.audience==='parent'||e.audience==='both')) return false;
    return true;
  });
}

function targetLabel(e){
  if(!e.scope || e.scope==='all') return '';
  return '〈'+(e.targets||[]).join('·')+'〉';
}
function evColor(e){ return e.color || (CATEGORIES[e.category]||CATEGORIES.event).color; }

/* ═══════════════════════════════════════════════
   달력 그리기
   ═══════════════════════════════════════════════ */
function render(){
  const y=curYear, m=curMonth;
  $I('ym-main').textContent = `${y}년 ${m}월`;
  $I('ym-sub').textContent = curView==='teacher'?'교사용 · 상세':'학부모용 · 안내';
  document.body.classList.toggle('can-edit', CAN_EDIT);

  const holidays = getHolidaysKR(y);
  const nDays = daysInMonth(y,m);
  const firstDow = dowOf(y,m,1);

  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=nDays; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));

  function weekNumOf(d){
    if(!d) return '';
    const jan1 = new Date(y,0,1);
    const cur = new Date(y,m-1,d);
    const days = Math.floor((cur - jan1)/(24*3600*1000));
    return Math.floor((days + jan1.getDay())/7) + 1;
  }

  let html = '<div class="cal"><div class="cal-grid">';
  html += '<div class="cal-dow wk">주차</div>';
  ['일','월','화','수','목','금','토'].forEach((w,i)=>{
    const cls = i===0?'sun':i===6?'sat':'';
    html += `<div class="cal-dow ${cls}">${w}</div>`;
  });

  weeks.forEach(week=>{
    const firstValid = week.find(d=>d);
    const ds0 = firstValid ? dateStr(y,m,firstValid) : null;
    const brk = ds0 ? breakOf(ds0) : null;
    const wknum = firstValid ? weekNumOf(firstValid) : '';
    if(brk){
      html += `<div class="cal-wk break"><span class="wknum">${esc(brk)}</span></div>`;
    } else {
      html += `<div class="cal-wk"><span class="wknum">${wknum}</span><span>주</span></div>`;
    }

    week.forEach((d,di)=>{
      if(!d){ html += '<div class="cal-cell empty"><div class="cal-daynum">&nbsp;</div><div class="cal-slots"><div class="cal-slot"></div><div class="cal-slot"></div></div></div>'; return; }
      const ds = dateStr(y,m,d);
      const holName = holidays[ds];
      let cls='cal-cell';
      if(di===0) cls+=' sunday';
      else if(di===6) cls+=' saturday';
      if(holName) cls+=' holiday';

      const evs = eventsOn(ds);
      const allday = evs.filter(e=>e.timeOfDay==='allday');
      const am = evs.filter(e=>e.timeOfDay==='am');
      const pm = evs.filter(e=>e.timeOfDay==='pm');

      html += `<div class="${cls}">`;
      html += `<div class="cal-daynum">${d}${holName?`<span class="cal-holname">${esc(holName)}</span>`:''}</div>`;

      allday.forEach(e=>{
        html += `<div class="ev-allday" style="background:${evColor(e)}" title="${esc(e.title)}"
          onclick="openEventDlg('${e.id}')">${esc(e.title)}${targetLabel(e)?`<span class="ev-tgt">${esc(targetLabel(e))}</span>`:''}</div>`;
      });

      html += '<div class="cal-slots">';
      html += `<div class="cal-slot" onclick="addOn('${ds}','am',event)"><span class="cal-slot-lab">오전</span>`;
      am.forEach(e=> html += evChip(e));
      html += '</div>';
      html += `<div class="cal-slot" onclick="addOn('${ds}','pm',event)"><span class="cal-slot-lab">오후</span>`;
      pm.forEach(e=> html += evChip(e));
      html += '</div>';
      html += '</div></div>';
    });
  });

  html += '</div></div>';
  $I('cal-mount').innerHTML = html;
  renderLegend();
  renderTermPanel();
}

function evChip(e){
  const tgt = targetLabel(e);
  return `<div class="ev-chip" style="background:${evColor(e)}" title="${esc(e.title)}"
      onclick="openEventDlg('${e.id}')">${esc(e.title)}`
    + (e.subtitle?`<span class="ev-sub">${esc(e.subtitle)}</span>`:'')
    + (tgt?`<span class="ev-tgt">${esc(tgt)}</span>`:'')
    + '</div>';
}

function renderLegend(){
  const y=curYear,m=curMonth, nDays=daysInMonth(y,m);
  const used = new Set();
  for(let d=1;d<=nDays;d++){ eventsOn(dateStr(y,m,d)).forEach(e=>used.add(e.category)); }
  let html='';
  used.forEach(cat=>{
    const c=CATEGORIES[cat]; if(!c) return;
    html += `<span><i style="background:${c.color}"></i>${c.label}</span>`;
  });
  html += `<span><i style="background:#E5484D"></i>공휴일</span>`;
  if(!hasHolidayData(y)) html += `<span style="color:var(--goldd,#8A6410)">⚠ ${y}년 공휴일 자료 없음 — 직접 넣어주세요</span>`;
  $I('legend').innerHTML = html;
}

/* ═══════════════════════════════════════════════
   학년도 고르기 · 만들기
   ═══════════════════════════════════════════════ */
function renderYearBar(){
  const sel = $I('yr-sel');
  const opts = YEARS.map(y=>y.year);
  if(!opts.includes(curYear)) opts.unshift(curYear);
  sel.innerHTML = opts.map(y=>`<option value="${y}" ${y===curYear?'selected':''}>${y}학년도</option>`).join('');

  const exists = YEARS.some(y=>String(y.year)===String(curYear));
  $I('yr-note').textContent = exists
    ? `학기 ${(YEAR_INFO.terms||[]).length}개 · 방학 ${(YEAR_INFO.breaks||[]).length}개`
    : '아직 만들지 않은 학년도입니다';

  $I('yr-act').innerHTML = CAN_EDIT
    ? (exists ? '' : `<button class="btn btn-sm btn-p" onclick="createYear()">＋ ${curYear}학년도 만들기</button>`)
      + `<button class="btn btn-sm" onclick="newYearPrompt()">다른 학년도 추가</button>`
    : '';
}

window.onPickYear = async function(v){
  curYear = Number(v)||curYear;
  await loadYear(curYear);
  await loadEvents(curYear);
  renderYearBar(); render();
};

window.createYear = async function(){
  if(!needEdit()) return;
  YEAR_INFO = { year:curYear, label:`${curYear}학년도`, terms:[], breaks:[] };
  await saveYear();
  renderYearBar(); render();
  toast(`${curYear}학년도를 만들었습니다 ✓ — 학기와 방학을 넣어주세요`,'ok');
};

window.newYearPrompt = async function(){
  if(!needEdit()) return;
  const v = prompt('만들 학년도를 입력하세요 (예: 2027)', String(curYear+1));
  if(!v) return;
  const y = Number(v);
  if(!y || y < 2000 || y > 2100){ toast('연도를 다시 확인해 주세요.','err'); return; }
  curYear = y; curMonth = 1;
  await loadYear(y);
  if(!YEARS.some(x=>String(x.year)===String(y))) await createYear();
  else { await loadEvents(y); renderYearBar(); render(); }
};

/* ═══════════════════════════════════════════════
   학기 · 방학
   ═══════════════════════════════════════════════ */
function renderTermPanel(){
  const p = $I('term-panel');
  if(!CAN_EDIT){ p.style.display='none'; return; }
  p.style.display='';
  const rows = [];
  (YEAR_INFO.terms||[]).forEach((t,i)=>{
    rows.push(`<div class="tb-row">
      <span class="tb-nm">📗 ${esc(t.name)}</span>
      <span class="tb-dt">${esc(t.start)} ~ ${esc(t.end)}</span>
      <span class="tb-act">
        <button class="btn btn-sm" onclick="openTermDlg('term',${i})">✏️ 고치기</button>
        <button class="btn btn-sm btn-dg" onclick="delTerm('term',${i})">🗑</button>
      </span></div>`);
  });
  (YEAR_INFO.breaks||[]).forEach((b,i)=>{
    rows.push(`<div class="tb-row">
      <span class="tb-nm">🏖 ${esc(b.name)}</span>
      <span class="tb-dt">${esc(b.start)} ~ ${esc(b.end)}</span>
      <span class="tb-act">
        <button class="btn btn-sm" onclick="openTermDlg('break',${i})">✏️ 고치기</button>
        <button class="btn btn-sm btn-dg" onclick="delTerm('break',${i})">🗑</button>
      </span></div>`);
  });
  $I('term-list').innerHTML = rows.length ? rows.join('')
    : '<div class="tb-none">아직 학기·방학이 없습니다. 위 버튼으로 추가해 주세요.</div>';
}

window.openTermDlg = function(kind, idx){
  if(!needEdit()) return;
  const list = kind==='term' ? (YEAR_INFO.terms||[]) : (YEAR_INFO.breaks||[]);
  const cur = (idx!=null) ? list[idx] : null;
  const label = kind==='term' ? '학기' : '방학';
  const ov = document.createElement('div');
  ov.className='mov'; ov.id='term-mod';
  ov.innerHTML = `<div class="mbk" onclick="closeTermDlg()"></div>
    <div class="mbox" style="max-width:420px">
      <div class="mtitle">${cur?`${label} 고치기`:`${label} 추가`}</div>
      <div class="msub">${kind==='term'?'학기 기간을 정하면 달력에 주차가 표시됩니다.'
        :'방학 기간은 달력 왼쪽에 방학 이름으로 표시됩니다.'}</div>
      <label class="fld-label">이름</label>
      <input class="fld-input" id="tm-name" value="${esc(cur?cur.name:'')}"
        placeholder="${kind==='term'?'예: 1학기':'예: Summer-Break'}">
      <div class="fld-row">
        <div style="flex:1"><label class="fld-label">시작일</label>
          <input type="date" class="fld-input" id="tm-start" value="${esc(cur?cur.start:'')}"></div>
        <div style="flex:1"><label class="fld-label">종료일</label>
          <input type="date" class="fld-input" id="tm-end" value="${esc(cur?cur.end:'')}"></div>
      </div>
      <div class="mact">
        <button class="btn" onclick="closeTermDlg()">취소</button>
        <button class="btn btn-p" onclick="saveTerm('${kind}',${idx==null?'null':idx})">저장</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
};
window.closeTermDlg = function(){ $I('term-mod')?.remove(); };

window.saveTerm = async function(kind, idx){
  if(!needEdit()) return;
  const name = $I('tm-name').value.trim();
  const start = $I('tm-start').value;
  const end = $I('tm-end').value;
  if(!name){ toast('이름을 입력해 주세요.','err'); return; }
  if(!start || !end){ toast('시작일과 종료일을 정해 주세요.','err'); return; }
  if(start > end){ toast('시작일이 종료일보다 뒤입니다.','err'); return; }

  const key = kind==='term' ? 'terms' : 'breaks';
  if(!Array.isArray(YEAR_INFO[key])) YEAR_INFO[key] = [];
  const item = { id: (idx!=null && YEAR_INFO[key][idx]?.id) || (kind[0]+Math.random().toString(36).slice(2,7)),
    name, start, end };
  if(idx!=null) YEAR_INFO[key][idx] = item; else YEAR_INFO[key].push(item);
  YEAR_INFO[key].sort((a,b)=> a.start.localeCompare(b.start));

  await saveYear();
  closeTermDlg(); renderYearBar(); render();
  toast('저장했습니다 ✓','ok');
};

window.delTerm = async function(kind, idx){
  if(!needEdit()) return;
  const key = kind==='term' ? 'terms' : 'breaks';
  const it = YEAR_INFO[key][idx]; if(!it) return;
  if(!confirm(`"${it.name}"을(를) 지울까요?`)) return;
  YEAR_INFO[key].splice(idx,1);
  await saveYear();
  renderYearBar(); render();
  toast('지웠습니다','ok');
};

/* ═══════════════════════════════════════════════
   행사 추가 · 편집
   ═══════════════════════════════════════════════ */
let dlgTargets = new Set();
let dlgWeekdays = new Set();
let dlgColor = '';
let dlgScope = 'all';
let editingEventId = null;

/* 빈 칸을 누르면 그 날짜·시간대로 새 행사 */
window.addOn = function(ds, slot, ev){
  if(ev && ev.target.closest('.ev-chip')) return;   // 행사를 누른 것이면 편집으로
  if(!CAN_EDIT) return;
  openEventDlg(null, ds, slot);
};

window.openEventDlg = function(id, ds, slot){
  if(!CAN_EDIT){
    const e = EVENTS.find(x=>x.id===id);
    if(e) showEventInfo(e);
    return;
  }
  if(event) event.stopPropagation();
  const e = id ? EVENTS.find(x=>x.id===id) : null;
  editingEventId = e ? e.id : null;
  dlgTargets = new Set(e ? (e.targets||[]) : []);
  dlgWeekdays = new Set(e ? (e.weekdays||[]) : []);
  dlgScope = e ? (e.scope||'all') : 'all';
  dlgColor = e ? (e.color||'') : '';
  curOrg = e ? (e.org||'daniel') : curOrg;

  const ov = document.createElement('div');
  ov.className='mov'; ov.id='ev-mod';
  ov.innerHTML = `<div class="mbk" onclick="closeEventDlg()"></div>
    <div class="mbox">
      <div class="mtitle">${e?'행사 고치기':'행사 추가'}</div>
      <div class="msub">기간·시간대·대상을 정하면 달력에 그대로 표시됩니다.</div>

      <label class="fld-label">제목</label>
      <input class="fld-input" id="ev-title" value="${esc(e?e.title:'')}" placeholder="예: 신년 수양회">

      <label class="fld-label">부제 <span style="font-weight:400;color:var(--tl)">(선택)</span></label>
      <input class="fld-input" id="ev-sub" value="${esc(e?(e.subtitle||''):'')}" placeholder="예: *새문안교회수양관">

      <div class="fld-row">
        <div style="flex:1"><label class="fld-label">시작일</label>
          <input type="date" class="fld-input" id="ev-start" value="${esc(e?e.startDate:(ds||''))}"></div>
        <div style="flex:1"><label class="fld-label">종료일</label>
          <input type="date" class="fld-input" id="ev-end" value="${esc(e?e.endDate:(ds||''))}"></div>
      </div>

      <label class="fld-label">시간대</label>
      <div class="chips" id="ev-slot">
        ${Object.entries(TIME_SLOTS).map(([k,v])=>{
          const on = e ? e.timeOfDay===k : (slot||'am')===k;
          return `<button type="button" class="chip ${on?'on':''}" data-slot="${k}" onclick="pickSlot('${k}')">${v}</button>`;
        }).join('')}
      </div>

      <label class="fld-label">요일 <span style="font-weight:400;color:var(--tl)">(고르지 않으면 기간 내내)</span></label>
      <div class="chips" id="ev-dow">
        ${['일','월','화','수','목','금','토'].map((w,i)=>
          `<button type="button" class="chip ${dlgWeekdays.has(i)?'on':''}" onclick="toggleDow(${i})">${w}</button>`).join('')}
      </div>

      <label class="fld-label">대상</label>
      <div class="chips" style="margin-bottom:7px">
        <button type="button" class="chip ${dlgScope==='all'?'on':''}" onclick="setScope('all')">전체</button>
        <button type="button" class="chip ${dlgScope==='dept'?'on':''}" onclick="setScope('dept')">부서별</button>
        <button type="button" class="chip ${dlgScope==='grade'?'on':''}" onclick="setScope('grade')">학년별</button>
      </div>
      <div id="ev-targets"></div>

      <label class="fld-label">분류</label>
      <div class="chips" id="ev-cat">
        ${Object.entries(CATEGORIES).map(([k,v])=>{
          const on = e ? e.category===k : k==='event';
          return `<button type="button" class="chip cat-chip ${on?'on':''}" data-cat="${k}"
            style="${on?`background:${v.color}`:''}" onclick="pickCat('${k}')">${v.label}</button>`;
        }).join('')}
      </div>

      <label class="fld-label">색 <span style="font-weight:400;color:var(--tl)">(비우면 분류 색)</span></label>
      <div class="col-dots" id="ev-colors">
        ${EV_COLORS.map(c=>`<span class="col-dot ${dlgColor===c?'on':''}" style="background:${c}"
          onclick="pickColor('${c}')"></span>`).join('')}
        <button type="button" class="btn btn-sm" onclick="pickColor('')">기본</button>
      </div>

      <label class="fld-label">공개 대상</label>
      <div class="chips" id="ev-aud">
        ${[['both','교사·학부모'],['teacher','교사만'],['parent','학부모만']].map(([k,v])=>{
          const on = e ? (e.audience||'both')===k : k==='both';
          return `<button type="button" class="chip ${on?'on':''}" data-aud="${k}" onclick="pickAud('${k}')">${v}</button>`;
        }).join('')}

      <label class="fld-label">메모 <span style="font-weight:400;color:var(--tl)">(교사용)</span></label>

        <button class="btn btn-p" onclick="saveEvent()">저장</button>

    </div>`;
  document.body.appendChild(ov);
  renderTargetPicker();
};
window.closeEventDlg = function(){ $I('ev-mod')?.remove(); };

window.pickSlot = function(k){
  document.querySelectorAll('#ev-slot .chip').forEach(b=>b.classList.toggle('on', b.dataset.slot===k));
};
window.pickAud = function(k){
  document.querySelectorAll('#ev-aud .chip').forEach(b=>b.classList.toggle('on', b.dataset.aud===k));
};
window.pickCat = function(k){
  document.querySelectorAll('#ev-cat .chip').forEach(b=>{
    const on = b.dataset.cat===k;
    b.classList.toggle('on', on);
    b.style.background = on ? CATEGORIES[b.dataset.cat].color : '';
  });
};
window.pickColor = function(c){
  dlgColor = c;
  document.querySelectorAll('#ev-colors .col-dot').forEach(d=>
    d.classList.toggle('on', d.style.backgroundColor === hexToRgb(c)));
};
function hexToRgb(hex){
  if(!hex) return '';
  const n = parseInt(hex.slice(1),16);
  return `rgb(${(n>>16)&255}, ${(n>>8)&255}, ${n&255})`;
}
window.toggleDow = function(i){
  if(dlgWeekdays.has(i)) dlgWeekdays.delete(i); else dlgWeekdays.add(i);
  document.querySelectorAll('#ev-dow .chip')[i].classList.toggle('on', dlgWeekdays.has(i));
};
window.setScope = function(s){
  dlgScope = s;
  if(s==='all') dlgTargets.clear();
  document.querySelectorAll('.mbox .chips .chip').forEach(()=>{});
  const wrap = $I('ev-mod');
  wrap.querySelectorAll('.chips')[2].querySelectorAll('.chip').forEach(b=>
    b.classList.toggle('on', b.textContent.trim() === ({all:'전체',dept:'부서별',grade:'학년별'})[s]));
  renderTargetPicker();
};
window.toggleTarget = function(v){
  if(dlgTargets.has(v)) dlgTargets.delete(v); else dlgTargets.add(v);
  renderTargetPicker();
};
function renderTargetPicker(){
  const box = $I('ev-targets'); if(!box) return;
  if(dlgScope==='all'){ box.innerHTML=''; return; }
  const list = dlgScope==='dept' ? DEPTS : (GRADE_ORDER[curOrg]||[]);
  const orgBar = dlgScope==='grade'
    ? `<div class="chips" style="margin-bottom:6px">${Object.entries(ORGS).map(([k,v])=>
        `<button type="button" class="chip ${curOrg===k?'on':''}" onclick="pickOrg('${k}')">${v}</button>`).join('')}</div>`
    : '';
  box.innerHTML = orgBar + `<div class="chips">${list.map(v=>
    `<button type="button" class="chip ${dlgTargets.has(v)?'on':''}" onclick="toggleTarget('${esc(v)}')">${esc(v)}</button>`).join('')}</div>`;
}
window.pickOrg = function(k){ curOrg = k; renderTargetPicker(); };

window.saveEvent = async function(){
  if(!needEdit()) return;
  const title = $I('ev-title').value.trim();
  if(!title){ toast('제목을 입력해 주세요.','err'); return; }
  const start = $I('ev-start').value, end = $I('ev-end').value;
  if(!start || !end){ toast('기간을 정해 주세요.','err'); return; }
  if(start > end){ toast('시작일이 종료일보다 뒤입니다.','err'); return; }
  if(dlgScope!=='all' && !dlgTargets.size){ toast('대상을 하나 이상 골라 주세요.','err'); return; }

  const slot = document.querySelector('#ev-slot .chip.on')?.dataset.slot || 'am';
  const cat = document.querySelector('#ev-cat .chip.on')?.dataset.cat || 'event';
  const aud = document.querySelector('#ev-aud .chip.on')?.dataset.aud || 'both';

  const data = {
    year: Number(String(start).slice(0,4)),
    title, subtitle: $I('ev-sub').value.trim(),
    startDate: start, endDate: end,
    timeOfDay: slot,
    weekdays: [...dlgWeekdays].sort(),
    scope: dlgScope,
    targets: dlgScope==='all' ? [] : [...dlgTargets],
    org: dlgScope==='grade' ? curOrg : '',
    category: cat,
    color: dlgColor || '',
    audience: aud,
    memo: $I('ev-memo').value.trim(),
    updatedByUid: CU?.uid||'', updatedByName: CU?.name||'', updatedAt: Timestamp.now(),
  };

  try {
    if(editingEventId){
      await updateDoc(doc(db,'academicEvents', editingEventId), data);
    } else {
      data.createdByUid = CU?.uid||''; data.createdByName = CU?.name||'';
      data.createdAt = Timestamp.now();
      await addDoc(collection(db,'academicEvents'), data);
    }
    await loadEvents(curYear);
    closeEventDlg(); render();
    toast('저장했습니다 ✓','ok');
  } catch(e){ toast('저장 실패: '+(e.message||''),'err'); }
};

window.delEvent = async function(id){
  if(!needEdit()) return;
  const e = EVENTS.find(x=>x.id===id); if(!e) return;
  if(!confirm(`"${e.title}"을(를) 지울까요?\n되돌릴 수 없습니다.`)) return;
  try {
    await deleteDoc(doc(db,'academicEvents', id));
    await loadEvents(curYear);
    closeEventDlg(); render();
    toast('지웠습니다','ok');
  } catch(err){ toast('삭제 실패: '+(err.message||''),'err'); }
};

/* 권한이 없는 선생님이 행사를 눌렀을 때 — 내용만 보여준다 */
function showEventInfo(e){
  const ov = document.createElement('div');
  ov.className='mov'; ov.id='ev-info';
  ov.innerHTML = `<div class="mbk" onclick="document.getElementById('ev-info').remove()"></div>
    <div class="mbox" style="max-width:400px">
      <div class="mtitle">${esc(e.title)}</div>
      <div class="msub">${esc(e.subtitle||'')}</div>
      <div style="font-size:12.5px;line-height:2;color:var(--ts,#5A6560)">
        <div>📅 ${esc(e.startDate)} ~ ${esc(e.endDate)}</div>
        <div>🕐 ${esc(TIME_SLOTS[e.timeOfDay]||'')}</div>
        ${targetLabel(e)?`<div>🎯 ${esc(targetLabel(e))}</div>`:''}
        ${e.memo?`<div>📝 ${esc(e.memo)}</div>`:''}
      </div>
      <div class="mact"><button class="btn btn-p" onclick="document.getElementById('ev-info').remove()">확인</button></div>
    </div>`;
  document.body.appendChild(ov);
}

/* ═══════════════════════════════════════════════
   조작
   ═══════════════════════════════════════════════ */
window.moveMonth = function(delta){
  curMonth += delta;
  if(curMonth>12){ curMonth=1; curYear++; onPickYear(curYear); return; }
  if(curMonth<1){ curMonth=12; curYear--; onPickYear(curYear); return; }
  render();
};
window.goToday = function(){
  const now=new Date();
  const y = now.getFullYear();
  curMonth = now.getMonth()+1;
  if(y !== curYear){ curYear = y; onPickYear(y); return; }
  render();
};
window.setView = function(v){
  curView=v;
  $I('v-teacher').classList.toggle('on', v==='teacher');
  $I('v-parent').classList.toggle('on', v==='parent');
  render();
};

/* 화면에서 부르거나 확인할 수 있게 밖으로 내어둔다 */
window.render = render;
window.eventsOn = eventsOn;
window.renderYearBar = renderYearBar;
Object.defineProperty(window, 'DEPTS', { get:()=>DEPTS });
Object.defineProperty(window, 'EVENTS', { get:()=>EVENTS });
Object.defineProperty(window, 'YEAR_INFO', { get:()=>YEAR_INFO });
Object.defineProperty(window, 'curYear', { get:()=>curYear, set:v=>{curYear=v;} });
Object.defineProperty(window, 'curMonth', { get:()=>curMonth, set:v=>{curMonth=v;} });
Object.defineProperty(window, 'curView', { get:()=>curView });
Object.defineProperty(window, 'CAN_EDIT', { get:()=>CAN_EDIT });

/* ═══════════════════════════════════════════════
   시작
   ═══════════════════════════════════════════════ */
onAuthStateChanged(auth, async user => {
  if(!user){
    $I('gate-msg').textContent='로그인이 필요합니다.';
    $I('gate-btn').style.display='inline-block';
    return;
  }
  try {
    const s = await getDoc(doc(db,'staff', user.uid));
    if(!s.exists()){
      $I('gate-msg').textContent='교직원 계정이 아닙니다.';
      $I('gate-btn').style.display='inline-block';
      return;
    }
    CU = { uid:user.uid, ...s.data() };
    if(window.renderShell) renderShell('calendar', CU);
    if(window.setCrumb) setCrumb(['학사일정']);

    await loadEditors();
    await loadDepts();
    await loadYears();

    // 만들어 둔 학년도가 있으면 올해에 가장 가까운 것으로 시작
    if(YEARS.length && !YEARS.some(y=>String(y.year)===String(curYear))){
      curYear = YEARS[0].year;
    }
    await loadYear(curYear);
    await loadEvents(curYear);

    if(!CAN_EDIT){
      $I('ro-mount').innerHTML = `<div class="ro-bar"><span style="font-size:19px">👀</span>
        <div><b>보기만 할 수 있습니다</b>
        <div class="ro-d">학사일정은 수퍼관리자·기관관리자와 지정된 담당자가 관리합니다.
          행사를 누르면 자세한 내용을 볼 수 있어요.</div></div></div>`;
    }

    $I('gate').style.display='none';
    $I('ms').style.display='block';
    renderYearBar();
    render();
  } catch(e){
    $I('gate-msg').textContent='오류: '+(e.message||'');
    $I('gate-btn').style.display='inline-block';
  }
});
</script>
