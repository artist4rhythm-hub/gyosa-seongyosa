<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>완성 시간표 · 교사 선교사</title>
<link rel="icon" href="icon-192.png">
<style>
:root{
  --wh:#FFFFFF; --iv:#F2F0EB; --ivd:#E3E1DA; --gm:#00704A; --gd:#1E3932;
  --gp:#E8F3EF; --gl:#D4E9E2; --tl:#93A09A; --ts:#5A6560; --ink:#1F2320;
  --gold:#8A6410; --gold-bg:#F7EFD8; --danger:#C0392B;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--iv);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;padding:14px}
.top{max-width:1200px;margin:0 auto 12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.top img{width:42px;height:42px;border-radius:11px}
.top .t1{font-size:16px;font-weight:800;color:var(--gd)}
.top .t2{font-size:11.5px;color:var(--tl);margin-top:2px}
.top .act{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--ivd);background:var(--wh);color:var(--gm);font-family:inherit;
  font-weight:700;font-size:12.5px;padding:8px 15px;border-radius:9px;cursor:pointer}
.btn.p{background:var(--gm);border-color:var(--gm);color:#fff}
.paper{max-width:1200px;margin:0 auto;background:var(--wh);border-radius:14px;
  box-shadow:0 4px 20px rgba(30,57,50,.08);padding:16px}
.state{max-width:520px;margin:80px auto;background:var(--wh);border-radius:14px;
  padding:40px 30px;text-align:center;box-shadow:0 4px 20px rgba(30,57,50,.08)}
.state .ico{font-size:40px;margin-bottom:12px}
.state .t1{font-size:17px;font-weight:800;color:var(--gd);margin-bottom:8px}
.state .t2{font-size:13px;color:var(--tl);line-height:1.7}
.foot{max-width:1200px;margin:14px auto 30px;text-align:center;font-size:11.5px;color:var(--tl)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:900;
  background:var(--gd);color:#fff;font-size:13px;font-weight:700;padding:11px 18px;
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ══ 시간표 보기 (완성 시간표와 같은 모습) ══ */
  /* ── 보기 ── */
  .vw-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:11px 13px;
    background:var(--gp,#E8F3EF);border-radius:11px;margin-bottom:14px}
  /* 보기 탭 — 또렷한 상자로 */
  .vw-kb{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:9px;
    border:1px solid var(--ivd,#E3E1DA);background:var(--wh,#fff);color:var(--ts,#5A6560);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
  .vw-kb:hover{border-color:var(--gm,#00704A);color:var(--gm,#00704A)}
  .vw-kb.on{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:var(--wh,#fff)}
  .vw-sel{font-family:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--ivd,#E3E1DA);
    border-radius:8px;background:var(--wh,#fff);color:var(--ink);min-width:150px}
  .vw-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

  .tv-sheet{background:var(--wh,#fff);border:1px solid var(--ivd,#E3E1DA);border-radius:12px;padding:18px;overflow-x:auto}
  .tv-head{margin-bottom:14px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .tv-title{font-size:19px;font-weight:800;color:var(--gd,#1E3932);letter-spacing:-.02em;margin-bottom:2px}
  .tv-meta{font-size:12px;color:var(--tl,#93A09A)}
  .tv-zoom{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    font-size:11px;color:var(--tl,#93A09A)}
  .tv-zb{font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:7px;background:var(--wh,#fff);
    color:var(--ts,#5A6560);cursor:pointer}
  .tv-zb:hover{border-color:var(--gm,#00704A);color:var(--gm,#00704A)}
  .tv-zb.on{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}

  .tv-board{border:1px solid var(--ivd,#E3E1DA);border-radius:11px;overflow:hidden;min-width:660px}
  .tv-hd{display:grid;grid-template-columns:58px repeat(5,minmax(0,1fr));
    background:var(--gp,#E8F3EF);border-bottom:1px solid var(--ivd,#E3E1DA)}
  .tv-hd-d{padding:9px 0;text-align:center;font-size:calc(13.5px * var(--tvf,1));
    font-weight:800;color:var(--gd,#1E3932)}
  .tv-grid{display:grid;grid-template-columns:58px repeat(5,minmax(0,1fr));position:relative}
  .tv-times{position:relative;background:var(--iv,#F2F0EB);border-right:1px solid var(--ivd,#E3E1DA)}
  .tv-tick{position:absolute;left:0;right:0;font-size:calc(10px * var(--tvf,1));color:var(--tl,#93A09A);
    padding-left:6px;border-top:1px dashed var(--ivd,#E3E1DA);line-height:1.1}
  .tv-col{position:relative;border-right:1px solid var(--ivd,#E3E1DA);background:var(--wh,#fff)}
  .tv-col:last-child{border-right:none}
  .tv-bg{position:absolute;left:0;right:0;box-sizing:border-box;pointer-events:none;overflow:hidden;
    border-top:1px solid var(--ivd,#E3E1DA)}
  .tv-bg.cls{background:rgba(0,112,74,.045)}
  .tv-bg.rest{background:repeating-linear-gradient(45deg,rgba(147,160,154,.10) 0 6px,transparent 6px 12px)}
  .tv-bg span{font-size:calc(9px * var(--tvf,1));color:var(--tl,#93A09A);padding:1px 4px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 아주 얇은 띠는 글자를 줄여서라도 보여준다 (예전엔 아예 감췄다) */
  .tv-bg.tiny span{font-size:calc(7.5px * var(--tvf,1));padding:0 3px;line-height:1.1}
  /* 🎨 카드 — 왼쪽 시각 레일 · 가운데 과목명 · 오른쪽 위 교실 배지 */
  .tv-card{position:absolute;left:3px;right:3px;box-sizing:border-box;overflow:hidden;
    border-radius:9px;border:none;
    /* 🩹 불투명 카드 — 흰 바탕 위에 색을 얹는다. 뒤의 틀 배경(빗금·글자)이 비치지 않게 */
    background-color:var(--wh,#fff);
    background-image:linear-gradient(0deg,var(--lc-bg,#F2F7F5),var(--lc-bg,#F2F7F5));
    display:flex;flex-direction:row;box-shadow:none}
  .tv-rail{flex:none;width:calc(46px * var(--tvf,1));max-width:34%;
    background:var(--lc-rail, rgba(0,0,0,.055));
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:calc(4px * var(--tvf,1)) 0;gap:1px;min-width:0}
  .tv-rail b{font-size:calc(11.5px * var(--tvf,1));font-weight:800;
    color:var(--lc-ink,#14231D);line-height:1.15;white-space:nowrap}
  .tv-rail i{font-style:normal;font-size:calc(9.5px * var(--tvf,1));
    color:var(--ts,#6A7A73);opacity:.8;white-space:nowrap}
  .tv-body{flex:1;min-width:0;position:relative;
    padding:calc(5px * var(--tvf,1)) calc(8px * var(--tvf,1));
    display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .tv-c-name{font-size:calc(14px * var(--tvf,1));font-weight:800;line-height:1.2;
    color:var(--lc-ink,#16221C);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:keep-all;letter-spacing:-.01em}
  .tv-c-who{font-size:calc(10px * var(--tvf,1));font-weight:600;
    color:var(--ts,#5A6560);opacity:.8;
    line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:keep-all;min-width:0;margin-top:1px}
  .tv-c-sub{display:block;font-size:calc(9.5px * var(--tvf,1));color:var(--tl,#93A09A)}
  .tv-c-time{display:block;font-size:calc(9.5px * var(--tvf,1));
    color:var(--tl,#93A09A);line-height:1.35}
  /* 교실 배지 — 우측 «하단»: 과목 이름과 겹치지 않는다 */
  .tv-c-room{position:absolute;top:auto;bottom:calc(3px * var(--tvf,1));right:calc(4px * var(--tvf,1));
    font-size:calc(9px * var(--tvf,1));font-weight:700;color:var(--ts,#5A6560);
    background:rgba(255,255,255,.72);border-radius:5px;padding:0 5px;line-height:1.5;
    max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tv-card.big .tv-c-name{-webkit-line-clamp:3}
  /* 레일 폭은 카드 크기와 상관없이 같게 — 한 열의 과목명 시작 위치가 나란해진다 */
  .tv-card.small .tv-rail, .tv-card.tiny .tv-rail{padding:1px 0}
  .tv-card.small .tv-rail i, .tv-card.tiny .tv-rail i{display:none}
  .tv-card.small .tv-body, .tv-card.tiny .tv-body{padding:1px calc(6px * var(--tvf,1));justify-content:center}
  .tv-card.small .tv-c-room, .tv-card.tiny .tv-c-room{display:none}
  .tv-card.small .tv-c-name, .tv-card.tiny .tv-c-name{
    font-size:calc(11px * var(--tvf,1));-webkit-line-clamp:1;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-card.tiny, .tv-card.small{min-height:15px}
  .tv-card.rest .tv-c-name{font-weight:700;opacity:.85}
  /* 🌙 다크 — 본문은 어둡게, 색은 레일에 */
  html[data-theme="dark"] .tv-card{ background-color:#18231F; background-image:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
  html[data-theme="dark"] .tv-rail{ background:var(--lc,#2BAE7E); }
  html[data-theme="dark"] .tv-rail b{ color:#fff; }
  html[data-theme="dark"] .tv-rail i{ color:rgba(255,255,255,.82); }
  html[data-theme="dark"] .tv-c-name{ color:#EAF3EF; }
  html[data-theme="dark"] .tv-c-who{ color:#9DB1A8; }
  html[data-theme="dark"] .tv-c-sub, html[data-theme="dark"] .tv-c-time{ color:#7E938B; }
  html[data-theme="dark"] .tv-c-room{ background:rgba(255,255,255,.12); color:#C8D8D1; }
  .tv-card.tiny .tv-c-time{font-size:calc(8px * var(--tvf,1));line-height:1.15;
    white-space:nowrap;flex:none;opacity:.85}
  .tv-card.tiny .tv-c-time i{display:none}
  .tv-card.tiny .tv-c-sub{display:none}
  .tv-card.tiny .tv-c-who{font-size:calc(8px * var(--tvf,1));line-height:1.15;color:var(--ts,#5A6560);
    -webkit-line-clamp:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tv-card.tiny .tv-c-room{font-size:calc(7.5px * var(--tvf,1));padding:0 3px;
    color:var(--ts,#5A6560);background:rgba(0,0,0,.06);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* 짧은 칸의 선생님 이름 — 한 줄에 안 들어가면 줄을 바꿔 다 보이게 */
  .tv-card.small .tv-c-who{-webkit-line-clamp:2;white-space:normal;overflow-wrap:anywhere}

  /* ── 쉬는 시간 카드 — 회색으로 수업과 구분 ── */
  .tv-card.rest{ box-shadow:none; opacity:.97 }
  .tv-card.rest .tv-c-time{ opacity:.85 }

  /* ── 🔎 수업 카드 자세히 보기 ── */
  .tv-card{cursor:pointer}
  .tv-card:focus-visible{outline:2px solid var(--gm,#00704A);outline-offset:1px}
  @keyframes tvGlowPulse{
    0%,100%{ box-shadow:0 1px 2px rgba(30,57,50,.07); filter:none; }
    50%    { box-shadow:0 0 0 3px rgba(0,112,74,.45), 0 2px 10px rgba(0,112,74,.30); filter:brightness(1.06); }
  }
  .tv-card.tv-glow{ animation:tvGlowPulse 1.15s ease-in-out infinite; z-index:5 }
  @media (prefers-reduced-motion:reduce){
    .tv-card.tv-glow{ animation:none; box-shadow:0 0 0 3px rgba(0,112,74,.45) }
  }

  .tvi-ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:18px}
  .tvi-bk{position:absolute;inset:0;background:rgba(15,25,21,.5)}
  .tvi-box{position:relative;z-index:1;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;
    background:var(--wh,#fff);border-radius:16px;padding:20px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .tvi-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(0,0,0,.06);color:#555;font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;min-width:28px;max-width:28px;}
  .tvi-x:hover{background:rgba(0,0,0,.12)}
  .tvi-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding-right:26px}
  .tvi-bar{width:5px;align-self:stretch;min-height:34px;border-radius:100px;background:var(--lc,#7FB5A0);flex:none}
  .tvi-nm{font-size:17px;font-weight:900;color:var(--gd,#1E3932);line-height:1.25;overflow-wrap:anywhere}
  .tvi-sub{font-size:12px;color:var(--tl,#93A09A);margin-top:2px;overflow-wrap:anywhere}
  .tvi-stats{display:flex;gap:7px;margin-bottom:14px}
  .tvi-stat{flex:1;background:var(--lc-bg,#F2F7F5);border-radius:10px;padding:10px 6px;text-align:center}
  .tvi-stat b{display:block;font-size:15px;font-weight:900;color:var(--gd,#1E3932);line-height:1.2}
  .tvi-stat span{display:block;font-size:10.5px;color:var(--ts,#5A6560);margin-top:3px}
  .tvi-lines{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .tvi-line{display:flex;gap:9px;font-size:12.5px;line-height:1.5}
  .tvi-k{color:var(--tl,#93A09A);flex:none;min-width:62px}
  .tvi-v{color:var(--ink,#1F2320);font-weight:700;overflow-wrap:anywhere}
  .tvi-listt{font-size:12px;font-weight:800;color:var(--gd,#1E3932);margin-bottom:6px}
  .tvi-list{display:flex;flex-direction:column;gap:4px}
  .tvi-row{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:8px;
    background:var(--iv,#F2F0EB);font-size:12px}
  .tvi-row.on{background:var(--lc-bg,#F2F7F5);box-shadow:inset 0 0 0 1.5px var(--lc,#7FB5A0)}
  .tvi-day{font-weight:900;color:var(--gd,#1E3932);flex:none;min-width:16px}
  .tvi-time{color:var(--ts,#5A6560);font-weight:700}
  .tvi-dur{color:var(--tl,#93A09A)}
  .tvi-p{font-size:11px;font-weight:800;color:var(--gm,#00704A);
    background:var(--gp,#E8F3EF);border-radius:5px;padding:1px 7px;flex:none}
  .tvi-room{margin-left:auto;font-size:11px;font-weight:700;color:var(--ts,#5A6560);
    background:var(--wh,#fff);border-radius:5px;padding:1px 7px;overflow-wrap:anywhere}
  .tvi-note{font-size:11px;color:var(--tl,#93A09A);margin-top:11px;line-height:1.6}
  @media(max-width:640px){ .tvi-ov{padding:10px} .tvi-box{padding:17px 16px;max-height:88vh} }

  .tv-card.small .tv-c-who{color:var(--tb,#5A6560);font-size:calc(9.5px * var(--tvf,1));line-height:1.2}
  .tv-card.small .tv-c-room{background:var(--iv,#F2F0EB);color:var(--ts,#5A6560);
    margin-left:4px;font-size:calc(8.5px * var(--tvf,1));line-height:1.4}


  /* ══ 📱 압축 모드 — 좁은 화면에서 월~금을 한 화면에 ══
     자바스크립트가 화면 폭을 보고 .compact 를 붙인다.
     (미디어 쿼리를 쓰면 화면 밖에서 그리는 저장용 판까지 압축되어 버린다) */
  .tv-sheet.compact{ padding:7px; border-radius:10px; overflow-x:hidden; }
  .tv-sheet.compact .tv-board{ min-width:0; }          /* 5일이 폭에 맞춰 줄어든다 */
  .tv-sheet.compact .tv-hd,
  .tv-sheet.compact .tv-grid{ grid-template-columns:30px repeat(5,minmax(0,1fr)); }
  .tv-sheet.compact .tv-tick{ font-size:8.5px; padding-left:2px; }
  .tv-sheet.compact .tv-hd-d{ padding:5px 0; font-size:calc(11.5px * var(--tvf,1)); }
  .tv-sheet.compact .tv-head{ margin-bottom:7px; }
  .tv-sheet.compact .tv-title{ font-size:15px; }
  .tv-sheet.compact .tv-meta{ font-size:10.5px; }

  /* 카드 — 좌우 여백을 최소로, 글자는 줄바꿈해서 최대한 담는다 */
  .tv-sheet.compact .tv-card{ left:1px; right:1px; border-radius:6px; }
  .tv-sheet.compact .tv-rail{ width:calc(32px * var(--tvf,1)); padding:1px 0; }
  .tv-sheet.compact .tv-rail i{ display:none; }
  .tv-sheet.compact .tv-body{ padding:2px 5px; }
  .tv-sheet.compact .tv-c-name{ font-size:calc(10.5px * var(--tvf,1)); -webkit-line-clamp:2; }
  .tv-sheet.compact .tv-c-time{ font-size:calc(8.5px * var(--tvf,1)); line-height:1.25; }
  .tv-sheet.compact .tv-c-time i{ display:none; }      /* "40분" 은 접는다 */
  .tv-sheet.compact .tv-c-sub{ font-size:calc(8.5px * var(--tvf,1)); }
  /* 좁아도 자르지 않는다 — 선생님 이름과 교실은 줄을 바꿔 내려간다 */
  .tv-sheet.compact .tv-c-who{ font-size:calc(8.5px * var(--tvf,1)); line-height:1.2;
    -webkit-line-clamp:3; white-space:normal; overflow-wrap:anywhere; }
  .tv-sheet.compact .tv-c-room{ font-size:calc(8px * var(--tvf,1)); padding:0 3px;
    max-width:100%; white-space:normal; overflow-wrap:anywhere; }
  .tv-sheet.compact .tv-bg span{ font-size:8px; padding:0 2px; }
  /* 아주 납작한 카드는 과목만 */
  .tv-sheet.compact .tv-card.small{ gap:3px; padding:0 3px; }

  /* ══ 세로 크기 조절 ══ */
  .tv-zoom{display:flex;align-items:center;gap:4px;flex:none}
  .tv-zstep{font-family:inherit;font-size:14px;font-weight:900;line-height:1;
    width:28px;height:28px;border:1px solid var(--ivd,#E3E1DA);border-radius:8px;
    background:var(--wh,#fff);color:var(--gm,#00704A);cursor:pointer;flex:none}
  .tv-zstep:disabled{opacity:.35;cursor:not-allowed}
  .tv-zval{font-size:11.5px;font-weight:800;color:var(--ts,#5A6560);
    min-width:42px;text-align:center;flex:none}
  .tv-zv-btn{border:1px dashed var(--ivd,#E3E1DA);border-radius:7px;background:var(--wh,#fff);
    font-family:inherit;padding:5px 6px;cursor:pointer;min-width:44px}
  .tv-zv-btn.auto{color:var(--tl,#93A09A);font-weight:700}
  .tv-zfit{font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 11px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:8px;background:var(--wh,#fff);
    color:var(--ts,#5A6560);cursor:pointer;white-space:nowrap;flex:none}
  .tv-zfit.on{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}
  .tv-zg{display:inline-flex;align-items:center;gap:4px;flex:none}

  @media(max-width:720px){
    body{padding:5px}
    .paper{padding:6px;border-radius:11px}
    .top{gap:8px;margin-bottom:8px}
    .top img{width:34px;height:34px}
    .top .t1{font-size:14px}
    .vw-bar{padding:8px 9px;gap:5px;margin-bottom:9px}
    .foot{margin:10px auto 20px}
  }

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

});
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true })   /* 막히는 네트워크 자동 우회 */;

/* ══ 완성 시간표에서 이식한 렌더 코어 (같은 모습으로 그린다) ══ */
const $I = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const DAYS = ['월','화','수','목','금'];
const hm = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const parseHM = s => { const [a,b]=String(s||'0:0').split(':').map(Number); return (a||0)*60+(b||0); };

function toast(msg, kind){
  const t=$I('toast'); if(!t) return;
  t.textContent=msg; t.style.background = kind==='err' ? '#C0392B' : 'var(--gd,#1E3932)';
  t.style.opacity='1'; clearTimeout(t._t);
  t._t=setTimeout(()=>{ t.style.opacity='0'; }, 2400);
}
function fmtDT(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let CU = null;
let PUBS = [];        // 게시된 시간표들
let CUR = null;       // 지금 보고 있는 게시본
let SETS = [];        // 저장해둔 배정 (게시할 거리)

/* 색 · 이름 — 배정 화면과 같은 규칙 */
const LESSON_COLORS = [
  '#7FB5A0','#8FB8E0','#E8A87C','#D9A0C0','#A79BD4','#7EBDC9',
  '#E09B9B','#8FC49A','#D4B483','#B9A4D9','#7FC0B5','#E0A97C',
  '#9BAEDD','#DDA0BC','#93C7A3','#CFAF7E','#A9C8DE','#C9A0D0',
  '#8CC5B8','#E3B08A','#9FB3D9','#D3A5B8','#A6CBA0','#C7B78F'
];
/* 과목 색을 글자용으로 어둡게 — 배경 위에서도 또렷하게 읽힌다 */
function darkOf(hex){
  try {
    const c = String(hex||'').replace('#','');
    const n = c.length===3 ? c.split('').map(x=>x+x).join('') : c;
    const r = parseInt(n.slice(0,2),16), g = parseInt(n.slice(2,4),16), b = parseInt(n.slice(4,6),16);
    const d = v => Math.round(v * .42);
    return `rgb(${d(r)},${d(g)},${d(b)})`;
  } catch(e){ return '#16221C'; }
}
function tintOf(hex, alpha){
  const c = String(hex||'#7FB5A0').replace('#','');
  const n = parseInt(c.length===3 ? c.split('').map(x=>x+x).join('') : c, 16);
  // 🩹 반투명(rgba) 대신 흰색과 섞은 «불투명» 색을 만든다
  //    — 카드가 겹치거나 뒤에 틀 배경이 있어도 절대 비쳐 보이지 않는다
  const mix = v => Math.round(255 - (255 - v) * alpha);
  return `rgb(${mix((n>>16)&255)}, ${mix((n>>8)&255)}, ${mix(n&255)})`;
}
function lessonColor(l){
  if(!l) return LESSON_COLORS[0];
  if(l.color) return l.color;
  const names = [];
  (CUR?.snapshot?.lessons||[]).forEach(x=>{
    const s=(x.subject||'').trim(); if(s && names.indexOf(s)<0) names.push(s);
  });
  const i = names.indexOf((l.subject||'').trim());
  return LESSON_COLORS[(i<0?0:i) % LESSON_COLORS.length];
}
function teacherOf(uid){ return (CUR?.snapshot?.teachers||[]).find(t=>t.uid===uid) || null; }
function tName(uid){ return (teacherOf(uid)||{}).name || ''; }
function tColor(uid){ return (teacherOf(uid)||{}).color || '#93A09A'; }
function teacherLabel(lesson, uids){
  const list = (uids && uids.length) ? uids : (lesson ? (lesson.teacherUids||[]) : []);
  const names = list.map(tName).filter(Boolean);
  if(!names.length) return '미배정';
  if(names.length <= 2) return names.join(', ');
  const lead = lesson && lesson.leadUid && list.includes(lesson.leadUid) ? lesson.leadUid : list[0];
  return `${tName(lead)} 외 ${names.length-1}명`;
}
function teacherLead(lesson, uids){
  const list = (uids && uids.length) ? uids : (lesson ? (lesson.teacherUids||[]) : []);
  if(lesson && lesson.leadUid && list.includes(lesson.leadUid)) return lesson.leadUid;
  return list[0];
}
function findRoomName(roomId){
  for(const f of (CUR?.snapshot?.floors||[])){
    const r = (f.rooms||[]).find(x=>x.id===roomId);
    if(r) return r.name;
  }
  return '';
}

/* 게시본에서 부서 블록 읽기 */
function dayBlocksOf(grade, day){
  const snap = CUR?.snapshot; if(!snap) return { blocks:[], startMin:0, endMin:0 };
  const f = (snap.frames||[]).find(x=>x.id===snap.frameId) || (snap.frames||[])[0];
  if(!f || !f.snapshot) return { blocks:[], startMin:0, endMin:0 };
  const deptId = (snap.gradeDept?.[f.id]||{})[grade] || '';
  const dept = (f.snapshot.departments||[]).find(d=>d.id===deptId);
  if(!dept) return { blocks:[], startMin:0, endMin:0 };
  const btMap = {}; (f.snapshot.blockTypes||[]).forEach(b=>btMap[b.id]=b);
  const wk = f.snapshot.weekArrangements || {};
  const arr = (wk[day] && wk[day][deptId]) || (f.snapshot.arrangements && f.snapshot.arrangements[deptId]) || null;
  if(!arr) return { blocks:[], startMin:0, endMin:0 };
  let cur = parseHM(dept.start || '08:40');
  const startMin = cur, blocks = [];
  arr.forEach(item=>{
    const bt = btMap[item.typeId]; if(!bt) return;
    const dur = Number(item.durOverride!=null ? item.durOverride : bt.dur) || 0;
    blocks.push({ name:bt.name, dur, isClass:!!bt.countsAsClass, startMin:cur, endMin:cur+dur });
    cur += dur;
  });
  return { blocks, startMin, endMin:cur };
}


/* ═══════════════════════════════════════════
   ⏱ 주당 시수 계산
   · 기준 분은 부서마다 다르다 — 초등부 40분, 중·고등부 50분
     (시간표 틀의 부서 설정 "1시수 기준 분"에서 정한다)
   · 연강은 사이에 쉬는 시간이 끼어 있으므로 그만큼 빼고 센다
     예) 40분 2연강 = 85분 카드 → (85−5) ÷ 40 = 2시수
   · 낱개로 긴 수업(70분·120분 등)은 통으로 센다
     예) 초등부 70분 한 장 → 70 ÷ 40 = 1.75시수
   ═══════════════════════════════════════════ */
function cardPeriods(durMin, size, brk, base){
  const b = Number(base) || 40;
  const n = Math.max(1, Number(size) || 1);
  const gap = (n > 1) ? (Number(brk) || 0) * (n - 1) : 0;   // 연강일 때만 쉼을 뺀다
  const eff = Math.max(0, (Number(durMin) || 0) - gap);
  return eff / b;
}

/* 1.5 · 2 처럼 보기 좋게 (소수 둘째 자리까지, 끝의 0은 지운다) */
function fmtPeriods(x){
  const n = Math.round((Number(x) || 0) * 100) / 100;
  return String(n);
}

/* 이 학년이 쓰는 부서의 1시수 기준 분 (게시본 안의 틀에서 찾는다) */
function periodBaseOf(grade){
  const snap = CUR && CUR.snapshot; if(!snap) return 40;
  const fid = snap.frameId;
  const deptId = ((snap.gradeDept||{})[fid]||{})[grade] || '';
  const f = (snap.frames||[]).find(x=>x.id===fid) || (snap.frames||[])[0];
  const d = f && f.snapshot ? (f.snapshot.departments||[]).find(x=>x.id===deptId) : null;
  return Number(d && d.periodMin) || 40;
}

/* 배치된 카드 한 장이 몇 연강인지 (수업 정의에서 역산) */
function cardSizeOf(lesson, cardIdx){
  if(!lesson || cardIdx==null) return 1;
  const h = Number(lesson.hours)||0;
  let g = Array.isArray(lesson.groups) ? lesson.groups.map(n=>Math.max(1,Number(n)||1)) : null;
  if(!(g && g.length && g.reduce((a,b)=>a+b,0) === h)){
    g = []; const b = Math.max(1, Number(lesson.bundle)||1); let left = h;
    while(left > 0){ const x = Math.min(b, left); g.push(x); left -= x; }
  }
  return Number(g[cardIdx]) || 1;
}


/* 쉬는 시간 카드 — 수업 시수에 들어가지 않는 시간 (아침 조회·점심·청소 등) */
function isRestLesson(l){ return !!l && l.kind === 'break'; }
/* 게시본의 배치를 평평하게 */
function collect(){
  const snap = CUR?.snapshot; if(!snap) return [];
  const out = [];
  const byGrade = snap.place2?.[snap.frameId] || {};
  Object.keys(byGrade).forEach(grade=>{
    DAYS.forEach(dy=>{
      (byGrade[grade][dy] || []).forEach(c=>{
        const les = (snap.lessons||[]).find(l=>l.id===c.lessonId); if(!les) return;
        // 합반에서 빠졌는데 배치만 남은 잔상은 보여주지 않는다
        if((les.grades||[]).length && !les.grades.includes(grade)) return;
        out.push({ day:dy, startMin:c.startMin, endMin:c.startMin+c.durMin,
          grade, lesson:les, grades:[grade], cardIdx:c.cardIdx,
          teacherUids:les.teacherUids||[], roomId:c.roomId || les.roomId || '' });
      });
    });
  });
  return out;
}

/* ═══ 보기 ═══ */
let vwKind = 'grade';    // grade | teacher | room (공개 페이지엔 '내 시간표' 없음)
let vwTarget = '';
/* 세로 크기 — 촘촘하게 나눠 미세 조절이 되게 한다.
   2.7 을 100% 로 보고, 아래로는 폰 한 화면에 들어갈 만큼 작게까지 내려간다. */
const TV_BASE = 2.7;                 // 세로 100% = 1분당 2.7px
const PCT_MIN = 40, PCT_MAX = 300;   // 세로 40~300%
/* 글자 자동 배율 — 칸이 작아지면 글자도 함께 줄어든다 (너무 작아지지 않게 바닥을 둔다) */
function fontScaleOf(ppm){
  return Math.max(0.74, Math.min(1.72, 0.62 + (ppm / TV_BASE) * 0.46));
}

/* 💾 보기 설정 — 기기(폰·패드·컴퓨터)마다 따로 기억한다
   폰에서 맞춰둔 크기와 컴퓨터에서 맞춰둔 크기가 서로를 덮지 않는다 */
const DEV_CLASS = (w => w<=640 ? 'phone' : w<=1100 ? 'tablet' : 'desktop')
  (Math.min(window.innerWidth||1e4, (screen && screen.width)||1e4));
let tvPct = 100;     // 세로 크기 %
let fontPct = 0;     // 글자 크기 % (0 = 자동 — 세로에 따라간다)
let tvFit = false;   // ⤢ 한 화면 맞춤을 켜 두면 화면이 바뀔 때 다시 계산한다
try {
  const saved = JSON.parse(localStorage.getItem('stf_vp_'+DEV_CLASS) || 'null');
  if(saved){
    tvPct = Number(saved.pct)||100; fontPct = Number(saved.font)||0; tvFit = !!saved.fit;
  } else {
    const z = parseFloat(localStorage.getItem('stf_zoom'));   // 예전 저장값 이어받기
    if(z) tvPct = Math.round(z / TV_BASE * 10) * 10;
    tvFit = localStorage.getItem('stf_fit') === 'on';
  }
} catch(e){}
const clampPct = v => Math.max(PCT_MIN, Math.min(PCT_MAX, Math.round(v)));
const tvPPM = () => TV_BASE * tvPct / 100;
function saveVP(){ try { localStorage.setItem('stf_vp_'+DEV_CLASS,
  JSON.stringify({ pct:tvPct, font:fontPct, fit:tvFit })); } catch(e){} }

/* − / + 10%씩 */
window.stepTvZoom = function(dir){
  tvFit = false;
  tvPct = clampPct(Math.round((tvPct + dir*10)/10)*10);
  saveVP(); renderView();
};
/* 글자 − / + 10%씩 — 자동 상태에서 누르면 지금 자동값에서 출발한다 */
window.stepTvFont = function(dir){
  const cur = fontPct || Math.round(fontScaleOf(tvPPM())*100);
  fontPct = Math.max(60, Math.min(220, Math.round((cur + dir*10)/10)*10));
  saveVP(); renderView();
};
window.autoTvFont = function(){ fontPct = 0; saveVP(); renderView(); };

/* 📱 한 화면 맞춤 — 하루 길이를 화면 높이에 맞춰 배율을 계산한다 */
window.fitTvZoom = function(){
  tvFit = !tvFit;
  if(tvFit) applyFitZoom();
  saveVP(); renderView();
};

/* 지금 화면에서 하루가 다 보이도록 배율을 정한다 */
function applyFitZoom(){
  const span = currentSpan();
  if(!span) return;
  // 화면 높이에서 머리말·보기막대·머리글·여백을 뺀 만큼이 표가 쓸 수 있는 높이
  const used = 210;
  const avail = Math.max(240, window.innerHeight - used);
  tvPct = clampPct(avail / span / TV_BASE * 100);
}

/* 지금 보고 있는 시간표의 하루 길이(분) */
function currentSpan(){
  const all = collect();
  const mine = all.filter(it=>matchOf(it, vwKind, vwTarget));
  if(!mine.length) return 0;
  let s0 = Math.min(...mine.map(x=>x.startMin));
  let e0 = Math.max(...mine.map(x=>x.endMin));
  if(vwKind==='grade'){
    DAYS.forEach(dy=>{ const b = dayBlocksOf(vwTarget, dy);
      if(b.blocks?.length){ s0=Math.min(s0,b.startMin); e0=Math.max(e0,b.endMin); } });
  }
  return Math.max(30, e0 - s0);
}

window.setVwKind = function(k){
  vwKind = k; vwTarget = '';
  ['mine','grade','teacher','room'].forEach(x=>{
    const b = $I('vk-'+x); if(b) b.classList.toggle('on', x===k);
  });
  try { localStorage.setItem('stf_kind', k); } catch(e){}
  renderView();
};
window.setVwTarget = function(v){ vwTarget = v; renderView(); };

function targetsOf(all){
  if(vwKind==='mine') return [{ id:CU.uid, label:(CU.name||'나')+' 선생님' }];
  if(vwKind==='grade'){
    const set = new Set(); all.forEach(it=>it.grades.forEach(g=>set.add(g)));
    return [...set].sort((a,b)=>String(a).localeCompare(String(b),'ko',{numeric:true}))
      .map(g=>({ id:String(g), label:String(g) }));
  }
  if(vwKind==='teacher'){
    const set = new Set(); all.forEach(it=>it.teacherUids.forEach(u=>set.add(u)));
    return [...set].map(u=>({ id:u, label:tName(u)||'(알 수 없음)' }))
      .sort((a,b)=>a.label.localeCompare(b.label,'ko'));
  }
  const set = new Set(); all.forEach(it=>{ if(it.roomId) set.add(it.roomId); });
  return [...set].map(r=>({ id:r, label:findRoomName(r)||'(교실)' }))
    .sort((a,b)=>a.label.localeCompare(b.label,'ko'));
}
function matchOf(it, kind, target){
  if(kind==='mine' || kind==='teacher') return it.teacherUids.includes(target);
  if(kind==='grade') return it.grades.map(String).includes(String(target));
  return it.roomId === target;
}


/* ═══ 🧩 겹침 정리 ═══
   같은 시간대에 카드가 두 장 이상 있을 때:
   · 완전히 같은 수업·같은 시간이면 → 한 장으로 합친다 (중복 제거)
   · 서로 다른 수업이 겹치면 → 달력처럼 옆으로 나란히 쪼갠다
   예전에는 겹친 채로 포개져 글자가 뒤섞여 보였다 */
function dedupeSlots(list){
  const seen = new Set();
  return list.filter(it=>{
    const k = String(it.lesson && it.lesson.id)+'|'+it.startMin+'|'+it.endMin;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
}
function layoutOverlaps(cards){
  // cards: startMin 순 정렬 상태. 각 카드에 {col, cols}를 매긴다
  const res = cards.map(()=>({ col:0, cols:1 }));
  let cluster = [], colEnds = [], clusterEnd = -1;
  const flush = ()=>{
    const n = Math.max(1, colEnds.length);
    cluster.forEach(i=>{ res[i].cols = n; });
    cluster = []; colEnds = [];
  };
  cards.forEach((c,i)=>{
    if(cluster.length && c.startMin >= clusterEnd) flush();
    let col = colEnds.findIndex(e=>e <= c.startMin);
    if(col < 0){ col = colEnds.length; colEnds.push(0); }
    colEnds[col] = c.endMin;
    res[i].col = col;
    cluster.push(i);
    clusterEnd = Math.max(clusterEnd, c.endMin);
  });
  flush();
  return res;
}

/* 시간표 한 장을 그린다 (화면·인쇄 같은 코드) */
function sheetHTML(kind, target, label, opt){
  const all = collect();
  const mine = all.filter(it=>matchOf(it, kind, target));
  if(!mine.length) return '';

  const TV_PPM = (opt && opt.ppm) || tvPPM();
  // 화면: 글자 %를 정해뒀으면 그 값, 아니면 세로에 따라 자동 · 저장용(ppm 지정)은 자동
  const f = (opt && opt.ppm) ? fontScaleOf(TV_PPM)
          : (fontPct ? fontPct/100 : fontScaleOf(TV_PPM));

  let s0 = Math.min(...mine.map(x=>x.startMin));
  let e0 = Math.max(...mine.map(x=>x.endMin));
  const bgBlocks = {};
  if(kind==='grade'){
    DAYS.forEach(dy=>{
      const b = dayBlocksOf(target, dy);
      bgBlocks[dy] = b.blocks || [];
      if(b.blocks?.length){ s0 = Math.min(s0, b.startMin); e0 = Math.max(e0, b.endMin); }
    });
  }
  const H = Math.round((e0 - s0) * TV_PPM);

  const cols = DAYS.map(dy=>{
    const bg = (bgBlocks[dy]||[]).map(b=>`
      <div class="tv-bg ${b.isClass?'cls':'rest'} ${b.dur*TV_PPM < 15 ? 'tiny':''}"
        style="top:${(b.startMin-s0)*TV_PPM}px;height:${b.dur*TV_PPM}px"><span>${esc(b.name)}</span></div>`).join('');
    const dayList = dedupeSlots(
      mine.filter(it=>it.day===dy)
        .sort((a,b)=> a.startMin - b.startMin || (b.endMin-b.startMin) - (a.endMin-a.startMin)));
    const lanes = layoutOverlaps(dayList);
    const cards = dayList.map((it, _ci)=>{
      const L = lanes[_ci] || { col:0, cols:1 };
      // 겹치면 나란히 — 열을 cols 등분해 col번째 자리에 놓는다
      const lane = L.cols > 1
        ? `left:calc(${(L.col/L.cols*100).toFixed(3)}% + 2px);width:calc(${(100/L.cols).toFixed(3)}% - 4px);right:auto;`
        : '';
      const dur = it.endMin - it.startMin, px = dur * TV_PPM;
      // 칸 높이에 따라 네 단계 — 좁을수록 글자를 줄여 잘리지 않게 한다
      const size = px >= 62*f ? 'big' : px >= 40*f ? 'mid' : px >= 22*f ? 'small' : 'tiny';
      const who = teacherLabel(it.lesson, it.teacherUids);
      const room = it.roomId ? findRoomName(it.roomId) : '';
      const lead = teacherLead(it.lesson, it.teacherUids);
      const bar = lead ? tColor(lead) : '#93A09A';
      const sub = kind==='grade' ? '' : (it.grade || '');
      return `<div class="tv-card ${size} ${isRestLesson(it.lesson)?'rest':''}" data-lesson="${esc(it.lesson.id||'')}"
        data-day="${dy}" data-start="${it.startMin}" tabindex="0"
        onclick="openTvInfo('${esc(it.lesson.id||'')}','${dy}',${it.startMin})"
        style="top:${(it.startMin-s0)*TV_PPM}px;height:${px}px;${lane}
               --lc:${lessonColor(it.lesson)};--lc-bg:${tintOf(lessonColor(it.lesson),.16)};
               --lc-rail:${tintOf(lessonColor(it.lesson),.32)};--lc-ink:${darkOf(lessonColor(it.lesson))};--tb:${bar}">
        <div class="tv-rail">
          <b>${hm(it.startMin)}</b>${size!=='tiny' ? `<i>${dur}분</i>` : ''}
        </div>
        <div class="tv-body">
          ${room && !isRestLesson(it.lesson) ? `<span class="tv-c-room">${esc(room)}</span>` : ''}
          <b class="tv-c-name">${esc(it.lesson.subject)}</b>
          ${size==='big' && sub ? `<span class="tv-c-sub">${esc(sub)}</span>` : ''}
          ${isRestLesson(it.lesson) ? '' : `<span class="tv-c-who">${esc(who)}</span>`}
          <span class="tv-c-time">${hm(it.startMin)}~${hm(it.endMin)}</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="tv-col" style="height:${H}px">${bg}${cards}</div>`;
  }).join('');

  let ticks = '';
  for(let m = Math.ceil(s0/30)*30; m <= e0; m += 30){
    ticks += `<div class="tv-tick" style="top:${(m-s0)*TV_PPM}px">${hm(m)}</div>`;
  }
  const kindLabel = kind==='grade'?'학년별':kind==='room'?'교실별':'선생님별';

  return `<div class="tv-sheet">
      <div class="tv-head">
        <div>
          <div class="tv-title">${esc(label)} 시간표</div>
          <div class="tv-meta">${esc(CUR.title||'')} · ${kindLabel} · 주 ${mine.length}시간 · ${hm(s0)}~${hm(e0)}</div>
        </div>

      </div>
      <div class="tv-board" style="--tvf:${f}">
        <div class="tv-hd"><div class="tv-hd-t"></div>${DAYS.map(d=>`<div class="tv-hd-d">${d}</div>`).join('')}</div>
        <div class="tv-grid" style="height:${H}px">
          <div class="tv-times" style="height:${H}px">${ticks}</div>
          ${cols}
        </div>
      </div>
    </div>`;
}

/* 보기 막대 — 학년별 · 선생님별 · 교실별 + 대상 고르기 + 크기 */

    </select>
    <span class="tv-zoom" style="margin-left:auto">
      <span class="tv-zg">
        <span style="font-size:11px;color:var(--tl)">세로</span>
        <button class="tv-zstep" onclick="stepTvZoom(-1)" ${tvPct<=40?'disabled':''} title="세로로 10% 줄이기">−</button>
        <span class="tv-zval">${tvPct}%</span>
        <button class="tv-zstep" onclick="stepTvZoom(1)" ${tvPct>=300?'disabled':''} title="세로로 10% 늘리기">＋</button>
      </span>
      <button class="tv-zfit ${tvFit?'on':''}" onclick="fitTvZoom()"
        title="하루가 한 화면에 다 들어오도록 맞춥니다">⤢ 한 화면</button>
      <span class="tv-zg">
        <span style="font-size:11px;color:var(--tl)">글자</span>
        <button class="tv-zstep" onclick="stepTvFont(-1)" title="글자 10% 줄이기">−</button>
        <button class="tv-zval tv-zv-btn ${fontPct?'':'auto'}" onclick="autoTvFont()"
          title="누르면 자동(세로에 따라감)으로 돌아갑니다">${fontPct ? fontPct+'%' : '자동'}</button>
        <button class="tv-zstep" onclick="stepTvFont(1)" title="글자 10% 키우기">＋</button>

  const t = targets.find(x=>String(x.id)===String(vwTarget));
  $I('tv-out').innerHTML = sheetHTML(vwKind, t.id, t.label, { noZoom:true }) || '';
  applyCompact();
}

/* ═══════════════════════════════════════════
   🔎 수업 카드 자세히 보기
   카드를 누르면 그 수업이 한 주에 몇 시간·몇 분 들어가는지,
   어느 요일 어느 시각에 놓였는지, 누가 들어가고 어느 교실인지 보여준다.
   보는 동안 같은 수업 카드들이 함께 반짝여 한눈에 찾을 수 있다.
   ═══════════════════════════════════════════ */

/* 같은 수업 카드에 반짝임을 켜고 끈다 */
function tvGlow(lessonId){
  document.querySelectorAll('.tv-card.tv-glow').forEach(el=>el.classList.remove('tv-glow'));
  if(!lessonId) return;
  document.querySelectorAll(`.tv-card[data-lesson="${CSS.escape(lessonId)}"]`)
    .forEach(el=>el.classList.add('tv-glow'));
}
window.tvGlow = tvGlow;

window.closeTvInfo = function(){
  document.getElementById('tvi-mod')?.remove();
  tvGlow(null);
};

window.openTvInfo = function(lessonId, day, startMin){
  /* 어디서든 문제가 나면 조용히 죽지 않고 화면에 알려준다 */
  try { openTvInfoRaw(lessonId, day, startMin); }
  catch(e){
    console.error('openTvInfo', e);
    try { toast('카드 상세를 여는 중 문제가 났어요: '+(e.message||e), 'err'); }
    catch(_){ alert('카드 상세를 여는 중 문제가 났어요:\n'+(e.message||e)); }
  }
};
function openTvInfoRaw(lessonId, day, startMin){
  if(!lessonId) return;
  const all = (typeof collect === 'function') ? collect() : [];
  // 수업 id가 숫자로 저장돼 있어도 찾아지도록 문자열로 맞춰 비교한다
  const same = all.filter(it => String(it.lesson && it.lesson.id) === String(lessonId));
  const hit  = same.find(it => it.day===day && String(it.startMin)===String(startMin)) || same[0];
  if(!hit){ try { toast('이 카드의 수업 정보를 찾지 못했습니다','err'); } catch(e){} return; }

  const les = hit.lesson || {};
  // 같은 수업이 여러 학년에 함께 들어가면 한 번만 세도록 요일·시각으로 묶는다
  const slotKey = it => `${it.day}|${it.startMin}|${it.endMin}`;
  const slots = [];
  const seen = new Set();
  same.forEach(it=>{
    const k = slotKey(it);
    if(seen.has(k)) return;
    seen.add(k);
    slots.push(it);
  });
  slots.sort((a,b)=> (DAYS.indexOf(a.day)-DAYS.indexOf(b.day)) || (a.startMin-b.startMin));

  const totalMin = slots.reduce((n,it)=>n + (it.endMin - it.startMin), 0);
  const hours = Math.floor(totalMin/60), mins = totalMin%60;

  /* 주당 시수 — 부서 기준 분으로 계산한다.
     연강은 사이 쉼을 빼고, 낱개로 긴 수업은 통으로 센다. */
  const brk = (les.linkBreak!=null) ? Number(les.linkBreak) : 5;
  const baseMin = periodBaseOf(hit.grade || (hit.grades||[])[0]);
  const periods = slots.reduce((n,it)=>{
    const sz = cardSizeOf(les, it.cardIdx);
    return n + cardPeriods(it.endMin - it.startMin, sz, brk, baseMin);
  }, 0);

  // 이 수업이 들어가는 학년 모두
  const grades = [...new Set(same.flatMap(it=>it.grades && it.grades.length ? it.grades : [it.grade]))]
    .filter(Boolean);
  // 담당 선생님 (대표 먼저)
  const uids = hit.teacherUids || les.teacherUids || [];
  const names = uids.map(u=>tName(u)).filter(Boolean);
  const room = hit.roomId ? findRoomName(hit.roomId) : '';

  const rows = slots.map(it=>{
    const isThis = it.day===hit.day && it.startMin===hit.startMin;
    const r = it.roomId ? findRoomName(it.roomId) : '';
    const szR = cardSizeOf(les, it.cardIdx);
    const pR = cardPeriods(it.endMin - it.startMin, szR,
      (les.linkBreak!=null?Number(les.linkBreak):5), periodBaseOf(it.grade || (it.grades||[])[0]));
    return `<div class="tvi-row ${isThis?'on':''}">
      <span class="tvi-day">${esc(it.day)}</span>
      <span class="tvi-time">${hm(it.startMin)}~${hm(it.endMin)}</span>
      <span class="tvi-dur">${it.endMin-it.startMin}분${szR>1?` · ${szR}연강`:''}</span>
      ${isRestLesson(les)?'':`<span class="tvi-p">${fmtPeriods(pR)}시수</span>`}
      ${r?`<span class="tvi-room">${esc(r)}</span>`:''}
    </div>`;
  }).join('');

  closeTvInfo();
  const ov = document.createElement('div');
  ov.id = 'tvi-mod';
  ov.className = 'tvi-ov';
  ov.innerHTML = `
    <div class="tvi-bk" onclick="closeTvInfo()"></div>
    <div class="tvi-box" style="--lc:${lessonColor(les)};--lc-bg:${tintOf(lessonColor(les),.16)}">
      <button class="tvi-x" onclick="closeTvInfo()" aria-label="닫기">✕</button>
      <div class="tvi-head">
        <span class="tvi-bar"></span>
        <div style="min-width:0">
          <div class="tvi-nm">${esc(les.subject||'수업')}</div>
          <div class="tvi-sub">${esc(grades.join(' · ')||'')}</div>
        </div>
      </div>

      <div class="tvi-stats">
        ${isRestLesson(les)
          ? `<div class="tvi-stat"><b>${slots.length}</b><span>주당 횟수</span></div>`
          : `<div class="tvi-stat"><b>${fmtPeriods(periods)}</b><span>주당 시수</span></div>`}
        <div class="tvi-stat"><b>${hours?`${hours}시간 `:''}${mins?`${mins}분`:(hours?'':'0분')}</b><span>주당 시간</span></div>
        <div class="tvi-stat"><b>${slots.length}장</b><span>카드 수</span></div>
      </div>

      <div class="tvi-lines">
        ${isRestLesson(les) ? '' : `<div class="tvi-line"><span class="tvi-k">👤 담당</span>
          <span class="tvi-v">${names.length?esc(names.join(', ')):'<span style="opacity:.6">미배정</span>'}</span></div>
        ${room?`<div class="tvi-line"><span class="tvi-k">🚪 교실</span><span class="tvi-v">${esc(room)}</span></div>`:''}`}
        <div class="tvi-line"><span class="tvi-k">🕐 지금 칸</span>
          <span class="tvi-v">${esc(hit.day)} ${hm(hit.startMin)}~${hm(hit.endMin)}</span></div>
      </div>

      <div class="tvi-listt">📅 이 수업이 놓인 자리</div>
      <div class="tvi-list">${rows}</div>
      <div class="tvi-note">${isRestLesson(les)
        ? '<b>쉬는 시간</b>이라 수업 시수에 들어가지 않습니다.'
        : `1시수 = <b>${baseMin}분</b> 기준으로 셈했습니다${
            slots.some(it=>cardSizeOf(les, it.cardIdx)>1) ? ' · 연강은 사이 쉬는 시간을 빼고 셉니다' : ''}.`}<br>
        같은 ${isRestLesson(les)?'시간':'수업'} ${slots.length}칸이 시간표에서 함께 <b>반짝이고</b> 있어요.</div>
    </div>`;
  document.body.appendChild(ov);
  tvGlow(lessonId);
}

/* ══ 이미지 저장 (share.html과 같은 방식) ══ */
let h2cLoading=false;
function loadH2C(){
  if(window.html2canvas || h2cLoading) return; h2cLoading=true;
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  document.head.appendChild(s);
}
loadH2C();

/* 🖼 이미지 저장 — 화면에 보이는 만큼이 아니라 시간표 전체를 담는다.
   화면 밖에 넉넉한 폭으로 다시 그린 뒤 그것을 뜨기 때문에,
   폰처럼 좁은 화면에서도 월~금이 잘리지 않고 전부 들어간다. */
const EXP_W = 1000;   // 저장용 판 폭 (화면 크기와 무관)

window.saveImage = async function(){
  const btn = document.querySelector('.top .btn.p');
  const orig = btn ? btn.textContent : '';
  try {
    if(btn){ btn.disabled = true; btn.textContent = '이미지 만드는 중…'; }
    if(!window.html2canvas){
      loadH2C();
      await new Promise((res,rej)=>{ const c=setInterval(()=>{ if(window.html2canvas){clearInterval(c);res();} },100);
        setTimeout(()=>{clearInterval(c); if(!window.html2canvas) rej(new Error('이미지 모듈 로드 실패 (인터넷 확인)'));},8000); });
    }

    const all = collect();
    const targets = targetsOf(all);
    const t = targets.find(x=>String(x.id)===String(vwTarget)) || targets[0];
    if(!t) throw new Error('내보낼 시간표가 없습니다');

    // 저장본은 읽기 좋은 크기로 (화면에서 아무리 작게 줄여 놨어도 또렷하게)
    const span = currentSpan() || 400;
    const ppm = Math.max(1.7, Math.min(3.2, 1150 / span));

    const holder = document.createElement('div');
    holder.style.cssText = `position:fixed;left:-13000px;top:0;width:${EXP_W}px;`
      + 'background:#ffffff;padding:22px;box-sizing:border-box;z-index:-1;';
    holder.innerHTML = sheetHTML(vwKind, t.id, t.label, { ppm, noZoom:true }) || '';
    const sheet = holder.querySelector('.tv-sheet');
    if(sheet){
      sheet.classList.remove('compact');            // 저장본은 압축하지 않는다
      sheet.style.border = 'none';
      sheet.style.padding = '0';
      sheet.style.overflow = 'visible';             // 가로 스크롤 구간까지 전부
      sheet.style.background = '#ffffff';
    }
    const board = holder.querySelector('.tv-board');
    if(board) board.style.minWidth = '0';
    document.body.appendChild(holder);

    let canvas;
    try {
      await new Promise(r=>setTimeout(r, 80));      // 글꼴·배치가 자리잡을 시간
      const W = EXP_W, H = Math.max(holder.scrollHeight, holder.offsetHeight);
      canvas = await window.html2canvas(holder, {
        scale: 2, backgroundColor:'#ffffff', useCORS:true, logging:false,
        width: W, height: H, windowWidth: W, scrollX: 0, scrollY: 0
      });
    } finally { holder.remove(); }

    const base = (document.title.split(' · ')[0] || '완성시간표');
    const filename = `${base}_${String(t.label||'').replace(/[\\/:*?"<>|]/g,'')}.png`;
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    if(isMobile && navigator.canShare){
      try {
        const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
        const file = new File([blob], filename, {type:'image/png'});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      } catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ alert('이미지 저장 실패: '+(e.message||'')); }
  finally { if(btn){ btn.disabled = false; btn.textContent = orig; } }
};
</script>

<script>
/* 학부모 사이트에서 넘어온 경우(pfrom=daniel|jihyebit) 맨 위에 «학부모 홈으로» 복귀 바 */
(function(){
  try{
    var p = new URLSearchParams(location.search).get('pfrom');
    if(p!=='daniel' && p!=='jihyebit') return;
    var col = p==='jihyebit' ? '#5E4B8B' : '#0C2A44';
    var bar = document.createElement('a');
    bar.href = 'https://artist4rhythm-hub.github.io/daniel-parents/home-'+p+'.html';
    bar.textContent = '← 학부모 홈으로 돌아가기';
    bar.style.cssText = 'position:sticky;top:0;z-index:9999;display:block;background:'+col+
      ';color:#fff;text-align:center;padding:11px 14px;font-size:13.5px;font-weight:800;text-decoration:none;font-family:inherit';
    document.body.insertBefore(bar, document.body.firstChild);
  }catch(e){}
})();
</script>
