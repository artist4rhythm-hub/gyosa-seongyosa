<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 보관본 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
:root{--g:#00704A;--gd:#1E3932;--ink:#1F2320;--ink2:#5A6560;--line:#E3E1DA;--bg:#F2F0EB;--wh:#fff;--warn:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.bar-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar h1{font-size:17px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
.bar h1 small{font-size:12px;font-weight:600;opacity:.8}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lbl{font-size:12px;font-weight:800;opacity:.85;min-width:48px}
.chip{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:100px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{background:#fff;color:var(--gd);border-color:#fff}
.chip:focus-visible,.go:focus-visible,.save:focus-visible,input:focus-visible{outline:3px solid #9FE2C3;outline-offset:2px}
input[type=date]{border:0;border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit}
.ck{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.ck input{accent-color:#7FD1AE;width:15px;height:15px}
.later{font-size:11.5px;opacity:.75}
.go,.save{border:0;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit}
.go{background:#7FD1AE;color:var(--gd)}.save{background:#fff;color:var(--gd)}
.go:disabled,.save:disabled{opacity:.45;cursor:not-allowed}
.st{font-size:12.5px;font-weight:700;opacity:.9}
.msg{max-width:560px;margin:60px auto;background:var(--wh);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;line-height:1.7}
.msg a{color:var(--g);font-weight:800}
.wrap{padding:20px 12px 60px}
.arc-doc{max-width:210mm;margin:0 auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:14mm 13mm;min-height:200px;overflow-x:auto}
.ask{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.ask button{border:0;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.ask .y{background:#7FD1AE;color:var(--gd)}.ask .n{background:rgba(255,255,255,.18);color:#fff}
.arc-doc:empty::before{content:'기간과 항목을 고르고 «만들기»를 누르세요.';display:block;text-align:center;color:var(--ink2);padding:40px 0}
.hint{max-width:210mm;margin:0 auto 10px;font-size:12px;color:var(--ink2);line-height:1.6}
@media (max-width:640px){ .arc-doc{padding:16px 12px} .bar{position:static} }
@media print{
  html,body{background:#fff}
  .bar,.hint,.msg{display:none!important}
  .wrap{padding:0}
  .arc-doc{max-width:none;box-shadow:none;padding:0;margin:0;overflow:visible}
}
</style>
<style id="arc-css"></style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <h1>📦 PDF 보관본 <small>기간 · 항목을 고르고 만들기 → PDF로 저장</small></h1>
    <div class="row" role="group" aria-label="기간">
      <span class="lbl">기간</span>
      <button type="button" class="chip" data-pre="lw">지난주</button>
      <button type="button" class="chip" data-pre="tw">이번 주</button>
      <button type="button" class="chip" data-pre="lm">지난달</button>
      <button type="button" class="chip" data-pre="tm">이번 달</button>
      <input type="date" id="from" aria-label="시작 날짜"> ~ <input type="date" id="to" aria-label="끝 날짜">
    </div>
    <div class="row" role="group" aria-label="기관">
      <span class="lbl">기관</span>
      <span id="orgs"></span>
    </div>
    <div class="row" role="group" aria-label="NAS 폴더별 묶음">
      <span class="lbl">묶음</span>
      <span id="packs"></span>
    </div>
    <div class="row" id="secs" role="group" aria-label="항목"><span class="lbl">항목</span></div>
    <div class="row later" id="later"></div>
    <div class="row">
      <button type="button" class="go" id="go">만들기</button>
      <button type="button" class="save" id="save" disabled>PDF로 저장</button>
      <span class="st" id="st" role="status" aria-live="polite"></span>
    </div>
  </div>
</div>
<div id="gate" class="msg" hidden></div>
<div class="wrap" id="wrap" hidden>
  <p class="hint" id="hint">인쇄 창에서 «대상»을 «PDF로 저장»으로 고르세요. 파일 이름은 기간 · 묶음으로 자동으로 붙어요. 볼 사람이 다른 자료(주임 회의록 · 경비)는 묶음별로 따로 만들어 NAS의 그 폴더에 넣어 주세요.</p>
  <div class="arc-doc" id="doc"></div>
</div>

<script src="filename.js"></script>
<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, initializeFirestore, doc, getDoc, collection, getDocs, query, where, addDoc, Timestamp, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import * as A from './archive-core.js?v=195';

const $I = id => document.getElementById(id);
const esc = A.esc;
const P = new URLSearchParams(location.search);
document.getElementById('arc-css').textContent = A.ARC_CSS;

/* ── 기간 고르기 ── */
const today = () => new Date();
const ymd = A.ymd;
const monday = d => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; };
function preset(k){
  const t = today();
  if(k === 'lw'){ const m = monday(t); m.setDate(m.getDate() - 7); const s = new Date(m); s.setDate(s.getDate() + 6); return [ymd(m), ymd(s)]; }
  if(k === 'tw'){ return [ymd(monday(t)), ymd(t)]; }
  if(k === 'lm'){ const a = new Date(t.getFullYear(), t.getMonth() - 1, 1), b = new Date(t.getFullYear(), t.getMonth(), 0); return [ymd(a), ymd(b)]; }
  if(k === 'tm'){ return [ymd(new Date(t.getFullYear(), t.getMonth(), 1)), ymd(t)]; }
  return null;
}
const isD = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
let PACK = '', ORG = '';
function markOrg(){ document.querySelectorAll('[data-org]').forEach(b => { const on = b.dataset.org === ORG; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); }
function markPre(){
  const f = $I('from').value, t = $I('to').value;
  document.querySelectorAll('[data-pre]').forEach(b => { const r = preset(b.dataset.pre); const on = !!r && r[0] === f && r[1] === t; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
function setRange(f, t){ $I('from').value = f; $I('to').value = t; markPre(); dirty(); }
function picked(){ return [...document.querySelectorAll('#secs input:checked')].map(i => i.value); }
function markPacks(){
  const cur = picked().slice().sort().join(',');
  PACK = '';
  document.querySelectorAll('[data-pack]').forEach(b => { const p = A.PACKS.find(x => x.k === b.dataset.pack); const on = p.s.slice().sort().join(',') === cur; if(on) PACK = p.k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
let BUILT = null;
function dirty(){ BUILT = null; $I('save').disabled = true; }

let UI_DONE = false;
function initUI(){
  if(UI_DONE) return; UI_DONE = true;   // 로그인이 다시 확인돼도 단추를 두 번 만들지 않게
  $I('orgs').innerHTML = A.ORG_PICK.map(o => `<button type="button" class="chip" data-org="${o.k}" aria-pressed="false">${esc(o.l)}</button>`).join(' ');
  ORG = A.ORG_PICK.some(o => o.k === P.get('org')) ? P.get('org') : '';
  markOrg();
  document.querySelectorAll('[data-org]').forEach(b => b.addEventListener('click', () => { ORG = b.dataset.org; markOrg(); dirty(); }));
  $I('packs').innerHTML = A.PACKS.map(p => `<button type="button" class="chip" data-pack="${p.k}" aria-pressed="false">${esc(p.l)}</button>`).join(' ');
  $I('secs').insertAdjacentHTML('beforeend', A.SECTIONS.map(s => `<label class="ck" title="${esc(s.d)}"><input type="checkbox" value="${s.k}"> ${esc(s.l)}</label>`).join(''));
  $I('later').innerHTML = `<span class="lbl"></span>다음 업데이트에서 더해요 — ${A.LATER.map(esc).join(' · ')}`;
  /* 처음 값 — 주소에 있으면 그것 (관리자 화면의 단추) · 없으면 지난주 · 교직원용 */
  const f = P.get('from'), t = P.get('to');
  if(isD(f) && isD(t)) setRange(f, t); else { const r = preset('lw'); setRange(r[0], r[1]); }
  const want = (P.get('s') || '').split(',').filter(k => A.SECTIONS.some(s => s.k === k));
  const pk = A.PACKS.find(p => p.k === P.get('pack'));
  const on = want.length ? want : (pk ? pk.s : A.PACKS[0].s);
  document.querySelectorAll('#secs input').forEach(i => { i.checked = on.includes(i.value); });
  markPacks();
  document.querySelectorAll('[data-pre]').forEach(b => b.addEventListener('click', () => { const r = preset(b.dataset.pre); setRange(r[0], r[1]); }));
  document.querySelectorAll('[data-pack]').forEach(b => b.addEventListener('click', () => {
    const p = A.PACKS.find(x => x.k === b.dataset.pack);
    document.querySelectorAll('#secs input').forEach(i => { i.checked = p.s.includes(i.value); });
    markPacks(); dirty();
  }));
  $I('secs').addEventListener('change', () => { markPacks(); dirty(); });
  ['from', 'to'].forEach(id => $I(id).addEventListener('change', () => { markPre(); dirty(); }));
  $I('go').addEventListener('click', run);
  $I('save').addEventListener('click', save);
}

/* ── 읽기 창구 (로그인한 수퍼관리자) ── */
function clientSrc(db){
  const val = v => v instanceof Date ? Timestamp.fromDate(v) : v;
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    async query(col, conds){
      const cs = (conds || []).map(([f, op, v]) => where(f, op, val(v)));
      return rows(await getDocs(cs.length ? query(collection(db, col), ...cs) : collection(db, col)));
    },
    async get(col, id){ const s = await getDoc(doc(db, col, id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    async sub(path){ return rows(await getDocs(collection(db, ...path))); },
  };
}

let SRC = null, CU = null, DB = null, RUNNING = false;
async function run(){
  if(RUNNING || !SRC) return;
  const f = $I('from').value, t = $I('to').value, s = picked();
  const st = $I('st');
  if(!isD(f) || !isD(t) || f > t){ st.textContent = '⚠️ 기간을 확인해 주세요'; return; }
  if(!s.length){ st.textContent = '⚠️ 항목을 하나 이상 골라 주세요'; return; }
  RUNNING = true; $I('go').disabled = true; $I('save').disabled = true; BUILT = null;
  $I('doc').innerHTML = '';
  try{
    const out = await A.buildArchive(SRC, { from: f, to: t, sections: s, org: ORG, by: CU ? CU.name : '', auto: !CU }, m => { st.textContent = m; });
    $I('doc').innerHTML = out.html;
    await waitImages($I('doc'));
    BUILT = { from: f, to: t, sections: s, out, pack: PACK, org: ORG };
    const bad = out.sections.filter(x => x.err || (x.warn || []).length);
    st.textContent = `✓ 다 만들었어요 — ${out.sections.map(x => `${x.l} ${x.err ? '읽지 못함' : x.count + '건'}`).join(' · ')}`;
    if(bad.length) st.textContent += ` · ⚠️ ${bad.map(x => x.err ? x.l + ' 읽지 못함' : x.l + ': ' + x.warn.join(', ')).join(' / ')}`;
    $I('save').disabled = false;
  }catch(e){
    st.textContent = '⚠️ ' + (e.message || e);
  }finally{ RUNNING = false; $I('go').disabled = false; }
  return BUILT;
}
async function waitImages(root){
  try{ await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); }catch(e){}
  await Promise.all([...root.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 5000); })));
}
function fileName(b){
  const pk = A.PACKS.find(p => p.k === b.pack);
  const og = A.ORG_PICK.find(o => o.k === b.org && o.k);
  const same = b.from.slice(0, 4) === b.to.slice(0, 4);
  return ['교사선교사', '보관본', pk ? pk.l : '', og ? og.l : '', `${b.from}~${same ? b.to.slice(5) : b.to}`];
}
function save(){
  if(!BUILT) return;
  const b = BUILT;
  if(window.FN) FN.printAs(fileName(b)); else window.print();
  if(!CU || !DB) return;
  /* 인쇄 창을 닫은 뒤 — 정말 저장했을 때만 «지난 백업»에 남긴다 */
  const st = $I('st');
  st.innerHTML = `<span class="ask">PDF로 저장했어요? <button type="button" class="y" id="ask-y">네, 저장했어요</button><button type="button" class="n" id="ask-n">아니요</button></span>`;
  $I('ask-y').onclick = () => { st.textContent = '기록하는 중…'; record(b).then(ok => { st.textContent = ok ? '✓ «지난 백업»에 남겼어요 — NAS 보관함 폴더에 넣어 주세요' : '✓ 저장했어요 (지난 백업 기록은 보안 규칙 v53을 게시한 뒤부터 남아요)'; }); };
  $I('ask-n').onclick = () => { st.textContent = '저장하지 않았어요 — 다시 «PDF로 저장»을 누르면 돼요'; };
  $I('ask-y').focus();
}
async function record(b){
  const counts = {}; b.out.sections.forEach(x => { counts[x.k] = x.err ? -1 : x.count; });
  const og = A.ORG_PICK.find(o => o.k === b.org && o.k);
  try{ await addDoc(collection(DB, 'activityLogs'), { uid: CU.uid, name: CU.name || '', role: CU.role || '', org: CU.org || '', action: '보관본', category: '백업',
    target: `${b.from}~${b.to}${og ? ' · ' + og.l : ''}`, detail: b.out.sections.map(x => `${x.l} ${x.err ? '읽지 못함' : x.count + '건'}`).join(' · '), at: Timestamp.now() }); }catch(e){}
  try{ await addDoc(collection(DB, 'backupRuns'), { kind: 'pdf', mode: 'manual', uid: CU.uid, name: CU.name || '', at: serverTimestamp(),
    from: b.from, to: b.to, sections: b.sections, counts, org: b.org || '' }); return true; }catch(e){ console.warn('backupRuns', e && e.code); return false; }
}

/* ── 들어오기 ── */
function gate(html){ $I('gate').innerHTML = html; $I('gate').hidden = false; $I('bar').hidden = true; $I('wrap').hidden = true; }
function openUI(){ $I('gate').hidden = true; $I('bar').hidden = false; $I('wrap').hidden = false; }

/* 🤖 자동 백업(다음 단계) — 서버가 자료 창구를 넣어 준 때에만 (Firestore 는 건드리지 않는다) */
if(P.get('job') === '1' && window.__ARCHIVE_SRC__){
  SRC = window.__ARCHIVE_SRC__;
  initUI(); openUI();
  run().then(b => { window.__ARCHIVE_RESULT__ = b ? { sections: b.out.sections, made: b.out.made, name: window.FN ? FN.make(fileName(b)) : '' } : { error: $I('st').textContent };
    document.documentElement.dataset.arcDone = '1'; });
} else {
  const __cfg = ({
    apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
    authDomain: "daniel-amatz.firebaseapp.com",
    projectId: "daniel-amatz",
    storageBucket: "daniel-amatz.firebasestorage.app",
    messagingSenderId: "455744290312",
    appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
  });
  const app = getApps().length ? getApp() : initializeApp(__cfg);
  const auth = getAuth(app);
  DB = (() => { try{ return initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); }catch(e){ return getFirestore(app); } })();
  onAuthStateChanged(auth, async user => {
    if(!user){ gate('🔒 로그인이 필요해요.<br><a href="index.html">교사 선교사에 로그인</a>한 뒤 관리자 › 통합관리 › 백업에서 다시 열어 주세요.'); return; }
    try{
      const s = await getDoc(doc(DB, 'staff', user.uid));
      if(!s.exists()){ gate('교직원 계정으로 로그인해 주세요.'); return; }
      CU = { uid: user.uid, ...s.data() };
      if(CU.role !== 'super'){ gate('📦 PDF 보관본은 수퍼관리자만 만들 수 있어요.<br><a href="index.html">홈으로</a>'); return; }
      SRC = clientSrc(DB);
      initUI(); openUI();
      if(P.get('go') === '1') run();
    }catch(e){ gate('불러오지 못했어요 — ' + esc(e.message || e)); }
  });
}
</script>
</body>
</html>
