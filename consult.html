<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 상담 · 교사 선교사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="loading.js"></script>
<style>
/* ═══ 📅 학부모 상담 스케줄 (v149) — 다니엘 아마츠 · 상담 기간 · 반별 · 형제 이어서 · 교직원 자녀 뒤로 · 변경 요청 · 확정 ═══ */
#cs{width:100%;max-width:var(--page-wide,1440px);margin:0 auto;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);padding-bottom:90px;word-break:keep-all;overflow-wrap:anywhere}
#cs *{box-sizing:border-box}
.cs-btn{font-family:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:0 14px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;line-height:1}
.cs-btn:hover{border-color:var(--sb-green)}
.cs-btn.p{background:var(--sb-house);border-color:var(--sb-house);color:#fff}
.cs-btn.g{background:var(--sb-green);border-color:var(--sb-green);color:#fff}
.cs-btn.m{background:var(--sb-mint-2);border-color:#9CCBB6;color:var(--sb-green)}
.cs-btn.w{background:#FEF3C7;border-color:#F3D58A;color:#7A4B00}
.cs-btn.r{background:var(--danger-bg);border-color:#F1C0BA;color:var(--danger)}
.cs-btn.sm{height:30px;font-size:12px;padding:0 10px;border-radius:8px}
.cs-btn.xs{height:26px;font-size:11.5px;padding:0 8px;border-radius:7px}
.cs-btn:disabled{opacity:.45;cursor:default}
.cs-in,.cs-sel,.cs-ta{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 11px;height:38px}
.cs-ta{height:auto;min-height:80px;padding:9px 11px;line-height:1.6;resize:vertical;width:100%}
.cs-in:focus,.cs-sel:focus,.cs-ta:focus{outline:none;border-color:var(--sb-green)}
.cs-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.cs-desc{font-size:12.5px;color:var(--ink-2);line-height:1.65}
.cs-mut{font-size:12px;color:var(--ink-2)}
.cs-empty{color:var(--ink-2);text-align:center;padding:34px 14px;font-size:13.5px;line-height:1.8}
.ch{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 8px;white-space:nowrap;background:#F3F2EE;color:#3E4944}
.ch.mint{background:var(--sb-mint-2);color:var(--sb-green)}.ch.warn{background:#FEF3C7;color:#7A4B00}.ch.red{background:#FDE7D8;color:#9A3412}
.ch.blue{background:#EEF4FF;color:#1D4ED8}.ch.ok{background:#E7F7EE;color:#15803D}.ch.dark{background:var(--sb-house);color:#fff}
/* 머리 */
.cs-head{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.cs-head .bc{font-size:12px;color:var(--ink-2);font-weight:700}
.cs-head .tt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.cs-head h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cs-head h1 small{font-size:13px;color:var(--ink-2);font-weight:700}
.cs-head .rt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs-tabs{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.cs-tab{font-family:inherit;height:38px;padding:0 15px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.cs-tab:hover{background:var(--sb-mint-2);color:var(--ink)}
.cs-tab.on{background:var(--sb-house);color:#fff}
.cs-tab .n{display:inline-block;min-width:18px;padding:1px 6px;border-radius:9px;background:#C2410C;color:#fff;font-size:11px;text-align:center}
/* 단계 띠 */
.cs-steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}
.cs-step{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink-2)}
.cs-step .no{width:22px;height:22px;border-radius:11px;border:1.5px solid #93A09A;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.cs-step.dn{background:var(--sb-mint-2);color:var(--sb-green)}.cs-step.dn .no{background:var(--sb-green);border-color:var(--sb-green);color:#fff}
.cs-step.on{background:var(--sb-house);color:#fff}.cs-step.on .no{background:#fff;border-color:#fff;color:var(--sb-house)}
.cs-steps .dash{color:#93A09A}
.cs-steps .sp{flex:1 1 10px}
/* 도구 줄 */
.cs-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.cs-tools .sp{flex:1 1 10px}
.cs-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cs-seg button{font-family:inherit;height:36px;padding:0 14px;border:0;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:800;cursor:pointer}
.cs-seg button+button{border-left:1px solid var(--line)}
.cs-seg button.on{background:var(--sb-green);color:#fff}
.cs-legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;color:var(--ink-2);margin:2px 0 10px}
.cs-legend .sw{display:inline-block;width:18px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:4px}
/* 편성 보드 */
.cs-main{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cs-boardw{flex:999 1 760px;min-width:0}
.cs-side{flex:1 1 300px;min-width:270px;max-width:370px;display:flex;flex-direction:column;gap:12px}
.cs-board{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cs-scroll{overflow-x:auto}
.cs-grid{min-width:var(--cs-minw,900px)}
.cs-row{display:grid;grid-template-columns:var(--cs-tc,104px) repeat(var(--cs-n,8),minmax(var(--cs-cw,92px),1fr));border-bottom:1px solid var(--line-soft)}
.cs-row.hd{background:var(--sb-mint-2);border-bottom:1px solid var(--sb-mint)}
.cs-row.hd>div{padding:8px 6px;text-align:center;border-left:1px solid var(--sb-mint)}
.cs-row.hd>div:first-child{border-left:0;text-align:left;padding-left:12px;display:flex;align-items:center;font-size:12px;font-weight:900;color:var(--ink-2)}
.cs-ch .g{font-size:12.5px;font-weight:900}.cs-ch .g span{font-weight:700;color:var(--ink-2)}
.cs-ch .t{font-size:12px;font-weight:800;color:var(--sb-green);margin-top:2px}
.cs-ch .r{font-size:11px;color:var(--ink-2);word-break:keep-all}.cs-ch .r .nw{white-space:nowrap}
.cs-ch.me{background:#FFF7E6}
.cs-day{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#F7F6F2;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
html[data-theme="dark"] .cs-day{background:var(--panel)}
.cs-day b{font-size:14px;font-weight:900}.cs-day span{font-size:12px;color:var(--ink-2)}
.cs-tm{padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
.cs-tm b{font-size:12px;font-weight:900;color:var(--ink-2)}.cs-tm span{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cs-cell{padding:4px;border-left:1px solid var(--line-soft);min-height:48px;display:flex;position:relative}
.cs-row.z{background:#FCFBF8}
html[data-theme="dark"] .cs-row.z{background:transparent}
.cs-cell.off{background:repeating-linear-gradient(135deg,#F1EFE9 0 5px,transparent 5px 10px)}
.cs-cell.me{background:rgba(255,247,230,.55)}
.cs-cell.can{box-shadow:inset 0 0 0 2px #9CCBB6;border-radius:8px}
.cs-cell.over{background:var(--sb-mint-2);box-shadow:inset 0 0 0 2px var(--sb-green)}
.cs-cell.no{opacity:.55}
.cs-chip{flex:1;min-width:0;font-family:inherit;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;position:relative;text-align:center}
.cs-chip:hover{border-color:var(--sb-green)}
.cs-chip .n{font-size:13px;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cs-chip .sub{font-size:10.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cs-chip .pin,.cs-chip .memo{position:absolute;top:3px;font-size:10px;line-height:1}
.cs-chip .pin{right:4px}.cs-chip .memo{left:4px;color:#B45309}
.cs-chip.kid{border:1.5px dashed var(--sb-green)}
.cs-chip.sel{box-shadow:0 0 0 2px var(--cs-fg,#1F2320)}
.cs-chip.hl{box-shadow:0 0 0 3px #D97706}
.cs-chip.dim{opacity:.35}
.cs-chip.moving{opacity:.45;border:2px dashed #D97706}
.cs-chip.err{border:2px solid #DC2626}.cs-chip.warn{border:2px solid #D97706}
.cs-chip.ro{cursor:pointer}
.cs-vac{flex:1;border-radius:8px;border:1.5px dashed #B9B5AA;background:repeating-linear-gradient(135deg,#F7F6F2 0 6px,transparent 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);font-weight:700}
.cs-etc{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:12px;font-weight:900;color:var(--ink-2)}
.cs-cell.etc{min-height:44px;flex-direction:column;gap:4px}
.cs-cell.etc .cs-chip{flex:none;width:100%}
.cs-chip .ptm{font-size:10.5px;font-weight:900;font-variant-numeric:tabular-nums}.cs-chip .ptm.no{color:#C2410C}
/* 날짜별 · 가정별 */
.cs-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.cs-dtab{font-family:inherit;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--ink)}
.cs-dtab.on{border:2px solid var(--sb-green);background:var(--sb-mint-2)}
.cs-dtab b{font-size:15px}.cs-dtab span{font-size:12px;color:var(--ink-2)}
.cs-bar{display:block;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}.cs-bar i{display:block;height:100%;background:#4E9C7A}
.cs-big .cs-cell{min-height:80px}
.cs-big .cs-chip{align-items:flex-start;text-align:left;padding:8px 10px;gap:3px}
.cs-big .cs-chip .n{font-size:14px}
.cs-big .cs-chip .ln{font-size:11px;font-weight:600;color:var(--ink-2);white-space:normal;text-align:left}
.cs-fam{display:grid;grid-template-columns:44px 200px 140px repeat(var(--cs-dn,3),minmax(260px,1fr)) 120px;border-bottom:1px solid var(--line-soft);align-items:stretch}
.cs-fam.hd{background:var(--sb-mint-2);font-size:12px;font-weight:900;color:var(--ink-2)}
.cs-fam>div{padding:8px 10px}
.cs-fam .tl{display:grid;grid-template-columns:repeat(var(--cs-sn,5),minmax(0,1fr));padding:6px 4px;border-left:1px solid var(--line-soft)}
.cs-fam .sl{height:42px;padding:0 1px;display:flex}
.cs-fam .sl.busy{background:repeating-linear-gradient(135deg,#ECEAE3 0 5px,transparent 5px 10px)}
.cs-fam .sl.over{background:var(--sb-mint-2);box-shadow:inset 0 0 0 2px var(--sb-green)}
.cs-fam .blk{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;cursor:grab;border:1px solid transparent}
.cs-fam .blk small{font-size:10px;font-weight:700}
.cs-fam.warn{background:#FFFBF0}
/* 옆 칸 */
.cs-side h3{margin:0 0 8px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px;justify-content:space-between}
.cs-iss{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;align-items:baseline}
.cs-nt .cs-iss > .cs-mut{white-space:nowrap;flex:none}
.cs-iss:hover{background:var(--sb-mint-2)}
.cs-iss.warn{background:#FFF7E6}.cs-iss.err{background:#FEECEC}
.cs-iss b.ok{color:var(--sb-green)}.cs-iss b.w{color:#92400E}.cs-iss b.e{color:#B42318}
.cs-isl{font-size:11.5px;color:#92400E;margin:-2px 0 4px;line-height:1.5}
.cs-pool{display:flex;flex-wrap:wrap;gap:6px}
.cs-pool .cs-chip{flex:none;min-width:84px}
.cs-fr{display:grid;grid-template-columns:96px 1fr;gap:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;background:#F7F6F2;margin-top:6px}
html[data-theme="dark"] .cs-fr{background:var(--panel)}
.cs-me{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 2px;border-top:1px solid var(--line-soft);font-size:13px}
.cs-me .t{font-weight:900;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;align-self:start;padding-top:1px}
.cs-me .w{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.45}
.cs-me .w b{font-size:13.5px}
.cs-me .w .s{font-size:11.5px;color:var(--ink-2);overflow-wrap:anywhere}
.cs-me .mk{display:inline-block;font-size:11px;font-weight:900;border-radius:4px;padding:0 4px;margin-left:2px}
.cs-me .cs-btn,.cs-me .ch{white-space:nowrap}
/* 담임 «우리 반» — 넓게 (판 옆 · 좁으면 판 위에 가득) */
.cs-main{container:csmain / inline-size}
.cs-main.tch .cs-side{flex:1 1 460px;min-width:400px;max-width:none}
.cs-mel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:4px 22px}
.cs-meg .gh{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:5px 8px;border-radius:7px;background:var(--sb-mint-2);font-size:12.5px;color:var(--sb-green)}
.cs-meg .gh span{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.cs-meg .gh + .cs-me{border-top:0}
@container csmain (max-width: 1250px){ .cs-main.tch .cs-side{order:-1;flex-basis:100%} }
/* 준비 */
.cs-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.cs-sec h2{margin:0;font-size:16.5px;font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cs-sec h2 .no{width:28px;height:28px;border-radius:9px;background:var(--sb-mint-2);color:var(--sb-green);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.cs-sec h2 small{font-size:12.5px;color:var(--ink-2);font-weight:600}
.cs-jump{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.cs-fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--ink-2)}
.cs-flr{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.cs-dc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cs-dcard{border-radius:10px;border:1px solid #9CCBB6;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cs-dcard.off{border-color:var(--line);background:#F7F6F2;opacity:.75}
.cs-tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cs-tr{display:grid;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-soft);font-size:13px}
.cs-tr.hd{background:var(--sb-mint-2);font-size:12px;font-weight:900;color:var(--ink-2);border-top:0}
.cs-tr.col{grid-template-columns:30px minmax(150px,1.2fr) minmax(130px,1fr) minmax(150px,1.2fr) minmax(140px,1.4fr) 64px}
.cs-tr.chk{grid-template-columns:minmax(150px,1fr) minmax(0,2.2fr) 190px}
.cs-pick{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;justify-self:end}
.cs-pick button{font-family:inherit;height:32px;padding:0 13px;border:0;background:var(--surface);font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.cs-pick button+button{border-left:1px solid var(--line)}
.cs-pick button.in{background:var(--sb-green);color:#fff}.cs-pick button.out{background:#3E4944;color:#fff}
.cs-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cs-sum>div{border-radius:10px;background:#F7F6F2;padding:10px 14px}
html[data-theme="dark"] .cs-sum>div{background:var(--panel)}
.cs-sum b{display:block;font-size:24px;font-weight:900}.cs-sum span{font-size:12px;font-weight:800;color:var(--ink-2)}
.cs-sum .g{background:var(--sb-mint-2)}.cs-sum .g span{color:var(--sb-green)}.cs-sum .w{background:#FEF3C7}.cs-sum .w span{color:#7A4B00}
.cs-radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;cursor:pointer;line-height:1.55}
.cs-radio.on{border:2px solid var(--sb-green);background:var(--sb-mint-2)}
.cs-radio input{margin-top:3px;accent-color:var(--sb-green)}
.cs-ord{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cs-ordc{font-family:inherit;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--ink)}
.cs-ordc.on{border:2px solid var(--sb-green);background:var(--sb-mint-2)}
.cs-ordc b{font-size:14px}.cs-ordc span{font-size:12px;color:var(--ink-2);line-height:1.5}
.ck{display:inline-flex;gap:7px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--sb-green)}
.cs-offg{display:grid;gap:3px}
.cs-offg button{font-family:inherit;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.cs-offg button.on{background:#FEF3C7;border-color:#F3D58A;color:#7A4B00}
/* 변경 요청 */
.cs-rq{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cs-rql{flex:1 1 360px;max-width:460px;min-width:290px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cs-rqd{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px}
.cs-rqi{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:4px;cursor:pointer;border-left:3px solid transparent}
.cs-rqi:hover{background:var(--sb-mint-2)}
.cs-rqi.on{background:#F3FAF7;border-left-color:var(--sb-green)}
.cs-rqi .h{display:flex;align-items:center;gap:8px}.cs-rqi .h b{font-size:13.5px}.cs-rqi .h .at{margin-left:auto;font-size:11.5px;color:var(--ink-2)}
.cs-msg{display:flex;gap:10px}
.cs-av{width:34px;height:34px;border-radius:17px;background:var(--sb-mint-2);color:var(--sb-green);font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.cs-av.m{background:var(--sb-house);color:#fff}
.cs-bub{flex:1;border-radius:12px;background:#F7F6F2;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
html[data-theme="dark"] .cs-bub{background:var(--panel)}
.cs-bub .w{font-size:12px;color:var(--ink-2)}.cs-bub .w b{color:var(--ink)}
.cs-bub .tx{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.cs-spot{border-radius:12px;border:2px solid var(--sb-green);background:#F3FAF7;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

      const changed = !A.R || JSON.stringify(A.R) !== JSON.stringify(r);
      A.R = r;
      if(first){ first = false; res(); } else if(changed && !A.DRAG){ A.derive(); A.render(true); }
    }, err => { if(/permission/.test(err.code || '')) A.ruleMissing = true; if(first){ first = false; res(); } });
  });
  unReqs = onSnapshot(query(collection(db, 'consultReqs'), where('rid', '==', id)), snap => {
    A.REQS = []; snap.forEach(d => A.REQS.push(Object.assign({ id: d.id }, d.data())));
    A.REQS.sort((a, b) => ((b.at && b.at.seconds) || 0) - ((a.at && a.at.seconds) || 0));
    if(!A.DRAG) A.render(true);
  }, () => {});
  A.derive();
};
function watchKids(){
  if(unKids) unKids();
  unKids = onSnapshot(collection(db, 'consultKids'), snap => {
    A.KIDDOCS = []; A.KIDS = {};
    snap.forEach(d => { const v = Object.assign({ uid: d.id }, d.data()); A.KIDDOCS.push(v); (v.kids || []).forEach(sid => { A.KIDS[sid] = d.id; }); });
    A.derive(); if(!A.DRAG) A.render(true);
  }, () => {});
}
function watchNotifs(){
  if(unNotif) unNotif();
  unNotif = onSnapshot(query(collection(db, 'consultNotifs'), where('toUid', '==', A.CU.uid), where('read', '==', false)), snap => {
    A.NOTIFS = []; snap.forEach(d => A.NOTIFS.push(Object.assign({ id: d.id }, d.data())));
    A.NOTIFS.sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));
    if(!A.DRAG) A.render(true);
  }, () => {});
}
A.readNotif = async n => { try{ await updateDoc(doc(db, 'consultNotifs', n.id), { read: true, readAt: serverTimestamp() }); }catch(e){} try{ window.refreshBadges && refreshBadges(); }catch(e){} };

/* ═══ 화면 ═══ */
const TABS = [
  { k: 'board', l: '🗓 이번 상담' }, { k: 'reqs', l: '💬 변경 요청' }, { k: 'kids', l: '🧑‍🏫 교직원 자녀' },
  { k: 'past', l: '🗂 지난 상담' }, { k: 'setup', l: '⚙️ 준비 · 설정', mgr: true },
];
A.go = h => { if(location.hash === '#' + h) route(true); else location.hash = h; };
function parseHash(){ const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'board'; const [v, ...rest] = h.split('/'); return { v, sub: rest.join('/') }; }
function headHTML(){
  const r = A.R;
  const opts = (r ? '' : '<option value="" selected>— 상담 고르기 —</option>') + A.ROUNDS.filter(x => x.state !== 'closed' || A.isMgr).map(x => `<option value="${esc(x.id)}"${r && r.id === x.id ? ' selected' : ''}>${esc(x.title || x.id)}${x.state === 'closed' ? ' · 끝남' : ''}</option>`).join('');
  const nReq = A.REQS.filter(q => q.state === 'new').length;
  return `<div class="cs-head">
    <div class="bc">학사 › 학부모 상담</div>
    <div class="tt"><h1>📅 학부모 상담 <small>${r ? esc(r.title || '') + ' · 다니엘 아마츠' : '다니엘 아마츠'}</small></h1>
      <div class="rt">${A.ROUNDS.length ? `<select class="cs-sel" id="cs-round" aria-label="상담 고르기" style="max-width:320px">${opts}</select>` : ''}
        ${A.isMgr ? '<button class="cs-btn g" data-act="newround">+ 새 상담 일정</button>' : ''}</div></div>
    <div class="cs-tabs" role="tablist">${TABS.filter(t => !t.mgr || A.isMgr).map(t => `<a class="cs-tab${A.VIEW === t.k ? ' on' : ''}" href="#${t.k}" role="tab" aria-selected="${A.VIEW === t.k}">${t.l}${t.k === 'reqs' && nReq ? ` <span class="n">${nReq}</span>` : ''}</a>`).join('')}</div>
  </div>${notifHTML()}`;
}
function notifHTML(){
  if(!A.NOTIFS.length) return '';
  return `<div class="cs-card cs-nt${A.NTOPEN ? ' open' : ''}" style="margin-bottom:12px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;gap:8px"><b style="font-size:13.5px">새 알림 ${A.NOTIFS.length}</b><span class="sp" style="flex:1"></span><button class="cs-btn xs" data-act="readall">모두 읽음</button></div>
    ${A.NOTIFS.slice(0, 5).map(n => `<button class="cs-iss" data-notif="${esc(n.id)}" style="border:0;background:transparent;font-family:inherit;text-align:left;width:calc(100% + 16px)"><span><b>${esc(n.title || '')}</b> ${esc(n.text || '')}</span><span class="cs-mut">${esc(n.fromName || '')}</span></button>`).join('')}
    ${A.NOTIFS.length > 2 ? `<span class="cs-ntm" data-act="ntmore" role="button" tabindex="0">알림 ${Math.min(5, A.NOTIFS.length) - 2}개 더 보기 ▾</span>` : ''}
  </div>`;
}
A.render = function(soft){
  const el = $I('cs'); if(!el) return;
  const y = scrollY;
  const keepScroll = soft && document.querySelector('.cs-scroll') ? [...document.querySelectorAll('.cs-scroll')].map(x => x.scrollLeft) : null;
  let body = '';
  if(A.ruleMissing) body = `<div class="cs-card cs-empty">🔐 학부모 상담 자료를 읽지 못했어요.<br>Firebase 콘솔 › Firestore › 규칙에 <b>보안 규칙 v41</b>을 게시해 주세요.</div>`;
  else if(A.VIEW === 'kids') body = REQ.kidsHTML(A);
  else if(A.VIEW === 'past') body = PAST.pastHTML(A, A.SUB);
  else if(!A.R) body = emptyHTML();
  else if(A.VIEW === 'setup' && A.isMgr) body = SETUP.setupHTML(A);
  else if(A.VIEW === 'reqs') body = REQ.reqsHTML(A, A.SUB);
  else body = BOARD.boardHTML(A, A.SUB);
  el.innerHTML = headHTML() + body;
  ['onclick', 'onchange', 'ondragstart', 'ondragover', 'ondragleave', 'ondrop', 'ondragend', 'oninput'].forEach(k => { el[k] = null; });
  if(A.VIEW === 'board' && A.R && !A.ruleMissing) BOARD.after(A);
  if(A.VIEW === 'setup' && A.R) SETUP.after(A);
  if(A.VIEW === 'reqs' && A.R) REQ.after(A);
  if(A.VIEW === 'past') PAST.after(A, A.SUB);
  if(A.VIEW === 'kids') REQ.afterKids(A);
  if(soft){ scrollTo(0, y); if(keepScroll) [...document.querySelectorAll('.cs-scroll')].forEach((x, i) => { if(keepScroll[i] != null) x.scrollLeft = keepScroll[i]; }); }
};
function emptyHTML(){
  if(A.isMgr) return `<div class="cs-card cs-empty" style="margin-top:12px">아직 만든 상담 일정이 없어요.<br>«<b>+ 새 상담 일정</b>»으로 학기 상담을 시작해 주세요 — 학사일정의 «상담» 날짜를 가져오고, 반편성의 반 · 담임으로 세로줄을 채워요.<br><br><button class="cs-btn g" data-act="newround">+ 새 상담 일정</button></div>`;
  return `<div class="cs-card cs-empty" style="margin-top:12px">아직 공지된 상담 일정이 없어요.<br>편성 담당 선생님이 «담임 확인»으로 보내면 여기에서 우리 반 시간을 볼 수 있어요.<br>지난 상담은 «🗂 지난 상담»에서 볼 수 있어요.</div>`;
}
async function route(soft){
  const h = parseHash();
  A.VIEW = TABS.some(t => t.k === h.v && (!t.mgr || A.isMgr)) ? h.v : 'board';
  A.SUB = h.sub || '';
  A.render(soft === true);
}
window.addEventListener('hashchange', () => route());
A.route = route;

/* ── 화면 전체의 누르기 ── */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-notif]');
  if(!t || !$I('cs').contains(t)) return;
  if(t.dataset.notif){ const n = A.NOTIFS.find(x => x.id === t.dataset.notif); if(n){ A.readNotif(n); if(n.reqId) A.go('reqs/' + n.reqId); else A.go('board'); } return; }
  const a = t.dataset.act;
  if(a === 'newround'){ SETUP.newRound(A); return; }
  if(a === 'readall'){ A.NOTIFS.forEach(n => A.readNotif(n)); return; }
  if(a === 'ntmore'){ A.NTOPEN = true; const c = t.closest('.cs-nt'); if(c) c.classList.add('open'); return; }
});
document.addEventListener('change', async e => {
  if(e.target.id === 'cs-round' && e.target.value){ window.showLoading && showLoading('상담을 여는 중…'); await A.useRound(e.target.value); window.hideLoading && hideLoading(); A.go('board'); route(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && A.MOVE){ BOARD.cancelMove(A); } });

/* ═══ 시작 ═══ */
function boot(){
  onAuthStateChanged(auth, async user => {
    if(!user){ window.hideLoading && hideLoading(); $I('ls').style.display = 'flex'; $I('ms').style.display = 'none'; return; }
    let st = null;
    try{ st = await getDoc(doc(db, 'staff', user.uid)); }catch(e){ st = null; }
    if(!st || !st.exists()){ $I('l-msg').textContent = '교사 계정이 아니에요 — 교사 아이디로 로그인해 주세요.'; $I('ls').style.display = 'flex'; window.hideLoading && hideLoading(); return; }
    A.CU = Object.assign({ uid: user.uid }, st.data());
    A.ACT = (A.CU.isTest && A.CU.cloneOf && A.CU.cloneOf.uid) || '';
    window.ORGS = { daniel: '다니엘 아마츠', jihyebit: '지혜빛 선교원' };
    if(window.renderShell) renderShell('consult', A.CU);
    if(window.guardPage && !guardPage(A.CU, 'consult')) return;
    window.fileNameContext = () => ['학부모상담', A.R ? (A.R.title || '') : ''];
    $I('ls').style.display = 'none'; $I('ms').style.display = 'block';
    if(!A.canOpen(A.CU)){
      $I('cs').innerHTML = `<div class="cs-empty" style="margin-top:30px">📅 학부모 상담은 <b>다니엘 아마츠</b> 선생님들이 쓰는 화면이에요.<br>다른 기관 선생님은 수퍼관리자가 <b>관리자 › 접근 권한</b>에서 열어 주면 볼 수 있어요.</div>`;
      window.hideLoading && hideLoading(); return;
    }
    try{
      try{ const m = await getDoc(doc(db, 'config', 'consultManagers')); A.MGRS = m.exists() ? (m.data().uids || []) : []; }catch(e){ A.MGRS = []; }
      const orgs = (A.CU.orgs && A.CU.orgs.length) ? A.CU.orgs : [A.CU.org];
      // 편성 담당 — 보안 규칙 csMgr 와 같게: 수퍼 · 다니엘 기관관리자 · 담당 명단(다니엘)
      A.isMgr = A.CU.role === 'super' || (orgs.includes('daniel') && (A.CU.role === 'org_admin' || A.MGRS.includes(A.CU.uid)));
      await Promise.all([loadStaff(), loadStudents(), loadClasses()]);
      try{ await A.loadRounds(); }
      catch(e){ if(/permission/.test(e.code || '')) A.ruleMissing = true; else throw e; }
      if(!A.ruleMissing){
        const saved = lsGet('cs_round', '');
        const open = A.ROUNDS.filter(r => r.state !== 'closed');
        const pick = A.ROUNDS.find(r => r.id === saved && (r.state !== 'closed')) || open[0] || null;
        if(pick) await A.useRound(pick.id);
        watchKids(); watchNotifs();
      }
    }catch(e){ A.toast('불러오지 못했어요 — ' + A.errText(e), 'err'); console.error(e); }
    await route();
    window.hideLoading && hideLoading();
  });
}
$I('l-go').onclick = async () => {
  const id = $I('l-id').value.trim(), pw = $I('l-pw').value, msg = $I('l-msg'); msg.textContent = '';
  try{ await signInWithEmailAndPassword(auth, `${id}@gyosa-seongyosa.staff`, pw); }
  catch(e){ msg.textContent = '로그인 실패 — 아이디나 비밀번호를 확인해 주세요.'; }
};
$I('l-pw').addEventListener('keydown', e => { if(e.key === 'Enter') $I('l-go').click(); });
boot();
