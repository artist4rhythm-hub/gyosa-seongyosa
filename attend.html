<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석부 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="출석부">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
:root {
  --gd:#1E3932; --gm:#00704A; --gl:#D4E9E2; --gp:#E8F3EF;
  --gold:#B08D3C; --goldd:#8A6410; --goldp:#F7EFD8;
  --iv:#F2F0EB; --ivd:#E3E1DA;
  --tx:#1F2320; --ts:#5A6560; --tl:#93A09A; --wh:#ffffff;
  --sh:0 2px 12px rgba(30,57,50,0.08); --r:12px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--iv);color:var(--tx);min-height:100vh;}

#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(150deg,#E8F3EF 0%,#F2F0EB 60%,#F7EFD8 100%);padding:24px;text-align:center;}
.gbox{background:var(--wh);border-radius:24px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(30,57,50,0.12);}
.gtitle{font-size:22px;font-weight:800;color:var(--gd);margin-bottom:8px;}
.gsub{font-size:14px;color:var(--ts);line-height:1.6;margin-bottom:20px;}
.gbtn{display:inline-block;width:100%;padding:14px;background:linear-gradient(135deg,#00704A,#1E3932);color:var(--wh);border:none;border-radius:var(--rs);font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;}

#ms{display:none;flex-direction:column;width:100%;}
.ah{display:none;}
.pg-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pg-link{padding:7px 14px;border-radius:8px;background:var(--wh);border:1px solid var(--ivd);color:var(--gm);font-size:13px;font-weight:600;text-decoration:none;}
.pg-link:hover{background:var(--gp);}
.ah{background:linear-gradient(135deg,#1E3932,#16302A);color:var(--wh);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.ahl{display:flex;align-items:center;gap:12px;}
.ahi{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.aht{font-size:16px;font-weight:700;}
.ahr{text-align:right;}
#hn{font-size:15px;font-weight:600;}
#hi{font-size:11px;opacity:.7;margin-top:2px;}
.homebtn{background:rgba(255,255,255,0.15);color:var(--wh);border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:4px;text-decoration:none;display:inline-block;}

/* 하위 탭 */
.subtb{display:flex;gap:4px;background:var(--wh);padding:8px 16px;border-bottom:1px solid var(--ivd);overflow-x:auto;}
.subtbtn{padding:8px 14px;background:transparent;border:none;border-radius:8px;font-size:14px;font-weight:600;color:var(--ts);cursor:pointer;white-space:nowrap;}
.subtbtn.active{background:var(--gp);color:var(--gm);}

.tc{padding:0;max-width:var(--page-dash,1680px);margin:0 auto;width:100%;}   /* v-112 넓은 화면 */
/* 넓은 화면 (v-112) — 일일 체크의 학생 줄을 두 명씩 나란히 (최대 두 명 · 칸이 500px 아래로 좁아지면 한 줄에 한 명) */
.ck-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(min(500px,100%),calc(50% - 14px)),1fr));column-gap:28px;}
.actitle{font-size:17px;font-weight:800;color:var(--gd);margin-bottom:6px;}
.adesc{font-size:13px;color:var(--ts);margin-bottom:14px;line-height:1.5;}
.acard{background:var(--wh);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px;}

.fgrp{display:flex;flex-direction:column;margin-bottom:12px;}
.fgrp label{font-size:12px;font-weight:700;color:var(--ts);margin-bottom:5px;}
.fgrp input,.fgrp select{height:40px;border:1.5px solid var(--ivd);border-radius:8px;padding:0 12px;font-size:14px;background:var(--iv);outline:none;width:100%;font-family:inherit;}

.bp{background:linear-gradient(135deg,#00704A,#1E3932);color:var(--wh);border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;}
.bs{background:var(--iv);color:var(--ts);border:1.5px solid var(--ivd);border-radius:8px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;}
.bm{background:var(--gp);color:var(--gm);border:none;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}

/* 출결 항목 목록 */
.typelist{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.typeitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--wh);border:1px solid var(--ivd);border-radius:10px;}
@media(max-width:640px){.typeitem{flex-wrap:wrap;row-gap:8px;}}   /* 폰 (v-112) — 버튼이 화면 밖으로 밀리지 않게 다음 줄로 */
.typedot{width:20px;height:20px;border-radius:50%;flex-shrink:0;}
.typename{font-size:15px;font-weight:700;color:var(--gd);flex:1;}
.typebadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;}
.typegrip{cursor:grab;color:var(--tl);font-size:15px;padding:0 2px;user-select:none}
.ga-org{margin-bottom:14px}
.ga-org:last-child{margin-bottom:0}
.ga-orgname{font-size:13px;font-weight:800;color:var(--gd);margin-bottom:7px}
.ga-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--ivd)}
.ga-row:last-child{border-bottom:none}
.ga-grade{flex:0 0 64px;font-size:13px;font-weight:800;color:var(--gm);padding-top:5px}
.ga-chips{display:flex;gap:5px;flex-wrap:wrap}
.ga-chip{font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;border:1.5px solid var(--ivd);border-radius:8px;background:var(--wh);color:var(--ts);cursor:pointer}
.ga-chip:hover{border-color:var(--gm)}
.ga-chip.on{background:var(--gm);border-color:var(--gm);color:#fff}
.ga-chip i{font-style:normal;font-size:10px;opacity:.8}

.empty{text-align:center;color:var(--tl);padding:30px;font-size:14px;}

.addrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px;}
.addrow .fgrp{margin-bottom:0;}

.mov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.mbk{position:absolute;inset:0;background:rgba(20,25,60,0.5);}
.mbox{position:relative;background:var(--wh);border-radius:16px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.mtitle{font-size:18px;font-weight:800;color:var(--gd);margin-bottom:4px;}
.msub{font-size:13px;color:var(--ts);margin-bottom:16px;}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gd);color:var(--wh);padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#dc2626;} .toast.ok{background:var(--gm);}
.ck-mode-btn{padding:9px 16px;border:1.5px solid var(--ivd);background:var(--wh);border-radius:9px;font-size:14px;font-weight:600;color:var(--ts);cursor:pointer;}
.ck-mode-btn.on{background:var(--gm);color:#fff;border-color:var(--gm);}
.mtab{border-collapse:collapse;font-size:12px;white-space:nowrap;}
.mtab th,.mtab td{border:1px solid var(--ivd);padding:0;text-align:center;}
.mtab .nm{position:sticky;left:0;background:var(--wh);z-index:2;text-align:left;padding:4px 8px;font-weight:600;min-width:80px;}
.mtab th.nm{z-index:3;background:var(--iv);}
.mtab .dcell{width:30px;height:30px;cursor:pointer;font-size:11px;font-weight:700;}
.mtab .dcell.blocked{background:var(--iv);color:#bbb;cursor:default;}
.mtab .dcell.blocked.allow{cursor:pointer;}
.mtab .dcell.drag-sel{outline:2px solid var(--gm);outline-offset:-2px;filter:brightness(0.92);}
.mtab .dcell.auto-present{font-weight:400;opacity:0.85;}
.mtab{user-select:none;}
.mtab .wkhd{background:var(--iv);color:#999;}
.mmenu{position:fixed;z-index:200;background:var(--wh);border:1px solid var(--ivd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.2);padding:6px;min-width:130px;max-height:300px;overflow-y:auto;}
.mmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:none;border-radius:10px;font-size:13px;cursor:pointer;text-align:left;}
.mmenu button:hover{background:var(--iv);}
.mmenu .sep{border-top:1px solid var(--ivd);margin:4px 0;font-size:11px;color:var(--tl);padding:4px 10px 2px;}
/* 🧺 v174 출석 체크 — 전체 범위 · 세 가지 보기 (명단형 · 타일형 · 가정별) */
.ckv{display:inline-flex;border:1.5px solid var(--ivd);border-radius:10px;overflow:hidden;height:40px;background:var(--wh)}
.ckv button{border:0;background:transparent;padding:0 14px;font:inherit;font-size:13px;font-weight:700;color:var(--ts);cursor:pointer}
.ckv button+button{border-left:1px solid var(--ivd)}
.ckv button.on{background:var(--gd);color:#fff}
.ck-sum{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ts);margin-bottom:12px}
.ck-st b{font-size:19px;margin-right:4px}
.ck-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;padding-top:12px;border-top:1px solid var(--ivd)}
.ck-tools input[type=search]{height:36px;border:1.5px solid var(--ivd);border-radius:10px;padding:0 12px;font:inherit;font-size:13px;width:210px;max-width:100%;background:var(--wh);color:var(--tx);outline:none}
.ck-tools label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--gd)}
.ck-tools label input{width:17px;height:17px;accent-color:var(--gm)}
.ck-jump{display:flex;gap:3px;flex-wrap:wrap}
.ck-jump button{width:30px;height:30px;border:1px solid var(--ivd);border-radius:8px;background:var(--wh);font:inherit;font-size:12.5px;font-weight:700;color:var(--gd);cursor:pointer;padding:0}
.ck-jump button:disabled{color:var(--ivd);cursor:default}
.ckg{font-size:13px;font-weight:800;color:var(--tl);padding:14px 2px 4px;border-bottom:2px solid var(--ivd);scroll-margin-top:70px}
.ck-main-card{padding-top:8px}
.ckr{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) minmax(140px,240px);gap:8px 14px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--ivd);scroll-margin-top:80px}
.ckr.ab{background:rgba(245,158,11,.06)}
.ckr.ch{box-shadow:inset 3px 0 0 var(--gold)}
@media(max-width:760px){.ckr{grid-template-columns:1fr}}
.ckr-n{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ckr-n b{font-size:15px;color:var(--gd)}
.ck-cls{font-size:11px;font-weight:700;color:var(--gm);background:var(--gp);border-radius:100px;padding:2px 8px;white-space:nowrap}
.ck-gr{font-size:10.5px;font-weight:700;color:var(--ts);background:var(--iv);border-radius:100px;padding:2px 7px}
.ck-sib{font-size:11px;font-weight:700;color:#8A6410;background:rgba(176,141,60,.16);border-radius:100px;padding:2px 8px}
.ckr-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.ck-ts{display:flex;gap:5px;flex-wrap:wrap}
.ckc{height:32px;padding:0 12px;border:1.5px solid var(--ivd);border-radius:8px;background:var(--wh);font:inherit;font-size:13px;font-weight:700;color:var(--ts);cursor:pointer}
.ckc:disabled{cursor:default;opacity:.7}
.ck-rs{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ck-rs.miss{background:var(--danger-bg);border-radius:8px;padding:4px 6px}
.ck-rs.miss .ck-rl{color:var(--danger);font-weight:700}
.ck-rl{font-size:11px;color:var(--tl);margin-right:2px}
.ckr-c{height:28px;padding:0 10px;border:1px dashed #C9CFCB;border-radius:8px;background:var(--wh);font:inherit;font-size:12px;font-weight:700;color:var(--ts);cursor:pointer}
.ckr-c.on{border-style:solid;border-color:var(--gd);background:var(--gd);color:#fff}
.ckr-c:disabled{cursor:default;opacity:.7}
.ck-sn{font-size:12px;font-weight:700;color:#8A6410;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ck-sn button{height:26px;padding:0 9px;border:1px solid rgba(176,141,60,.45);border-radius:8px;background:var(--wh);font:inherit;font-size:11.5px;font-weight:700;color:#8A6410;cursor:pointer}
.ckr-m{height:34px;border:1.5px solid var(--ivd);border-radius:10px;padding:0 10px;font:inherit;font-size:13px;background:var(--iv);width:100%;box-sizing:border-box;outline:none;color:var(--tx)}
.ck-tw{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ck-tiles{flex:999 1 520px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;align-content:start}
.ck-tiles .ckg{grid-column:1/-1}
.ckt{position:relative;min-height:74px;border:1.5px solid rgba(22,163,74,.35);border-radius:12px;background:rgba(22,163,74,.07);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#166534;padding:6px}
.ckt b{font-size:15px}
.ckt span{font-size:11px;font-weight:600;opacity:.92;text-align:center;line-height:1.3}
.ckt.sel{outline:3px solid var(--gd);outline-offset:2px}
.ckt.ch::after{content:'';position:absolute;left:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.ckt-sib{position:absolute;top:5px;right:6px;font-style:normal;font-size:9.5px;font-weight:800;color:#8A6410;background:#F7EFD8;border-radius:100px;padding:1px 6px}
.ck-panel{flex:1 1 320px;min-width:280px;position:sticky;top:70px;border:2px solid var(--gd);border-radius:12px;background:var(--wh);padding:16px;display:flex;flex-direction:column;gap:12px}
.ck-panel-hint{border-style:dashed;border-color:var(--ivd)}
@media(max-width:760px){.ck-panel{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:62vh;overflow:auto;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.25)}.ck-panel-hint{display:none}}
.ckf{border:1px solid var(--ivd);border-radius:12px;padding:6px 10px;margin-top:8px}
.ckf.multi{background:rgba(176,141,60,.06);border-color:rgba(176,141,60,.35)}
.ckf-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:800;color:#8A6410;padding:6px 0 2px}
.ckf-h>span:first-child{margin-right:6px}
.ckf-h button{height:28px;padding:0 10px;border:1px solid rgba(176,141,60,.45);border-radius:8px;background:var(--wh);font:inherit;font-size:12px;font-weight:700;color:#8A6410;cursor:pointer}
.ckf-h button.on{background:var(--gd);border-color:var(--gd);color:#fff}
.ckf .ckr:last-child{border-bottom:0}
.ck-savebar{position:sticky;bottom:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--wh);border-top:1px solid var(--ivd);padding:12px 20px;margin:-16px 0 16px;border-radius:0 0 var(--r) var(--r);box-shadow:0 -6px 16px rgba(30,57,50,.06)}
.ck-savebar .bp{margin-left:auto;min-width:160px}
.ck-sv-t{font-size:13px;color:var(--ts)}
.undo-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:990;background:var(--gd);color:#fff;border-radius:12px;padding:10px 12px 10px 18px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.undo-bar button{height:34px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.mtab th.mday:hover{background:var(--gp)}
/* 학생 한 명 기록 · 쉬는 날 기록 · 체험학습 기간 */
.nmb{font:inherit;font-weight:700;color:var(--gm);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.offb{font-size:10.5px;font-weight:800;color:#fff;background:var(--danger);border-radius:100px;padding:1px 7px;margin-left:5px;vertical-align:1px;cursor:pointer;border:0;font-family:inherit}
.srd{position:fixed;inset:0;z-index:940;display:flex;justify-content:flex-end}
.srd-bk{position:absolute;inset:0;background:rgba(20,25,30,.35)}
.srd-p{position:relative;width:min(560px,100vw);height:100%;background:var(--wh);box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
.srd-h{padding:18px 20px 12px;border-bottom:1px solid var(--ivd);display:flex;flex-direction:column;gap:10px}
.srd-b{flex:1;overflow:auto;padding:4px 20px 20px}
.srd-sum{display:flex;gap:8px;flex-wrap:wrap}
.srd-sum button{border:1.5px solid var(--ivd);border-radius:10px;padding:7px 11px;background:var(--wh);font:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:86px}
.srd-sum button b{font-size:18px}
.srd-sum button span{font-size:11px;color:var(--ts)}
.srd-sum button.on{border-color:var(--gd);background:var(--gp)}
.srec{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 2px;border-bottom:1px solid var(--ivd)}
.srec.off{background:rgba(220,38,38,.05)}
.srec-d{font-size:14px;font-weight:800;color:var(--tx)}
.srec-d small{display:block;font-size:11px;font-weight:500;color:var(--ts)}
.srec-tg{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;color:#fff;margin-right:4px}
.srec-w{font-size:11px;color:var(--tl);margin-top:4px}
.srec-a{display:flex;gap:4px}
.srec-a button{height:30px;padding:0 10px;border:1px solid var(--ivd);border-radius:8px;background:var(--wh);font:inherit;font-size:12px;font-weight:700;color:var(--gd);cursor:pointer}
.srec-a button.del{color:var(--danger);border-color:rgba(220,38,38,.3)}
.offday{border:1.5px solid var(--ivd);border-radius:12px;padding:10px 12px;margin-top:8px}
.offday.on{border-color:var(--danger);background:rgba(220,38,38,.04)}
.offday summary{cursor:pointer;font-size:12px;color:var(--ts);margin-top:6px}
.trip-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.trip-days div{border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;border:1.5px solid #0369a1;background:rgba(3,105,161,.08);color:#075985}
.trip-days div b{display:block;font-size:14px}
.trip-days div.skip{border-style:dashed;border-color:var(--ivd);background:var(--iv);color:var(--ts)}
</style>

<body>

<div id="gate">
  <div class="gbox">
    <div class="gtitle">출석부</div>
    <div class="gsub" id="gate-msg">로그인 확인 중...</div>
    <a class="gbtn" id="gate-btn" href="index.html" style="display:none">로그인 화면으로</a>
  </div>
</div>

<div id="ms">

// ── 학년 정렬 (4세→7세→1학년→12학년). 어디서나 공통 사용 ──
function gradeRank(g){
  if(!g) return 999;
  const first = String(g).split(/[·,]/)[0].trim(); // 합반이면 첫 학년 기준
  const age = first.match(/(\d+)\s*세/);
  if(age) return Number(age[1]);            // 4~7세 → 4~7
  const grd = first.match(/(\d+)\s*학년/);
  if(grd) return 100 + Number(grd[1]);      // 1~12학년 → 101~112
  return 998;
}

/* 학생 한 명의 학기 집계 */
function tallyStudent(recs, term){
  const z = ()=>({질병:0,무단:0,기타:0});
  const out = { 결석:z(), 지각:z(), 조퇴:z(), 체험:{ '가족 대소사':0,'가족 여행':0,'기타':0 } };
  for(const r of recs){
    if(!r.date || r.date < term.start || r.date > term.end) continue;
    const tids = recTypes(r);
    const t = tids.length ? TYPES.find(x=>x.id===tids[0]) : null;
    if(!t) continue;
    let name = t.name, reason = r.reason||'';
    if(name==='병결'){ name='결석'; reason='질병'; }
    if(name==='결석'||name==='지각'||name==='조퇴'){
      const key = (reason==='질병'||reason==='무단') ? reason : '기타';
      out[name][key]++;
    } else if(name==='체험학습'){
      const key = (reason==='가족 대소사'||reason==='가족 여행') ? reason : '기타';
      out.체험[key]++;
    }
  }
  out.결석합 = out.결석.질병+out.결석.무단+out.결석.기타;
  out.지각합 = out.지각.질병+out.지각.무단+out.지각.기타;
  out.조퇴합 = out.조퇴.질병+out.조퇴.무단+out.조퇴.기타;
  out.체험합 = out.체험['가족 대소사']+out.체험['가족 여행']+out.체험['기타'];
  return out;
}

/* 학기 내 임시휴교(기관 전용 휴일) 각주 */
function closureNote(term){
  const items = HOLIDAYS.filter(h=>h.org===term.org && h.date>=term.start && h.date<=term.end)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!items.length) return '';
  const byName = {};
  items.forEach(h=>{ const k=h.name||'임시 휴교'; (byName[k]=byName[k]||[]).push(h.date.slice(5).replace('-','/')); });
  return Object.entries(byName).map(([k,ds],i)=>`${i+1}. ${k} ※ ${ds.join(', ')} (총 ${ds.length}일)`).join('  ');
}

// ── 특정 날짜가 해당 기관에서 휴일/방학인지 판정 ──
// 반환: 휴일이면 사유 문자열, 아니면 null
function holidayReason(dateStr, org){
  // 공휴일 (출근부 holidays: org가 'all' 또는 해당 기관)
  const hol = HOLIDAYS.find(h => h.date===dateStr && (h.org==='all' || h.org===org));
  if(hol) return hol.name || '공휴일';
  // 방학기간 (출근부 workPeriods 중 type==='vacation')
  const vac = WORKPERIODS.find(w => w.type==='vacation' && w.org===org && dateStr>=w.s && dateStr<=w.e);
  if(vac) return vac.vac || vac.name || '방학';
  return null;
}

// ── 수업일 계산: 학기 기간 평일 − 휴일/방학 ──
// term: {year, org, term, start, end}
// 반환: 수업일 날짜 배열 (YYYY-MM-DD)
function calcSchoolDays(term){
  const days = [];
  if(!term.start || !term.end) return days;
  let d = new Date(term.start+'T00:00:00');
  const end = new Date(term.end+'T00:00:00');
  while(d <= end){
    const dow = d.getDay();
    const ds = fmtDate(d);
    // 평일(월~금)이고 휴일/방학이 아니면 수업일
    if(dow!==0 && dow!==6 && !holidayReason(ds, term.org)){
      days.push(ds);
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}

function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const TERM_NAMES = {1:'1학기', 2:'2학기'};
// 특정 날짜에 휴학 중인지 — 학생관리·반편성과 같은 규칙(student-status.js)
//   휴학 기간 안이거나, 재적 상태가 «휴학»이면 휴학 (기간이 있으면 그 시작일부터)
function isOnLeave(s, dateStr){ return StuStatus.onLeave(s, dateStr); }
// «결석은» · «조퇴는» — 받침 따라
function josaEun(w){ const c = String(w||'').trim().slice(-1).charCodeAt(0); return (c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28===0) ? '는' : '은'; }
// 휴학 날에 남아 있는 기록 — 지우지 않고 보관 중이라고 알려 준다
function keptNote(rec){
  const ids = rec && Array.isArray(rec.typeIds) ? rec.typeIds : [];
  if(!rec || !rec.id || !ids.length) return '';
  const nm = ids.map(id=>TYPES.find(t=>t.id===id)?.name||'').filter(Boolean).join('·');
  return nm ? `<span style="font-size:11px;color:var(--tl)">입력돼 있던 «${esc(nm)}»${josaEun(nm)} 보관 중 — 휴학을 풀면 다시 보여요</span>` : '';
}
// 반 명단 — 학적이 살아 있는 학생(재학·휴학). 그날 휴학인지는 각 화면이 isOnLeave 로 나눈다
function rollOf(c){ return ((c && c.students) || []).map(sid=>STUDENTS[sid]).filter(Boolean).filter(s=>StuStatus.enrolled(s)); }
// 특정 날짜가 해당 기관의 등록된 학기 기간 안에 있는지
// 반환: 속하면 학기객체, 안 속하면 null, 그 해 학기 자체가 없으면 'none'
function termOfDate(dateStr, org){
  const year = Number(dateStr.slice(0,4));
  const orgTerms = TERMS.filter(t=>t.org===org && t.year===year);
  if(!orgTerms.length) return 'none';
  const hit = orgTerms.find(t=>t.start && t.end && dateStr>=t.start && dateStr<=t.end);
  return hit || null;
}

/* 🔁 실시간 연동 — 학생관리에서 휴학·자퇴를 바꾸거나 반편성에서 학생을 옮기면 출석부가 바로 따라 바뀐다.
   처음 한 번은 받아 올 때까지 기다리고(getDocs 와 같은 읽기), 그 뒤로는 바뀐 문서만 들어온다.
   출석부에 영향 있는 칸(이름·상태·휴학 기간·반 구성 등)이 바뀔 때만 다시 그린다 — 연락처 수정 같은 건 조용히 넘어간다. */
const LIVE = {};
function liveCol(name, apply, sigOf){
  const L = LIVE[name];
  if(L) return L.ready.then(()=>{ if(L.docs) apply(L.docs); });   // 이미 듣는 중(또는 처음 받는 중) → 받은 자료로
  const E = LIVE[name] = { docs:null, sig:'', unsub:null, ready:null };
  E.ready = new Promise((res, rej)=>{
    let first = true;
    E.unsub = onSnapshot(collection(db, name), snap=>{
      const docs = []; snap.forEach(d=>docs.push({ id:d.id, ...d.data() }));
      const sig = sigOf ? JSON.stringify(docs.map(sigOf).sort((a,b)=>String(a[0]).localeCompare(String(b[0])))) : '';
      const changed = !sigOf || sig !== E.sig;
      E.docs = docs; E.sig = sig;
      apply(docs);
      if(first){ first = false; res(); }
      else if(changed) liveRefresh();
    }, err=>{
      if(LIVE[name] === E) delete LIVE[name];   // 끊기면 다음 불러오기 때 새로 듣는다 (받은 자료는 그대로 쓴다)
      if(first){ first = false; rej(err); }
    });
  });
  return E.ready;
}
function liveRefresh(){
  clearTimeout(liveRefresh._t);
  liveRefresh._t = setTimeout(()=>{
    try {
      if(checkClassId && !scopeOf(checkClassId)) checkClassId = '';     // 🧺 v174 반 id 또는 «전체» 범위
      if(monthClassId && !scopeOf(monthClassId)) monthClassId = '';
      if(curTab==='check'){
        if(!$I('ck-mode-body')){ if($I('c-check')) renderCheck(); return; }   // «편성된 반 없음» 화면이었으면 처음부터

        else {
          if($I('month-menu') || dragging || BULK_BUSY){ liveRefresh(); return; }   // 고르는 중엔 끝난 뒤에
          renderMonthCheck(true);
        }
      } else if(curTab==='stat'){
        if(statView==='live'){ if(LIVE_PAINT) LIVE_PAINT(); }
        else if($I('st-body')) buildStat();
      } else if(curTab==='report'){

    } catch(e){ console.warn('[live]', e); }
  }, 200);
}

function canEditClass(c){

  if(CU.role==='super' || CU.role==='org_admin') return myOrgs().includes(c.org);

  if(CU.role==='tab_admin'){

    if(CU.dept==='행정실') return myOrgs().includes(c.org);
    return c.org===CU.org && c.dept===CU.dept;
  }
  // 교사: 담임이거나 대리로 지정된 반
  if(c.teacherUid===CU.uid || (c.deputies||[]).includes(CU.uid) || (c.shadowUids||[]).includes(CU.uid)) return true;

  return classGrades(c).some(g => (GRADE_ASSIGN[c.org+'|'+g]||[]).includes(CU.uid));

// «명단형으로» · «가정별로» — 받침 따라
function josaRo(w){ const c = String(w||'').trim().slice(-1).charCodeAt(0); if(!(c>=0xAC00 && c<=0xD7A3)) return '로'; const j=(c-0xAC00)%28; return (j===0||j===8) ? '로' : '으로'; }
function josaWa(w){ const c = String(w||'').trim().slice(-1).charCodeAt(0); return (c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28===0) ? '와' : '과'; }
const escA = s => esc(s).replace(/"/g,'&quot;');

/* 범위 고르기 — «전체로 보기» 묶음 */
function scopeOptions(){
  const out = [];
  const vis = CLASSES.filter(canViewClass);
  const nStu = cls => new Set(cls.flatMap(c=>rollOf(c).map(s=>s.id))).size;
  myOrgs().forEach(org=>{
    const cls = vis.filter(c=>c.org===org);
    if(cls.length < 2) return;
    out.push({ v:'all:'+org, label:`${ORGS[org]||org} 전체 (${cls.length}개 반 · ${nStu(cls)}명)` });
    [...new Set(cls.map(c=>c.dept).filter(d=>d && d!=='전체'))].sort((a,b)=>a.localeCompare(b,'ko')).forEach(d=>{
      const dc = cls.filter(c=>c.dept===d);
      if(dc.length >= 2 && dc.length < cls.length) out.push({ v:`dept:${org}|${d}`, label:`${d} 전체 (${ORGS[org]||org} · ${dc.length}개 반 · ${nStu(dc)}명)` });
    });
  });
  return out;
}
function scopeOf(v){
  if(!v) return null;
  if(v.startsWith('all:') || v.startsWith('dept:')){
    const isAll = v.startsWith('all:');
    const [org, dept] = isAll ? [v.slice(4), ''] : v.slice(5).split('|');
    const cls = sortClasses(CLASSES.filter(c=>c.org===org && canViewClass(c) && (isAll || c.dept===dept)));
    if(!cls.length) return null;
    return { v, multi:true, org, dept, classes:cls, label: isAll ? `${ORGS[org]||org} 전체` : `${dept} 전체` };
  }
  const c = CLASSES.find(x=>x.id===v); if(!c) return null;
  return { v, multi:false, org:c.org, dept:c.dept||'', classes:[c], one:c, label:c.name };
}
// 범위 안 아이들 — 한 아이는 한 줄 (두 반에 있으면 앞 반) · 가나다
function scopeRows(sc){
  const seen = new Map(), rows = [];
  sc.classes.forEach(c=>rollOf(c).forEach(s=>{
    const prev = seen.get(s.id);
    if(prev){ if(!canEditClass(prev.c) && canEditClass(c)){ prev.c = c; prev.grade = (c.grades||{})[s.id] || ''; } return; }   // 두 반에 있으면 내가 기록하는 반으로
    const r = { s, c, grade:(c.grades||{})[s.id] || '' }; seen.set(s.id, r); rows.push(r);
  }));
  return rows.sort((a,b)=>(a.s.name||'').localeCompare(b.s.name||'','ko'));
}

/* 초성 — 찾기(ㄱㄷㅇ)와 건너뛰기(ㄱ ㄴ ㄷ …) */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_BASE = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ' };
const JUMPS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choOf(ch){ const c = String(ch||'').charCodeAt(0); return (c>=0xAC00 && c<=0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : String(ch||''); }
function choStr(name){ return [...String(name||'')].map(choOf).join(''); }
function choHead(name){ const h = choOf(String(name||'').trim().charAt(0)); return CHO_BASE[h] || (JUMPS.includes(h) ? h : '#'); }
function nameHit(name, q){
  if(!q) return true;
  const n = String(name||'');
  if(n.includes(q)) return true;
  return [...q].every(ch=>CHO.includes(ch)) && choStr(n).includes(q);
}
/* 가정(형제) — 범위 안 아이들끼리만 */
function buildFams(rows){
  const ids = new Set(rows.map(r=>r.s.id)), par = {};
  const f = x => par[x]===x ? x : (par[x] = f(par[x]));
  rows.forEach(r=>{ par[r.s.id] = r.s.id; });
  rows.forEach(r=>(r.s.siblings||[]).forEach(o=>{ if(ids.has(o)){ const a=f(r.s.id), b=f(o); if(a!==b) par[b]=a; } }));
  const g = {}; rows.forEach(r=>{ const k=f(r.s.id); (g[k]=g[k]||[]).push(r.s.id); });
  CK_FAM = {}; CK_FAMS = {};
  Object.values(g).forEach(arr=>{
    arr.sort((a,b)=>(STUDENTS[a]?.name||'').localeCompare(STUDENTS[b]?.name||'','ko'));
    CK_FAMS[arr[0]] = arr; arr.forEach(id=>{ CK_FAM[id] = arr[0]; });
  });
}

}

async function loadMonthBody(keep){
  const body = $I('m-body'); if(!body) return;
  try {
  const sc = scopeOf(monthClassId);   // 🧺 v174 반 하나 · 기관 전체 · 부서 전체
  if(!sc){ body.innerHTML='<div class="acard"><p class="empty">반을 선택하세요.</p></div>'; return; }
  const c = sc.classes[0];            // 기관 · 잠금은 범위 안 어느 반이든 같다
  try{ localStorage.setItem('attend_mscope', monthClassId); }catch(e){}
  keep = !!keep && monthKey===monthClassId+'|'+monthYM;   // 🔁 학생·반만 바뀐 실시간 갱신 → 받은 출결 그대로 다시 그리기
  if(!keep){ body.style.pointerEvents = 'none'; body.style.opacity = '.55'; }   // 🧺 v174 새 달 · 범위를 받는 동안 옛 표를 누르지 못하게
  if(!keep) await loadMonthLock(c);   // 🔒 이 달 잠금 여부
  const [y,m] = monthYM.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const mRows = scopeRows(sc);
  MONTH_SC = sc; MONTH_CLS = {}; mRows.forEach(r=>{ MONTH_CLS[r.s.id] = r.c; });
  const studs = mRows.map(r=>r.s);
  if(!studs.length){ body.innerHTML=`<div class="acard"><p class="empty">이 ${sc.multi?'범위':'반'}에 재학 중인 학생이 없습니다.</p></div>`; return; }
  const prefix = `${y}-${pad(m)}`;
  if(!keep){
    const want = monthClassId+'|'+monthYM;
    // 📉 v120 — 이 반 · 이 달만 (예전: 모든 학생의 모든 기록) · 🧺 v174 전체면 이 기관 · 이 달
    const snap = sc.multi ? await eqInDays(db,'studentAttendance','org', sc.org, `${prefix}-01`, `${prefix}-${pad(daysInMonth)}`)
                          : await eqInDays(db,'studentAttendance','classId', monthClassId, `${prefix}-01`, `${prefix}-${pad(daysInMonth)}`);
    const md = {};   // 다 받은 뒤에 한 번에 바꾼다 (받는 동안 누른 칸이 옛 기록을 잃지 않게)
    snap.forEach(d=>{
      const r=d.data();
      if(!(r.date||'').startsWith(prefix)) return;
      if(sc.multi ? (r.org!==sc.org || !MONTH_CLS[r.studentId]) : r.classId!==monthClassId) return;
      const day = Number(r.date.slice(8,10));
      if(!md[r.studentId]) md[r.studentId]={};
      const mine = r.classId === (MONTH_CLS[r.studentId]||{}).id, cur = md[r.studentId][day];
      if(cur && (cur.mine || !mine)) return;   // 한 아이 · 한 날에 기록이 둘이면 그 아이 반 것
      md[r.studentId][day] = {id:d.id, typeIds:recTypes(r), reason:r.reason||'', cid:r.classId||'', raw:r, mine};
    });
    if(want !== monthClassId+'|'+monthYM) return;   // 받는 사이 반·월을 바꿨으면 버린다
    monthData = md; monthKey = want;
    body.style.pointerEvents = ''; body.style.opacity = '';
  }
  const dayInfo = [];
  for(let dd=1; dd<=daysInMonth; dd++){
    const dateStr = `${y}-${pad(m)}-${pad(dd)}`;
    const dow = new Date(dateStr+'T00:00:00').getDay();
    const wknd = dow===0||dow===6;
    const hol = !!holidayReason(dateStr, c.org);
    const term = termOfDate(dateStr, c.org);
    const outOfTerm = (term==='none' || term===null);
    const blocked = wknd || hol || outOfTerm;
    const autoPresent = !blocked; // 학기 중 평일 = 자동 출석 대상
    dayInfo.push({dd, dateStr, dow, blocked, autoPresent});
  }
  const dnames=['일','월','화','수','목','금','토'];
  const headDays = dayInfo.map(di=>`<th class="${di.dow===0||di.dow===6?'wkhd':''} mday" style="padding:3px 2px;cursor:pointer" title="${di.dateStr} — 눌러서 이 날 기록 지우기" onclick="monthDayMenu(event,${di.dd})">${di.dd}<br><span style="font-size:9px;font-weight:400">${dnames[di.dow]}</span></th>`).join('');
  const pType = presentType();
  const rows = studs.map(s=>{
    const cells = dayInfo.map(di=>{
      const rec = monthData[s.id] && monthData[s.id][di.dd];
      const tids = rec ? (rec.typeIds||[]) : [];
      const t = tids.length ? TYPES.find(x=>x.id===tids[0]) : null;
      const tnames = tids.map(id=>TYPES.find(x=>x.id===id)?.name||'').filter(Boolean).join('·');
      const lv = isOnLeave(s, di.dateStr);            // 휴학 중인 날 — 출결 대상이 아니다
      /* 🏠 휴학이 «덮는다»: 휴학 날엔 이미 입력된 기록이 있어도 «휴»로 보이고, 칸은 늘 잠긴다(토글을 켜도).
         기록은 지우지 않고 그대로 보관 → 휴학 기간을 고치거나 풀면 원래 입력이 다시 보인다 */
      const blockedCls = lv ? 'blocked' : di.blocked ? (monthAllowBlocked?'blocked allow':'blocked') : '';
      const clickable = !lv && (!di.blocked || monthAllowBlocked) && canEditClass(MONTH_CLS[s.id]||c) && !MONTH_LOCK;   // 🔒 잠기면 클릭 불가
      let bg='', label='', autoCls='';
      if(lv){
        if(!di.blocked || t){ bg='color:var(--warn);font-size:10px;font-weight:800'; label = '휴' + (t ? '<sup style="font-size:9px;margin-left:1px">•</sup>' : ''); }
      }
      else if(t){
        const rs = legacyByeong(t) ? '질병' : (rec.reason||'');   // 옛 «병결»은 결석·질병으로 본다
        const nm = legacyByeong(t) ? '결' : (t.name||'').slice(0,1);
        const sub = rs ? `<span style="font-size:8px;opacity:.9;vertical-align:1px">${reasonShort(rs)}</span>` : '';
        bg=`background:${legacyByeong(t)?'#dc2626':t.color};color:#fff`;
        label = nm + sub + (tids.length>1?'⁺':'');
      }
      else if(di.autoPresent && pType){ // 자동 출석: 연한 초록 흐리게
        bg=`background:${pType.color}22;color:${pType.color}`; label='출'; autoCls='auto-present';
      }
      const tip = lv ? `${di.dateStr} · 휴학 중${t ? ` · 입력돼 있던 «${tnames}»${josaEun(tnames)} 보관 중 (휴학을 풀면 다시 보여요)` : ''}`
                     : `${di.dateStr}${t?' · '+tnames:di.autoPresent?' · 자동 출석':''}`;
      return `<td class="dcell ${blockedCls} ${autoCls}" data-sid="${s.id}" data-day="${di.dd}" style="${bg}" ${clickable?`onmousedown="startDrag(event,'${s.id}',${di.dd})" onmouseenter="dragOver('${s.id}',${di.dd})"`:''} title="${esc(tip)}">${label}</td>`;
    }).join('');
    const lvDay = dayInfo.find(di=>isOnLeave(s, di.dateStr));     // 이 달에 휴학인 날이 있으면 이름 옆에 표시
    const lvN = lvDay ? StuStatus.leaveNote(s, lvDay.dateStr) : '';
    return `<tr><td class="nm" title="${esc(s.name)}${lvDay?' · 휴학 '+esc(lvN):''}">${esc(s.name)}${sc.multi?` <span class="ck-cls" style="font-size:10px;padding:1px 6px">${esc((MONTH_CLS[s.id]||{}).name||'')}</span>`:''} <span style="color:${s.gender==='남'?'#2b6cb0':'#d53f8c'};font-size:10px">${s.gender||''}</span>${lvDay?' <span style="color:var(--warn);font-size:9.5px;font-weight:700">휴학</span>':''}</td>${cells}</tr>`;
  }).join('');
  body.innerHTML = `
    <div class="acard" style="overflow-x:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <h3 class="actitle" style="margin:0">${esc(sc.label)} · ${y}년 ${m}월 (${studs.length}명)
          ${MONTH_LOCK?'<span style="font-size:11px;font-weight:800;color:#8A6410;background:#F7EFD8;border-radius:100px;padding:3px 10px;vertical-align:2px">🔒 잠김 — 수정하려면 잠금을 푸세요</span>':''}
          ${canLockMonth(c)?`<button class="bm" style="font-size:11px;padding:5px 12px;vertical-align:2px;${MONTH_LOCK?'':'background:#F7EFD8;color:#8A6410'}" onclick="toggleMonthLock()">${MONTH_LOCK?'🔓 잠금 풀기':'🔒 이 달 입력 잠그기'}</button>`:''}</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:11px">
          ${TYPES.map(t=>`<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:11px;height:11px;border-radius:8px;background:${t.color};display:inline-block"></span>${t.name}</span>`).join('')}
        </div>
      </div>
      <table class="mtab"><thead><tr><th class="nm">학생</th>${headDays}</tr></thead><tbody>${rows}</tbody></table>
      <p style="font-size:12px;color:var(--tl);margin-top:10px">
        연한 초록 <b style="color:${pType?pType.color:'#16a34a'}">출</b> = 자동 출석 처리된 날입니다. 예외인 학생 칸만 클릭해 바꾸면 됩니다. <b style="color:var(--warn)">휴</b> = 학생 관리에 등록된 휴학 기간 (출결·통계 제외) · <b style="color:var(--warn)">휴•</b> = 휴학 전에 입력돼 있던 출결이 보관 중 — 휴학을 풀면 다시 보여요<br>
        칸을 <b>클릭</b>하거나 <b>마우스로 여러 칸을 드래그</b>한 뒤 상태를 고르면 한 번에 입력됩니다. <b>날짜 머리(숫자)</b>를 누르면 그 날 기록을 한 번에 지울 수 있어요 (쉬는 날에 잘못 넣었을 때). 회색 칸(주말·공휴일·학기외)은 위 토글을 켜면 입력할 수 있습니다.<br>
        <b>⁺</b> 표시는 한 날에 항목이 두 개 이상 기록된 칸입니다 (예: 지각+조퇴). 하루에 여러 항목을 기록하려면 <b>일일 체크</b>를 쓰세요 — 여기서 상태를 고르면 그 항목 하나로 바뀝니다.
      </p>
    </div>`;
  } catch(e){
    body.style.pointerEvents = ''; body.style.opacity = '';
    body.innerHTML = `<div class="acard"><div style="background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:14px;font-size:13px">월별 표를 그리는 중 오류가 발생했습니다.<br>${esc(e.message)}</div></div>`;
    console.error('loadMonthBody 오류', e);
  }
}

// ── 드래그 일괄 선택 ──
let dragging = false;
let dragCells = [];   // [{sid, day}]

function startDrag(ev, sid, day){
  ev.preventDefault();
  closeMonthMenu();
  if(!monthReady()) return;
  const c = MONTH_CLS[sid];
  if(!c || !canEditClass(c)) return;
  dragging = true;
  dragCells = [];
  addDragCell(sid, day);
}
window.startDrag = startDrag;

function dragOver(sid, day){
  if(!dragging) return;
  addDragCell(sid, day);
}
window.dragOver = dragOver;

function addDragCell(sid, day){
  if(dragCells.some(c=>c.sid===sid && c.day===day)) return;
  if(!MONTH_CLS[sid] || !canEditClass(MONTH_CLS[sid])) return;   // 🧺 전체 보기에서 내 반이 아닌 아이 칸은 건너뜀
  dragCells.push({sid, day});
  const cell = document.querySelector(`.dcell[data-sid="${sid}"][data-day="${day}"]`);
  if(cell) cell.classList.add('drag-sel');
}

function clearDragSel(){
  document.querySelectorAll('.dcell.drag-sel').forEach(c=>c.classList.remove('drag-sel'));
}

// 마우스 놓으면: 1칸이면 단일 메뉴, 여러 칸이면 일괄 메뉴
document.addEventListener('mouseup', (e)=>{
  if(!dragging) return;
  dragging = false;
  if(dragCells.length===0){ return; }
  if(dragCells.length===1){
    const {sid, day} = dragCells[0];
    clearDragSel(); 
    openMonthMenu(e, sid, day);
    dragCells = [];
  } else {
    openBulkMenu(e);
  }
});

// 일괄 입력 메뉴
function openBulkMenu(ev){
  closeMonthMenu();
  if(MONTH_LOCK){ clearDragSel(); dragCells=[]; return toast('🔒 이 달은 잠겨 있어요.','err'); }
  const sorted = menuTypes();
  const menu = document.createElement('div');
  menu.className='mmenu'; menu.id='month-menu';
  const cnt = dragCells.length;
  let html = `<div class="sep" style="color:var(--gm);font-weight:700">${cnt}칸 일괄 입력</div>`;
  html += sorted.map(t=> needsReasonT(t)
    ? `<button onclick="showBulkReason('${t.id}')"><span style="width:12px;height:12px;border-radius:8px;background:${t.color};display:inline-block"></span>${t.name} <span style="margin-left:auto;color:var(--tl);font-size:10px">사유 ›</span></button>`
    : `<button onclick="applyBulk('${t.id}')"><span style="width:12px;height:12px;border-radius:8px;background:${t.color};display:inline-block"></span>${t.name}</button>`).join('');
  html += `<div class="sep"></div><button onclick="applyBulkClear()" style="color:var(--danger)">✕ 삭제(미입력)</button>`;
  html += `<button onclick="cancelBulk()" style="color:var(--tl)">취소</button>`;
  menu.innerHTML = html;
  document.body.appendChild(menu);
  const x=Math.min((ev.clientX||200), window.innerWidth-170), yy=Math.min((ev.clientY||200), window.innerHeight-300);
  menu.style.left=x+'px'; menu.style.top=yy+'px';
}

window.showBulkReason = function(typeId){
  const menu = $I('month-menu'); if(!menu) return;
  const t = TYPES.find(x=>x.id===typeId); if(!t) return;
  const rs = REASONS[t.name] || ['기타'];
  menu.innerHTML =
    `<div class="sep" style="color:var(--gm);font-weight:700">${dragCells.length}칸 · ${t.name} — 사유를 골라주세요</div>` +
    rs.map(r=>`<button onclick="applyBulk('${typeId}','${r}')">${r==='질병'?'🤒':r==='무단'?'❓':r==='가족 대소사'?'👨‍👩‍👧':r==='가족 여행'?'✈️':'📎'} ${r}</button>`).join('') +
    `<div class="sep"></div><button onclick="cancelBulk()" style="color:var(--tl)">취소</button>`;
};

let BULK_BUSY = false;   // 여러 칸을 한꺼번에 쓰는 중 (실시간 갱신은 끝난 뒤로)
async function applyBulk(typeId, reason){
  closeMonthMenu();
  const cells = [...dragCells];
  clearDragSel(); dragCells=[];
  let ok=0;
  BULK_BUSY = true;
  try {
    for(const {sid, day} of cells){
      try { await setMonthCell(sid, day, typeId, true, reason); ok++; } catch(e){}
    }
  } finally { BULK_BUSY = false; }
  toast(`${ok}칸 입력 완료`,'ok');
}
window.applyBulk = applyBulk;

async function applyBulkClear(){
  closeMonthMenu();
  const cells = [...dragCells];
  clearDragSel(); dragCells=[];
  BULK_BUSY = true;
  try {
    for(const {sid, day} of cells){
      try { await clearMonthCell(sid, day, true); } catch(e){}
    }
  } finally { BULK_BUSY = false; }
  toast('삭제 완료','ok');
}
window.applyBulkClear = applyBulkClear;

function cancelBulk(){ closeMonthMenu(); clearDragSel(); dragCells=[]; }
window.cancelBulk = cancelBulk;

function openMonthMenu(ev, sid, day){
  ev.stopPropagation();
  closeMonthMenu();
  if(!monthReady()) return;
  const c = MONTH_CLS[sid];
  if(!c || !canEditClass(c)) return toast('기록 권한이 없습니다.','err');
  if(MONTH_LOCK) return toast('🔒 이 달은 잠겨 있어요 — 관리자가 잠금을 풀어야 수정할 수 있습니다.','err');
  const sorted = menuTypes();
  const menu = document.createElement('div');
  menu.className='mmenu'; menu.id='month-menu';
  const cur = monthData[sid] && monthData[sid][day];
  const btn = t => needsReasonT(t)
    ? `<button onclick="showReasonMenu('${sid}',${day},'${t.id}')"><span style="width:12px;height:12px;border-radius:8px;background:${t.color};display:inline-block"></span>${t.name} <span style="margin-left:auto;color:var(--tl);font-size:10px">사유 ›</span></button>`
    : `<button onclick="setMonthCell('${sid}',${day},'${t.id}')"><span style="width:12px;height:12px;border-radius:8px;background:${t.color};display:inline-block"></span>${t.name}${cur&&cur.typeId===t.id?' ✓':''}</button>`;
  let html = sorted.slice(0,5).map(btn).join('');
  if(sorted.length>5){
    html += `<div class="sep">기타</div>` + sorted.slice(5).map(btn).join('');
  }

/* ── 기록 한 장의 «모양» — 바뀌었는지 견줄 때 ── */
const recSig = r => JSON.stringify([ (r && r.typeIds) || [], (r && r.reason) || '', String((r && r.memo) || '').trim() ]);
function defRec(){ const d = presentType(); return { typeIds: d ? [d.id] : [], memo:'', reason:'' }; }
function recChanged(sid){
  const rec = checkRecords[sid]; if(!rec) return false;
  return rec.id ? recSig(rec) !== rec.orig : recSig(rec) !== recSig(defRec());
}
function rowOf(sid){ return CK_CTX && CK_CTX.rows.find(r=>r.s.id===sid); }
// 이 아이를 내가 바꿀 수 있나 — 아이 반 + (이미 있는 기록이면) 그 기록의 반 둘 다 내가 기록하는 반이어야
function recCls(r){ const rec = r && checkRecords[r.s.id]; return (rec && rec.cid && CLASSES.find(c=>c.id===rec.cid)) || (r && r.c); }
function edOf(r){ return !!(CK_CTX && r && CK_CTX.termOK && !DAY_LOCK && canEditClass(r.c) && canEditClass(recCls(r))); }
// 학년 필터로 가려진 아이도 «바꾼 것»은 그대로 — 저장 · 경고는 범위 전체(allRows)로
function ckChangedRows(){ return CK_CTX ? (CK_CTX.allRows||CK_CTX.rows).filter(r=>edOf(r) && recChanged(r.s.id)) : []; }
function ckUnsaved(){ return !!(CK_CTX && CK_CTX.want===checkClassId+'|'+checkDate && ckChangedRows().length); }
// 다른 일을 하기 전에 저장 안 한 출결이 있으면 — 저장하고 계속 / 그만두기
async function ckSaveFirst(what){
  if(!ckUnsaved()) return true;
  if(!confirm(`저장하지 않은 출결(바꾼 ${ckChangedRows().length}명)이 있어요.\n${what} 전에 먼저 저장할까요?\n\n확인 = 저장하고 계속 · 취소 = 그만두기`)) return false;
  await saveCheck();
  return !ckUnsaved();
}
window.addEventListener('beforeunload', e=>{ if(curTab==='check' && checkMode==='daily' && ckUnsaved()){ e.preventDefault(); e.returnValue=''; } });
function isAbn(sid){ const d = presentType(); const rec = checkRecords[sid]; return !!rec && (rec.typeIds||[]).some(id=>id!==(d&&d.id)); }
// 사유를 고르는 항목이면 그 사유 목록 (옛 «병결»은 이미 결석·질병이라 묻지 않는다)
function reasonListOf(typeIds){
  for(const id of typeIds||[]){ const t = TYPES.find(x=>x.id===id); if(!t || legacyByeong(t)) continue; if(REASONS[t.name]) return REASONS[t.name]; }
  return null;
}
function fixReason(rec){ const rs = reasonListOf(rec.typeIds); if(!rs || !rs.includes(rec.reason)) rec.reason = ''; }
// 누를 때: 기본 출석은 혼자만 · 다른 항목은 켜고 끔 (모두 끄면 출석)
function nextTypes(arr, tid){
  const defId = presentType()?.id;
  if(tid===defId) return defId ? [defId] : [];
  let a = (arr||[]).filter(x=>x!==defId);
  a = a.includes(tid) ? a.filter(x=>x!==tid) : [...a, tid];
  return a.length ? a : (defId ? [defId] : []);
}

async function loadCheckBody(keep){
  const body = $I('ck-body'); if(!body) return;
  keep = !!keep && !!_keepCk && checkKey===checkClassId+'|'+checkDate;
  const K = keep ? _keepCk : null; _keepCk = null;
  const sc = scopeOf(checkClassId);
  if(!sc){ body.innerHTML=''; CK_CTX = null; return; }
  try{ localStorage.setItem('attend_scope', checkClassId); }catch(e){}
  const want = checkClassId+'|'+checkDate;
  if(!keep || DAY_LOCK_KEY !== `${sc.org}_${String(checkDate||'').slice(0,7)}`) await loadDayLock(sc.classes[0], checkDate);   // 🔒 이 날짜의 달이 잠겼나
  if(want !== checkClassId+'|'+checkDate) return;
  const allRows = scopeRows(sc);
  const all = allRows.filter(r=>!checkGradeFilter || r.grade===checkGradeFilter);   // 학년 필터
  const rows = all.filter(r=>!isOnLeave(r.s, checkDate));        // 이 날 휴학 중인 아이는 따로
  const allActive = allRows.filter(r=>!isOnLeave(r.s, checkDate));   // 학년 필터와 상관없이 (저장 · 경고용)
  const leaveRows = all.filter(r=>isOnLeave(r.s, checkDate));
  const holReason = holidayReason(checkDate, sc.org);
  const dow = new Date(checkDate+'T00:00:00').getDay();
  const isWeekend = dow===0||dow===6;

  if(!keep){
    body.innerHTML = '<div class="acard"><p class="empty">불러오는 중...</p></div>';
    // 기존 기록 — 반 하나면 «이 반 · 이 날짜», 전체면 «이 기관 · 이 날짜»만 서버에 묻는다
    const inScope = new Map(allRows.map(r=>[r.s.id, r]));
    const snap = sc.multi ? await eqInDays(db,'studentAttendance','org', sc.org, checkDate, checkDate)
                          : await eqInDays(db,'studentAttendance','classId', sc.one.id, checkDate, checkDate);
    if(want !== checkClassId+'|'+checkDate) return;   // 받는 사이 반·날짜를 바꿨으면 버린다
    const got = {};
    snap.forEach(d=>{
      const r = d.data(); if(r.date!==checkDate) return;
      if(sc.multi ? (r.org!==sc.org || !inScope.has(r.studentId)) : r.classId!==sc.one.id) return;
      const mine = r.classId === (inScope.get(r.studentId)||{}).c?.id;
      const cur = got[r.studentId]; if(cur && (cur.mine || !mine)) return;   // 한 아이에 기록이 둘이면 그 아이 반 것
      got[r.studentId] = { id:d.id, typeIds:recTypes(r), memo:r.memo||'', reason:r.reason||'', cid:r.classId||'', raw:r, mine };
    });
    // 같은 범위 · 날짜를 다시 받는 것(저장 뒤 · 지운 뒤 · 체험학습 뒤 · 실시간)이면 저장 안 한 선택은 그대로 둔다
    const prev = checkKey===want ? checkRecords : null;
    const kept = new Set();
    checkRecords = {};
    for(const sid in got){ const g = got[sid]; checkRecords[sid] = Object.assign(g, { orig: recSig(g) }); }
    if(prev) for(const sid in prev){
      const pr = prev[sid]; if(!pr) continue;
      const was = pr.id ? recSig(pr)!==pr.orig : recSig(pr)!==recSig(defRec()); if(!was) continue;
      const n = checkRecords[sid];
      if(n){ n.typeIds = [...(pr.typeIds||[])]; n.reason = pr.reason||''; n.memo = pr.memo||''; }
      else checkRecords[sid] = { typeIds:[...(pr.typeIds||[])], reason:pr.reason||'', memo:pr.memo||'' };
      kept.add(sid);
    }
    if(!prev){ SIB_NOTE = {}; CK_SEL = ''; }
    else for(const sid in SIB_NOTE){ if(!kept.has(sid)) delete SIB_NOTE[sid]; }
    checkKey = want;
  }

  // 학기 기간 체크: 학기 밖이면 입력 차단 (그래도 들어가 있는 기록은 지울 수 있게)
  const term = termOfDate(checkDate, sc.org);
  const dayRecs = all.filter(r=>checkRecords[r.s.id] && checkRecords[r.s.id].id && canEditClass(r.c)).length;
  const delBtn = n => n && !DAY_LOCK ? ` <button type="button" class="bm" style="background:var(--danger-bg);color:var(--danger)" data-act="daydel">이 날 기록 ${n}건 지우기</button>` : '';
  if(term === 'none' || term === null){
    CK_CTX = { sc, rows:[], allRows:[], leaveRows:[], want, termOK:false };
    body.onclick = ckClick;
    body.innerHTML = term === 'none'
      ? `<div class="acard"><div style="background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:14px;font-size:13px;line-height:1.6">📅 ${checkDate.slice(0,4)}년 ${ORGS[sc.org]} 학기 일정이 등록되지 않았습니다.<br>설정 탭에서 학기 기간을 먼저 등록해주세요.${delBtn(dayRecs)}</div></div>`
      : `<div class="acard"><div style="background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:14px;font-size:13px;line-height:1.6">🚫 이 날짜(${checkDate})는 <b>학기 기간이 아닙니다.</b><br>학기 기간 안의 날짜만 출결을 기록할 수 있어요.${dayRecs?`<br>그런데 이 날 들어가 있는 기록이 있어요 — 잘못 넣은 것이면 지워 주세요.${delBtn(dayRecs)}`:''}</div></div>`;
    return;
  }

  // 기록 없는 아이는 기본 출석으로 (저장하면 출석으로 들어간다)
  rows.forEach(r=>{ if(!checkRecords[r.s.id]) checkRecords[r.s.id] = defRec(); });
  buildFams(rows);
  CK_CTX = { sc, rows, allRows:allActive, leaveRows, want, termOK:true, holReason, isWeekend };

  let banner = '';
  if(DAY_LOCK){ const [ly,lm] = String(checkDate).split('-').map(Number);
    banner = `<div class="ck-lock" style="background:#F7EFD8;color:#8A6410;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.6">🔒 <b>${ly}년 ${lm}월 출석부는 잠겨 있어요.</b> 보기만 할 수 있습니다.`
      + (sc.classes.some(canLockMonth) ? `<br><span style="color:var(--ts)">고치려면 «월별 입력» 위 «🔓 잠금 풀기» 또는 «⚙️ 설정 › 월별 입력 잠금»에서 이 달을 풀어 주세요.</span>`
                         : `<br><span style="color:var(--ts)">고쳐야 하면 수퍼관리자나 기관관리자에게 잠금을 풀어 달라고 요청하세요.</span>`) + `</div>`; }
  if(holReason || isWeekend){
    const what = holReason ? `<b>${esc(holReason)}</b>(쉬는 날)` : '<b>주말</b>';
    banner += `<div style="background:${holReason?'var(--danger-bg)':'var(--warn-bg)'};color:${holReason?'var(--danger)':'var(--warn)'};border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.6">📌 이 날짜는 ${what}이에요.`

function famViewHTML(vis){

/* ── 누르기 ── */
function ckClick(e){
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, sid = b.dataset.sid;
  if(a==='type') return ckType(sid, b.dataset.tid);
  if(a==='reason') return ckReason(sid, b.dataset.r);
  if(a==='sibundo') return ckSibUndo(sid);
  if(a==='pick'){ CK_SEL = sid; paintList(); if(window.innerWidth<=760){ const p=$I('ck-panel'); if(p && p.scrollTop!=null) p.scrollTop = 0; } return; }
  if(a==='close'){ CK_SEL=''; paintList(); return; }
  if(a==='next' || a==='prev'){ const v = visRows(); const i = v.findIndex(r=>r.s.id===CK_SEL); const n = v[i + (a==='next'?1:-1)]; if(n){ CK_SEL = n.s.id; paintList(); const t = document.querySelector(`.ckt[data-sid="${n.s.id}"]`); if(t && window.innerWidth>760) t.scrollIntoView({block:'nearest'}); } return; }
  if(a==='famall') return ckFamAll(b.dataset.fam, b.dataset.tid);
  if(a==='famreason') return ckFamReason(b.dataset.fam, b.dataset.r);
  if(a==='jump'){ const h = $I('cho-'+b.dataset.cho); if(h) h.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(a==='save') return saveCheck();
  if(a==='daydel') return delDayRecords();
  if(a==='trip') return openTrip();
}
function ckInput(e){
  const t = e.target;
  if(t.id==='ck-q'){ CK_Q = t.value.trim(); paintList(); return; }
  const m = t.closest && t.closest('[data-memo]');
  if(m){ const rec = checkRecords[m.dataset.memo]; if(rec){ rec.memo = m.value; paintSave(); } }
}
function ckChange(e){
  const t = e.target;
  if(t.id==='ck-sib' || t.id==='ck-sib2'){
    SIB_ON = t.checked; ['ck-sib','ck-sib2'].forEach(id=>{ const x=$I(id); if(x) x.checked = SIB_ON; });
    saveAttendPrefs({ sib: SIB_ON }, true);
    return;
  }
  if(t.id==='ck-abn'){ CK_ONLYABN = t.checked; paintList(); }
}
function ckType(sid, tid){
  const r = rowOf(sid); if(!r || !edOf(r)) return;
  const rec = checkRecords[sid] || (checkRecords[sid] = defRec());
  rec.typeIds = nextTypes(rec.typeIds, tid);
  fixReason(rec);
  delete SIB_NOTE[sid];                    // 내가 직접 바꾸면 «형제 따라 바뀜»은 끝
  if(SIB_ON) sibFollow(sid, true);
  paintCk();
}
function ckReason(sid, x){
  const r = rowOf(sid); if(!r || !edOf(r)) return;
  const rec = checkRecords[sid]; if(!rec) return;
  rec.reason = rec.reason===x ? '' : x;
  if(SIB_ON) sibFollow(sid, false);
  paintCk();
}
// 형제 따라 바꾸기 — withTypes: 항목까지(누른 아이와 똑같이) · 아니면 같은 항목인 형제의 사유만
function sibFollow(sid, withTypes){
  const rec = checkRecords[sid];
  (CK_FAMS[CK_FAM[sid]]||[]).forEach(o=>{
    if(o===sid) return;
    const r2 = rowOf(o); if(!r2 || !edOf(r2)) return;
    const rec2 = checkRecords[o] || (checkRecords[o] = defRec());
    if(!withTypes){
      if(!(SIB_NOTE[o] && SIB_NOTE[o].from===sid) || JSON.stringify(rec2.typeIds)!==JSON.stringify(rec.typeIds)) return;
      rec2.reason = rec.reason; return;
    }
    if(!SIB_NOTE[o]) SIB_NOTE[o] = { from:sid, prev:{ typeIds:[...(rec2.typeIds||[])], reason:rec2.reason||'' } };
    else SIB_NOTE[o].from = sid;
    rec2.typeIds = [...rec.typeIds]; rec2.reason = rec.reason || '';
    const p = SIB_NOTE[o].prev;
    if(JSON.stringify(p.typeIds)===JSON.stringify(rec2.typeIds) && p.reason===rec2.reason) delete SIB_NOTE[o];
  });
}
function ckSibUndo(o){
  const n = SIB_NOTE[o], rec = checkRecords[o]; if(!n || !rec) return;
  rec.typeIds = [...n.prev.typeIds]; rec.reason = n.prev.reason; delete SIB_NOTE[o];
  paintCk();
}
function ckFamAll(k, tid){
  const defId = presentType()?.id;
  (CK_FAMS[k]||[]).forEach(sid=>{
    const r = rowOf(sid); if(!r || !edOf(r)) return;
    const rec = checkRecords[sid] || (checkRecords[sid] = defRec());
    rec.typeIds = (tid===defId || !defId) ? (defId?[defId]:[tid]) : [tid];
    fixReason(rec); delete SIB_NOTE[sid];
  });
  paintCk();
}
function ckFamReason(k, x){
  (CK_FAMS[k]||[]).forEach(sid=>{
    const r = rowOf(sid); if(!r || !edOf(r)) return;
    const rec = checkRecords[sid]; const rs = rec && reasonListOf(rec.typeIds);
    if(rs && rs.includes(x)) rec.reason = x;
  });
  paintCk();
}

let CK_SAVING = false;   // 저장 중 (두 번 눌러도 한 번만)
async function saveCheck(){
  if(CK_SAVING) return false;
  const ctx = CK_CTX; const sc = ctx && scopeOf(checkClassId);
  if(!sc || !ctx.termOK || ctx.want!==checkClassId+'|'+checkDate || checkKey!==ctx.want) return false;
  const all = ctx.allRows || ctx.rows;
  if(!all.some(r=>canEditClass(r.c))){ toast('기록 권한이 없습니다.','err'); return false; }
  const term = termOfDate(checkDate, sc.org);
  if(term==='none'){ toast('학기 일정이 등록되지 않았습니다.','err'); return false; }
  if(term===null){ toast('학기 기간이 아닙니다. 출석을 기록할 수 없습니다.','err'); return false; }
  CK_SAVING = true;
  document.querySelectorAll('[data-act="save"]').forEach(b=>{ b.disabled = true; });
  try {
    if(await loadDayLock(sc.classes[0], checkDate)){ toast('🔒 이 달은 잠겨 있어요 — 관리자가 잠금을 풀어야 저장할 수 있습니다.','err'); paintCk(); return false; }
    // 이번에 바꾼 아이(학년 필터로 가려진 아이 포함) 중 사유가 빠진 아이 (예전에 사유 없이 들어간 기록은 그대로 둔다)
    const changed = ckChangedRows();
    const miss = changed.filter(r=>{ const rec = checkRecords[r.s.id]; return reasonListOf(rec.typeIds) && !rec.reason; });
    if(miss.length){
      toast(`사유를 골라 주세요 — ${miss.slice(0,3).map(r=>r.s.name).join(', ')}${miss.length>3?` 외 ${miss.length-3}명`:''}`,'err');
      if(!ctx.rows.includes(miss[0])){ checkGradeFilter = ''; const g = $I('ck-grade'); if(g) g.value = ''; _keepCk = { y: window.scrollY }; await loadCheckBody(true); }
      CK_Q = ''; CK_ONLYABN = false; const q=$I('ck-q'); if(q) q.value=''; const ab=$I('ck-abn'); if(ab) ab.checked=false;
      if(CK_VIEW==='tile') CK_SEL = miss[0].s.id;
      paintList();
      const el = $I('row-'+miss[0].s.id) || $I('ck-panel'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      return false;
    }
    // 쓰는 것: 바꾼 아이 + 화면에 보이는 «기록 없는» 아이(→ 출석). 그대로인 기록은 «입력한 사람 · 때»를 덮지 않게 건너뜀
    const work = changed.slice();
    ctx.rows.forEach(r=>{ const rec = checkRecords[r.s.id]; if(edOf(r) && rec && !rec.id && rec.typeIds && rec.typeIds.length && !work.includes(r)) work.push(r); });
    if(!work.length){ toast('바뀐 것이 없어요.'); return false; }
    toast('저장 중...');
    const changedCls = new Map(); let done = 0;
    let batch = writeBatch(db), part = [];
    const flush = async ()=>{
      if(!part.length) return;
      await batch.commit();
      // 들어간 것은 바로 «저장됨»으로 — 다음 묶음이 실패해도 이미 들어간 아이가 다시 새로 만들어지지 않게
      part.forEach(([sid, id, data])=>{ const rec = checkRecords[sid]; if(rec){ rec.id = id; rec.cid = data.classId; rec.raw = Object.assign({}, rec.raw||{}, data); rec.orig = recSig(rec); } });
      done += part.length; batch = writeBatch(db); part = [];
    };
    for(const r of work){
      const s = r.s, rec = checkRecords[s.id];
      const cls = recCls(r);   // 이미 있던 기록은 원래 반 그대로
      const data = {
        studentId: s.id, studentName: s.name, classId: cls.id, className: cls.name,
        org: cls.org, date: checkDate, month: String(checkDate).slice(0,7), typeId: rec.typeIds[0], typeIds: [...rec.typeIds],
        reason: rec.reason||'', memo: String(rec.memo||'').trim(),
        by: CU.name, byUid: CU.uid, updatedAt: Timestamp.now()
      };
      let ref;
      if(rec.id){ ref = doc(db,'studentAttendance',rec.id); batch.set(ref, data, { merge:true }); }   // 다른 기기에서 지워졌어도 실패하지 않게
      else { ref = doc(collection(db,'studentAttendance')); data.createdAt = Timestamp.now(); batch.set(ref, data); }
      part.push([s.id, ref.id, data]);
      if(recChanged(s.id)) changedCls.set(cls.id, cls);
      if(part.length >= 400) await flush();
    }
    await flush();
    saDrop();
    logActivity('수정','출석부',`${sc.label} ${checkDate} (${done}명)`);
    toast(`${done}명 출결이 저장되었습니다.`,'ok');
    // 결석·지각 알림 (담임·대리 + 부서장·관리자에게, 본인 제외) — 이번에 바뀐 반(실제로 쓴 반)만
    changedCls.forEach(c=>{
      sendAbsenceAlert(c, checkDate, all.filter(r=>recCls(r).id===c.id).map(r=>r.s));
      dailyEv('attend', { classId: c.id, date: checkDate });   // 🔔 v135 휴대폰 알림 — 서버가 바뀐 결석 · 지각 · 조퇴만 판단
    });
    await loadCheckBody();
    return true;
  } catch(e){
    saDrop();
    toast('저장 실패: '+(e.message||'')+' — 고른 것은 그대로 있어요. 다시 «저장»을 눌러 주세요.','err');
    paintCk();   // 고른 것은 지우지 않는다 (들어간 묶음은 이미 «저장됨»으로 바뀌어 있음)
    return false;
  } finally {
    CK_SAVING = false;
    document.querySelectorAll('[data-act="save"]').forEach(b=>{ b.disabled = false; });
  }
}

/* ── 지우기 (쉬는 날에 잘못 들어간 기록 등) · 10초 되돌리기 ── */
async function delDayRecords(){
  const ctx = CK_CTX; const sc = ctx && scopeOf(checkClassId); if(!sc) return;
  if(ctx.want!==checkClassId+'|'+checkDate || checkKey!==ctx.want) return;   // 다른 날짜 · 반을 받는 중이면 하지 않는다
  const all = scopeRows(sc).filter(r=>(!checkGradeFilter || r.grade===checkGradeFilter) && canEditClass(r.c) && canEditClass(recCls(r)));
  const items = all.map(r=>checkRecords[r.s.id]).filter(rec=>rec && rec.id && rec.raw).map(rec=>({ id:rec.id, data:rec.raw }));
  if(!items.length) return;
  if(!confirm(`${checkDate} · ${sc.label} — 출결 기록 ${items.length}건을 지울까요?\n\n지운 뒤 10초 안에는 «되돌리기»로 살릴 수 있어요.`)) return;
  await deleteRecs(items, `${sc.label} ${checkDate}`, ()=>loadCheckBody());
}
async function deleteRecs(items, label, after){
  let ok = 0; const gone = [];
  for(let i = 0; i < items.length; i += 400){
    const part = items.slice(i, i+400), b = writeBatch(db);
    part.forEach(it=>b.delete(doc(db,'studentAttendance',it.id)));
    try { await b.commit(); ok += part.length; gone.push(...part); }
    catch(e){ toast(/permission|insufficient/i.test(e.message||'') ? '🔒 잠긴 달의 기록이 섞여 있어 지우지 못했어요 — 잠금을 푼 뒤 다시 해 주세요.' : '지우기 실패: '+(e.message||''),'err'); break; }
  }
  saDrop();
  if(ok){
    logActivity('삭제','출석부', label, `${ok}건`);
    showUndo(`${ok}건을 지웠어요`, async ()=>{
      for(let i = 0; i < gone.length; i += 400){ const b = writeBatch(db); gone.slice(i, i+400).forEach(it=>b.set(doc(db,'studentAttendance',it.id), it.data)); await b.commit(); }
      saDrop(); logActivity('되돌리기','출석부', label, `${gone.length}건`);
    }, after);
  }
  if(after) after();
  return ok;
}
function showUndo(msg, undo, after){
  const old = $I('undo-bar'); if(old){ clearInterval(old._tm); old.remove(); }
  const bar = document.createElement('div'); bar.id = 'undo-bar'; bar.className = 'undo-bar'; bar.setAttribute('role','status');
  bar.innerHTML = `<span>${esc(msg)} · 활동 기록에 남겼어요</span><button type="button">되돌리기 <b>10</b></button>`;
  document.body.appendChild(bar);
  let left = 10; const bt = bar.querySelector('button');
  bar._tm = setInterval(()=>{ left--; if(left <= 0){ clearInterval(bar._tm); bar.remove(); } else bt.querySelector('b').textContent = left; }, 1000);
  bt.onclick = async ()=>{
    clearInterval(bar._tm); bar.remove();
    try { await undo(); toast('되돌렸어요','ok'); } catch(e){ toast('되돌리기 실패: '+(e.message||''),'err'); }
    if(after) after();
  };
}

// 결석·지각 요약 알림
async function sendAbsenceAlert(c, dateStr, studs){
  try {
    // 결석/지각 등 '출석 아닌' 학생 모으기
    const abnormal = [];
    studs.forEach(s=>{
      const rec = checkRecords[s.id];
      const tids = rec ? (rec.typeIds||[]) : [];
      const bad = tids.map(id=>TYPES.find(x=>x.id===id)).filter(t=>t && !t.isPresent);
      if(bad.length){ abnormal.push({name:s.name, type:bad.map(t=>t.name).join('·')}); }
    });
    if(!abnormal.length) return; // 다 정상 출석이면 알림 없음

    // 알림 대상 uid 수집: 담임 + 대리 + 같은 기관 관리자(org_admin/super) + 같은 부서 부서장(tab_admin)
    const targets = new Set();
    if(c.teacherUid) targets.add(c.teacherUid);
    (c.deputies||[]).forEach(u=>targets.add(u));
    const snap = await cachedCol(db, 'staff', { uid: CU && CU.uid, ms: 10 * 60000 }).then(s=>(window.hideTest?hideTest(s):s));
    snap.forEach(d=>{
      const st = d.data();
      if((st.acStatus||'active')!=='active') return;
      const stOrgs = st.role==='super' ? ['jihyebit','daniel'] : (st.orgs&&st.orgs.length?st.orgs:[st.org]);
      // 슈퍼·기관관리자: 해당 기관이면
      if((st.role==='super'||st.role==='org_admin') && stOrgs.includes(c.org)) targets.add(d.id);
      // 부서장: 같은 기관+같은 부서
      if(st.role==='tab_admin' && stOrgs.includes(c.org) && (st.dept===c.dept || c.dept==='행정실')) targets.add(d.id);
    });
    targets.delete(CU.uid); // 방금 체크한 본인 제외
    const toUids = [...targets];
    if(!toUids.length) return;
    // 대상 이름
    const nameMap = {};
    snap.forEach(d=>{ nameMap[d.id]=d.data().name; });
    const toNames = toUids.map(u=>nameMap[u]||'');
    // 메시지 작성
    const summary = abnormal.map(a=>`${a.name}(${a.type})`).join(', ');
    const [y,m,dd] = dateStr.split('-');
    const subject = `[출결] ${c.name} ${Number(m)}/${Number(dd)} 결석·지각 ${abnormal.length}명`;
    const body = `${ORGS[c.org]||c.org} ${c.name}\n${dateStr} 출결 특이사항\n\n${summary}\n\n(기록: ${CU.name})`;
    await addDoc(collection(db,'messages'), {
      fromUid:CU.uid, fromName:CU.name,
      toUids, toNames, unread:[...toUids],
      subject, body, readBy:[],
      createdAt:Timestamp.now()
    });
  } catch(e){ console.error('결석 알림 실패', e); }
}

// 반/학년 필터 옵션 채우기 (선택된 기관 기준)
function fillStatFilters(){
  const orgClasses = CLASSES.filter(c=>c.org===statOrg);
  const clsEl = $I('st-class');
  if(clsEl){
    clsEl.innerHTML = '<option value="">전체 반</option>' +
      sortClasses(orgClasses).map(c=>`<option value="${c.id}"${c.id===statClassFilter?' selected':''}>${c.grade?'['+c.grade+'] ':''}${c.name}</option>`).join('');
  }
  // 학년 목록 (반 grades에 등장하는 학년 + 반 grade)
  const gradeSet = new Set();
  orgClasses.forEach(c=>{ Object.values(c.grades||{}).forEach(g=>gradeSet.add(g)); });
  const gEl = $I('st-grade');
  if(gEl){
    const arr = sortGrades(Array.from(gradeSet));
    gEl.innerHTML = '<option value="">전체 학년</option>' +
      arr.map(g=>`<option value="${g}"${g===statGradeFilter?' selected':''}>${g}</option>`).join('');

}
window.fillStatFilters = fillStatFilters;

function onStatChange(){
  const prevOrg = statOrg;
  if($I('st-year')) statYear = Number($I('st-year').value);
  statOrg = (window.OrgBar && OrgBar.current) || statOrg;
  if($I('st-term')) statTermSel = $I('st-term').value;
  statView = $I('st-view')?.value || statView;
  statClassFilter = $I('st-class')?.value || '';
  statGradeFilter = $I('st-grade')?.value || '';
  if(statView === 'live'){ renderLive(); return; }        // 🔴 실시간 판으로 전환
  if(prevOrg !== statOrg){ statClassFilter=''; statGradeFilter=''; fillStatFilters(); }
  // 실시간 판에서 일반 통계로 돌아올 때는 화면 틀부터 다시 그린다 (연도·학기 칸 복원)
  if(!$I('st-year')){ stopLive(); renderStat(); return; }
  stopLive();
  buildStat();
}
window.onStatChange = onStatChange;

// 선택된 학기들의 수업일 집합 + 라벨
function getStatTerms(){
  const sel = [];
  const want = statTermSel==='year' ? [1,2] : [Number(statTermSel)];
  for(const tn of want){
    const t = TERMS.find(x=>x.year===statYear && x.org===statOrg && x.term===tn);
    if(t) sel.push(t);
  }
  return sel;
}

let _statCache = null;
async function buildStat(){
  const body = $I('st-body'); if(!body) return;
  body.innerHTML = '<div class="acard"><p class="empty">집계 중...</p></div>';

  // 월별 달력 보기는 별도 흐름
  if(statView==='month'){ buildMonthlyCalendar(); return; }
  if(statView==='week'){ buildWeeklyStat(); return; }

  const terms = getStatTerms();
  if(!terms.length){
    body.innerHTML = `<div class="acard"><div class="empty">선택한 학기가 등록되지 않았습니다.<br>설정 탭에서 ${statYear}년 ${ORGS[statOrg]} 학기를 먼저 등록해주세요.</div></div>`;
    return;
  }

  // 수업일 집합
  let schoolDays = [];
  terms.forEach(t=>{ schoolDays = schoolDays.concat(calcSchoolDays(t)); });
  const schoolDaySet = new Set(schoolDays);
  const totalDays = schoolDaySet.size;
  const minDate = schoolDays.length ? schoolDays.reduce((a,b)=>a<b?a:b) : '';
  const maxDate = schoolDays.length ? schoolDays.reduce((a,b)=>a>b?a:b) : '';

  // 출결 기록 로드 (이 기관) — 📉 v120 수업일 기간만 (예전: 모든 기록)
  const snap = minDate ? await saRange(minDate, maxDate) : { forEach(){} };
  const recs = [], offRecs = [];   // 🗓 v174 쉬는 날(주말 · 휴일 · 방학)에 들어간 기록은 세지 않고 따로 표시
  snap.forEach(d=>{ const r=d.data(); if(r.org!==statOrg) return; if(schoolDaySet.has(r.date)) recs.push(r); else offRecs.push(r); });

  // 출석 인정 타입 id 집합
  const presentIds = new Set(TYPES.filter(t=>t.isPresent).map(t=>t.id));
  const typeName = id => (TYPES.find(t=>t.id===id)?.name)||'기타';

  // 이 기관·올해 반들
  const orgClasses = CLASSES.filter(c=>c.org===statOrg);
  // 학생 → 반 매핑
  const studClass = {};
  orgClasses.forEach(c=>(c.students||[]).forEach(sid=>{ studClass[sid]=c; }));

  // 학생별 집계: {studentId: {name, className, grade, dept, counts, present, recorded, myTotal}}
  const byStud = {};
  // 대상 학생 = 이 기관 반에 배정된 재학생
  orgClasses.forEach(c=>{
    // 반 필터 적용
    if(statClassFilter && c.id!==statClassFilter) return;
    (c.students||[]).forEach(sid=>{
      const s = STUDENTS[sid]; if(!s || !StuStatus.enrolled(s)) return;
      const grade = (c.grades||{})[sid] || '';
      // 학년 필터 적용
      if(statGradeFilter && grade!==statGradeFilter) return;
      if(!byStud[sid]){
        // 개인 수업일수 = 전체 수업일 − 본인 휴학 기간에 걸린 수업일
        const leaveDays = leaveDaysInSet(s, schoolDaySet);
        if(totalDays>0 && leaveDays>=totalDays) return;   // 기간 내내 휴학 → 집계에서 뺀다
        byStud[sid]={sid, off:0, name:s.name, studentNo:s.studentNo||'', className:c.name, grade:grade||'(학년미지정)', dept:c.dept||'', classId:c.id, counts:{}, present:0, recorded:0, myTotal: Math.max(0, totalDays - leaveDays), leaveDays};
      }
    });
  });
  // 기록 반영 (휴학 기간에 잘못 기록된 건 제외)
  recs.forEach(r=>{
    const b = byStud[r.studentId]; if(!b) return;
    const s = STUDENTS[r.studentId];
    if(isOnLeave(s, r.date)) return;  // 휴학 중 기록은 무시
    const tids = recTypes(r);
    tids.forEach(id=>{ const tn = typeName(id); b.counts[tn]=(b.counts[tn]||0)+1; });
    b.recorded++;
    // 그 날의 모든 항목이 «출석 인정»일 때만 출석으로 센다 (하나라도 결석 처리면 결석)
    if(tids.length && tids.every(id=>presentIds.has(id))) b.present++;
  });
  offRecs.forEach(r=>{ const b = byStud[r.studentId]; if(b) b.off++; });
  // 기록 없는 날은 "출석"으로 간주 (개인 수업일 기준)
  Object.values(byStud).forEach(b=>{
    const autoPresent = b.myTotal - b.recorded;
    if(autoPresent>0){ b.present += autoPresent; b.counts['출석']=(b.counts['출석']||0)+autoPresent; }
  });

  _statCache = {byStud, totalDays, minDate, maxDate, terms};

  // 보기별 렌더
  if(statView==='student') renderStatStudent(byStud, totalDays, minDate, maxDate);
  else if(statView==='class') renderStatGroup(byStud, totalDays, 'className', '반');
  else if(statView==='grade') renderStatGroup(byStud, totalDays, 'grade', '학년');
  else if(statView==='dept') renderStatGroup(byStud, totalDays, 'dept', '부서');
  else renderStatAll(byStud, totalDays, minDate, maxDate);
}

function periodLabel(min,max){ return min&&max?`${min} ~ ${max}`:''; }

  const rows = list.map(b=>{
    const denom = b.myTotal!=null ? b.myTotal : totalDays;

      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd);font-weight:600"><button type="button" class="nmb" onclick="openStuRec('${b.sid}')" title="${escA(b.name)} 기록을 날짜별로 보기">${esc(b.name)}</button>${b.off?`<button type="button" class="offb" onclick="openStuRec('${b.sid}', true)" title="쉬는 날에 들어간 기록 — 통계에는 세지 않아요">쉬는 날 ${b.off}</button>`:''}${leaveNote}</td>
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd)">${b.className}</td>
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd)">${b.grade||'-'}</td>
      ${cols.map(c=>`<td style="padding:7px 8px;border-bottom:1px solid var(--ivd);text-align:center">${b.counts[c]||0}</td>`).join('')}
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd);text-align:center">${denom}</td>
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd);text-align:center;font-weight:700;color:${rate>=90?'#16a34a':rate>=70?'#b45309':'#dc2626'}">${rate}%</td>
    </tr>`;
  }).join('');
  $I('st-body').innerHTML = `
    <div class="acard">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <h3 class="actitle" style="margin:0">학생별 출석 (${list.length}명)</h3>
        <span style="font-size:12px;color:var(--ts)">수업일 ${totalDays}일 · ${periodLabel(minDate,maxDate)} · <b>이름을 누르면 그 아이 기록이 날짜별로 열려요</b></span>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap">
          <thead><tr style="background:var(--iv)">
            <th style="padding:8px;text-align:left">이름</th><th style="padding:8px;text-align:left">반</th><th style="padding:8px;text-align:left">학년</th>
            ${cols.map(c=>`<th style="padding:8px;text-align:center">${c}</th>`).join('')}
            <th style="padding:8px;text-align:center">수업일</th>
            <th style="padding:8px;text-align:center">출석률</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderStatGroup(byStud, totalDays, key, label){
  // 그룹별 합산
  const groups = {};
  Object.values(byStud).forEach(b=>{
    const g = b[key]||'(미지정)';
    if(!groups[g]) groups[g]={count:0, present:0, possible:0, counts:{}};
    groups[g].count++;
    groups[g].present += b.present;
    groups[g].possible += (b.myTotal!=null ? b.myTotal : totalDays);
    Object.entries(b.counts).forEach(([k,v])=>groups[g].counts[k]=(groups[g].counts[k]||0)+v);
  });
  const cols = TYPES.map(t=>t.name);
  // 학년별/반별은 학년순, 그 외(부서 등)는 이름순
  const useGradeSort = (key==='grade' || key==='className');
  const sortFn = useGradeSort
    ? (a,b)=> gradeRank(a[0])-gradeRank(b[0]) || a[0].localeCompare(b[0],'ko')
    : (a,b)=> a[0].localeCompare(b[0],'ko');
  const rows = Object.entries(groups).sort(sortFn).map(([g,d])=>{
    const rate = d.possible? Math.round(d.present/d.possible*100):0;
    return `<tr>
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd);font-weight:600">${g}</td>
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd);text-align:center">${d.count}명</td>
      ${cols.map(c=>`<td style="padding:7px 8px;border-bottom:1px solid var(--ivd);text-align:center">${d.counts[c]||0}</td>`).join('')}
      <td style="padding:7px 8px;border-bottom:1px solid var(--ivd);text-align:center;font-weight:700;color:${rate>=90?'#16a34a':rate>=70?'#b45309':'#dc2626'}">${rate}%</td>
    </tr>`;
  }).join('');
  $I('st-body').innerHTML = `
    <div class="acard">
      <h3 class="actitle">${label}별 출석 · 수업일 ${totalDays}일</h3>
      <div style="overflow-x:auto;margin-top:10px">
        <table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap">
          <thead><tr style="background:var(--iv)">
            <th style="padding:8px;text-align:left">${label}</th><th style="padding:8px;text-align:center">인원</th>
            ${cols.map(c=>`<th style="padding:8px;text-align:center">${c}</th>`).join('')}
            <th style="padding:8px;text-align:center">평균 출석률</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderStatAll(byStud, totalDays, minDate, maxDate){
  const list = Object.values(byStud);
  const totalStud = list.length;
  const totalPresent = list.reduce((s,b)=>s+b.present,0);
  const totalPossible = list.reduce((s,b)=>s+(b.myTotal!=null?b.myTotal:totalDays),0);
  const avgRate = totalPossible? Math.round(totalPresent/totalPossible*100):0;
  const allCounts = {};
  list.forEach(b=>Object.entries(b.counts).forEach(([k,v])=>allCounts[k]=(allCounts[k]||0)+v));
  const stat=(label,val,color)=>`<div style="flex:1;min-width:90px;background:var(--iv);border-radius:10px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:${color||'var(--gm)'}">${val}</div><div style="font-size:11px;color:var(--ts);margin-top:2px">${label}</div></div>`;
  const typeRows = TYPES.map(t=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ivd);font-size:13px"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${t.color};margin-right:6px"></span>${t.name}</span><span style="font-weight:700">${allCounts[t.name]||0}건</span></div>`).join('');
  $I('st-body').innerHTML = `
    <div class="acard">
      <h3 class="actitle">전체 출석 현황 · 수업일 ${totalDays}일</h3>
      <p class="adesc">${periodLabel(minDate,maxDate)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        ${stat('대상 학생',totalStud+'명')}
        ${stat('수업일',totalDays+'일')}
        ${stat('평균 출석률',avgRate+'%',avgRate>=90?'#16a34a':'#b45309')}
      </div>
      <div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">항목별 합계</div>
      ${typeRows}
    </div>`;
}

// 엑셀 다운로드 (현재 보기 기준)
function downloadStatExcel(){
  if(!_statCache){ toast('먼저 통계를 조회하세요.','err'); return; }
  const {byStud, totalDays, terms} = _statCache;
  const cols = TYPES.map(t=>t.name);
  const header = ['이름','학번','반','부서', ...cols, '수업일','출석률(%)'];
  const aoa = [header];
  Object.values(byStud).sort((a,b)=>(a.className+a.name).localeCompare(b.className+b.name,'ko')).forEach(b=>{
    const denom = b.myTotal!=null ? b.myTotal : totalDays;
    const rate = denom? Math.round(b.present/denom*100):0;
    aoa.push([b.name, b.studentNo, b.className, b.dept, ...cols.map(c=>b.counts[c]||0), denom, rate]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = header.map(h=>({wch:Math.max(h.length,8)}));
  const wb = XLSX.utils.book_new();
  const termLabel = statTermSel==='year'?'연간':TERM_NAMES[Number(statTermSel)];
  XLSX.utils.book_append_sheet(wb, ws, '출석통계');
  XLSX.writeFile(wb, `출석통계_${statYear}_${ORGS[statOrg]}_${termLabel}.xlsx`);
  toast('엑셀을 다운로드했습니다.','ok');
}
window.downloadStatExcel = downloadStatExcel;

function mondayOf(d){ const x=new Date(d); const day=x.getDay(); const diff=(day===0?-6:1-day); x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x; }

async function buildWeeklyStat(){
  const body = $I('st-body'); if(!body) return;
  if(!statWeekMonday) statWeekMonday = mondayOf(new Date());
  const mon = new Date(statWeekMonday);
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const weekStart = dstr(days[0]), weekEnd = dstr(days[6]);
  const dowName=['월','화','수','목','금','토','일'];

  const orgClasses = sortClasses(CLASSES.filter(c=>c.org===statOrg));
  // 이 주 출결 기록 로드 — 📉 v120 이 주만
  const snap = await inRange(db,'studentAttendance', weekStart, weekEnd);
  const recs = [];
  snap.forEach(d0=>{ const r=d0.data(); if(r.org===statOrg && r.date>=weekStart && r.date<=weekEnd && !isOnLeave(STUDENTS[r.studentId], r.date)) recs.push(r); });
  const typeById={}; TYPES.forEach(t=>typeById[t.id]=t);

  // 반별 집계 (결석·지각 등 비출석만)
  const rows = orgClasses.map(c=>{
    const cRecs = recs.filter(r=>r.classId===c.id);
    const abn = cRecs.filter(r=> recTypes(r).some(id=>{ const t=typeById[id]; return t && !t.isPresent; }));
    if(!abn.length) return `<tr><td style="padding:7px 10px;border-bottom:1px solid var(--ivd)">${c.grade?'['+c.grade+'] ':''}${c.name}</td><td colspan="2" style="padding:7px 10px;border-bottom:1px solid var(--ivd);color:var(--tl)">특이사항 없음</td></tr>`;
    // 유형별 카운트
    const byType={};
    abn.forEach(r=> recTypes(r).forEach(id=>{ const t=typeById[id]; if(t && !t.isPresent){ byType[t.name]=(byType[t.name]||0)+1; } }));
    const typeSummary = Object.entries(byType).map(([n,cnt])=>`${n} ${cnt}`).join(', ');
    const detail = abn.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>{
      const bad = recTypes(r).map(id=>typeById[id]).filter(t=>t && !t.isPresent);
      const t = bad[0];
      return `<span style="display:inline-block;font-size:11px;background:${t?t.color:'#999'}22;color:${t?t.color:'#999'};padding:1px 7px;border-radius:100px;margin:1px">${r.studentName} ${Number(r.date.slice(5,7))}/${Number(r.date.slice(8,10))} ${bad.map(x=>x.name).join('·')}</span>`;
    }).join(' ');
