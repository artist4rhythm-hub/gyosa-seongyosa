async function loadMonthlyBody(){
  const body = $I('mc-body'); if(!body) return;
  const c = CLASSES.find(x=>x.id===statMonthClassId); if(!c) return;
  const studs = rollOf(c).sort((a,b)=>a.name.localeCompare(b.name,'ko'));

  // 그 달의 날짜들
  const y = statYear, m = statMonth;
  const lastDay = new Date(y, m, 0).getDate();
  const days = [];
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const dow = new Date(ds+'T00:00:00').getDay();
    const hol = holidayReason(ds, c.org);
    // 학기 기간 안인지 (학기 객체면 true, null/'none'이면 false)
    const tm = termOfDate(ds, c.org);
    const inTerm = (tm && tm!=='none');
    days.push({d, ds, dow, isWeekend:dow===0||dow===6, hol, inTerm});
  }

  // 출결 기록 로드 (이 반·이 달) — 📉 v120 서버에도 «이 반 · 이 달»만
  const snap = await eqInDays(db,'studentAttendance','classId', statMonthClassId, `${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(lastDay)}`);
  const recMap = {};  // studentId -> {date -> typeId}
  const prefix = `${y}-${pad(m)}`;
  snap.forEach(doc0=>{ const r=doc0.data(); if(r.classId===statMonthClassId && (r.date||'').startsWith(prefix)){ (recMap[r.studentId]=recMap[r.studentId]||{})[r.date]=recTypes(r); } });

  const typeById = {}; TYPES.forEach(t=>typeById[t.id]=t);
  const presentIds = new Set(TYPES.filter(t=>t.isPresent).map(t=>t.id));
  const defType = TYPES.find(t=>t.isPresent) || TYPES[0];

  // 수업일(학기 안 + 평일 + 휴일아님) 카운트
  const schoolDays = days.filter(x=>x.inTerm && !x.isWeekend && !x.hol);
  const totalSchool = schoolDays.length;

  if(!studs.length){
    body.innerHTML = `<div class="acard"><div class="empty">이 반에 배정된 재학생이 없습니다.</div></div>`;
    return;
  }

  const dowName = ['일','월','화','수','목','금','토'];

  // 헤더 (날짜)
  const headCells = days.map(x=>{
    const bg = !x.inTerm?'var(--gray-bg)':x.hol?'var(--danger-bg)':x.isWeekend?'var(--iv)':'transparent';
    const col = x.dow===0?'#dc2626':x.dow===6?'#2563eb':'var(--ts)';
    const ttl = !x.inTerm?(x.ds+' 학기 외'):(x.ds+(x.hol?' '+x.hol:''));
    return `<th style="padding:2px;min-width:22px;background:${bg};font-size:10px;color:${col};font-weight:600" title="${ttl}">${x.d}<br><span style="font-size:9px">${dowName[x.dow]}</span></th>`;
  }).join('');

  // 학생별 행
  const rows = studs.map(s=>{
    const rec = recMap[s.id] || {};
    let present=0;
    // 개인 수업일 = 이 달 수업일 − 휴학인 날
    const myTotal = totalSchool - schoolDays.filter(x=>isOnLeave(s, x.ds)).length;
    const cells = days.map(x=>{
      if(!x.inTerm) return `<td style="background:var(--gray-bg);border:1px solid var(--ivd)"></td>`;
      if(x.isWeekend || x.hol) return `<td style="background:${x.hol?'var(--danger-bg)':'var(--iv)'};border:1px solid var(--ivd)"></td>`;
      if(isOnLeave(s, x.ds)) return `<td title="${x.ds} 휴학 중" style="border:1px solid var(--ivd);text-align:center;font-size:10px;color:var(--warn)">휴</td>`;
      // 기록 없으면 기본 출석
      const tids = rec[x.ds] || (defType?[defType.id]:[]);
      const isDefault = !rec[x.ds];
      if(tids.length && tids.every(id=>presentIds.has(id))) present++;
      const names = tids.map(id=>typeById[id]?.name||'').filter(Boolean).join('·');
      const dotSpans = tids.slice(0,2).map(id=>{ const t=typeById[id];
        return t?`<span style="display:inline-block;width:${tids.length>1?8:14}px;height:14px;border-radius:8px;background:${t.color};opacity:${isDefault?0.25:1}"></span>`:''; }).join('');
      const dot = dotSpans ? `<span title="${names}" style="display:inline-flex;gap:1px;vertical-align:middle">${dotSpans}</span>` : '';
      return `<td style="border:1px solid var(--ivd);text-align:center;padding:1px">${dot}</td>`;
    }).join('');
    const rate = myTotal>0 ? Math.round(present/myTotal*100) : 0;
    // 월간 합계 막대
    const bar = myTotal>0
      ? `<div style="display:flex;align-items:center;gap:4px"><div style="flex:1;background:var(--ivd);border-radius:8px;height:10px;min-width:40px;overflow:hidden"><div style="width:${rate}%;height:100%;background:${rate>=90?'var(--ok)':rate>=70?'var(--warn)':'var(--danger)'}"></div></div><span style="font-size:11px;font-weight:700;color:${rate>=90?'var(--ok)':rate>=70?'var(--warn)':'var(--danger)'};white-space:nowrap">${present}/${myTotal}</span></div>`
      : `<span style="font-size:11px;font-weight:700;color:var(--warn)">휴학</span>`;
    return `<tr>
      <td style="position:sticky;left:0;background:var(--wh);padding:4px 8px;font-size:13px;font-weight:600;white-space:nowrap;border-right:2px solid var(--ivd)">${s.name}${(c.grades&&c.grades[s.id])?`<span style="color:var(--gm);font-size:10px;font-weight:700;margin-left:4px">${c.grades[s.id]}</span>`:''}</td>
      ${cells}
      <td style="padding:4px 8px;min-width:90px">${bar}</td>
    </tr>`;
  }).join('');

  // 범례
  const legend = TYPES.map(t=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px"><span style="width:12px;height:12px;border-radius:8px;background:${t.color}"></span>${t.name}</span>`).join('');

  body.innerHTML = `
    <div class="acard">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <h3 class="actitle" style="margin:0">${c.name} · ${y}년 ${m}월</h3>
        <span style="font-size:12px;color:var(--ts)">수업일 ${totalSchool}일 · 학생 ${studs.length}명</span>
      </div>
      <div style="margin-bottom:10px">${legend}<span style="font-size:11px;color:var(--tl);margin-left:6px">(연한 색 = 자동 출석, 진한 색 = 직접 기록)</span></div>
      <div style="overflow-x:auto">
        <table style="border-collapse:collapse;font-size:12px">
          <thead><tr>
            <th style="position:sticky;left:0;background:var(--iv);padding:4px 8px;border-right:2px solid var(--ivd);font-size:12px">학생</th>
            ${headCells}
            <th style="padding:4px 8px;font-size:12px">월간 출석</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}
window.loadMonthlyBody = loadMonthlyBody;

async function srClick(e){

    const up = { typeId:e2.typeIds[0], typeIds:e2.typeIds, reason:e2.reason||'', memo:String(e2.memo||'').trim(), by:CU.name, byUid:CU.uid, updatedAt:Timestamp.now() };

    return;
  }

    const x = st.recs.find(y=>y.id===b.dataset.id); if(!x) return;
    const nm = recTypes(x.r).map(id=>TYPES.find(t=>t.id===id)?.name||'').filter(Boolean).join('·');

    return;
  }
  if(a==='deloff'){
    const items = st.recs.filter(x=>srIsOff(x) && srCanEd(x)).map(x=>({ id:x.id, data:x.r }));
    if(!items.length) return;
    if(!confirm(`쉬는 날에 들어간 기록 ${items.length}건을 지울까요?\n\n지운 뒤 10초 안에는 «되돌리기»로 살릴 수 있어요.`)) return;
    await deleteRecs(items, `${STUDENTS[st.sid]?.name||''} 쉬는 날 기록`, ()=>{ if(SR===st) loadSR(); srRefreshBehind(); });
    return;
  }
  if(a==='xlsx'){
    const s = STUDENTS[st.sid] || {};
    const aoa = [['날짜','요일','항목','사유','메모','쉬는 날','입력한 사람','입력 때','반']];
    st.recs.forEach(x=>{ const r = x.r; aoa.push([r.date, WDK[new Date(r.date+'T00:00:00').getDay()], recTypes(r).map(id=>TYPES.find(t=>t.id===id)?.name||'').join('·'), r.reason||'', r.memo||'', srIsOff(x)?offWhy(r.date, r.org):'', r.by||'', tsText(r.updatedAt||r.createdAt), classOfStu(r.studentId, r.org, r.classId)?.name||'' ]); });
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [12,6,14,12,30,10,10,12,12].map(w=>({wch:w}));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '출결기록');
    XLSX.writeFile(wb, `출결기록_${s.name||''}_${st.label.replace(/\s+/g,'_')}.xlsx`);
    toast('엑셀을 받았어요.','ok');
  }

function tripSibs(){
  const T = TRIP, s = STUDENTS[T.sid] || {};
  return (s.siblings||[]).filter(o=>o!==T.sid && STUDENTS[o] && StuStatus.enrolled(STUDENTS[o]) && STUDENTS[o].org===T.sc.org && tripClassOf(o, T.sc.org));
}
function tripStus(){ return [TRIP.sid, ...tripSibs().filter(o=>!TRIP.sibOff.has(o))]; }
function tripDraw(){
  const T = TRIP; if(!T) return;
  const sb = tripSibs();
  $I('trip-sibs').innerHTML = sb.length ? `<div style="background:#F7EFD8;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px">${sb.map(o=>`<label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#5C430D;cursor:pointer"><input type="checkbox" data-tsib="${o}"${T.sibOff.has(o)?'':' checked'} style="width:19px;height:19px;accent-color:#8A6410"> 형제 ${esc(STUDENTS[o].name)}(${esc(tripClassOf(o, T.sc.org).name)})도 같은 기간으로</label>`).join('')}</div>` : '';
  const rs = REASONS['체험학습'] || ['기타'];
  $I('trip-rs').innerHTML = rs.map(x=>`<button type="button" class="ckr-c${T.reason===x?' on':''}" data-ta="reason" data-r="${escA(x)}" aria-pressed="${T.reason===x}" style="height:34px;padding:0 12px;font-size:13px">${esc(x)}</button>`).join('');
}
async function tripClick(e){
  const b = e.target.closest('[data-ta]'); if(!b || !TRIP) return;
  const a = b.dataset.ta;
  if(a==='close'){ TRIP = null; closeMod(); return; }
  if(a==='reason'){ TRIP.reason = TRIP.reason===b.dataset.r ? '' : b.dataset.r; tripDraw(); tripPreview(true); return; }
  if(a==='save') return tripSave();
}
// 한 아이 기록 (올해 · 기간이 걸친 해 전체) — 한 번 받아 두고 다시 씀
async function tripRecs(sid, y0, y1){
  const key = sid+'|'+y0+'|'+y1;
  if(TRIP.cache[key]) return TRIP.cache[key];
  const snap = await eqInDays(db,'studentAttendance','studentId', sid, `${y0}-01-01`, `${y1}-12-31`);
  const out = []; snap.forEach(d=>{ const r = d.data(); if(r.date>=`${y0}-01-01` && r.date<=`${y1}-12-31`) out.push({ id:d.id, r }); });
  return (TRIP.cache[key] = out);
}
async function tripPreview(quick){
  const T = TRIP; if(!T) return;
  const box = $I('trip-prev'), ok = $I('trip-ok');
  const seq = ++T.seq; T.plan = null; ok.disabled = true; ok.textContent = '입력';
  if(!T.sd || !T.ed || T.ed < T.sd){ box.innerHTML = `<p style="font-size:13px;color:var(--danger)">끝 날짜가 시작보다 앞이에요.</p>`; return; }
  const dates = datesBetween(T.sd, T.ed);
  if(dates.length > 62){ box.innerHTML = `<p style="font-size:13px;color:var(--danger)">한 번에 두 달(62일)까지 넣을 수 있어요.</p>`; return; }
  if(!quick) box.innerHTML = `<p style="font-size:13px;color:var(--tl)">계산하는 중…</p>`;
  const org = T.sc.org, tt = T.tt;
  try {
    // 잠긴 달
    const months = [...new Set(dates.map(d=>d.slice(0,7)))], locked = new Set();
    await Promise.all(months.map(async mo=>{ try { const x = await getDoc(doc(db,'attendLocks', `${org}_${mo}`)); if(x.exists() && x.data().locked===true) locked.add(mo); } catch(e){} }));
    const y0 = Number(T.sd.slice(0,4)), y1 = Number(T.ed.slice(0,4));
    const stus = tripStus();
    const per = await Promise.all(stus.map(async sid=>{
      const s = STUDENTS[sid], recs = await tripRecs(sid, y0, y1);
      const at = {}; recs.forEach(x=>{ const cur = at[x.r.date]; if(!cur || (x.r.classId===(tripClassOf(sid, org)||{}).id)) at[x.r.date] = x; });
      const used = recs.filter(x=>x.r.date.slice(0,4)===String(y1) && recTypes(x.r).includes(tt.id) && isAutoPresentDate(x.r.date, org) && !isOnLeave(s, x.r.date)).length;
      const put = [];
      dates.forEach(d=>{
        if(!isAutoPresentDate(d, org) || isOnLeave(s, d) || locked.has(d.slice(0,7))) return;
        const ex = at[d];
        if(ex){ const ec = classOfStu(sid, org, ex.r.classId); if(ec && !canEditClass(ec)) return; }   // 다른 선생님 반 기록은 그대로
        if(ex && recTypes(ex.r).length===1 && recTypes(ex.r)[0]===tt.id && (ex.r.reason||'')===T.reason && (!T.memo.trim() || ex.r.memo===T.memo.trim())) return;   // 이미 같은 체험학습
        put.push({ sid, date:d, ex });
      });
      const already = dates.filter(d=>at[d] && recTypes(at[d].r).includes(tt.id) && isAutoPresentDate(d, org)).length;
      return { sid, s, put, used, already };
    }));
    if(seq !== T.seq) return;
    const s0 = STUDENTS[T.sid] || {};
    const dayCells = dates.map(d=>{
      const why = !isAutoPresentDate(d, org) ? offWhy(d, org) : locked.has(d.slice(0,7)) ? '잠긴 달' : isOnLeave(s0, d) ? '휴학 중' : '';
      return `<div class="${why?'skip':''}"><b>${md(d)}</b>${WDK[new Date(d+'T00:00:00').getDay()]} · ${why ? esc(why) : '체험'}</div>`;
    }).join('');
    const lim = Number(TRIP_LIMIT[org]) || 0;
    const nPut = per.reduce((a,p)=>a+p.put.length, 0);
    const nDays = new Set(per.flatMap(p=>p.put.map(x=>x.date))).size;
    const nSchool = dates.filter(d=>isAutoPresentDate(d, org)).length;
    const lines = per.map(p=>{
      const after = p.used + p.put.filter(x=>x.date.slice(0,4)===String(y1) && !(x.ex && recTypes(x.ex.r).includes(tt.id))).length;
      const over = lim && after > lim;
      return `<div style="font-size:13px;${over?'color:var(--danger);font-weight:700':''}">${esc(p.s.name)} — 올해 체험학습 ${p.used}일 → <b>${after}일</b>${lim?` (한도 ${lim}일${over?' · 넘어요!':''})`:''}${p.already?` · 이 기간에 이미 ${p.already}일 들어가 있음`:''}</div>`;
    }).join('');
    const changeEx = per.reduce((a,p)=>a+p.put.filter(x=>x.ex && !recTypes(x.ex.r).includes(tt.id)).length, 0);
    box.innerHTML = `<div style="font-size:13px;font-weight:800;margin-bottom:8px">이렇게 들어가요</div>
      <div class="trip-days">${dayCells}</div>
      <p style="font-size:13px;color:var(--ts);line-height:1.6;margin:10px 0 6px">수업일 <b style="color:#075985">${nSchool}일</b> 중 ${nDays}일 입력${dates.length-nSchool?` · 쉬는 날 ${dates.length-nSchool}일은 건너뜀`:''}${stus.length>1?` · 형제까지 기록 ${nPut}건`:''}${changeEx?` · <b style="color:#B45309">이미 다른 출결이 있던 ${changeEx}건은 체험학습으로 바뀜</b>`:''}</p>
      ${lines}
      ${!T.reason ? `<p style="font-size:12.5px;color:var(--danger);margin-top:6px">사유를 골라 주세요.</p>` : ''}`;
    T.plan = per.flatMap(p=>p.put);
    ok.disabled = !T.reason || !T.plan.length;
    ok.textContent = T.plan.length ? `${nDays}일 · ${T.plan.length}건 입력` : '넣을 날이 없어요';
  } catch(e){ if(seq===T.seq) box.innerHTML = `<p style="font-size:13px;color:var(--danger)">계산하지 못했어요 — ${esc(e.message||'')}</p>`; }
}
async function tripSave(){
  const T = TRIP; if(!T || T.busy) return;
  if(!T.reason){ toast('사유를 골라 주세요.','err'); return; }
  if(!T.plan || !T.plan.length) return;
  T.busy = true; const ok = $I('trip-ok'); if(ok){ ok.disabled = true; ok.textContent = '넣는 중…'; }
  const org = T.sc.org, tt = T.tt, memo = String(T.memo||'').trim();
  try {
    let batch = writeBatch(db), n = 0;
    for(const p of T.plan){
      const s = STUDENTS[p.sid];
      const base = { typeId:tt.id, typeIds:[tt.id], reason:T.reason, memo: memo || (p.ex && p.ex.r.memo) || '', by:CU.name, byUid:CU.uid, updatedAt:Timestamp.now() };
      if(p.ex) batch.update(doc(db,'studentAttendance',p.ex.id), base);
      else {
        const c = tripClassOf(p.sid, org); if(!c) continue;
        batch.set(doc(collection(db,'studentAttendance')), { studentId:p.sid, studentName:s.name, classId:c.id, className:c.name, org:c.org, date:p.date, month:p.date.slice(0,7), ...base, createdAt:Timestamp.now() });
      }
      if(++n >= 400){ await batch.commit(); batch = writeBatch(db); n = 0; }
    }
    if(n) await batch.commit();
    saDrop();
    const names = [...new Set(T.plan.map(p=>STUDENTS[p.sid]?.name||''))].join(', ');
    logActivity('수정','출석부',`체험학습 기간 ${T.sd}~${T.ed} · ${names}`, `${T.plan.length}건 · ${T.reason}`);
    toast(`체험학습 ${T.plan.length}건을 넣었어요`,'ok');
    TRIP = null; closeMod();
    if(curTab==='check' && checkMode==='daily') loadCheckBody();
  } catch(e){
    T.busy = false; if(ok){ ok.disabled = false; ok.textContent = '다시 입력'; }
    toast(/permission|insufficient/i.test(e.message||'') ? '🔒 잠긴 달이 섞여 있어 넣지 못했어요.' : '입력 실패: '+(e.message||''),'err');
  }
}

async function renderLockGrid(){
  const box = $I('lk-grid'); if(!box) return;
  const org = $I('lk-org')?.value || myOrgs()[0];
  const year = $I('lk-year')?.value || String(new Date().getFullYear());
  const canDo = CU && (CU.role==='super' || (CU.role==='org_admin' && myOrgs().includes(org)));
  const locks = {};
  try {
    const snap = await getDocs(collection(db,'attendLocks'));
    snap.forEach(d=>{ const v=d.data(); if(v.org===org && String(v.month||'').startsWith(year)) locks[v.month]=v; });
  } catch(e){}
  const now = new Date(); const curYM = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  box.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px">` +
    Array.from({length:12},(_,i)=>{
      const ym = `${year}-${pad(i+1)}`;
      const lk = locks[ym];
      const locked = lk && lk.locked===true;
      const isCur = ym===curYM;
      return `<button ${canDo?`onclick="lockToggle('${org}','${ym}',${locked?'false':'true'})"`:'disabled'}
        style="border:1.5px solid ${locked?'#EAD9A8':'var(--ivd)'};border-radius:11px;padding:11px 8px;cursor:${canDo?'pointer':'default'};
        background:${locked?'var(--gold-bg,#F7EFD8)':'var(--wh,#fff)'};font-family:inherit;text-align:center;${isCur?'outline:2px solid var(--gl)':''}">
        <div style="font-size:14px;font-weight:900;color:${locked?'#8A6410':'var(--gd)'}">${i+1}월 ${locked?'🔒':'🔓'}</div>
        <div style="font-size:9.5px;color:var(--tl);margin-top:3px;line-height:1.4">${locked?`잠김 · ${esc(lk.byName||'')}`:(canDo?'눌러서 잠그기':'열림')}</div>
      </button>`;
    }).join('') + `</div>
    <p style="font-size:11px;color:var(--tl);margin-top:9px">🔒 잠김 달은 월별 입력 화면에도 잠금 배지가 뜨고, 서버에서도 저장이 거부됩니다.</p>`;
}

window.lockToggle = async function(org, ym, lock){

                   : `${y}년 ${Number(m)}월(${ORGS[org]||org}) 잠금을 풀까요?`)) return;

    });

    if(typeof monthYM!=='undefined' && monthYM===ym) loadMonthBody();

};

// ── 출결 항목 순서 바꾸기 (드래그 + ▲▼) ──
let _typeDragFrom = null;
function typeDragStart(ev, i){ _typeDragFrom = i; ev.dataTransfer.effectAllowed='move'; }
window.typeDragStart = typeDragStart;
function typeDragOver(ev, i){
  ev.preventDefault();
  if(_typeDragFrom===null || _typeDragFrom===i) return;
  const t = TYPES.splice(_typeDragFrom,1)[0];
  TYPES.splice(i,0,t);
  _typeDragFrom = i;
  renderSet();
}
window.typeDragOver = typeDragOver;
function typeDragEnd(){ if(_typeDragFrom!==null){ _typeDragFrom=null; saveTypeOrder(); } }
window.typeDragEnd = typeDragEnd;
function moveType(i, dir){
  const j = i + dir;
  if(j<0 || j>=TYPES.length) return;
  const t = TYPES.splice(i,1)[0];
  TYPES.splice(j,0,t);
  renderSet();
  saveTypeOrder();
}
window.moveType = moveType;
async function saveTypeOrder(){
  try {
    await TM.snapBundle('attendTypes',{},'항목 순서 변경');
    for(let i=0;i<TYPES.length;i++){
      TYPES[i].order = i+1;
      await updateDoc(doc(db,'attendTypes',TYPES[i].id), {order:i+1});
    }

  } catch(e){ toast('순서 저장 실패: '+e.message,'err'); }
}

// ── 🎓 학년별 담당 선생님 ──
/* 기관·학년마다 담당 선생님을 정한다. 지정된 선생님은 담임이 아니어도
   그 학년 학생이 있는 반의 출결을 기록할 수 있다.
   저장: attendConfig/gradeAssign = { v: {"기관|학년":[uid…]} } */
let GA_STAFF = null;   // 교직원 캐시 (칩 표시용)
function gradeAssignCardHTML(){
  return `<div class="acard" data-dw="att-ga">
    <h3 class="actitle">🎓 학년별 담당 선생님</h3>
    <p class="adesc">학년마다 출석을 기록할 선생님을 정합니다. 담임이 아니어도 지정된 학년의 반은 기록할 수 있어요.
      <span style="color:var(--tl)">(담임·대리 선생님은 지정 없이도 자기 반을 기록합니다 · 학년은 반 편성에 입력된 학년을 따라옵니다)</span></p>
    <div id="ga-box"><p class="empty" style="font-size:13px">불러오는 중…</p></div>
  </div>`;
}
async function loadGaStaff(){
  const box = $I('ga-box'); if(!box) return;
  if(!GA_STAFF){
    try {
      const snap = await cachedCol(db, 'staff', { uid: CU && CU.uid, ms: 10 * 60000 }).then(s=>(window.hideTest?hideTest(s):s));
      GA_STAFF = [];
      snap.forEach(d=>{ const s={uid:d.id, ...d.data()};
        if(!s.noAuth && (s.acStatus||'active')==='active') GA_STAFF.push(s); });

/* 📌 머리줄 고정 — 긴 표에서 머리줄·이름 칸을 붙잡아 두기 (표 안 스크롤 모드)
   끄면 원래처럼 페이지 전체 스크롤 (좁게 느껴질 땐 끄면 됨) — 선택은 이 기기에 기억 */
function stickyOn(){ try { return localStorage.getItem('attendSticky')==='1'; } catch(e){ return false; } }
window.toggleSticky = function(rerender){
  try { localStorage.setItem('attendSticky', stickyOn()?'0':'1'); } catch(e){}
  if(rerender==='ga') renderGradeAssign();
  else if(rerender==='rp') loadReport();
};
function stickyBtnHTML(target){
  return `<button class="bm" style="font-size:11px;padding:5px 11px;${stickyOn()?'background:var(--gp);color:var(--gd);font-weight:800':''}"
    onclick="toggleSticky('${target}')" title="켜면 표 안에서 스크롤되고 머리줄·이름이 고정돼요 · 끄면 페이지 전체 스크롤">
    📌 머리줄 고정 ${stickyOn()?'켬':'끔'}</button>`;
}

/* 담임(반 편성 기준)인 학년 — 자동 권한 표시용 */
function homeroomGrades(uid, org){
  const set = new Set();
  CLASSES.filter(c=>c.org===org && (c.teacherUid===uid || c.teacher===uid ||
    (Array.isArray(c.subTeachers)&&c.subTeachers.includes(uid)) || c.subTeacherUid===uid || (Array.isArray(c.shadowUids)&&c.shadowUids.includes(uid))))
    .forEach(c=>classGrades(c).forEach(g=>set.add(g)));
  return set;
}
function renderGradeAssign(){
  const box = $I('ga-box'); if(!box) return;
  const html = myOrgs().map(org=>{
    const gset = new Set();
    CLASSES.filter(c=>c.org===org).forEach(c=>classGrades(c).forEach(g=>gset.add(g)));
    const grades = sortGrades(Array.from(gset));
    if(!grades.length) return `<div class="ga-org"><div class="ga-orgname">${ORGS[org]||org}</div>
      <p class="empty" style="font-size:12.5px">반 편성에 학년이 입력된 반이 없습니다. 반 편성에서 학년을 먼저 넣어주세요.</p></div>`;
    const staff = GA_STAFF.filter(s=>{
      const so = s.orgs && s.orgs.length ? s.orgs : [s.org];
      return so.includes(org);
    }).sort((a,b)=>(a.dept||'').localeCompare(b.dept||'','ko') || (a.name||'').localeCompare(b.name||'','ko'));
    // ✅ 한눈에 보는 권한 매트릭스: 행=선생님, 열=학년, 셀=체크
    const head = `<tr><th style="text-align:left;min-width:120px">선생님</th>
      ${grades.map(g=>`<th style="min-width:44px">${esc(g)}</th>`).join('')}
      <th style="min-width:56px;font-size:10px;color:var(--tl)">담당<br>학년수</th></tr>`;
    const rows = staff.map(st=>{
      const hr = homeroomGrades(st.uid, org);
      let cnt = 0;
      const cells = grades.map(g=>{
        const key = org+'|'+g;
        const on = (GRADE_ASSIGN[key]||[]).includes(st.uid);
        const isHr = hr.has(g);
        if(on) cnt++;
        return `<td style="text-align:center;cursor:pointer;user-select:none;${on?'background:var(--gp)':''}"
          onmousedown="gaDown(event,'${key}','${st.uid}')" onmouseenter="gaOver('${key}','${st.uid}')"
          title="${esc(st.name)} · ${esc(g)}${isHr?' (담임 — 지정 없이도 기록 가능)':''}">
          ${on?'<span style="color:var(--gm);font-weight:900;font-size:15px">✓</span>'
              :(isHr?'<span style="color:#B8A24A;font-size:11px" title="담임 자동 권한">🏠</span>'
                    :'<span style="color:var(--ivd)">·</span>')}</td>`;
      }).join('');
      return `<tr>
        <td style="text-align:left;white-space:nowrap"><b>${esc(st.name||'')}</b>
          <span style="font-size:10px;color:var(--tl)"> ${esc(st.dept||'')}${st.role==='partner'?' · 협력':st.role==='org_admin'?' · 관리자':st.role==='super'?' · 수퍼':''}</span></td>
        ${cells}
        <td style="text-align:center;font-size:11px;color:${cnt?'var(--gm)':'var(--tl)'};font-weight:${cnt?'800':'400'}">${cnt||'·'}</td></tr>`;
    }).join('');
    return `<div class="ga-org"><div class="ga-orgname" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${ORGS[org]||org}
        <span style="font-size:10.5px;font-weight:600;color:var(--tl)"> — 칸을 눌러 켜고, <b>드래그하면 쭉</b> 켜고 끕니다 · ✓ 지정됨 · 🏠 담임(자동 권한) · 관리자·수퍼는 전체 기록 가능</span>
        <span style="flex:1"></span>${stickyBtnHTML('ga')}</div>
      <div class="ga-scroll ${stickyOn()?'stickywrap':''}" style="overflow-x:auto"><table class="ga-mtx" style="border-collapse:collapse;width:100%;font-size:12.5px">
        <thead style="background:var(--gp);color:var(--gd)">${head}</thead>
        <tbody>${rows}</tbody></table></div>
      <style>
        .ga-mtx th,.ga-mtx td{padding:7px 6px;border-bottom:1px solid var(--iv)} .ga-mtx tbody tr:hover{background:#FAFAF7}
        .stickywrap{max-height:70vh;overflow:auto;border:1px solid var(--iv);border-radius:10px}
        .stickywrap thead th{position:sticky;top:0;z-index:3;background:var(--gp)}
        .stickywrap th:first-child,.stickywrap td:first-child{position:sticky;left:0;z-index:2;background:#fff}
        .stickywrap thead th:first-child{z-index:4;background:var(--gp)}
        .stickywrap tbody tr:nth-child(even) td:first-child{background:#FAFAF7}
      </style>
    </div>`;
  }).join('');
  box.innerHTML = html;
}
/* 🖱 드래그로 쭉 체크 — 처음 누른 칸의 «반대 상태»를 지나가는 칸 전부에 적용, 놓으면 한 번에 저장 */
let GA_DRAG = null;   // { on:true/false, changed:0, before:{} }
function gaApply(key, uid, on){
  const cur = GRADE_ASSIGN[key]||[];
  const has = cur.includes(uid);
  if(on===has) return false;
  GRADE_ASSIGN[key] = on ? [...cur, uid] : cur.filter(u=>u!==uid);
  if(!GRADE_ASSIGN[key].length) delete GRADE_ASSIGN[key];
  return true;
}
function gaRepaint(){
  // 스크롤 위치를 지키면서 다시 그린다 (드래그 중에도 자연스럽게)
  const sc = {};
  document.querySelectorAll('.ga-scroll').forEach((el,i)=>sc[i]=el.scrollLeft);
  renderGradeAssign();
  document.querySelectorAll('.ga-scroll').forEach((el,i)=>{ if(sc[i]!=null) el.scrollLeft=sc[i]; });
}
window.gaDown = function(ev, key, uid){
  ev.preventDefault();
  const on = !(GRADE_ASSIGN[key]||[]).includes(uid);
  GA_DRAG = { on, changed:0, before: JSON.parse(JSON.stringify(GRADE_ASSIGN)) };
  if(gaApply(key, uid, on)) GA_DRAG.changed++;
  gaRepaint();
};
window.gaOver = function(key, uid){
  if(!GA_DRAG) return;
  if(gaApply(key, uid, GA_DRAG.on)) { GA_DRAG.changed++; gaRepaint(); }
};
document.addEventListener('mouseup', async ()=>{
  if(!GA_DRAG) return;
  const d = GA_DRAG; GA_DRAG = null;
  if(!d.changed) return;
  try {
    await TM.snapDoc('attendConfig','gradeAssign','학년담당 변경');
    await setDoc(doc(db,'attendConfig','gradeAssign'), {
      v: GRADE_ASSIGN, updatedAt: Timestamp.now(), updatedByUid: CU.uid, updatedByName: CU.name||''
    });
    logActivity('권한','학년담당', `담당 지정 ${d.changed}칸 변경 (${d.on?'지정':'해제'})`);
    if(d.changed>1) toast(`${d.changed}칸 ${d.on?'지정':'해제'} 저장 ✓`,'ok');
  } catch(e){
    GRADE_ASSIGN = d.before;
    toast('저장 실패 — 되돌렸습니다: '+(e.message||''),'err');
    gaRepaint();
  }
});
// (예전 단건 토글 — 다른 곳 호환용)
async function toggleGA(key, uid){ window.gaDown({preventDefault(){}} , key, uid); document.dispatchEvent(new Event('mouseup')); }
window.toggleGA = toggleGA;

// 학기 목록 HTML
function termListHTML(){

// ── 출결 항목 추가/수정 폼 ──
function openTypeForm(editId){

    <div class="mov"><div class="mbk" onclick="closeMod()"></div>
    <div class="mbox">
      <div class="mtitle">${t?'항목 수정':'항목 추가'}</div>
      <div class="msub">출결 항목의 이름, 색상, 출석 인정 여부를 설정합니다.</div>
      <div class="fgrp"><label>항목 이름</label><input id="t-name" value="${t?.name||''}" placeholder="예: 공결, 외출"></div>
      <div class="fgrp"><label>색상</label>
        <input id="t-color" type="color" value="${t?.color||'#00704A'}" style="height:44px;padding:4px">
      </div>
      <div class="fgrp"><label>출석 인정 여부</label>
        <select id="t-present">
          <option value="no"${t&&!t.isPresent?' selected':''}>결석 처리 (출석일수에서 제외)</option>
          <option value="yes"${t&&t.isPresent?' selected':''}>출석 인정 (출석일수에 포함)</option>
        </select>
      </div>
      <div class="mact">
        <button class="bs" onclick="closeMod()">취소</button>
        <button class="bp" onclick="saveType('${t?.id||''}')">저장</button>
      </div>
    </div></div>`;
}
window.openTypeForm = openTypeForm;
function closeMod(){ $I('mwrap').innerHTML=''; }
window.closeMod = closeMod;

async function saveType(editId){
  const name = $I('t-name').value.trim();
  const color = $I('t-color').value;
  const isPresent = $I('t-present').value==='yes';
  if(!name) return toast('항목 이름을 입력하세요.','err');
  try {
    await TM.snapBundle('attendTypes',{}, editId?`항목 수정: ${name}`:`항목 추가: ${name}`);
    if(editId){
      await updateDoc(doc(db,'attendTypes',editId), {name, color, isPresent});
      logActivity('수정','출석항목',`${name}`);
      toast('수정되었습니다.','ok');
    } else {
      const maxOrder = TYPES.length ? Math.max(...TYPES.map(t=>t.order||0)) : 0;
      await addDoc(collection(db,'attendTypes'), {name, color, isPresent, order:maxOrder+1, createdAt:Timestamp.now()});
      logActivity('입력','출석항목',`${name}`);
      toast('추가되었습니다.','ok');
    }
    closeMod();
    await loadTypes();
    renderSet();
  } catch(e){ toast('저장 실패: '+e.message,'err'); }
}
window.saveType = saveType;

async function delType(id){
  const t = TYPES.find(x=>x.id===id);
  if(!confirm(`"${t?.name}" 항목을 삭제할까요?\n이미 이 항목으로 기록된 출결이 있다면 통계에 영향이 있을 수 있습니다.`)) return;
  try {
    await TM.snapBundle('attendTypes',{},`항목 삭제: ${t?.name||''}`);
    await deleteDoc(doc(db,'attendTypes',id));
    logActivity('삭제','출석항목',`${t?.name||''}`);
    toast('삭제되었습니다.');
    await loadTypes();
    renderSet();
  } catch(e){ toast('삭제 실패: '+e.message,'err'); }
}
window.delType = delType;

// ── 학기 일정 추가/수정 폼 ──
function orgOptionsHTML(sel){
  return myOrgs().map(o=>`<option value="${o}"${sel===o?' selected':''}>${ORGS[o]}</option>`).join('');
}
function openTermForm(editId){
  const t = editId ? TERMS.find(x=>x.id===editId) : null;
  const ty = new Date().getFullYear();
  const years = [];
  for(let y=ty+1; y>=ty-3; y--) years.push(y);

    <div class="mov"><div class="mbk" onclick="closeMod()"></div>

        <select id="tm-year">${years.map(y=>`<option value="${y}"${t&&t.year===y?' selected':(!t&&y===ty?' selected':'')}>${y}년</option>`).join('')}</select></div>
      <div class="fgrp"><label>기관</label>
        <select id="tm-org">${orgOptionsHTML(t?.org)}</select></div>
      <div class="fgrp"><label>학기</label>
        <select id="tm-term">
          <option value="1"${t&&t.term===1?' selected':''}>1학기</option>

        <button class="bs" onclick="closeMod()">취소</button>
        <button class="bp" onclick="saveTerm('${t?.id||''}')">저장</button>
      </div>
    </div></div>`;
}
window.openTermForm = openTermForm;

async function saveTerm(editId){
  const year = Number($I('tm-year').value);
  const org = $I('tm-org').value;
  const term = Number($I('tm-term').value);
  const start = $I('tm-start').value, end = $I('tm-end').value;
  if(!start || !end) return toast('개학일과 종업일을 입력하세요.','err');
  if(start > end) return toast('종업일이 개학일보다 빠릅니다.','err');
  const data = {year, org, term, start, end};
  await TM.snapBundle('terms',{}, editId?'학기 수정':'학기 추가');
  try {
    if(editId){
      await updateDoc(doc(db,'terms',editId), data);
      logActivity('수정','학기일정',`${year} ${ORGS[org]} ${TERM_NAMES[term]}`);
      toast('수정되었습니다.','ok');
    } else {
      // 중복 체크 (같은 연도·기관·학기)
      if(TERMS.some(t=>t.year===year && t.org===org && t.term===term))
        return toast('이미 등록된 학기입니다. 수정해주세요.','err');
      data.createdAt = Timestamp.now();
      await addDoc(collection(db,'terms'), data);
      logActivity('입력','학기일정',`${year} ${ORGS[org]} ${TERM_NAMES[term]}`);
      toast('추가되었습니다.','ok');
    }
    closeMod();
    await loadTerms();
    renderSet();
  } catch(e){ toast('저장 실패: '+e.message,'err'); }
}
window.saveTerm = saveTerm;

async function delTerm(id){
  const t = TERMS.find(x=>x.id===id);
  if(!confirm(`${t?.year}년 ${ORGS[t?.org]} ${TERM_NAMES[t?.term]} 학기를 삭제할까요?`)) return;
  try {
    await TM.snapBundle('terms',{},`학기 삭제: ${t?.year||''}년`);
    await deleteDoc(doc(db,'terms',id));
    logActivity('삭제','학기일정',`${t?.year} ${ORGS[t?.org]} ${TERM_NAMES[t?.term]}`);
    toast('삭제되었습니다.');
    await loadTerms();
    renderSet();
  } catch(e){ toast('삭제 실패: '+e.message,'err'); }
}
window.delTerm = delTerm;
</script>
