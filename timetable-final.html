<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>완성 시간표 · 교사 선교사</title>
<meta name="theme-color" content="#1E3932">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교사선교사">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg,#f4f2ec);color:var(--ink,#1a2420)}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#f4f2ec);z-index:100}
  #gate .box{text-align:center}
  #gate-msg{font-size:14px;color:var(--ts,#5a6560);margin-bottom:14px}
  #gate-btn{display:none;background:#2d6a4f;color:#fff;border:none;padding:10px 22px;border-radius:9px;font-family:inherit;font-weight:700;cursor:pointer}

  .panel{background:var(--wh,#fff);border:1px solid var(--ivd,#E3E1DA);border-radius:14px;padding:18px;margin-bottom:14px}
  .ptitle{font-size:15px;font-weight:800;color:var(--gd,#1E3932);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pdesc{font-size:12.5px;color:var(--ts,#5a6560);line-height:1.7;margin-bottom:14px}
  .empty{text-align:center;padding:44px 16px;color:var(--tl,#93A09A)}
  .empty .ico{font-size:34px;margin-bottom:10px}
  .empty .t1{font-size:14.5px;font-weight:800;color:var(--gd,#1E3932);margin-bottom:6px}
  .empty div{font-size:12.5px;line-height:1.7}

  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:8px 15px;border-radius:9px;
    border:1px solid var(--ivd,#E3E1DA);background:var(--wh,#fff);color:var(--ts,#5A6560);cursor:pointer}
  .btn:hover{border-color:var(--gm,#00704A);color:var(--gm,#00704A)}
  .btn-p{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:var(--wh,#fff)}
  .btn-p:hover{opacity:.9;color:var(--wh,#fff)}
  .btn-sm{font-size:12px;padding:6px 12px}

  /* ── 게시 목록 ── */
  .pb-now{background:var(--gp,#E8F3EF);border:1px solid var(--gl,#C3E0D4);border-radius:11px;
    padding:13px 15px;margin-bottom:12px}
  .pb-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .pb-ico{font-size:19px;flex:none}
  .pb-t{font-size:14.5px;font-weight:800;color:var(--gd,#1E3932)}
  .pb-m{font-size:11.5px;color:var(--ts,#5A6560);margin-top:2px}
  .pb-act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .pb-make{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding-top:12px;margin-top:12px;border-top:1px dashed var(--ivd,#E3E1DA)}
  .pb-sel{font-family:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--ivd,#E3E1DA);
    border-radius:8px;background:var(--wh,#fff);color:var(--ink);min-width:200px}
  .pb-hint{font-size:11.5px;color:var(--tl,#93A09A);line-height:1.65;margin-top:9px}

  /* ── 게시 기록 관리 ── */
  .pl-head{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
  .pl-t{font-size:12.5px;font-weight:800;color:var(--gd,#1E3932)}
  .pl-toggle{margin-left:auto;font-family:inherit;font-size:11.5px;font-weight:700;
    padding:5px 12px;border:1px solid var(--ivd,#E3E1DA);border-radius:8px;
    background:var(--wh,#fff);color:var(--ts,#5A6560);cursor:pointer}
  .pl-list{display:flex;flex-direction:column;gap:6px}
  .pl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 12px;border:1px solid var(--ivd,#E3E1DA);border-radius:10px;
    background:var(--wh,#fff)}
  .pl-row.cur{background:var(--gp,#E8F3EF);border-color:var(--gl,#C3E0D4)}
  .pl-row.arc{background:var(--iv,#F2F0EB);opacity:.82}
  .pl-ic{font-size:15px;flex:none}
  .pl-main{min-width:140px;flex:1}
  .pl-nm{font-size:12.5px;font-weight:800;color:var(--gd,#1E3932)}
  .pl-mt{font-size:11px;color:var(--tl,#93A09A);margin-top:2px}
  .pl-badge{font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 7px;flex:none}
  .pl-badge.now{background:var(--gm,#00704A);color:#fff}
  .pl-badge.arc{background:var(--ivd,#E3E1DA);color:var(--ts,#5A6560)}
  .pl-act{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
  .pl-b{font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:8px;background:var(--wh,#fff);
    color:var(--ts,#5A6560);cursor:pointer;white-space:nowrap}
  .pl-b:hover{border-color:var(--gm,#00704A);color:var(--gm,#00704A)}
  .pl-b.dg{color:var(--danger,#C0392B)}
  .pl-b.dg:hover{border-color:var(--danger,#C0392B);color:var(--danger,#C0392B)}
  .pb-list{display:flex;flex-direction:column;gap:7px}
  .pb-item{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:11px 14px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:10px;background:var(--wh,#fff)}
  .pb-item.on{border-color:var(--gm,#00704A);background:var(--gp,#E8F3EF)}
  .pb-badge{font-size:10px;font-weight:800;background:var(--gm,#00704A);color:var(--wh,#fff);
    border-radius:5px;padding:2px 7px;flex:none}
  .pb-old{font-size:10px;font-weight:800;background:var(--iv,#F2F0EB);color:var(--tl,#93A09A);
    border-radius:5px;padding:2px 7px;flex:none}

  /* ── 보기 ── */
  .vw-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:11px 13px;
    background:var(--gp,#E8F3EF);border-radius:11px;margin-bottom:14px}
  .vw-kb{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;
    border:1px solid transparent;background:transparent;color:var(--ts,#5A6560);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .vw-kb:hover{background:var(--wh,#fff)}
  .vw-kb.on{background:var(--gm,#00704A);color:var(--wh,#fff)}
  .vw-sel{font-family:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--ivd,#E3E1DA);
    border-radius:8px;background:var(--wh,#fff);color:var(--ink);min-width:150px}
  .vw-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

  .tv-sheet{background:var(--wh,#fff);border:1px solid var(--ivd,#E3E1DA);border-radius:12px;padding:18px;overflow-x:auto}
  .tv-head{margin-bottom:14px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .tv-title{font-size:19px;font-weight:800;color:var(--gd,#1E3932);letter-spacing:-.02em;margin-bottom:2px}
  .tv-meta{font-size:12px;color:var(--tl,#93A09A)}
  .tv-zoom{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    font-size:11px;color:var(--tl,#93A09A)}
  .tv-zb{font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;
    border:1px solid var(--ivd,#E3E1DA);border-radius:7px;background:var(--wh,#fff);
    color:var(--ts,#5A6560);cursor:pointer}
  .tv-zb:hover{border-color:var(--gm,#00704A);color:var(--gm,#00704A)}
  .tv-zb.on{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}

  .tv-board{border:1px solid var(--ivd,#E3E1DA);border-radius:11px;overflow:hidden;min-width:660px}
  .tv-hd{display:grid;grid-template-columns:58px repeat(5,minmax(0,1fr));
    background:var(--gp,#E8F3EF);border-bottom:1px solid var(--ivd,#E3E1DA)}
  .tv-hd-d{padding:9px 0;text-align:center;font-size:calc(13.5px * var(--tvf,1));
    font-weight:800;color:var(--gd,#1E3932)}
  .tv-grid{display:grid;grid-template-columns:58px repeat(5,minmax(0,1fr));position:relative}
  .tv-times{position:relative;background:var(--iv,#F2F0EB);border-right:1px solid var(--ivd,#E3E1DA)}
  .tv-tick{position:absolute;left:0;right:0;font-size:calc(10px * var(--tvf,1));color:var(--tl,#93A09A);
    padding-left:6px;border-top:1px dashed var(--ivd,#E3E1DA);line-height:1.1}
  .tv-col{position:relative;border-right:1px solid var(--ivd,#E3E1DA);background:var(--wh,#fff)}
  .tv-col:last-child{border-right:none}
  .tv-bg{position:absolute;left:0;right:0;box-sizing:border-box;pointer-events:none;overflow:hidden;
    border-top:1px solid var(--ivd,#E3E1DA)}
  .tv-bg.cls{background:rgba(0,112,74,.045)}
  .tv-bg.rest{background:repeating-linear-gradient(45deg,rgba(147,160,154,.10) 0 6px,transparent 6px 12px)}
  .tv-bg span{font-size:calc(9px * var(--tvf,1));color:var(--tl,#93A09A);padding:1px 4px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-bg.tiny span{display:none}
  .tv-card{position:absolute;left:3px;right:3px;box-sizing:border-box;overflow:hidden;
    border-radius:7px;border:1px solid var(--ivd,#E3E1DA);border-left:3px solid var(--lc,#7FB5A0);
    background-color:var(--wh,#fff);
    background-image:linear-gradient(var(--lc-bg,#F2F7F5),var(--lc-bg,#F2F7F5));
    display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(30,57,50,.07)}
  .tv-c-top{flex:1;min-height:0;padding:3px 6px;overflow:hidden}
  .tv-c-top b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    font-size:calc(11.5px * var(--tvf,1));font-weight:800;
    color:var(--gd,#1E3932);line-height:1.3;overflow:hidden;
    white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
  .tv-c-time i{font-style:normal;opacity:.72;margin-left:2px}
  .tv-c-time{display:block;font-size:calc(9.5px * var(--tvf,1));color:var(--ts,#5A6560);
    line-height:1.35;white-space:normal;overflow-wrap:anywhere}
  .tv-c-sub{display:block;font-size:calc(9.5px * var(--tvf,1));color:var(--tl,#93A09A)}
  /* 선생님 이름과 교실이 한 줄에 안 들어가면 서로 줄을 바꿔 내려간다.
     (예전에는 한 줄에 밀어 넣느라 둘 다 "…"로 잘렸다) */
  .tv-c-foot{display:flex;align-items:center;gap:4px;row-gap:1px;flex-wrap:wrap;
    background:var(--tb,#93A09A);padding:2px 6px;flex:none;min-height:0;min-width:0}
  /* 함께 들어가는 선생님이 여럿이면 두 줄까지 보여준다 */
  .tv-c-who{font-size:calc(9.5px * var(--tvf,1));font-weight:800;color:#fff;
    line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
  .tv-c-room{margin-left:auto;font-size:calc(9px * var(--tvf,1));font-weight:700;color:#fff;
    flex:0 1 auto;min-width:0;max-width:100%;
    background:rgba(255,255,255,.24);border-radius:4px;padding:0 5px;line-height:1.45;
    white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
  .tv-card.mid .tv-c-top{padding:2px 6px}
  .tv-card.mid .tv-c-top b{font-size:calc(11px * var(--tvf,1))}
  .tv-card.mid .tv-c-time{font-size:calc(9px * var(--tvf,1))}
  .tv-card.small{flex-direction:row;align-items:center;gap:6px;padding:0 6px}
  .tv-card.small .tv-c-top{flex:1;padding:0;min-width:0}
  .tv-card.small .tv-c-top b{font-size:calc(10.5px * var(--tvf,1));line-height:1.2}
  /* 아주 납작한 카드는 가로로 놓이므로, 이름이 먼저 자리를 갖고 교실이 줄어든다 */
  .tv-card.small .tv-c-foot{background:transparent;padding:0;flex:0 1 auto;
    max-width:62%;min-width:0;flex-wrap:nowrap}
  .tv-card.small .tv-c-who{-webkit-line-clamp:1;flex:0 1 auto;min-width:0}
  .tv-card.small .tv-c-room{flex:0 1 auto;min-width:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  /* ── 🔎 수업 카드 자세히 보기 ── */
  .tv-card{cursor:pointer}
  .tv-card:focus-visible{outline:2px solid var(--gm,#00704A);outline-offset:1px}
  @keyframes tvGlowPulse{
    0%,100%{ box-shadow:0 1px 2px rgba(30,57,50,.07); filter:none; }
    50%    { box-shadow:0 0 0 3px rgba(0,112,74,.45), 0 2px 10px rgba(0,112,74,.30); filter:brightness(1.06); }
  }
  .tv-card.tv-glow{ animation:tvGlowPulse 1.15s ease-in-out infinite; z-index:5 }
  @media (prefers-reduced-motion:reduce){
    .tv-card.tv-glow{ animation:none; box-shadow:0 0 0 3px rgba(0,112,74,.45) }
  }

  .tvi-ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:18px}
  .tvi-bk{position:absolute;inset:0;background:rgba(15,25,21,.5)}
  .tvi-box{position:relative;z-index:1;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;
    background:var(--wh,#fff);border-radius:16px;padding:20px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .tvi-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(0,0,0,.06);color:#555;font-size:15px;line-height:1;cursor:pointer}
  .tvi-x:hover{background:rgba(0,0,0,.12)}
  .tvi-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding-right:26px}
  .tvi-bar{width:5px;align-self:stretch;min-height:34px;border-radius:100px;background:var(--lc,#7FB5A0);flex:none}
  .tvi-nm{font-size:17px;font-weight:900;color:var(--gd,#1E3932);line-height:1.25;overflow-wrap:anywhere}
  .tvi-sub{font-size:12px;color:var(--tl,#93A09A);margin-top:2px;overflow-wrap:anywhere}
  .tvi-stats{display:flex;gap:7px;margin-bottom:14px}
  .tvi-stat{flex:1;background:var(--lc-bg,#F2F7F5);border-radius:10px;padding:10px 6px;text-align:center}
  .tvi-stat b{display:block;font-size:15px;font-weight:900;color:var(--gd,#1E3932);line-height:1.2}
  .tvi-stat span{display:block;font-size:10.5px;color:var(--ts,#5A6560);margin-top:3px}
  .tvi-lines{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .tvi-line{display:flex;gap:9px;font-size:12.5px;line-height:1.5}
  .tvi-k{color:var(--tl,#93A09A);flex:none;min-width:62px}
  .tvi-v{color:var(--ink,#1F2320);font-weight:700;overflow-wrap:anywhere}
  .tvi-listt{font-size:12px;font-weight:800;color:var(--gd,#1E3932);margin-bottom:6px}
  .tvi-list{display:flex;flex-direction:column;gap:4px}
  .tvi-row{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:8px;
    background:var(--iv,#F2F0EB);font-size:12px}
  .tvi-row.on{background:var(--lc-bg,#F2F7F5);box-shadow:inset 0 0 0 1.5px var(--lc,#7FB5A0)}
  .tvi-day{font-weight:900;color:var(--gd,#1E3932);flex:none;min-width:16px}
  .tvi-time{color:var(--ts,#5A6560);font-weight:700}
  .tvi-dur{color:var(--tl,#93A09A)}
  .tvi-room{margin-left:auto;font-size:11px;font-weight:700;color:var(--ts,#5A6560);
    background:var(--wh,#fff);border-radius:5px;padding:1px 7px;overflow-wrap:anywhere}
  .tvi-note{font-size:11px;color:var(--tl,#93A09A);margin-top:11px;line-height:1.6}
  @media(max-width:640px){ .tvi-ov{padding:10px} .tvi-box{padding:17px 16px;max-height:88vh} }

  .tv-card.small .tv-c-who{color:var(--tb,#5A6560);font-size:calc(9.5px * var(--tvf,1));line-height:1.2}
  .tv-card.small .tv-c-room{background:var(--iv,#F2F0EB);color:var(--ts,#5A6560);
    margin-left:4px;font-size:calc(8.5px * var(--tvf,1));line-height:1.4}

  /* ── 인쇄 고르기 ── */
  .pr-ov{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .pr-bk{position:absolute;inset:0;background:rgba(15,25,21,.5)}
  .pr-box{position:relative;z-index:1;width:100%;max-width:540px;max-height:88vh;display:flex;
    flex-direction:column;background:var(--wh,#fff);border-radius:16px;padding:20px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .pr-t{font-size:17px;font-weight:800;color:var(--gd,#1E3932)}
  .pr-d{font-size:12.5px;color:var(--ts,#5A6560);line-height:1.65;margin:5px 0 12px}
  .pr-kinds{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
  .pr-k{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;
    border:1px solid var(--ivd,#E3E1DA);background:var(--wh,#fff);color:var(--ts,#5A6560);cursor:pointer}
  .pr-k.on{background:var(--gm,#00704A);border-color:var(--gm,#00704A);color:#fff}
  .pr-list{flex:1;overflow:auto;border:1px solid var(--ivd,#E3E1DA);border-radius:10px;padding:5px;
    max-height:290px}
  .pr-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;
    cursor:pointer;font-size:13px;color:var(--ink)}
  .pr-row:hover{background:var(--iv,#F2F0EB)}
  .pr-row.on{background:var(--gp,#E8F3EF)}
  .pr-row b{font-weight:700;color:var(--gd,#1E3932)}
  .pr-cnt{margin-left:auto;font-size:11px;color:var(--tl,#93A09A)}
  .pr-all{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:12px;color:var(--ts,#5A6560)}
  .pr-act{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;
    border-top:1px solid var(--ivd,#E3E1DA)}
  .pr-n{font-size:12px;color:var(--tl,#93A09A);margin-right:auto}

  /* ── 인쇄 ──
     화면에 보이는 것 말고, 고른 시간표만 한 장에 하나씩 나오게 한다 */
  #printArea{display:none}
  @media print{
    @page{ size:A4 portrait; margin:10mm }
    html,body{background:#fff !important}
    body.printing > *{display:none !important}
    body.printing #printArea{display:block !important}
    body.printing #sb, body.printing #tb, body.printing #mn,
    body.printing .pr-ov, body.printing #toast{display:none !important}
    #printArea .pr-page{page-break-after:always;break-after:page}
    #printArea .pr-page:last-child{page-break-after:auto;break-after:auto}
    #printArea .tv-sheet{border:none;padding:0;box-shadow:none}
    #printArea .tv-zoom{display:none}
    #printArea .tv-board{min-width:0;width:100%}
    #printArea .tv-sheet{overflow:visible}
    #printArea .tv-head{margin-bottom:9px}
    #printArea .tv-title{font-size:16px}
    #printArea .tv-meta{font-size:10.5px}
    #printArea .pr-page{overflow:hidden}
    #printArea .tv-card,#printArea .tv-bg,#printArea .tv-hd,
    #printArea .tv-c-foot,#printArea .tv-times{
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media(max-width:640px){
    .tv-sheet{padding:12px}
    .vw-right{margin-left:0;width:100%}
  }
</style>
</head>
<body>

<div id="gate"><div class="box"><div id="gate-msg">불러오는 중…</div><button id="gate-btn" onclick="location.reload()">다시 시도</button></div></div>

<div id="ms" style="display:none">

  <div class="tabs-main" id="topTabs"></div>

  <!-- 관리자: 게시하는 자리 -->
  <div class="panel" id="pub-panel" style="display:none">
    <div class="ptitle">📌 시간표 게시</div>
    <div class="pdesc">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  collection, getDocs, query, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCtgr79jKqkec6HwqkxYNxSubWAhfEkM7g",
  authDomain: "daniel-amatz.firebaseapp.com",
  projectId: "daniel-amatz",
  storageBucket: "daniel-amatz.firebasestorage.app",
  messagingSenderId: "455744290312",
  appId: "1:455744290312:web:3ce7e7d3e58f6f1d185bbd"
});
const auth = getAuth(app);
const db = getFirestore(app);

const $I = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ORGS = { daniel:'다니엘 아마츠', jihyebit:'지혜빛 선교원' };
const DAYS = ['월','화','수','목','금'];
const hm = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const parseHM = s => { const [a,b]=String(s||'0:0').split(':').map(Number); return (a||0)*60+(b||0); };

function toast(msg, kind){
  const t=$I('toast'); if(!t) return;
  t.textContent=msg; t.style.background = kind==='err' ? '#C0392B' : 'var(--gd,#1E3932)';
  t.style.opacity='1'; clearTimeout(t._t);
  t._t=setTimeout(()=>{ t.style.opacity='0'; }, 2400);
}
function fmtDT(ts){
  if(!ts) return '';
  // Timestamp · {seconds} · 문자열 어느 쪽이 와도 읽는다 (NaN 표시 방지)
  const d = ts.toDate ? ts.toDate()
          : (typeof ts.seconds === 'number' ? new Date(ts.seconds*1000) : new Date(ts));
  if(isNaN(d.getTime())) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let CU = null;
let PUBS = [];        // 게시된 시간표들
let CUR = null;       // 지금 보고 있는 게시본
let SETS = [];        // 저장해둔 배정 (게시할 거리)

/* 색 · 이름 — 배정 화면과 같은 규칙 */
const LESSON_COLORS = [
  '#7FB5A0','#8FB8E0','#E8A87C','#D9A0C0','#A79BD4','#7EBDC9',
  '#E09B9B','#8FC49A','#D4B483','#B9A4D9','#7FC0B5','#E0A97C',
  '#9BAEDD','#DDA0BC','#93C7A3','#CFAF7E','#A9C8DE','#C9A0D0',
  '#8CC5B8','#E3B08A','#9FB3D9','#D3A5B8','#A6CBA0','#C7B78F'
];
function tintOf(hex, alpha){
  const c = String(hex||'#7FB5A0').replace('#','');
  const n = parseInt(c.length===3 ? c.split('').map(x=>x+x).join('') : c, 16);
  return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${alpha})`;
}
function lessonColor(l){
  if(!l) return LESSON_COLORS[0];
  if(l.color) return l.color;
  const names = [];
  (CUR?.snapshot?.lessons||[]).forEach(x=>{
    const s=(x.subject||'').trim(); if(s && names.indexOf(s)<0) names.push(s);
  });
  const i = names.indexOf((l.subject||'').trim());
  return LESSON_COLORS[(i<0?0:i) % LESSON_COLORS.length];
}
function teacherOf(uid){ return (CUR?.snapshot?.teachers||[]).find(t=>t.uid===uid) || null; }
function tName(uid){ return (teacherOf(uid)||{}).name || ''; }
function tColor(uid){ return (teacherOf(uid)||{}).color || '#93A09A'; }
function teacherLabel(lesson, uids){
  const list = (uids && uids.length) ? uids : (lesson ? (lesson.teacherUids||[]) : []);
  const names = list.map(tName).filter(Boolean);
  if(!names.length) return '미배정';
  if(names.length <= 2) return names.join(', ');
  const lead = lesson && lesson.leadUid && list.includes(lesson.leadUid) ? lesson.leadUid : list[0];
  return `${tName(lead)} 외 ${names.length-1}명`;
}
function teacherLead(lesson, uids){
  const list = (uids && uids.length) ? uids : (lesson ? (lesson.teacherUids||[]) : []);
  if(lesson && lesson.leadUid && list.includes(lesson.leadUid)) return lesson.leadUid;
  return list[0];
}
function findRoomName(roomId){
  for(const f of (CUR?.snapshot?.floors||[])){
    const r = (f.rooms||[]).find(x=>x.id===roomId);
    if(r) return r.name;
  }
  return '';
}

/* 게시본에서 부서 블록 읽기 */
function dayBlocksOf(grade, day){
  const snap = CUR?.snapshot; if(!snap) return { blocks:[], startMin:0, endMin:0 };
  const f = (snap.frames||[]).find(x=>x.id===snap.frameId) || (snap.frames||[])[0];
  if(!f || !f.snapshot) return { blocks:[], startMin:0, endMin:0 };
  const deptId = (snap.gradeDept?.[f.id]||{})[grade] || '';
  const dept = (f.snapshot.departments||[]).find(d=>d.id===deptId);
  if(!dept) return { blocks:[], startMin:0, endMin:0 };
  const btMap = {}; (f.snapshot.blockTypes||[]).forEach(b=>btMap[b.id]=b);
  const wk = f.snapshot.weekArrangements || {};
  const arr = (wk[day] && wk[day][deptId]) || (f.snapshot.arrangements && f.snapshot.arrangements[deptId]) || null;
  if(!arr) return { blocks:[], startMin:0, endMin:0 };
  let cur = parseHM(dept.start || '08:40');
  const startMin = cur, blocks = [];
  arr.forEach(item=>{
    const bt = btMap[item.typeId]; if(!bt) return;
    const dur = Number(item.durOverride!=null ? item.durOverride : bt.dur) || 0;
    blocks.push({ name:bt.name, dur, isClass:!!bt.countsAsClass, startMin:cur, endMin:cur+dur });
    cur += dur;
  });
  return { blocks, startMin, endMin:cur };
}

/* 게시본의 배치를 평평하게 */
function collect(){
  const snap = CUR?.snapshot; if(!snap) return [];
  const out = [];
  const byGrade = snap.place2?.[snap.frameId] || {};
  Object.keys(byGrade).forEach(grade=>{
    DAYS.forEach(dy=>{
      (byGrade[grade][dy] || []).forEach(c=>{
        const les = (snap.lessons||[]).find(l=>l.id===c.lessonId); if(!les) return;
        out.push({ day:dy, startMin:c.startMin, endMin:c.startMin+c.durMin,
          grade, lesson:les, grades:[grade],
          teacherUids:les.teacherUids||[], roomId:c.roomId || les.roomId || '' });
      });
    });
  });
  return out;
}

/* ═══ 보기 ═══ */
let vwKind = 'mine';    // mine | grade | teacher | room
let vwTarget = '';
const TV_ZOOMS = [2.1, 2.7, 3.4, 4.3, 5.4];
const TV_ZOOM_NAMES = ['작게','보통','크게','아주 크게','최대'];
const TV_FONT = { 2.1:1, 2.7:1.14, 3.4:1.3, 4.3:1.5, 5.4:1.72 };
let tvZoom = 2.7;
try { const z = parseFloat(localStorage.getItem('tf_zoom')); if(z && TV_ZOOMS.includes(z)) tvZoom = z; } catch(e){}
window.setTvZoom = function(v){
  tvZoom = Number(v) || 2.7;
  try { localStorage.setItem('tf_zoom', String(tvZoom)); } catch(e){}
  renderView();
};

window.setVwKind = function(k){
  vwKind = k; vwTarget = '';
  ['mine','grade','teacher','room'].forEach(x=>{
    const b = $I('vk-'+x); if(b) b.classList.toggle('on', x===k);
  });
  try { localStorage.setItem('tf_kind', k); } catch(e){}
  renderView();
};
window.setVwTarget = function(v){ vwTarget = v; renderView(); };

function targetsOf(all){
  if(vwKind==='mine') return [{ id:CU.uid, label:(CU.name||'나')+' 선생님' }];
  if(vwKind==='grade'){
    const set = new Set(); all.forEach(it=>it.grades.forEach(g=>set.add(g)));
    return [...set].sort((a,b)=>String(a).localeCompare(String(b),'ko',{numeric:true}))
      .map(g=>({ id:String(g), label:String(g) }));
  }
  if(vwKind==='teacher'){
    const set = new Set(); all.forEach(it=>it.teacherUids.forEach(u=>set.add(u)));
    return [...set].map(u=>({ id:u, label:tName(u)||'(알 수 없음)' }))
      .sort((a,b)=>a.label.localeCompare(b.label,'ko'));
  }
  const set = new Set(); all.forEach(it=>{ if(it.roomId) set.add(it.roomId); });
  return [...set].map(r=>({ id:r, label:findRoomName(r)||'(교실)' }))
    .sort((a,b)=>a.label.localeCompare(b.label,'ko'));
}
function matchOf(it, kind, target){
  if(kind==='mine' || kind==='teacher') return it.teacherUids.includes(target);
  if(kind==='grade') return it.grades.map(String).includes(String(target));
  return it.roomId === target;
}

/* 시간표 한 장을 그린다 (화면·인쇄 같은 코드) */
function sheetHTML(kind, target, label, opt){
  const all = collect();
  const mine = all.filter(it=>matchOf(it, kind, target));
  if(!mine.length) return '';

  const TV_PPM = (opt && opt.ppm) || tvZoom;
  // 표에 없는 배율(인쇄용 자동 계산)이면 배율에 견주어 글자 크기를 잡는다
  const f = TV_FONT[TV_PPM] || Math.max(0.82, Math.min(1.3, TV_PPM / 2.7));

  let s0 = Math.min(...mine.map(x=>x.startMin));
  let e0 = Math.max(...mine.map(x=>x.endMin));
  const bgBlocks = {};
  if(kind==='grade'){
    DAYS.forEach(dy=>{
      const b = dayBlocksOf(target, dy);
      bgBlocks[dy] = b.blocks || [];
      if(b.blocks?.length){ s0 = Math.min(s0, b.startMin); e0 = Math.max(e0, b.endMin); }
    });
  }
  const H = Math.round((e0 - s0) * TV_PPM);

  const cols = DAYS.map(dy=>{
    const bg = (bgBlocks[dy]||[]).map(b=>`
      <div class="tv-bg ${b.isClass?'cls':'rest'} ${b.dur*TV_PPM < 15 ? 'tiny':''}"
        style="top:${(b.startMin-s0)*TV_PPM}px;height:${b.dur*TV_PPM}px"><span>${esc(b.name)}</span></div>`).join('');
    const cards = mine.filter(it=>it.day===dy).map(it=>{
      const dur = it.endMin - it.startMin, px = dur * TV_PPM;
      const size = px >= 62*f ? 'big' : px >= 40*f ? 'mid' : 'small';
      const who = teacherLabel(it.lesson, it.teacherUids);
      const room = it.roomId ? findRoomName(it.roomId) : '';
      const lead = teacherLead(it.lesson, it.teacherUids);
      const bar = lead ? tColor(lead) : '#93A09A';
      const sub = kind==='grade' ? '' : (it.grade || '');
      return `<div class="tv-card ${size}" data-lesson="${esc(it.lesson.id||'')}"
        data-day="${dy}" data-start="${it.startMin}" tabindex="0"
        onclick="openTvInfo('${esc(it.lesson.id||'')}','${dy}',${it.startMin})"
        style="top:${(it.startMin-s0)*TV_PPM}px;height:${px}px;
               --lc:${lessonColor(it.lesson)};--lc-bg:${tintOf(lessonColor(it.lesson),.16)};--tb:${bar}">
        <div class="tv-c-top">
          <b>${esc(it.lesson.subject)}</b>
          ${size!=='small' ? `<span class="tv-c-time">${hm(it.startMin)}~${hm(it.endMin)} <i>${dur}분</i></span>` : ''}
          ${size==='big' && sub ? `<span class="tv-c-sub">${esc(sub)}</span>` : ''}
        </div>
        <div class="tv-c-foot">
          <span class="tv-c-who">${esc(who)}</span>
          ${room?`<span class="tv-c-room">${esc(room)}</span>`:''}
        </div>
      </div>`;
    }).join('');
    return `<div class="tv-col" style="height:${H}px">${bg}${cards}</div>`;
  }).join('');

  let ticks = '';
  for(let m = Math.ceil(s0/30)*30; m <= e0; m += 30){
    ticks += `<div class="tv-tick" style="top:${(m-s0)*TV_PPM}px">${hm(m)}</div>`;
  }
  const kindLabel = kind==='grade'?'학년별':kind==='room'?'교실별':'선생님별';

  return `<div class="tv-sheet">
      <div class="tv-head">
        <div>
          <div class="tv-title">${esc(label)} 시간표</div>
          <div class="tv-meta">${esc(CUR.title||'')} · ${kindLabel} · 주 ${mine.length}시간 · ${hm(s0)}~${hm(e0)}</div>
        </div>
        ${opt&&opt.noZoom ? '' : `<div class="tv-zoom">
          <span>세로 크기</span>
          ${TV_ZOOMS.map((z,i)=>`<button class="tv-zb ${Math.abs(z-tvZoom)<0.01?'on':''}"
            onclick="setTvZoom(${z})">${TV_ZOOM_NAMES[i]}</button>`).join('')}
        </div>`}
      </div>
      <div class="tv-board" style="--tvf:${f}">
        <div class="tv-hd"><div class="tv-hd-t"></div>${DAYS.map(d=>`<div class="tv-hd-d">${d}</div>`).join('')}</div>
        <div class="tv-grid" style="height:${H}px">
          <div class="tv-times" style="height:${H}px">${ticks}</div>
          ${cols}
        </div>
      </div>
    </div>`;
}

function renderView(){
  const box = $I('vw-content'); if(!box) return;
  const bar = $I('vw-bar');

  if(!CUR){
    if(bar) bar.style.display='none';
    box.innerHTML = `<div class="empty"><div class="ico">🗓</div>
      <div class="t1">아직 게시된 시간표가 없습니다</div>
      <div>관리자가 시간표를 게시하면 여기에 나옵니다.</div></div>`;
    return;
  }
  if(bar) bar.style.display='flex';

  const all = collect();
  if(!all.length){
    box.innerHTML = `<div class="empty"><div class="ico">🧩</div>
      <div class="t1">이 시간표에는 배치된 수업이 없습니다</div></div>`;
    return;
  }

  const targets = targetsOf(all);
  const sel = $I('vw-target');
  if(sel){
    if(!targets.some(t=>t.id===vwTarget)) vwTarget = targets.length ? targets[0].id : '';
    sel.innerHTML = targets.map(t=>`<option value="${esc(t.id)}" ${t.id===vwTarget?'selected':''}>${esc(t.label)}</option>`).join('');
    sel.style.display = (vwKind==='mine') ? 'none' : '';
  }

  const label = (targets.find(t=>t.id===vwTarget)||{}).label || '';
  const html = sheetHTML(vwKind, vwTarget, label);
  box.innerHTML = html || `<div class="empty"><div class="ico">🔍</div>
      <div class="t1">${esc(label)} 에 배치된 수업이 없습니다</div>
      <div>${vwKind==='mine'?'아직 수업이 배정되지 않았습니다.':'다른 대상을 골라보세요.'}</div></div>`;
}

/* ═══ 게시 ═══ */
const canPublish = () => !!CU && (CU.role==='super' || CU.role==='org_admin');

/* ═══ 🔗 공유 링크 — 로그인 없이 보는 공개 페이지 ═══
   sharedTimetables/{긴 무작위 ID} 한 문서에 게시 내용을 복사해 둔다.
   새로 게시하거나 내리면 이 문서도 자동으로 갱신되어, 링크는 그대로 두고
   내용만 최신이 된다. (수행성 경비 공유 시트와 같은 보안 모델: get만 공개) */
let SHARE = null;

async function loadShare(){
  if(!canPublish()){ SHARE = null; return; }
  try {
    const snap = await getDocs(collection(db,'sharedTimetables'));
    SHARE = snap.docs.length ? { id: snap.docs[0].id, ...snap.docs[0].data() } : null;
  } catch(e){ SHARE = null; }
}

function shareURL(){
  if(!SHARE) return '';
  const base = location.href.replace(/[^/]*$/, '');
  return base + 'share-timetable.html?id=' + SHARE.id;
}

/* 게시 내용 → 공유 문서로 복사 (게시/내리기 때마다 호출) */
async function syncShare(){
  if(!SHARE) return;
  try {
    const now = PUBS.find(p=>p.active);
    if(now){
      await setDoc(doc(db,'sharedTimetables', SHARE.id), {
        active: true,
        title: now.title || '완성 시간표',
        snapshot: now.snapshot || {},
        publishedByName: now.publishedByName || '',
        publishedAt: now.publishedAt || Timestamp.now(),
        updatedAt: Timestamp.now(),
      });
    } else {
      await setDoc(doc(db,'sharedTimetables', SHARE.id), {
        active: false, snapshot: null, updatedAt: Timestamp.now(),
      }, { merge:true });
    }
  } catch(e){ /* 공유 갱신 실패해도 게시 자체는 유효 */ }
}

window.shareOn = async function(){
  if(!canPublish()) return;
  const id = 'st_' + Array.from(crypto.getRandomValues(new Uint8Array(12)),
    b=>'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  SHARE = { id };
  try {
    await syncShare();
    await loadShare();
    renderShareBox();
    toast('공유 링크를 만들었습니다 ✓ — 링크를 복사해 전달하세요','ok');
  } catch(e){ SHARE=null; toast('공유 만들기 실패: '+(e.message||''),'err'); }
};

window.shareOff = async function(){
  if(!SHARE) return;
  if(!confirm('공유를 끌까요?\n\n기존 링크는 더 이상 열리지 않습니다.\n다시 켜면 새 링크가 만들어져요.')) return;
  try {
    await deleteDoc(doc(db,'sharedTimetables', SHARE.id));
    SHARE = null;
    renderShareBox();
    toast('공유를 껐습니다 — 링크가 닫혔어요','ok');
  } catch(e){ toast('실패: '+(e.message||''),'err'); }
};

window.copyShareURL = function(){
  const url = shareURL(); if(!url) return;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(()=>toast('링크를 복사했습니다 ✓','ok'))
    .catch(()=>{ prompt('아래 링크를 복사하세요', url); });
};

function renderShareBox(){
  const box = $I('pub-share'); if(!box) return;

    box.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;
        border:1.5px dashed var(--ivd,#E3E1DA);border-radius:11px;margin-bottom:12px">

        <button class="btn btn-sm btn-p" style="margin-left:auto" onclick="shareOn()">🔗 공유 링크 만들기</button>
      </div>`;

  box.innerHTML = `
    <div style="padding:11px 14px;border:1.5px solid var(--gl,#C3E0D4);background:var(--gp,#E8F3EF);
      border-radius:11px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <span style="font-size:12.5px;font-weight:800;color:var(--gm,#00704A)">🔗 공유 켜짐</span>
        <input readonly value="${esc(shareURL())}" onclick="this.select()"

        <button class="btn btn-sm" onclick="copyShareURL()">📋 복사</button>
        <a class="btn btn-sm" href="${esc(shareURL())}" target="_blank" style="text-decoration:none">↗ 열기</a>
        <button class="btn btn-sm" style="color:var(--danger,#C0392B)" onclick="shareOff()">끄기</button>

        · 링크를 아는 사람은 <b>로그인 없이</b> 볼 수 있어요 · 새로 게시하면 링크 내용도 <b>자동으로 최신</b>이 됩니다 · 내리면 링크에는 "게시된 시간표가 없습니다"로 보여요</div>
    </div>`;

async function loadPublished(){
  try {
    const snap = await getDocs(collection(db,'timetablePublished'));
    PUBS = snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.publishedAt?.seconds||0)-(a.publishedAt?.seconds||0));
  } catch(e){ PUBS = []; }
}

/* 지금 쓰는 시간표 하나만 먼저 받는다.
   게시본 하나가 시간표 전체를 통째로 담고 있어서, 여러 개를 한꺼번에 받으면
   화면이 뜨기까지 한참 걸린다. 먼저 보여줄 것 하나만 받아 띄우고,
   나머지 목록은 뒤에서 조용히 채운다. */
async function loadActivePublished(){
  try {
    const snap = await getDocs(query(collection(db,'timetablePublished'), where('active','==',true)));
    PUBS = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  } catch(e){ PUBS = []; }
}

/* 화면을 띄운 뒤, 지난 게시본·저장 배정·공유 상태를 뒤에서 채운다 */
let _restLoaded = false;
async function loadRest(){
  if(_restLoaded) return;
  _restLoaded = true;
  const keepId = CUR?.id || '';
  try {
    await loadPublished();
    if(canPublish()){
      // 게시할 때 쓰는 자료는 게시 권한자만 받는다 (선생님에겐 필요 없다)
      try {
        const st = await getDocs(collection(db,'staff'));
        TEACHERS_CACHE = st.docs.map((d,i)=>{
          const s=d.data();
          return { uid:d.id, name:s.name||'', org:s.org||'', orgs:s.orgs||[],
            color:teacherColorAt(i) };
        });
        const fr = await getDoc(doc(db,'timetables','main'));
        FRAMES_CACHE = (fr.exists() && fr.data().list) ? fr.data().list : [];
      } catch(e){}
      await loadSets();
      await loadShare();
    }
    // 같은 게시본을 계속 보고 있게 다시 이어 준다
    CUR = PUBS.find(p=>p.id===keepId) || PUBS.find(p=>p.active) || pubsForView()[0] || null;
    renderPubPanel();
    renderPubSelect();
    if(!keepId) renderView();   // 처음에 띄울 게 없었다면 이제 그린다
  } catch(e){ /* 뒤에서 채우는 일이라 조용히 넘어간다 */ }
}
async function loadSets(){
  try {
    const snap = await getDocs(collection(db,'timetableSets'));
    SETS = snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
  } catch(e){ SETS = []; }
}

function renderPubPanel(){
  const panel = $I('pub-panel');
  if(!canPublish()){ if(panel) panel.style.display='none'; return; }
  if(panel) panel.style.display='';
  renderShareBox();
  renderPubList();

  const now = PUBS.find(p=>p.active);
  const box = $I('pub-now');
  if(box){
    box.innerHTML = now ? `
      <div class="pb-now"><div class="pb-row">
        <span class="pb-ico">✅</span>
        <div style="min-width:0">
          <div class="pb-t">${esc(now.title)}</div>
          <div class="pb-m">${esc(now.publishedByName||'')} 게시 · ${fmtDT(now.publishedAt)} · 수업 ${now.counts?.placed||0}칸</div>
        </div>
        <span class="pb-act"><button class="btn btn-sm" onclick="unpublish('${now.id}')">내리기</button></span>
      </div></div>`
      : `<div class="empty" style="padding:22px 10px">
        <div class="t1">지금 게시된 시간표가 없습니다</div>
        <div>아래에서 배정을 골라 게시하면 모든 선생님이 볼 수 있습니다.</div></div>`;
  }

  const sel = $I('pub-set');
  if(sel){
    sel.innerHTML = SETS.length
      ? SETS.map(s=>`<option value="${s.id}">${esc(s.name)}${s.updatedAt?` · ${fmtDT(s.updatedAt)}`:''}</option>`).join('')
      : '<option value="">저장된 배정이 없습니다</option>';
  }
  const hint = $I('pub-hint');
  if(hint){
    const old = PUBS.filter(p=>!p.active).length;
    hint.innerHTML = SETS.length
      ? `시간표 배정 화면의 <b>저장·불러오기</b>에 담아둔 것 중에서 고릅니다.` +
        (old ? ` 지난 게시본 ${old}개는 아래 <b>게시 기록</b>에서 정리할 수 있어요.` : '')
      : `먼저 <b>시간표 배정</b>에서 작업을 저장해 주세요.`;
  }
}

window.doPublish = async function(){
  if(!canPublish()){ toast('게시 권한이 없습니다.','err'); return; }
  const setId = $I('pub-set')?.value;
  const s = SETS.find(x=>x.id===setId);
  if(!s){ toast('게시할 배정을 골라 주세요.','err'); return; }

  const title = prompt('게시할 이름을 적어 주세요.', s.name || '시간표');
  if(title===null) return;
  if(!title.trim()){ toast('이름을 적어 주세요.','err'); return; }

  const snap = s.snapshot || {};
  const place2 = snap.place2 || {};
  const frameId = Object.keys(place2)[0] || '';
  let placed = 0;
  Object.values(place2).forEach(byGrade=>Object.values(byGrade||{}).forEach(byDay=>
    Object.values(byDay||{}).forEach(list=>{ placed += (list||[]).length; })));

  try {
    // 지금 게시된 것을 내린다 (한 번에 하나만 앞에 세운다)
    for(const p of PUBS.filter(x=>x.active)){
      await updateDoc(doc(db,'timetablePublished',p.id), { active:false });
    }
    await addDoc(collection(db,'timetablePublished'), {
      title: title.trim(),
      org: CU.org || '',
      active: true,
      publishedAt: Timestamp.now(),
      publishedByUid: CU.uid,
      publishedByName: CU.name || '',
      counts: { placed, lessons:(snap.lessons||[]).length },
      snapshot: {
        frameId,
        frames: FRAMES_CACHE,
        floors: snap.floors || [],
        lessons: snap.lessons || [],
        place2,
        gradeDept: snap.gradeDept || {},
        teachers: TEACHERS_CACHE,
      }
    });
    await loadPublished();
    CUR = PUBS.find(p=>p.active) || pubsForView()[0] || null;
    await syncShare();   // 공유 링크가 켜져 있으면 그 문서도 최신으로
    renderPubPanel(); renderPubSelect(); renderView();
    toast('게시했습니다 ✓');
  } catch(e){ toast('게시 실패: '+(e.message||''),'err'); }
};

window.unpublish = async function(id){
  if(!confirm('게시를 내릴까요?\n\n선생님들이 볼 수 없게 됩니다. 기록은 남아 있어 다시 올릴 수 있어요.')) return;
  try {
    await updateDoc(doc(db,'timetablePublished',id), { active:false });
    await loadPublished();
    CUR = PUBS.find(p=>p.active) || pubsForView()[0] || null;
    await syncShare();   // 공유 링크에는 "게시 없음"으로 반영
    renderPubPanel(); renderPubSelect(); renderView();
    toast('내렸습니다');
  } catch(e){ toast('실패: '+(e.message||''),'err'); }
};

function renderPubSelect(){
  const sel = $I('vw-pub'); if(!sel) return;
  // 보관한 것은 목록에서 뺀다. 다만 관리자가 기록에서 '보기'로 띄워 둔 것은 남긴다.
  let list = pubsForView();
  if(CUR && !list.some(p=>p.id===CUR.id)) list = [CUR, ...list];
  sel.innerHTML = list.length
    ? list.map(p=>`<option value="${p.id}" ${CUR&&p.id===CUR.id?'selected':''}>${
        esc(p.title)}${p.active?' (지금)':(p.archived?' (보관)':'')} · ${fmtDT(p.publishedAt)}</option>`).join('')
    : '<option value="">게시된 시간표 없음</option>';
  const d = $I('vw-desc');
  if(d){
    d.innerHTML = CUR
      ? `<b>${esc(CUR.title)}</b> · ${esc(CUR.publishedByName||'')} 게시 · ${fmtDT(CUR.publishedAt)}` +
        (CUR.active ? ' <span style="color:var(--gm,#00704A);font-weight:700">· 지금 쓰는 시간표</span>'
         : CUR.archived ? ' <span style="color:var(--tl,#93A09A)">· 보관된 시간표</span>'
                        : ' <span style="color:var(--tl,#93A09A)">· 지난 시간표</span>')
      : '게시된 시간표가 아직 없습니다.';
  }
}
/* ═══ 📚 게시 기록 관리 — 보관·삭제·다시 게시 ═══
   보관(archived)해 두면 선생님 목록에서 감춰지고, 관리자만 기록에서 볼 수 있다.
   중간에 고쳐 다시 게시하다 보면 같은 이름이 쌓이므로 정리할 수 있게 한다. */

/* 선생님에게 보여줄 게시본 — 보관한 것은 뺀다 */
function pubsForView(){ return PUBS.filter(p=>!p.archived); }

let plOpen = false;
window.togglePubList = function(){ plOpen = !plOpen; renderPubList(); };

function renderPubList(){
  const box = $I('pub-list'); if(!box) return;
  if(!canPublish()){ box.innerHTML=''; return; }
  if(!PUBS.length){ box.innerHTML=''; return; }

  const arc = PUBS.filter(p=>p.archived).length;
  const head = `
    <div class="pl-head">
      <span class="pl-t">📚 게시 기록 ${PUBS.length}개${arc?` <span style="color:var(--tl,#93A09A);font-weight:600">(보관 ${arc})</span>`:''}</span>
      <button class="pl-toggle" onclick="togglePubList()">${plOpen?'접기 ▲':'관리 ▼'}</button>
    </div>`;

  if(!plOpen){ box.innerHTML = head; return; }

  const rows = PUBS.map(p=>{
    const cls = p.active ? 'cur' : (p.archived ? 'arc' : '');
    return `<div class="pl-row ${cls}">
      <span class="pl-ic">${p.active?'✅':(p.archived?'📦':'🗂')}</span>
      <div class="pl-main">
        <div class="pl-nm">${esc(p.title||'(이름 없음)')}</div>
        <div class="pl-mt">${esc(p.publishedByName||'')} 게시 · ${fmtDT(p.publishedAt)} · 수업 ${p.counts?.placed||0}칸</div>
      </div>
      ${p.active?'<span class="pl-badge now">지금</span>':''}
      ${p.archived?'<span class="pl-badge arc">보관됨</span>':''}
      <span class="pl-act">
        <button class="pl-b" onclick="viewPub('${p.id}')">👁 보기</button>
        ${p.active?'' : `<button class="pl-b" onclick="republish('${p.id}')">📌 이걸로 게시</button>`}
        ${p.active?'' : (p.archived
            ? `<button class="pl-b" onclick="setPubArchived('${p.id}',false)">↩ 되돌리기</button>`
            : `<button class="pl-b" onclick="setPubArchived('${p.id}',true)">📦 보관</button>`)}
        <button class="pl-b dg" onclick="deletePub('${p.id}')">🗑 삭제</button>
      </span>
    </div>`;
  }).join('');

  box.innerHTML = head + `<div class="pl-list">${rows}</div>
    <div class="pb-hint">
      · <b>보관</b>하면 선생님 목록에서 감춰집니다 — 기록은 남아 있어 언제든 되돌릴 수 있어요.<br>
      · <b>이걸로 게시</b>를 누르면 그 시간표가 지금 쓰는 시간표가 되고, 공유 링크도 함께 바뀝니다.<br>
      · <b>삭제</b>는 되돌릴 수 없습니다. 지난 기록을 남겨두려면 보관을 쓰세요.</div>`;
}

/* 기록에서 하나를 골라 아래 화면에 띄운다 (보관한 것도 관리자는 볼 수 있다) */
window.viewPub = function(id){
  const p = PUBS.find(x=>x.id===id); if(!p) return;
  CUR = p; vwTarget = '';
  renderPubSelect(); renderView();
  $I('vw-pub')?.scrollIntoView({ behavior:'smooth', block:'center' });
  toast(`"${p.title||''}"을(를) 띄웠습니다`,'ok');
};

/* 지난 게시본을 다시 지금 쓰는 시간표로 */
window.republish = async function(id){
  if(!canPublish()){ toast('게시 권한이 없습니다.','err'); return; }
  const p = PUBS.find(x=>x.id===id); if(!p) return;
  if(!confirm(`"${p.title||''}"을(를) 지금 쓰는 시간표로 할까요?\n\n지금 게시된 것은 자동으로 내려갑니다.`)) return;
  try {
    for(const x of PUBS.filter(v=>v.active && v.id!==id)){
      await updateDoc(doc(db,'timetablePublished',x.id), { active:false });
    }
    await updateDoc(doc(db,'timetablePublished',id), { active:true, archived:false });
    await loadPublished();
    CUR = PUBS.find(x=>x.active) || PUBS[0] || null;
    await syncShare();
    renderPubPanel(); renderPubSelect(); renderView();
    toast('이 시간표로 게시했습니다 ✓','ok');
  } catch(e){ toast('실패: '+(e.message||''),'err'); }
};

/* 보관 / 보관 해제 */
window.setPubArchived = async function(id, on){
  if(!canPublish()){ toast('권한이 없습니다.','err'); return; }
  const p = PUBS.find(x=>x.id===id); if(!p) return;
  if(on && p.active){ toast('지금 게시된 시간표는 먼저 내려주세요.','err'); return; }
  try {
    await updateDoc(doc(db,'timetablePublished',id), { archived: !!on });
    await loadPublished();
    if(CUR && CUR.id===id) CUR = PUBS.find(x=>x.active) || pubsForView()[0] || PUBS[0] || null;
    renderPubPanel(); renderPubSelect(); renderView();
    toast(on ? '보관했습니다 — 선생님 목록에서 감춰집니다 ✓'
             : '보관을 풀었습니다 — 다시 보입니다 ✓','ok');
  } catch(e){ toast('실패: '+(e.message||''),'err'); }
};

/* 기록에서 지우기 */
window.deletePub = async function(id){
  if(!canPublish()){ toast('권한이 없습니다.','err'); return; }
  const p = PUBS.find(x=>x.id===id); if(!p) return;
  const wasActive = !!p.active;
  if(!confirm(`"${p.title||''}" 게시 기록을 지울까요?\n${fmtDT(p.publishedAt)} · 수업 ${p.counts?.placed||0}칸\n\n` +
    (wasActive ? '⚠️ 지금 게시된 시간표입니다. 지우면 선생님들이 볼 수 없게 됩니다.\n\n' : '') +
    '되돌릴 수 없습니다.')) return;
  try {
    await deleteDoc(doc(db,'timetablePublished',id));
    await loadPublished();
    CUR = PUBS.find(x=>x.active) || pubsForView()[0] || PUBS[0] || null;
    if(wasActive) await syncShare();
    renderPubPanel(); renderPubSelect(); renderView();
    toast('지웠습니다','ok');
  } catch(e){ toast('삭제 실패: '+(e.message||''),'err'); }
};

window.onPickPublished = function(){
  const id = $I('vw-pub')?.value;
  CUR = PUBS.find(p=>p.id===id) || null;
  vwTarget = '';
  renderPubSelect(); renderView();
};

/* ═══ 인쇄 — 고른 것만, 한 장에 하나씩 ═══ */
let prKind = 'grade';
let prPicked = new Set();

window.openPrint = function(){
  if(!CUR){ toast('게시된 시간표가 없습니다.','err'); return; }
  prKind = (vwKind==='mine') ? 'teacher' : vwKind;
  prPicked = new Set();
  if(vwKind==='mine') prPicked.add(CU.uid);
  else if(vwTarget) prPicked.add(vwTarget);

  const mv=document.createElement('div'); mv.className='pr-ov'; mv.id='pr-mod';
  mv.innerHTML = `<div class="pr-bk" onclick="closePrint()"></div>
    <div class="pr-box">
      <div class="pr-t">🖨 인쇄 · 이미지 · PDF</div>
      <div class="pr-d">고른 시간표만 <b>한 장에 하나씩</b> 나옵니다. 여러 개를 한 번에 뽑을 수 있어요.<br>
        <span style="color:var(--tl,#93A09A)">🖼 이미지는 <b>A4 세로 비율·고해상도</b>로 저장돼 바로 출력할 수 있고, 📄 PDF는 고른 것이 <b>한 장씩 페이지</b>로 담깁니다.</span></div>
      <div class="pr-kinds">
        <button class="pr-k" data-k="grade" onclick="setPrKind('grade')">🎓 학년별</button>
        <button class="pr-k" data-k="teacher" onclick="setPrKind('teacher')">🧑‍🏫 선생님별</button>
        <button class="pr-k" data-k="room" onclick="setPrKind('room')">🏫 교실별</button>
      </div>
      <label class="pr-all"><input type="checkbox" id="pr-all" onchange="toggleAllPrint(this.checked)"> 모두 고르기</label>
      <div class="pr-list" id="pr-list"></div>
      <div class="pr-act">
        <span class="pr-n" id="pr-n"></span>
        <button class="btn" onclick="closePrint()">취소</button>
        <button class="btn" onclick="doExport('img')">🖼 이미지 저장</button>
        <button class="btn" onclick="doExport('pdf')">📄 PDF 저장</button>
        <button class="btn btn-p" onclick="doPrint()">🖨 인쇄</button>
      </div>
    </div>`;
  document.body.appendChild(mv);
  setPrKind(prKind);
};
window.closePrint = function(){ document.getElementById('pr-mod')?.remove(); };

window.setPrKind = function(k){
  prKind = k;
  document.querySelectorAll('.pr-k').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  const all = collect();
  const saveK = vwKind; vwKind = k;
  const targets = targetsOf(all);
  vwKind = saveK;
  // 이 분류에 없는 선택은 걷어낸다 — 개수 표시가 정확해지게
  const validIds = new Set(targets.map(t=>t.id));
  prPicked.forEach(id=>{ if(!validIds.has(id)) prPicked.delete(id); });
  const box = $I('pr-list'); if(!box) return;
  box.innerHTML = targets.map(t=>{
    const n = all.filter(it=>matchOf(it, k, t.id)).length;
    return `<label class="pr-row ${prPicked.has(t.id)?'on':''}">
      <input type="checkbox" value="${esc(t.id)}" ${prPicked.has(t.id)?'checked':''}
        onchange="togglePrint(this)">
      <b>${esc(t.label)}</b><span class="pr-cnt">${n}시간</span></label>`;
  }).join('') || '<div class="pr-d" style="text-align:center">대상이 없습니다</div>';
  updatePrCount();
};
window.togglePrint = function(cb){
  if(cb.checked) prPicked.add(cb.value); else prPicked.delete(cb.value);
  cb.closest('.pr-row').classList.toggle('on', cb.checked);
  updatePrCount();
};
window.toggleAllPrint = function(on){
  document.querySelectorAll('#pr-list input').forEach(cb=>{
    cb.checked = on; togglePrint(cb);
  });
};
function updatePrCount(){
  const el = $I('pr-n'); if(!el) return;
  el.textContent = prPicked.size ? `${prPicked.size}장 나옵니다` : '고른 것이 없습니다';
}

/* 고른 시간표들을 한 장씩 HTML로 만든다 (인쇄 · 이미지 · PDF 공용)
   반환: [{ id, label, html }] */
function buildExportPages(){
  const all = collect();
  const saveK = vwKind; vwKind = prKind;
  const targets = targetsOf(all);
  vwKind = saveK;

  /* A4 세로 한 장에 담는다.
     종이 높이에서 머리말을 뺀 만큼을 하루 길이로 나눠 배율을 정한다.
     (A4 세로 297mm − 여백 20mm ≈ 1047px, 머리말·머리글 자리 ≈ 120px) */
  return targets.filter(t=>prPicked.has(t.id)).map(t=>{
    const mine = all.filter(it=>matchOf(it, prKind, t.id));
    if(!mine.length) return null;
    let s0 = Math.min(...mine.map(x=>x.startMin));
    let e0 = Math.max(...mine.map(x=>x.endMin));
    if(prKind==='grade'){
      DAYS.forEach(dy=>{ const b = dayBlocksOf(t.id, dy);
        if(b.blocks?.length){ s0=Math.min(s0,b.startMin); e0=Math.max(e0,b.endMin); } });
    }
    const span = Math.max(60, e0 - s0);
    const ppm = Math.max(0.9, Math.min(2.4, 920 / span));   // 한 장을 넘지 않게
    const html = sheetHTML(prKind, t.id, t.label, { ppm, noZoom:true });
    return html ? { id:t.id, label:t.label, html } : null;
  }).filter(Boolean);
}

window.doPrint = function(){
  if(!prPicked.size){ toast('인쇄할 것을 골라 주세요.','err'); return; }
  const pageList = buildExportPages();
  if(!pageList.length){ toast('내보낼 내용이 없습니다.','err'); return; }
  const pages = pageList.map(p=>`<div class="pr-page">${p.html}</div>`).join('');
  $I('printArea').innerHTML = pages;
  closePrint();
  document.body.classList.add('printing');
  const done = ()=>{
    document.body.classList.remove('printing');
    $I('printArea').innerHTML = '';
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  setTimeout(()=>window.print(), 120);
};

/* ═══ 🖼 이미지 · 📄 PDF 내보내기 ═══
   A4 세로 비율(210:297)로 고정해 고해상도로 그린다.
   화면 794×1123px 상자를 2.5배로 떠서 약 2010×2810px (240dpi급) 결과물을 만든다.
   PDF는 그 이미지를 A4 페이지에 한 장씩 담는다. */
const EXP_W = 794, EXP_H = 1123, EXP_SCALE = 2.5;

/* 라이브러리를 필요할 때만 불러온다 */
function loadScriptOnce(src, testFn){
  return new Promise((res, rej)=>{
    if(testFn()) return res();
    const cur = document.querySelector(`script[src="${src}"]`);
    if(cur){ // 이미 붙는 중이면 기다린다
      const t = setInterval(()=>{ if(testFn()){ clearInterval(t); res(); } }, 120);
      setTimeout(()=>{ clearInterval(t); testFn()?res():rej(new Error('불러오기 시간 초과')); }, 12000);
      return;
    }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=> testFn() ? res() : rej(new Error('모듈이 준비되지 않았습니다'));
    s.onerror = ()=> rej(new Error('인터넷 연결을 확인해 주세요'));
    document.head.appendChild(s);
  });
}
const needH2C = ()=> loadScriptOnce(
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  ()=>!!window.html2canvas);
const needPDF = ()=> loadScriptOnce(
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  ()=>!!(window.jspdf && window.jspdf.jsPDF));

/* 한 장을 A4 세로 상자에 그려 캔버스로 뜬다 */
async function renderPageCanvas(page){
  // 화면 밖에 실제 크기로 붙여야 html2canvas가 제대로 뜬다 (display:none이면 안 됨)
  const holder = document.createElement('div');
  holder.style.cssText = `position:fixed;left:-12000px;top:0;width:${EXP_W}px;height:${EXP_H}px;`
    + 'background:#ffffff;z-index:-1;overflow:hidden;padding:26px 24px;box-sizing:border-box;'
    + 'display:flex;flex-direction:column;';
  holder.innerHTML = page.html;
  // 내보내기용 다듬기 — 시트 테두리·그림자 제거, 확대 버튼 숨김
  holder.querySelectorAll('.tv-zoom').forEach(el=>el.remove());
  const sheet = holder.querySelector('.tv-sheet');
  if(sheet){ sheet.style.border='none'; sheet.style.boxShadow='none'; sheet.style.padding='0';
    sheet.style.overflow='visible'; sheet.style.background='#ffffff'; }
  const board = holder.querySelector('.tv-board');
  if(board){ board.style.minWidth='0'; board.style.width='100%'; }
  document.body.appendChild(holder);
  try {
    await new Promise(r=>setTimeout(r, 60));   // 글꼴·배치 정리 시간
    const canvas = await window.html2canvas(holder, {
      scale: EXP_SCALE, backgroundColor:'#ffffff', useCORS:true, logging:false,
      width: EXP_W, height: EXP_H, windowWidth: EXP_W
    });
    return canvas;
  } finally { holder.remove(); }
}

function fileSafe(s){ return String(s||'').replace(/[\\/:*?"<>|]/g,'').trim() || '시간표'; }

function downloadURL(url, filename){
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

window.doExport = async function(mode){
  if(!prPicked.size){ toast('내보낼 것을 골라 주세요.','err'); return; }
  const pages = buildExportPages();
  if(!pages.length){ toast('내보낼 내용이 없습니다.','err'); return; }

  const cap = mode==='pdf' ? 'PDF를 만드는 중…' : '이미지를 만드는 중…';
  window.showLoading ? window.showLoading(cap) : toast(cap);
  try {
    await needH2C();
    if(mode==='pdf') await needPDF();

    const baseName = fileSafe(CUR?.title || CUR?.name || '완성 시간표');
    let pdf = null;
    if(mode==='pdf'){
      pdf = new window.jspdf.jsPDF({ orientation:'p', unit:'mm', format:'a4', compress:true });
    }

    for(let i=0;i<pages.length;i++){
      window.setLoadStep && window.setLoadStep(
        `${pages[i].label} (${i+1}/${pages.length})`, Math.round((i)/pages.length*100));
      const canvas = await renderPageCanvas(pages[i]);
      if(mode==='pdf'){
        if(i>0) pdf.addPage('a4','p');
        // 캔버스가 A4 비율 그대로라 종이에 꽉 채워도 눌리지 않는다
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, 210, 297);
      } else {
        downloadURL(canvas.toDataURL('image/png'), `${baseName}_${fileSafe(pages[i].label)}.png`);
        if(pages.length>1) await new Promise(r=>setTimeout(r, 420));  // 연속 다운로드 간격
      }
    }

    if(mode==='pdf') pdf.save(`${baseName}.pdf`);
    window.setLoadStep && window.setLoadStep('마무리', 100);
    setTimeout(()=>{ window.hideLoading && window.hideLoading(); }, 250);
    closePrint();
    toast(mode==='pdf'
      ? `PDF ${pages.length}쪽을 저장했습니다 ✓ — 열어서 그대로 인쇄하면 A4에 딱 맞아요`
      : `이미지 ${pages.length}장을 저장했습니다 ✓ — A4 세로 비율이라 그대로 출력하면 돼요`,'ok');
  } catch(e){
    window.hideLoading && window.hideLoading();
    toast('저장 실패: '+(e.message||''),'err');
  }
};


/* ═══════════════════════════════════════════
   🔎 수업 카드 자세히 보기
   카드를 누르면 그 수업이 한 주에 몇 시간·몇 분 들어가는지,
   어느 요일 어느 시각에 놓였는지, 누가 들어가고 어느 교실인지 보여준다.
   보는 동안 같은 수업 카드들이 함께 반짝여 한눈에 찾을 수 있다.
   ═══════════════════════════════════════════ */

/* 같은 수업 카드에 반짝임을 켜고 끈다 */
function tvGlow(lessonId){
  document.querySelectorAll('.tv-card.tv-glow').forEach(el=>el.classList.remove('tv-glow'));
  if(!lessonId) return;
  document.querySelectorAll(`.tv-card[data-lesson="${CSS.escape(lessonId)}"]`)
    .forEach(el=>el.classList.add('tv-glow'));
}
window.tvGlow = tvGlow;

window.closeTvInfo = function(){
  document.getElementById('tvi-mod')?.remove();
  tvGlow(null);
};

window.openTvInfo = function(lessonId, day, startMin){
  if(!lessonId) return;
  const all = (typeof collect === 'function') ? collect() : [];
  const same = all.filter(it => (it.lesson && it.lesson.id) === lessonId);
  const hit  = same.find(it => it.day===day && String(it.startMin)===String(startMin)) || same[0];
  if(!hit) return;

  const les = hit.lesson || {};
  // 같은 수업이 여러 학년에 함께 들어가면 한 번만 세도록 요일·시각으로 묶는다
  const slotKey = it => `${it.day}|${it.startMin}|${it.endMin}`;
  const slots = [];
  const seen = new Set();
  same.forEach(it=>{
    const k = slotKey(it);
    if(seen.has(k)) return;
    seen.add(k);
    slots.push(it);
  });
  slots.sort((a,b)=> (DAYS.indexOf(a.day)-DAYS.indexOf(b.day)) || (a.startMin-b.startMin));

  const totalMin = slots.reduce((n,it)=>n + (it.endMin - it.startMin), 0);
  const hours = Math.floor(totalMin/60), mins = totalMin%60;

  // 이 수업이 들어가는 학년 모두
  const grades = [...new Set(same.flatMap(it=>it.grades && it.grades.length ? it.grades : [it.grade]))]
    .filter(Boolean);
  // 담당 선생님 (대표 먼저)
  const uids = hit.teacherUids || les.teacherUids || [];
  const names = uids.map(u=>tName(u)).filter(Boolean);
  const room = hit.roomId ? findRoomName(hit.roomId) : '';

  const rows = slots.map(it=>{
    const isThis = it.day===hit.day && it.startMin===hit.startMin;
    const r = it.roomId ? findRoomName(it.roomId) : '';
    return `<div class="tvi-row ${isThis?'on':''}">
      <span class="tvi-day">${esc(it.day)}</span>
      <span class="tvi-time">${hm(it.startMin)}~${hm(it.endMin)}</span>
      <span class="tvi-dur">${it.endMin-it.startMin}분</span>
      ${r?`<span class="tvi-room">${esc(r)}</span>`:''}
    </div>`;
  }).join('');

  closeTvInfo();
  const ov = document.createElement('div');
  ov.id = 'tvi-mod';
  ov.className = 'tvi-ov';
  ov.innerHTML = `
    <div class="tvi-bk" onclick="closeTvInfo()"></div>
    <div class="tvi-box" style="--lc:${lessonColor(les)};--lc-bg:${tintOf(lessonColor(les),.16)}">
      <button class="tvi-x" onclick="closeTvInfo()" aria-label="닫기">✕</button>
      <div class="tvi-head">
        <span class="tvi-bar"></span>
        <div style="min-width:0">
          <div class="tvi-nm">${esc(les.subject||'수업')}</div>
          <div class="tvi-sub">${esc(grades.join(' · ')||'')}</div>
        </div>
      </div>

      <div class="tvi-stats">
        <div class="tvi-stat"><b>${slots.length}</b><span>주당 시수</span></div>
        <div class="tvi-stat"><b>${hours?`${hours}시간 `:''}${mins?`${mins}분`:(hours?'':'0분')}</b><span>주당 시간</span></div>
        <div class="tvi-stat"><b>${hit.endMin-hit.startMin}분</b><span>1회 길이</span></div>
      </div>

      <div class="tvi-lines">
        <div class="tvi-line"><span class="tvi-k">👤 담당</span>
          <span class="tvi-v">${names.length?esc(names.join(', ')):'<span style="opacity:.6">미배정</span>'}</span></div>
        ${room?`<div class="tvi-line"><span class="tvi-k">🚪 교실</span><span class="tvi-v">${esc(room)}</span></div>`:''}
        <div class="tvi-line"><span class="tvi-k">🕐 지금 칸</span>
          <span class="tvi-v">${esc(hit.day)} ${hm(hit.startMin)}~${hm(hit.endMin)}</span></div>
      </div>

      <div class="tvi-listt">📅 이 수업이 놓인 자리</div>
      <div class="tvi-list">${rows}</div>
      <div class="tvi-note">같은 수업 ${slots.length}칸이 시간표에서 함께 <b>반짝이고</b> 있어요.</div>
    </div>`;
  document.body.appendChild(ov);
  tvGlow(lessonId);
};

/* 자세히 보기가 열려 있을 때 Esc 로 닫기 */
document.addEventListener('keydown', e=>{

/* ═══ 시작 ═══ */
let FRAMES_CACHE = [], TEACHERS_CACHE = [];
/* 선생님 색 — 색상환을 60도씩 벌린 여섯 색을 쓰고,
   사람이 늘면 밝기를 바꿔 다음 바퀴를 돈다.
   이렇게 하면 이웃한 사람끼리 비슷한 색이 되지 않는다.
   (12분까지는 확실히 나뉘고, 그 뒤로는 밝기로 갈린다) */
const T_HUES = [145, 265, 35, 205, 95, 325];
const T_TONES = [[58,34],[52,58],[78,24],[38,70]];
function teacherColorAt(i){
  const n = T_HUES.length;
  const cyc = Math.floor(i/n) % T_TONES.length;
  const [s,l] = T_TONES[cyc];
  return hslHex(T_HUES[i%n], s, l);
}
function hslHex(hh, s, l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(((hh/60)%2)-1)), m=l-c/2;
  let r,g,b;
  if(hh<60){r=c;g=x;b=0} else if(hh<120){r=x;g=c;b=0} else if(hh<180){r=0;g=c;b=x}
  else if(hh<240){r=0;g=x;b=c} else if(hh<300){r=x;g=0;b=c} else {r=c;g=0;b=x}
  const to=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+to(r)+to(g)+to(b);
}
